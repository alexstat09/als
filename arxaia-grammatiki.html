<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Γραμματική">

<title>Γραμματική · MÉTRON</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- ════════════════════════════════════════════════════════════════════
     ΓΡΑΜΜΑΤΙΚΗ — Αρχαία · άγνωστο (als-v725, 13/11/26).
     Το βιβλίο του Πυθαγόρα, ενότητα προς ενότητα, όπως το Λεξιλόγιο.
     ΑΙΣΘΗΤΙΚΗ: «Γραφίτης» + η δομή του demo4 — τη διάλεξε ο ίδιος μετά από
     έξι γύρους (σχεδόν-μαύρο ΟΧΙ, ύφος Ιστορίας ΟΧΙ, χρωματιστά φόντα ΟΧΙ).
     Αρσενικά μπλε, θηλυκά ροζ, η ΚΑΤΑΛΗΞΗ κεχριμπαρένια.
     ΛΟΓΙΚΗ: grammatiki-core.js (καθαρή, με tests). ΔΕΔΟΜΕΝΑ: data/grammatiki/
     (μία ενότητα = ένα αρχείο· η σελίδα ΚΑΙ οι κάρτες βγαίνουν από αυτό).
     ΠΡΟΟΔΟΣ: metron.grammatiki.v1, appKey 'grammatiki', `_ts` ανά εγγραφή
     μέσω study-stamp.js (σταθ. 31). Καμία διαγραφή → καμία ταφόπλακα.
     ════════════════════════════════════════════════════════════════════ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Commissioner:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="vendor/supabase.min.js"></script>
<script src="sync.js" defer></script>
<script src="study-stamp.js"></script>
<script src="grammatiki-core.js"></script>
<style>
:root{--h:262;--c:.010;
--bg:oklch(23.5% var(--c) var(--h));--s1:oklch(27% var(--c) var(--h));--s2:oklch(30.5% var(--c) var(--h));--s3:oklch(34.5% var(--c) var(--h));
--text:#F2ECE0;--soft:#D6CFC2;--muted:#B4AEA3;--faint:#9A9AA0;--line:rgba(237,230,216,.09);--line2:rgba(237,230,216,.15);
--amber:#E8B25C;--late:#E8836F;--m:#8FB4EC;--f:#E6A0B4;--n:#A9CFB4;
--gk:"GFS Didot","Noto Serif",serif;--ui:"Commissioner",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--text);font:15px/1.55 var(--ui);-webkit-font-smoothing:antialiased;padding-bottom:90px;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.gk{font-family:var(--gk)}b{font-weight:600;color:var(--text)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(18px,3.4vw,44px)}

/* ── μπάρα ── */
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--soft);font-size:14.5px;font-weight:500}
.back:hover{color:var(--text)}
.crumb{color:var(--muted);font-size:14px}.crumb span{color:var(--faint);margin:0 6px}
.warn{margin:6px 0 0;padding:12px 16px;border:1px solid rgba(232,131,111,.4);background:rgba(232,131,111,.08);border-radius:12px;color:var(--soft);font-size:14px}
.testday{color:var(--amber);font-size:13px;margin-left:10px}

/* ── κέλυφος: περιεχόμενα + κύριο ── */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:44px;align-items:start}
.toc{position:sticky;top:14px;max-height:calc(100dvh - 28px);overflow:auto;padding:6px 4px 20px 0}
.toc h4{font-size:12px;font-weight:600;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;margin:18px 0 6px}
.toc h4:first-child{margin-top:4px}
.toc>a,.toc>span{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:9px;font-size:14px;line-height:1.35}
.toc>a{color:var(--soft)}.toc>a:hover{background:var(--s1);color:var(--text)}
.toc>a.on{background:var(--s2);color:var(--text);font-weight:600}
.toc>span{color:var(--faint)}
.toc i{font-style:normal;color:var(--faint);font-size:12px;white-space:nowrap}
.toc a .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);align-self:center;flex:none}
.toc .home{color:var(--text);font-weight:600;margin-bottom:6px}

/* ── hero ── */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;padding:10px 0 6px}
h1{font-weight:700;font-size:56px;letter-spacing:-.025em;line-height:1.02}
.lead{color:var(--soft);font-size:17.5px;max-width:60ch;margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:16px;font-size:13.5px;color:var(--muted)}
.lg::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.lg.m::before{background:var(--m)}.lg.f::before{background:var(--f)}.lg.n::before{background:var(--n)}.lg.e::before{display:none}
.lg.e .gk{color:var(--amber);background:rgba(232,178,92,.13);padding:1px 6px;border-radius:5px;font-size:15px}
.side{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.mode{display:inline-flex;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:4px}
.mode button{font-weight:500;font-size:14px;color:var(--muted);padding:0 18px;min-height:40px;border-radius:9px}
.mode button[aria-pressed=true]{background:var(--amber);color:#1b1408;font-weight:700}
.go{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:12px;background:var(--amber);color:#1b1408;font-weight:700;font-size:15.5px;transition:transform .12s}
.go:active{transform:scale(.97)}
.ghost{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);color:var(--soft);font-weight:500;font-size:14.5px}
.ghost:hover{background:var(--s1);color:var(--text)}
.sub{color:var(--muted);font-size:13.5px}

section{margin-top:56px}
.sh{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;flex-wrap:wrap}
h2{font-weight:700;font-size:24px;letter-spacing:-.01em}.sh span{color:var(--faint);font-size:14px}

/* ── Βρες το υπόδειγμα ── */
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.key{display:flex;flex-direction:column;gap:10px;padding:15px 16px;background:var(--s1);border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden;transition:background .18s,border-color .18s}
.key::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}.key.m::before{background:var(--m)}.key.f::before{background:var(--f)}
.key:hover{background:var(--s2);border-color:var(--line2)}
.kl{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}.kl b{color:var(--amber);font-family:var(--gk);font-size:16px;font-weight:400}
.kw{font-size:26px}.kh{font-size:12.5px;color:var(--muted);line-height:1.35}

/* ── κάρτες υποδειγμάτων ── */
.grid{display:grid;gap:16px}.two{grid-template-columns:1fr 1fr}
/* ⚠️ ΠΑΝΤΑ ανά δύο: δίπλα στα περιεχόμενα τρεις στήλες βγαίνουν ~275px και ο πίνακας
   (άρθρο + τύπος × 2 αριθμοί) πέφτει πάνω στον εαυτό του. Ένα μονό τελευταίο απλώνεται. */
.grid.two>.card:last-child:nth-child(odd){grid-column:1/-1}
.grid.two>.card:last-child:nth-child(odd) .tbl{max-width:600px}
.card{display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:22px 22px 20px;scroll-margin-top:20px}
.top{display:flex;align-items:center;gap:10px}
.num{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#141821;flex:none}
.card.m .num{background:var(--m)}.card.f .num{background:var(--f)}.card.n .num{background:var(--n)}
.who{color:var(--muted);font-size:13.5px}
.card h3{font-weight:400;font-size:42px;line-height:1.1;margin-top:12px}.card h3 .a{color:var(--faint);font-size:26px;font-family:var(--gk)}
.gen{color:var(--muted);font-size:13.5px;margin-top:2px}.gen .gk{color:var(--text);font-size:18px;margin-left:4px}
.tbl{display:grid;grid-template-columns:var(--lab,44px) repeat(var(--cols,2),minmax(0,1fr));margin-top:16px;background:var(--s2);border-radius:12px;padding:6px 14px 8px}
.tbl>div{padding:7px 0;border-bottom:1px solid var(--line);white-space:nowrap;font-size:19px}
.tbl>div.last{border-bottom:0}
.tbl .th{font-size:12px;color:var(--faint);padding-bottom:4px}
.tbl .c{font-size:12px;color:var(--faint);align-self:center}
.tbl .a{font-family:var(--gk);color:var(--faint);font-size:15px}
.tbl em,.end{font-style:normal;color:var(--amber);background:rgba(232,178,92,.13);border-radius:4px;padding:0 1px}
.hid{display:inline-block;min-width:34px;min-height:26px;vertical-align:-4px;border-radius:6px;border:1px dashed rgba(232,178,92,.55);color:transparent;font-size:15px}
.hid:hover{background:rgba(232,178,92,.08)}
.lb{font-size:12.5px;color:var(--faint);margin-bottom:6px;font-weight:500}
.why{margin-top:16px}
.why li{list-style:none;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;color:var(--soft);line-height:1.5}
.why li:first-child{border-top:0;padding-top:2px}
.why .gk{color:var(--text);font-size:17.5px;margin-right:6px}
.why a{color:var(--muted);font-size:12.5px;white-space:nowrap;border-bottom:1px solid var(--line2)}
.why a:hover{color:var(--amber)}
.like{margin-top:16px}.like p{color:var(--soft);font-size:17px;line-height:1.5}
.trap{margin-top:auto;padding-top:16px}.trap p{background:rgba(232,178,92,.07);border:1px solid rgba(232,178,92,.18);border-radius:12px;padding:12px 14px;color:var(--soft);font-size:14.5px}
.from{color:var(--muted);font-size:14px;margin-top:4px}.from .gk{color:var(--text);font-size:18px}

/* ── κανόνες ── */
.rules{counter-reset:r;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rule{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:18px 20px;scroll-margin-top:20px;transition:border-color .3s}
.rule.flash{border-color:var(--amber)}
.rule h3{display:flex;gap:10px;align-items:baseline;font-size:16.5px;font-weight:600;line-height:1.35}
.rule h3 .rn{color:var(--amber);font-size:14px;font-weight:700;min-width:22px}
.rule h3 .sos{margin-left:auto;font-size:11px;font-weight:700;color:#1b1408;background:var(--amber);border-radius:5px;padding:1px 6px;letter-spacing:.04em}
.rule p{color:var(--soft);margin-top:8px;font-size:15px}
.rule .ex{color:var(--text);font-family:var(--gk);font-size:17px;margin-top:8px;line-height:1.5}
.rule .exc{margin-top:10px;padding:9px 12px;border-radius:10px;background:rgba(232,178,92,.07);border:1px solid rgba(232,178,92,.18);font-size:14px;color:var(--soft)}

/* ── αρχική ── */
.today{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.big{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:24px}
.big .n{font-size:64px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--amber)}
.big .n.zero{color:var(--soft)}
.big p{color:var(--soft);margin-top:10px;max-width:46ch}
.big .go{margin-top:18px}
.modes{display:grid;gap:10px}
.mo{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:12px 16px;background:var(--s1);border:1px solid var(--line);border-radius:14px;text-align:left;width:100%}
.mo:hover:not([disabled]){background:var(--s2);border-color:var(--line2)}
.mo[disabled]{opacity:.55;cursor:default}
.mo b{font-size:15.5px}.mo small{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:2px}
.mo .k{color:var(--amber);font-weight:700;font-size:17px}
.mo select{font:inherit;color:var(--text);background:var(--s3);border:1px solid var(--line2);border-radius:9px;padding:0 10px;min-height:40px}
.units{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:4px 20px}
.urow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:15px 0;border-bottom:1px solid var(--line)}
.urow:last-child{border:0}
.urow a{font-weight:600;font-size:16px}.urow a:hover{color:var(--amber)}
.urow .sub{text-align:right}
.ubar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--s3);overflow:hidden}
.ubar i{display:block;height:100%;background:var(--amber);border-radius:3px}
.soon{color:var(--muted);font-size:14.5px;margin-top:12px}

/* ── κάρτες κουίζ ── */
.qwrap{max-width:720px;margin:0 auto;padding-top:6px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:14px;color:var(--muted);font-size:13.5px}
.qline{height:3px;background:var(--s2);border-radius:2px;margin:10px 0 18px;overflow:hidden}.qline i{display:block;height:100%;background:var(--amber);transform-origin:left;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.qcard{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:28px 28px 24px}
.qk{font-size:12.5px;font-weight:600;color:var(--amber);letter-spacing:.06em;text-transform:uppercase}
.qp{font-family:var(--gk);font-size:46px;line-height:1.15;margin-top:14px;word-break:break-word}
.qp .a{color:var(--faint);font-size:30px}
.qp .bl{display:inline-block;min-width:64px;border-bottom:3px solid var(--amber);height:.9em;vertical-align:-.1em;margin-left:2px}
.qs{color:var(--soft);font-size:16px;margin-top:8px}.qs .gk{font-size:19px;color:var(--text)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.opt{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 14px;border-radius:14px;background:var(--s2);border:1px solid var(--line);text-align:left;transition:background .15s,border-color .15s,transform .12s}
.opt:hover:not([disabled]){background:var(--s3);border-color:var(--line2)}
.opt:active:not([disabled]){transform:scale(.98)}
.opt .i{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--faint);border:1px solid var(--line2);flex:none}
.opt .t{font-size:15.5px;line-height:1.3}.opt .t.gk{font-size:23px}
.opt[disabled]{cursor:default}
.opt.right{background:rgba(232,178,92,.16);border-color:var(--amber)}.opt.right .i{background:var(--amber);color:#1b1408;border-color:transparent}
.opt.wrong{background:rgba(232,131,111,.12);border-color:var(--late)}.opt.wrong .i{color:var(--late);border-color:var(--late)}
.opt.pop{animation:pop .3s cubic-bezier(.16,1,.3,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}
.fb{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--s2);font-size:15px;color:var(--soft);line-height:1.55}
.fb .h{font-weight:700;color:var(--text);font-size:16px;margin-bottom:4px}
.fb .h.ok{color:var(--amber)}.fb .h.no{color:var(--late)}
.fb .gk{font-size:19px;color:var(--text)}
.fb .rl{display:block;margin-top:8px;color:var(--muted);font-size:13.5px}
.qnext{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}
.hint{color:var(--faint);font-size:12.5px}
.done{text-align:center;padding:30px 10px 10px}
.done .n{font-size:84px;font-weight:700;letter-spacing:-.03em;color:var(--amber);line-height:1;text-shadow:0 0 28px rgba(232,178,92,.25)}
.done p{color:var(--soft);margin-top:12px;font-size:16.5px}
.miss{margin-top:24px;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:4px 18px}
.miss li{list-style:none;padding:12px 0;border-bottom:1px solid var(--line);color:var(--soft);font-size:14.5px}
.miss li:last-child{border:0}.miss .gk{color:var(--text);font-size:18px}
.acts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}
.fail{margin-top:30px;padding:18px 20px;border-radius:14px;border:1px solid rgba(232,131,111,.4);background:rgba(232,131,111,.06);color:var(--soft)}
.fail b{display:block;margin-bottom:4px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1240px){.keys{grid-template-columns:repeat(3,1fr)}}
@media (max-width:1040px){
  .shell{grid-template-columns:1fr;gap:10px}
  .toc{position:static;max-height:none;overflow:visible;display:flex;flex-wrap:wrap;gap:4px 6px;padding:0 0 6px;border-bottom:1px solid var(--line)}
  .toc h4,.toc>span{display:none}.toc>a{padding:0 12px;min-height:40px;align-items:center;border:1px solid var(--line);background:var(--s1)}
  .toc a i{display:none}
  .rules{grid-template-columns:1fr}
  .today{grid-template-columns:1fr}
}
@media (max-width:760px){
  .two{grid-template-columns:1fr}.keys{grid-template-columns:1fr 1fr}
  .hero{flex-direction:column;align-items:flex-start}.side{text-align:left;align-items:flex-start}
  h1{font-size:44px}.qp{font-size:38px}
}
@media (max-width:560px){
  .opts{grid-template-columns:1fr}.qcard{padding:22px 18px 18px}
  .card{padding:18px 16px}.card h3{font-size:36px}.tbl{--lab:34px;padding:6px 10px 8px}.tbl>div{font-size:16.5px}.tbl .a{font-size:13px}
  .big .n{font-size:52px}.done .n{font-size:64px}
  .crumb{display:none}
}
</style>
</head>

<div class="wrap">
  <nav class="bar">
    <a class="back" href="arxaia-agnosto.html" aria-label="Πίσω στα Αρχαία, άγνωστο">‹ Αρχαία, άγνωστο</a>
    <div class="crumb">Αρχαία<span>·</span>Γραμματική<span id="testday"></span></div>
  </nav>
  <div id="warn" hidden></div>
  <div class="shell">
    <aside class="toc" id="toc" aria-label="Περιεχόμενα του βιβλίου"></aside>
    <main id="main"><p class="sub" style="padding-top:20px">Φορτώνει…</p></main>
  </div>
</div>
<script>
(function(){
'use strict';
/* ════════════════════════════════════════════════════════════════════
   ΓΡΑΜΜΑΤΙΚΗ — η οθόνη και η αποθήκη. Η λογική ζει στο grammatiki-core.js.
   Τρεις άμυνες για το sync (CLAUDE.md §3), ίδιες με το Λεξιλόγιο:
   1. `_ts` σε κάθε εγγραφή του `cards` και του `started`, από το `save()`
      μέσω study-stamp.js (σταθ. 31) — αλλιώς η 2η επανάληψη γυρνάει πίσω.
   2. Το `load()` κρατάει ΟΛΑ τα πεδία (σταθ. 35).
   3. Καμία σιωπηλή αποτυχία (σταθ. 10/17): αποθήκη που δεν διαβάζεται δεν
      ξαναγράφεται, και ένα save που δεν κρατήθηκε το λέει.
   ════════════════════════════════════════════════════════════════════ */
var G = window.GramCore;
var KEY = 'metron.grammatiki.v1';
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]; }); };
var NUMS = ['μία','δύο','τρεις','τέσσερις','πέντε','έξι','επτά','οκτώ','εννέα','δέκα'];
var cardsWord = function(n){ return n === 1 ? '1 κάρτα' : n + ' κάρτες'; };
var GEN = { m:'Αρσενικά', f:'Θηλυκά', n:'Ουδέτερα' };

var qp = new URLSearchParams(location.search).get('today');
var TODAY = /^\d{4}-\d{2}-\d{2}$/.test(qp || '') ? qp : G.toISO(new Date());
if (qp) $('testday').innerHTML = '<span class="testday">δοκιμή: ' + esc(TODAY) + '</span>';

/* ===================== η αποθήκη ===================== */
var BLOCK = '', SAVE_ERR = '', SYNC_NOTE = '';
var blank = function(){ return { v:1, started:{}, cards:{} }; };
var isMap = function(o){ return !!o && typeof o === 'object' && !Array.isArray(o); };
function load(){
  var raw;
  try { raw = localStorage.getItem(KEY); }
  catch(e){ BLOCK = 'Δεν μπορώ να διαβάσω την αποθήκη αυτής της συσκευής (' + (e.name || 'σφάλμα') + '). Δεν γράφω τίποτα, για να μη σβήσω την πρόοδό σου.'; return blank(); }
  if (raw == null){ BLOCK = ''; return blank(); }
  var s = null; try { s = JSON.parse(raw); } catch(e){}
  if (!isMap(s) || s.v !== 1){
    BLOCK = 'Η πρόοδός σου υπάρχει σε αυτή τη συσκευή αλλά δεν διαβάζεται. Δεν γράφω από πάνω της.';
    return blank();
  }
  BLOCK = '';
  /* σταθ. 35: κρατάμε ΟΛΑ τα πεδία· φτιάχνουμε μόνο όσα λείπουν */
  if (!isMap(s.started)) s.started = {};
  if (!isMap(s.cards)) s.cards = {};
  return s;
}
var S = blank();
var STAMP = window.StudyStamp ? window.StudyStamp(function(){ return [S.started, S.cards]; }, function(){ return 0; }) : null;
function reload(){ S = load(); if (STAMP) STAMP.seed(); else BLOCK = 'Δεν φόρτωσε το study-stamp.js, που κρατάει την πρόοδο ζωντανή μέσα από τον συγχρονισμό. Ανανέωσε τη σελίδα· μέχρι τότε δεν γράφω τίποτα.'; }
function save(){
  if (BLOCK){ paintWarn(); return false; }
  STAMP.stamp();
  var txt = JSON.stringify(S), back = null;
  try { localStorage.setItem(KEY, txt); back = localStorage.getItem(KEY); }
  catch(e){ SAVE_ERR = 'Δεν αποθηκεύτηκε (' + (e.name || 'σφάλμα') + '). Η συσκευή μάλλον δεν έχει χώρο· ό,τι κάνεις τώρα δεν κρατιέται.'; paintWarn(); return false; }
  if (back !== txt){ SAVE_ERR = 'Δεν αποθηκεύτηκε: η συσκευή δέχτηκε την εγγραφή αλλά δεν την κράτησε.'; paintWarn(); return false; }
  if (SAVE_ERR){ SAVE_ERR = ''; paintWarn(); }
  return true;
}
function paintWarn(){
  var box = $('warn'), msgs = [BLOCK, SAVE_ERR, SYNC_NOTE].filter(Boolean);
  box.hidden = !msgs.length;
  box.innerHTML = msgs.map(function(m){ return '<div class="warn">' + esc(m) + '</div>'; }).join('');
}

/* ===================== τα δεδομένα ===================== */
var IDX = null, UNITS = {}, CARDS = [], DATA_ERR = '';
function getJSON(u){ return fetch(u, { cache:'no-cache' }).then(function(r){ if (!r.ok) throw new Error(u + ' · HTTP ' + r.status); return r.json(); }); }
function items(){ var o = []; (IDX ? IDX.groups : []).forEach(function(g){ g.items.forEach(function(it){ o.push({ g:g, it:it }); }); }); return o; }
function loadData(){
  return getJSON('data/grammatiki/index.json').then(function(ix){
    IDX = ix;
    var files = items().filter(function(x){ return x.it.file; });
    return Promise.all(files.map(function(x){
      return getJSON('data/grammatiki/' + x.it.file).then(function(u){
        var errs = G.validate(u);
        if (errs.length) throw new Error(x.it.file + ': ' + errs[0]);
        UNITS[u.id] = u;
      });
    }));
  }).then(function(){
    CARDS = []; Object.keys(UNITS).forEach(function(id){ CARDS = CARDS.concat(G.cards(UNITS[id])); });
  });
}
var unitList = function(){ return items().filter(function(x){ return x.it.id && UNITS[x.it.id]; }).map(function(x){ return UNITS[x.it.id]; }); };
var startedMap = function(){ var o = {}; Object.keys(S.started).forEach(function(k){ if (S.started[k] && S.started[k].at) o[k] = 1; }); return o; };

/* ===================== περιεχόμενα ===================== */
function paintToc(cur){
  var h = '<a class="home' + (cur === 'home' ? ' on' : '') + '" href="#/">Για σήμερα</a>';
  (IDX ? IDX.groups : []).forEach(function(g){
    h += '<h4>' + esc(g.title) + '</h4>';
    g.items.forEach(function(it){
      if (it.id && UNITS[it.id]){
        var st = S.started[it.id] && S.started[it.id].at;
        h += '<a href="#/u/' + esc(it.id) + '"' + (cur === it.id ? ' class="on" aria-current="page"' : '') + '>' + esc(it.title) +
          (st ? '<span class="dot" aria-label="ξεκίνησε"></span>' : '<i>σελ. ' + esc(it.page) + '</i>') + '</a>';
      } else h += '<span>' + esc(it.title) + '<i>σελ. ' + esc(it.page) + '</i></span>';
    });
  });
  $('toc').innerHTML = h;
}

/* ===================== ένας τύπος ===================== */
function formHTML(c, hide){
  if (!c) return '<span class="sub">—</span>';
  var sp = G.split(c);
  if (!sp[1]) return '<span class="gk">' + esc(sp[0]) + '</span>';
  return '<span class="gk">' + esc(sp[0]) + (hide
    ? '<button class="hid" type="button" data-rv="' + esc(sp[1]) + '" aria-label="Δείξε την κατάληξη">' + esc(sp[1]) + '</button>'
    : '<em>' + esc(sp[1]) + '</em>') + '</span>';
}
function tableHTML(m, hide){
  var t = G.table(m), cols = t.cols.length;
  var h = '<div class="tbl" style="--cols:' + cols + '"><div class="th"></div>';
  t.cols.forEach(function(c){ h += '<div class="th">' + esc(c) + '</div>'; });
  t.rows.forEach(function(rl, r){
    var last = r === t.rows.length - 1 ? ' last' : '';
    h += '<div class="c' + last + '">' + esc(rl) + '</div>';
    t.cells[r].forEach(function(c, ci){
      h += '<div class="' + last.trim() + '">' + (t.arts[r][ci] ? '<span class="a">' + esc(t.arts[r][ci]) + '</span> ' : '') + formHTML(c, hide) + '</div>';
    });
  });
  return h + '</div>';
}
function modelCard(u, m, i, hide){
  var art = (G.ART[m.g] || G.ART.m).sg[0];
  var gen = G.plain((m.sg || [])[1] || '');
  var h = '<article class="card ' + esc(m.g) + '" id="m-' + esc(m.id) + '">' +
    '<div class="top"><span class="num">' + (i + 1) + '</span><span class="who">' + esc(m.who || (m.from ? 'από το ' + m.from : '')) + '</span></div>' +
    '<h3 class="gk"><span class="a">' + esc(art) + '</span> ' + esc(m.w) + '</h3>' +
    (m.from ? '<div class="from">ασυναίρετο: <span class="gk">' + esc(m.from) + '</span></div>'
            : '<div class="gen">γενική <span class="gk">' + esc((G.ART[m.g] || G.ART.m).sg[1] + ' ' + gen) + '</span></div>') +
    tableHTML(m, hide);
  if (m.why && m.why.length){
    h += '<div class="why"><div class="lb">Γιατί</div><ul>' + m.why.map(function(y){
      return '<li><span class="gk">' + esc(y.form) + '</span>' + esc(y.d) + ' <a href="#r-' + y.rule + '" data-rule="' + y.rule + '">κανόνας ' + (y.rule + 1) + '</a></li>';
    }).join('') + '</ul></div>';
  }
  if (m.like && m.like.length) h += '<div class="like"><div class="lb">Κλίνονται έτσι</div><p class="gk">' + esc(m.like.join(', ')) + '</p></div>';
  if (m.trap || m.note) h += '<div class="trap"><div class="lb">Προσοχή</div><p>' + esc(m.trap || m.note) + '</p></div>';
  return h + '</article>';
}

/* ===================== οθόνη: ενότητα ===================== */
var HIDE = false;
function renderUnit(id){
  var u = UNITS[id];
  if (!u){ $('main').innerHTML = '<div class="fail"><b>Αυτή η ενότητα δεν έχει περαστεί ακόμα.</b>Όταν περάσουμε τις σελίδες της από το βιβλίο σου, θα ανοίγει εδώ.</div>'; return; }
  var st = S.started[id] && S.started[id].at;
  var mine = CARDS.filter(function(c){ return c.unit === id; });
  var gens = {}; u.models.forEach(function(m){ (gens[m.g] = gens[m.g] || []).push(m); });
  var legend = Object.keys(gens).map(function(g){ return '<span class="lg ' + g + '">' + GEN[g].toLowerCase() + '</span>'; }).join('') +
    '<span class="lg e"><span class="gk">‑ας</span> = κατάληξη</span>';
  var h = '<header class="hero"><div><h1>' + esc(u.title) + '</h1><p class="lead">' + esc(u.lead) + '</p><div class="legend">' + legend + '</div></div>' +
    '<div class="side"><div class="mode" role="group" aria-label="Τρόπος">' +
      '<button type="button" data-hide="0" aria-pressed="' + !HIDE + '">Διάβασμα</button>' +
      '<button type="button" data-hide="1" aria-pressed="' + HIDE + '">Έλεγχος</button></div>' +
      (st ? '<a class="go" href="#/q/u/' + esc(id) + '">Κάρτες της ενότητας · ' + mine.length + '</a>'
          : '<button class="go" type="button" data-start="' + esc(id) + '">Ξεκίνα την ενότητα</button>') +
      '<span class="sub">' + (st ? 'Ξεκίνησε · μπαίνει στο «Για σήμερα»' : 'Μπαίνει στο «Για σήμερα», ' + G.NEW_PER_DAY + ' νέες κάρτες τη μέρα') + ' · ' + esc(u.pages) + '</span>' +
    '</div></header>';
  if (u.find && u.find.length){
    h += '<section><div class="sh"><h2>Βρες το υπόδειγμα</h2><span>κοίτα την ονομαστική και τη γενική</span></div><div class="keys">' +
      u.find.map(function(f){
        var m = G.allModels(u).filter(function(x){ return x.id === f.to; })[0];
        return '<a class="key ' + esc(f.g) + '" href="#m-' + esc(f.to) + '" data-jump="m-' + esc(f.to) + '"><span class="kl">ον. <b>' + esc(f.nom) + '</b> · γεν. <b>' + esc(f.gen) + '</b></span>' +
          '<span class="kw gk">' + esc(m ? m.w : '') + '</span>' + (f.hint ? '<span class="kh">' + esc(f.hint) + '</span>' : '') + '</a>';
      }).join('') + '</div></section>';
  }
  var n = 0;
  ['m', 'f', 'n'].forEach(function(g){
    if (!gens[g]) return;
    var cls = 'two';
    h += '<section><div class="sh"><h2>' + GEN[g] + '</h2><span>' + (gens[g].length === 1 ? 'ένα υπόδειγμα' : NUMS[gens[g].length - 1] + ' υποδείγματα') + '</span></div><div class="grid ' + cls + '">' +
      gens[g].map(function(m){ return modelCard(u, m, n++, HIDE); }).join('') + '</div></section>';
  });
  h += '<section id="rules"><div class="sh"><h2>Όλοι οι κανόνες</h2><span>' + u.rules.length + ' κανόνες · τα SOS είναι δικά σου</span></div><div class="rules">' +
    u.rules.map(function(r, i){
      return '<div class="rule" id="r-' + i + '"><h3><span class="rn">' + (i + 1) + '</span>' + esc(r.t) + (r.sos ? '<span class="sos">SOS</span>' : '') + '</h3>' +
        '<p>' + esc(r.d) + '</p><div class="ex">' + esc(r.ex) + '</div>' + (r.exc ? '<div class="exc">' + esc(r.exc) + '</div>' : '') + '</div>';
    }).join('') + '</div></section>';
  if (u.contracted && u.contracted.models.length){
    var cm = u.contracted.models;
    h += '<section><div class="sh"><h2>' + esc(u.contracted.title || 'Συνηρημένα') + '</h2><span>κανόνας ' + (ruleIdx(u, 'Συνηρημένα') + 1) + '</span></div><div class="grid two">' +
      cm.map(function(m, i){ return modelCard(u, m, i, HIDE); }).join('') + '</div></section>';
  }
  $('main').innerHTML = h;
}
function ruleIdx(u, prefix){ for (var i = 0; i < u.rules.length; i++) if (u.rules[i].t.indexOf(prefix) === 0) return i; return -1; }

/* ===================== οθόνη: για σήμερα ===================== */
function renderHome(){
  var started = startedMap(), cn = G.counts(CARDS, S.cards, started, TODAY), n = cn.due + cn.fresh;
  var us = unitList(), anyStarted = Object.keys(started).length > 0;
  var line;
  if (!us.length) line = 'Δεν έχει περαστεί ακόμα καμία ενότητα.';
  else if (!anyStarted) line = 'Δεν έχεις ξεκινήσει ενότητα. Άνοιξε την ' + us[0].title + ' και πάτα «Ξεκίνα την ενότητα».';
  else if (!n) line = 'Για σήμερα τελείωσες. Ό,τι μάθαμε ξανάρχεται τη μέρα που πρέπει.';
  else line = 'Σήμερα έχεις ' + (cn.due ? cn.due + ' για επανάληψη' : '') + (cn.due && cn.fresh ? ' και ' : '') + (cn.fresh ? cn.fresh + ' νέες' : '') + '.';
  var h = '<header class="hero"><div><h1>Γραμματική</h1><p class="lead">' + esc(line) + '</p></div></header>';
  h += '<section style="margin-top:28px"><div class="today"><div class="big">' +
    '<div class="n' + (n ? '' : ' zero') + '">' + n + '</div><p>' + (n ? cardsWord(n) + ' για σήμερα. Λάθος κάρτα ξαναέρχεται μέχρι να τη βρεις δύο φορές σωστά.' : (anyStarted ? 'Καμία κάρτα δεν σε περιμένει σήμερα.' : 'Ξεκίνα μια ενότητα για να αρχίσουν οι κάρτες.')) + '</p>' +
    (n ? '<a class="go" href="#/q/today">Ξεκίνα · ' + cardsWord(n) + '</a>' : (us.length && !anyStarted ? '<a class="go" href="#/u/' + esc(us[0].id) + '">Άνοιξε την ' + esc(us[0].title) + '</a>' : '')) +
    '</div><div class="modes">' +
      modeBtn('mix', 'Σκόρπια', '20 ανακατεμένες από όσα ξεκίνησες', anyStarted) +
      modeBtn('all', 'Όλα', 'Όλες οι κάρτες των ενοτήτων σου', anyStarted, cardsOf(started).length) +
      '<div class="mo"><div><b>Μία ενότητα</b><small>Όλες οι κάρτες της, ανακατεμένες</small></div>' +
        '<select id="pickU" aria-label="Διάλεξε ενότητα">' + us.map(function(u){ return '<option value="' + esc(u.id) + '">' + esc(u.title) + '</option>'; }).join('') + '</select></div>' +
    '</div></div></section>';
  h += '<section><div class="sh"><h2>Οι ενότητες</h2><span>από το βιβλίο σου, με τη σειρά του</span></div><div class="units">' +
    us.map(function(u){
      var c = G.counts(CARDS.filter(function(x){ return x.unit === u.id; }), S.cards, (function(){ var o = {}; o[u.id] = 1; return o; })(), TODAY);
      var st = S.started[u.id] && S.started[u.id].at;
      var pct = c.total ? Math.round(100 * c.learned / c.total) : 0;
      return '<div class="urow"><a href="#/u/' + esc(u.id) + '">' + esc(u.title) + '</a>' +
        '<span class="sub">' + (st ? c.learned + ' από ' + c.total + ' μαθημένες' : 'δεν ξεκίνησε · ' + c.total + ' κάρτες') + '</span>' +
        (st ? '<div class="ubar" aria-hidden="true"><i style="width:' + pct + '%"></i></div>' : '') + '</div>';
    }).join('') + '</div>' +
    '<p class="soon">Μαθημένη = σωστή τρεις φορές στη σκάλα (1 · 3 · 7 μέρες). Οι επόμενες ενότητες ανοίγουν όταν περάσουμε τις σελίδες τους.</p></section>';
  $('main').innerHTML = h;
}
function modeBtn(k, t, s, on, n){
  return '<button class="mo" type="button" data-mode="' + k + '"' + (on ? '' : ' disabled') + '><div><b>' + t + '</b><small>' + s + '</small></div>' +
    (n ? '<span class="k">' + n + '</span>' : '') + '</button>';
}
function cardsOf(started){ return CARDS.filter(function(c){ return started[c.unit]; }); }

/* ===================== κουίζ ===================== */
/* Q = { mode, list:[card], i, first:{id:bool}, need:{id:n}, missed:[card], label }
   «Για σήμερα» βαθμολογεί τη σκάλα με την ΠΡΩΤΗ απάντηση κάθε κάρτας.
   Τα άλλα είναι εξάσκηση: ένα ΛΑΘΟΣ φέρνει την κάρτα αύριο (αν η ενότητα
   ξεκίνησε)· ένα σωστό δεν αλλάζει τη σκάλα. */
var Q = null;
function startQuiz(mode, unit){
  var started = startedMap(), list;
  if (mode === 'today') list = G.todayQueue(CARDS, S.cards, started, TODAY);
  else if (mode === 'mix') list = G.shuffle(cardsOf(started)).slice(0, 20);
  else if (mode === 'all') list = G.shuffle(cardsOf(started));
  else list = G.shuffle(CARDS.filter(function(c){ return c.unit === unit; }));
  Q = { mode:mode, unit:unit || '', list:list, i:0, first:{}, need:{}, missed:[], answered:null, opts:null, total:list.length,
        label: mode === 'today' ? 'Για σήμερα' : mode === 'mix' ? 'Σκόρπια' : mode === 'all' ? 'Όλα' : (UNITS[unit] ? UNITS[unit].title : '') };
}
var KIND = { f:'Φτιάξε τον τύπο', r:'Αναγνώρισε τον τύπο', m:'Ποιο υπόδειγμα;', w:'Γιατί;' };
function modelOf(c){ var u = UNITS[c.unit]; return G.allModels(u).filter(function(m){ return m.id === c.model; })[0]; }
function promptHTML(c){
  if (c.k === 'f') return '<div class="qp">' + (c.q.art ? '<span class="a">' + esc(c.q.art) + '</span> ' : '') + esc(c.q.stem) + '<span class="bl" aria-label="κενό"></span></div>' +
    '<div class="qs">' + esc(c.q.name) + (c.q.w ? ' · <span class="gk">' + esc(c.q.w) + '</span>' : '') + '</div>';
  if (c.k === 'r') return '<div class="qp">' + esc(c.q.form) + '</div><div class="qs">Ποια πτώση και ποιος αριθμός;' + (c.q.w ? ' · <span class="gk">' + esc(c.q.w) + '</span>' : '') + '</div>';
  if (c.k === 'm') return '<div class="qp">' + esc(c.q.word) + '</div><div class="qs">Με ποιο υπόδειγμα κλίνεται;</div>';
  return '<div class="qp">' + esc(c.q.form) + '</div><div class="qs">Ποιος κανόνας το εξηγεί;</div>';
}
function optText(c, o){ return c.k === 'f' ? '‑' + o : o; }
function optGk(c){ return c.k === 'f' || c.k === 'm'; }
function explain(c){
  var m = modelOf(c), u = UNITS[c.unit];
  if (c.k === 'w') return esc(c.why);
  if (c.k === 'm') return 'Η <span class="gk">' + esc(c.q.word) + '</span> κλίνεται όπως το <span class="gk">' + esc(m.w) + '</span> (' + esc(m.who || '') + ').';
  if (c.k === 'f'){
    var full = c.full, y = (m.why || []).filter(function(y){ return G.nfc(y.form).indexOf(G.nfc(full)) >= 0 || G.nfc(full).indexOf(G.nfc(y.form)) >= 0; })[0];
    return '<span class="gk">' + esc(full) + '</span> · ' + esc(c.q.name) + (y ? '<span class="rl">' + esc(y.d) + ' (κανόνας ' + (y.rule + 1) + ': ' + esc(u.rules[y.rule].t) + ')</span>' : '');
  }
  return '<span class="gk">' + esc(c.q.form) + '</span> = ' + esc(c.a) + ' του <span class="gk">' + esc(m.w) + '</span>.';
}
function renderQuiz(){
  if (!Q){ location.hash = '#/'; return; }
  var c = Q.list[Q.i];
  var back = Q.unit ? '#/u/' + Q.unit : '#/';
  if (!Q.total){
    $('main').innerHTML = '<div class="qwrap"><div class="done"><div class="n" style="color:var(--soft)">0</div><p>' +
      (Q.mode === 'today' ? 'Καμία κάρτα για σήμερα.' : 'Δεν υπάρχουν κάρτες εδώ ακόμα. Ξεκίνα πρώτα μια ενότητα.') + '</p><div class="acts"><a class="ghost" href="#/">Πίσω</a></div></div></div>';
    return;
  }
  if (!c) return renderDone(back);
  if (!Q.opts){ Q.opts = G.options(c); Q.isAgain = c.id in Q.first; }
  var done = Object.keys(Q.first).length;
  var h = '<div class="qwrap"><div class="qhead"><span>' + esc(Q.label) + ' · κάρτα ' + Math.min(done + 1, Q.total) + ' από ' + Q.total + '</span><a class="ghost" href="' + back + '" style="min-height:40px">Σταμάτα</a></div>' +
    '<div class="qline"><i style="transform:scaleX(' + (done / Q.total).toFixed(3) + ')"></i></div>' +
    '<div class="qcard"><div class="qk">' + KIND[c.k] + (Q.isAgain ? ' · ξανά' : '') + '</div>' + promptHTML(c) +
    '<div class="opts">' + Q.opts.map(function(o, i){
      var cls = '';
      if (Q.answered != null){ if (o === c.a) cls = ' right' + (Q.answered === o ? ' pop' : ''); else if (o === Q.answered) cls = ' wrong'; }
      return '<button class="opt' + cls + '" type="button" data-opt="' + i + '"' + (Q.answered != null ? ' disabled' : '') + '><span class="i">' + (i + 1) + '</span><span class="t' + (optGk(c) ? ' gk' : '') + '">' + esc(optText(c, o)) + '</span></button>';
    }).join('') + '</div>';
  if (Q.answered != null){
    var right = Q.answered === c.a;
    h += '<div class="fb"><div class="h ' + (right ? 'ok' : 'no') + '">' + (right ? 'Σωστό.' : 'Το σωστό: ' + esc(optText(c, c.a))) + '</div>' + explain(c) + '</div>' +
      '<div class="qnext"><span class="hint">Enter για την επόμενη</span><button class="go" type="button" data-next autofocus>Επόμενη</button></div>';
  } else h += '<div class="qnext"><span class="hint">Πάτα 1–4 ή διάλεξε</span><span></span></div>';
  $('main').innerHTML = h + '</div></div>';
  var nb = document.querySelector('[data-next]'); if (nb) nb.focus();
}
function answer(i){
  var c = Q.list[Q.i]; if (!c || Q.answered != null) return;
  var o = Q.opts[i]; if (o == null) return;
  Q.answered = o;
  var right = o === c.a, firstSeen = !(c.id in Q.first);
  if (firstSeen){
    Q.first[c.id] = right;
    if (!right) Q.missed.push(c);
    var started = startedMap()[c.unit];
    if (Q.mode === 'today') S.cards[c.id] = G.grade(S.cards[c.id], right, TODAY);
    else if (!right && started) S.cards[c.id] = G.grade(S.cards[c.id], false, TODAY);
    if (Q.mode === 'today' || (!right && started)) save();
  }
  /* λάθος → ξαναέρχεται 3 κάρτες μετά, ώσπου να βρεθεί 2 φορές στη σειρά */
  if (!right){ Q.need[c.id] = 2; Q.list.splice(Math.min(Q.i + 4, Q.list.length), 0, c); }
  else if (Q.need[c.id]){ Q.need[c.id]--; if (Q.need[c.id] > 0) Q.list.splice(Math.min(Q.i + 4, Q.list.length), 0, c); }
  renderQuiz();
}
function next(){ if (!Q || Q.answered == null) return; Q.i++; Q.answered = null; Q.opts = null; renderQuiz(); }
function renderDone(back){
  var n = Object.keys(Q.first).length, ok = n - Q.missed.length;
  var h = '<div class="qwrap"><div class="done"><div class="n">' + ok + ' / ' + n + '</div><p>' +
    (Q.missed.length ? 'με την πρώτη. Τα λάθη τα ξαναβρήκες στο τέλος· ' + (Q.mode === 'today' ? 'ξανάρχονται αύριο.' : 'μπήκαν για αύριο.') : 'Όλα με την πρώτη. Καθαρό πέρασμα.') + '</p>';
  if (Q.missed.length){
    h += '<ul class="miss">' + Q.missed.map(function(c){
      var p = c.k === 'f' ? (c.q.art ? c.q.art + ' ' : '') + c.q.stem + '_ · ' + c.q.name : (c.q.form || c.q.word);
      return '<li><span class="gk">' + esc(p) + '</span> → <b class="' + (optGk(c) ? 'gk' : '') + '">' + esc(optText(c, c.a)) + '</b></li>';
    }).join('') + '</ul>';
  }
  h += '<div class="acts">' + (Q.missed.length ? '<button class="go" type="button" data-again>Ξανά μόνο τα λάθη</button>' : '') + '<a class="ghost" href="' + back + '">Πίσω</a></div></div></div>';
  $('main').innerHTML = h;
}

/* ===================== δρομολόγηση ===================== */
var R = '';
function route(){
  var hsh = location.hash.replace(/^#\/?/, ''), p = hsh.split('/');
  if (/^[mr]-/.test(hsh)) return;          /* άγκυρα μέσα στη σελίδα */
  if (DATA_ERR){ $('main').innerHTML = '<div class="fail"><b>Δεν μπόρεσα να διαβάσω τη γραμματική.</b>' + esc(DATA_ERR) + '<br>Η πρόοδός σου δεν πειράχτηκε· ανανέωσε τη σελίδα.</div>'; paintToc(''); return; }
  if (!IDX) return;
  if (p[0] === 'u' && p[1]){ R = 'u'; paintToc(p[1]); renderUnit(p[1]); window.scrollTo(0, 0); }
  else if (p[0] === 'q'){
    R = 'q'; paintToc('');
    var mode = p[1] === 'u' ? 'unit' : p[1];
    if (!Q || Q.mode !== mode || Q.unit !== (p[2] || '')) startQuiz(mode, p[2]);
    renderQuiz(); window.scrollTo(0, 0);
  }
  else { R = 'home'; Q = null; paintToc('home'); renderHome(); }
}
function render(){ paintWarn(); route(); }

document.addEventListener('click', function(e){
  var t = e.target;
  var rv = t.closest('[data-rv]'); if (rv){ var em = document.createElement('em'); em.textContent = rv.getAttribute('data-rv'); rv.replaceWith(em); return; }
  var hd = t.closest('[data-hide]'); if (hd){ HIDE = hd.getAttribute('data-hide') === '1'; var y = window.scrollY; route(); window.scrollTo(0, y); return; }
  var sb = t.closest('[data-start]');
  if (sb){
    var id = sb.getAttribute('data-start');
    S.started[id] = { at: TODAY };
    if (save()) location.hash = '#/q/today'; else delete S.started[id];
    return;
  }
  var jm = t.closest('[data-jump]');
  if (jm){ e.preventDefault(); var el = $(jm.getAttribute('data-jump')); if (el) el.scrollIntoView({ behavior:'smooth', block:'start' }); return; }
  var rl = t.closest('[data-rule]');
  if (rl){ e.preventDefault(); var r = $('r-' + rl.getAttribute('data-rule')); if (r){ r.scrollIntoView({ behavior:'smooth', block:'center' }); r.classList.add('flash'); setTimeout(function(){ r.classList.remove('flash'); }, 1400); } return; }
  var mo = t.closest('[data-mode]'); if (mo && !mo.disabled){ location.hash = '#/q/' + mo.getAttribute('data-mode'); return; }
  var op = t.closest('[data-opt]'); if (op){ answer(+op.getAttribute('data-opt')); return; }
  if (t.closest('[data-next]')){ next(); return; }
  if (t.closest('[data-again]')){ var miss = Q.missed.slice(); Q = { mode:'again', unit:Q.unit, list:G.shuffle(miss), i:0, first:{}, need:{}, missed:[], answered:null, opts:null, total:miss.length, label:'Τα λάθη' }; renderQuiz(); return; }
});
document.addEventListener('change', function(e){
  if (e.target.id === 'pickU'){ location.hash = '#/q/u/' + e.target.value; }
});
/* το select χρειάζεται και ένα «πάτημα» όταν η επιλογή ΔΕΝ αλλάζει (ήδη διαλεγμένη) */
document.addEventListener('keydown', function(e){
  if (R !== 'q' || !Q || e.metaKey || e.ctrlKey || e.altKey) return;
  if (Q.answered == null && /^[1-4]$/.test(e.key)){ e.preventDefault(); answer(+e.key - 1); }
  else if (Q.answered != null && (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight')){ e.preventDefault(); next(); }
});
window.addEventListener('hashchange', route);
/* Μόνο για το test (με ?today=): ΑΝΑΓΝΩΣΗ της τρέχουσας κάρτας. Δεν γράφει τίποτα. */
if (qp) window.__gram = { card:function(){ return Q && Q.list[Q.i] ? JSON.parse(JSON.stringify(Q.list[Q.i])) : null; }, opts:function(){ return Q && Q.opts ? Q.opts.slice() : null; }, left:function(){ return Q ? Q.list.length - Q.i : 0; } };

reload();
paintWarn();
loadData().then(render, function(e){ DATA_ERR = String(e && e.message || e); render(); });

/* Συγχρονισμός: μία μηχανή, ένα κλειδί, μία κλήση (σταθ. 32). */
(function(){
  var tries = 0;
  (function wait(){
    if (typeof initCloudSync !== 'function' || !window.supabase){
      if (tries++ < 40) setTimeout(wait, 200);
      else { SYNC_NOTE = 'Ο συγχρονισμός δεν ξεκίνησε· η πρόοδος μένει σε αυτή τη συσκευή.'; paintWarn(); }
      return;
    }
    initCloudSync({
      appKey:'grammatiki',
      syncedKeys:['metron.grammatiki.v1'],
      onApplied:function(){ reload(); if (R !== 'q') route(); else paintWarn(); }
    });
  })();
})();
})();
</script>
