<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Οι φιλοσοφικές ιδέες του Σωκράτη · Εισαγωγή Αρχαίων</title>
<!-- ⛔ ΠΑΡΑΓΕΤΑΙ: node tools/eisagogi/arxaia/build.js sokratis-d2 — μην τη γράψεις με το χέρι.
     Το κεφάλαιο ζει στο tools/eisagogi/arxaia/sokratis-d2.json· το καλούπι εδώ (page.tpl). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300;400;500;600&family=GFS+Didot&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ══ ΤΟ ΚΑΛΟΥΠΙ ΤΗΣ ΕΙΣΑΓΩΓΗΣ ΤΩΝ ΑΡΧΑΙΩΝ ═══════════════════════════════
   Midnight (metron-design §2) · τρεις φωνές: Commissioner για πρόζα,
   GFS Didot για κάθε ελληνικό τίτλο/όρο/αρχαίο, JetBrains Mono για ετικέτες.
   ⛔ Κανένα min-width· το λάπτοπ γράφεται πρώτο και μαζεύει με max-width.
   ⛔ Τίποτα δεν γεννιέται αόρατο περιμένοντας JS (σταθ. 39): η κίνηση
   προστίθεται κάτω από html.anim και έχει πάντα τελική κατάσταση ορατή. */
:root{
  color-scheme:dark;
  --bg:oklch(13.2% .022 258); --surf:oklch(16.4% .022 258); --surf2:oklch(19.5% .022 258); --surf3:oklch(23% .022 258);
  --metal-hi:oklch(44% .013 258); --metal-lo:oklch(25% .014 258);
  --text:#EDE6D8; --soft:#C9C2B5; --muted:#A7A196; --faint:#8A8C94;
  --line:rgba(237,230,216,.07); --line2:rgba(237,230,216,.12); --line3:rgba(237,230,216,.2);
  --amber:#E8B25C; --late:#E8836F; --arx:#E8A07F;
  --gr:"GFS Didot","Literata",serif;
  --sans:"Commissioner",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--text);font:400 15.5px/1.72 var(--sans);-webkit-font-smoothing:antialiased;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px))}
.shell{max-width:1180px;margin:0 auto}
button{font:inherit;color:inherit}
a{color:inherit}
.lbl{font:500 10px/1.3 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
.gr,.t{font-family:var(--gr)}
em.t{font-style:italic;font-size:1.1em;color:var(--arx)}
b{font-weight:500;color:var(--text)}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:6px}

/* ── διαδρομή + καρτέλες ── */
.route{display:flex;align-items:center;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px 0 12px;border:1px solid var(--line2);border-radius:10px;
  text-decoration:none;font:500 13px var(--sans);color:var(--soft);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.008))}
.back:hover{color:var(--text);border-color:var(--line3)}
.crumbs{flex:1;min-width:0}
.tabs{display:flex;gap:4px;background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:3px}
.tabs button{border:0;background:none;cursor:pointer;font:500 13px var(--sans);padding:8px 16px;border-radius:8px;color:var(--muted);min-height:36px}
.tabs button[aria-selected="true"]{background:var(--surf3);color:var(--text)}
.tabs button:active{transform:scale(.97)}
.banner{margin:18px 0 0;border:1px solid rgba(232,131,111,.4);border-radius:12px;padding:12px 16px;color:var(--text);background:rgba(232,131,111,.08);font-size:14px}

/* ── εξώφυλλο ── */
.cover{display:grid;grid-template-columns:auto minmax(0,1fr);gap:48px;align-items:center;padding:64px 0 58px;border-bottom:1px solid var(--line)}
.seal{width:196px;height:196px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 50% 40%,oklch(22% .03 258),var(--surf) 74%);transition:width .4s var(--ease),height .4s var(--ease)}
.seal svg{width:100%;height:100%;display:block;overflow:visible}
.seal .rim{fill:none;stroke:var(--line3);stroke-width:1}
.seal .rim2{fill:none;stroke:var(--line2);stroke-width:1}
.seal .ring{font:400 13.5px var(--gr);letter-spacing:.32em;fill:var(--muted)}
.seal .mark{font:400 italic 92px var(--gr);fill:var(--text)}
.seal{position:relative;overflow:hidden}
.seal img{position:absolute;inset:7%;width:86%;height:86%;border-radius:50%;object-fit:cover;
  filter:invert(1) sepia(.35) saturate(.8) brightness(.93);mix-blend-mode:screen;
  -webkit-mask-image:radial-gradient(circle,#000 58%,transparent 71%);mask-image:radial-gradient(circle,#000 58%,transparent 71%)}
.seal svg{position:relative}
.seal .pip{fill:var(--surf3);stroke:var(--line3);stroke-width:1;transition:fill .4s,stroke .4s}
.seal .pip.lit{fill:var(--amber);stroke:var(--amber);filter:drop-shadow(0 0 4px rgba(232,178,92,.6))}
/* ⭐ από τη 2η επίσκεψη: το εξώφυλλο μαζεύει, ο σταθμός ανεβαίνει στην πρώτη οθόνη */
html.ret .cover{padding:30px 0 26px;gap:30px}
html.ret .seal{width:104px;height:104px}
html.ret .seal .ring{display:none}
html.ret .seal img{inset:4%;width:92%;height:92%}
html.ret .cover h1{font-size:clamp(34px,4.2vw,54px);margin:8px 0 6px}
html.ret .cover .sub{display:none}
html.ret .motto{font-size:21px}
html.ret .motto small{display:none}
html.ret .map{padding:30px 0 30px}
html.ret .map .lead,html.ret .map .h2{display:none}
html.ret .map .mapbox{margin-top:14px}
.cover h1{font:400 italic clamp(46px,6.6vw,92px)/1.02 var(--gr);margin:14px 0 14px;letter-spacing:-.005em;text-wrap:balance}
.cover .sub{color:var(--muted);margin:0 0 22px;max-width:60ch;font-size:15px}
.motto{font:400 clamp(22px,2.5vw,30px)/1.3 var(--gr);color:var(--amber)}
.motto small{display:block;font:300 italic 15px/1.5 var(--sans);color:var(--muted);margin-top:6px}

/* ── ο αστερισμός ── */
.map{padding:56px 0 50px;border-bottom:1px solid var(--line)}
.h2{font:400 italic 34px/1.15 var(--gr);margin:10px 0 8px;text-wrap:balance}
.map .lead{color:var(--muted);margin:0 0 24px;max-width:62ch}
.mapbox{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.006));border:1px solid var(--line);border-radius:18px}
.mapbox svg{display:block;width:100%;height:auto}
.edge{stroke:var(--line2);stroke-width:1.2;fill:none}
.edge.lit{stroke:var(--amber);stroke-opacity:.72}
html.anim .mapbox:not(.drawn) .edge.lit{stroke-dashoffset:var(--len)}
.edge.lit{stroke-dasharray:var(--len) var(--len);stroke-dashoffset:0;transition:stroke-dashoffset 1.3s var(--ease)}
.node{cursor:pointer}
.node circle.dot{fill:var(--bg);stroke:var(--line3);stroke-width:1.3;transition:fill .3s,stroke .3s}
.node.lit circle.dot{fill:var(--amber);stroke:var(--amber);filter:drop-shadow(0 0 7px rgba(232,178,92,.55))}
.node circle.ring{fill:none;stroke:var(--amber);stroke-width:1.4;opacity:0}
.node.here circle.ring{opacity:1}
.node circle.hit{fill:transparent;stroke:none}
.node text.nm{font:400 italic 17px var(--gr);fill:var(--soft)}
.node.lit text.nm,.node.here text.nm{fill:var(--text)}
.node text.n{font:500 10px var(--mono);letter-spacing:.2em;fill:var(--faint)}
.node .gapdot{fill:var(--late)}
.node text.gapn{font:500 10px var(--mono);fill:var(--late)}
.node:hover text.nm{fill:var(--text)}
.node:focus-visible{outline:none}
.node:focus-visible circle.ring{opacity:1;stroke:var(--text)}
.core{font:400 24px var(--gr);fill:var(--amber);opacity:.9}
.node.stamp circle.dot{animation:stamp .7s var(--ease)}
@keyframes stamp{0%{transform:scale(.3)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.node circle.dot{transform-box:fill-box;transform-origin:center}

/* ── σταθμός ── */
.st{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:60px;padding:66px 0 40px}
.st-main{min-width:0}
.num{font:400 italic 124px/.8 var(--gr);color:var(--surf3);margin:0 0 -22px;user-select:none}
.st h2{font:400 italic 36px/1.14 var(--gr);margin:10px 0 0;text-wrap:balance}
.mine{margin:12px 0 0;color:var(--muted);font-size:13.5px}
.mine .lbl{margin-right:8px}
.prose{max-width:660px;margin-top:26px}
.prose p{margin:0 0 18px;color:var(--soft)}
.quote{margin:30px 0;max-width:700px;padding:4px 0 4px 26px;position:relative}
.quote::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:var(--line3)}
.quote .lbl{display:block;margin-bottom:10px}
.quote blockquote{margin:0;font:400 italic 19px/1.62 var(--gr);color:var(--text)}
.quote cite{display:block;margin-top:12px;font:500 10px/1.4 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);font-style:normal}
.quote cite .gr{font:400 italic 14px var(--gr);letter-spacing:0;text-transform:none}
.keys{display:grid;gap:16px;margin:30px 0 0;padding:0;list-style:none;max-width:680px}
.keys li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;color:var(--soft)}
.keys li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--arx);margin-top:11px;justify-self:center}
.done{margin-top:36px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.btn{font:500 14px var(--sans);border-radius:10px;padding:0 20px;min-height:46px;cursor:pointer;border:1px solid var(--line2);
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));color:var(--text);transition:transform .12s,background .2s,border-color .2s}
.btn:hover{border-color:var(--line3)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#1a1408}
.btn.ghost{background:none}
.btn.small{min-height:40px;padding:0 14px;font-size:13px}
.done .ok{color:var(--muted);font-size:13.5px}
.done a.next{font:500 14px var(--sans);color:var(--amber);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.done a.next:hover{text-decoration:underline}

/* ── το σχέδιο: ένα πλαίσιο, ό,τι κι αν είναι μέσα ── */
.dg{margin:32px 0;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.008));border:1px solid var(--line);border-radius:16px;padding:26px 26px 24px;position:relative;overflow:hidden}
.dg .cap{font:500 10px/1.3 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
.dg .big{font:400 italic 21px/1.25 var(--gr);color:var(--text)}
.dg .sm{font-size:13.5px;line-height:1.5;color:var(--muted)}
.dg .amb{color:var(--amber)}
html.anim .dg .grow{transform:scaleX(0);transform-origin:left;animation:grow .9s var(--ease) forwards}
html.anim .dg .growy{transform:scaleY(0);transform-origin:top;animation:growy .9s var(--ease) forwards}
html.anim .dg .fade{opacity:0;animation:fade .7s var(--ease) forwards}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes growy{to{transform:scaleY(1)}}
@keyframes fade{to{opacity:1}}

/* flow: Α → Β → Γ */
.flow{display:grid;grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr) 54px minmax(0,1fr);align-items:start}
.flow .nd{text-align:center;padding:0 6px}
.flow .nd i{display:block;width:12px;height:12px;border-radius:50%;margin:4px auto 14px;border:1.3px solid var(--line3);background:var(--bg)}
.flow .nd:last-child i{background:var(--amber);border-color:var(--amber);box-shadow:0 0 12px rgba(232,178,92,.5)}
.flow .cn{height:1px;background:var(--amber);opacity:.65;margin-top:10px;position:relative}
.flow .cn::after{content:"";position:absolute;right:-1px;top:-3px;border:3.5px solid transparent;border-left:6px solid var(--amber);border-right:0}
.flow .sm{margin-top:6px}

/* repeat: ίδιο εύρημα σε κάθε στάση */
.rep .top{text-align:center;max-width:560px;margin:0 auto}
.rep .stops{display:grid;gap:18px;margin:24px 0 0}
.rep .stop{border-top:1px solid var(--line2);padding-top:14px;display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:baseline}
.rep .stop .who{color:var(--soft)}
.rep .stop .find{color:var(--amber);font:400 italic 18px/1.3 var(--gr)}
.rep .res{margin-top:22px;border-top:1px solid var(--line3);padding-top:16px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:18px;align-items:baseline}
.rep .cost{margin-top:10px;color:var(--muted);font-size:13.5px;padding-left:128px}

/* split: δύο πλευρές, ένα αποτέλεσμα */
.split .cols{display:grid;grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr);gap:26px}
.split .bar{background:var(--line2)}
.split h4{margin:6px 0 12px;font:400 italic 22px/1.2 var(--gr)}
.split .L h4{color:var(--amber)}
.split ul{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.split li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;color:var(--soft);font-size:14.5px;line-height:1.45}
.split li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--faint);margin-top:8px}
.split .L li::before{background:var(--amber)}
.split .R li::before{background:var(--late)}
.split .res{margin-top:22px;padding-top:16px;border-top:1px solid var(--line3);text-align:center}

/* fork: μία ρίζα, δύο δρόμοι */
.fork .root{text-align:center;max-width:520px;margin:0 auto}
.fork svg{display:block;width:100%;height:46px;margin:10px 0 4px}
.fork svg path{stroke:var(--line3);stroke-width:1.2;fill:none;vector-effect:non-scaling-stroke}
.fork svg path.r{stroke:var(--amber);stroke-opacity:.8}
.fork .heads,.fork .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px}
.fork .heads{margin-bottom:6px}
.fork .heads .big{font-size:22px}
.fork .heads div:last-child .big{color:var(--amber)}
.fork .row{border-top:1px solid var(--line);padding:11px 0;font-size:14.5px;line-height:1.5}
.fork .row div:first-child{color:var(--muted)}
.fork .row div:last-child{color:var(--text)}

/* dialogue: δύο φωνές */
.dlg .lanes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 30px}
.dlg .lanes .cap{padding-bottom:6px;border-bottom:1px solid var(--line2)}
.dlg .ph{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:10px 0 0}
.dlg .ph::before,.dlg .ph::after{content:"";flex:1;height:1px;background:var(--line2)}
.dlg .bub{border:1px solid var(--line2);border-radius:14px;padding:11px 14px;font-size:14.5px;line-height:1.5;color:var(--soft);background:var(--surf)}
.dlg .bub.S{grid-column:2;border-color:rgba(232,160,127,.3)}
.dlg .bub.C{grid-column:1}
.dlg .res{grid-column:1/-1;text-align:center;margin-top:16px;padding:16px 10px 4px;border-top:1px solid var(--line3)}
.dlg .res .big{color:var(--amber)}

/* descent: από τα άστρα στη γη */
.desc{text-align:center}
.desc .sky{position:relative;padding:8px 0 4px}
.desc .sky svg{display:block;width:100%;height:40px;margin-bottom:6px}
.desc .sky circle{fill:var(--soft)}
.desc .arrow{width:1px;height:58px;margin:14px auto;background:linear-gradient(var(--line3),var(--amber));position:relative}
.desc .arrow::after{content:"";position:absolute;left:-4px;bottom:-1px;border:4px solid transparent;border-top:7px solid var(--amber);border-bottom:0}
.desc .earth{border-top:1px solid var(--amber);padding-top:14px;max-width:520px;margin:0 auto}
.desc .gk{display:block;font:400 italic 17px/1.4 var(--gr);color:var(--arx);margin-top:4px}

/* ladder: τα σκαλιά της επαγωγής */
.lad .steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:0;margin-top:14px}
.lad .stp{border-top:1px solid var(--line3);border-left:1px solid var(--line3);padding:12px 14px 0 14px;position:relative}
.lad .stp::before{content:"";position:absolute;left:-1px;right:0;top:-1px;height:1.5px;background:var(--amber)}
html.anim .lad .stp::before{transform:scaleX(0);transform-origin:left;animation:grow .7s var(--ease) forwards}
.lad .stp:nth-child(1){height:96px}.lad .stp:nth-child(2){height:156px}.lad .stp:nth-child(3){height:216px}
html.anim .lad .stp:nth-child(2)::before{animation-delay:.45s}html.anim .lad .stp:nth-child(3)::before{animation-delay:.9s}
.lad .stp:last-child .big{color:var(--amber)}
.lad .caps{display:flex;justify-content:space-between;gap:12px;margin-top:12px;border-top:1px solid var(--line2);padding-top:10px}
.lad .rise{float:right;font:400 italic 18px var(--gr);color:var(--arx)}

/* scales: έξι ζυγαριές */
.scl .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 18px}
.scl .pair{text-align:center}
.scl svg{display:block;width:100%;max-width:180px;height:auto;margin:0 auto}
.scl svg path,.scl svg line{stroke:var(--metal-hi);stroke-width:1.2;fill:none}
.scl svg .beam{stroke:var(--soft)}
.scl svg .pv{fill:var(--amber);stroke:none}
.scl .w{display:grid;grid-template-columns:1fr 1fr;gap:8px;font:400 italic 16.5px/1.25 var(--gr);color:var(--text);margin-top:4px}
.scl .no{font:500 10px var(--mono);letter-spacing:.2em;color:var(--faint)}
.scl .thread{margin-top:24px;padding-top:16px;border-top:1px solid var(--line3);display:flex;align-items:center;justify-content:center;gap:12px;text-align:center}
.scl .thread i{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px rgba(232,178,92,.55);flex:none}

/* ── η πλαϊνή κάρτα ── */
aside{min-width:0}
aside .card{position:sticky;top:22px;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:22px}
aside h3{font:400 italic 22px var(--gr);margin:8px 0 12px}
.gloss{display:grid;gap:14px}
.gloss div{border-top:1px solid var(--line);padding-top:12px}
.gloss .gk{font:400 19px/1.3 var(--gr);color:var(--arx)}
.gloss .gl{color:var(--soft);font-size:13.5px;line-height:1.5}
.gloss .yours{display:block;margin-top:4px}
.mnem{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.mnem .k{font:500 13px/1.4 var(--mono);letter-spacing:.1em;color:var(--amber);margin:6px 0}
.mnem p{margin:0;color:var(--soft);font-size:13.5px;line-height:1.55}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.pager a{font:500 13px var(--sans);color:var(--soft);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.pager a:hover{color:var(--text)}
.pager a.r{text-align:right;margin-left:auto}

/* ── τέλος κεφαλαίου ── */
.fin{padding:70px 0 40px;text-align:center}
.fin p.line{font:400 italic clamp(40px,5.4vw,68px)/1.05 var(--gr);margin:18px 0 22px;color:var(--text);max-width:none}
.fin p{color:var(--muted);max-width:52ch;margin:0 auto 26px}
.fin .mapbox{max-width:900px;margin:0 auto 34px}

/* ── ο έλεγχος ── */
.ck-head{padding:56px 0 34px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.ck-head .say{font:400 italic 34px/1.2 var(--gr);margin:10px 0 0;text-wrap:balance}
.ck-head .say + p{color:var(--muted);margin:10px 0 0}
.mapbox.strip .node text.nm{font-size:15px}
.subnav{display:flex;gap:26px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:0}
.subnav button{background:none;border:0;cursor:pointer;padding:16px 0 13px;font:500 13px var(--sans);color:var(--muted);border-bottom:1px solid transparent;margin-bottom:-1px;min-height:44px}
.subnav button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--text)}
.subnav button span{font:500 10px var(--mono);color:var(--faint);margin-left:6px;letter-spacing:.08em}
.pane{padding:38px 0 20px}
.pane .intro{color:var(--muted);max-width:64ch;margin:0 0 24px}

.rc{max-width:720px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.008));border:1px solid var(--line);border-radius:18px;padding:30px 30px 26px}
.rc .q{font:400 italic 26px/1.3 var(--gr);margin:12px 0 20px;text-wrap:balance}
.rc .think{color:var(--muted);font-size:14px;margin:0 0 18px}
.rc .ans{border-top:1px solid var(--line2);padding-top:18px;color:var(--text);font-size:15.5px}
.rc .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.rc .go{font:500 13px var(--sans);color:var(--soft);text-decoration:none;display:inline-flex;align-items:center;min-height:44px;margin-left:auto}
.rc .go:hover{color:var(--text)}
.ticks{display:flex;gap:2px;max-width:720px;margin:0 0 18px}
.ticks i{flex:1;height:4px;border-radius:2px;background:var(--line2);display:block;transition:background .3s}
.ticks i.k{background:var(--amber)}
.ticks i.n{background:var(--late)}
.ticks i.here{background:var(--text);transform:scaleY(1.75)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px;max-width:720px}
.bar .pos{font:500 12px var(--mono);color:var(--faint);margin-left:auto}

.qs{display:grid;gap:14px;max-width:760px}
.qi{border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.006))}
.qi .qt{color:var(--text);margin:6px 0 12px}
.qi .opts{display:grid;gap:8px}
.qi .opt{text-align:left;width:100%;min-height:44px;padding:10px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surf);color:var(--soft);cursor:pointer;font:400 14.5px/1.45 var(--sans)}
.qi .opt:hover:not(:disabled){border-color:var(--line3);color:var(--text)}
.qi .opt:disabled{cursor:default}
.qi .opt.ok{border-color:rgba(232,178,92,.7);color:var(--text);background:rgba(232,178,92,.09)}
.qi .opt.no{border-color:rgba(232,131,111,.6);color:var(--text);background:rgba(232,131,111,.08)}
.qi .tfrow{display:flex;gap:8px}
.qi .tfrow .opt{width:auto;min-width:96px;text-align:center}
.qi .ex{margin-top:12px;color:var(--soft);font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.qi .ex .v{font:500 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;margin-right:8px}
.qi .ex .v.ok{color:var(--amber)}.qi .ex .v.no{color:var(--late)}
.qi .ex a{color:var(--muted)}
.score{max-width:760px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 18px}
.score .n{font:500 30px var(--mono);color:var(--text)}
.score .n small{font-size:14px;color:var(--faint)}

.gaps{display:grid;gap:22px;max-width:820px}
.gapst{border-top:1px solid var(--line2);padding-top:14px}
.gapst .hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.gapst .hd .big{font:400 italic 22px var(--gr)}
.gapst .hd a{margin-left:auto;font:500 13px var(--sans);color:var(--amber);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.gapst ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.gapst li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.gapst li .kind{font:500 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--late);display:block}
.gapst li .tx{color:var(--soft);font-size:14.5px}
.empty{max-width:640px;border:1px dashed var(--line3);border-radius:14px;padding:18px 20px;color:var(--soft)}

.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;max-width:1000px}
.nums div{padding:20px 22px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.nums div:nth-child(3n){border-right:0}
.nums .v{font:500 30px/1.1 var(--mono);color:var(--amber)}
.nums .l{color:var(--soft);font-size:13.5px;margin-top:6px}
.glance h3{font:400 italic 26px var(--gr);margin:44px 0 14px}
.glance .note{color:var(--muted);font-size:13.5px;margin:12px 0 0}
.pits{list-style:none;margin:0;padding:0;display:grid;gap:12px;max-width:820px}
.pits li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;color:var(--soft);align-items:start}
.pits li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--late);margin-top:10px;justify-self:center}
.pits a,.mlist a{font:500 12px var(--mono);color:var(--faint);text-decoration:none;white-space:nowrap;min-height:32px;display:inline-flex;align-items:center}
.pits a:hover,.mlist a:hover{color:var(--text)}
.idea{max-width:760px;font:400 italic 20px/1.6 var(--gr);color:var(--text);margin:0}
.mlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:1000px}
.mlist div{border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.mlist .k{font:500 13px var(--mono);letter-spacing:.1em;color:var(--amber)}
.mlist p{margin:6px 0 0;color:var(--soft);font-size:14px}

/* ── κίνηση εισόδου (μόνο κάτω από html.anim, πάντα με ορατή κατάληξη) ── */
html.anim .enter > *{animation:rise .55s var(--ease) both}
html.anim .enter > *:nth-child(2){animation-delay:.04s}html.anim .enter > *:nth-child(3){animation-delay:.08s}
html.anim .enter > *:nth-child(4){animation-delay:.12s}html.anim .enter > *:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html.anim .mapbox:not(.drawn) .edge.lit{stroke-dashoffset:0}
}

/* ── μόνο max-width ── */
@media (max-width:1040px){
  .st{grid-template-columns:minmax(0,1fr);gap:30px}
  aside .card{position:static}
}
@media (max-width:760px){
  .flow{grid-template-columns:minmax(0,1fr)}
  .flow .cn{width:1px;height:28px;margin:10px auto}
  .flow .cn::after{right:-3px;top:auto;bottom:-1px;border:3.5px solid transparent;border-top:6px solid var(--amber);border-bottom:0}
  .rep .stop{grid-template-columns:minmax(0,1fr);gap:4px}
  .rep .res{grid-template-columns:minmax(0,1fr);gap:4px}
  .rep .cost{padding-left:0}
  .split .cols{grid-template-columns:minmax(0,1fr);gap:18px}
  .split .bar{height:1px}
  .scl .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nums{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nums div:nth-child(3n){border-right:1px solid var(--line)}
  .nums div:nth-child(2n){border-right:0}
  .mlist{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  body{font-size:15px}
  .lbl,.dg .cap,.quote cite,.node text.n,.subnav button span,.scl .no{font-size:11px}
  .route{flex-wrap:wrap;gap:10px 12px;padding:14px 0}
  .crumbs{order:3;flex-basis:100%}
  .tabs{margin-left:auto}
  .tabs button{min-height:44px;padding:0 14px}
  .back{min-height:44px}
  .cover{grid-template-columns:minmax(0,1fr);gap:22px;padding:36px 0 40px}
  .seal{width:132px;height:132px}
  html.ret .seal{width:84px;height:84px}
  .map{padding:40px 0 36px}
  .h2,.st h2,.ck-head .say{font-size:28px}
  .num{font-size:84px;margin-bottom:-14px}
  .st{padding:44px 0 30px}
  .dg{padding:20px 16px 18px}
  .fork .heads,.fork .row{gap:14px}
  .dlg .lanes{gap:8px 12px}
  .lad .stp{padding:10px 8px 0}
  .lad .stp:nth-child(1){height:110px}.lad .stp:nth-child(2){height:170px}.lad .stp:nth-child(3){height:230px}
  .lad .big{font-size:17px}
  .rc{padding:22px 18px 20px}
  .rc .q{font-size:22px}
  .subnav{gap:18px}
  .gapst li{grid-template-columns:minmax(0,1fr)}
  .pits li{grid-template-columns:20px minmax(0,1fr)}
  .pits li a{grid-column:2}
  .scl .grid{grid-template-columns:minmax(0,1fr);gap:18px}
  .scl svg{max-width:170px}
  .scl .w{font-size:15.5px;max-width:300px;margin:4px auto 0}
  .scl .w span{white-space:nowrap}
}

","r":"Πλησίασε κάποιον από αυτούς που θεωρούνται σοφοί, πιστεύοντας πως έτσι θα ελέγξει το μαντείο και θα απαντήσει στον χρησμό πως αυτός είναι σοφότερος.","a":["πλησίασα κάποιον από αυτούς που θεωρούνται σοφοί","θα ελέγξω το μαντείο"]},{"id":"r07","s":2,"q":"Ποιος ήταν ο πρώτος που εξέτασε;","r":"Δεν λέει το όνομά του· πάντως ήταν ένας από τους πολιτικούς.","a":["πάντως ήταν ένας από τους πολιτικούς"]},{"id":"r08","s":2,"q":"Τι διαπίστωσε για εκείνον τον άνθρωπο;","r":"Πως φαινόταν σοφός στον κόσμο, και κυρίως στον ίδιο τον εαυτό του, αλλά σοφός δεν ήταν.","a":["φαινόταν σοφός στον κόσμο, και κυρίως στον ίδιο τον εαυτό του, αλλά σοφός δεν ήταν"]},{"id":"r09","s":2,"q":"Τι κέρδισε ο Σωκράτης όταν του το έδειξε;","r":"Και τούτος τον μίσησε, και πολλοί άλλοι απ’ όσους ήταν τότε μπροστά.","a":["και τούτος με μίσησε και πολλοί άλλοι απ' όσους ήταν τότε μπροστά"]},{"id":"r10","s":2,"q":"Σε τι ακριβώς είναι σοφότερος, με τα δικά του λόγια;","r":"Κανείς από τους δυο δεν ξέρει τίποτα καλό και σωστό· ο άλλος όμως νομίζει πως ξέρει κάτι χωρίς να ξέρει τίποτα, ενώ ο Σωκράτης δεν γνωρίζει τίποτα, αλλά τουλάχιστον δεν νομίζει πως ξέρει κάτι.","a":["κανείς από τους δυο μας δεν ξέρει τίποτα καλό και σωστό","αυτός όμως νομίζει πως ξέρει κάτι χωρίς να ξέρει τίποτα","δεν νομίζω πως ξέρω κάτι"]},{"id":"r11","s":2,"q":"Τι έγινε όταν πήγε στον επόμενο «σοφό»;","r":"Έφυγε με την ίδια εντύπωση και απόκτησε το μίσος και αυτού και άλλων πολλών.","a":["έφυγα όμως με την ίδια εντύπωση και απόκτησα το μίσος και αυτού και άλλων πολλών"]},{"id":"r12","s":3,"q":"Ποια δύο πράγματα μας επιτρέπει να κατανοήσουμε το απόσπασμα;","r":"Τα αντιφατικά αισθήματα που ενέπνευσε ο Σωκράτης στους συγχρόνους του, με αποτέλεσμα τη θανατική καταδίκη του, και τη φιλοσοφική στάση του.","a":["τα αντιφατικά αισθήματα που ενέπνευσε ο Σωκράτης στους συγχρόνους του","με αποτέλεσμα τη θανατική καταδίκη του","και τη φιλοσοφική στάση του"]},{"id":"r13","s":3,"q":"Γιατί ένας τέτοιος άνθρωπος κινεί το μίσος;","r":"Γιατί βάζει σκοπό της ζωής του να αποδείξει την άγνοια όσων σπουδαίων περνιούνται για σοφοί· κινεί το μίσος των θιγόμενων και των οπαδών τους. Ένας τέτοιος άνθρωπος είναι απειλή.","a":["βάζει σκοπό της ζωής του να αποδείξει την άγνοια όσων σπουδαίων περνιούνται για σοφοί","το μίσος των θιγόμενων και των οπαδών τους","Ένας τέτοιος άνθρωπος είναι απειλή"]},{"id":"r14","s":3,"q":"Γιατί τίθεται το ερώτημα αν είναι άθεος;","r":"Γιατί η ειρωνεία του έχει στόχο ακόμα και τον χρησμό του Απόλλωνα: ισχυριζόμενος πως δεν αξίζει τον τίτλο του σοφότατου, αμφισβητεί τη θεϊκή εκτίμηση και προσπαθεί να την «ελέγξει».","a":["η ειρωνεία του έχει στόχο ακόμα και τον χρησμό του Απόλλωνα","δεν αξίζει τον τίτλο του σοφότατου, αμφισβητεί τη θεϊκή εκτίμηση"]},{"id":"r15","s":4,"q":"Ήταν τελικά άθεος ο Σωκράτης;","r":"Όχι. Δεν ήταν άθεος, ήταν όμως είρωνας και έκανε την ειρωνεία όπλο της σκέψης, όπλο της αναζήτησης και της φιλοσοφικής έρευνας.","a":["Ο Σωκράτης δεν ήταν άθεος, ήταν όμως είρωνας","όπλο της σκέψης, όπλο της αναζήτησης και της φιλοσοφικής έρευνας"]},{"id":"r16","s":4,"q":"Σε τι έμοιαζε με τους σοφιστές;","r":"Ίσως στην αμφισβήτηση: κι αυτοί αρνούνταν να δεχτούν ως δεδομένες τις παραδεδεγμένες αλήθειες.","a":["Ίσως στην αμφισβήτηση να έμοιαζε πράγματι με τους σοφιστές","αρνούνταν να δεχτούν ως δεδομένες τις παραδεδεγμένες αλήθειες"]},{"id":"r17","s":4,"q":"Πού κατέληγε η αμφισβήτηση των σοφιστών, και με ποιο επιχείρημα;","r":"Στην άρνηση: αφού δεν μπορεί κανείς να ανακαλύψει την αλήθεια, αλήθεια δεν υπάρχει, κι αν υπάρχει, καμιά σημασία δεν έχει, διότι δεν μας επηρεάζει.","a":["κατέληγε στην άρνηση","αφού δεν μπορεί κανείς να ανακαλύψει την αλήθεια, αλήθεια δεν υπάρχει, κι αν υπάρχει, καμιά σημασία δεν έχει, διότι δεν μας επηρεάζει"]},{"id":"r18","s":4,"q":"Πώς χαρακτηρίζει το βιβλίο την αμφισβήτηση των σοφιστών;","r":"Πως γρήγορα καταλήγει τραγική αλλά και τερατώδης.","a":["γρήγορα καταλήγει τραγική αλλά και τερατώδης"]},{"id":"r19","s":4,"q":"Τι αντιπαραθέτει ο Σωκράτης σε αυτήν;","r":"Μια θετική αμφισβήτηση: αμφισβητώντας τις παραδοσιακές ιδέες και τις παραδοσιακές αρχές, αναζητά τη βαθύτερη αλήθεια των πραγμάτων.","a":["μια θετική αμφισβήτηση: αμφισβητώντας τις παραδοσιακές ιδέες και τις παραδοσιακές αρχές, αναζητά τη βαθύτερη αλήθεια των πραγμάτων"]},{"id":"r20","s":4,"q":"Ποια αλήθεια αναζητά «πολύ περισσότερο»;","r":"Την πρώτη αλήθεια, την αναλλοίωτη, που δεν επηρεάζεται από τις συνθήκες, που δεν εξαρτάται από τον άνθρωπο.","a":["την πρώτη αλήθεια, την αναλλοίωτη, που δεν επηρεάζεται από τις συνθήκες, που δεν εξαρτάται από τον άνθρωπο"]},{"id":"r21","s":5,"q":"Ποια ήταν τα δύο «όπλα» του;","r":"Η διαλεκτική και η μαιευτική.","a":["Τα όπλα του ήταν η διαλεκτική και η μαιευτική"]},{"id":"r22","s":5,"q":"Τι σημαίνει «διαλεκτική» και σε τι του χρησίμευε;","r":"Κατ’ αρχήν σημαίνει διάλογος, όχι όμως οποιαδήποτε συζήτηση. Ήταν το μέσο για τον έλεγχο και την εξαγωγή συμπερασμάτων.","a":["που κατ' αρχήν σημαίνει διάλογος","μέσο για τον έλεγχο και την εξαγωγή συμπερασμάτων","Δεν πρόκειται βέβαια για οποιαδήποτε συζήτηση"]},{"id":"r23","s":5,"q":"Δώσε τον ορισμό της σωκρατικής διαλεκτικής.","r":"Η σταδιακή, βήμα βήμα, αναίρεση των θέσεων του συνομιλητή και, στη συνέχεια, η επίσης σταδιακή προσπάθεια να εξαχθεί ένα νέο συμπέρασμα, μια νέα προσέγγιση της αλήθειας.","a":["αναίρεση των θέσεων του συνομιλητή","η επίσης σταδιακή προσπάθεια να εξαχθεί ένα νέο συμπέρασμα, μια νέα προσέγγιση της αλήθειας"]},{"id":"r24","s":5,"q":"Πώς ξεκινάει ένας πλατωνικός διάλογος;","r":"Ο συνομιλητής εκθέτει κατ’ αρχήν μίαν άποψη για το θέμα, την οποία ο ίδιος θεωρεί ολοκληρωμένη και θεμελιωμένη.","a":["εκθέτει κατ' αρχήν μίαν άποψη για το θέμα","την οποία ο ίδιος θεωρεί ολοκληρωμένη και θεμελιωμένη"]},{"id":"r25","s":5,"q":"Τι ερωτήσεις κάνει ο Σωκράτης και τι πετυχαίνει;","r":"Ερωτήσεις που φαντάζουν σχεδόν απλοϊκές. Εξαναγκάζει τον συνομιλητή να φτάσει στην ακραία συνέπεια των θέσεων που υποστήριξε, και εκεί αποδεικνύεται η σαθρότητα των λογικών επιχειρημάτων του.","a":["ερωτήσεις που φαντάζουν σχεδόν απλοϊκές","να φτάσει στην ακραία συνέπεια των θέσεων που υποστήριξε","αποδεικνύεται η σαθρότητα των λογικών επιχειρημάτων"]},{"id":"r26","s":5,"q":"Τι γίνεται μετά την αναίρεση;","r":"Αρχίζει μια νέα συζήτηση, όπου και πάλι καθοδηγώντας με ερωτήματα τον οδηγεί στη γενική αλήθεια, που υπάρχει ανεξαρτήτως των περιστάσεων και των συνθηκών, στην πρώτη αλήθεια των πραγμάτων.","a":["αρχίζει μια νέα συζήτηση","τον οδηγεί στη γενική αλήθεια","υπάρχει ανεξαρτήτως των περιστάσεων και των συνθηκών, στην πρώτη αλήθεια των πραγμάτων"]},{"id":"r27","s":5,"q":"Τι είναι «χαρακτηριστικό» για τον Σωκράτη των πλατωνικών διαλόγων;","r":"Δεν αποφαίνεται ο ίδιος εκ των προτέρων, δεν παραθέτει ο ίδιος εξαρχής κάποια θεωρία ή άποψη. Όλη η διανοητική προσπάθεια στρέφεται στο να εξαχθεί η σωκρατική άποψη από τον αντίπαλο.","a":["δεν αποφαίνεται ο ίδιος εκ των προτέρων, δεν παραθέτει ο ίδιος εξαρχής κάποια θεωρία ή άποψη","στρέφεται στο να εξαχθεί η σωκρατική άποψη από τον αντίπαλο"]},{"id":"r28","s":5,"q":"Τι είναι η μαιευτική, κυριολεκτικά;","r":"Η δουλειά της μαίας, της μαμής που συμπαραστέκεται και βοηθάει την ετοιμόγεννη γυναίκα στον τοκετό.","a":["η δουλειά της μαίας, της μαμής που συμπαραστέκεται και βοηθάει την ετοιμόγεννη γυναίκα στον τοκετό"]},{"id":"r29","s":5,"q":"Από πού πήρε το παράδειγμα της μαιευτικής;","r":"Από τη δουλειά της μητέρας του, που ήταν μαία.","a":["τη δουλειά της μητέρας του, που ήταν μαία"]},{"id":"r30","s":5,"q":"Τι ισχυριζόταν για τις φιλοσοφικές θεωρίες;","r":"Πως καμιά φιλοσοφική θεωρία δεν «γέννησε» ο ίδιος, αλλά πως, σαν μαία, βοηθάει τον συνομιλητή του να «γεννήσει» από μέσα του την αλήθεια.","a":["καμιά φιλοσοφική θεωρία δεν \"γέννησε\" ο ίδιος","σαν μαία, βοηθάει τον συνομιλητή του να \"γεννήσει\" από μέσα του την αλήθεια"]},{"id":"r31","s":5,"q":"Τι σημαίνει βαθύτερα η μαιευτική, και πού παραπέμπει το βιβλίο;","r":"Πως για τον Σωκράτη, όπως και για τον Πλάτωνα (εισαγωγή στον μύθο του σπηλαίου, σελ. 113), ο άνθρωπος γνωρίζει την αλήθεια, την Ιδέα, και η φιλοσοφική σκέψη τον βοηθάει να την ξαναθυμηθεί, να την επαναφέρει στη μνήμη του.","a":["όπως και για τον Πλάτωνα, δες εισαγωγή στον μύθο του σπηλαίου, σελ. 113","ο άνθρωπος γνωρίζει την αλήθεια, την Ιδέα","να την ξαναθυμηθεί, να την επαναφέρει στη μνήμη του"]},{"id":"r32","s":6,"q":"Τι σημαίνει ότι «κατέβασε τη φιλοσοφία από τα άστρα στη γη»;","r":"Πως οι φιλόσοφοι έπαψαν να ασχολούνται τόσο με τα φυσικά φαινόμενα, που έγιναν έκτοτε αντικείμενο της επιστήμης μάλλον παρά της φιλοσοφίας, όσο με τον ίδιο τον άνθρωπο και την κοινωνία του.","a":["οι φιλόσοφοι έπαψαν να ασχολούνται τόσο με τα φυσικά φαινόμενα","έγιναν έκτοτε αντικείμενο της επιστήμης μάλλον, παρά της φιλοσοφίας","όσο με τον ίδιο τον άνθρωπο και την κοινωνία του"]},{"id":"r33","s":6,"q":"Ποια είναι «η πολύ καλύτερη διατύπωση του Αριστοτέλη», και από πού;","r":"*«ἐπὶ Σωκράτους δὲ […], τὸ ζητεῖν τὰ περὶ φύσεως ἔληξε, περὶ δὲ τὴν χρήσιμον ἀρετὴν καὶ πολιτικὴν ἀπέκλιναν οἱ φιλοσοφοῦντες»* · *Περὶ ζῴων μορίων*, 642 a 28 κ.εξ.","a":["ἐπὶ Σωκράτους δὲ","τὸ ζητεῖν τὰ περὶ φύσεως ἔληξε, περὶ δὲ τὴν χρήσιμον ἀρετὴν καὶ πολιτικὴν ἀπέκλιναν οἱ φιλοσοφοῦντες","Περὶ ζῴων μορίων , 642 a 28 κ.εξ."]},{"id":"r34","s":6,"q":"Ήταν ο πρώτος που ασχολήθηκε με ηθικά και πολιτικά ζητήματα;","r":"Όχι. Με πολιτικά προβλήματα ασχολήθηκαν και οι προγενέστεροι φιλόσοφοι, ενώ ζητήματα ηθικής απασχόλησαν και τον Δημόκριτο και πολλούς σοφιστές. Ο Σωκράτης έστρεψε τον φιλοσοφικό στοχασμό κατ’ αποκλειστικότητα σε τέτοια θέματα.","a":["με πολιτικά προβλήματα ασχολήθηκαν και οι προγενέστεροι φιλόσοφοι, ενώ ζητήματα ηθικής απασχόλησαν και τον Δημόκριτο και πολλούς σοφιστές","έστρεψε τον φιλοσοφικό στοχασμό κατ' αποκλειστικότητα σε τέτοια θέματα"]},{"id":"r35","s":6,"q":"Πού πρέπει να αναζητηθεί ο λόγος που τα σωκρατικά ενδιαφέροντα σημάδεψαν ανεξίτηλα τη φιλοσοφία;","r":"Στον σωκρατικό τρόπο σκέψης: ο Σωκράτης δεν ενδιαφερόταν απλώς για τον ορθό τρόπο ζωής και δράσης, είτε στο προσωπικό είτε στο κοινωνικό επίπεδο.","a":["πρέπει να αναζητηθεί στον σωκρατικό τρόπο σκέψης","δεν ενδιαφερόταν απλώς για τον ορθό τρόπο ζωής και δράσης είτε στο προσωπικό είτε στο κοινωνικό επίπεδο"]},{"id":"r36","s":6,"q":"Πώς διαφέρει από τους σοφιστές ως προς το ενδιαφέρον για τα ίδια θέματα;","r":"Το ενδιαφέρον των σοφιστών ήταν εντελώς χρησιμοθηρικό. Ο Σωκράτης αναζήτησε ένα σταθερό έδαφος, πάνω στο οποίο να καθοριστεί αυστηρά και αμετάκλητα κάθε έννοια καλού, αρετής και σοφίας.","a":["ήταν εντελώς χρησιμοθηρικό","ο Σωκράτης αναζήτησε ένα σταθερό έδαφος πάνω στο οποίο να καθοριστεί αυστηρά και αμετάκλητα κάθε έννοια καλού, αρετής και σοφίας"]},{"id":"r37","s":6,"q":"Ποια είναι η αναλογία με τους πρώτους φιλοσόφους;","r":"Όπως οι πρώτοι φιλόσοφοι αναζητούσαν την πρώτη αρχή της δημιουργίας, ο Σωκράτης αναζήτησε την αρχή κάθε ηθικής έννοιας, που δεν επηρεάζεται από ιστορικές και κοινωνικές συνθήκες ούτε από τη δυνατότητα αντίληψης του κάθε ανθρώπου.","a":["Όπως οι πρώτοι φιλόσοφοι αναζητούσαν την πρώτη αρχή της δημιουργίας, ο Σωκράτης αναζήτησε την αρχή κάθε ηθικής έννοιας","δεν επηρεάζεται από ιστορικές και κοινωνικές συνθήκες ούτε από τη δυνατότητα αντίληψης του κάθε ανθρώπου"]},{"id":"r38","s":6,"q":"Τι αναζήτησε, σε μία γραμμή;","r":"Το απόλυτο απορρίπτοντας το σχετικό, την ουσία της ηθικής και όχι τα ηθικά φαινόμενα.","a":["το απόλυτο απορρίπτοντας το σχετικό, την ουσία της ηθικής και όχι τα ηθικά φαινόμενα"]},{"id":"r39","s":7,"q":"Ποιος ήταν ο «δρόμος» του, με τον αρχαίο όρο, και πού το λέει ο Αριστοτέλης;","r":"Η επαγωγική μέθοδος, οι *ἐπακτικοὶ λόγοι*, με σκοπό την εξαγωγή καθολικών ορισμών, το *ὁρίζεσθαι καθόλου* · *Μετὰ τὰ φυσικά*, 1078 b 27 κ.εξ.","a":["ήταν η επαγωγική μέθοδος (οι ἐπακτικοὶ λόγοι )","με σκοπό την εξαγωγή καθολικών ορισμών (το ὁρίζεσθαι καθόλου )","Μετὰ τὰ φυσικά , 1078 b 27 κ.εξ."]},{"id":"r40","s":7,"q":"Πώς δουλεύει η επαγωγική μέθοδος;","r":"Ξεκινώντας από παραδείγματα, συνήθως παρμένα από την καθημερινή ζωή και εμπειρία, οδηγεί τη σκέψη του συνομιλητή στην εξαγωγή καθολικών συμπερασμάτων, που να ξεπερνούν την εμπειρία και να φθάνουν σε μια απόλυτη γνώση του θέματος.","a":["Ξεκινώντας δηλαδή από παραδείγματα, συνήθως παρμένα από την καθημερινή ζωή και εμπειρία","στην εξαγωγή καθολικών συμπερασμάτων, που να ξεπερνούν την εμπειρία και να φθάνουν σε μια απόλυτη γνώση του θέματος"]},{"id":"r41","s":7,"q":"Πότε η διαδικασία «είχε επιτυχία»;","r":"Όταν προέκυπτε τελικά ένας απόλυτος ορισμός, δηλαδή μια απόλυτη γνώση.","a":["είχε επιτυχία όταν προέκυπτε τελικά ένας απόλυτος ορισμός, δηλαδή μια απόλυτη γνώση"]},{"id":"r42","s":8,"q":"Ποια είναι τα έξι ζεύγη εννοιών, με τη σειρά του βιβλίου;","r":"Του καλού και του κακού · της αδικίας και του δικαίου · της ομορφιάς και της ασχήμιας · της σωφροσύνης και της άνοιας · του θάρρους και της δειλίας · της ορθής διακυβέρνησης και της δεσποτείας.","a":["του καλού και του κακού, της αδικίας και του δικαίου, της ομορφιάς και της ασχήμιας, της σωφροσύνης και της άνοιας, του θάρρους και της δειλίας, της ορθής διακυβέρνησης και της δεσποτείας"]},{"id":"r43","s":8,"q":"Ποιο είναι το τελικό συμπέρασμα του κεφαλαίου;","r":"Ο άνθρωπος που ισχυριζόταν πως το μόνο πράγμα που γνωρίζει είναι η ίδια του η άγνοια σημάδεψε οριστικά την πορεία της φιλοσοφίας, υποδεικνύοντας πως η λογική σκέψη και όχι οι αισθήσεις είναι ο μοναδικός οδηγός προς την αλήθεια, προς το καθολικό και το αιώνιο.","a":["ο άνθρωπος που ισχυριζόταν πως το μόνο πράγμα που γνωρίζει είναι η ίδια του η άγνοια, σημάδεψε οριστικά την πορεία της φιλοσοφίας","η λογική σκέψη και όχι οι αισθήσεις είναι ο μοναδικός οδηγός προς την αλήθεια, προς το καθολικό και το αιώνιο"]}],"tf":[{"id":"t01","s":1,"ok":true,"t":"Ο Χαιρεφών ζήτησε από τον θεό των Δελφών να του υποδείξει τον σοφότερο άνθρωπο.","why":"Σωστό. Ο Χαιρεφών, φίλος του Σωκράτη, πήγε στο μαντείο των Δελφών και ζήτησε από τον θεό να του υποδείξει τον σοφότερο άνθρωπο.","a":["ζήτησε από τον θεό να του υποδείξει τον σοφότερο άνθρωπο"]},{"id":"t02","s":1,"ok":false,"t":"Ο χρησμός ολόκληρος («Σοφὸς Σοφοκλῆς…») παρατίθεται μέσα στο απόσπασμα της Ἀπολογίας.","why":"Λάθος. Τον δίνει η υποσημείωση του βιβλίου, σύμφωνα με μία μεταγενέστερη πληροφορία.","a":["Σύμφωνα με μία μεταγενέστερη πληροφορία, ο χρησμός έλεγε"]},{"id":"t03","s":2,"ok":true,"t":"Ο πρώτος που εξέτασε ο Σωκράτης ήταν ένας από τους πολιτικούς.","why":"Σωστό. «Δεν θα πω το όνομά του, πάντως ήταν ένας από τους πολιτικούς».","a":["δεν θα πω το όνομά του, πάντως ήταν ένας από τους πολιτικούς"]},{"id":"t04","s":2,"ok":false,"t":"Ο Σωκράτης λέει το όνομα του πρώτου «σοφού» που εξέτασε.","why":"Λάθος. «Δεν θα πω το όνομά του»· λέει μόνο ότι ήταν ένας από τους πολιτικούς.","a":["δεν θα πω το όνομά του, πάντως ήταν ένας από τους πολιτικούς"]},{"id":"t05","s":2,"ok":true,"t":"Κατά τον Σωκράτη, κανείς από τους δύο δεν ξέρει τίποτα καλό και σωστό· η διαφορά είναι ότι εκείνος δεν νομίζει πως ξέρει.","why":"Σωστό. Ο άλλος νομίζει πως ξέρει κάτι χωρίς να ξέρει τίποτα· ο Σωκράτης τουλάχιστον δεν νομίζει πως ξέρει κάτι.","a":["κανείς από τους δυο μας δεν ξέρει τίποτα καλό και σωστό","δεν νομίζω πως ξέρω κάτι"]},{"id":"t06","s":3,"ok":true,"t":"Η ειρωνεία του Σωκράτη είχε στόχο ακόμα και τον χρησμό του Απόλλωνα.","why":"Σωστό. Ισχυριζόμενος πως δεν αξίζει τον τίτλο του σοφότατου, αμφισβητεί τη θεϊκή εκτίμηση.","a":["η ειρωνεία του έχει στόχο ακόμα και τον χρησμό του Απόλλωνα","δεν αξίζει τον τίτλο του σοφότατου, αμφισβητεί τη θεϊκή εκτίμηση"]},{"id":"t07","s":3,"ok":false,"t":"Κατά το βιβλίο, το απόσπασμα της Ἀπολογίας φωτίζει μόνο τη φιλοσοφική στάση του Σωκράτη.","why":"Λάθος. Φωτίζει δύο πράγματα: τα αντιφατικά αισθήματα που ενέπνευσε στους συγχρόνους του, με αποτέλεσμα τη θανατική καταδίκη του, και τη φιλοσοφική στάση του.","a":["τα αντιφατικά αισθήματα που ενέπνευσε ο Σωκράτης στους συγχρόνους του","με αποτέλεσμα τη θανατική καταδίκη του","και τη φιλοσοφική στάση του"]},{"id":"t08","s":4,"ok":false,"t":"Ο Σωκράτης ήταν άθεος, όπως ισχυρίστηκαν οι κατήγοροί του.","why":"Λάθος. Ο Σωκράτης δεν ήταν άθεος, ήταν όμως είρωνας· το «άθεος» είναι ο ισχυρισμός των κατηγόρων του.","a":["Ο Σωκράτης δεν ήταν άθεος, ήταν όμως είρωνας","όπως ισχυρίστηκαν οι κατήγοροί του"]},{"id":"t09","s":4,"ok":false,"t":"Οι σοφιστές δέχονταν ως δεδομένες τις παραδεδεγμένες αλήθειες.","why":"Λάθος. Κι αυτοί αρνούνταν να δεχτούν ως δεδομένες τις παραδεδεγμένες αλήθειες· σε αυτό έμοιαζαν με τον Σωκράτη.","a":["Κι αυτοί αρνούνταν να δεχτούν ως δεδομένες τις παραδεδεγμένες αλήθειες"]},{"id":"t10","s":4,"ok":true,"t":"Η αμφισβήτηση των σοφιστών κατέληγε στην άρνηση.","why":"Σωστό. Αφού δεν μπορεί κανείς να ανακαλύψει την αλήθεια, αλήθεια δεν υπάρχει.","a":["η αμφισβήτησή τους κατέληγε στην άρνηση","αφού δεν μπορεί κανείς να ανακαλύψει την αλήθεια, αλήθεια δεν υπάρχει"]},{"id":"t11","s":4,"ok":false,"t":"Ο Σωκράτης αναζητά μια αλήθεια που εξαρτάται από τις συνθήκες και από τον άνθρωπο.","why":"Λάθος. Αναζητά την πρώτη αλήθεια, την αναλλοίωτη, που δεν επηρεάζεται από τις συνθήκες, που δεν εξαρτάται από τον άνθρωπο.","a":["την πρώτη αλήθεια, την αναλλοίωτη, που δεν επηρεάζεται από τις συνθήκες, που δεν εξαρτάται από τον άνθρωπο"]},{"id":"t12","s":5,"ok":true,"t":"Η διαλεκτική κατ’ αρχήν σημαίνει διάλογος, όχι όμως οποιαδήποτε συζήτηση.","why":"Σωστό. Η σωκρατική διαλεκτική είναι η σταδιακή αναίρεση των θέσεων του συνομιλητή και μετά η σταδιακή εξαγωγή νέου συμπεράσματος.","a":["που κατ' αρχήν σημαίνει διάλογος","Δεν πρόκειται βέβαια για οποιαδήποτε συζήτηση","αναίρεση των θέσεων του συνομιλητή"]},{"id":"t13","s":5,"ok":false,"t":"Στους πλατωνικούς διαλόγους ο Σωκράτης παραθέτει εξαρχής τη δική του θεωρία.","why":"Λάθος. Δεν αποφαίνεται ο ίδιος εκ των προτέρων, δεν παραθέτει ο ίδιος εξαρχής κάποια θεωρία ή άποψη.","a":["δεν αποφαίνεται ο ίδιος εκ των προτέρων, δεν παραθέτει ο ίδιος εξαρχής κάποια θεωρία ή άποψη"]},{"id":"t14","s":5,"ok":true,"t":"Το όνομα «μαιευτική» το έδωσε ο ίδιος ο Σωκράτης.","why":"Σωστό. «Πρόκειται για αυτό που ο ίδιος ο Σωκράτης ονόμαζε μαιευτική».","a":["ο ίδιος ο Σωκράτης ονόμαζε μαιευτική"]},{"id":"t15","s":5,"ok":true,"t":"Η μητέρα του Σωκράτη ήταν μαία.","why":"Σωστό. Από τη δουλειά της μητέρας του πήρε το παράδειγμα της μαιευτικής.","a":["τη δουλειά της μητέρας του, που ήταν μαία"]},{"id":"t16","s":5,"ok":true,"t":"Για τον Σωκράτη, όπως και για τον Πλάτωνα, ο άνθρωπος γνωρίζει την αλήθεια και η φιλοσοφική σκέψη τον βοηθάει να την ξαναθυμηθεί.","why":"Σωστό. Ο άνθρωπος γνωρίζει την αλήθεια, την Ιδέα, και η φιλοσοφική σκέψη τον βοηθάει να την επαναφέρει στη μνήμη του.","a":["ο άνθρωπος γνωρίζει την αλήθεια, την Ιδέα","να την ξαναθυμηθεί, να την επαναφέρει στη μνήμη του"]},{"id":"t17","s":6,"ok":false,"t":"Ο Σωκράτης ήταν ο πρώτος φιλόσοφος που ασχολήθηκε με ζητήματα ηθικής.","why":"Λάθος. Ζητήματα ηθικής απασχόλησαν και τον Δημόκριτο και πολλούς σοφιστές· ο Σωκράτης έστρεψε τον στοχασμό σε αυτά κατ’ αποκλειστικότητα.","a":["ζητήματα ηθικής απασχόλησαν και τον Δημόκριτο και πολλούς σοφιστές","έστρεψε τον φιλοσοφικό στοχασμό κατ' αποκλειστικότητα σε τέτοια θέματα"]},{"id":"t18","s":6,"ok":true,"t":"Τα φυσικά φαινόμενα έγιναν έκτοτε αντικείμενο της επιστήμης μάλλον, παρά της φιλοσοφίας.","why":"Σωστό. Αυτό σημαίνει ότι «κατέβασε τη φιλοσοφία από τα άστρα στη γη».","a":["έγιναν έκτοτε αντικείμενο της επιστήμης μάλλον, παρά της φιλοσοφίας","κατέβασε τη φιλοσοφία από τα άστρα στη γη"]},{"id":"t19","s":6,"ok":true,"t":"Το ενδιαφέρον των σοφιστών για τα ηθικά θέματα ήταν εντελώς χρησιμοθηρικό.","why":"Σωστό. Αντίθετα, ο Σωκράτης αναζήτησε ένα σταθερό έδαφος για κάθε έννοια καλού, αρετής και σοφίας.","a":["ήταν εντελώς χρησιμοθηρικό","ο Σωκράτης αναζήτησε ένα σταθερό έδαφος"]},{"id":"t20","s":6,"ok":false,"t":"Ο Σωκράτης αναζήτησε το σχετικό, τα ηθικά φαινόμενα.","why":"Λάθος. Αναζήτησε το απόλυτο απορρίπτοντας το σχετικό, την ουσία της ηθικής και όχι τα ηθικά φαινόμενα.","a":["το απόλυτο απορρίπτοντας το σχετικό, την ουσία της ηθικής και όχι τα ηθικά φαινόμενα"]},{"id":"t21","s":7,"ok":true,"t":"Το «ὁρίζεσθαι καθόλου» είναι ο σκοπός της επαγωγικής μεθόδου.","why":"Σωστό. Η επαγωγική μέθοδος (οι ἐπακτικοὶ λόγοι) έχει σκοπό την εξαγωγή καθολικών ορισμών (το ὁρίζεσθαι καθόλου).","a":["με σκοπό την εξαγωγή καθολικών ορισμών (το ὁρίζεσθαι καθόλου )"]},{"id":"t22","s":7,"ok":false,"t":"Η επαγωγική μέθοδος ξεκινά από καθολικούς ορισμούς και καταλήγει σε παραδείγματα.","why":"Λάθος. Ξεκινά από παραδείγματα, συνήθως παρμένα από την καθημερινή ζωή και εμπειρία, και φτάνει σε καθολικά συμπεράσματα.","a":["Ξεκινώντας δηλαδή από παραδείγματα, συνήθως παρμένα από την καθημερινή ζωή και εμπειρία","καθολικών συμπερασμάτων"]},{"id":"t23","s":7,"ok":false,"t":"Για την επαγωγική μέθοδο το βιβλίο παραπέμπει στο Περὶ ζῴων μορίων του Αριστοτέλη.","why":"Λάθος. Για την επαγωγική μέθοδο παραπέμπει στο Μετὰ τὰ φυσικά, 1078 b 27· το Περὶ ζῴων μορίων είναι για το «από τα άστρα στη γη».","a":["Μετὰ τὰ φυσικά , 1078 b 27 κ.εξ.","Περὶ ζῴων μορίων , 642 a 28 κ.εξ."]},{"id":"t24","s":8,"ok":false,"t":"Κατά το κεφάλαιο, οι αισθήσεις είναι ο μοναδικός οδηγός προς την αλήθεια.","why":"Λάθος. Η λογική σκέψη και όχι οι αισθήσεις είναι ο μοναδικός οδηγός προς την αλήθεια, προς το καθολικό και το αιώνιο.","a":["η λογική σκέψη και όχι οι αισθήσεις είναι ο μοναδικός οδηγός προς την αλήθεια"]}],"mc":[{"id":"m01","s":1,"q":"Ποιο είναι το μότο του κεφαλαίου;","o":["Γνῶθι σαυτόν","Ἓν οἶδα, ὅτι οὐδὲν οἶδα","Πάντων χρημάτων μέτρον ἄνθρωπος","Ὁ ἀνεξέταστος βίος οὐ βιωτός"],"ok":1,"why":"«Ἓν οἶδα, ὅτι οὐδὲν οἶδα»: ένα ξέρω, ότι δεν ξέρω τίποτα.","a":["Ἓν οἶδα, ὅτι οὐδὲν οἶδα."]},{"id":"m02","s":2,"q":"Από πού είναι το απόσπασμα του κεφαλαίου;","o":["Πλάτων, Ἀπολογία 20-21","Ξενοφών, Ἀπομνημονεύματα","Πλάτων, Κρίτων","Αριστοτέλης, Μετὰ τὰ φυσικά"],"ok":0,"why":"Από την πλατωνική Ἀπολογία, 20-21.","a":["την πλατωνική Ἀπολογία","Ἀπολογία , 20-21"]},{"id":"m03","s":1,"q":"Ποιος πήγε στο μαντείο των Δελφών;","o":["Ο Κριτίας","Ο Αλκιβιάδης","Ο Χαιρεφών","Ο Μέλητος"],"ok":2,"why":"Ο Χαιρεφών, φίλος του Σωκράτη· ζήτησε από τον θεό να του υποδείξει τον σοφότερο άνθρωπο.","a":["Ο Χαιρεφών, φίλος του Σωκράτη","να του υποδείξει τον σοφότερο άνθρωπο"]},{"id":"m04","s":2,"q":"Ποιες δύο σκέψεις συγκρούονται στην αρχή του αποσπάσματος;","o":["Ότι είναι σοφός και ότι οι άλλοι δεν είναι","Ότι ξέρει πως σοφός δεν είναι και ότι ο θεός δεν μπορεί να ψεύδεται","Ότι το μαντείο ψεύδεται και ότι ο ίδιος ξέρει","Ότι οι πολιτικοί είναι σοφοί και οι άλλοι όχι"],"ok":1,"why":"«Εγώ ξέρω ότι σοφός δεν είμαι, ούτε πολύ ούτε λίγο» και «ο θεός όμως δεν είναι δυνατόν να ψεύδεται».","a":["εγώ ξέρω ότι σοφός δεν είμαι, ούτε πολύ ούτε λίγο","ο θεός όμως δεν είναι δυνατόν να ψεύδεται"]},{"id":"m05","s":2,"q":"Ποιος ήταν ο πρώτος άνθρωπος που εξέτασε ο Σωκράτης;","o":["Ένας ποιητής","Ένας χειροτέχνης","Ένας από τους πολιτικούς","Ένας ιερέας"],"ok":2,"why":"Δεν λέει το όνομά του· «πάντως ήταν ένας από τους πολιτικούς».","a":["πάντως ήταν ένας από τους πολιτικούς"]},{"id":"m06","s":2,"q":"Τι συμπέρανε ο Σωκράτης για εκείνον;","o":["Ήταν σοφός αλλά το έκρυβε","Φαινόταν σοφός στον κόσμο και κυρίως στον ίδιο τον εαυτό του, αλλά σοφός δεν ήταν","Ήταν σοφότερος από τον Σωκράτη","Αδιαφορούσε για τη σοφία"],"ok":1,"why":"Και επειδή ο Σωκράτης προσπάθησε να του το δείξει, «και τούτος με μίσησε».","a":["φαινόταν σοφός στον κόσμο, και κυρίως στον ίδιο τον εαυτό του, αλλά σοφός δεν ήταν","και τούτος με μίσησε"]},{"id":"m07","s":2,"q":"Σε τι στηρίζει ο Σωκράτης την υπεροχή του;","o":["Ξέρει περισσότερα","Δεν νομίζει πως ξέρει κάτι που δεν ξέρει","Έχει τον χρησμό με το μέρος του","Έχει μαθητές"],"ok":1,"why":"Ο άλλος νομίζει πως ξέρει κάτι χωρίς να ξέρει τίποτα· εκείνος τουλάχιστον δεν νομίζει πως ξέρει κάτι.","a":["αυτός όμως νομίζει πως ξέρει κάτι χωρίς να ξέρει τίποτα","δεν νομίζω πως ξέρω κάτι"]},{"id":"m08","s":3,"q":"Τι μας επιτρέπει να κατανοήσουμε το απόσπασμα, κατά το βιβλίο;","o":["Μόνο τη φιλοσοφική στάση του","Μόνο τα αίτια της δίκης","Τα αντιφατικά αισθήματα των συγχρόνων του και τη φιλοσοφική στάση του","Τη σχέση του με τον Πλάτωνα"],"ok":2,"why":"Και τα δύο: τα αντιφατικά αισθήματα (με αποτέλεσμα τη θανατική καταδίκη του) και τη φιλοσοφική στάση του.","a":["τα αντιφατικά αισθήματα που ενέπνευσε ο Σωκράτης στους συγχρόνους του","με αποτέλεσμα τη θανατική καταδίκη του","και τη φιλοσοφική στάση του"]},{"id":"m09","s":3,"q":"Γιατί ένας τέτοιος άνθρωπος είναι «απειλή»;","o":["Γιατί δίδασκε επί πληρωμή","Γιατί έβαζε σκοπό της ζωής του να αποδείξει την άγνοια όσων περνιούνται για σοφοί","Γιατί ήταν πολιτικός","Γιατί έγραφε εναντίον τους"],"ok":1,"why":"Γι’ αυτό κινούσε το μίσος των θιγόμενων και των οπαδών τους.","a":["βάζει σκοπό της ζωής του να αποδείξει την άγνοια όσων σπουδαίων περνιούνται για σοφοί","το μίσος των θιγόμενων και των οπαδών τους"]},{"id":"m10","s":3,"q":"Γιατί φτάνει το βιβλίο να ρωτήσει αν ήταν άθεος;","o":["Γιατί δεν συμμετείχε στις τελετές","Γιατί η ειρωνεία του είχε στόχο ακόμα και τον χρησμό του Απόλλωνα","Γιατί αρνιόταν την ύπαρξη των θεών","Γιατί λάτρευε ξένους θεούς"],"ok":1,"why":"Αμφισβητούσε τη θεϊκή εκτίμηση και προσπαθούσε να την «ελέγξει».","a":["η ειρωνεία του έχει στόχο ακόμα και τον χρησμό του Απόλλωνα","αμφισβητεί τη θεϊκή εκτίμηση"]},{"id":"m11","s":4,"q":"Τι ήταν, κατά το βιβλίο, ο Σωκράτης;","o":["Άθεος","Σοφιστής","Είρωνας, που έκανε την ειρωνεία όπλο της σκέψης","Ρήτορας"],"ok":2,"why":"«Ο Σωκράτης δεν ήταν άθεος, ήταν όμως είρωνας».","a":["Ο Σωκράτης δεν ήταν άθεος, ήταν όμως είρωνας","έκανε την ειρωνεία όπλο της σκέψης"]},{"id":"m12","s":4,"q":"Σε τι έμοιαζε με τους σοφιστές;","o":["Στη διδασκαλία επί αμοιβή","Στην αμφισβήτηση των παραδεδεγμένων αληθειών","Στη ρητορική δεινότητα","Στο ενδιαφέρον για τη φύση"],"ok":1,"why":"Κι αυτοί αρνούνταν να δεχτούν ως δεδομένες τις παραδεδεγμένες αλήθειες· εκεί σταματάει η ομοιότητα.","a":["Ίσως στην αμφισβήτηση να έμοιαζε πράγματι με τους σοφιστές","αρνούνταν να δεχτούν ως δεδομένες τις παραδεδεγμένες αλήθειες"]},{"id":"m13","s":4,"q":"Πού κατέληγε η αμφισβήτηση των σοφιστών;","o":["Στην άρνηση: αλήθεια δεν υπάρχει, κι αν υπάρχει δεν μας επηρεάζει","Στην αναζήτηση της πρώτης αλήθειας","Στη θρησκευτική πίστη","Στη μαιευτική"],"ok":0,"why":"Γι’ αυτό το βιβλίο τη λέει τραγική αλλά και τερατώδη.","a":["η αμφισβήτησή τους κατέληγε στην άρνηση","αλήθεια δεν υπάρχει, κι αν υπάρχει, καμιά σημασία δεν έχει, διότι δεν μας επηρεάζει","τραγική αλλά και τερατώδης"]},{"id":"m14","s":4,"q":"Πώς χαρακτηρίζει το βιβλίο την αμφισβήτηση των σοφιστών;","o":["Γόνιμη","Χρήσιμη","Τραγική αλλά και τερατώδη","Επιστημονική"],"ok":2,"why":"«Γρήγορα καταλήγει τραγική αλλά και τερατώδης».","a":["γρήγορα καταλήγει τραγική αλλά και τερατώδης"]},{"id":"m15","s":4,"q":"Τι αντιπαραθέτει ο Σωκράτης στην αμφισβήτηση των σοφιστών;","o":["Μια θετική αμφισβήτηση","Την πίστη στους θεούς","Τη ρητορική","Τη σιωπή"],"ok":0,"why":"Αμφισβητώντας τις παραδοσιακές ιδέες και αρχές, αναζητά τη βαθύτερη αλήθεια των πραγμάτων.","a":["μια θετική αμφισβήτηση","αναζητά τη βαθύτερη αλήθεια των πραγμάτων"]},{"id":"m16","s":4,"q":"Ποια αλήθεια αναζητά ο Σωκράτης;","o":["Την ωφέλιμη","Την πρώτη, την αναλλοίωτη, που δεν εξαρτάται από τον άνθρωπο","Τη σχετική, ανάλογα με τις συνθήκες","Την αλήθεια των αισθήσεων"],"ok":1,"why":"Που δεν επηρεάζεται από τις συνθήκες και δεν εξαρτάται από τον άνθρωπο.","a":["την πρώτη αλήθεια, την αναλλοίωτη","δεν επηρεάζεται από τις συνθήκες, που δεν εξαρτάται από τον άνθρωπο"]},{"id":"m17","s":5,"q":"Ποια ήταν τα δύο «όπλα» του Σωκράτη;","o":["Η ρητορική και η ειρωνεία","Η διαλεκτική και η μαιευτική","Η επαγωγή και η παραγωγή","Ο μύθος και ο λόγος"],"ok":1,"why":"«Τα όπλα του ήταν η διαλεκτική και η μαιευτική».","a":["Τα όπλα του ήταν η διαλεκτική και η μαιευτική"]},{"id":"m18","s":5,"q":"Τι σημαίνει κατ’ αρχήν «διαλεκτική»;","o":["Διάλογος","Απόδειξη","Ορισμός","Ανάμνηση"],"ok":0,"why":"Αλλά δεν πρόκειται βέβαια για οποιαδήποτε συζήτηση.","a":["που κατ' αρχήν σημαίνει διάλογος","Δεν πρόκειται βέβαια για οποιαδήποτε συζήτηση"]},{"id":"m19","s":5,"q":"Ποιος είναι ο ορισμός της σωκρατικής διαλεκτικής;","o":["Η άμεση παράθεση της αλήθειας","Η σταδιακή αναίρεση των θέσεων του συνομιλητή και μετά η σταδιακή εξαγωγή νέου συμπεράσματος","Η ρητορική αντιπαράθεση δύο λόγων","Η συλλογή παραδειγμάτων"],"ok":1,"why":"Δύο μισά: αναίρεση βήμα βήμα, μετά μια νέα προσέγγιση της αλήθειας.","a":["αναίρεση των θέσεων του συνομιλητή","να εξαχθεί ένα νέο συμπέρασμα, μια νέα προσέγγιση της αλήθειας"]},{"id":"m20","s":5,"q":"Τι κάνει ο συνομιλητής στην αρχή του διαλόγου;","o":["Ρωτάει τον Σωκράτη","Εκθέτει μια άποψη που ο ίδιος θεωρεί ολοκληρωμένη και θεμελιωμένη","Σωπαίνει","Δίνει καθολικό ορισμό"],"ok":1,"why":"Και αυτή τη βεβαιότητα αναιρεί ο Σωκράτης βήμα βήμα.","a":["εκθέτει κατ' αρχήν μίαν άποψη","την οποία ο ίδιος θεωρεί ολοκληρωμένη και θεμελιωμένη"]},{"id":"m21","s":5,"q":"Τι είδους είναι οι ερωτήσεις του Σωκράτη;","o":["Πολύπλοκες και τεχνικές","Ρητορικές","Φαντάζουν σχεδόν απλοϊκές","Γραπτές"],"ok":2,"why":"Και όμως εξαναγκάζουν τον συνομιλητή να φτάσει στην ακραία συνέπεια των θέσεών του.","a":["Με ερωτήσεις που φαντάζουν σχεδόν απλοϊκές","να φτάσει στην ακραία συνέπεια των θέσεων"]},{"id":"m22","s":5,"q":"Τι αποδεικνύεται στην «ακραία συνέπεια» των θέσεων του συνομιλητή;","o":["Η αλήθεια τους","Η σαθρότητα των λογικών επιχειρημάτων που χρησιμοποίησε","Η άγνοια του Σωκράτη","Η ανάγκη για νέο δάσκαλο"],"ok":1,"why":"Από εκεί αρχίζει μια νέα συζήτηση.","a":["αποδεικνύεται η σαθρότητα των λογικών επιχειρημάτων","αρχίζει μια νέα συζήτηση"]},{"id":"m23","s":5,"q":"Πού οδηγεί τελικά ο Σωκράτης τον συνομιλητή;","o":["Στη γενική αλήθεια, που υπάρχει ανεξαρτήτως περιστάσεων και συνθηκών","Στην παραδοχή της ήττας","Στη δική του θεωρία, που την είχε πει από την αρχή","Στη σιωπή"],"ok":0,"why":"«Στην πρώτη αλήθεια των πραγμάτων».","a":["τον οδηγεί στη γενική αλήθεια","στην πρώτη αλήθεια των πραγμάτων"]},{"id":"m24","s":5,"q":"Τι είναι «χαρακτηριστικό» για τον Σωκράτη των πλατωνικών διαλόγων;","o":["Ότι αποφαίνεται πρώτος","Ότι δεν αποφαίνεται εκ των προτέρων ούτε παραθέτει εξαρχής θεωρία","Ότι γράφει τα συμπεράσματα","Ότι απευθύνεται στο πλήθος"],"ok":1,"why":"Όλη η προσπάθεια στρέφεται στο να εξαχθεί η σωκρατική άποψη από τον αντίπαλο.","a":["δεν αποφαίνεται ο ίδιος εκ των προτέρων","να εξαχθεί η σωκρατική άποψη από τον αντίπαλο"]},{"id":"m25","s":5,"q":"Τι είναι κυριολεκτικά η μαιευτική;","o":["Η τέχνη του ρήτορα","Η δουλειά της μαίας, που βοηθάει την ετοιμόγεννη γυναίκα στον τοκετό","Η τέχνη του ορισμού","Η θεραπεία του σώματος"],"ok":1,"why":"Ο Σωκράτης πήρε το παράδειγμα από τη δουλειά της μητέρας του, που ήταν μαία.","a":["η δουλειά της μαίας","βοηθάει την ετοιμόγεννη γυναίκα στον τοκετό","τη δουλειά της μητέρας του, που ήταν μαία"]},{"id":"m26","s":5,"q":"Τι ισχυριζόταν ο Σωκράτης για τις φιλοσοφικές θεωρίες;","o":["Πως τις γέννησε όλες ο ίδιος","Πως καμιά δεν «γέννησε» ο ίδιος· βοηθάει τον άλλον να «γεννήσει» από μέσα του την αλήθεια","Πως δεν υπάρχουν θεωρίες","Πως τις πήρε από τους σοφιστές"],"ok":1,"why":"Αυτό ακριβώς είναι η μαιευτική: καμιά φιλοσοφική θεωρία δεν «γέννησε» ο ίδιος.","a":["καμιά φιλοσοφική θεωρία δεν \"γέννησε\" ο ίδιος","βοηθάει τον συνομιλητή του να \"γεννήσει\" από μέσα του την αλήθεια"]},{"id":"m27","s":5,"q":"Τι σημαίνει βαθύτερα η μαιευτική;","o":["Ότι η αλήθεια διδάσκεται από τον δάσκαλο","Ότι ο άνθρωπος γνωρίζει την αλήθεια, την Ιδέα, και πρέπει να την ξαναθυμηθεί","Ότι η αλήθεια είναι σχετική","Ότι η αλήθεια βρίσκεται με τις αισθήσεις"],"ok":1,"why":"Όπως και για τον Πλάτωνα: δες την εισαγωγή στον μύθο του σπηλαίου, σελ. 113.","a":["ο άνθρωπος γνωρίζει την αλήθεια, την Ιδέα","να την ξαναθυμηθεί","όπως και για τον Πλάτωνα, δες εισαγωγή στον μύθο του σπηλαίου, σελ. 113"]},{"id":"m28","s":5,"q":"Σε ποια σελίδα παραπέμπει το βιβλίο για τον μύθο του σπηλαίου;","o":["Στη σελ. 103","Στη σελ. 113","Στη σελ. 131","Στη σελ. 118"],"ok":1,"why":"«Δες εισαγωγή στον μύθο του σπηλαίου, σελ. 113».","a":["δες εισαγωγή στον μύθο του σπηλαίου, σελ. 113"]},{"id":"m29","s":6,"q":"Τι σημαίνει ότι «κατέβασε τη φιλοσοφία από τα άστρα στη γη»;","o":["Ότι απέρ Από τους μύθους","Από θεϊκές αλήθειες"],"ok":1,"why":"Και φτάνει σε καθολικά συμπεράσματα, που ξεπερνούν την εμπειρία.","a":["Ξεκινώντας δηλαδή από παραδείγματα, συνήθως παρμένα από την καθημερινή ζωή και εμπειρία","καθολικών συμπερασμάτων, που να ξεπερνούν την εμπειρία"]},{"id":"m39","s":7,"q":"Πότε «είχε επιτυχία» η διαδικασία;","o":["Όταν ο συνομιλητής σιωπούσε","Όταν προέκυπτε ένας απόλυτος ορισμός, δηλαδή μια απόλυτη γνώση","Όταν κέρδιζε τη συζήτηση","Όταν συμφωνούσε το πλήθος"],"ok":1,"why":"Ο απόλυτος ορισμός είναι το κριτήριο της επιτυχίας.","a":["είχε επιτυχία όταν προέκυπτε τελικά ένας απόλυτος ορισμός, δηλαδή μια απόλυτη γνώση"]},{"id":"m40","s":8,"q":"Ποιο ΔΕΝ είναι ζεύγος εννοιών που αναφέρει το βιβλίο;","o":["Της σωφροσύνης και της άνοιας","Του θάρρους και της δειλίας","Της ορθής διακυβέρνησης και της δεσποτείας","Της ευσέβειας και της ασέβειας"],"ok":3,"why":"Τα έξι είναι: καλό/κακό, αδικία/δίκαιο, ομορφιά/ασχήμια, σωφροσύνη/άνοια, θάρρος/δειλία, ορθή διακυβέρνηση/δεσποτεία.","a":["του καλού και του κακού, της αδικίας και του δικαίου, της ομορφιάς και της ασχήμιας, της σωφροσύνης και της άνοιας, του θάρρους και της δειλίας, της ορθής διακυβέρνησης και της δεσποτείας"]},{"id":"m41","s":8,"q":"Πόσα ζεύγη εννοιών απαριθμεί το βιβλίο;","o":["Τέσσερα","Πέντε","Έξι","Οκτώ"],"ok":2,"why":"Έξι, και κλείνουν με το πολιτικό: της ορθής διακυβέρνησης και της δεσποτείας.","a":["της ορθής διακυβέρνησης και της δεσποτείας"]},{"id":"m42","s":8,"q":"Ποιο είναι το τελικό συμπέρασμα του κεφαλαίου;","o":["Ότι η αλήθεια είναι σχετική","Ότι η λογική σκέψη και όχι οι αισθήσεις είναι ο μοναδικός οδηγός προς την αλήθεια","Ότι η φιλοσοφία πρέπει να ξαναγυρίσει στα άστρα","Ότι ο ορισμός είναι αδύνατος"],"ok":1,"why":"«Προς το καθολικό και το αιώνιο»· και το λέει ο άνθρωπος που ισχυριζόταν πως γνωρίζει μόνο την άγνοιά του.","a":["η λογική σκέψη και όχι οι αισθήσεις είναι ο μοναδικός οδηγός προς την αλήθεια","προς το καθολικό και το αιώνιο","το μόνο πράγμα που γνωρίζει είναι η ίδια του η άγνοια"]}],"numbers":[{"v":"20-21","l":"Ἀπολογία: από εκεί είναι το απόσπασμα","s":2,"a":["Ἀπολογία , 20-21"]},{"v":"113","l":"η σελίδα της εισαγωγής στον μύθο του σπηλαίου","s":5,"a":["δες εισαγωγή στον μύθο του σπηλαίου, σελ. 113"]},{"v":"642 a 28","l":"Περὶ ζῴων μορίων: από τα άστρα στη γη","s":6,"a":["Περὶ ζῴων μορίων , 642 a 28 κ.εξ."]},{"v":"1078 b 27","l":"Μετὰ τὰ φυσικά: η επαγωγική μέθοδος","s":7,"a":["Μετὰ τὰ φυσικά , 1078 b 27 κ.εξ."]},{"v":"2","l":"τα όπλα: η διαλεκτική και η μαιευτική","s":5,"a":["Τα όπλα του ήταν η διαλεκτική και η μαιευτική"]},{"v":"6","l":"τα ζεύγη εννοιών του απόλυτου ορισμού","s":8,"a":["της ορθής διακυβέρνησης και της δεσποτείας"]}],"numbersNote":"Και οι δύο αριστοτελικές παραπομπές κλείνουν με «κ.εξ.», δηλαδή «και εξής».","pitfalls":[{"s":6,"t":"«Ήταν ο πρώτος που ασχολήθηκε με την ηθική και την πολιτική»: όχι. Ασχολήθηκαν και οι προγενέστεροι φιλόσοφοι, και ο Δημόκριτος, και πολλοί σοφιστές. Ο Σωκράτης το έκανε κατ’ αποκλειστικότητα.","claim":true,"a":["με πολιτικά προβλήματα ασχολήθηκαν και οι προγενέστεροι φιλόσοφοι","κατ' αποκλειστικότητα σε τέτοια θέματα"]},{"s":4,"t":"«Ήταν άθεος»: όχι, ήταν είρωνας. Το «άθεος» είναι ο ισχυρισμός των κατηγόρων του.","claim":true,"a":["Ο Σωκράτης δεν ήταν άθεος, ήταν όμως είρωνας","όπως ισχυρίστηκαν οι κατήγοροί του"]},{"s":4,"t":"«Έμοιαζε με τους σοφιστές»: μόνο στην αμφισβήτηση. Εκείνων κατέληγε στην άρνηση, και το ενδιαφέρον τους για τα ηθικά ήταν εντελώς χρησιμοθηρικό.","claim":true,"a":["Ίσως στην αμφισβήτηση να έμοιαζε πράγματι με τους σοφιστές","κατέληγε στην άρνηση","ήταν εντελώς χρησιμοθηρικό"]},{"s":7,"t":"Μην τα μπερδέψεις: η διαλεκτική είναι ο δρόμος της συζήτησης (αναίρεση, μετά νέο συμπέρασμα)· η επαγωγική μέθοδος είναι ο δρόμος της σκέψης (από τα παραδείγματα στους καθολικούς ορισμούς). Η μαιευτική είναι ο ρόλος του Σωκράτη: σαν μαία, βοηθάει τον άλλον να «γεννήσει» την αλήθεια.","claim":true,"a":["αναίρεση των θέσεων του συνομιλητή","ένα νέο συμπέρασμα","από παραδείγματα","καθολικών ορισμών","σαν μαία, βοηθάει τον συνομιλητή του"]}],"idea":{"t":"Ο Σωκράτης παίρνει την αμφισβήτηση, που έμοιαζε με των σοφιστών, και της αλλάζει κατεύθυνση: από άρνηση τη κάνει αναζήτηση. Το κάνει με δύο όπλα, τη διαλεκτική και τη μαιευτική, και με έναν δρόμο σκέψης, την επαγωγική μέθοδο, και τη στρέφει από τα άστρα στον άνθρωπο. Το αποτέλεσμα είναι η αναζήτηση καθολικών ορισμών για τις ηθικές έννοιες. Και το τίμημα, η θανατική καταδίκη: ένας τέτοιος άνθρωπος είναι απειλή.","a":["να έμοιαζε πράγματι με τους σοφιστές","κατέληγε στην άρνηση","Τα όπλα του ήταν η διαλεκτική και η μαιευτική","η επαγωγική μέθοδος","κατέβασε τη φιλοσοφία από τα άστρα στη γη","την εξαγωγή καθολικών ορισμών","τη θανατική καταδίκη του","Ένας τέτοιος άνθρωπος είναι απειλή"]}},"colophon":["Το κείμενο είναι το «Δ2. Οι φιλοσοφικές ιδέες του Σωκράτη» του σχολικού βιβλίου (Φιλοσοφικός Λόγος Γ΄ Λυκείου), μαζί με την τελευταία παράγραφο του Δ1 και την υποσημείωση 2, που εξηγούν τον χρησμό.","Το βιβλίο δεν κλείνει τα εισαγωγικά στο παράθεμα του Αριστοτέλη (Περὶ ζῴων μορίων)· εδώ κλείνουν πριν από την παραπομπή.","Οι πλαγιότιτλοι «στο χαρτί σου» και οι δύο σημειώσεις σου (αντικρουόμενα, δεσποτεία) διαβάστηκαν από τις φωτογραφίες σου, όχι από το βιβλίο. Τα μνημονικά και η «μεγάλη ιδέα» είναι βοηθήματα, όχι λόγια του βιβλίου."]};

if (RET) document.documentElement.classList.add('ret');
function save() {
  if (!store.readable) { banner(); return false; }
  var txt = JSON.stringify(S), back = null;
  try { localStorage.setItem(KEY, txt); back = localStorage.getItem(KEY); }
  catch (e) { store.fail = 'full'; banner(); return false; }
  if (back !== txt) { store.fail = 'readback'; banner(); return false; }
  store.fail = ''; banner(); return true;
}

  var b = $('banner'), msg = '';
  if (!store.readable && store.why === 'corrupt') msg = 'Η αποθηκευμένη πρόοδος αυτής της συσκευής δεν διαβάζεται σωστά. Για να μη χαθεί, η σελίδα δεν γράφει τίποτα από πάνω της· ό,τι κάνεις τώρα κρατιέται μόνο όσο είναι ανοιχτή.';
  else if (!store.readable) msg = 'Αυτός ο browser δεν επιτρέπει αποθήκευση. Η πρόοδος κρατιέται μόνο όσο είναι ανοιχτή η σελίδα.';
  else if (store.fail) msg = 'Η τελευταία αλλαγή δεν αποθηκεύτηκε (ο χώρος της συσκευής μπορεί να είναι γεμάτος). Φαίνεται εδώ, αλλά θα χαθεί στο κλείσιμο.';
  b.textContent = msg; b.hidden = !msg;
}

/* ── κείμενο: *όρος*, **έμφαση**, και κάθε πολυτονική λέξη σε GFS Didot ── */
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
var POLY = /[ἀ-῿̓̔͂]/;
function md(s) {
  var h = esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*]+)\*/g, '<em class="t">$1</em>');
  return h.split(/(<em class="t">[\s\S]*?<\/em>|<[^>]+>)/).map(function (part) {
    if (!part || part.charAt(0) === '<') return part;
    return part.replace(/[^\s<>]+/g, function (w) { return POLY.test(w) ? '<span class="gr">' + w + '</span>' : w; });
  }).join('');
}
function plain(s) { return String(s || '').replace(/\*\*([^*]+)\*\*/g, '$1').replace(/\*([^*]+)\*/g, '$1'); }
function stName(n) { return 'Σταθμός ' + ROM[n]; }

/* ── ο αστερισμός ───────────────────────────────────────────────────── */
function gapsBy() {
  var g = {}; ST.forEach(function (s) { g[s.n] = 0; });
  gapList().forEach(function (x) { g[x.s]++; });
  return g;
}
function mapSVG(box, opt) {
  opt = opt || {};
  var w = box.clientWidth || 1000, narrow = w < 620, P = [], W, H;
  if (opt.strip) {
    narrow = false; W = w < 620 ? 520 : 1100; H = w < 620 ? 74 : 128;
    var mx = w < 620 ? 30 : 92;
    ST.forEach(function (s, i) { P.push([mx + i * (W - 2 * mx) / (N - 1), 44]); });
  } else if (!narrow) {
    W = 1100; H = 380;
    ST.forEach(function (s) { P.push([s.xy[0], s.xy[1]]); });
  } else {
    W = 360; H = 78 * N + 70;
    ST.forEach(function (s, i) { P.push([i % 2 ? 250 : 110, 52 + i * 78]); });
  }
  var here = opt.here, gaps = opt.gaps ? gapsBy() : null, h = '';
  h += '<svg viewBox="0 0 ' + W + ' ' + H + '" role="group" aria-label="Ο αστερισμός των ' + N + ' σταθμών">';
  for (var i = 0; i < N - 1; i++) {
    var a = P[i], b = P[i + 1], lit = opt.all || (S.read[ST[i].n] && S.read[ST[i + 1].n]);
    var d = narrow ? 'M' + a[0] + ' ' + a[1] + ' C ' + a[0] + ' ' + (a[1] + 40) + ', ' + b[0] + ' ' + (b[1] - 40) + ', ' + b[0] + ' ' + b[1]
                   : 'M' + a[0] + ' ' + a[1] + ' C ' + (a[0] + 60) + ' ' + a[1] + ', ' + (b[0] - 60) + ' ' + b[1] + ', ' + b[0] + ' ' + b[1];
    h += '<path class="edge' + (lit ? ' lit' : '') + '" d="' + d + '"/>';
  }
  if (!narrow && !opt.strip) h += '<text class="core" x="' + (W / 2) + '" y="' + (H - 16) + '" text-anchor="middle">' + esc(D.core) + '</text>';
  ST.forEach(function (s, i) {
    var p = P[i], up = narrow || opt.strip ? false : p[1] < 170, lit = opt.all || !!S.read[s.n];
    var cls = 'node' + (lit ? ' lit' : '') + (here === s.n ? ' here' : '') + (justRead === s.n && !opt.all ? ' stamp' : '');
    var tx = narrow ? (p[0] < 180 ? p[0] + 22 : p[0] - 22) : p[0], anchor = narrow ? (p[0] < 180 ? 'start' : 'end') : 'middle';
    var y1 = narrow ? p[1] - 4 : opt.strip ? p[1] - 20 : (up ? p[1] - 46 : p[1] + 34), y2 = narrow ? p[1] + 16 : opt.strip ? p[1] + (i % 2 ? 62 : 36) : (up ? p[1] - 24 : p[1] + 56);
    h += '<a class="' + cls + '" href="#s' + s.n + '" aria-label="' + esc(stName(s.n) + ': ' + s.short + (lit ? ', διαβασμένος' : '')) + '">';
    h += '<circle class="hit" cx="' + p[0] + '" cy="' + p[1] + '" r="26"/>';
    h += '<circle class="ring" cx="' + p[0] + '" cy="' + p[1] + '" r="13"/>';
    h += '<circle class="dot" cx="' + p[0] + '" cy="' + p[1] + '" r="7"/>';
    h += '<text class="n" x="' + tx + '" y="' + y1 + '" text-anchor="' + anchor + '">' + ROM[s.n] + (here === s.n ? ' · ΕΔΩ' : '') + '</text>';
    if (!(opt.strip && w < 620)) h += '<text class="nm" x="' + tx + '" y="' + y2 + '" text-anchor="' + anchor + '">' + esc(s.short) + '</text>';
    if (gaps && gaps[s.n]) {
      h += '<circle class="gapdot" cx="' + (p[0] + 12) + '" cy="' + (p[1] - 12) + '" r="4"/>';
      h += '<text class="gapn" x="' + (p[0] + 19) + '" y="' + (p[1] - 16) + '">' + gaps[s.n] + '</text>';
    }
    h += '</a>';
  });
  h += '</svg>';
  box.innerHTML = h;
  box.classList.remove('drawn');
  [].forEach.call(box.querySelectorAll('.edge'), function (e) {
    var L = 400; try { L = Math.ceil(e.getTotalLength()) + 2; } catch (x) {}
    e.style.setProperty('--len', L);

  requestAnimationFrame(function () { requestAnimationFrame(function () { box.classList.add('drawn'); }); });
  setTimeout(function () { box.classList.add('drawn'); }, 900);   /* δίχτυ (σταθ. 39) */
}

/* ── εξώφυλλο ───────────────────────────────────────────────────────── */
/* ⭐ Η ΣΦΡΑΓΙΔΑ: μονόγραμμα + επιγραφή σε κύκλο (σαν νόμισμα) + μία κουκκίδα ανά σταθμό,
   που ανάβει όταν τον διαβάσεις. Από το json (cover.seal) — κάθε κεφάλαιο τη δική του. */
function sealSVG() {
  /* ⭐ με `img` (προτομή-χαρακτικό, κοινό κτήμα) η εικόνα γεμίζει τον κύκλο και οι κουκκίδες κάθονται στο χείλος·
     χωρίς `img` μένει το μονόγραμμα + η επιγραφή (`mark`/`ring`). */
  var sl = D.cover.seal, R = sl.img ? 91 : 70, h = (sl.img ? '<img src="' + esc(sl.img) + '" alt="" decoding="async">' : '') +
    '<svg viewBox="0 0 200 200" aria-hidden="true">' +
    '<circle class="rim" cx="100" cy="100" r="97"/>' + (sl.img ? '' : '<circle class="rim2" cx="100" cy="100" r="70"/>' +
    '<path id="sealPath" fill="none" d="M100 18a82 82 0 1 1 -0.01 0"/>' +

    '<text class="mark" x="100" y="131" text-anchor="middle">' + esc(sl.mark) + '</text>');
  ST.forEach(function (st, i) {
    var t = -Math.PI / 2 + i * 2 * Math.PI / N, x = 100 + R * Math.cos(t), y = 100 + R * Math.sin(t);

  h += '<h2 id="sth' + s.n + '">' + md(s.title) + '</h2>';
  if (s.mine) h += '<p class="mine"><span class="lbl">Στο χαρτί σου</span>«' + esc(s.mine) + '»</p>';
  h += '<div class="prose">' + (s.prose || []).map(function (p) { return '<p>' + md(p.t) + '</p>'; }).join('') + '</div>';

  h += '<nav class="pager" aria-label="Σταθμοί">' + (prev ? '<a href="#s' + prev.n + '">← ' + esc(ROM[prev.n] + ' ' + prev.short) + '</a>' : '<span></span>') +
    (next ? '<a class="r" href="#s' + next.n + '">' + esc(ROM[next.n] + ' ' + next.short) + ' →</a>' : '<a class="r" href="#fin">Τέλος →</a>') + '</nav>';
