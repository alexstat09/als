<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A2030">
<title>Πρωταγόρας · Εισαγωγή Αρχαίων</title>
<!-- ⛔ ΠΑΡΑΓΕΤΑΙ: node tools/eisagogi/arxaia/build.js protagoras --v2 — μην τη γράψεις με το χέρι.
     Το κεφάλαιο ζει στο tools/eisagogi/arxaia/protagoras.json· το καλούπι εδώ (page2.tpl). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=GFS+Didot&family=Geologica:wght@500;600&display=swap">
<style>
/* ══ ΕΙΣΑΓΩΓΗ ΑΡΧΑΙΩΝ v2 — «το μπλε του Β» (μακέτες skini-dromos + pinakes, 16/11/26) ══
   Μία συνεχής σελίδα-ιστορία: πρώτα το σχέδιο, μετά το κείμενο με τα ίδια νούμερα.
   Δική του εντολή (16/11): ΚΑΝΕΝΑ «Το διάβασα», ΚΑΜΙΑ υπενθύμιση — μόνο διάβασμα.
   ⛔ Κανένα min-width: το λάπτοπ γράφεται πρώτο, μαζεύει με max-width (900 · 640).
   ⛔ Κανένα «πηγή», κανένας βαθμός· ο έλεγχος αλήθειας ζει στα scripts. */
:root{color-scheme:dark;
  --bg:#1A2030;--surf:#232B3D;--line:#313A4F;--line2:#445068;
  --ink:#EDE7DA;--dim:#CBC4B5;--faint:#8E95A6;
  --acc:#F2B35B;--hl:rgba(255,222,89,.30);--red:#F28B78;--grn:#6FD1AE;
  --t1:#F2C063;--t2:#F28B78;--t3:#6FD1AE;--tb:.13;
  --title:"Geologica","Commissioner",sans-serif;--ui:"Commissioner",system-ui,-apple-system,sans-serif;--gr:"GFS Didot",serif}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);scroll-padding-top:76px}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--title);font-weight:600;letter-spacing:-.01em}
.gr{font-family:var(--gr)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

/* ── η μπάρα: πίσω + τρεις καρτέλες ── */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.top .in{max-width:1120px;margin:0 auto;padding:0 32px;display:flex;align-items:center;gap:18px;min-height:60px}
.back{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:600;color:var(--dim);text-decoration:none;white-space:nowrap}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs button{min-height:44px;padding:0 16px;border-radius:999px;font-size:14.5px;font-weight:600;color:var(--dim);border:1px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--line2);background:var(--surf)}
.banner{max-width:1056px;margin:14px auto 0;padding:12px 16px;border:1px solid color-mix(in srgb,var(--red) 55%,transparent);border-radius:12px;font-size:15px;color:var(--ink)}

.shell{max-width:1120px;margin:0 auto;padding:0 32px 120px}

/* ── εξώφυλλο + ο δρόμος ── */
.cover{padding:52px 0 0}
.cover .eye{font-size:13.5px;color:var(--dim)}
h1{font-size:60px;line-height:1.04;margin:6px 0 8px}
.motto{font-family:var(--gr);font-size:24px;color:var(--acc)}
.road{margin-top:40px;padding:22px 0 30px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.rd{display:block;width:100%;height:auto;overflow:visible;margin-top:6px}
.rd .band{fill:none;stroke:var(--surf);stroke-width:30;stroke-linecap:round}
.rd .dash{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-dasharray:8 10;opacity:.5}
.rd .chev{fill:none;stroke:var(--faint);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rd text{font-family:var(--ui);text-anchor:middle}
.rd .g{font-size:12px;font-weight:700;letter-spacing:.08em;fill:var(--acc);text-anchor:start}
.rd .g.e,.rd .cap.e{text-anchor:end}
.rd .cap{font-size:10.5px;font-weight:700;letter-spacing:.1em;fill:var(--faint);text-anchor:start}
.rd a{cursor:pointer}
.rd a:focus-visible{outline:none}.rd a:focus-visible circle,.rd a:hover circle{stroke:var(--acc);stroke-width:3}
.rd circle{fill:var(--bg);stroke:var(--faint);stroke-width:2}
.rd .hit{fill:transparent;stroke:none}
.rd .no{font-size:12px;font-weight:700;fill:var(--dim)}
.rd .nm{font-size:14.5px;font-weight:600;fill:var(--ink)}
.acts{display:none;grid-template-columns:minmax(0,1fr);gap:22px;margin-top:16px}
.act small{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--acc)}
.act h3{font-size:23px;line-height:1.15;margin:4px 0 14px;text-wrap:balance}
.act a{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:baseline;padding:10px;border-top:1px solid var(--line);text-decoration:none;min-height:44px}
.act a i{font-style:normal;font-size:12.5px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
.act a b{display:block;font-size:15px;font-weight:600;color:var(--ink)}
.act a span{display:block;font-size:13.5px;color:var(--dim);line-height:1.35}

/* ── στάση: πρώτα το σχέδιο, μετά το κείμενο ── */
.sec{padding-top:72px;scroll-margin-top:-24px}
.sec .lbl b{color:var(--acc)}
h2{font-size:40px;line-height:1.1;margin:8px 0 22px;text-wrap:balance}
.fig{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:20px 22px 16px;margin:0}
.fig figcaption{font-size:13.5px;font-weight:600;color:var(--dim);margin-bottom:12px}
.scene{padding:18px 20px 10px}
.scene svg{display:block;width:100%;height:auto;overflow:visible;cursor:pointer}
.scene .ln{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.scene .thin{stroke-width:1.4;opacity:.6}
.scene .back{fill:none;stroke:var(--red);stroke-width:1.8;stroke-dasharray:4 6;stroke-linecap:round}
.scene use{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.scene use.hl{stroke:var(--acc)}
.scene .sun{fill:var(--acc);stroke:none}
.scene .shade{fill:var(--faint);opacity:.45;stroke:none}
.scene text{font-family:var(--ui);font-size:14px;fill:var(--dim)}
.scene text.n{font-weight:700;fill:var(--ink);font-size:14.5px}
.scene text.gr{font-family:var(--gr);font-size:19px;fill:var(--acc)}
.scene text.pl{font-size:12px;font-weight:700;letter-spacing:.08em;fill:var(--faint)}
.scene .num{fill:var(--acc)} .scene .numt{fill:#1A1408;font-size:12.5px;font-weight:700;text-anchor:middle}
.legend{display:none;list-style:none;margin-top:10px;border-top:1px solid var(--line)}
.legend li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;color:var(--dim)}
.legend li u,.txt p u{text-decoration:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#1A1408;font-size:12px;font-weight:700}
.legend li b{color:var(--ink);font-weight:600}
.replay{display:block;margin:6px 0 0 auto;min-height:44px;padding:0 6px;font-size:14px;font-weight:600;color:var(--faint)}
/* κίνηση: η σκηνή ζωγραφίζεται μία φορά όταν φτάσεις, με τη σειρά των νούμερων.
   Ορατή εξ ορισμού (σταθ. 39): κρύβεται μόνο κάτω από html.anim, που το βάζει η JS. */
html.anim .draw .ln,html.anim .draw .back{stroke-dasharray:1;stroke-dashoffset:1}
html.anim .draw .fade{opacity:0}
html.anim .draw.go .ln{animation:d 1.1s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(var(--k,0)*.32s)}
html.anim .draw.go .back{stroke-dasharray:.03 .04;animation:d 1.1s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(var(--k,0)*.32s)}
html.anim .draw.go .fade{animation:f .5s ease-out forwards;animation-delay:calc(var(--k,0)*.32s + .25s)}
html.anim .draw.done .ln,html.anim .draw.done .back{stroke-dashoffset:0;animation:none}
html.anim .draw.done .back{stroke-dasharray:4 6}
html.anim .draw.done .fade{opacity:1;animation:none}
@keyframes d{to{stroke-dashoffset:0}} @keyframes f{to{opacity:1}}

/* όροφοι (τάξη ↔ τάξη, τάξη → έργο) — ίδιο χρώμα για την ίδια τάξη σε ΟΛΗ τη σελίδα */
.tint1{--t:var(--t1)} .tint2{--t:var(--t2)} .tint3{--t:var(--t3)}
.tint1,.tint2,.tint3{background:color-mix(in srgb,var(--t) calc(var(--tb)*100%),transparent)}
.tiers{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) 130px;gap:6px 0;max-width:900px}
.tiers.nojoin{grid-template-columns:minmax(0,1fr) auto minmax(0,1.3fr)}
.tiers .h{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:0 16px 6px}
.tiers .c{padding:14px 16px;border-top:2px solid var(--t)}
.tiers .c b{display:block;font-weight:600;font-size:17px;color:var(--ink)}
.tiers .c span{font-size:14.5px;color:var(--dim)}
.tiers .c.d b{font-weight:500;font-size:16px;color:var(--dim)}
.tiers .v{display:flex;align-items:center;justify-content:center;padding:0 14px;font-size:14px;font-weight:600;color:var(--t);border-top:2px solid var(--t);white-space:nowrap}
.tiers .sel{grid-column:4;display:flex;align-items:center;gap:8px;padding:0 0 0 12px;font-size:13.5px;font-weight:600;line-height:1.3;color:var(--acc)}
.tiers .sel i{flex:none;align-self:stretch;width:12px;border:2px solid var(--acc);border-left:0;border-radius:0 8px 8px 0}
.tiers .all{grid-column:1/4;margin-top:8px;font-size:15px;color:var(--dim);padding:12px 16px;border:1px dashed var(--line2);border-radius:10px}
.tiers.nojoin .all{grid-column:1/-1}
.tiers .all b,.tiers .all mark{color:var(--ink)}

/* σκαλιά */
.stairs{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));align-items:end;height:350px;margin-top:6px}
.stp{position:relative;height:calc(84px + var(--i)*58px);padding:10px 12px 0;border-top:2px solid var(--ink);border-left:2px solid var(--ink);background:color-mix(in srgb,var(--acc) calc(var(--i)*4.5% + 3%),transparent)}
.stp:first-child{border-left:0}
.stp b{display:block;font-size:15px;font-weight:600;line-height:1.25;color:var(--ink)}
.stp span{display:block;font-size:14px;line-height:1.35;color:var(--dim);margin-top:4px}
.stp.top::before{content:"";position:absolute;left:50%;top:-58px;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 7px color-mix(in srgb,var(--acc) 22%,transparent)}
.rise{margin-top:12px;font-size:14px;font-weight:600;color:var(--acc)}

/* ροή με βέλη: λίγα κουτιά, αιτία → αποτέλεσμα */
.flow{display:flex;align-items:stretch;gap:0}
.flow .nd{flex:1 1 0;min-width:0;padding:14px 16px;border:1px solid var(--line2);border-radius:12px;background:color-mix(in srgb,var(--bg) 40%,transparent)}
.flow .nd b{display:block;font-size:16px;font-weight:600;line-height:1.35;color:var(--ink)}
.flow .nd span{display:block;font-size:14.5px;line-height:1.4;color:var(--dim);margin-top:5px}
.flow .nd.end{border-color:var(--acc)}
.flow .nd.or b + b{margin-top:6px}
.flow .nd.or i{display:block;font-style:normal;font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--acc);margin-top:6px}
.flow .ar{flex:none;align-self:center;width:34px;text-align:center;font-size:20px;color:var(--acc)}

/* σύγκριση δύο στηλών */
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 28px}
.cmp .col h3{font-family:var(--ui);font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--acc);padding-bottom:8px;border-bottom:2px solid var(--acc)}
.cmp .col.bad h3{color:var(--red);border-color:var(--red)}
.cmp .col p{font-size:16px;line-height:1.45;color:var(--dim);padding:10px 0;border-bottom:1px solid var(--line)}
.cmp .col p b{color:var(--ink);font-weight:600}
.cmp .res{grid-column:1/-1;margin-top:14px;font-size:15.5px;color:var(--ink);padding:12px 16px;border:1px dashed var(--line2);border-radius:10px}

/* κείμενο + στήλη */
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:48px;align-items:start;margin-top:34px}
.two.solo{grid-template-columns:minmax(0,1fr)}
.txt p{font-size:18px;line-height:1.72;color:var(--dim);max-width:64ch;border-radius:8px;transition:background .6s}
.txt p + p{margin-top:14px}
.txt p > b{font-weight:700;color:var(--acc);margin-right:6px}
.txt p u{width:20px;height:20px;margin-right:8px;vertical-align:2px}
.txt p.flash{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.txt i.gr,.side i.gr,.ck i.gr,.ol i.gr{font-style:italic;color:var(--acc)}
mark{color:var(--ink);background:linear-gradient(180deg,transparent 54%,var(--hl) 54%,var(--hl) 95%,transparent 95%);padding:0 2px}
.side > * + *{margin-top:26px}
.trap{padding:16px 18px;border-radius:14px;border:1px solid color-mix(in srgb,var(--red) 55%,transparent)}
.trap + .trap{margin-top:12px}
.trap small{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--red);margin-bottom:6px}
.trap s{font-size:16px;color:var(--dim);text-decoration-color:var(--red)}
.trap p{font-size:16px;margin-top:4px;color:var(--ink)}.trap p b{font-size:12.5px;margin-right:6px;color:var(--red)}
.trap a{display:inline-flex;align-items:center;min-height:44px;margin-bottom:-12px;font-size:13.5px;font-weight:600;color:var(--faint);text-decoration:none}
.sym{margin-top:10px;border-top:1px solid var(--line)}
.sym div{display:grid;grid-template-columns:minmax(0,.9fr) auto minmax(0,1.3fr);gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;color:var(--dim)}
.sym div b{color:var(--ink);font-weight:600}.sym div i{font-style:normal;color:var(--acc)}
.gl{margin-top:10px}
.gl div{padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;color:var(--dim)}
.gl div b{display:block;color:var(--ink);font-weight:600}
.mn .k{display:block;font-family:var(--title);font-weight:600;font-size:16px;color:var(--acc);margin-top:6px;letter-spacing:.02em}
.mn p{font-size:15.5px;color:var(--dim);margin-top:4px}
.bridge{font-style:italic;font-size:17.5px;color:var(--faint);margin-top:40px;max-width:60ch}

/* τέλος της σελίδας: πέντε λεπτά πριν το διαγώνισμα */
.rev{padding-top:96px;scroll-margin-top:-24px}
.rev h2{margin-bottom:8px}
.rev .lead{font-size:16px;color:var(--dim);max-width:62ch;margin-bottom:22px}
.rev .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.rev .grid .trap + .trap{margin-top:0}
.rev .tbl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 48px}
.rev .tbl > div .lbl{display:block}
.fin{margin-top:72px;padding-top:28px;border-top:1px solid var(--line);font-size:16px;color:var(--dim)}
.fin button{min-height:44px;padding:0 20px;margin-top:12px;border-radius:999px;background:var(--acc);color:#1A1408;font-size:15px;font-weight:600}

/* ── σχεδιάγραμμα ── */
.ol{padding-top:52px;max-width:820px}
.ol .hd{display:flex;align-items:end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:26px}
.ol .hd p{font-size:16px;color:var(--dim);max-width:52ch;margin-top:6px}
.ol .tg{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);font-size:14.5px;font-weight:600;color:var(--dim)}
.ol .tg[aria-pressed="true"]{background:var(--surf);color:var(--ink)}
.ol ol{list-style:none}
.ol .l1 > li{padding:18px 0;border-top:1px solid var(--line)}
.ol .l1 > li > a{display:flex;gap:12px;align-items:baseline;min-height:44px;text-decoration:none;font-family:var(--title);font-weight:600;font-size:22px;color:var(--ink)}
.ol .l1 > li > a i{font-style:normal;color:var(--acc);min-width:24px}
.ol .l2{margin:4px 0 0 36px}
.ol .l2 > li > a{display:flex;gap:10px;align-items:baseline;min-height:44px;padding:6px 0;text-decoration:none;font-size:17px;font-weight:600;color:var(--ink)}
.ol .l2 > li > a i{font-style:normal;color:var(--faint);min-width:20px;font-weight:700}
.ol .l3{margin:0 0 6px 30px}
.ol .l3 li{display:flex;gap:10px;font-size:16px;line-height:1.5;color:var(--dim);padding:3px 0}
.ol .l3 li i{font-style:normal;color:var(--faint);min-width:20px}
.ol.bare .l3{display:none}

/* ── ο έλεγχος ── */
.ck{padding-top:44px}
.ck .say{font-size:19px;color:var(--ink);max-width:62ch}
.ck .say2{font-size:15.5px;color:var(--dim);margin-top:4px;max-width:62ch}
.ck-nav{display:flex;flex-wrap:wrap;gap:6px;margin:24px 0 26px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ck-nav button{min-height:44px;padding:0 15px;border-radius:999px;border:1px solid var(--line);font-size:14.5px;font-weight:600;color:var(--dim)}
.ck-nav button span{margin-left:7px;font-size:12.5px;color:var(--faint)}
.ck-nav button[aria-selected="true"]{border-color:var(--ink);color:var(--ink);background:var(--surf)}
.ck .intro{font-size:15.5px;color:var(--dim);max-width:64ch;margin-bottom:18px}
.ck-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.ck-bar .pos{margin-left:auto;font-size:13.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.ck .btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line2);font-size:14.5px;font-weight:600;color:var(--dim)}
.ck .btn.pri{background:var(--acc);border-color:var(--acc);color:#1A1408}
.ck-card{max-width:760px;padding:22px 24px;border:1px solid var(--line);border-radius:16px;background:var(--surf)}
.ck-card .q{font-family:var(--title);font-size:22px;font-weight:600;line-height:1.3;margin:6px 0 14px;color:var(--ink)}
.ck-card .think{font-size:15px;color:var(--faint);margin-bottom:14px}
.ck-card .ans{font-size:17px;line-height:1.65;color:var(--dim);padding:14px 0;border-top:1px solid var(--line)}
.ck-card .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ck-go{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:600;color:var(--acc);text-decoration:none}
.ck-qs{display:grid;gap:12px;max-width:820px}
.ck-qi{padding:16px 18px;border:1px solid var(--line);border-radius:14px}
.ck-qi .qt{font-size:17px;line-height:1.55;color:var(--ink);margin:4px 0 12px}
.ck-opts{display:grid;gap:8px}
.ck-tf{display:flex;gap:8px;flex-wrap:wrap}
.ck-opt{min-height:44px;padding:10px 16px;text-align:left;border-radius:10px;border:1px solid var(--line2);font-size:15.5px;color:var(--dim)}
.ck-opt:not([disabled]):hover{border-color:var(--ink);color:var(--ink)}
.ck-opt[disabled]{cursor:default}
.ck-opt.ok{border-color:var(--grn);color:var(--ink);background:color-mix(in srgb,var(--grn) 14%,transparent)}
.ck-opt.no{border-color:var(--red);color:var(--ink);background:color-mix(in srgb,var(--red) 14%,transparent)}
.ck-ex{margin-top:12px;font-size:15.5px;line-height:1.55;color:var(--dim)}

ες φιλοσοφικές ανησυχίες, ο Πρωταγόρας είναι ένας φιλόσοφος με έντονους \"κοινωνιολογικούς\" (για να μεταχειριστούμε έναν σύγχρονο όρο) προβληματισμούς."]},{"t":"Γι’ αυτό: είναι φυσικό οι προβληματισμοί αυτοί να εκφράζονται και να υπογραμμίζονται με **ιδιαίτερη έμφαση** στη δική του εκδοχή του προμηθεϊκού μύθου.","a":["Είναι λοιπόν φυσικό οι προβληματισμοί αυτοί να εκφράζονται και να υπογραμμίζονται με ιδιαίτερη έμφαση στη δική του εκδοχή του προμηθεϊκού μύθου."]},{"t":"Η κοινωνία στο κέντρο: τονίζει κυρίως την ανάπτυξη της κοινωνικής οργάνωσης του ανθρώπου και τη βάζει στο κέντρο της αφήγησης. Η ύπαρξη και επιβίωση του ανθρώπου είναι εδώ αλληλένδετη με τον σχηματισμό και τη διατήρηση των **ανθρώπινων κοινωνιών**.","a":["Έτσι, ο Πρωταγόρας τονίζει κυρίως την ανάπτυξη της κοινωνικής οργάνωσης του ανθρώπου και τη βάζει στο κέντρο της μυθικής του αφήγησης.","Η ύπαρξη και επιβίωση του ανθρώπου είναι εδώ αλληλένδετη με τον σχηματισμό και τη διατήρηση των ανθρώπινων κοινωνιών."]},{"t":"Η αρετή: οποιαδήποτε αρετή είναι, εξ ορισμού, **πολιτική**, με την έννοια ότι κύριος στόχος της είναι η αρμονική οργάνωση και ζωή της κοινωνίας και όχι η ηθική βελτίωση του ανθρώπου.","a":["Και οποιαδήποτε αρετή είναι, εξ ορισμού θα λέγαμε, πολιτική, με την έννοια ότι ως κύριο στόχο της έχει την αρμονική οργάνωση και ζωή της κοινωνίας και όχι την ηθική βελτίωση του ανθρώπου."]},{"t":"Όχι ξένη: η άποψη αυτή δεν είναι ξένη προς την αρχαία ελληνική νοοτροπία. Για τους Έλληνες η αρετή του ανθρώπου ως ιδιώτη δεν ξεχωρίζει από την αρετή του ως πολίτη· ο άνθρωπος νοείται κυρίως ως **πολίτης**, υπεύθυνο μέλος μιας οργανωμένης κοινωνίας.","a":["Η άποψη αυτή του Πρωταγόρα δεν είναι ξένη προς την αρχαία ελληνική νοοτροπία.","Πράγματι, για τους Έλληνες η αρετή του ανθρώπου ως ιδιώτη δεν ξεχωρίζει από την αρετή του ανθρώπου ως πολίτη.","Ο άνθρωπος νοείται κυρίως ως πολίτης, ως υπεύθυνο μέλος μιας οργανωμένης κοινωνίας."]}],"mnem":{"k":"ΗΣΙΟΔΟΣ ↓ · ΑΙΣΧΥΛΟΣ ↑ · ΠΡΩΤΑΓΟΡΑΣ ↑ + ΠΟΛΗ","t":"Ο Ησίοδος βλέπει ήμη» του Σωκράτη;","r":"Πως σε μια διάλεξη ο ομιλητής εκθέτει ιδέες που ο ακροατής δεν έχει καν τον χρόνο να εξετάσει.","a":["ο ακροατής δεν έχει καν τον χρόνο να εξετάσει"]},{"id":"r35","s":4,"q":"Τι είδους μέθοδος είναι η διάλεξη, και πού ταιριάζει;","r":"Μέθοδος πειθούς, όχι κατάκτησης της αλήθειας· ταιριάζει στις πολιτικές συνελεύσεις και στα δικαστήρια, όχι στη φιλοσοφία.","a":["μέθοδος πειθούς","για τις πολιτικές συνελεύσεις και τα δικαστήρια"]},{"id":"r36","s":5,"q":"Ποια είναι η τρίτη μέθοδος του Πρωταγόρα;","r":"Ο σχολιασμός ποιητικών κειμένων.","a":["τη μέθοδο του σχολιασμού ποιητικών κειμένων"]},{"id":"r37","s":5,"q":"Πώς χρησιμοποιούσαν οι αρχαίοι Έλληνες τους ποιητές;","r":"Με βασική παιδεία τα ομηρικά έπη, ανέφεραν τον Όμηρο ή άλλους ποιητές ως αυθεντίες σε ζητήματα κάθε είδους.","a":["ως αυθεντίες σε ζητήματα κάθε είδους","η βασική παιδεία ήταν τα ομηρικά έπη"]},{"id":"r38","s":5,"q":"Πρωτοπόροι ποιων επιστημών θεωρούνται οι σοφιστές;","r":"Της λογοτεχνικής ανάλυσης, της φιλολογίας, κυρίως δε της γλωσσολογίας.","a":["πρωτοπόρους της λογοτεχνικής ανάλυσης, της φιλολογίας, κυρίως δε της γλωσσολογίας"]},{"id":"r39","s":5,"q":"Ποια είναι η βασική αντίρρηση του Σωκράτη στον σχολιασμό;","r":"Η γενική του καχυποψία απέναντι στον γραπτό λόγο: το γραπτό είναι βουβό, δεν μπορεί να απαντήσει σε όποιον το ρωτά.","a":["καχυποψία του (που ήταν και καχυποψία του Πλάτωνα) απέναντι στον γραπτό λόγο","Το γραπτό είναι βουβό"]},{"id":"r40","s":5,"q":"Τι θέλει να δείξει ο Πλάτωνας σε αυτό το έργο;","r":"Τις περιορισμένες δυνατότητες της σοφιστικής, και τη σωκρατική διαλεκτική ως μοναδική φιλοσοφική μέθοδο ικανή να οδηγήσει στην αλήθεια.","a":["τις περιορισμένες δυνατότητες της σοφιστικής","τη σωκρατική διαλεκτική ως μοναδική φιλοσοφική μέθοδο"]},{"id":"r41","s":6,"q":"Πώς τελειώνει η συζήτηση για τη φύση της αρετής;","r":"Το θέμα μένει κάπως μετέωρο, χωρίς οριστικό συμπέρασμα· οι δύο συμφωνούν να συνεχίσουν τη συζήτηση με κάποια άλλη ευκαιρία.","a":["κάπως μετέωρο","συμφωνούν να συνεχίσουν τη συζήτηση"]},{"id":"r42","s":6,"q":"Ποια είναι η θέση του Πρωταγόρα και ποια του Σωκράτη;","r":"Ο Πρωταγόρας αρνείται την ύπαρξη του απόλυτου και ασπάζεται τη σχετικότητα· ο Σωκράτης αναζητά μια αλήθεια γενική, καθολική και απόλυτη.","a":["ασπάζεται τη σχετικότητα","αναζητά μια αλήθεια γενική, καθολική και απόλυτη"]},{"id":"r43","s":6,"q":"Πού θα βρούμε την ολοκληρωμένη αντίληψη του Πλάτωνα για την αρετή;","r":"Στην Πολιτεία· εδώ η θέση παραμένει σε ανολοκλήρωτη ακόμα μορφή.","a":["θα τη συναντήσουμε στην Πολιτεία","σε ανολοκλήρωτη ακόμα μορφή"]},{"id":"r44","s":7,"q":"Σε ποιον ανήκει η πατρότητα του μύθου, και πώς φέρεται ο Πλάτωνας στον Πρωταγόρα;","r":"Ανήκει στον ίδιο τον σοφιστή· ο Πλάτωνας εμφανίζεται να σέβεται τον πρωταγορικό φιλοσοφικό λόγο.","a":["ανήκει προφανώς στον περίφημο σοφιστή","να σέβεται τον πρωταγορικό φιλοσοφικό λόγο"]},{"id":"r45","s":7,"q":"Από ποια δύο κείμενα αντλεί την έμπνευσή του ο Πρωταγόρας;","r":"Από τη Θεογονία του Ησίοδου και τον Προμηθέα Δεσμώτη του Αισχύλου.","a":["τη Θεογονία του Ησίοδου, και δεύτερον τον Προμηθέα Δεσμώτη του Αισχύλου"]},{"id":"r46","s":7,"q":"Ποιος ήταν ο Ησίοδος;","r":"Επικός διδακτικός ποιητής από την Άσκρα της Βοιωτίας, που έζησε τον 8ο αιώνα.","a":["επικός διδακτικός ποιητής από την Άσκρα της Βοιωτίας, που έζησε τον 8ο αιώνα"]},{"id":"r47","s":7,"q":"Τι λέει η Θεογονία για τους ανθρώπους;","r":"Περιγράφει τη γέννηση των θεών· στους ανθρώπους αφιερώνει πολύ λίγο χώρο και δεν μιλά καθόλου για τη δημιουργία τους.","a":["δεν μιλά καθόλου για τη δημιουργία τους","περιγράφει τη γέννηση των θεών"]},{"id":"r48","s":7,"q":"Γιατί ο Δίας είχε την ιδέα της Πανδώρας;","r":"Θυμωμένος επειδή ο Προμηθέας είχε κλέψει τη φωτιά από τους θεούς, ήθελε κάτι αρκετά κακό ώστε να αντισταθμίσει τα θετικά οφέλη της φωτιάς.","a":["να αντισταθμίσει τα θετικά οφέλη της φωτιάς","ο Προμηθέας είχε κλέψει τη φωτιά από τους θεούς"]},{"id":"r49","s":7,"q":"Τι προσφέρουν στον άνθρωπο η φωτιά και η γυναίκα, κατά τον Ησίοδο;","r":"Η φωτιά, να ψήσει την τροφή του και να βγει από την κατάσταση του ζώου· η γυναίκα, να σχηματίσει οικογένεια. Έτσι μπορεί να γίνει άνθρωπος.","a":["να ψήσει την τροφή του","να σχηματίσει οικογένεια","να γίνει άνθρωπος"]},{"id":"r50","s":7,"q":"Πώς έβλεπε ο Ησίοδος την ανθρώπινη ιστορία;","r":"Ως πορεία από μια μακάρια παιδική ηλικία σε μια θλιβερή και αβάσταχτη κατάσταση γεροντικού ξεπεσμού.","a":["από μια μακάρια παιδική ηλικία σε μια θλιβερή και αβάσταχτη κατάσταση γεροντικού ξεπεσμού"]},{"id":"r51","s":8,"q":"Τι είναι ο Προμηθέας για τον Αισχύλο;","r":"Ένας μεγάλος ευεργέτης της ανθρωπότητας.","a":["ένας μεγάλος ευεργέτης της ανθρωπότητας"]},{"id":"r52","s":8,"q":"Τι επιτρέπει κυρίως η φωτιά στον Αισχύλο;","r":"Την ανάπτυξη της γλώσσας και της γραφής, της τεχνολογίας, της τέχνης και της σκέψης.","a":["την ανάπτυξη της γλώσσας και της γραφής"]},{"id":"r53","s":8,"q":"Ποια θεώρηση κρατά ο Πρωταγόρας, και πού διαφέρει από τον Αισχύλο;","r":"Την αισχύλεια θεώρηση και την αισχύλεια αισιοδοξία· όμως ο Αισχύλος είναι τραγικός ποιητής με φιλοσοφικές ανησυχίες, ο Πρωταγόρας φιλόσοφος με «κοινωνιολογικούς» προβληματισμούς.","a":["την αισχύλεια θεώρηση και την αισχύλεια αισιοδοξία","ένας φιλόσοφος με έντονους"]},{"id":"r54","s":8,"q":"Τι βάζει ο Πρωταγόρας στο κέντρο της δικής του εκδοχής;","r":"Την ανάπτυξη της κοινωνικής οργάνωσης του ανθρώπου· η επιβίωσή του είναι εδώ αλληλένδετη με τις ανθρώπινες κοινωνίες.","a":["την ανάπτυξη της κοινωνικής οργάνωσης του ανθρώπου","είναι εδώ αλληλένδετη"]},{"id":"r55","s":8,"q":"Γιατί κάθε αρετή είναι, για τον Πρωταγόρα, πολιτική;","r":"Γιατί κύριος στόχος της είναι η αρμονική οργάνωση και ζωή της κοινωνίας, όχι η ηθική βελτίωση του ανθρώπου.","a":["την αρμονική οργάνωση και ζωή της κοινωνίας"]},{"id":"r56","s":8,"q":"Πώς νοείται ο άνθρωπος στην αρχαία ελληνική νοοτροπία;","r":"Κυρίως ως πολίτης, ως υπεύθυνο μέλος μιας οργανωμένης κοινωνίας· η αρετή του ως ιδιώτη δεν ξεχωρίζει από την αρετή του ως πολίτη.","a":["ως υπεύθυνο μέλος μιας οργανωμένης κοινωνίας"]}],"tf":[{"id":"t13","s":1,"ok":true,"t":"Το πρώτο θέμα του διαλόγου είναι η φύση της αρετής.","why":"Σωστό. Αυτό συζητούν τα δύο κεντρικά πρόσωπα, ο Πρωταγόρας και ο Σωκράτης.","a":["ποια είναι η φύση της αρετής"]},{"id":"t14","s":1,"ok":false,"t":"Για τον Σωκράτη, το αν η αρετή διδάσκεται είναι δευτερεύον ζήτημα, άσχετο με το πρώτο.","why":"Λάθος. Είναι εξίσου σοβαρό με το πρώτο· στην ουσία δεν ξεχωρίζει από αυτό.","a":["εξίσου σοβαρό με το πρώτο"]},{"id":"t15","s":1,"ok":true,"t":"Στον διάλογο αντιπαρατίθενται όχι μόνο απόψεις για την αρετή αλλά και μέθοδοι για την προσέγγιση της αλήθειας.","why":"Σωστό. Γι' αυτό το δεύτερο θέμα φαίνεται μέσα από τις μεθόδους.","a":["οι μέθοδοι για την προσέγγιση της αλήθειας"]},{"id":"t16","s":2,"ok":false,"t":"Ο Πρωταγόρας στον διάλογο εκθέτει τις απόψεις του μόνο με τη διάλεξη.","why":"Λάθος. Χρησιμοποιεί τρεις τρόπους: τον μύθο, τη διάλεξη και τον σχολιασμό των ποιητικών κειμένων.","a":["Τον μύθο, τη διάλεξη και τον σχολιασμό των ποιητικών κειμένων."]},{"id":"t17","s":2,"ok":true,"t":"Η διαλεκτική του Σωκράτη ορίζει με τη μεγαλύτερη δυνατή ακρίβεια κάθε όρο.","why":"Σωστό. Και η ακρίβεια αυτή οδηγεί σε μια απόλυτη γνώση και κατανόηση.","a":["με τη μεγαλύτερη δυνατή ακρίβεια κάθε επιμέρους θέμα και κάθε όρος"]},{"id":"t18","s":3,"ok":false,"t":"Κατά το βιβλίο, ο μύθος οδηγεί με ακρίβεια στην επιστημονική γνώση.","why":"Λάθος. Όσο μεγάλη κι αν είναι η συμβολική αξία του, δεν μπορεί να οδηγήσει με ακρίβεια στη φιλοσοφική και επιστημονική γνώση.","a":["δεν μπορεί να οδηγήσει με ακρίβεια στη φιλοσοφική και επιστημονική γνώση"]},{"id":"t19","s":3,"ok":false,"t":"Ο Πλάτωνας είναι ειρωνικός προς τον μύθο του Πρωταγόρα.","why":"Λάθος. Ο Πλάτωνας δεν είναι καθόλου ειρωνικός προς τον Πρωταγόρα στο σημείο αυτό, ίσως επειδή κι ο ίδιος δεν απέρριπτε εντελώς τη συμβολική μυθική αφήγηση.","a":["ο Πλάτωνας δεν είναι καθόλου ειρωνικός προς τον Πρωταγόρα"]},{"id":"t20","s":3,"ok":true,"t":"Ο Πλάτωνας χρησιμοποιεί τον μύθο για να συμπληρώσει μια αυστηρή φιλοσοφική απόδειξη.","why":"Σωστό. Όπως ο μύθος της σπηλιάς στην Πολιτεία· ποτέ ως αυτόνομο τρόπο.","a":["για να συμπληρώσει μιαν αυστηρή φιλοσοφική απόδειξη"]},{"id":"t21","s":4,"ok":false,"t":"Η διάλεξη, κατά το βιβλίο, είναι ο δρόμος προς την κατάκτηση της αλήθειας.","why":"Λάθος. Η μέθοδος της διάλεξης είναι μέθοδος πειθούς· καλή για τις πολιτικές συνελεύσεις και τα δικαστήρια, όχι για τη φιλοσοφία.","a":["η μέθοδος της διάλεξης είναι μέθοδος πειθούς"]},{"id":"t22","s":4,"ok":true,"t":"Ο Σωκράτης ισχυρίζεται ότι έχει πολύ κακή μνήμη.","why":"Σωστό. Είναι ειρωνεία: στη διάλεξη ο ακροατής δεν έχει καν τον χρόνο να εξετάσει όσα ακούει.","a":["έχει πολύ κακή μνήμη"]},{"id":"t23","s":4,"ok":true,"t":"Κατά το βιβλίο, η φιλοσοφία έχει σκοπό την αναζήτηση της αλήθειας.","why":"Σωστό. Γι' αυτό η διάλεξη δεν της ταιριάζει.","a":["που σκοπός της είναι η αναζήτηση της αλήθειας"]},{"id":"t24","s":5,"ok":false,"t":"Η αναφορά στους ποιητές ως αυθεντίες ήταν ιδιαίτερο γνώρισμα μόνο των σοφιστών.","why":"Λάθος. Όλοι οι αρχαίοι Έλληνες, με βασική παιδεία τα ομηρικά έπη, την έκαναν· δεν ήταν ιδιαίτερο χαρακτηριστικό των σοφιστών.","a":["δεν ήταν ιδιαίτερο χαρακτηριστικό των σοφιστών"]},{"id":"t25","s":5,"ok":true,"t":"Οι σοφιστές μπορούν να θεωρηθούν πρωτοπόροι της γλωσσολογίας.","why":"Σωστό. Της λογοτεχνικής ανάλυσης, της φιλολογίας, κυρίως δε της γλωσσολογίας.","a":["κυρίως δε της γλωσσολογίας"]},{"id":"t26","s":5,"ok":false,"t":"Ο Σωκράτης εμπιστευόταν τον γραπτό λόγο περισσότερο από τη ζωντανή συζήτηση.","why":"Λάθος. Είχε γενική καχυποψία απέναντι στον γραπτό λόγο: το γραπτό είναι βουβό, δεν μπορεί να απαντήσει.","a":["Το γραπτό είναι βουβό, δεν μπορεί να απαντήσει"]},{"id":"t27","s":6,"ok":false,"t":"Ο διάλογος κλείνει με οριστική απάντηση για τη φύση της αρετής.","why":"Λάθος. Όπως και σε άλλους νεανικούς διαλόγους του Πλάτωνα, το θέμα μένει κάπως μετέωρο· οι δύο συμφωνούν να συνεχίσουν με άλλη ευκαιρία.","a":["Όπως και σε άλλους νεανικούς διαλόγους του Πλάτωνα"]},{"id":"t28","s":6,"ok":true,"t":"Ο Πρωταγόρας αρνείται την ύπαρξη του απόλυτου και ασπάζεται τη σχετικότητα.","why":"Σωστό. Αντίθετα, ο Σωκράτης αναζητά μια αλήθεια γενική, καθολική και απόλυτη.","a":["αρνείται την ίδια την ύπαρξη του απόλυτου"]},{"id":"t29","s":6,"ok":false,"t":"Την ολοκληρωμένη αντίληψη του Πλάτωνα για την αρετή τη βρίσκουμε στον Πρωταγόρα.","why":"Λάθος. Εδώ η θέση μένει ανολοκλήρωτη· την ολοκληρωμένη θα τη συναντήσουμε στην Πολιτεία.","a":["θα τη συναντήσουμε στην Πολιτεία"]},{"id":"t30","s":7,"ok":false,"t":"Στη Θεογονία ο Ησίοδος αφηγείται αναλυτικά πώς δημιουργήθηκαν οι άνθρωποι.","why":"Λάθος. Δεν μιλά καθόλου για τη δημιουργία τους· αναφέρεται όμως στη δημιουργία της πρώτης γυναίκας, της Πανδώρας.","a":["δεν μιλά καθόλου για τη δημιουργία τους"]},{"id":"t31","s":7,"ok":true,"t":"Την ιδέα της Πανδώρας την είχε ο Δίας, θυμωμένος για την κλοπή της φωτιάς.","why":"Σωστό. Ήθελε κάτι αρκετά κακό ώστε να αντισταθμίσει τα θετικά οφέλη της φωτιάς.","a":["την είχε ο Δίας"]},{"id":"t32","s":7,"ok":true,"t":"Για τον Ησίοδο η εξέλιξη της ανθρωπότητας κάθε άλλο παρά ευτυχής ήταν.","why":"Σωστό. Τη θεωρούσε πορεία από μια μακάρια παιδική ηλικία σε μια κατάσταση γεροντικού ξεπεσμού.","a":["η εξέλιξη αυτή κάθε άλλο παρά ευτυχής ήταν"]},{"id":"t33","s":8,"ok":false,"t":"Ο Πρωταγόρας ακολουθεί την απαισιόδοξη θεώρηση του Ησίοδου.","why":"Λάθος. Κρατά την αισχύλεια θεώρηση και την αισχύλεια αισιοδοξία.","a":["την αισχύλεια θεώρηση και την αισχύλεια αισιοδοξία"]},{"id":"t34","s":8,"ok":false,"t":"Για τον Πρωταγόρα, η αρετή κοιτάζει κυρίως την ηθική βελτίωση του ανθρώπου.","why":"Λάθος. Κάθε αρετή είναι πολιτική: κύριος στόχος της η αρμονική οργάνωση και ζωή της κοινωνίας.","a":["την αρμονική οργάνωση και ζωή της κοινωνίας"]},{"id":"t35","s":8,"ok":true,"t":"Για τους αρχαίους Έλληνες η αρετή του ιδιώτη δεν ξεχωρίζει από την αρετή του πολίτη.","why":"Σωστό. Ο άνθρωπος νοείται κυρίως ως πολίτης.","a":["η αρετή του ανθρώπου ως ιδιώτη δεν ξεχωρίζει από την αρετή του ανθρώπου ως πολίτη"]},{"id":"t36","s":8,"ok":true,"t":"Για τον Αισχύλο, ο Προμηθέας είναι ευεργέτης της ανθρωπότητας.","why":"Σωστό. Η φωτιά του επιτρέπει την ανάπτυξη της γλώσσας, της γραφής, της τεχνολογίας, της τέχνης και της σκέψης.","a":["ένας μεγάλος ευεργέτης της ανθρωπότητας"]}],"mc":[{"id":"m19","s":1,"q":"Ποιο θέμα συζητούν τα δύο κεντρικά πρόσωπα του διαλόγου;","o":["Ποιος μπορεί να διδάξει την αρετή","Την ύπαρξη των θεών","Την αξία του μύθου","Τη φύση της αρετής"],"ok":3,"why":"Ποια είναι η φύση της αρετής· το άλλο θέμα, ποιος μπορεί να τη διδάξει, τίθεται στα προλογικά μέρη.","a":["ποια είναι η φύση της αρετής"]},{"id":"m20","s":1,"q":"Πού τίθεται το δεύτερο θέμα του διαλόγου;","o":["Στο τέλος του έργου","Στον μύθο του Προμηθέα","Στα προλογικά μέρη","Στον σχολιασμό των ποιητών"],"ok":2,"why":"Τίθεται στα προλογικά μέρη του έργου.","a":["τίθεται στα προλογικά μέρη του έργου"]},{"id":"m21","s":1,"q":"Ποια ερώτηση συνοδεύει, δευτερευόντως, το δεύτερο θέμα;","o":["Αν η αρετή υπάρχει από μόνη της","Αν οι σοφιστές είναι τα κατάλληλα πρόσωπα να τη διδάξουν","Αν ο μύθος οδηγεί στη γνώση","Αν οι θεοί υπάρχουν"],"ok":1,"why":"Είναι οι σοφιστές τα κατάλληλα πρόσωπα για να αναλάβουν τη διδασκαλία της αρετής;","a":["είναι οι σοφιστές τα κατάλληλα πρόσωπα"]},{"id":"m22","s":1,"q":"Μέσα από τι αποκαλύπτεται στον αναγνώστη το αν η αρετή είναι διδακτή;","o":["Μέσα από τις διαφορετικές μεθόδους των συνομιλητών","Μέσα από τον μύθο μόνο","Μέσα από ένα οριστικό συμπέρασμα","Μέσα από τα προλογικά μέρη μόνο"],"ok":0,"why":"Διαπερνά εμμέσως όλον τον διάλογο, μέσα από τις διαφορετικές μεθόδους που ακολουθεί ο καθένας.","a":["μέσα από τις διαφορετικές μεθόδους"]},{"id":"m23","s":2,"q":"Ποια είναι η μέθοδος του Σωκράτη;","o":["Η διάλεξη","Ο μύθος","Ο σχολιασμός ποιητικών κειμένων","Η διαλεκτική"],"ok":3,"why":"Η μέθοδος του Σωκράτη είναι η διαλεκτική· οι άλλες τρεις είναι οι τρόποι του Πρωταγόρα.","a":["Η μέθοδος του Σωκράτη είναι η διαλεκτική"]},{"id":"m24","s":2,"q":"Πόσους τρόπους χρησιμοποιεί ο Πρωταγόρας για να εκθέσει τις απόψεις του;","o":["Δύο","Τέσσερις","Τρεις","Έναν"],"ok":2,"why":"Χρησιμοποιεί τρεις τρόπους για να εκθέσει τις απόψεις του: τον μύθο, τη διάλεξη, τον σχολιασμό.","a":["χρησιμοποιεί τρεις τρόπους για να εκθέσει τις απόψεις του"]},{"id":"m25","s":2,"q":"Σε τι οδηγεί η ακρίβεια της σωκρατικής διαλεκτικής;","o":["Στην πειθώ των ακροατών","Σε απόλυτη γνώση και κατανόηση","Σε σχετική γνώση","Στη συμβολική αξία"],"ok":1,"why":"Οδηγεί τους συνδιαλεγόμενους σε μια απόλυτη γνώση και κατανόηση του πράγματος που μελετούν.","a":["σε μια απόλυτη γνώση και κατανόηση"]},{"id":"m26","s":3,"q":"Ποιον από τους τρόπους του Πρωταγόρα ΔΕΝ ειρωνεύεται ο Πλάτωνας;","o":["Τον μύθο","Τη διάλεξη","Τον σχολιασμό των ποιητών","Και τους τρεις τους ειρωνεύεται"],"ok":0,"why":"Στον μύθο ο Πλάτωνας δεν είναι καθόλου ειρωνικός προς τον Πρωταγόρα· τη διάλεξη την υπονομεύει με κάθε τρόπο.","a":["ο Πλάτωνας δεν είναι καθόλου ειρωνικός προς τον Πρωταγόρα"]},{"id":"m27","s":3,"q":"Ποιον μύθο του Πλάτωνα δίνει το βιβλίο ως παράδειγμα;","o":["Τον μύθο του Προμηθέα","Τον μύθο της Πανδώρας","Τη Θεογονία","Τον μύθο της σπηλιάς στην Πολιτεία"],"ok":3,"why":"Τον μύθο της σπηλιάς στην Πολιτεία: ο Πλάτωνας χρησιμοποιεί τον μύθο για να συμπληρώσει μια απόδειξη.","a":["τον μύθο της σπηλιάς στην Πολιτεία"]},{"id":"m28","s":3,"q":"Γιατί χρησιμοποιεί ο Πλάτωνας τον μύθο;","o":["Ως αυτόνομο τρόπο γνώσης","Για να πείσει τα δικαστήρια","Για να συμπληρώσει μια αυστηρή φιλοσοφική απόδειξη","Για να ειρωνευτεί τους σοφιστές"],"ok":2,"why":"Πάντοτε για να συμπληρώσει μιαν αυστηρή φιλοσοφική απόδειξη, όχι ως αυτόνομο τρόπο.","a":["για να συμπληρώσει μιαν αυστηρή φιλοσοφική απόδειξη"]},{"id":"m29","s":3,"q":"Ποιο είναι το όριο του μύθου, κατά το βιβλίο;","o":["Δεν έχει συμβολική αξία","Δεν φτάνει με ακρίβεια στην επιστημονική γνώση","Δεν έχει ποιητικό χαρακτήρα","Δεν προέρχεται ποτέ από την παράδοση"],"ok":1,"why":"Όσο μεγάλη κι αν είναι η συμβολική αξία του, δεν μπορεί να οδηγήσει με ακρίβεια στη φιλοσοφική και επιστημονική γνώση.","a":["δεν μπορεί να οδηγήσει με ακρίβεια"]},{"id":"m30","s":4,"q":"Ποια σοφιστική μέθοδο υπονομεύει ο Πλάτωνας με κάθε τρόπο;","o":["Τη διάλεξη","Τον μύθο","Τη διαλεκτική","Τον ορισμό των όρων"],"ok":0,"why":"Δεν διστάζει να ειρωνευτεί και να υπονομεύσει τη δεύτερη σοφιστική μέθοδο, τη διάλεξη.","a":["τη δεύτερη σοφιστική μέθοδο, τη διάλεξη"]},{"id":"m31","s":4,"q":"Τι ισχυρίζεται ο Σωκράτης για να υπονομεύσει τη διάλεξη;","o":["Ότι δεν ξέρει ρητορική","Ότι βαριέται τις διαλέξεις","Ότι ο ομιλητής ψεύδεται","Ότι έχει πολύ κακή μνήμη"],"ok":3,"why":"Ότι έχει πολύ κακή μνήμη και δεν συγκρατεί τις λεπτομέρειες μιας μακροσκελούς διάλεξης.","a":["έχει πολύ κακή μνήμη"]},{"id":"m32","s":4,"q":"Τι είδους μέθοδος είναι η διάλεξη;","o":["Μέθοδος κατάκτησης της αλήθειας","Μέθοδος ορισμού των όρων","Μέθοδος πειθούς","Συμβολική μυθική αφήγηση"],"ok":2,"why":"Η μέθοδος της διάλεξης είναι μέθοδος πειθούς, όχι μέθοδος κατάκτησης της αλήθειας.","a":["η μέθοδος της διάλεξης είναι μέθοδος πειθούς"]},{"id":"m33","s":4,"q":"Πού, κατά το βιβλίο, μπορεί να είναι καλή η διάλεξη;","o":["Στη φιλοσοφία","Στις πολιτικές συνελεύσεις και στα δικαστήρια","Στον σχολιασμό των ποιητών","Στην αναζήτηση των ορισμών"],"ok":1,"why":"Καλή για τις πολιτικές συνελεύσεις και τα δικαστήρια, σίγουρα όχι για τη φιλοσοφία.","a":["καλή για τις πολιτικές συνελεύσεις και τα δικαστήρια"]},{"id":"m34","s":5,"q":"Ποια ήταν η βασική παιδεία των αρχαίων Ελλήνων;","o":["Τα ομηρικά έπη","Η Θεογονία του Ησίοδου","Οι τραγωδίες του Αισχύλου","Οι διάλογοι του Πλάτωνα"],"ok":0,"why":"Η βασική παιδεία ήταν τα ομηρικά έπη· γι' αυτό ανέφεραν τον Όμηρο ως αυθεντία.","a":["η βασική παιδεία ήταν τα ομηρικά έπη"]},{"id":"m35","s":5,"q":"Για ποιον σοφιστή παραπέμπει το βιβλίο στην Εισαγωγή, σελ. 26;","o":["Για τον Πρωταγόρα","Για τον Δημόκριτο","Για τον Παρμενίδη","Για τον Πρόδικο"],"ok":3,"why":"Δες Εισαγωγή, για τον Πρόδικο, σελ. 26· εκεί που οι σοφιστές λέγονται πρωτοπόροι της γλωσσολογίας.","a":["για τον Πρόδικο, σελ. 26"]},{"id":"m36","s":5,"q":"Γιατί ο Σωκράτης δυσπιστεί στον σχολιασμό των ποιητών;","o":["Επειδή οι ποιητές ψεύδονται","Επειδή δεν ήξερε τον Όμηρο","Επειδή το γραπτό είναι βουβό και δεν απαντά","Επειδή ο σχολιασμός είναι μύθος"],"ok":2,"why":"Η γενική του καχυποψία απέναντι στον γραπτό λόγο: το γραπτό είναι βουβό, δεν μπορεί να απαντήσει σε αυτόν που του θέτει ερωτήματα.","a":["Το γραπτό είναι βουβό"]},{"id":"m37","s":5,"q":"Ποια μέθοδο θέλει να αναδείξει ο Πλάτωνας ως τη μοναδική ικανή να οδηγήσει στην αλήθεια;","o":["Τον σχολιασμό ποιητικών κειμένων","Τη σωκρατική διαλεκτική","Τη διάλεξη","Τον μύθο"],"ok":1,"why":"Θέλει να αναδείξει τη σωκρατική διαλεκτική ως μοναδική φιλοσοφική μέθοδο, και να δείξει τα όρια της σοφιστικής.","a":["να αναδείξει τη σωκρατική διαλεκτική"]},{"id":"m38","s":6,"q":"Πώς μένει στο τέλος το θέμα της φύσης της αρετής;","o":["Κάπως μετέωρο","Λυμένο οριστικά","Λυμένο υπέρ του Πρωταγόρα","Λυμένο υπέρ του Σωκράτη"],"ok":0,"why":"Μένει στο τέλος κάπως μετέωρο, χωρίς οριστικό συμπέρασμα· οι δύο συμφωνούν να συνεχίσουν με άλλη ευκαιρία.","a":["μένει στο τέλος κάπως μετέωρο"]},{"id":"m39","s":6,"q":"Τι ασπάζεται ο Πρωταγόρας στη συζήτηση για την αρετή;","o":["Το απόλυτο","Μια αλήθεια γενική και καθολική","Τη διαλεκτική","Τη σχετικότητα"],"ok":3,"why":"Αρνείται την ύπαρξη του απόλυτου και ασπάζεται τη σχετικότητα.","a":["ασπάζεται τη σχετικότητα"]},{"id":"m40","s":6,"q":"Σε ποιο έργο θα βρούμε την ολοκληρωμένη αντίληψη του Πλάτωνα για την αρετή;","o":["Στον Πρωταγόρα","Στη Θεογονία","Στην Πολιτεία","Στις Ἀντιλογίαι"],"ok":2,"why":"Θα τη συναντήσουμε στην Πολιτεία· εδώ μένει ανολοκλήρωτη.","a":["θα τη συναντήσουμε στην Πολιτεία"]},{"id":"m41","s":7,"q":"Σε ποιον ανήκει η πατρότητα του μύθου, στη μορφή που τον παραδίδει ο Πλάτωνας;","o":["Στον Πλάτωνα","Στον Πρωταγόρα","Στον Ησίοδο","Στον Αισχύλο"],"ok":1,"why":"Ανήκει προφανώς στον περίφημο σοφιστή· ο μύθος δεν έρχεται σε α function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

    if (!part || part.charAt(0) === '<') return part;

  }).join('');

  renderNav();
  $('pane').innerHTML = mode === 'rc' ? paneRC() : mode === 'tf' ? paneTF() : mode === 'mc' ? paneMC() : mode === 'mt' ? paneMT() : mode === 'gaps' ? paneGaps() : paneGlance();
}
function renderCheck() { headCheck(); renderPane(); }

/* ── κίνηση των σκηνών: μία φορά στην είσοδο, ξανά με πάτημα ── */
function arm() {
  var sc = [].slice.call(document.querySelectorAll('[data-scene]'));
  if (reduce || !('IntersectionObserver' in window)) return;          /* μένουν ορατές, χωρίς κίνηση */
  document.documentElement.classList.add('anim');
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('go'); io.unobserve(e.target); } });
  }, { threshold: 0.3 });
  sc.forEach(function (x) { io.observe(x); });
  /* δίχτυ (σταθ. 39): αν ο observer δεν χτυπήσει ποτέ, η σκηνή δεν μένει άδεια */
  setTimeout(function () { sc.forEach(function (x) { if (!x.classList.contains('go')) x.classList.add('done'); }); }, 15000);
}
function replay(fig) {
  if (reduce || !document.documentElement.classList.contains('anim')) return;
  fig.classList.remove('go', 'done'); void fig.offsetWidth; fig.classList.add('go');
}

/* ── καρτέλες + διευθύνσεις: #sN · #sN-pK/-kK · #pagides · #pinakes · #sxediagramma · #elegxos ── */
var TABS = { read: ['t-read', 'v-read'], sx: ['t-sx', 'v-sx'], ch: ['t-ch', 'v-ch'] };
var HASH = { sx: '#sxediagramma', ch: '#elegxos' };
function show(v) {
  Object.keys(TABS).forEach(function (k) { $(TABS[k][0]).setAttribute('aria-selected', String(k === v)); $(TABS[k][1]).hidden = k !== v; });
  if (v === 'sx') paintOutline();
  if (v === 'ch') renderCheck();
}
var first = true;
function route() {
  var h = location.hash;
  if (h === HASH.sx) { show('sx'); window.scrollTo(0, 0); first = false; return; }
  if (h === HASH.ch) { show('ch'); window.scrollTo(0, 0); first = false; return; }
  show('read');
  var el = /^#(s\d+(-[pk]\d+)?|pagides|pinakes)$/.test(h) && $(h.slice(1));
  if (el) {
    el.scrollIntoView({ block: el.tagName === 'P' ? 'center' : 'start' });
    if (el.tagName === 'P') { el.classList.add('flash'); setTimeout(function () { el.classList.remove('flash'); }, 1800); }
    /* οι γραμματοσειρές αλλάζουν τα ύψη: ξαναπροσγείωση μία φορά όταν φορτώσουν */
    if (first && document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (location.hash === h) el.scrollIntoView({ block: el.tagName === 'P' ? 'center' : 'start' }); });
  }
  first = false;
}
function goHash(h) { if (location.hash === h) route(); else location.hash = h; }
document.addEventListener('click', function (e) {
  var t = e.target.closest('button, [data-scene]'); if (!t) return;
  if (t.id === 't-read') { history.pushState(null, '', location.pathname + location.search); show('read'); return; }
  if (t.id === 't-sx') return goHash(HASH.sx);
  if (t.id === 't-ch') return goHash(HASH.ch);
  var ds = t.dataset || {};
  if (ds.goto === 'ch') return goHash(HASH.ch);
  if (ds.replay !== undefined) { replay(t.closest('[data-scene]')); return; }
  if (t.hasAttribute('data-scene')) { if (e.target.closest('svg')) replay(t); return; }
  if (ds.bare !== undefined) { olBare = !olBare; paintOutline(); return; }
  if (ds.mode) { mode = ds.mode; rcShown = false; renderPane(); return; }
  if (ds.rc) {
    var c = C.recall[rcOrder[rcAt]];
    if (ds.rc === 'show') rcShown = true;
    else if (ds.rc === 'yes' || ds.rc === 'no') { S.rc[c.id] = ds.rc === 'yes' ? 1 : 0; save(); rcAt = (rcAt + 1) % rcOrder.length; rcShown = false; headCheck(); }
    else if (ds.rc === 'next') { rcAt = (rcAt + 1) % rcOrder.length; rcShown = false; }
    else if (ds.rc === 'prev') { rcAt = (rcAt - 1 + rcOrder.length) % rcOrder.length; rcShown = false; }
    else if (ds.rc === 'shuf') { rcOrder = shuffle(rcOrder); rcAt = 0; rcShown = false; }
    renderPane(); return;
  }
  if (ds.tf) { S.tf[ds.tf] = ds.v === 'true'; save(); headCheck(); renderPane(); return; }
  if (ds.mc) { S.mc[ds.mc] = +ds.v; save(); headCheck(); renderPane(); return; }
  if (ds.reset) { S[ds.reset] = {}; save(); headCheck(); renderPane(); return; }
  if (ds.mtset) { mtStart(ds.mtset); renderPane(); return; }
  if (ds.mtagain !== undefined) { mtStart(mtSet); renderPane(); return; }
  if (ds.mtl) { mt.sel = +ds.mtl; renderPane(); return; }
  if (ds.mtr !== undefined) {
    if (mt.sel < 0) return;
    var x = setBy(mtSet), r = x.rows[mt.sel], okp = ds.mtr === r.d;
    mt.res[mt.sel] = okp ? 'ok' : { w: ds.mtr };
    S.mt[x.id + '|' + plain(r.k)] = okp ? 1 : 0; save();
    mt.sel = -1; headCheck(); renderPane(); return;
  }
  if (ds.clear) {
    var p = ds.clear.split(':'), kind = p.shift(), id = p.join(':');
    if (kind === 'rc') { S.rc[id] = 1; save(); }
    else if (kind === 'mt') { S.mt[id] = 1; save(); }
    else { delete S[kind][id]; save(); }
    headCheck(); renderPane(); return;
  }
});
window.addEventListener('popstate', route);
window.addEventListener('hashchange', route);

/* ── ζωγραφική ── */
$('eye').textContent = D.eye || '';
$('h1').innerHTML = md(D.title);
$('motto').innerHTML = md(D.cover.motto.gr);
$('road').innerHTML = '<p class="lbl">Ο δρόμος της εισαγωγής · ' + N + ' στάσεις, ' + D.acts.length + ' ενότητες</p>' + roadSVG() + actsHTML();
$('stops').innerHTML = ST.map(stopHTML).join('');
$('review').innerHTML = reviewHTML();
banner();
arm();
route();
})();
</script>
