<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Πρωταγόρας · Εισαγωγή Αρχαίων</title>
<!-- ⛔ ΠΑΡΑΓΕΤΑΙ: node tools/eisagogi/arxaia/build.js protagoras — μην τη γράψεις με το χέρι.
     Το κεφάλαιο ζει στο tools/eisagogi/arxaia/protagoras.json· το καλούπι εδώ (page.tpl). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300;400;500;600&family=GFS+Didot&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ══ ΤΟ ΚΑΛΟΥΠΙ ΤΗΣ ΕΙΣΑΓΩΓΗΣ ΤΩΝ ΑΡΧΑΙΩΝ ═══════════════════════════════
   Midnight (metron-design §2) · τρεις φωνές: Commissioner για πρόζα,
   GFS Didot για κάθε ελληνικό τίτλο/όρο/αρχαίο, JetBrains Mono για ετικέτες.
   ⛔ Κανένα min-width· το λάπτοπ γράφεται πρώτο και μαζεύει με max-width.
   ⛔ Τίποτα δεν γεννιέται αόρατο περιμένοντας JS (σταθ. 39): η κίνηση
   προστίθεται κάτω από html.anim και έχει πάντα τελική κατάσταση ορατή. */
:root{
  color-scheme:dark;
  --bg:oklch(13.2% .022 258); --surf:oklch(16.4% .022 258); --surf2:oklch(19.5% .022 258); --surf3:oklch(23% .022 258);
  --metal-hi:oklch(44% .013 258); --metal-lo:oklch(25% .014 258);
  --text:#EDE6D8; --soft:#C9C2B5; --muted:#A7A196; --faint:#8A8C94;
  --line:rgba(237,230,216,.07); --line2:rgba(237,230,216,.12); --line3:rgba(237,230,216,.2);
  --amber:#E8B25C; --late:#E8836F; --arx:#E8A07F;
  --gr:"GFS Didot","Literata",serif;
  --sans:"Commissioner",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--text);font:400 15.5px/1.72 var(--sans);-webkit-font-smoothing:antialiased;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px))}
.shell{max-width:1180px;margin:0 auto}
button{font:inherit;color:inherit}
a{color:inherit}
.lbl{font:500 10px/1.3 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
.gr,.t{font-family:var(--gr)}
em.t{font-style:italic;font-size:1.1em;color:var(--arx)}
b{font-weight:500;color:var(--text)}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:6px}

/* ── διαδρομή + καρτέλες ── */
.route{display:flex;align-items:center;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px 0 12px;border:1px solid var(--line2);border-radius:10px;
  text-decoration:none;font:500 13px var(--sans);color:var(--soft);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.008))}
.back:hover{color:var(--text);border-color:var(--line3)}
.crumbs{flex:1;min-width:0}
.tabs{display:flex;gap:4px;background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:3px}
.tabs button{border:0;background:none;cursor:pointer;font:500 13px var(--sans);padding:8px 16px;border-radius:8px;color:var(--muted);min-height:36px}
.tabs button[aria-selected="true"]{background:var(--surf3);color:var(--text)}
.tabs button:active{transform:scale(.97)}
.banner{margin:18px 0 0;border:1px solid rgba(232,131,111,.4);border-radius:12px;padding:12px 16px;color:var(--text);background:rgba(232,131,111,.08);font-size:14px}

/* ── εξώφυλλο ── */
.cover{display:grid;grid-template-columns:auto minmax(0,1fr);gap:48px;align-items:center;padding:64px 0 58px;border-bottom:1px solid var(--line)}
.seal{width:196px;height:196px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 50% 40%,oklch(22% .03 258),var(--surf) 74%);transition:width .4s var(--ease),height .4s var(--ease)}
.seal svg{width:100%;height:100%;display:block;overflow:visible}
.seal .rim{fill:none;stroke:var(--line3);stroke-width:1}
.seal .rim2{fill:none;stroke:var(--line2);stroke-width:1}
.seal .ring{font:400 13.5px var(--gr);letter-spacing:.32em;fill:var(--muted)}
.seal .mark{font:400 italic 92px var(--gr);fill:var(--text)}
.seal{position:relative;overflow:hidden}
.seal img{position:absolute;inset:7%;width:86%;height:86%;border-radius:50%;object-fit:cover;
  filter:invert(1) sepia(.35) saturate(.8) brightness(.93);mix-blend-mode:screen;
  -webkit-mask-image:radial-gradient(circle,#000 58%,transparent 71%);mask-image:radial-gradient(circle,#000 58%,transparent 71%)}
.seal svg{position:relative}
.seal .pip{fill:var(--surf3);stroke:var(--line3);stroke-width:1;transition:fill .4s,stroke .4s}
.seal .pip.lit{fill:var(--amber);stroke:var(--amber);filter:drop-shadow(0 0 4px rgba(232,178,92,.6))}
/* ⭐ από τη 2η επίσκεψη: το εξώφυλλο μαζεύει, ο σταθμός ανεβαίνει στην πρώτη οθόνη */
html.ret .cover{padding:30px 0 26px;gap:30px}
html.ret .seal{width:104px;height:104px}
html.ret .seal .ring{display:none}
html.ret .seal img{inset:4%;width:92%;height:92%}
html.ret .cover h1{font-size:clamp(34px,4.2vw,54px);margin:8px 0 6px}
html.ret .cover .sub{display:none}
html.ret .motto{font-size:21px}
html.ret .motto small{display:none}
html.ret .map{padding:30px 0 30px}
html.ret .map .lead,html.ret .map .h2{display:none}
html.ret .map .mapbox{margin-top:14px}
.cover h1{font:400 italic clamp(46px,6.6vw,92px)/1.02 var(--gr);margin:14px 0 14px;letter-spacing:-.005em;text-wrap:balance}
.cover .sub{color:var(--muted);margin:0 0 22px;max-width:60ch;font-size:15px}
.motto{font:400 clamp(22px,2.5vw,30px)/1.3 var(--gr);color:var(--amber)}
.motto small{display:block;font:300 italic 15px/1.5 var(--sans);color:var(--muted);margin-top:6px}

/* ── ο αστερισμός ── */
.map{padding:56px 0 50px;border-bottom:1px solid var(--line)}
.h2{font:400 italic 34px/1.15 var(--gr);margin:10px 0 8px;text-wrap:balance}
.map .lead{color:var(--muted);margin:0 0 24px;max-width:62ch}
.mapbox{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.006));border:1px solid var(--line);border-radius:18px}
.mapbox svg{display:block;width:100%;height:auto}
.edge{stroke:var(--line2);stroke-width:1.2;fill:none}
.edge.lit{stroke:var(--amber);stroke-opacity:.72}
html.anim .mapbox:not(.drawn) .edge.lit{stroke-dashoffset:var(--len)}
.edge.lit{stroke-dasharray:var(--len) var(--len);stroke-dashoffset:0;transition:stroke-dashoffset 1.3s var(--ease)}
.node{cursor:pointer}
.node circle.dot{fill:var(--bg);stroke:var(--line3);stroke-width:1.3;transition:fill .3s,stroke .3s}
.node.lit circle.dot{fill:var(--amber);stroke:var(--amber);filter:drop-shadow(0 0 7px rgba(232,178,92,.55))}
.node circle.ring{fill:none;stroke:var(--amber);stroke-width:1.4;opacity:0}
.node.here circle.ring{opacity:1}
.node circle.hit{fill:transparent;stroke:none}
.node text.nm{font:400 italic 17px var(--gr);fill:var(--soft)}
.node.lit text.nm,.node.here text.nm{fill:var(--text)}
.node text.n{font:500 10px var(--mono);letter-spacing:.2em;fill:var(--faint)}
.node .gapdot{fill:var(--late)}
.node text.gapn{font:500 10px var(--mono);fill:var(--late)}
.node:hover text.nm{fill:var(--text)}
.node:focus-visible{outline:none}
.node:focus-visible circle.ring{opacity:1;stroke:var(--text)}
.core{font:400 24px var(--gr);fill:var(--amber);opacity:.9}
.node.stamp circle.dot{animation:stamp .7s var(--ease)}
@keyframes stamp{0%{transform:scale(.3)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.node circle.dot{transform-box:fill-box;transform-origin:center}

/* ── σταθμός ── */
.st{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:60px;padding:66px 0 40px}
.st-main{min-width:0}
.num{font:400 italic 124px/.8 var(--gr);color:var(--surf3);margin:0 0 -22px;user-select:none}
.st h2{font:400 italic 36px/1.14 var(--gr);margin:10px 0 0;text-wrap:balance}
.mine{margin:12px 0 0;color:var(--muted);font-size:13.5px}
.mine .lbl{margin-right:8px}
.prose{max-width:660px;margin-top:26px}
.prose p{margin:0 0 18px;color:var(--soft)}
.quote{margin:30px 0;max-width:700px;padding:4px 0 4px 26px;position:relative}
.quote::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:var(--line3)}
.quote .lbl{display:block;margin-bottom:10px}
.quote blockquote{margin:0;font:400 italic 19px/1.62 var(--gr);color:var(--text)}
.quote cite{display:block;margin-top:12px;font:500 10px/1.4 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);font-style:normal}
.quote cite .gr{font:400 italic 14px var(--gr);letter-spacing:0;text-transform:none}
.keys{display:grid;gap:16px;margin:30px 0 0;padding:0;list-style:none;max-width:680px}
.keys li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;color:var(--soft)}
.keys li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--arx);margin-top:11px;justify-self:center}
.done{margin-top:36px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.btn{font:500 14px var(--sans);border-radius:10px;padding:0 20px;min-height:46px;cursor:pointer;border:1px solid var(--line2);
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));color:var(--text);transition:transform .12s,background .2s,border-color .2s}
.btn:hover{border-color:var(--line3)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#1a1408}
.btn.ghost{background:none}
.btn.small{min-height:40px;padding:0 14px;font-size:13px}
.done .ok{color:var(--muted);font-size:13.5px}
.done a.next{font:500 14px var(--sans);color:var(--amber);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.done a.next:hover{text-decoration:underline}

/* ── το σχέδιο: ένα πλαίσιο, ό,τι κι αν είναι μέσα ── */
.dg{margin:32px 0;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.008));border:1px solid var(--line);border-radius:16px;padding:26px 26px 24px;position:relative;overflow:hidden}
.dg .cap{font:500 10px/1.3 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
.dg .big{font:400 italic 21px/1.25 var(--gr);color:var(--text)}
.dg .sm{font-size:13.5px;line-height:1.5;color:var(--muted)}
.dg .amb{color:var(--amber)}
html.anim .dg .grow{transform:scaleX(0);transform-origin:left;animation:grow .9s var(--ease) forwards}
html.anim .dg .growy{transform:scaleY(0);transform-origin:top;animation:growy .9s var(--ease) forwards}
html.anim .dg .fade{opacity:0;animation:fade .7s var(--ease) forwards}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes growy{to{transform:scaleY(1)}}
@keyframes fade{to{opacity:1}}

/* flow: Α → Β → Γ */
.flow{display:grid;grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr) 54px minmax(0,1fr);align-items:start}
.flow .nd{text-align:center;padding:0 6px}
.flow .nd i{display:block;width:12px;height:12px;border-radius:50%;margin:4px auto 14px;border:1.3px solid var(--line3);background:var(--bg)}
.flow .nd:last-child i{background:var(--amber);border-color:var(--amber);box-shadow:0 0 12px rgba(232,178,92,.5)}
.flow .cn{height:1px;background:var(--amber);opacity:.65;margin-top:10px;position:relative}
.flow .cn::after{content:"";position:absolute;right:-1px;top:-3px;border:3.5px solid transparent;border-left:6px solid var(--amber);border-right:0}
.flow .sm{margin-top:6px}

/* repeat: ίδιο εύρημα σε κάθε στάση */
.rep .top{text-align:center;max-width:560px;margin:0 auto}
.rep .stops{display:grid;gap:18px;margin:24px 0 0}
.rep .stop{border-top:1px solid var(--line2);padding-top:14px;display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:baseline}
.rep .stop .who{color:var(--soft)}
.rep .stop .find{color:var(--amber);font:400 italic 18px/1.3 var(--gr)}
.rep .res{margin-top:22px;border-top:1px solid var(--line3);padding-top:16px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:18px;align-items:baseline}
.rep .cost{margin-top:10px;color:var(--muted);font-size:13.5px;padding-left:128px}

/* split: δύο πλευρές, ένα αποτέλεσμα */
.split .cols{display:grid;grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr);gap:26px}
.split .bar{background:var(--line2)}
.split h4{margin:6px 0 12px;font:400 italic 22px/1.2 var(--gr)}
.split .L h4{color:var(--amber)}
.split ul{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.split li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;color:var(--soft);font-size:14.5px;line-height:1.45}
.split li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--faint);margin-top:8px}
.split .L li::before{background:var(--amber)}
.split .R li::before{background:var(--late)}
.split .res{margin-top:22px;padding-top:16px;border-top:1px solid var(--line3);text-align:center}

/* fork: μία ρίζα, δύο δρόμοι */
.fork .root{text-align:center;max-width:520px;margin:0 auto}
.fork svg{display:block;width:100%;height:46px;margin:10px 0 4px}
.fork svg path{stroke:var(--line3);stroke-width:1.2;fill:none;vector-effect:non-scaling-stroke}
.fork svg path.r{stroke:var(--amber);stroke-opacity:.8}
.fork .heads,.fork .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px}
.fork .heads{margin-bottom:6px}
.fork .heads .big{font-size:22px}
.fork .heads div:last-child .big{color:var(--amber)}
.fork .row{border-top:1px solid var(--line);padding:11px 0;font-size:14.5px;line-height:1.5}
.fork .row div:first-child{color:var(--muted)}
.fork .row div:last-child{color:var(--text)}

/* dialogue: δύο φωνές */
.dlg .lanes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 30px}
.dlg .lanes .cap{padding-bottom:6px;border-bottom:1px solid var(--line2)}
.dlg .ph{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:10px 0 0}
.dlg .ph::before,.dlg .ph::after{content:"";flex:1;height:1px;background:var(--line2)}
.dlg .bub{border:1px solid var(--line2);border-radius:14px;padding:11px 14px;font-size:14.5px;line-height:1.5;color:var(--soft);background:var(--surf)}
.dlg .bub.S{grid-column:2;border-color:rgba(232,160,127,.3)}
.dlg .bub.C{grid-column:1}
.dlg .res{grid-column:1/-1;text-align:center;margin-top:16px;padding:16px 10px 4px;border-top:1px solid var(--line3)}
.dlg .res .big{color:var(--amber)}

/* descent: από τα άστρα στη γη */
.desc{text-align:center}
.desc .sky{position:relative;padding:8px 0 4px}
.desc .sky svg{display:block;width:100%;height:40px;margin-bottom:6px}
.desc .sky circle{fill:var(--soft)}
.desc .arrow{width:1px;height:58px;margin:14px auto;background:linear-gradient(var(--line3),var(--amber));position:relative}
.desc .arrow::after{content:"";position:absolute;left:-4px;bottom:-1px;border:4px solid transparent;border-top:7px solid var(--amber);border-bottom:0}
.desc .earth{border-top:1px solid var(--amber);padding-top:14px;max-width:520px;margin:0 auto}
.desc .gk{display:block;font:400 italic 17px/1.4 var(--gr);color:var(--arx);margin-top:4px}

/* ladder: τα σκαλιά της επαγωγής */
.lad .steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:0;margin-top:14px}
.lad .stp{border-top:1px solid var(--line3);border-left:1px solid var(--line3);padding:12px 14px 0 14px;position:relative}
.lad .stp::before{content:"";position:absolute;left:-1px;right:0;top:-1px;height:1.5px;background:var(--amber)}
html.anim .lad .stp::before{transform:scaleX(0);transform-origin:left;animation:grow .7s var(--ease) forwards}
.lad .stp:nth-child(1){height:96px}.lad .stp:nth-child(2){height:156px}.lad .stp:nth-child(3){height:216px}
html.anim .lad .stp:nth-child(2)::before{animation-delay:.45s}html.anim .lad .stp:nth-child(3)::before{animation-delay:.9s}
.lad .stp:last-child .big{color:var(--amber)}
.lad .caps{display:flex;justify-content:space-between;gap:12px;margin-top:12px;border-top:1px solid var(--line2);padding-top:10px}
.lad .rise{float:right;font:400 italic 18px var(--gr);color:var(--arx)}

/* scales: έξι ζυγαριές */
.scl .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 18px}
.scl .pair{text-align:center}
.scl svg{display:block;width:100%;max-width:180px;height:auto;margin:0 auto}
.scl svg path,.scl svg line{stroke:var(--metal-hi);stroke-width:1.2;fill:none}
.scl svg .beam{stroke:var(--soft)}
.scl svg .pv{fill:var(--amber);stroke:none}
.scl .w{display:grid;grid-template-columns:1fr 1fr;gap:8px;font:400 italic 16.5px/1.25 var(--gr);color:var(--text);margin-top:4px}
.scl .no{font:500 10px var(--mono);letter-spacing:.2em;color:var(--faint)}
.scl .thread{margin-top:24px;padding-top:16px;border-top:1px solid var(--line3);display:flex;align-items:center;justify-content:center;gap:12px;text-align:center}
.scl .thread i{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px rgba(232,178,92,.55);flex:none}

/* ── η πλαϊνή κάρτα ── */
aside{min-width:0}
aside .card{position:sticky;top:22px;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:22px}
aside h3{font:400 italic 22px var(--gr);margin:8px 0 12px}
.gloss{display:grid;gap:14px}
.gloss div{border-top:1px solid var(--line);padding-top:12px}
.gloss .gk{font:400 19px/1.3 var(--gr);color:var(--arx)}
.gloss .gl{color:var(--soft);font-size:13.5px;line-height:1.5}
.gloss .yours{display:block;margin-top:4px}
.mnem{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.mnem .k{font:500 13px/1.4 var(--mono);letter-spacing:.1em;color:var(--amber);margin:6px 0}
.mnem p{margin:0;color:var(--soft);font-size:13.5px;line-height:1.55}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.pager a{font:500 13px var(--sans);color:var(--soft);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.pager a:hover{color:var(--text)}
.pager a.r{text-align:right;margin-left:auto}

/* ── τέλος κεφαλαίου ── */
.fin{padding:70px 0 40px;text-align:center}
.fin p.line{font:400 italic clamp(40px,5.4vw,68px)/1.05 var(--gr);margin:18px 0 22px;color:var(--text);max-width:none}
.fin p{color:var(--muted);max-width:52ch;margin:0 auto 26px}
.fin .mapbox{max-width:900px;margin:0 auto 34px}

/* ── ο έλεγχος ── */
.ck-head{padding:56px 0 34px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.ck-head .say{font:400 italic 34px/1.2 var(--gr);margin:10px 0 0;text-wrap:balance}
.ck-head .say + p{color:var(--muted);margin:10px 0 0}
.mapbox.strip .node text.nm{font-size:15px}
.subnav{display:flex;gap:26px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:0}
.subnav button{background:none;border:0;cursor:pointer;padding:16px 0 13px;font:500 13px var(--sans);color:var(--muted);border-bottom:1px solid transparent;margin-bottom:-1px;min-height:44px}
.subnav button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--text)}
.subnav button span{font:500 10px var(--mono);color:var(--faint);margin-left:6px;letter-spacing:.08em}
.pane{padding:38px 0 20px}
.pane .intro{color:var(--muted);max-width:64ch;margin:0 0 24px}

.rc{max-width:720px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.008));border:1px solid var(--line);border-radius:18px;padding:30px 30px 26px}
.rc .q{font:400 italic 26px/1.3 var(--gr);margin:12px 0 20px;text-wrap:balance}
.rc .think{color:var(--muted);font-size:14px;margin:0 0 18px}
.rc .ans{border-top:1px solid var(--line2);padding-top:18px;color:var(--text);font-size:15.5px}
.rc .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.rc .go{font:500 13px var(--sans);color:var(--soft);text-decoration:none;display:inline-flex;align-items:center;min-height:44px;margin-left:auto}
.rc .go:hover{color:var(--text)}
.ticks{display:flex;gap:2px;max-width:720px;margin:0 0 18px}
.ticks i{flex:1;height:4px;border-radius:2px;background:var(--line2);display:block;transition:background .3s}
.ticks i.k{background:var(--amber)}
.ticks i.n{background:var(--late)}
.ticks i.here{background:var(--text);transform:scaleY(1.75)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px;max-width:720px}
.bar .pos{font:500 12px var(--mono);color:var(--faint);margin-left:auto}

.qs{display:grid;gap:14px;max-width:760px}
.qi{border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.006))}
.qi .qt{color:var(--text);margin:6px 0 12px}
.qi .opts{display:grid;gap:8px}
.qi .opt{text-align:left;width:100%;min-height:44px;padding:10px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surf);color:var(--soft);cursor:pointer;font:400 14.5px/1.45 var(--sans)}
.qi .opt:hover:not(:disabled){border-color:var(--line3);color:var(--text)}
.qi .opt:disabled{cursor:default}
.qi .opt.ok{border-color:rgba(232,178,92,.7);color:var(--text);background:rgba(232,178,92,.09)}
.qi .opt.no{border-color:rgba(232,131,111,.6);color:var(--text);background:rgba(232,131,111,.08)}
.qi .tfrow{display:flex;gap:8px}
.qi .tfrow .opt{width:auto;min-width:96px;text-align:center}
.qi .ex{margin-top:12px;color:var(--soft);font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.qi .ex .v{font:500 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;margin-right:8px}
.qi .ex .v.ok{color:var(--amber)}.qi .ex .v.no{color:var(--late)}
.qi .ex a{color:var(--muted)}
.score{max-width:760px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 18px}
.score .n{font:500 30px var(--mono);color:var(--text)}
.score .n small{font-size:14px;color:var(--faint)}

.gaps{display:grid;gap:22px;max-width:820px}
.gapst{border-top:1px solid var(--line2);padding-top:14px}
.gapst .hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.gapst .hd .big{font:400 italic 22px var(--gr)}
.gapst .hd a{margin-left:auto;font:500 13px var(--sans);color:var(--amber);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.gapst ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.gapst li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.gapst li .kind{font:500 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--late);display:block}
.gapst li .tx{color:var(--soft);font-size:14.5px}
.empty{max-width:640px;border:1px dashed var(--line3);border-radius:14px;padding:18px 20px;color:var(--soft)}

.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;max-width:1000px}
.nums div{padding:20px 22px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.nums div:nth-child(3n){border-right:0}
.nums .v{font:500 30px/1.1 var(--mono);color:var(--amber)}
.nums .l{color:var(--soft);font-size:13.5px;margin-top:6px}
.glance h3{font:400 italic 26px var(--gr);margin:44px 0 14px}
.glance .note{color:var(--muted);font-size:13.5px;margin:12px 0 0}
.pits{list-style:none;margin:0;padding:0;display:grid;gap:12px;max-width:820px}
.pits li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;color:var(--soft);align-items:start}
.pits li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--late);margin-top:10px;justify-self:center}
.pits a,.mlist a{font:500 12px var(--mono);color:var(--faint);text-decoration:none;white-space:nowrap;min-height:32px;display:inline-flex;align-items:center}
.pits a:hover,.mlist a:hover{color:var(--text)}
.idea{max-width:760px;font:400 italic 20px/1.6 var(--gr);color:var(--text);margin:0}
.mlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:1000px}
.mlist div{border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.mlist .k{font:500 13px var(--mono);letter-spacing:.1em;color:var(--amber)}
.mlist p{margin:6px 0 0;color:var(--soft);font-size:14px}

/* ── κίνηση εισόδου (μόνο κάτω από html.anim, πάντα με ορατή κατάληξη) ── */
html.anim .enter > *{animation:rise .55s var(--ease) both}
html.anim .enter > *:nth-child(2){animation-delay:.04s}html.anim .enter > *:nth-child(3){animation-delay:.08s}
html.anim .enter > *:nth-child(4){animation-delay:.12s}html.anim .enter > *:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html.anim .mapbox:not(.drawn) .edge.lit{stroke-dashoffset:0}
}

/* ── μόνο max-width ── */
@media (max-width:1040px){
  .st{grid-template-columns:minmax(0,1fr);gap:30px}
  aside .card{position:static}
}
@media (max-width:760px){
  .flow{grid-template-columns:minmax(0,1fr)}
  .flow .cn{width:1px;height:28px;margin:10px auto}
  .flow .cn::after{right:-3px;top:auto;bottom:-1px;border:3.5px solid transparent;border-top:6px solid var(--amber);border-bottom:0}
  .rep .stop{grid-template-columns:minmax(0,1fr);gap:4px}
  .rep .res{grid-template-columns:minmax(0,1fr);gap:4px}
  .rep .cost{padding-left:0}
  .split .cols{grid-template-columns:minmax(0,1fr);gap:18px}
  .split .bar{height:1px}
  .scl .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nums{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nums div:nth-child(3n){border-right:1px solid var(--line)}
  .nums div:nth-child(2n){border-right:0}
  .mlist{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  body{font-size:15px}
  .lbl,.dg .cap,.quote cite,.node text.n,.subnav button span,.scl .no{font-size:11px}
  .route{flex-wrap:wrap;gap:10px 12px;padding:14px 0}
  .crumbs{order:3;flex-basis:100%}
  .tabs{margin-left:auto}
  .tabs button{min-height:44px;padding:0 14px}
  .back{min-height:44px}
  .cover{grid-template-columns:minmax(0,1fr);gap:22px;padding:36px 0 40px}
  .seal{width:132px;height:132px}
  html.ret .seal{width:84px;height:84px}
  .map{padding:40px 0 36px}
  .h2,.st h2,.ck-head .say{font-size:28px}
  .num{font-size:84px;margin-bottom:-14px}
  .st{padding:44px 0 30px}
  .dg{padding:20px 16px 18px}
  .fork .heads,.fork .row{gap:14px}
  .dlg .lanes{gap:8px 12px}
  .lad .stp{padding:10px 8px 0}
  .lad .stp:nth-child(1){height:110px}.lad .stp:nth-child(2){height:170px}.lad .stp:nth-child(3){height:230px}
  .lad .big{font-size:17px}
  .rc{padding:22px 18px 20px}
  .rc .q{font-size:22px}
  .subnav{gap:18px}
  .gapst li{grid-template-columns:minmax(0,1fr)}
  .pits li{grid-template-columns:20px minmax(0,1fr)}
  .pits li a{grid-column:2}
  .scl .grid{grid-template-columns:minmax(0,1fr);gap:18px}
  .scl svg{max-width:170px}
  .scl .w{font-size:15.5px;max-width:300px;margin:4px auto 0}
  .scl .w span{white-space:nowrap}
}

ρικό φιλοσοφικό λόγο και τη βαρύτητα των πρωταγορικών απόψεων."]}],"diagram":{"type":"split","lh":{"t":"η φωτιά","a":["Η φωτιά, που επιτρέπει πρώτα απ' όλα στον άνθρωπο να ψήσει την τροφή του"]},"left":[{"t":"να ψήσει την τροφή του","a":["στον άνθρωπο να ψήσει την τροφή του"]},{"t":"να τρώει «πολιτισμένα», όχι σαν ζώο","a":["(άρα να βγει από την κατάσταση του ζώου και να καταναλώνει την τροφή του κατά τρόπο \"πολιτισμένο\")"]}],"rh":{"t":"η γυναίκα","a":["και η γυναίκα (που δίνει στον άνθρωπο τη δυνατότητα"]},"right":[{"t":"να σχηματίσει οικογένεια","a":["να σχηματίσει οικογένεια"]},{"t":"να αναπαραχθεί «πολιτισμένα»","a":["να αναπαραχθεί επίσης \"πολιτισμένα\")"]}],"result":{"t":"βγαίνει από την «πρωτόγονη» κατάσταση: γίνεται **άνθρωπος**","a":["τα δύο στοιχεία που οδηγούν τον άνθρωπο να βγει από την \"πρωτόγονη\" κατάσταση και να περάσει στην \"ιστορία\" και τον πολιτισμό","Με έναν λόγο, είναι τα στοιχεία που του επιτρέπουν να γίνει άνθρωπος."]}},"points":[{"t":"Η συγγένεια: ο περίφημος φιλοσοφικός μύθος του Πρωταγόρα για τη δημιουργία του ανθρώπου και των ανθρώπινων κοινωνιών συγγενεύει, από πολλές απόψεις, με άλλες αντίστοιχες **μυθικές αφηγήσεις**.","a":["Από πολλές απόψεις πάντως ο περίφημος φιλοσοφικός μύθος του Πρωταγόρα για τη δημιουργία του ανθρώπου και των ανθρώπινων κοινωνιών συγγενεύει με άλλες αντίστοιχες μυθικές αφηγήσεις."]},{"t":"Οι δύο πηγές: ο Πρωταγόρας φαίνεται να αντλεί την έμπνευσή του κυρίως από δύο κείμενα· πρώτον τη *Θεογονία* του Ησίοδου, και δεύτερον τον **Προμηθέα Δεσμώτη** του Αισχύλου.","a":["Θα επισημάνουμε δυο κείμενα κυρίως, από τα οποία φαίνεται να αντλεί την έμπνευσή του εδώ ο Πρωταγόρας.","Πρώτον, τη Θεογονία του Ησίοδου, και δεύτερον τον Προμηθέα Δεσμώτη του Αισχύλου."]},{"t":"Ο Ησίοδος: επικός διδακτικός ποιητής από την *Άσκρα* της Βοιωτίας, που έζησε τον 8ο αιώνα. Στη *Θεογονία* του περιγράφει τη γέννηση των θεών· στους ανθρώπους αφιερώνει πολύ λίγο χώρο, και μάλιστα **δεν μιλά καθόλου** για τη δημιουργία τους.","a":["Στη Θεογονία του, ο Ησίοδος (επικός διδακτικός ποιητής από την Άσκρα της Βοιωτίας, που έζησε τον 8ο αιώνα) περιγράφει τη γέννηση των θεών.","Πολύ λίγο χώρο αφιερώνει, στο ποίημα αυτό, στους ανθρώπους, και μάλιστα δεν μιλά καθόλου για τη δημιουργία τους."]},{"t":"Η Πανδώρα: σε ένα ιδιαιτέρως σημαντικό χωρίο ο Ησίοδος αναφέρεται στη δημιουργία, από τους θεούς, της πρώτης γυναίκας. Την ιδέα την είχε ο Δίας: θυμωμένος επειδή ο Προμηθέας είχε κλέψει τη φωτιά από τους θεούς και την είχε χαρίσει στους ανθρώπους, θέλησε να στείλει στους ανθρώπους κάτι αρκετά κακό ώστε να αντισταθμίσει τα **θετικά οφέλη** της φωτιάς.","a":["Όμως αναφέρεται, σε ένα ιδιαιτέρως σημαντικό χωρίο, στη δημιουργία από τους θεούς της πρώτης γυναίκας, της Πανδώρας.","Την ιδέα της δημιουργίας της Πανδώρας, κατά τον ποιητή, την είχε ο Δίας, που θυμωμένος επειδή ο Προμηθέας είχε κλέψει τη φωτιά από τους θεούς και την είχε χαρίσει στους ανθρώπους, θέλησε να στείλει στους ανθρώπους κάτι αρκετά κακό ώστε να αντισταθμίσει τα θετικά οφέλη της φωτιάς."]},{"t":"Η απαισιοδοξία: για τον Ησίοδο, που θεωρούσε την ανθρώπινη ιστορία ως μια πορεία από μια μακάρια παιδική ηλικία σε μια θλιβερή και αβάσταχτη κατάσταση **γεροντικού ξεπεσμού**, η εξέλιξη αυτή κάθε άλλο παρά ευτυχής ήταν.","a":["Για τον Ησίοδο βέβαια, που θεωρούσε την ανθρώπινη ιστορία ως μια πορεία από μια μακάρια παιδική ηλικία σε μια θλιβερή και αβάσταχτη κατάσταση γεροντικού ξεπεσμού, η εξέλιξη αυτή κάθε άλλο παρά ευτυχής ήταν."]}],"mnem":{"k":"ΦΩΤΙΑ + ΓΥΝΑΙΚΑ = ΑΝΘΡΩΠΟΣ","t":"Η φωτιά μαγειρεύει, η γυναίκα φτιάχνει οικογένεια: έτσι ο άνθρωπος αφήνει το ζώο πίσω του. Ο Ησίοδος όμως το βλέπει ως αρχή του ξεπεσμού.","a":["τα στοιχεία που του επιτρέπουν να γίνει άνθρωπος"]},"gloss":[{"k":"αβδηρίτη","d":"από τα Άβδηρα, την πατρίδα του Πρωταγόρα","a":["τον αβδηρίτη αντίπαλο του Σωκράτη"]},{"k":"χωρίο","d":"απόσπασμα, σημείο ενός κειμένου","a":["σε ένα ιδιαιτέρως σημαντικό χωρίο"]},{"k":"μακάρια","d":"ευτυχισμένη, ξέγνοιαστη","a":["από μια μακάρια παιδική ηλικία"]}]},{"n":12,"short":"Η πολιτική αρετή","xy":[985,100],"label":"Η αισχύλεια αισιοδοξία","title":"Από τη φωτιά στην πολιτική αρετή","prose":[{"t":"Για τον Αισχύλο, αντίθετα, ο Προμηθέας είναι ένας **μεγάλος ευεργέτης** της ανθρωπότητας. Η φωτιά, που ο Τιτάνας χαρίζει στους ανθρώπους, είναι και εδώ το στοιχείο που επιτρέπει στον άνθρωπο να μπει στην ιστορία και τον πολιτισμό.","a":["Για τον Αισχύλο, αντίθετα, ο Προμηθέας είναι ένας μεγάλος ευεργέτης της ανθρωπότητας.","Η φωτιά, την οποία ο Τιτάνας χαρίζει στους ανθρώπους, είναι και εδώ το στοιχείο που επιτρέπει στον άνθρωπο να μπει στην ιστορία και τον πολιτισμό."]},{"t":"Είναι όμως, κυρίως, το στοιχείο που επιτρέπει την ανάπτυξη της γλώσσας και της γραφής, την ανάπτυξη της **τεχνολογίας**, της τέχνης και της σκέψης.","a":["Είναι όμως, κυρίως, το στοιχείο που επιτρέπει την ανάπτυξη της γλώσσας και της γραφής, την ανάπτυξη της τεχνολογίας, την ανάπτυξη της τέχνης και της σκέψης."]}],"diagram":{"type":"ladder","lo":{"t":"η απαισιοδοξία του Ησίοδου","a":["μέσα στην εξαιρετικά απαισιόδοξη εικόνα που δίνει ο Ησίοδος για την ανθρωπότητα και την εξέλιξή της"]},"hi":{"t":"η πολιτική αρετή","a":["οποιαδήποτε αρετή είναι, εξ ορισμού θα λέγαμε, πολιτική"]},"rise":{"t":"ο προμηθεϊκός μύθος","a":["στη δική του εκδοχή του προμηθεϊκού μύθου"]},"steps":[{"t":"ο Ησίοδος","a":["Για τον Ησίοδο βέβαια"],"sub":{"t":"κάθε άλλο παρά ευτυχής εξέλιξη","a":["η εξέλιξη αυτή κάθε άλλο παρά ευτυχής ήταν"]}},{"t":"ο Αισχύλος","a":["Για τον Αισχύλο, αντίθετα"],"sub":{"t":"γλώσσα, γραφή, τεχνολογία, τέχνη, σκέψη","a":["την ανάπτυξη της γλώσσας και της γραφής, την ανάπτυξη της τεχνολογίας, την ανάπτυξη της τέχνης και της σκέψης"]}},{"t":"ο Πρωταγόρας","a":["Ο Πρωταγόρας κρατά προφανώς την αισχύλεια θεώρηση"],"sub":{"t":"η κοινωνική οργάνωση στο κέντρο","a":["τη βάζει στο κέντρο της μυθικής του αφήγησης"]}}]},"points":[{"t":"Ο Πρωταγόρας: κρατά την αισχύλεια θεώρηση και την **αισχύλεια αισιοδοξία**. Αν όμως ο Αισχύλος είναι ένας τραγικός ποιητής με βαθύτατες φιλοσοφικές ανησυχίες, ο Πρωταγόρας είναι ένας φιλόσοφος με έντονους «κοινωνιολογικούς» προβληματισμούς.","a":["Ο Πρωταγόρας κρατά προφανώς την αισχύλεια θεώρηση και την αισχύλεια αισιοδοξία.","Αν όμως ο Αισχύλος είναι ένας τραγικός ποιητής με βαθύτατες φιλοσοφικές ανησυχίες, ο Πρωταγόρας είναι ένας φιλόσοφος με έντονους \"κοινωνιολογικούς\" (για να μεταχειριστούμε έναν σύγχρονο όρο) προβληματισμούς."]},{"t":"Γι’ αυτό: είναι φυσικό οι προβληματισμοί αυτοί να εκφράζονται και να υπογραμμίζονται με **ιδιαίτερη έμφαση** στη δική του εκδοχή του προμηθεϊκού μύθου.","a":["Είναι λοιπόν φυσικό οι προβληματισμοί αυτοί να εκφράζονται και να υπογραμμίζονται με ιδιαίτερη έμφαση στη δική του εκδοχή του προμηθεϊκού μύθου."]},{"t":"Η κοινωνία στο κέντρο: τονίζει κυρίως την ανάπτυξη της κοινωνικής οργάνωσης του ανθρώπου και τη βάζει στο κέντρο της αφήγησης. Η ύπαρξη και επιβίωση του ανθρώπου είναι εδώ αλληλένδετη με τον σχηματισμό και τη διατήρηση των **ανθρώπινων κοινωνιών**.","a":["Έτσι, ο Πρωταγόρας τονίζει κυρίως την ανάπτυξη της κοινωνικής οργάνωσης του ανθρώπου και τη βάζει στο κέντρο της μυθικής του αφήγησης.","Η ύπαρξη και επιβίωση του ανθρώπου είναι εδώ αλληλένδετη με τον σχηματισμό και τη διατήρηση των ανθρώπινων κοινωνιών."]},{"t":"Η αρετή: οποιαδήποτε αρετή είναι, εξ ορισμού, **πολιτική**, με την έννοια ότι κύριος στόχος της είναι η αρμονική οργάνωση και ζωή της κοινωνίας και όχι η ηθική βελτίωση του ανθρώπου.","a":["Και οποιαδήποτε αρετή είναι, εξ ορισμού θα λέγαμε, πολιτική, με την έννοια ότι ως κύριο στόχο της έχει την αρμονική οργάνωση και ζωή της κοινωνίας και όχι την ηθική βελτίωση του ανθρώπου."]},{"t":"Όχι ξένη: η άποψη αυτή δεν είναι ξένη προς την αρχαία ελληνική νοοτροπία. Για τους Έλληνες η αρετή του ανθρώπου ως ιδιώτη δεν ξεχωρίζει από την αρετή του ως πολίτη· ο άνθρωπος νοείται κυρίως ως **πολίτης**, υπεύθυνο μέλος μιας οργανωμένης κοινωνίας.","a":["Η άποψη αυτή του Πρωταγόρα δεν είναι ξένη προς την αρχαία ελληνική νοοτροπία.","Πράγματι, για τους Έλληνες η αρετή του ανθρώπου ως ιδιώτη δεν ξεχωρίζει από την αρετή του ανθρώπου ως πολίτη.","Ο άνθρωπος νοείται κυρίως ως πολίτης, ως υπεύθυνο μέλος μιας οργανωμένης κοινωνίας."]}],"mnem":{"k":"ΗΣΙΟΔΟΣ ↓ · ΑΙΣΧΥΛΟΣ ↑ · ΠΡΩΤΑΓΟΡΑΣ ↑ + ΠΟΛΗ","t":"Ο Ησίοδος βλέπει ξεπεσμό, ο Αισχύλος πρόοδο, ο Πρωταγόρας πρόοδο που ζει μόνο μέσα στην κοινωνία.","a":["την αισχύλεια αισιοδοξία"]},"gloss":[{"k":"ευεργέτης","d":"αυτός που κάνει μεγάλο καλό","a":["ένας μεγάλος ευεργέτης της ανθρωπότητας"]},{"k":"αλληλένδετη","d":"δεμένη, η μία εξαρτάται από την άλλη","a":["είναι εδώ αλληλένδετη"]},{"k":"νοοτροπία","d":"τρόπος σκέψης μιας εποχής","a":["την αρχαία ελληνική νοοτροπία"]}]}],"check":{"recall":[{"id":"r01","s":1,"q":"Από πού καταγόταν ο Πρωταγόρας, και ποιος άλλος είχε γεννηθεί εκεί;","r":"Από τα Άβδηρα, τη μικρή πόλη στα παράλια της Θράκης· εκεί είχε γεννηθεί και ο Δημόκριτος.","a":["Καταγόμενος από τα Άβδηρα","όπου είχε γεννηθεί και ο Δημόκριτος"]},{"id":"r02","s":1,"q":"Πώς πέρασε το μεγαλύτερο μέρος της ζωής του;","r":"Ταξιδεύοντας· πέρασε μεγάλα διαστήματα στην Αθήνα.","a":["έζησε το μεγαλύτερο μέρος της ζωής του ταξιδεύοντας"]},{"id":"r03","s":1,"q":"Ποια αποστολή του ανατέθηκε χάρη στη σχέση του με τον Περικλή;","r":"Η κατάρτιση του συντάγματος των Θουρίων, της αθηναϊκής αποικίας που ιδρύθηκε το 444.","a":["ανετέθη στον σοφιστή η κατάρτιση του συντάγματος"]},{"id":"r04","s":1,"q":"Τι έπαθε ο Πρωταγόρας την εποχή του ολιγαρχικού πραξικοπήματος του 411;","r":"Κατηγορήθηκε για ασέβεια, τα βιβλία του κάηκαν δημοσίως και δραπέτευσε από την Αθήνα για να γλυτώσει τη ζωή του.","a":["να κατηγορηθεί για ασέβεια","Τα βιβλία του κάηκαν δημοσίως"]},{"id":"r05","s":1,"q":"Γιατί οι συντηρητικοί στόχευσαν τους σοφιστές;","r":"Τους θεωρούσαν απειλή για την παραδοσιακή τάξη.","a":["που τους θεωρούσαν απειλή για την παραδοσιακή τάξη"]},{"id":"r06","s":2,"q":"Από ποιο χαμένο βιβλίο του σώζεται απόσπασμα για τους θεούς;","r":"Από το Περὶ θεῶν· μας διαφωτίζει όχι μόνο για τους θεούς αλλά και για τη γνώση.","a":["ένα βιβλίο Περὶ θεῶν (χαμένο σήμερα)"]},{"id":"r07","s":2,"q":"Τι λέει ότι δεν μπορεί να ξέρει για τους θεούς;","r":"Ούτε αν υπάρχουν ούτε αν δεν υπάρχουν ούτε ποια είναι η μορφή τους.","a":["ούτε αν υπάρχουν ούτε αν δεν υπάρχουν ούτε ποια είναι η μορφή τους"]},{"id":"r08","s":2,"q":"Ποια δύο πράγματα εμποδίζουν τη γνώση, κατά το απόσπασμα;","r":"Το ότι πολλά πράγματα είναι άδηλα και δεν φαίνονται, και η συντομία της ανθρώπινης ζωής.","a":["πολλά πράγματα είναι άδηλα και δεν φαίνονται","η συντομία της ανθρώπινης ζωής"]},{"id":"r09","s":2,"q":"Γιατί ούτε οι αισθήσεις ούτε ο νους φτάνουν στα άδηλα;","r":"Τα άδηλα είναι αυτά που δεν προσεγγίζουν οι αισθήσεις· και ο νους δεν έχει τον αναγκαίο χρόνο για να εμβαθύνει, γιατί η ζωή είναι σύντομη.","a":["αυτά που δεν προσεγγίζουν δηλαδή οι αισθήσεις","τον αναγκαίο χρόνο για να εμβαθύνει"]},{"id":"r10","s":3,"q":"Σε ποια θέση κατέληγε ο Πρωταγόρας για τη γνώση;","r":"Σε έναν σχετικισμό: η γνώση του ανθρώπου για τα πράγματα είναι σχετική.","a":["ο Πρωταγόρας κατέληγε σε έναν σχετικισμό"]},{"id":"r11","s":3,"q":"Από τι εξαρτάται η γνώση του ανθρώπου, κατά τον σχετικισμό;","r":"Από τα μέσα του και από τις ιστορικές και κοινωνικές συνθήκες της ζωής του.","a":["από τα μέσα του και τις ιστορικές και κοινωνικές συνθήκες της ζωής του"]},{"id":"r12","s":3,"q":"Από ποιο βιβλίο είναι η πρόταση για το μέτρο, και τι σημαίνει ο τίτλος του;","r":"Από το Ἀλήθεια ἢ καταβάλλοντες λόγοι, χαμένο κι αυτό: «Η Αλήθεια ή οι λόγοι που νικούν τα άλλα επιχειρήματα».","a":["οι λόγοι που νικούν τα άλλα επιχειρήματα"]},{"id":"r13","s":3,"q":"Πώς αποδίδεται το «Πάντων χρημάτων μέτρον ἐστὶν ἄνθρωπος»;","r":"Για όλα τα πράγματα μέτρο είναι ο άνθρωπος· γι' αυτά που υπάρχουν ότι υπάρχουν, και γι' αυτά που δεν υπάρχουν ότι δεν υπάρχουν.","a":["Για όλα τα πράγματα μέτρο είναι ο άνθρωπος"]},{"id":"r14","s":3,"q":"Ποια άποψη φιλοσόφων σαν τον Παρμενίδη αρνείται η πρόταση;","r":"Ότι υπάρχει ουσία απόλυτη και αναλλοίωτη· η πρόταση λέει πως καμία τέτοια ουσία δεν υπάρχει.","a":["φιλόσοφοι σαν τον Παρμενίδη"]},{"id":"r15","s":3,"q":"Ποια διάκριση απορρίπτει η πρόταση του Πρωταγόρα;","r":"Τη διάκριση ανάμεσα στην πραγματικότητα που αντιλαμβάνονται οι αισθήσεις και σε μια άλλη αλήθεια, στην οποία ο άνθρωπος έχει πρόσβαση μόνον με τον νου.","a":["στην οποία ο άνθρωπος έχει πρόσβαση μόνον με τον νου"]},{"id":"r16","s":3,"q":"Γιατί ο Σωκράτης και ο Πλάτωνας αντιτάχθηκαν με τόσο πάθος στους σοφιστές;","r":"Αναζητούσαν με πάθος μιαν απόλυτη αλήθεια, που ορίζεται ανεξάρτητα από τον άνθρωπο· ο Πρωταγόρας έλεγε πως ο άνθρωπος ορίζει την αλήθεια.","a":["αναζητούσαν με πάθος μιαν απόλυτη αλήθεια","ο άνθρωπος ορίζει την αλήθεια"]},{"id":"r17","s":4,"q":"Για ποια θέματα ενδιαφερόταν ο Πρωταγόρας πέρα από τη γνώση;","r":"Για την ιστορία του πολιτισμού, για θέματα που σήμερα θα ονομάζαμε κοινωνιολογικά, και, ως επαγγελματίας σοφιστής, για θέματα ρητορικής.","a":["για την ιστορία του πολιτισμού","θέματα ρητορικής"]},{"id":"r18","s":4,"q":"Τι υποστήριζε στις Ἀντιλογίαι;","r":"Πως για κάθε θέμα υπάρχουν πάντα δύο αντιτιθέμενες απόψεις, που μπορεί κανείς να υποστηρίξει ανάλογα με τη θέση του.","a":["για κάθε θέμα υπάρχουν πάντα δύο αντιτιθέμενες απόψεις"]},{"id":"r19","s":4,"q":"Τι είναι οι δισσοί λόγοι, και ποιους επηρέασαν;","r":"Οι διπλοί λόγοι· επηρέασαν όχι μόνο τους ρήτορες αλλά και τους τραγικούς ποιητές.","a":["δισσούς (δηλαδή διπλούς) λόγους","αλλά και τους τραγικούς ποιητές"]},{"id":"r20","s":4,"q":"Σε ποιους συγγραφείς διαβάζουμε δείγματα δισσῶν λόγων;","r":"Στον Θουκυδίδη αλλά, κυρίως, στον Σοφοκλή και τον Ευριπίδη.","a":["στον Θουκυδίδη αλλά, κυρίως, στον Σοφοκλή και τον Ευριπίδη"]},{"id":"r21","s":5,"q":"Ποια είναι τα δύο θέματα του διαλόγου Πρωταγόρας;","r":"Ποια είναι η φύση της αρετής· και ποιος μπορεί να διδάξει την αρετή, και αν οι σοφιστές είναι τα κατάλληλα πρόσωπα.","a":["ποια είναι η φύση της αρετής","ποιος μπορεί να διδάξει την αρετή"]},{"id":"r22","s":5,"q":"Πού τίθεται το δεύτερο θέμα;","r":"Στα προλογικά μέρη του έργου.","a":["στα προλογικά μέρη του έργου"]},{"id":"r23","s":5,"q":"Πόσο σοβαρό είναι το δεύτερο θέμα για τον Σωκράτη και τον Πλάτωνα;","r":"Εξίσου σοβαρό με το πρώτο· στην ουσία δεν ξεχωρίζει από αυτό.","a":["εξίσου σοβαρό με το πρώτο"]},{"id":"r24","s":5,"q":"Πώς αποκαλύπτεται στον αναγνώστη το αν η αρετή είναι διδακτή;","r":"Διαπερνά εμμέσως όλον τον διάλογο και αποκαλύπτεται μέσα από τις διαφορετικές μεθόδους των συνομιλητών.","a":["αποκαλύπτεται στον αναγνώστη μέσα από τις διαφορετικές μεθόδους"]},{"id":"r25","s":6,"q":"Ποια είναι η μέθοδος του Σωκράτη, και σε τι επιμένει;","r":"Η διαλεκτική· ο Σωκράτης επιμένει στις ερωτήσεις που ορίζουν με τη μεγαλύτερη δυνατή ακρίβεια κάθε θέμα και κάθε όρο.","a":["Η μέθοδος του Σωκράτη είναι η διαλεκτική","Ο Σωκράτης επιμένει στις ερωτήσεις"]},{"id":"r26","s":6,"q":"Πού οδηγεί η ακρίβεια της διαλεκτικής;","r":"Σε μια απόλυτη γνώση και κατανόηση του πράγματος που μελετούν οι συνδιαλεγόμενοι.","a":["σε μια απόλυτη γνώση και κατανόηση του πράγματος"]},{"id":"r27","s":6,"q":"Ποιους τρεις τρόπους χρησιμοποιεί ο Πρωταγόρας για να εκθέσει τις απόψεις του;","r":"Τον μύθο, τη διάλεξη και τον σχολιασμό των ποιητικών κειμένων.","a":["Τον μύθο, τη διάλεξη και τον σχολιασμό των ποιητικών κειμένων."]},{"id":"r28","s":7,"q":"Πώς ορίζεται ο μύθος;","r":"Κάθε αφήγηση που έχει ποιητικό χαρακτήρα, είτε από την παράδοση και τον θρύλο είτε κατασκευή κάποιου διανοητή.","a":["κάθε αφήγηση που έχει ποιητικό χαρακτήρα"]},{"id":"r29","s":7,"q":"Γιατί ο μύθος δεν αρκεί για τη φιλοσοφία;","r":"Όσο μεγάλη κι αν είναι η συμβολική αξία του, δεν μπορεί να οδηγήσει με ακρίβεια στη φιλοσοφική και επιστημονική γνώση.","a":["δεν μπορεί να οδηγήσει με ακρίβεια στη φιλοσοφική και επιστημονική γνώση"]},{"id":"r30","s":7,"q":"Πώς χρησιμοποίησε ο ίδιος ο Πλάτωνας τον μύθο;","r":"Πολλές φορές, όπως τον μύθο της σπηλιάς στην Πολιτεία, πάντα όμως για να συμπληρώσει μιαν αυστηρή φιλοσοφική απόδειξη, όχι ως αυτόνομο τρόπο.","a":["για να συμπληρώσει μιαν αυστηρή φιλοσοφική απόδειξη","τον μύθο της σπηλιάς στην Πολιτεία"]},{"id":"r31","s":7,"q":"Γιατί ο Πλάτωνας δεν ειρωνεύεται εδώ τον Πρωταγόρα;","r":"Ίσως επειδή κι ο ίδιος δεν απέρριπτε εντελώς την αξία της συμβολικής μυθικής αφήγησης.","a":["δεν απέρριπτε εντελώς την αξία της συμβολικής μυθικής αφήγησης"]},{"id":"r32","s":8,"q":"Ποια σοφιστική μέθοδο ειρωνεύεται και υπονομεύει ο Πλάτωνας;","r":"Τη δεύτερη, τη διάλεξη.","a":["τη δεύτερη σοφιστική μέθοδο, τη διάλεξη"]},{"id":"r33","s":8,"q":"Τι ισχυρίζεται ο Σωκράτης για τη μνήμη του;","r":"Ότι έχει πολύ κακή μνήμη και δεν μπορεί, σε μια μακροσκελή διάλεξη, να συγκρατεί όλες τις λεπτομέρειες.","a":["έχει πολύ κακή μνήμη","να συγκρατεί όλες τις λεπτομέρειες"]},{"id":"r34","s":8,"q":"Τι σημαίνει στην πραγματικότητα η «κακή μνήμη» του Σωκράτη;","r":"Πως σε μια διάλεξη ο ομιλητής εκθέτει ιδέες που ο ακροατής δεν έχει καν τον χρόνο να εξετάσει.","a":["ο ακροατής δεν έχει καν τον χρόνο να εξετάσει"]},{"id":"r35","s":8,"q":"Τι είδους μέθοδος είναι η διάλεξη, και πού ταιριάζει;","r":"Μέθοδος πειθούς, όχι κατάκτησης της αλήθειας· ταιριάζει στις πολιτικές συνελεύσεις και στα δικαστήρια, όχι στη φιλοσοφία.","a":["μέθοδος πειθούς","για τις πολιτικές συνελεύσεις και τα δικαστήρια"]},{"id":"r36","s":9,"q":"Ποια είναι η τρίτη μέθοδος του Πρωταγόρα;","r":"Ο σχολιασμός ποιητικών κειμένων.","a":["τη μέθοδο του σχολιασμού ποιητικών κειμένων"]},{"id":"r37","s":9,"q":"Πώς χρησιμοποιούσαν οι αρχαίοι Έλληνες τους ποιητές;","r":"Με βασική παιδεία τα ομηρικά έπη, ανέφεραν τον Όμηρο ή άλλους ποιητές ως αυθεντίες σε ζητήματα κάθε είδους.","a":["ως αυθεντίες σε ζητήματα κάθε είδους","η βασική παιδεία ήταν τα ομηρικά έπη"]},{"id":"r38","s":9,"q":"Πρωτοπόροι ποιων επιστημών θεωρούνται οι σοφιστές;","r":"Της λογοτεχνικής ανάλυσης, της φιλολογίας, κυρίως δε της γλωσσολογίας.","a":["πρωτοπόρους της λογοτεχνικής ανάλυσης, της φιλολογίας, κυρίως δε της γλωσσολογίας"]},{"id":"r39","s":9,"q":"Ποια είναι η βασική αντίρρηση του Σωκράτη στον σχολιασμό;","r":"Η γενική του καχυποψία απέναντι στον γραπτό λόγο: το γραπτό είναι βουβό, δεν μπορεί να απαντήσει σε όποιον το ρωτά.","a":["καχυποψία του (που ήταν και καχυποψία του Πλάτωνα) απέναντι στον γραπτό λόγο","Το γραπτό είναι βουβό"]},{"id":"r40","s":9,"q":"Τι θέλει να δείξει ο Πλάτωνας σε αυτό το έργο;","r":"Τις περιορισμένες δυνατότητες της σοφιστικής, και τη σωκρατική διαλεκτική ως μοναδική φιλοσοφική μέθοδο ικανή να οδηγήσει στην αλήθεια.","a":["τις περιορισμένες δυνατότητες της σοφιστικής","τη σωκρατική διαλεκτική ως μοναδική φιλοσοφική μέθοδο"]},{"id":"r41","s":10,"q":"Πώς τελειώνει η συζήτηση για τη φύση της αρετής;","r":"Το θέμα μένει κάπως μετέωρο, χωρίς οριστικό συμπέρασμα· οι δύο συμφωνούν να συνεχίσουν τη συζήτηση με κάποια άλλη ευκαιρία.","a":["κάπως μετέωρο","συμφωνούν να συνεχίσουν τη συζήτηση"]},{"id":"r42","s":10,"q":"Ποια είναι η θέση του Πρωταγόρα και ποια του Σωκράτη;","r":"Ο Πρωταγόρας αρνείται την ύπαρξη του απόλυτου και ασπάζεται τη σχετικότητα· ο Σωκράτης αναζητά μια αλήθεια γενική, καθολική και απόλυτη.","a":["ασπάζεται τη σχετικότητα","αναζητά μια αλήθεια γενική, καθολική και απόλυτη"]},{"id":"r43","s":10,"q":"Πού θα βρούμε την ολοκληρωμένη αντίληψη του Πλάτωνα για την αρετή;","r":"Στην Πολιτεία· εδώ η θέση παραμένει σε ανολοκλήρωτη ακόμα μορφή.","a":["θα τη συναντήσουμε στην Πολιτεία","σε ανολοκλήρωτη ακόμα μορφή"]},{"id":"r44","s":11,"q":"Σε ποιον ανήκει η πατρότητα του μύθου, και πώς φέρεται ο Πλάτωνας στον Πρωταγόρα;","r":"Ανήκει στον ίδιο τον σοφιστή· ο Πλάτωνας εμφανίζεται να σέβεται τον πρωταγορικό φιλοσοφικό λόγο.","a":["ανήκει προφανώς στον περίφημο σοφιστή","να σέβεται τον πρωταγορικό φιλοσοφικό λόγο"]},{"id":"r45","s":11,"q":"Από ποια δύο κείμενα αντλεί την έμπνευσή του ο Πρωταγόρας;","r":"Από τη Θεογονία του Ησίοδου και τον Προμηθέα Δεσμώτη του Αισχύλου.","a":["τη Θεογονία του Ησίοδου, και δεύτερον τον Προμηθέα Δεσμώτη του Αισχύλου"]},{"id":"r46","s":11,"q":"Ποιος ήταν ο Ησίοδος;","r":"Επικός διδακτικός ποιητής από την Άσκρα της Βοιωτίας, που έζησε τον 8ο αιώνα.","a":["επικός διδακτικός ποιητής από την Άσκρα της Βοιωτίας, που έζησε τον 8ο αιώνα"]},{"id":"r47","s":11,"q":"Τι λέει η Θεογονία για τους ανθρώπους;","r":"Περιγράφει τη γέννηση των θεών· στους ανθρώπους αφιερώνει πολύ λίγο χώρο και δεν μιλά καθόλου για τη δημιουργία τους.","a":["δεν μιλά καθόλου για τη δημιουργία τους","περιγράφει τη γέννηση των θεών"]},{"id":"r48","s":11,"q":"Γιατί ο Δίας είχε την ιδέα της Πανδώρας;","r":"Θυμωμένος επειδή ο Προμηθέας είχε κλέψει τη φωτιά από τους θεούς, ήθελε κάτι αρκετά κακό ώστε να αντισταθμίσει τα θετικά οφέλη της φωτιάς.","a":["να αντισταθμίσει τα θετικά οφέλη της φωτιάς","ο Προμηθέας είχε κλέψει τη φωτιά από τους θεούς"]},{"id":"r49","s":11,"q":"Τι προσφέρουν στον άνθρωπο η φωτιά και η γυναίκα, κατά τον Ησίοδο;","r":"Η φωτιά, να ψήσει την τροφή του και να βγει από την κατάσταση του ζώου· η γυναίκα, να σχηματίσει οικογένεια. Έτσι μπορεί να γίνει άνθρωπος.","a":["να ψήσει την τροφή του","να σχηματίσει οικογένεια","να γίνει άνθρωπος"]},{"id":"r50","s":11,"q":"Πώς έβλεπε ο Ησίοδος την ανθρώπινη ιστορία;","r":"Ως πορεία από μια μακάρια παιδική ηλικία σε μια θλιβερή και αβάσταχτη κατάσταση γεροντικού ξεπεσμού.","a":["από μια μακάρια παιδική ηλικία σε μια θλιβερή και αβάσταχτη κατάσταση γεροντικού ξεπεσμού"]},{"id":"r51","s":12,"q":"Τι είναι ο Προμηθέας για τον Αισχύλο;","r":"Ένας μεγάλος ευεργέτης της ανθρωπότητας.","a":["ένας μεγάλος ευεργέτης της ανθρωπότητας"]},{"id":"r52","s":12,"q":"Τι επιτρέπει κυρίως η φωτιά στον Αισχύλο;","r":"Την ανάπτυξη της γλώσσας και της γραφής, της τεχνολογίας, της τέχνης και της σκέψης.","a":["την ανάπτυξη της γλώσσας και της γραφής"]},{"id":"r53","s":12,"q":"Ποια θεώρηση κρατά ο Πρωταγόρας, και πού διαφέρει από τον Αισχύλο;","r":"Την αισχύλεια θεώρηση και την αισχύλεια αισιοδοξία· όμως ο Αισχύλος είναι τραγικός ποιητής με φιλοσοφικές ανησυχίες, ο Πρωταγόρας φιλόσοφος με «κοινωνιολογικούς» προβληματισμούς.","a":["την αισχύλεια θεώρηση και την αισχύλεια αισιοδοξία","ένας φιλόσοφος με έντονους"]},{"id":"r54","s":12,"q":"Τι βάζει ο Πρωταγόρας στο κέντρο της δικής του εκδοχής;","r":"Την ανάπτυξη της κοινωνικής οργάνωσης του ανθρώπου· η επιβίωσή του είναι εδώ αλληλένδετη με τις ανθρώπινες κοινωνίες.","a":["την ανάπτυξη της κοινωνικής οργάνωσης του ανθρώπου","είναι εδώ αλληλένδετη"]},{"id":"r55","s":12,"q":"Γιατί κάθε αρετή είναι, για τον Πρωταγόρα, πολιτική;","r":"Γιατί κύριος στόχος της είναι η αρμονική οργάνωση και ζωή της κοινωνίας, όχι η ηθική βελτίωση του ανθρώπου.","a":["την αρμονική οργάνωση και ζωή της κοινωνίας"]},{"id":"r56","s":12,"q":"Πώς νοείται ο άνθρωπος στην αρχαία ελληνική νοοτροπία;","r":"Κυρίως ως πολίτης, ως υπεύθυνο μέλος μιας οργανωμένης κοινωνίας· η αρετή του ως ιδιώτη δεν ξεχωρίζει από την αρετή του ως πολίτη.","a":["ως υπεύθυνο μέλος μιας οργανωμένης κοινωνίας"]}],"tf":[{"id":"t01","s":1,"ok":false,"t":"Ο Πρωταγόρας γεννήθηκε στην Αθήνα και έζησε εκεί όλη του τη ζωή.","why":"Λάθος. Καταγόταν από τα Άβδηρα της Θράκης και έζησε το μεγαλύτερο μέρος της ζωής του ταξιδεύοντας.","a":["Καταγόμενος από τα Άβδηρα"]},{"id":"t02","s":1,"ok":true,"t":"Ο Πρωταγόρας κατάρτισε το σύνταγμα της αθηναϊκής αποικίας των Θουρίων.","why":"Σωστό. Του ανατέθηκε χάρη στη στενή του σχέση με τον Περικλή· η αποικία ιδρύθηκε το 444.","a":["η κατάρτιση του συντάγματος της αθηναϊκής αποικίας των Θουρίων"]},{"id":"t03","s":1,"ok":false,"t":"Ο Πρωταγόρας καταδικάστηκε σε θάνατο και εκτελέστηκε στην Αθήνα.","why":"Λάθος. Κατηγορήθηκε για ασέβεια, αλλά αναγκάστηκε να δραπετεύσει από την Αθήνα για να γλυτώσει τη ζωή του· πέθανε μάλλον λίγο αργότερα.","a":["αναγκάστηκε να δραπετεύσει από την Αθήνα για να γλυτώσει τη ζωή του"]},{"id":"t04","s":2,"ok":false,"t":"Στο Περὶ θεῶν ο Πρωταγόρας δηλώνει ότι οι θεοί δεν υπάρχουν.","why":"Λάθος. Λέει ότι δεν μπορεί να ξέρει ούτε αν υπάρχουν ούτε αν δεν υπάρχουν· δεν ήταν άθεος.","a":["ούτε αν υπάρχουν ούτε αν δεν υπάρχουν"]},{"id":"t05","s":2,"ok":true,"t":"Κατά τον Πρωταγόρα, η συντομία της ανθρώπινης ζωής εμποδίζει τη γνώση των άδηλων.","why":"Σωστό. Δεν προσφέρει στον άνθρωπο τον αναγκαίο χρόνο για να εμβαθύνει σε τέτοια θέματα.","a":["η συντομία της ανθρώπινης ζωής δεν προσφέρει στον άνθρωπο τον αναγκαίο χρόνο"]},{"id":"t06","s":2,"ok":false,"t":"Κατά τον Πρωταγόρα, οι αισθήσεις μπορούν να γνωρίσουν τα άδηλα, αλλά ο νους όχι.","why":"Λάθος. Ούτε οι αισθήσεις επιτρέπουν στον άνθρωπο να γνωρίσει τα άδηλα, ούτε ο νους.","a":["ούτε οι αισθήσεις επιτρέπουν στον άνθρωπο να γνωρίσει τα άδηλα"]},{"id":"t07","s":3,"ok":true,"t":"Η πρόταση «Πάντων χρημάτων μέτρον ἐστὶν ἄνθρωπος» προέρχεται από το Ἀλήθεια ἢ καταβάλλοντες λόγοι.","why":"Σωστό. Είναι η περίφημη πρότασή του, από ένα επίσης χαμένο σήμερα βιβλίο.","a":["η περίφημη πρότασή του, από το επίσης χαμένο σήμερα βιβλίο"]},{"id":"t08","s":3,"ok":false,"t":"Κατά τον Πρωταγόρα υπάρχει ουσία απόλυτη και αναλλοίωτη, όπως έλεγε και ο Παρμενίδης.","why":"Λάθος. Η πρόταση δηλώνει πως καμία ουσία απόλυτη και αναλλοίωτη δεν υπάρχει· την απόλυτη ουσία την ισχυρίζονταν φιλόσοφοι σαν τον Παρμενίδη.","a":["καμία ουσία απόλυτη και αναλλοίωτη δεν υπάρχει"]},{"id":"t09","s":3,"ok":true,"t":"Για τον Πρωταγόρα, η πραγματικότητα και η αλήθεια είναι μόνο αυτές που αντιλαμβάνεται ο άνθρωπος.","why":"Σωστό. Γι' αυτό ο άνθρωπος ορίζει το μέτρο των πραγμάτων, άρα και την αλήθεια.","a":["Η πραγματικότητα και η αλήθεια είναι μόνο αυτές που αντιλαμβάνεται ο άνθρωπος."]},{"id":"t10","s":3,"ok":false,"t":"Ο Σωκράτης και ο Πλάτωνας δέχονταν ότι η αλήθεια ορίζεται από τον άνθρωπο.","why":"Λάθος. Αναζητούσαν μιαν απόλυτη αλήθεια, η οποία ορίζεται ανεξάρτητα από τον άνθρωπο· γι' αυτό αντιτάχθηκαν στις σοφιστικές διδασκαλίες.","a":["η οποία ορίζεται ανεξάρτητα από τον άνθρωπο"]},{"id":"t11","s":4,"ok":true,"t":"Στις Ἀντιλογίαι ο Πρωταγόρας υποστήριζε ότι για κάθε θέμα υπάρχουν δύο αντιτιθέμενες απόψεις.","why":"Σωστό. Είναι οι περίφημοι δισσοί, δηλαδή διπλοί, λόγοι.","a":["για κάθε θέμα υπάρχουν πάντα δύο αντιτιθέμενες απόψεις"]},{"id":"t12","s":4,"ok":false,"t":"Οι δισσοί λόγοι επηρέασαν αποκλειστικά τους ρήτορες.","why":"Λάθος. Επηρέασαν όχι μόνον τους ρήτορες, αλλά και τους τραγικούς ποιητές· δείγματα έχουμε κυρίως στον Σοφοκλή και τον Ευριπίδη.","a":["όχι μόνον τους ρήτορες, αλλά και τους τραγικούς ποιητές"]},{"id":"t13","s":5,"ok":true,"t":"Το πρώτο θέμα του διαλόγου είναι η φύση της αρετής.","why":"Σωστό. Αυτό συζητούν τα δύο κεντρικά πρόσωπα, ο Πρωταγόρας και ο Σωκράτης.","a":["ποια είναι η φύση της αρετής"]},{"id":"t14","s":5,"ok":false,"t":"Για τον Σωκράτη, το αν η αρετή διδάσκεται είναι δευτερεύον ζήτημα, άσχετο με το πρώτο.","why":"Λάθος. Είναι εξίσου σοβαρό με το πρώτο· στην ουσία δεν ξεχωρίζει από αυτό.","a":["εξίσου σοβαρό με το πρώτο"]},{"id":"t15","s":5,"ok":true,"t":"Στον διάλογο αντιπαρατίθενται όχι μόνο απόψεις για την αρετή αλλά και μέθοδοι για την προσέγγιση της αλήθειας.","why":"Σωστό. Γι' αυτό το δεύτερο θέμα φαίνεται μέσα από τις μεθόδους.","a":["οι μέθοδοι για την προσέγγιση της αλήθειας"]},{"id":"t16","s":6,"ok":false,"t":"Ο Πρωταγόρας στον διάλογο εκθέτει τις απόψεις του μόνο με τη διάλεξη.","why":"Λάθος. Χρησιμοποιεί τρεις τρόπους: τον μύθο, τη διάλεξη και τον σχολιασμό των ποιητικών κειμένων.","a":["Τον μύθο, τη διάλεξη και τον σχολιασμό των ποιητικών κειμένων."]},{"id":"t17","s":6,"ok":true,"t":"Η διαλεκτική του Σωκράτη ορίζει με τη μεγαλύτερη δυνατή ακρίβεια κάθε όρο.","why":"Σωστό. Και η ακρίβεια αυτή οδηγεί σε μια απόλυτη γνώση και κατανόηση.","a":["με τη μεγαλύτερη δυνατή ακρίβεια κάθε επιμέρους θέμα και κάθε όρος"]},{"id":"t18","s":7,"ok":false,"t":"Κατά το βιβλίο, ο μύθος οδηγεί με ακρίβεια στην επιστημονική γνώση.","why":"Λάθος. Όσο μεγάλη κι αν είναι η συμβολική αξία του, δεν μπορεί να οδηγήσει με ακρίβεια στη φιλοσοφική και επιστημονική γνώση.","a":["δεν μπορεί να οδηγήσει με ακρίβεια στη φιλοσοφική και επιστημονική γνώση"]},{"id":"t19","s":7,"ok":false,"t":"Ο Πλάτωνας είναι ειρωνικός προς τον μύθο του Πρωταγόρα.","why":"Λάθος. Ο Πλάτωνας δεν είναι καθόλου ειρωνικός προς τον Πρωταγόρα στο σημείο αυτό, ίσως επειδή κι ο ίδιος δεν απέρριπτε εντελώς τη συμβολική μυθική αφήγηση.","a":["ο Πλάτωνας δεν είναι καθόλου ειρωνικός προς τον Πρωταγόρα"]},{"id":"t20","s":7,"ok":true,"t":"Ο Πλάτωνας χρησιμοποιεί τον μύθο για να συμπληρώσει μια αυστηρή φιλοσοφική απόδειξη.","why":"Σωστό. Όπως ο μύθος της σπηλιάς στην Πολιτεία· ποτέ ως αυτόνομο τρόπο.","a":["για να συμπληρώσει μιαν αυστηρή φιλοσοφική απόδειξη"]},{"id":"t21","s":8,"ok":false,"t":"Η διάλεξη, κατά το βιβλίο, είναι ο δρόμος προς την κατάκτηση της αλήθειας.","why":"Λάθος. Η μέθοδος της διάλεξης είναι μέθοδος πειθούς· καλή για τις πολιτικές συνελεύσεις και τα δικαστήρια, όχι για τη φιλοσοφία.","a":["η μέθοδος της διάλεξης είναι μέθοδος πειθούς"]},{"id":"t22","s":8,"ok":true,"t":"Ο Σωκράτης ισχυρίζεται ότι έχει πολύ κακή μνήμη.","why":"Σωστό. Είναι ειρωνεία: στη διάλεξη ο ακροατής δεν έχει καν τον χρόνο να εξετάσει όσα ακούει.","a":["έχει πολύ κακή μνήμη"]},{"id":"t23","s":8,"ok":true,"t":"Κατά το βιβλίο, η φιλοσοφία έχει σκοπό την αναζήτηση της αλήθειας.","why":"Σωστό. Γι' αυτό η διάλεξη δεν της ταιριάζει.","a":["που σκοπός της είναι η αναζήτηση της αλήθειας"]},{"id":"t24","s":9,"ok":false,"t":"Η αναφορά στους ποιητές ως αυθεντίες ήταν ιδιαίτερο γνώρισμα μόνο των σοφιστών.","why":"Λάθος. Όλοι οι αρχαίοι Έλληνες, με βασική παιδεία τα ομηρικά έπη, την έκαναν· δεν ήταν ιδιαίτερο χαρακτηριστικό των σοφιστών.","a":["δεν ήταν ιδιαίτερο χαρακτηριστικό των σοφιστών"]},{"id":"t25","s":9,"ok":true,"t":"Οι σοφιστές μπορούν να θεωρηθούν πρωτοπόροι της γλωσσολογίας.","why":"Σωστό. Της λογοτεχνικής ανάλυσης, της φιλολογίας, κυρίως δε της γλωσσολογίας.","a":["κυρίως δε της γλωσσολογίας"]},{"id":"t26","s":9,"ok":false,"t":"Ο Σωκράτης εμπιστευόταν τον γραπτό λόγο περισσότερο από τη ζωντανή συζήτηση.","why":"Λάθος. Είχε γενική καχυποψία απέναντι στον γραπτό λόγο: το γραπτό είναι βουβό, δεν μπορεί να απαντήσει.","a":["Το γραπτό είναι βουβό, δεν μπορεί να απαντήσει"]},{"id":"t27","s":10,"ok":false,"t":"Ο διάλογος κλείνει με οριστική απάντηση για τη φύση της αρετής.","why":"Λάθος. Όπως και σε άλλους νεανικούς διαλόγους του Πλάτωνα, το θέμα μένει κάπως μετέωρο· οι δύο συμφωνούν να συνεχίσουν με άλλη ευκαιρία.","a":["Όπως και σε άλλους νεανικούς διαλόγους του Πλάτωνα"]},{"id":"t28","s":10,"ok":true,"t":"Ο Πρωταγόρας αρνείται την ύπαρξη του απόλυτου και ασπάζεται τη σχετικότητα.","why":"Σωστό. Αντίθετα, ο Σωκράτης αναζητά μια αλήθεια γενική, καθολική και απόλυτη.","a":["αρνείται την ίδια την ύπαρξη του απόλυτου"]},{"id":"t29","s":10,"ok":false,"t":"Την ολοκληρωμένη αντίληψη του Πλάτωνα για την αρετή τη βρίσκουμε στον Πρωταγόρα.","why":"Λάθος. Εδώ η θέση μένει ανολοκλήρωτη· την ολοκληρωμένη θα τη συναντήσουμε στην Πολιτεία.","a":["θα τη συναντήσουμε στην Πολιτεία"]},{"id":"t30","s":11,"ok":false,"t":"Στη Θεογονία ο Ησίοδος αφηγείται αναλυτικά πώς δημιουργήθηκαν οι άνθρωποι.","why":"Λάθος. Δεν μιλά καθόλου για τη δημιουργία τους· αναφέρεται όμως στη δημιουργία της πρώτης γυναίκας, της Πανδώρας.","a":["δεν μιλά καθόλου για τη δημιουργία τους"]},{"id":"t31","s":11,"ok":true,"t":"Την ιδέα της Πανδώρας την είχε ο Δίας, θυμωμένος για την κλοπή της φωτιάς.","why":"Σωστό. Ήθελε κάτι αρκετά κακό ώστε να αντισταθμίσει τα θετικά οφέλη της φωτιάς.","a":["την είχε ο Δίας"]},{"id":"t32","s":11,"ok":true,"t":"Για τον Ησίοδο η εξέλιξη της ανθρωπότητας κάθε άλλο παρά ευτυχής ήταν.","why":"Σωστό. Τη θεωρούσε πορεία από μια μακάρια παιδική ηλικία σε μια κατάσταση γεροντικού ξεπεσμού.","a":["η εξέλιξη αυτή κάθε άλλο παρά ευτυχής ήταν"]},{"id":"t33","s":12,"ok":false,"t":"Ο Πρωταγόρας ακολουθεί την απαισιόδοξη θεώρηση του Ησίοδου.","why":"Λάθος. Κρατά την αισχύλεια θεώρηση και την αισχύλεια αισιοδοξία.","a":["την αισχύλεια θεώρηση και την αισχύλεια αισιοδοξία"]},{"id":"t34","s":12,"ok":false,"t":"Για τον Πρωταγόρα, η αρετή κοιτάζει κυρίως την ηθική βελτίωση του ανθρώπου.","why":"Λάθος. Κάθε αρετή είναι πολιτική: κύριος στόχος της η αρμονική οργάνωση και ζωή της κοινωνίας.","a":["την αρμονική οργάνωση και ζωή της κοινωνίας"]},{"id":"t35","s":12,"ok":true,"t":"Για τους αρχαίους Έλληνες η αρετή του ιδιώτη δεν ξεχωρίζει από την αρετή του πολίτη.","why":"Σωστό. Ο άνθρωπος νοείται κυρίως ως πολίτης.","a":["η αρετή του ανθρώπου ως ιδιώτη δεν ξεχωρίζει από την αρετή του ανθρώπου ως πολίτη"]},{"id":"t36","s":12,"ok":true,"t":"Για τον Αισχύλο, ο Προμηθέας είναι ευεργέτης της ανθρωπότητας.","why":"Σωστό. Η φωτιά του επιτρέπει την ανάπτυξη της γλώσσας, της γραφής, της τεχνολογίας, της τέχνης και της σκέψης.","a":["ένας μεγάλος ευεργέτης της ανθρωπότητας"]}],"mc":[{"id":"m01","s":1,"q":"Από πού καταγόταν ο Πρωταγόρας;","o":["Από την Αθήνα","Από τα Άβδηρα της Θράκης","Από την Άσκρα της Βοιωτίας","Από τους Θουρίους"],"ok":1,"why":"Από τα Άβδηρα, τη μικρή πόλη στα παράλια της Θράκης· εκεί γεννήθηκε και ο Δημόκριτος.","a":["Καταγόμενος από τα Άβδηρα"]},{"id":"m02","s":1,"q":"Ποιος άλλος φιλόσοφος είχε γεννηθεί στην ίδια πόλη με τον Πρωταγόρα;","o":["Ο Δημόκριτος","Ο Παρμενίδης","Ο Πρόδικος","Ο Ησίοδος"],"ok":0,"why":"Ο Δημόκριτος· και οι δύο είχαν γεννηθεί στα Άβδηρα.","a":["όπου είχε γεννηθεί και ο Δημόκριτος"]},{"id":"m03","s":1,"q":"Με ποιον πολιτικό της Αθήνας συνδέθηκε στενά ο Πρωταγόρας;","o":["Με τον Δημόκριτο","Με τον Θουκυδίδη","Με τον Σοφοκλή","Με τον Περικλή"],"ok":3,"why":"Με τον Περικλή· γι' αυτό του ανατέθηκε το σύνταγμα των Θουρίων.","a":["συνδέθηκε στενά με τον Περικλή"]},{"id":"m04","s":1,"q":"Ποια χρονιά ιδρύθηκε η αποικία των Θουρίων;","o":["Το 480","Το 411","Το 444","Το 448"],"ok":2,"why":"Το 444 ιδρύθηκε η αθηναϊκή αποικία των Θουρίων, που το σύνταγμά της κατάρτισε ο Πρωταγόρας.","a":["που ιδρύθηκε το 444"]},{"id":"m05","s":1,"q":"Για ποια κατηγορία διώχθηκε ο Πρωταγόρας το 411;","o":["Για προδοσία","Για ασέβεια","Για διαφθορά των νέων","Για δωροδοκία"],"ok":1,"why":"Κατηγορήθηκε για ασέβεια, την εποχή του ολιγαρχικού πραξικοπήματος· τα βιβλία του κάηκαν δημοσίως.","a":["να κατηγορηθεί για ασέβεια"]},{"id":"m06","s":2,"q":"Τι λέει ο Πρωταγόρας για τους θεούς στο σωζόμενο απόσπασμα;","o":["Ότι δεν μπορεί να ξέρει αν υπάρχουν ή όχι","Ότι οι θεοί δεν υπάρχουν","Ότι οι θεοί υπάρχουν και έχουν ανθρώπινη μορφή","Ότι τους γνωρίζει μόνο ο νους"],"ok":0,"why":"Ούτε αν υπάρχουν ούτε αν δεν υπάρχουν ούτε ποια είναι η μορφή τους.","a":["ούτε αν υπάρχουν ούτε αν δεν υπάρχουν"]},{"id":"m07","s":2,"q":"Ποια είναι τα δύο εμπόδια της γνώσης στο απόσπασμα;","o":["Οι αισθήσεις και ο νους","Η ασέβεια και ο φόβος","Η ρητορική και η ποίηση","Η ἀδηλότης και ο σύντομος βίος"],"ok":3,"why":"ἥ τ' ἀδηλότης καὶ βραχὺς ὢν ὁ βίος: τα άδηλα, και η συντομία της ανθρώπινης ζωής.","a":["ἥ τ' ἀδηλότης καὶ βραχὺς ὢν ὁ βίος"]},{"id":"m08","s":2,"q":"Τι σημαίνει «ἀδηλότης»;","o":["Η συντομία της ζωής","Η ασέβεια προς τους θεούς","Ότι πολλά πράγματα είναι άδηλα και δεν φαίνονται","Η σχετικότητα της γνώσης"],"ok":2,"why":"Το γεγονός ότι πολλά πράγματα είναι άδηλα και δεν φαίνονται.","a":["πολλά πράγματα είναι άδηλα και δεν φαίνονται"]},{"id":"m09","s":2,"q":"Ήταν ο Πρωταγόρας άθεος, κατά το βιβλίο;","o":["Ναι, και γι' αυτό κατηγορήθηκε","Όχι· θεωρούσε πως ο άνθρωπος δεν μπορεί να ξέρει","Ναι, το λέει ρητά για τους θεούς","Όχι· πίστευε ότι οι θεοί ορίζουν την αλήθεια"],"ok":1,"why":"Προφανώς ο Πρωταγόρας δεν ήταν άθεος· ούτε οι αισθήσεις ούτε ο νους φτάνουν στα άδηλα.","a":["ο Πρωταγόρας δεν ήταν άθεος"]},{"id":"m10","s":3,"q":"Σε ποια θέση κατέληγε ο Πρωταγόρας για τη γνώση;","o":["Στον σχετικισμό","Στη διαλεκτική","Στην απόλυτη αλήθεια","Στους δισσούς λόγους"],"ok":0,"why":"Κατέληγε σε σχετικισμό: η γνώση του ανθρώπου είναι σχετική, εξαρτάται από τα μέσα του και τις συνθήκες της ζωής του.","a":["κατέληγε σε έναν σχετικισμό"]},{"id":"m11","s":3,"q":"Τι σημαίνει ο τίτλος «Ἀλήθεια ἢ καταβάλλοντες λόγοι»;","o":["Η Αλήθεια ή οι διπλοί λόγοι","Για τους θεούς","Η Αλήθεια ή οι λόγοι που πείθουν το δικαστήριο","Η Αλήθεια ή οι λόγοι που νικούν τα άλλα επιχειρήματα"],"ok":3,"why":"Η Αλήθεια ή οι λόγοι που νικούν τα άλλα επιχειρήματα· βιβλίο χαμένο σήμερα.","a":["οι λόγοι που νικούν τα άλλα επιχειρήματα"]},{"id":"m12","s":3,"q":"Πώς αποδίδεται το «χρημάτων» στο «Πάντων χρημάτων μέτρον»;","o":["τα χρήματα","των ανθρώπων","των πραγμάτων","των θεών"],"ok":2,"why":"«Για όλα τα πράγματα μέτρο είναι ο άνθρωπος»: χρήματα εδώ σημαίνει πράγματα.","a":["Για όλα τα πράγματα μέτρο είναι ο άνθρωπος"]},{"id":"m13","s":3,"q":"Ποιος φιλόσοφος ισχυριζόταν ότι υπάρχει ουσία απόλυτη και αναλλοίωτη;","o":["Ο Δημόκριτος","Ο Παρμενίδης","Ο Πρωταγόρας","Ο Πρόδικος"],"ok":1,"why":"Το ισχυρίζονταν φιλόσοφοι σαν τον Παρμενίδη· ο Πρωταγόρας το αρνείται.","a":["φιλόσοφοι σαν τον Παρμενίδη"]},{"id":"m14","s":3,"q":"Ποιος ορίζει την αλήθεια, κατά τον Πρωταγόρα;","o":["Ο άνθρωπος","Οι θεοί","Ο νους, ανεξάρτητα από τον άνθρωπο","Η παράδοση και ο θρύλος"],"ok":0,"why":"Ο άνθρωπος ορίζει το μέτρο των πραγμάτων, άρα ο άνθρωπος ορίζει την αλήθεια.","a":["ο άνθρωπος ορίζει την αλήθεια"]},{"id":"m15","s":4,"q":"Ποιο έργο του Πρωταγόρα υποστήριζε δύο αντιτιθέμενες απόψεις για κάθε θέμα;","o":["Περὶ θεῶν","Θεογονία","Ἀλήθεια ἢ καταβάλλοντες λόγοι","Ἀντιλογίαι"],"ok":3,"why":"Έφερε τον τίτλο Ἀντιλογίαι: για κάθε θέμα δύο αντιτιθέμενες απόψεις, οι δισσοί λόγοι.","a":["έφερε τον τίτλο Ἀντιλογίαι"]},{"id":"m16","s":4,"q":"Τι σημαίνει «δισσοί λόγοι»;","o":["Λόγοι που νικούν","Γραπτοί λόγοι","Διπλοί λόγοι","Ποιητικοί λόγοι"],"ok":2,"why":"Δισσοί = διπλοί λόγοι: δύο αντιτιθέμενες απόψεις για το ίδιο θέμα.","a":["δισσούς (δηλαδή διπλούς) λόγους"]},{"id":"m17","s":4,"q":"Σε ποιον τραγικό ποιητή, κυρίως, διαβάζουμε δισσούς λόγους;","o":["Στον Αισχύλο","Στον Σοφοκλή","Στον Όμηρο","Στον Ησίοδο"],"ok":1,"why":"Στον Θουκυδίδη, αλλά κυρίως στον Σοφοκλή και τον Ευριπίδη.","a":["κυρίως, στον Σοφοκλή και τον Ευριπίδη"]},{"id":"m18","s":4,"q":"Ως επαγγελματίας σοφιστής, για τι ενδιαφερόταν ιδιαίτερα ο Πρωταγόρας;","o":["Για θέματα ρητορικής","Για τη γεωμετρία","Για τη φυσική","Για την ιατρική"],"ok":0,"why":"Ενδιαφερόταν ιδιαίτερα για θέματα ρητορικής· και για την ιστορία του πολιτισμού.","a":["ενδιαφερόταν ιδιαίτερα για θέματα ρητορικής"]},{"id":"m19","s":5,"q":"Ποιο θέμα συζητούν τα δύο κεντρικά πρόσωπα του διαλόγου;","o":["Ποιος μπορεί να διδάξει την αρετή","Την ύπαρξη των θεών","Την αξία του μύθου","Τη φύση της αρετής"],"ok":3,"why":"Ποια είναι η φύση της αρετής· το άλλο θέμα, ποιος μπορεί να τη διδάξει, τίθεται στα προλογικά μέρη.","a":["ποια είναι η φύση της αρετής"]},{"id":"m20","s":5,"q":"Πού τίθεται το δεύτερο θέμα του διαλόγου;","o":["Στο τέλος του έργου","Στον μύθο του Προμηθέα","Στα προλογικά μέρη","Στον σχολιασμό των ποιητών"],"ok":2,"why":"Τίθεται στα προλογικά μέρη του έργου.","a":["τίθεται στα προλογικά μέρη του έργου"]},{"id":"m21","s":5,"q":"Ποια ερώτηση συνοδεύει, δευτερευόντως, το δεύτερο θέμα;","o":["Αν η αρετή υπάρχει από μόνη της","Αν οι σοφιστές είναι τα κατάλληλα πρόσωπα να τη διδάξουν","Αν ο μύθος οδηγεί στη γνώση","Αν οι θεοί υπάρχουν"],"ok":1,"why":"Είναι οι σοφιστές τα κατάλληλα πρόσωπα για να αναλάβουν τη διδασκαλία της αρετής;","a":["είναι οι σοφιστές τα κατάλληλα πρόσωπα"]},{"id":"m22","s":5,"q":"Μέσα από τι αποκαλύπτεται στον αναγνώστη το αν η αρετή είναι διδακτή;","o":["Μέσα από τις διαφορετικές μεθόδους των συνομιλητών","Μέσα από τον μύθο μόνο","Μέσα από ένα οριστικό συμπέρασμα","Μέσα από τα προλογικά μέρη μόνο"],"ok":0,"why":"Διαπερνά εμμέσως όλον τον διάλογο, μέσα από τις διαφορετικές μεθόδους που ακολουθεί ο καθένας.","a":["μέσα από τις διαφορετικές μεθόδους"]},{"id":"m23","s":6,"q":"Ποια είναι η μέθοδος του Σωκράτη;","o":["Η διάλεξη","Ο μύθος","Ο σχολιασμός ποιητικών κειμένων","Η διαλεκτική"],"ok":3,"why":"Η μέθοδος του Σωκράτη είναι η διαλεκτική· οι άλλες τρεις είναι οι τρόποι του Πρωταγόρα.","a":["Η μέθοδος του Σωκράτη είναι η διαλεκτική"]},{"id":"m24","s":6,"q":"Πόσους τρόπους χρησιμοποιεί ο Πρωταγόρας για να εκθέσει τις απόψεις του;","o":["Δύο","Τέσσερις","Τρεις","Έναν"],"ok":2,"why":"Χρησιμοποιεί τρεις τρόπους για να εκθέσει τις απόψεις του: τον μύθο, τη διάλεξη, τον σχολιασμό.","a":["χρησιμοποιεί τρεις τρόπους για να εκθέσει τις απόψεις του"]},{"id":"m25","s":6,"q":"Σε τι οδηγεί η ακρίβεια της σωκρατικής διαλεκτικής;","o":["Στην πειθώ των ακροατών","Σε απόλυτη γνώση και κατανόηση","Σε σχετική γνώση","Στη συμβολική αξία"],"ok":1,"why":"Οδηγεί τους συνδιαλεγόμενους σε μια απόλυτη γνώση και κατανόηση του πράγματος που μελετούν.","a":["σε μια απόλυτη γνώση και κατανόηση"]},{"id":"m26","s":7,"q":"Ποιον από τους τρόπους του Πρωταγόρα ΔΕΝ ειρωνεύεται ο Πλάτωνας;","o":["Τον μύθο","Τη διάλεξη","Τον σχολιασμό των ποιητών","Και τους τρεις τους ειρωνεύεται"],"ok":0,"why":"Στον μύθο ο Πλάτωνας δεν είναι καθόλου ειρωνικός προς τον Πρωταγόρα· τη διάλεξη την υπονομεύει με κάθε τρόπο.","a":["ο Πλάτωνας δεν είναι καθόλου ειρωνικός προς τον Πρωταγόρα"]},{"id":"m27","s":7,"q":"Ποιον μύθο του Πλάτωνα δίνει το βιβλίο ως παράδειγμα;","o":["Τον μύθο του Προμηθέα","Τον μύθο της Πανδώρας","Τη Θεογονία","Τον μύθο της σπηλιάς στην Πολιτεία"],"ok":3,"why":"Τον μύθο της σπηλιάς στην Πολιτεία: ο Πλάτωνας χρησιμοποιεί τον μύθο για να συμπληρώσει μια απόδειξη.","a":["τον μύθο της σπηλιάς στην Πολιτεία"]},{"id":"m28","s":7,"q":"Γιατί χρησιμοποιεί ο Πλάτωνας τον μύθο;","o":["Ως αυτόνομο τρόπο γνώσης","Για να πείσει τα δικαστήρια","Για να συμπληρώσει μια αυστηρή φιλοσοφική απόδειξη","Για να ειρωνευτεί τους σοφιστές"],"ok":2,"why":"Πάντοτε για να συμπληρώσει μιαν αυστηρή φιλοσοφική απόδειξη, όχι ως αυτόνομο τρόπο.","a":["για να συμπληρώσει μιαν αυστηρή φιλοσοφική απόδειξη"]},{"id":"m29","s":7,"q":"Ποιο είναι το όριο του μύθου, κατά το βιβλίο;","o":["Δεν έχει συμβολική αξία","Δεν φτάνει με ακρίβεια στην επιστημονική γνώση","Δεν έχει ποιητικό χαρακτήρα","Δεν προέρχεται ποτέ από την παράδοση"],"ok":1,"why":"Όσο μεγάλη κι αν είναι η συμβολική αξία του, δεν μπορεί να οδηγήσει με ακρίβεια στη φιλοσοφική και επιστημονική γνώση.","a":["δεν μπορεί να οδηγήσει με ακρίβεια"]},{"id":"m30","s":8,"q":"Ποια σοφιστική μέθοδο υπονομεύει ο Πλάτωνας με κάθε τρόπο;","o":["Τη διάλεξη","Τον μύθο","Τη διαλεκτική","Τον ορισμό των όρων"],"ok":0,"why":"Δεν διστάζει να ειρωνευτεί και να υπονομεύσει τη δεύτερη σοφιστική μέθοδο, τη διάλεξη.","a":["τη δεύτερη σοφιστική μέθοδο, τη διάλεξη"]},{"id":"m31","s":8,"q":"Τι ισχυρίζεται ο Σωκράτης για να υπονομεύσει τη διάλεξη;","o":["Ότι δεν ξέρει ρητορική","Ότι βαριέται τις διαλέξεις","Ότι ο ομιλητής ψεύδεται","Ότι έχει πολύ κακή μνήμη"],"ok":3,"why":"Ότι έχει πολύ κακή μνήμη και δεν συγκρατεί τις λεπτομέρειες μιας μακροσκελούς διάλεξης.","a":["έχει πολύ κακή μνήμη"]},{"id":"m32","s":8,"q":"Τι είδους μέθοδος είναι η διάλεξη;","o":["Μέθοδος κατάκτησης της αλήθειας","Μέθοδος ορισμού των όρων","Μέθοδος πειθούς","Συμβολική μυθική αφήγηση"],"ok":2,"why":"Η μέθοδος της διάλεξης είναι μέθοδος πειθούς, όχι μέθοδος κατάκτησης της αλήθειας.","a":["η μέθοδος της διάλεξης είναι μέθοδος πειθούς"]},{"id":"m33","s":8,"q":"Πού, κατά το βιβλίο, μπορεί να είναι καλή η διάλεξη;","o":["Στη φιλοσοφία","Στις πολιτικές συνελεύσεις και στα δικαστήρια","Στον σχολιασμό των ποιητών","Στην αναζήτηση των ορισμών"],"ok":1,"why":"Καλή για τις πολιτικές συνελεύσεις και τα δικαστήρια, σίγουρα όχι για τη φιλοσοφία.","a":["καλή για τις πολιτικές συνελεύσεις και τα δικαστήρια"]},{"id":"m34","s":9,"q":"Ποια ήταν η βασική παιδεία των αρχαίων Ελλήνων;","o":["Τα ομηρικά έπη","Η Θεογονία του Ησίοδου","Οι τραγωδίες του Αισχύλου","Οι διάλογοι του Πλάτωνα"],"ok":0,"why":"Η βασική παιδεία ήταν τα ομηρικά έπη· γι' αυτό ανέφεραν τον Όμηρο ως αυθεντία.","a":["η βασική παιδεία ήταν τα ομηρικά έπη"]},{"id":"m35","s":9,"q":"Για ποιον σοφιστή παραπέμπει το βιβλίο στην Εισαγωγή, σελ. 26;","o":["Για τον Πρωταγόρα","Για τον Δημόκριτο","Για τον Παρμενίδη","Για τον Πρόδικο"],"ok":3,"why":"Δες Εισαγωγή, για τον Πρόδικο, σελ. 26· εκεί που οι σοφιστές λέγονται πρωτοπόροι της γλωσσολογίας.","a":["για τον Πρόδικο, σελ. 26"]},{"id":"m36","s":9,"q":"Γιατί ο Σωκράτης δυσπιστεί στον σχολιασμό των ποιητών;","o":["Επειδή οι ποιητές ψεύδονται","Επειδή δεν ήξερε τον Όμηρο","Επειδή το γραπτό είναι βουβό και δεν απαντά","Επειδή ο
