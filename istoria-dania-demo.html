<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Τα εθνικά δάνεια · δοκιμή</title>

<!-- ══════════════════════════════════════════════════════════════════════
     ΔΟΚΙΜΗ — «9. Τα εθνικά δάνεια» ΣΤΗ ΜΟΡΦΗ ΤΩΝ ΑΡΧΑΙΩΝ (als-v533)

     ⛔⛔ ΑΥΤΗ Η ΣΕΛΙΔΑ ΔΕΝ ΓΡΑΦΕΙ ΤΙΠΟΤΑ, ΠΟΥΘΕΝΑ.  Καμία `sync.js`, καμία
     `als-profile.js`, κανένα `localStorage`, καμία βαθμολογία.  Είναι
     ΑΝΑΓΝΩΣΤΗΣ: φορτώνει το `istoria-data.js` και το δείχνει.  Το
     περιστατικό των ζυγίσεων έγινε ακριβώς επειδή ένα harness κουβαλούσε
     scripts συγχρονισμού — μια δοκιμή δεν αγγίζει ποτέ δεδομένα.

     ⛔ ΚΑΙ ΔΕΝ ΕΙΝΑΙ ΔΕΥΤΕΡΟ ΑΝΤΙΓΡΑΦΟ ΤΗΣ ΥΛΗΣ (σταθ. 10).  Κάθε λέξη εδώ
     μέσα βγαίνει από το `window.ISTORIA.unit('b9')` — το ΙΔΙΟ αρχείο που
     διαβάζει η ζωντανή Ιστορία και που κλειδώνουν 23.454 βεβαιώσεις.  Αν
     αλλάξει η ύλη, αλλάζει και η δοκιμή· δεν μπορούν να αποκλίνουν.

     ΤΙ ΔΟΚΙΜΑΖΕΤΑΙ, ΚΑΙ ΕΙΝΑΙ ΟΙ ΤΕΣΣΕΡΙΣ ΕΠΙΘΥΜΙΕΣ ΤΗΣ ΗΜΕΡΑΣ:
     1. ΟΛΑ ΚΟΥΜΠΙΑ.  Δικό του: «δεν ήξερα καν τι υπήρχε μέσα στο page μετά
        από την μετάφραση γιατί δεν σκρόλλαρα ποτέ πιο κάτω».  Η ζωντανή
        σελίδα στοιβάζει· εδώ οι έξι στρώσεις είναι έξι κουμπιά.
     2. ΑΝΟΙΓΕΙ ΣΤΑ «ΑΠΛΑ ΛΟΓΙΑ», πάντα.
     3. ΤΑ «ΑΠΛΑ ΛΟΓΙΑ» ΛΕΝΕ ΚΑΤΕΥΘΕΙΑΝ ΤΙ ΓΙΝΕΤΑΙ.
     4. Η ΨΥΧΡΗ ΟΨΗ ΤΟΥ ARTIFACT, μετρημένη πάνω στο #0E1214.
     ══════════════════════════════════════════════════════════════════════ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- ⛔ Η ΙΔΙΑ ΣΤΟΙΒΑ ΜΕ ΤΑ ΑΡΧΑΙΑ, ΚΑΙ ΓΙΑ ΤΟΝ ΙΔΙΟ ΜΕΤΡΗΜΕΝΟ ΛΟΓΟ:
     Alegreya 233/233 ελληνικά γλυφικά, GFS Didot 233/233.  ⛔⛔ Η GEORGIA
     ΑΠΑΓΟΡΕΥΕΤΑΙ ΑΚΟΜΗ ΚΑΙ ΩΣ FALLBACK — η ζωντανή `istoria.html` γράφει
     `var(--au-serif,Georgia,serif)` και αυτό είναι προϋπάρχον, δηλωμένο,
     και ΔΕΝ διορθώνεται από μια δοκιμή. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;1,400&amp;family=GFS+Didot&amp;display=swap">

<style>
/* ══ Η ΠΑΛΕΤΑ ΤΟΥ ARTIFACT — ΜΕΤΡΗΜΕΝΗ, ΟΧΙ ΔΙΑΛΕΓΜΕΝΗ ═══════════════
   Πάνω στο #0E1214:  ivory 15,90:1 · dim 6,97:1 · faint 4,11:1 ·
   τόνος #5FD3B2 10,26:1.  Είναι ΨΥΧΡΗ οικογένεια, όχι σκούρα απόχρωση —
   αυτό ήταν όλο το μάθημα της als-v532.
   ⚠️ ΤΟ `color` ΔΗΛΩΝΕΤΑΙ ΡΗΤΑ ΣΤΟ body: η κληρονομιά περνάει την
   ΥΠΟΛΟΓΙΣΜΕΝΗ τιμή, άρα μια νέα μεταβλητή δεν ξαναβάφει ό,τι βάφτηκε. */
:root{
  --void:#0E1214; --ivory:#E8EDEA; --dim:#94A09D; --faint:#6C7876;
  --line:#232B2D; --lit:95,211,178;
  --gr:"Alegreya","GFS Didot","Times New Roman",Times,serif;
  --ti:"GFS Didot","Times New Roman",Times,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --m:680px;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ background:var(--void); color:var(--ivory);
  font-family:var(--gr); -webkit-font-smoothing:antialiased; }

/* ⛔ ΚΑΝΕΝΑ `min-width` ΣΕ ΟΛΟ ΤΟ ΑΡΧΕΙΟ.  Το `min-width` μετράει το
   VIEWPORT, όχι τον γονέα — έτσι γεννήθηκαν δύο στήλες των 280px σε
   λάπτοπ.  Ό,τι χρειάζεται όριο, το παίρνει με `max-width`. */
.top{ position:sticky; top:0; z-index:4; background:var(--void);
  padding:calc(env(safe-area-inset-top) + 14px) 40px 13px;
  max-width:1180px; margin:0 auto; }
.back{ font-family:var(--mono); font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--dim); text-decoration:none;
  display:inline-flex; gap:9px; align-items:center; }
.back:hover{ color:var(--ivory); }
.wrap{ max-width:1180px; margin:0 auto; padding:0 40px 120px; }

/* ── Η ΚΕΦΑΛΙΔΑ ─────────────────────────────────────────────────────── */
.head{ padding:34px 0 0; }
.kick{ font-family:var(--mono); font-size:11px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--dim); }
/* ⭐ ΟΡΘΙΟΣ DIDOT, ΟΠΩΣ Ο ΤΙΤΛΟΣ ΤΟΥ ARTIFACT.  Στα 56px το 1ch είναι
   ~28px, άρα 32ch ≈ 896px — ο τίτλος δεν σπάει σε τρεις γραμμές. */
.h1{ font-family:var(--ti); font-weight:400; font-size:56px; line-height:1.04;
  letter-spacing:-.01em; margin:14px 0 0; max-width:32ch; color:var(--ivory); }
.gist{ font-family:var(--gr); font-style:italic; font-size:20px; line-height:1.5;
  color:var(--dim); margin:18px 0 0; max-width:46ch; }
.cred{ display:flex; flex-wrap:wrap; gap:8px 26px; margin:28px 0 0;
  font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--faint); }
.cred b{ font-weight:500; color:var(--dim); }

/* ── Η ΠΙΝΑΚΙΔΑ ─────────────────────────────────────────────────────
   ⛔ ΛΕΕΙ ΤΗΝ ΑΛΗΘΕΙΑ ΑΥΤΗΣ ΤΗΣ ΣΕΛΙΔΑΣ ΚΑΙ ΜΟΝΟ.  Μια πινακίδα που
   ονομάζει οθόνη που δεν υπάρχει είναι το λάθος της als-v499, και
   επαναλήφθηκε στην als-v532 από την ανάποδη.  Ό,τι υπόσχεται εδώ,
   υπάρχει από κάτω ως κουμπί. */
.sign{ max-width:var(--m); margin:30px 0 0; font-size:16.5px; line-height:1.68;
  color:var(--dim); }
.sign .k{ font-family:var(--mono); font-size:10px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--faint); margin-right:14px; }
.sign b{ color:var(--ivory); font-weight:500; }

/* ── Η ΜΠΑΡΑ ΤΩΝ ΚΟΥΜΠΙΩΝ ──────────────────────────────────────────
   ⚠️ ΤΟ 52px ΕΙΝΑΙ ΜΕΤΡΗΜΕΝΟ ΥΨΟΣ ΤΗΣ `.top`, ΟΧΙ ΥΠΟΛΟΓΙΣΜΕΝΟ. Στα
   Αρχαία το «12+34+12=58» έβγαλε σχισμή 3px και περνούσε κείμενο από
   μέσα· εδώ η επικάλυψη είναι σκόπιμη. */
.tabs{ position:sticky; top:calc(env(safe-area-inset-top) + 52px); z-index:3;
  display:flex; margin:40px 0 0; background:var(--void);
  border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar{ display:none; }
.tab{ flex:0 0 auto; border:0; background:none; cursor:pointer; position:relative;
  padding:14px 24px 13px; font-family:var(--mono); font-size:11px;
  letter-spacing:.15em; text-transform:uppercase; white-space:nowrap;
  color:var(--dim); transition:color .22s ease; }
.tab:first-child{ padding-left:0; }
.tab:hover{ color:var(--ivory); }
.tab:focus-visible{ outline:2px solid rgba(var(--lit),.6); outline-offset:-4px; }
.tab.on{ color:rgb(var(--lit)); }
.tab.on:after{ content:""; position:absolute; left:0; right:0; bottom:-1px;
  height:1px; background:rgb(var(--lit)); }
.tab:first-child.on:after{ left:0; }

/* ⚠️ ΡΗΤΟΣ ΚΑΝΟΝΑΣ ΓΙΑ ΤΟ `hidden`: τα φύλλα ορίζουν δικό τους display
   (grid στα δίστηλα), και ένα τέτοιο θα νικούσε ΣΙΩΠΗΛΑ το προεπιλεγμένο
   `[hidden]{display:none}` — δηλαδή θα φαίνονταν όλες οι στρώσεις μαζί. */
.lay[hidden]{ display:none; }
.lay{ margin-top:36px; }
.lhint{ max-width:var(--m); margin:0 0 26px; font-family:var(--mono);
  font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--faint); }

/* ── 1 · ΜΕ ΑΠΛΑ ΛΟΓΙΑ ──────────────────────────────────────────────
   ⭐⭐ ΤΑ ΑΣΤΕΡΙΑ ΤΟΥ CORPUS ΔΕΝ ΤΥΠΩΝΟΝΤΑΙ, ΔΙΑΒΑΖΟΝΤΑΙ.  Κάθε γραμμή
   των «απλών λόγων» αρχίζει με ⭐, ⭐⭐ ή ⭐⭐⭐ — καθαρή ΒΑΡΥΤΗΤΑ, γραμμένη
   σαν κείμενο επειδή δεν υπήρχε αλλού να ζήσει.  Εδώ γίνεται ΓΡΑΜΜΗ στο
   περιθώριο: τρία αστέρια = τόνος, δύο = γκρι, ένα = τίποτα.
   ⛔ ΚΟΒΕΤΑΙ ΜΟΝΟ Η ΑΡΧΙΚΗ ΣΕΙΡΑ ΑΣΤΕΡΙΩΝ.  Τα ⚠️/⛔ μέσα στην πρόταση
   μένουν ανέγγιχτα — είναι μέρος του νοήματος, όχι μετα-δεδομένο. */
.simple{ max-width:var(--m); }
.sp{ position:relative; padding-left:22px; margin:0 0 24px; font-size:19px;
  line-height:1.66; color:var(--ivory); }
.sp:before{ content:""; position:absolute; left:0; top:.42em; bottom:.28em;
  width:2px; background:transparent; }
.sp.w2:before{ background:var(--line); }
.sp.w3:before{ background:rgb(var(--lit)); }
.sp.lead{ font-size:22px; line-height:1.56; }

/* ── 2 · ΤΟ ΚΕΙΜΕΝΟ ─────────────────────────────────────────────────
   Η παράγραφος αριστερά, ΤΑ ΣΗΜΕΙΑ ΤΗΣ δεξιά — ποτέ από κάτω, γιατί το
   ζητούμενο είναι να δεις ΠΟΙΑ φράση κουβαλάει ποιο σημείο. */
/* ⚠️⚠️ Η ΣΤΗΛΗ ΚΕΙΜΕΝΟΥ ΠΑΙΡΝΕΙ ΜΕΤΡΟ ΑΝΑΓΝΩΣΗΣ, ΟΧΙ `1fr`.  Με `1fr` σε
   1440px η παράγραφος έβγαινε **~90 χαρακτήρες** — πάνω από το όριο 70–78ch
   της σταθ. 51, δηλαδή ακριβώς το λάθος που κάνει μια φαρδιά οθόνη να
   διαβάζεται ΧΕΙΡΟΤΕΡΑ από μια στενή.  Το επιπλέον πλάτος δεν είναι κέρδος
   για την πρόζα· το κερδίζουν ο πίνακας και το χρονολόγιο, που το θέλουν.
   ⚠️ Και δεύτερο κέρδος: μια πιο ψηλή παράγραφος πλησιάζει σε ύψος τη στήλη
   των σημείων, οπότε το μαύρο κενό από κάτω της μικραίνει.  Δεν εξαφανίζεται
   — μια ζώνη με 6 σημεία δίπλα σε 3 προτάσεις ΕΙΝΑΙ ανισοβαρής, και ο
   διαχωριστής από κάτω είναι που την κλείνει. */
.band{ display:grid; grid-template-columns:minmax(0,640px) 300px; gap:52px;
  align-items:start; padding:0 0 34px; }
.band + .band{ border-top:1px solid var(--line); padding-top:34px; }
.pn{ font-family:var(--mono); font-size:10px; letter-spacing:.24em;
  text-transform:uppercase; color:var(--faint); margin-bottom:14px; }
.ptext{ font-size:19.5px; line-height:1.72; color:var(--ivory); margin:0; }
/* ⭐ Η ΑΓΚΥΡΑ ΕΙΝΑΙ ΥΠΟΓΡΑΜΜΙΣΗ, ΟΧΙ ΦΟΝΤΟ.  Φόντο σε επτά φράσεις μέσα
   σε μία παράγραφο κάνει το κείμενο να μοιάζει με μαρκαρισμένη φωτοτυπία. */
.a{ border-bottom:1px solid rgba(var(--lit),.42); }
.pts{ list-style:none; margin:0; padding:0; }
.pt{ padding:9px 0; border-bottom:1px solid var(--line); }
.pt:first-child{ padding-top:0; }
.pt-l{ display:block; font-size:15px; line-height:1.5; color:var(--dim); }
.pt-n{ display:block; margin-top:4px; font-family:var(--mono); font-size:10px;
  letter-spacing:.14em; color:var(--faint); }
.src{ font-family:var(--mono); font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--faint); margin-top:34px; }

/* ── 3 · Ο ΣΚΕΛΕΤΟΣ ─────────────────────────────────────────────────
   ⛔ ΧΩΡΙΣ ΠΛΑΙΣΙΟ.  Το μάθημα της als-v523 ήταν ότι «μοιάζει με σάιτ»
   θεραπεύεται ΒΓΑΖΟΝΤΑΣ τα κουτιά, όχι βάφοντάς τα αλλιώς. */
.hook{ max-width:var(--m); }
.hook-k{ font-family:var(--mono); font-size:10px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--faint); }
.hook-t{ font-family:var(--gr); font-size:19px; line-height:1.6; margin-top:12px;
  color:rgb(var(--lit)); }
.hook-w{ font-size:17px; line-height:1.68; color:var(--dim); margin-top:18px; }
.pl{ list-style:none; margin:44px 0 0; padding:0;
  display:grid; grid-template-columns:1fr 1fr; gap:0 48px; }
.pi{ padding:16px 0; border-top:1px solid var(--line); }
.pi-n{ font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  color:var(--faint); }
.pi-l{ font-size:17px; line-height:1.52; color:var(--ivory); margin-top:7px; }
.pi-h{ font-size:15px; line-height:1.62; color:var(--dim); margin-top:9px; }

/* ── 4 · ΤΟ ΧΡΟΝΟΛΟΓΙΟ ──────────────────────────────────────────────── */
.tl{ max-width:860px; }
.tr{ display:grid; grid-template-columns:96px 1fr; gap:26px; align-items:baseline;
  padding:17px 0; border-top:1px solid var(--line); }
.tr:last-child{ border-bottom:1px solid var(--line); }
.ty{ font-family:var(--mono); font-size:19px; letter-spacing:.02em;
  color:rgb(var(--lit)); }
.tt{ font-size:17.5px; line-height:1.6; color:var(--ivory); }

/* ── 5 · Ο ΠΙΝΑΚΑΣ ──────────────────────────────────────────────────
   ⚠️ ΚΥΛΑΕΙ ΜΕΣΑ ΣΤΟ ΔΙΚΟ ΤΟΥ ΚΟΥΤΙ.  Ένας πίνακας τεσσάρων στηλών σε
   τηλέφωνο δεν στριμώχνεται — κυλάει, και ΠΟΤΕ δεν σπρώχνει το σώμα. */
.twrap{ overflow-x:auto; margin-top:8px; }
table{ border-collapse:collapse; width:100%; }
th,td{ text-align:left; padding:11px 18px 11px 0; border-bottom:1px solid var(--line);
  font-size:16px; white-space:nowrap; }
th{ font-family:var(--mono); font-size:10px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--faint); font-weight:400; }
td{ color:var(--ivory); }
td.n{ font-family:var(--mono); font-size:15px; }
tr.sum td{ color:rgb(var(--lit)); border-bottom:none; padding-top:16px; }
.tcap{ font-family:var(--mono); font-size:10px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--faint); }
.tname{ font-size:19px; color:var(--ivory); margin-top:9px; }
.tread{ max-width:var(--m); margin-top:38px; font-size:17px; line-height:1.7;
  color:var(--dim); }

/* ── 6 · ΟΙ ΛΕΞΕΙΣ ──────────────────────────────────────────────────
   ⛔ ΤΡΕΙΣ ΕΤΙΚΕΤΕΣ ΠΟΥ ΔΕΝ ΜΟΙΑΖΟΥΝ, ΓΙΑΤΙ ΔΕΝ ΕΙΝΑΙ ΤΟ ΙΔΙΟ ΠΡΑΓΜΑ:
   λόγια του βιβλίου · δικά μου λόγια · ΕΚΤΟΣ ύλης. */
.tag{ font-family:var(--mono); font-size:10px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--faint); margin:0 0 18px; }
.tag.b{ color:rgb(var(--lit)); }
.tag + .defs{ margin-bottom:46px; }
.defs{ display:grid; grid-template-columns:1fr 1fr; gap:0 48px; }
.def{ padding:15px 0; border-top:1px solid var(--line); }
.dt{ font-size:17px; color:var(--ivory); }
.dd{ font-size:15.5px; line-height:1.62; color:var(--dim); margin-top:7px; }
.dn{ font-size:14.5px; line-height:1.6; color:var(--faint); margin-top:7px; }

.foot{ max-width:var(--m); margin-top:90px; padding-top:22px;
  border-top:1px solid var(--line); font-family:var(--mono); font-size:11px;
  line-height:1.7; letter-spacing:.04em; color:var(--faint); }

/* ── ΣΤΕΝΟ ─────────────────────────────────────────────────────────
   Ένα breakpoint, στα 1040 — εκεί όπου η δίστηλη ζώνη «κείμενο + σημεία»
   παύει να χωράει τα 300px της δεξιάς στήλης χωρίς να στριμώξει τη
   γραμμή ανάγνωσης. */
@media (max-width:1040px){
  :root{ --m:100%; }
  .top{ padding-left:18px; padding-right:18px; }
  .wrap{ padding:0 18px 90px; }
  .h1{ font-size:34px; }
  .gist{ font-size:18px; }
  .tabs{ margin-top:24px; }
  .tab{ padding:12px 16px 11px; letter-spacing:.1em; }
  .band{ grid-template-columns:1fr; gap:24px; }
  .band + .band{ padding-top:30px; }
  .pl,.defs{ grid-template-columns:1fr; }
  .tr{ grid-template-columns:74px 1fr; gap:16px; }
  .ptext{ font-size:18px; }
  .sp{ font-size:17.5px; }
  .sp.lead{ font-size:19px; }
}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<!-- ⛔ ΔΥΟ SCRIPT, ΚΑΙ ΤΑ ΔΥΟ ΕΙΝΑΙ ΔΕΔΟΜΕΝΑ.  Καμία sync.js, καμία
     als-profile.js, κανένα topbar — η δοκιμή δεν έχει ταυτότητα και δεν
     έχει σύννεφο.

     ⛔⛔ ΤΟ `greek-ear.js` ΔΕΝ ΕΙΝΑΙ ΠΡΟΑΙΡΕΤΙΚΟ, ΚΑΙ Η ΣΕΙΡΑ ΤΟΥ ΜΕΤΡΑΕΙ.
     Το `istoria-data.js` το απαιτεί με **`throw` στη φόρτωση** — σωστά, δεν
     σιωπά — οπότε χωρίς αυτό το `window.ISTORIA` μένει undefined για όλη τη
     ζωή της σελίδας και η δοκιμή ανοίγει ΑΔΕΙΑ.  Ακριβώς η σταθερή αρχή 37,
     που πληρώθηκε στην als-v478 με το `homework.html`: η λίστα αρχείων μιας
     σελίδας πρέπει να είναι το ΥΠΟΣΥΝΟΛΟ που της χρειάζεται όντως, με τη
     σωστή σειρά.  ⚠️ Το `throw` δεν φαίνεται πουθενά στην οθόνη — μόνο στο
     console του render, που είναι και ο μόνος που το είδε εδώ. -->
<script src="greek-ear.js"></script>
<script src="istoria-data.js"></script>
<script>
(function(){
  'use strict';
  var I = window.ISTORIA;
  var app = document.getElementById('app');

  if (!I || !I.unit || !I.unit('b9')){
    /* ⛔ ΣΙΩΠΗΛΟ-ΑΔΕΙΟ ΕΙΝΑΙ Η ΑΡΡΩΣΤΙΑ ΑΥΤΟΥ ΤΟΥ ΕΡΓΟΥ.  Μια λευκή σελίδα
       δεν λέει ποτέ αν δεν υπάρχει ύλη ή αν απέτυχε η ανάγνωσή της. */
    app.innerHTML = '<p class="sign" style="margin-top:60px">Δεν φόρτωσε η ύλη ' +
      '(<span style="font-family:var(--mono)">istoria-data.js</span>). Η δοκιμή ' +
      'δεν κρατάει δικό της αντίγραφο — αυτό είναι σκόπιμο.</p>';
    return;
  }

  var un = I.unit('b9');
  var sk = un.skeleton;
  var paras = un.text || [];
  var nEls = I.elCount(sk.points.map(function(p){ return { point:p }; }));

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ⭐⭐ ΤΑ ΑΣΤΕΡΙΑ ΕΙΝΑΙ ΒΑΡΥΤΗΤΑ, ΟΧΙ ΚΕΙΜΕΝΟ.  Κόβεται ΜΟΝΟ η αρχική
     σειρά τους (και το κενό της)· ό,τι ακολουθεί μένει αυτολεξεί.
     ⚠️ Το «⭐» είναι U+2B50 και ΕΧΕΙ variation selector σε κάποιες
     πηγές — γι' αυτό το regex δέχεται και το U+FE0F, αλλιώς θα έμενε ένα
     αόρατο ορφανό στην αρχή της πρότασης. */
  function weigh(line){
    var m = /^((?:⭐️?)+)\s*/.exec(line);
    return { w: m ? m[1].replace(/️/g,'').length : 0,
             t: m ? line.slice(m[0].length) : line };
  }

  /* ⭐ Η ΑΓΚΥΡΑ ΣΗΜΑΔΕΥΕΤΑΙ ΜΕΣΑ ΣΤΗΝ ΠΡΟΤΑΣΗ ΤΟΥ ΒΙΒΛΙΟΥ.
     ⛔ ΚΑΜΙΑ ΕΠΑΝΕΓΓΡΑΦΗ: ψάχνουμε τη φράση αυτολεξεί και τυλίγουμε ό,τι
     βρέθηκε.  Αν ΔΕΝ βρεθεί, δεν «διορθώνεται» τίποτα — μένει το κείμενο
     καθαρό.  Το αντίθετο θα ήταν σιωπηλή απόκλιση από το βιβλίο.
     ⚠️ Ταξινομούμε κατά θέση και προχωράμε αριστερά→δεξιά, γιατί οι
     αντικαταστάσεις μετακινούν τους δείκτες. */
  function markAnchors(text, pts){
    var hits = [];
    pts.forEach(function(x){
      var a = x.point.anchor;
      if (!a) return;
      var i = text.indexOf(a);
      if (i >= 0) hits.push({ i:i, len:a.length });
    });
    hits.sort(function(p, q){ return p.i - q.i; });
    var out = '', at = 0;
    hits.forEach(function(hit){
      if (hit.i < at) return;               /* επικαλυπτόμενες: κρατάμε την πρώτη */
      out += esc(text.slice(at, hit.i)) +
        '<span class="a">' + esc(text.substr(hit.i, hit.len)) + '</span>';
      at = hit.i + hit.len;
    });
    return out + esc(text.slice(at));
  }

  /* ══ ΟΙ ΕΞΙ ΣΤΡΩΣΕΙΣ, ΩΣ ΔΕΔΟΜΕΝΑ ═══════════════════════════════════
     ⭐ Καμία δεν «χτίζεται πάντα»: κάθε μία μπαίνει ΜΟΝΟ αν η υποενότητα
     την κουβαλάει.  Μια κενή στρώση πίσω από κουμπί είναι υπόσχεση που
     δεν τηρείται — και η ζωντανή σελίδα έχει ήδη πληρώσει γι' αυτό. */
  var tabs = [];
  function tab(id, label, hint, body){
    tabs.push({ id:id, label:label, hint:hint, body:body });
  }

  /* ── 1 · ΜΕ ΑΠΛΑ ΛΟΓΙΑ ─── πάντα πρώτο, πάντα ανοιχτό ── */
  if ((un.simple || []).length)
    tab('simple', 'Με απλά λόγια', 'τι γίνεται σε αυτή την υποενότητα',
      '<div class="simple">' + un.simple.map(function(line, i){
        var x = weigh(line);
        return '<p class="sp' + (x.w >= 3 ? ' w3' : x.w === 2 ? ' w2' : '') +
          (i ? '' : ' lead') + '">' + esc(x.t) + '</p>';
      }).join('') + '</div>');

  /* ── 2 · ΤΟ ΚΕΙΜΕΝΟ ─── η παράγραφος και τα σημεία ΤΗΣ, δίπλα ── */
  if (paras.length)
    tab('text', 'Το κείμενο', 'αυτολεξεί από το βιβλίο · δίπλα του τα σημεία του',
      paras.map(function(b, pi){
        var pts = I.paraPoints(un.id, pi);
        return '<div class="band"><div>' +
          '<div class="pn">Παράγραφος ' + (pi + 1) + ' / ' + paras.length +
            ' · ' + I.elCount(pts) + ' στοιχεία</div>' +
          '<p class="ptext">' + markAnchors(b.p, pts) + '</p></div>' +
          '<ul class="pts">' + pts.map(function(x, ix){
            return '<li class="pt"><span class="pt-l">' + esc(x.point.label) + '</span>' +
              '<span class="pt-n">' + (ix + 1) + ' · ' +
              ((x.point.must || []).length) + ' στοιχεία</span></li>';
          }).join('') + '</ul></div>';
      }).join('') +
      '<div class="src">Θέματα Νεοελληνικής Ιστορίας · ' + esc(un.chapter) + '</div>');

  /* ── 3 · Ο ΣΚΕΛΕΤΟΣ ─── ο γάντζος, και μετά τα σημεία με το «γιατί» ── */
  if (sk)
    tab('skel', 'Ο σκελετός', sk.points.length + ' σημεία · ' + nEls + ' στοιχεία',
      '<div class="hook"><div class="hook-k">Ο γάντζος</div>' +
      '<div class="hook-t">' + esc(sk.hook) + '</div>' +
      (sk.hookWhy ? '<div class="hook-w">' + esc(sk.hookWhy) + '</div>' : '') + '</div>' +
      '<ol class="pl">' + sk.points.map(function(p, i){
        return '<li class="pi"><div class="pi-n">' + (i + 1) + ' · ' +
          ((p.must || []).length) + ' ΣΤΟΙΧΕΙΑ</div>' +
          '<div class="pi-l">' + esc(p.label) + '</div>' +
          (p.hook ? '<div class="pi-h">' + esc(p.hook) + '</div>' : '') + '</li>';
      }).join('') + '</ol>');

  /* ── 4 · ΤΟ ΧΡΟΝΟΛΟΓΙΟ ──────────────────────────────────────────────
     ⚠️ ΤΑΞΙΝΟΜΕΙΤΑΙ ΚΑΤΑ ΕΤΟΣ, ΚΑΙ ΤΟ ΛΕΕΙ.  Στο αρχείο τα ορόσημα ζουν
     με τη ΣΕΙΡΑ ΤΟΥ ΚΕΙΜΕΝΟΥ, γι' αυτό το 1861 προηγείται του 1860 — σωστό
     εκεί, σπασμένο σε χρονολόγιο.  Κάθε ορόσημο κουβαλάει το δικό του
     έτος, άρα η ταξινόμηση δεν εφευρίσκει τίποτα· απλώς δεν γίνεται
     σιωπηλά.  ⛔ Αντίγραφο σε νέα σειρά ΔΕΝ κρατιέται πουθενά. */
  if ((un.timeline || []).length)
    tab('time', 'Το χρονολόγιο', (un.timeline.length) + ' ορόσημα · κατά έτος, όχι με τη σειρά του κειμένου',
      '<div class="tl">' + un.timeline.slice().sort(function(a, b){ return a.y - b.y; })
        .map(function(t){
          return '<div class="tr"><div class="ty">' + esc(t.y) + '</div>' +
            '<div class="tt">' + esc(t.l) + '</div></div>';
        }).join('') + '</div>');

  /* ── 5 · Ο ΠΙΝΑΚΑΣ ──────────────────────────────────────────────────
     ⛔⛔ ΚΑΙ ΤΟ «ΠΩΣ ΔΙΑΒΑΖΕΤΑΙ» ΜΠΑΙΝΕΙ ΜΑΖΙ ΤΟΥ.  Ο Πίνακας 6 δεν
     απαγγέλλεται — κανένα νούμερό του δεν υπάρχει στο κείμενο — και ένας
     πίνακας χωρίς αυτή τη δήλωση διαβάζεται σαν ύλη προς αποστήθιση. */
  var tb = (un.tables || [])[0];
  if (tb)
    tab('table', 'Ο πίνακας', 'εποπτικό υλικό · ΔΕΝ λέγεται απέξω',
      '<div class="tcap">' + esc(tb.n) + '</div>' +
      '<div class="tname">' + esc(tb.cap) + '</div>' +
      '<div class="twrap"><table><thead><tr>' +
        tb.head.map(function(hd){ return '<th>' + esc(hd) + '</th>'; }).join('') +
      '</tr></thead><tbody>' +
        tb.rows.map(function(r){
          /* η τελευταία γραμμή είναι ΣΥΝΟΛΟ, όχι δάνειο — και το δείχνει */
          var sum = /^Συνολικό/.test(r[0]);
          return '<tr' + (sum ? ' class="sum"' : '') + '>' + r.map(function(c, ci){
            return '<td' + (ci >= 2 ? ' class="n"' : '') + '>' + esc(c) + '</td>';
          }).join('') + '</tr>';
        }).join('') +
      '</tbody></table></div>' +
      (tb.read ? '<div class="tread">' + esc(tb.read) + '</div>' : ''));

  /* ── 6 · ΟΙ ΛΕΞΕΙΣ ─── τρία επίπεδα αλήθειας, τρεις ετικέτες ── */
  function defs(list, cls, label){
    if (!(list || []).length) return '';
    return '<p class="tag ' + cls + '">' + esc(label) + '</p><div class="defs">' +
      list.map(function(t){
        return '<div class="def"><div class="dt">' + esc(t.t) + '</div>' +
          '<div class="dd">' + esc(t.d) + '</div>' +
          (t.note ? '<div class="dn">' + esc(t.note) + '</div>' : '') + '</div>';
      }).join('') + '</div>';
  }
  var dd = defs(un.terms, 'b', 'Όροι · λόγια του βιβλίου') +
           defs(un.vocab, 'm', 'Λεξιλόγιο · δικά μου λόγια') +
           defs(un.context, 'c', 'Πλαίσιο · ΕΚΤΟΣ ύλης');
  if (dd) tab('words', 'Οι λέξεις', 'τι σημαίνει τι', dd);

  /* ══ ΤΟ ΧΤΙΣΙΜΟ ═══════════════════════════════════════════════════ */
  var lead = (un.simple || [])[0] ? weigh(un.simple[0]).t : '';

  var h = '<div class="head">' +
    '<div class="kick">Ενότητα ' + esc(un.enotita) + ' · ' + esc(un.section) + '</div>' +
    '<h1 class="h1">' + esc(un.title) + '</h1>' +
    /* ⭐ Η ΜΙΑ ΓΡΑΜΜΗ ΠΟΥ ΛΕΕΙ ΤΟ ΘΕΜΑ ΔΕΝ ΓΡΑΦΤΗΚΕ ΕΔΩ — είναι η ερώτηση
       που ήδη θέτει ο σκελετός.  Νέα διατύπωση θα ήταν δεύτερη αλήθεια. */
    '<p class="gist">' + esc(sk.ask) + '</p>' +
    '<div class="cred"><span><b>' + paras.length + '</b> παράγραφοι</span>' +
      '<span><b>' + sk.points.length + '</b> σημεία</span>' +
      '<span><b>' + nEls + '</b> στοιχεία</span>' +
      '<span>' + esc(un.chapter) + '</span></div>' +
    '<p class="sign"><span class="k">Πώς διαβάζεται</span>' +
      'Οι στρώσεις είναι <b>κουμπιά</b>, όχι στοίβα — πάτα ένα και ανοίγει μόνο αυτό, ' +
      'και η μπάρα μένει κολλημένη πάνω όσο κατεβαίνεις. Ανοίγει πάντα στα ' +
      '<b>«Με απλά λόγια»</b>: διάβασε πρώτα αυτό, γιατί δεν αποστηθίζεις ό,τι δεν ' +
      'κατάλαβες. Στο <b>«Το κείμενο»</b> οι φράσεις με τη λεπτή υπογράμμιση είναι οι ' +
      'άγκυρες των σημείων — εκεί ακριβώς πατάει το κάθε σημείο της διπλανής στήλης.</p>' +
  '</div>';

  h += '<nav class="tabs" role="tablist" aria-label="Στρώσεις της υποενότητας">' +
    tabs.map(function(t, i){
      return '<button type="button" role="tab" class="tab' + (i ? '' : ' on') + '"' +
        ' aria-selected="' + (i ? 'false' : 'true') + '" data-lay="' + t.id + '">' +
        esc(t.label) + '</button>';
    }).join('') + '</nav>';

  h += tabs.map(function(t, i){
    return '<section class="lay" data-lay-p="' + t.id + '"' + (i ? ' hidden' : '') + '>' +
      (t.hint ? '<p class="lhint">' + esc(t.hint) + '</p>' : '') +
      t.body + '</section>';
  }).join('');

  h += '<div class="foot">Δοκιμή μορφής — η ύλη διαβάζεται ζωντανά από το ' +
    'istoria-data.js και δεν αντιγράφεται εδώ.<br>Η σελίδα δεν αποθηκεύει, ' +
    'δεν βαθμολογεί και δεν συγχρονίζει τίποτα.</div>';

  app.innerHTML = h;

  /* ── ΤΑ ΚΟΥΜΠΙΑ ─────────────────────────────────────────────────────
     Ένας ακροατής στο περίβλημα.  Εδώ δεν χρειάζεται φρουρός `__bound`
     όπως στα Αρχαία, γιατί το `#app` γεμίζει ΜΙΑ φορά και δεν ξαναχτίζεται
     — αλλά αν κάποτε ξαναχτιστεί, ο ακροατής ΘΑ συσσωρευτεί.  Δηλώνεται
     ώστε να μη χρειαστεί δεύτερη als-v522 για να το θυμηθεί κανείς. */
  app.addEventListener('click', function(e){
    var b = e.target.closest('.tab');
    if (!b) return;
    var id = b.getAttribute('data-lay'), i, on;
    var bs = app.querySelectorAll('.tab');
    for (i = 0; i < bs.length; i++){
      on = bs[i] === b;
      bs[i].classList.toggle('on', on);
      bs[i].setAttribute('aria-selected', on ? 'true' : 'false');
    }
    var ps = app.querySelectorAll('.lay[data-lay-p]');
    for (i = 0; i < ps.length; i++)
      ps[i].hidden = ps[i].getAttribute('data-lay-p') !== id;

    /* ⭐ ΤΟ ΚΥΛΙΣΜΑ ΔΙΟΡΘΩΝΕΤΑΙ ΜΟΝΟ ΟΤΑΝ ΧΡΕΙΑΖΕΤΑΙ, ΚΑΙ ΠΟΤΕ ΣΤΗΝ ΚΟΡΥΦΗ.
       Η μπάρα είναι κολλητή, άρα το κουμπί φαίνεται πάντα· αν όμως έχει
       κατέβει μέσα σε δεκαέξι σημεία, η κορυφή της νέας στρώσης κάθεται
       ΠΙΣΩ από την μπάρα και η στρώση μοιάζει να ανοίγει στη μέση της. */
    var pan = app.querySelector('.lay[data-lay-p="' + id + '"]');
    if (pan){
      var nb = b.parentNode.getBoundingClientRect().bottom;
      var pt = pan.getBoundingClientRect().top;
      if (pt < nb + 4) window.scrollBy(0, pt - nb - 24);
    }
  });
})();
</script>
</body>
</html>
