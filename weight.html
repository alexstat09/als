<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Weight · MÉTRON</title>
  <meta name="theme-color" content="#050507">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="aurora.css">
  <script src="water.js"></script>
  <script src="topbar.js" defer></script>
  <script src="page-motion.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body { min-height:100%; }
    body { padding:0 0 calc(86px + env(safe-area-inset-bottom)); --sec-rgb:52,226,176; }
    .hidden{ display:none !important; }

    /* ── Hero ─────────────────────────────────────── */
    .wp-hero{ max-width:600px; margin:0 auto; padding:24px 18px 8px; display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
    .wp-hero-eyebrow{ margin-bottom:12px; }
    .wp-hero-line{ font-family:var(--au-serif); font-style:italic; font-weight:400; color:var(--au-ivory); font-size:clamp(24px,6vw,32px); line-height:1.1; letter-spacing:-.01em; max-width:22ch; }
    .wp-hero .nova{ flex-shrink:0; width:74px; height:74px; margin-top:2px; }

    .wp-wrap{ padding:14px 18px; display:flex; flex-direction:column; gap:14px; max-width:600px; margin:0 auto; }

    /* ── Glass card ───────────────────────────────── */
    .wt-card{ position:relative; background:var(--au-glass); border:1px solid var(--au-line); border-radius:18px; overflow:hidden; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); padding:20px 18px 18px; }
    .wt-card::before{ content:''; position:absolute; top:0; left:8%; right:8%; height:1px; background:linear-gradient(90deg,transparent,rgba(var(--sec-rgb),.55),transparent); pointer-events:none; }

    /* ── Headline ─────────────────────────────────── */
    .wt-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .wt-row{ display:flex; align-items:baseline; gap:8px; }
    .wt-num{ font-family:var(--au-serif); font-style:italic; font-size:56px; font-weight:400; letter-spacing:-.02em; line-height:1; color:var(--au-ivory); }
    .wt-unit{ font-size:16px; color:var(--au-faint); font-family:var(--au-mono); }
    .wt-trend{ font-family:var(--au-mono); font-size:12px; font-weight:700; margin-top:9px; letter-spacing:.01em; font-variant-numeric:tabular-nums; color:var(--au-dim); }
    .wt-trend.good{ color:var(--au-emerald); } .wt-trend.off{ color:var(--au-amber); }
    .wt-streak{ flex-shrink:0; display:inline-flex; align-items:center; gap:6px; margin-top:6px; padding:5px 11px; border-radius:999px; background:rgba(var(--sec-rgb),.08); border:1px solid rgba(var(--sec-rgb),.22); color:rgb(var(--sec-rgb)); font-family:var(--au-mono); font-size:10px; font-weight:700; letter-spacing:.08em; white-space:nowrap; }

    /* ── Stat trio ────────────────────────────────── */
    .wt-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; margin-top:18px; background:var(--au-line); border-radius:13px; overflow:hidden; border:1px solid var(--au-line); }
    .wt-stat{ background:rgba(255,255,255,.022); padding:11px 10px 10px; text-align:center; }
    .wt-stat-lbl{ font-family:var(--au-mono); font-size:8.5px; font-weight:700; letter-spacing:.16em; color:var(--au-faint); text-transform:uppercase; }
    .wt-stat-val{ font-family:var(--au-mono); font-size:17px; font-weight:700; color:var(--au-ivory); margin-top:5px; font-variant-numeric:tabular-nums; line-height:1; }
    .wt-stat-val.good{ color:var(--au-emerald); } .wt-stat-val.off{ color:var(--au-amber); }
    .wt-stat-sub{ font-family:var(--au-mono); font-size:9px; color:var(--au-faint); margin-top:4px; }

    .wt-empty{ text-align:center; padding:26px 16px; color:var(--au-dim); font-family:var(--au-serif); font-style:italic; font-size:15px; border:1px dashed var(--au-line); border-radius:14px; margin-top:16px; }

    /* ── Chart ────────────────────────────────────── */
    .wt-chart-wrap{ position:relative; margin:18px 0 4px; }
    .wt-range-row{ display:flex; justify-content:flex-end; margin-bottom:12px; }
    .wt-pills{ position:relative; display:inline-flex; gap:2px; padding:2px; border-radius:999px; background:rgba(255,255,255,.035); border:1px solid var(--au-line); }
    /* Equal-width segments so the indicator only ever needs translateX —
       animating its width would relayout and smear the 1px border. */
    .wt-pill-ind{ position:absolute; top:2px; bottom:2px; left:2px; width:52px; border-radius:999px; background:rgba(var(--sec-rgb),.16); border:1px solid rgba(var(--sec-rgb),.42); transition:transform .34s var(--au-ease); pointer-events:none; }
    .wt-range-btn{ position:relative; width:52px; padding:5px 0; border-radius:999px; font-size:10.5px; font-weight:700; border:none; background:transparent; color:var(--au-faint); cursor:pointer; font-family:var(--au-mono); letter-spacing:.06em; text-align:center; -webkit-tap-highlight-color:transparent; transition:color .3s var(--au-ease); }
    .wt-range-btn.active{ color:rgb(var(--sec-rgb)); }

    /* pan-y, not none: a 214px-tall chart must not become a dead zone that
       swallows the page scroll. Horizontal drags scrub, vertical ones scroll. */
    .wt-chart{ display:block; width:100%; height:214px; cursor:crosshair; touch-action:pan-y; overflow:visible; }
    #wtChartContent{ transition:opacity .14s linear; }
    .wt-grid{ stroke:rgba(255,255,255,.055); stroke-width:1; shape-rendering:crispEdges; }
    .wt-ylabel{ font-size:9.5px; fill:rgba(245,242,236,.30); font-family:var(--au-mono); }
    .wt-band{ fill:rgba(var(--sec-rgb),.085); }
    .wt-thread{ fill:none; stroke:rgba(255,255,255,.10); stroke-width:1; stroke-linejoin:round; }
    .wt-daily{ fill:rgba(245,242,236,.34); }
    .wt-line{ fill:none; stroke:url(#wtLineGrad); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    .wt-last-halo{ fill:rgba(var(--sec-rgb),.16); }
    .wt-last{ fill:#fff; stroke:rgb(var(--sec-rgb)); stroke-width:2.4; }
    .wt-goal{ stroke:var(--au-amber); stroke-width:1; stroke-dasharray:5 4; opacity:.55; }
    .wt-goal-lbl{ font-size:9px; font-family:var(--au-mono); font-weight:700; letter-spacing:.12em; fill:rgba(242,192,99,.8); }
    .wt-xlabel{ font-size:9.5px; fill:rgba(245,242,236,.30); font-family:var(--au-mono); }
    .wt-crosshair{ stroke:rgba(255,255,255,.26); stroke-width:1; stroke-dasharray:3 3; }
    .wt-tip-bg{ fill:rgba(6,6,7,.96); stroke:rgba(var(--sec-rgb),.38); stroke-width:1; }
    .wt-tip-date{ fill:rgba(245,242,236,.52); font-size:9.5px; font-family:var(--au-mono); letter-spacing:.08em; }
    .wt-tip-weight{ fill:#fff; font-size:14px; font-weight:700; font-family:var(--au-mono); }
    .wt-tip-sub{ font-size:9.5px; font-family:var(--au-mono); fill:rgba(245,242,236,.45); }
    .wt-tip-dot{ fill:#fff; stroke:rgb(var(--sec-rgb)); stroke-width:2.4; }
    .wt-meta{ text-align:center; font-size:10.5px; color:var(--au-faint); font-family:var(--au-mono); margin-top:10px; letter-spacing:.02em; }
    .wt-meta.warn{ color:var(--au-amber); }
    .wt-legend{ display:flex; justify-content:center; gap:16px; margin-top:10px; flex-wrap:wrap; }
    .wt-legend-item{ display:inline-flex; align-items:center; gap:6px; font-size:8.5px; letter-spacing:.16em; font-weight:700; color:var(--au-faint); font-family:var(--au-mono); }
    .wt-lg-trend{ width:15px; height:2.6px; background:rgb(var(--sec-rgb)); border-radius:2px; }
    .wt-lg-daily{ width:5px; height:5px; border-radius:50%; background:rgba(245,242,236,.4); }
    .wt-lg-band{ width:15px; height:8px; border-radius:2px; background:rgba(var(--sec-rgb),.14); }
    .wt-lg-goal{ width:15px; height:0; border-top:1.5px dashed rgba(242,192,99,.8); }
    .wt-tap-hint{ text-align:center; font-size:9.5px; color:var(--au-faint); font-family:var(--au-mono); letter-spacing:.08em; margin-top:7px; }

    /* ── Month rail ───────────────────────────────── */
    .wt-months{ margin-top:20px; padding-top:16px; border-top:1px solid var(--au-line); }
    .wt-sub-title{ font-size:9px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:var(--au-faint); font-family:var(--au-mono); margin-bottom:2px; }
    .wt-months-svg{ display:block; width:100%; height:74px; overflow:visible; }
    .wt-mo-link{ fill:none; stroke:rgba(var(--sec-rgb),.28); stroke-width:1.4; stroke-linejoin:round; }
    .wt-mo-dot{ fill:rgb(var(--sec-rgb)); opacity:.55; }
    .wt-mo-dot.now{ opacity:1; fill:#fff; stroke:rgb(var(--sec-rgb)); stroke-width:2.2; }
    .wt-mo-lbl{ font-size:8.5px; font-family:var(--au-mono); font-weight:700; letter-spacing:.12em; fill:rgba(245,242,236,.30); }
    .wt-mo-val{ font-size:11px; font-family:var(--au-mono); font-weight:700; fill:rgba(245,242,236,.62); }
    .wt-mo-val.now{ fill:var(--au-ivory); }

    /* ── Logged-today lock ────────────────────────── */
    .wt-locked{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:18px; padding:12px 14px; border-radius:14px; background:rgba(var(--sec-rgb),.06); border:1px solid rgba(var(--sec-rgb),.22); }
    .wt-locked-info{ display:flex; align-items:center; gap:11px; }
    .wt-locked-check{ width:30px; height:30px; background:rgba(var(--sec-rgb),.14); color:rgb(var(--sec-rgb)); border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; }
    .wt-locked-label{ font-size:10px; letter-spacing:.14em; font-weight:700; color:var(--au-faint); font-family:var(--au-mono); margin-bottom:2px; }
    .wt-locked-value{ font-size:16px; font-weight:700; color:var(--au-ivory); font-family:var(--au-mono); }
    .wt-edit-btn{ background:transparent; border:1px solid rgba(var(--sec-rgb),.35); color:rgb(var(--sec-rgb)); font-family:var(--au-sans); font-size:13px; font-weight:700; cursor:pointer; padding:8px 16px; border-radius:999px; -webkit-tap-highlight-color:transparent; }
    .wt-edit-btn:active{ opacity:.7; }

    /* ── Input row ────────────────────────────────── */
    .wt-input-row{ margin-top:18px; }
    .wt-date-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
    .wt-date-label{ font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--au-faint); white-space:nowrap; font-family:var(--au-mono); }
    .wt-date-input{ flex:1; min-width:120px; background:rgba(255,255,255,.05); border:1px solid var(--au-line); border-radius:10px; color:var(--au-ivory); font-family:var(--au-mono); font-size:13px; padding:9px 11px; outline:none; transition:border-color .2s; color-scheme:dark; }
    .wt-date-input:focus{ border-color:rgba(var(--sec-rgb),.5); }
    .wt-today-btn{ padding:9px 12px; border-radius:10px; font-size:11px; font-weight:700; border:1px solid var(--au-line); background:rgba(255,255,255,.04); color:var(--au-dim); cursor:pointer; font-family:var(--au-mono); white-space:nowrap; transition:all .15s; -webkit-tap-highlight-color:transparent; }
    .wt-today-btn:active{ background:rgba(var(--sec-rgb),.12); color:rgb(var(--sec-rgb)); }
    .wt-input-top{ display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px; }
    .wt-input-field{ position:relative; }
    .wt-input{ width:100%; min-width:0; background:rgba(255,255,255,.05); border:1px solid rgba(var(--sec-rgb),.3); border-radius:12px; color:var(--au-ivory); font-family:var(--au-mono); font-size:20px; font-weight:700; padding:12px 46px 12px 14px; outline:none; text-align:center; -webkit-appearance:none; }
    .wt-input:focus{ border-color:rgba(var(--sec-rgb),.6); }
    .wt-unit-static{ position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--au-faint); font-size:13px; font-family:var(--au-mono); pointer-events:none; }
    .wt-save-btn{ background:rgb(var(--sec-rgb)); color:#04130D; border:none; border-radius:12px; padding:12px 22px; font-family:var(--au-sans); font-size:14px; font-weight:700; cursor:pointer; box-shadow:0 4px 18px rgba(var(--sec-rgb),.3); -webkit-tap-highlight-color:transparent; }
    .wt-save-btn:active{ opacity:.8; }

    /* ── History list ─────────────────────────────── */
    .wt-history{ margin-top:22px; }
    .wt-history-title{ font-size:9px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:var(--au-faint); font-family:var(--au-mono); margin-bottom:10px; }
    .wt-history-list{ max-height:340px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding-right:2px; overscroll-behavior:contain; }
    .wt-history-list::-webkit-scrollbar{ width:4px; }
    .wt-history-list::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.12); border-radius:2px; }
    /* Matches the card surface (canvas + its glass tint), not the raw page
       canvas — otherwise the sticky header reads as a dark seam. */
    .wt-mo-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:12px 2px 5px; position:sticky; top:0; background:linear-gradient(180deg,rgba(12,12,14,.97) 62%,rgba(12,12,14,.7)); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px); z-index:2; }
    .wt-mo-head:first-child{ padding-top:2px; }
    .wt-mo-head-name{ font-family:var(--au-serif); font-style:italic; font-size:15px; color:var(--au-ivory); }
    .wt-mo-head-meta{ font-family:var(--au-mono); font-size:9.5px; color:var(--au-faint); letter-spacing:.04em; font-variant-numeric:tabular-nums; }
    .wt-mo-head-meta .up{ color:var(--au-amber); } .wt-mo-head-meta .down{ color:var(--au-emerald); }
    .wt-history-row{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:11px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); }
    .wt-history-row.today-row{ border-color:rgba(var(--sec-rgb),.28); background:rgba(var(--sec-rgb),.05); }
    .wt-history-date{ flex:1; font-size:13px; color:var(--au-dim); }
    .wt-history-val{ font-size:15px; font-weight:700; color:var(--au-ivory); font-family:var(--au-mono); font-variant-numeric:tabular-nums; }
    .wt-history-delta{ font-size:11px; font-family:var(--au-mono); min-width:42px; text-align:right; font-variant-numeric:tabular-nums; }
    .wt-history-delta.up{ color:var(--au-amber); } .wt-history-delta.down{ color:var(--au-emerald); }
    .wt-history-edit-wrap{ display:flex; gap:5px; }
    .wt-h-btn{ padding:5px 9px; border-radius:7px; font-size:11px; font-weight:700; border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.03); color:var(--au-faint); cursor:pointer; font-family:var(--au-sans); -webkit-tap-highlight-color:transparent; }
    .wt-h-btn:active{ background:rgba(255,255,255,.09); color:var(--au-ivory); }
    .wt-h-btn.del:active{ background:rgba(255,107,139,.14); color:#FF6B8B; }

    @media (prefers-reduced-motion: reduce){
      .wt-pill-ind, #wtChartContent{ transition:none !important; }
    }
  </style>
</head>
<body data-page="weight" class="au-bg au-mood-hot" id="root">

  <div class="wp-hero" data-rise>
    <div>
      <div class="au-eyebrow wp-hero-eyebrow"><span class="au-dot"></span>WEIGHT<span class="au-sep">&middot;</span><span id="heroDate">TODAY</span></div>
      <p class="wp-hero-line" id="novaSays">Every weigh-in, tracked.</p>
    </div>
    <div class="nova" id="nova" aria-hidden="true">
      <svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="novaGradWt" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#34E2B0"/><stop offset="55%" stop-color="#22CBC6"/><stop offset="100%" stop-color="#9B8CFF"/></linearGradient><radialGradient id="novaGradWtF" cx=".5" cy=".5" r=".5"><stop offset="0%" stop-color="#34E2B0" stop-opacity=".16"/><stop offset="100%" stop-color="#34E2B0" stop-opacity="0"/></radialGradient><clipPath id="novaGradWtC"><circle cx="50" cy="50" r="40"/></clipPath></defs><g class="nova-glow"><circle cx="50" cy="50" r="40" fill="url(#novaGradWtF)"/><circle class="nova-ring" cx="50" cy="50" r="40" fill="none" stroke="url(#novaGradWt)" stroke-width="2.2" opacity=".55"/><g clip-path="url(#novaGradWtC)"><path class="nova-track" d="M18.8 50 H38.3 L42.2 55.1 L48.8 25 L56.3 75 L62.1 46.1 L66.8 50 H81.3" fill="none" stroke="url(#novaGradWt)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".2"/><path class="nova-trace" d="M18.8 50 H38.3 L42.2 55.1 L48.8 25 L56.3 75 L62.1 46.1 L66.8 50 H81.3" fill="none" stroke="url(#novaGradWt)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="nova-trace" d="M18.8 50 H38.3 L42.2 55.1 L48.8 25 L56.3 75 L62.1 46.1 L66.8 50 H81.3" fill="none" stroke="#EAFFF7" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/></g><g class="nova-node"><circle cx="48.8" cy="25" r="4.4" fill="#EAFFF7"/></g></g></svg>
    </div>
  </div>

  <div class="wp-wrap">
    <div class="wt-card" data-rise>
      <div class="wt-head">
        <div>
          <div class="wt-row">
            <span class="wt-num" id="wtNum">&mdash;</span>
            <span class="wt-unit" id="wtUnit">kg</span>
          </div>
          <div class="wt-trend hidden" id="wtDelta"></div>
        </div>
        <div class="wt-streak hidden" id="wtStreak"><span id="wtStreakNum">0 day streak</span></div>
      </div>

      <div class="wt-stats hidden" id="wtStats"></div>

      <div class="wt-empty" id="wtEmpty">Log your first weight to start tracking.</div>

      <div class="wt-chart-wrap hidden" id="wtChartWrap">
        <div class="wt-range-row">
          <div class="wt-pills" id="wtPills">
            <span class="wt-pill-ind" id="wtPillInd"></span>
            <button type="button" class="wt-range-btn" data-wrange="7">7D</button>
            <button type="button" class="wt-range-btn active" data-wrange="30">30D</button>
            <button type="button" class="wt-range-btn" data-wrange="90">3M</button>
            <button type="button" class="wt-range-btn" data-wrange="0">ALL</button>
          </div>
        </div>
        <svg class="wt-chart" id="wtSvg" viewBox="0 0 320 214">
          <defs>
            <linearGradient id="wtLineGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#18C8C0"/>
              <stop offset="60%" stop-color="#34E2B0"/>
              <stop offset="100%" stop-color="#5BF0C4"/>
            </linearGradient>
            <filter id="wtGlow" x="-20%" y="-40%" width="140%" height="180%">
              <feGaussianBlur stdDeviation="3" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <g id="wtChartContent"></g>
          <rect id="wtHit" x="0" y="0" width="320" height="214" fill="transparent"/>
          <g id="wtTip" style="display:none" pointer-events="none">
            <line id="wtTipLine" class="wt-crosshair" x1="0" y1="0" x2="0" y2="0"/>
            <circle id="wtTipDot" r="4.2" class="wt-tip-dot" cx="0" cy="0"/>
            <rect id="wtTipBg" x="0" y="0" width="100" height="54" rx="8" class="wt-tip-bg"/>
            <text id="wtTipDate" x="0" y="0" class="wt-tip-date"></text>
            <text id="wtTipWeight" x="0" y="0" class="wt-tip-weight"></text>
            <text id="wtTipSub" x="0" y="0" class="wt-tip-sub"></text>
          </g>
        </svg>
        <div class="wt-meta" id="wtMeta">0 entries</div>
        <div class="wt-legend" id="wtLegend"></div>
        <div class="wt-tap-hint">Tap or drag the chart to read any day</div>
      </div>

      <div class="wt-months hidden" id="wtMonthsWrap">
        <div class="wt-sub-title">MONTH BY MONTH</div>
        <svg class="wt-months-svg" id="wtMonthsSvg" viewBox="0 0 320 74"></svg>
      </div>

      <div class="wt-locked hidden" id="wtLocked">
        <div class="wt-locked-info">
          <span class="wt-locked-check">✓</span>
          <div>
            <div class="wt-locked-label">LOGGED TODAY</div>
            <div class="wt-locked-value" id="wtLockedValue">&mdash; kg</div>
          </div>
        </div>
        <button type="button" class="wt-edit-btn" id="wtEditBtn">Edit</button>
      </div>

      <div class="wt-input-row" id="wtInputRow">
        <div class="wt-date-row">
          <span class="wt-date-label">Date</span>
          <input type="date" class="wt-date-input" id="wtDateInput">
          <button type="button" class="wt-today-btn" id="wtTodayBtn">Today</button>
        </div>
        <div class="wt-input-top">
          <div class="wt-input-field">
            <input type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" enterkeyhint="done" class="wt-input" id="wtInput" placeholder="0.0" aria-label="Weight">
            <span class="wt-unit-static" id="wtUnitStatic">kg</span>
          </div>
          <button type="button" class="wt-save-btn" id="wtSaveBtn">Save</button>
        </div>
      </div>

      <div class="wt-history" id="wtHistory"></div>
    </div>
  </div>

  <script>
  (function () {
    'use strict';
    var WT_KEY = 'po_coach_weights';
    function $(id){ return document.getElementById(id); }
    function ls(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
    function units(){ return (ls('po_coach_v1') || {}).units || 'kg'; }

    var reduceMotion = false;
    try{ reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

    function wtDateKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
    function wtParseKey(key){ var p=key.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
    function wtLoad(){
      try{ var raw=localStorage.getItem(WT_KEY); var arr=raw?JSON.parse(raw):[];
        return Array.isArray(arr) ? arr.filter(function(e){return e&&e.dateKey&&typeof e.weight==='number';}).sort(function(a,b){return a.dateKey.localeCompare(b.dateKey);}) : [];
      }catch(e){ return []; }
    }
    function wtSave(arr){ try{ localStorage.setItem(WT_KEY, JSON.stringify(arr)); }catch(e){} }
    /* Accept "70.5" or "70,5" — iOS decimal pads differ by locale. */
    function parseWeight(s){ return parseFloat(String(s == null ? '' : s).trim().replace(',', '.')); }

    /* Whole days since epoch — an integer, so gaps in the log are real gaps on the x axis. */
    function dayNum(key){ var p=key.split('-').map(Number); return Math.floor(Date.UTC(p[0],p[1]-1,p[2])/86400000); }

    /* Read his bodyweight target from main.html's outcome goals. Absent is a
       valid state: no goal line is drawn and nothing pretends one exists. */
    function goalWeight(){
      var a=ls('goals_outcomes_v1');
      if(!Array.isArray(a)) return null;
      for(var i=0;i<a.length;i++){
        var g=a[i];
        if(g && g.type==='bodyweight' && typeof g.target==='number' && g.target>0) return g.target;
      }
      return null;
    }

    function wtSmoothPath(points){
      if(!points.length) return '';
      if(points.length===1) return 'M '+points[0].x.toFixed(2)+' '+points[0].y.toFixed(2);
      var d='M '+points[0].x.toFixed(2)+' '+points[0].y.toFixed(2);
      for(var i=1;i<points.length;i++){
        var prev=points[i-1], curr=points[i];
        var cx=(prev.x+curr.x)/2;
        d+=' Q '+cx.toFixed(2)+' '+prev.y.toFixed(2)+', '+cx.toFixed(2)+' '+((prev.y+curr.y)/2).toFixed(2);
        d+=' T '+curr.x.toFixed(2)+' '+curr.y.toFixed(2);
      }
      return d;
    }
    /* Straight polyline — used for the raw daily thread, which must never
       imply a reading he didn't take. */
    function wtLinePath(points){
      if(!points.length) return '';
      var d='M '+points[0].x.toFixed(2)+' '+points[0].y.toFixed(2);
      for(var i=1;i<points.length;i++) d+=' L '+points[i].x.toFixed(2)+' '+points[i].y.toFixed(2);
      return d;
    }

    var wtEntries = wtLoad();
    var wtRange = 30;
    var wtChartPoints = [];
    var wtChartRecent = [];
    var wtChartTrend = [];
    var wtGeom = null;
    var wtDrewOnce = false;
    var wtLastW = 0;
    var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    var DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    var CH = { H:214, PL:34, PR:14, PT:16, PB:26 };

    function wtGetSelectedDate(){ var v=$('wtDateInput')&&$('wtDateInput').value; return v?v:wtDateKey(new Date()); }

    function wtSaveEntry(weight){
      var key=wtGetSelectedDate();
      var existing=wtEntries.find(function(e){return e.dateKey===key;});
      if(existing){ existing.weight=weight; existing.ts=Date.now(); }
      else { wtEntries.push({ dateKey:key, weight:weight, ts:Date.now() }); }
      wtEntries.sort(function(a,b){return a.dateKey.localeCompare(b.dateKey);});
      wtSave(wtEntries);
      wtRender();
    }
    function wtDeleteEntry(key){ wtEntries=wtEntries.filter(function(e){return e.dateKey!==key;}); wtSave(wtEntries); wtRender(); }
    function wtEditEntry(key){
      var entry=wtEntries.find(function(e){return e.dateKey===key;});
      if(!entry) return;
      if($('wtDateInput')) $('wtDateInput').value=key;
      $('wtLocked').classList.add('hidden');
      $('wtInputRow').classList.remove('hidden');
      if($('wtInput')){ $('wtInput').value=entry.weight.toFixed(1); $('wtInput').focus(); $('wtInput').select(); }
    }

    function wtFmtDateLabel(key){
      var p=key.split('-').map(Number); var date=new Date(p[0],p[1]-1,p[2]);
      var diff=Math.floor((new Date(wtDateKey(new Date())) - new Date(key))/86400000);
      if(diff===1) return 'Yesterday';
      if(diff<7) return date.toLocaleDateString([],{weekday:'long'});
      return date.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});
    }

    /* ── Analysis ───────────────────────────────────────────────────────────
       Two numbers matter and neither is on the page today: the smoothed trend
       (his day-to-day noise averages 0.3 kg, which is most of a month's real
       movement) and the rate that trend is moving. ─────────────────────── */

    /* Trailing 7-CALENDAR-DAY mean + spread. Window is by date, not by index,
       so a missed day widens the gap instead of silently shifting the window. */
    function trendSeries(rows){
      var out=[];
      for(var i=0;i<rows.length;i++){
        var lo=rows[i].t-6, vals=[];
        for(var j=i;j>=0;j--){ if(rows[j].t<lo) break; vals.push(rows[j].weight); }
        var n=vals.length, sum=0, k;
        for(k=0;k<n;k++) sum+=vals[k];
        var mean=sum/n, sd=0;
        if(n>=2){ var v=0; for(k=0;k<n;k++) v+=(vals[k]-mean)*(vals[k]-mean); sd=Math.sqrt(v/(n-1)); }
        out.push({ t:rows[i].t, mean:mean, sd:sd, n:n });
      }
      return out;
    }

    /* Least-squares kg/week over the last `days` of data, WITH the standard
       error of that slope. Returns null when there genuinely isn't enough to
       say — never a fabricated 0.

       The error matters: his readings scatter ~0.3 kg a day, so a slope of
       −0.07 kg/week is smaller than its own uncertainty. Announcing that as
       "losing" would be the page inventing a story out of noise. */
    function trendRate(rows, days){
      if(rows.length<4) return null;
      var last=rows[rows.length-1].t, lo=last-(days-1), w=[];
      for(var i=rows.length-1;i>=0;i--){ if(rows[i].t<lo) break; w.unshift(rows[i]); }
      if(w.length<4) return null;
      var n=w.length, mx=0, my=0, i2;
      for(i2=0;i2<n;i2++){ mx+=w[i2].t; my+=w[i2].weight; }
      mx/=n; my/=n;
      var num=0, den=0;
      for(i2=0;i2<n;i2++){ num+=(w[i2].t-mx)*(w[i2].weight-my); den+=(w[i2].t-mx)*(w[i2].t-mx); }
      if(den===0) return null;
      var b=num/den, a=my-b*mx, ss=0;
      for(i2=0;i2<n;i2++){ var res=w[i2].weight-(a+b*w[i2].t); ss+=res*res; }
      var se = n>2 ? Math.sqrt((ss/(n-2))/den) : 0;
      return { rate:b*7, se:se*7, n:n };
    }
    /* A slope smaller than its own uncertainty is not a trend, it's a wobble. */
    function isSteady(tr){ return Math.abs(tr.rate) < Math.max(0.05, tr.se*1.5); }

    function monthlyAverages(rows){
      var order=[], byKey={};
      rows.forEach(function(e){
        var k=e.dateKey.slice(0,7);
        if(!byKey[k]){ byKey[k]=[]; order.push(k); }
        byKey[k].push(e.weight);
      });
      return order.map(function(k){
        var v=byKey[k], s=0;
        for(var i=0;i<v.length;i++) s+=v[i];
        return { key:k, avg:s/v.length, n:v.length };
      });
    }

    /* ── Scale ──────────────────────────────────────────────────────────── */
    function niceStep(raw){
      var steps=[0.1,0.25,0.5,1,2,2.5,5,10,20];
      for(var i=0;i<steps.length;i++) if(raw<=steps[i]) return steps[i];
      return 50;
    }
    /* The old chart auto-scaled to the visible min/max, so a 0.6 kg wobble
       filled the whole plot and read as a crisis. A floor of 3 kg keeps noise
       looking like noise no matter which range is on screen. */
    var MIN_SPAN = 3.0;
    function yDomain(lo, hi){
      var span=Math.max((hi-lo)*1.35, MIN_SPAN);
      var mid=(lo+hi)/2;
      var y0=mid-span/2, y1=mid+span/2;
      var step=niceStep((y1-y0)/5);
      var ticks=makeTicks(y0,y1,step);
      if(ticks.length<3){ step=step/2; ticks=makeTicks(y0,y1,step); }
      return { y0:y0, y1:y1, ticks:ticks, step:step };
    }
    function makeTicks(y0,y1,step){
      var out=[], v=Math.ceil((y0/step)-1e-9)*step;
      for(; v<=y1+1e-9; v+=step){ out.push(Math.round(v*100)/100); if(out.length>14) break; }
      return out;
    }
    function fmtTick(v, step){ return step<1 ? v.toFixed(1) : String(Math.round(v*10)/10); }

    function svgWidth(svg){
      var w=0;
      try{ w=svg.getBoundingClientRect().width; }catch(e){}
      return Math.max(240, Math.round(w||320));
    }

    /* ── Chart ──────────────────────────────────────────────────────────── */
    function wtRenderChart(){
      var svg=$('wtSvg'); if(!svg) return;
      var W=svgWidth(svg);
      wtLastW=W;
      svg.setAttribute('viewBox','0 0 '+W+' '+CH.H);
      $('wtHit').setAttribute('width', W);
      $('wtHit').setAttribute('height', CH.H);

      var u=units();
      var goal=goalWeight();

      /* Window by DATE, not by entry count — "30D" means the last 30 days. */
      var todayT=dayNum(wtDateKey(new Date()));
      var recent, fellBack=false;
      if(wtRange===0) recent=wtEntries.slice();
      else {
        var lo=todayT-(wtRange-1);
        recent=wtEntries.filter(function(e){ return dayNum(e.dateKey)>=lo; });
        if(recent.length<2){ recent=wtEntries.slice(-14); fellBack=true; }
      }

      var rows=recent.map(function(e){ return { dateKey:e.dateKey, weight:e.weight, t:dayNum(e.dateKey) }; });
      wtChartRecent=rows;
      wtChartPoints=[]; wtChartTrend=[];
      if(rows.length<2){ $('wtChartContent').innerHTML=''; return; }

      var trend=trendSeries(rows);
      wtChartTrend=trend;

      var weights=rows.map(function(r){ return r.weight; });
      var dMin=Math.min.apply(null,weights), dMax=Math.max.apply(null,weights);
      var lo2=dMin, hi2=dMax;
      /* Pull the goal into view when it's within reach, so the chart can show
         the distance instead of hiding it off-canvas. */
      var goalInView = goal!=null && goal>=dMin-6 && goal<=dMax+6;
      if(goalInView){ lo2=Math.min(lo2,goal); hi2=Math.max(hi2,goal); }

      var dom=yDomain(lo2,hi2);
      var xL=CH.PL, xR=W-CH.PR, yT=CH.PT, yB=CH.H-CH.PB;
      var t0=rows[0].t, t1=rows[rows.length-1].t;
      var xFor=function(t){ return t1===t0 ? (xL+xR)/2 : xL+((t-t0)/(t1-t0))*(xR-xL); };
      var yFor=function(w){ return yB-((w-dom.y0)/(dom.y1-dom.y0))*(yB-yT); };
      wtGeom={ xL:xL, xR:xR, yT:yT, yB:yB };

      var points=rows.map(function(r){ return { x:xFor(r.t), y:yFor(r.weight), e:r }; });
      wtChartPoints=points;
      var trendPts=trend.map(function(s){ return { x:xFor(s.t), y:yFor(s.mean) }; });

      var html='';

      /* Gridlines sit ON real weight values now, and carry their own labels
         inside the SVG so the two can never drift apart. */
      dom.ticks.forEach(function(v){
        var y=yFor(v);
        html+='<line class="wt-grid" x1="'+xL+'" y1="'+y.toFixed(1)+'" x2="'+xR+'" y2="'+y.toFixed(1)+'"/>';
        html+='<text class="wt-ylabel" x="'+(xL-7)+'" y="'+(y+3.4).toFixed(1)+'" text-anchor="end">'+fmtTick(v,dom.step)+'</text>';
      });

      /* The fluctuation channel: trend ± spread of its own 7-day window.
         Anything outside it is a real move, not water. */
      if(rows.length>=4){
        var up=[], dn=[];
        trend.forEach(function(s,i){
          var sd=Math.max(s.sd,0.06);
          up.push({ x:trendPts[i].x, y:yFor(s.mean+sd) });
          dn.push({ x:trendPts[i].x, y:yFor(s.mean-sd) });
        });
        var bandPath=wtSmoothPath(up)+' L '+dn[dn.length-1].x.toFixed(2)+' '+dn[dn.length-1].y.toFixed(2);
        for(var bi=dn.length-2;bi>=0;bi--) bandPath+=' L '+dn[bi].x.toFixed(2)+' '+dn[bi].y.toFixed(2);
        html+='<path class="wt-band" d="'+bandPath+' Z"/>';
      }

      if(goalInView){
        var gy=yFor(goal);
        html+='<line class="wt-goal" x1="'+xL+'" y1="'+gy.toFixed(1)+'" x2="'+xR+'" y2="'+gy.toFixed(1)+'"/>';
        var gLblY = gy<yT+14 ? gy+12 : gy-6;
        html+='<text class="wt-goal-lbl" x="'+xR+'" y="'+gLblY.toFixed(1)+'" text-anchor="end">GOAL '+goal.toFixed(1)+'</text>';
      }

      /* Raw readings: a whisper of a thread plus quiet dots. They are the
         evidence; the trend is the answer. */
      html+='<path class="wt-thread" d="'+wtLinePath(points)+'"/>';
      var r=points.length>90?1.3:points.length>45?1.7:2.2;
      points.forEach(function(p){
        html+='<circle class="wt-daily" cx="'+p.x.toFixed(2)+'" cy="'+p.y.toFixed(2)+'" r="'+r+'"/>';
      });

      html+='<path class="wt-line" id="wtTrendPath" filter="url(#wtGlow)" d="'+wtSmoothPath(trendPts)+'"/>';

      var lp=points[points.length-1];
      html+='<circle class="wt-last-halo" cx="'+lp.x.toFixed(2)+'" cy="'+lp.y.toFixed(2)+'" r="9"/>';
      html+='<circle class="wt-last" cx="'+lp.x.toFixed(2)+'" cy="'+lp.y.toFixed(2)+'" r="4.4"/>';

      var labelCount=Math.min(4,rows.length);
      for(var li=0;li<labelCount;li++){
        var idx=labelCount===1?0:Math.round(li/(labelCount-1)*(rows.length-1));
        var d=wtParseKey(rows[idx].dateKey);
        var anchor=li===0?'start':li===labelCount-1?'end':'middle';
        html+='<text class="wt-xlabel" x="'+xFor(rows[idx].t).toFixed(1)+'" y="'+(CH.H-8)+'" text-anchor="'+anchor+'">'+MONTHS[d.getMonth()]+' '+d.getDate()+'</text>';
      }

      $('wtChartContent').innerHTML=html;

      var rangeLabel = wtRange===0 ? 'all time' : 'last '+wtRange+' days';
      var meta=$('wtMeta');
      if(fellBack){
        meta.textContent='No weigh-ins in the last '+wtRange+' days — showing your most recent '+rows.length+'.';
        meta.classList.add('warn');
      } else {
        meta.textContent=rows.length+(rows.length===1?' weigh-in · ':' weigh-ins · ')+rangeLabel+' · '+dMin.toFixed(1)+'–'+dMax.toFixed(1)+' '+u;
        meta.classList.remove('warn');
      }

      var lg='<span class="wt-legend-item"><span class="wt-lg-trend"></span>7-DAY TREND</span>'
           + '<span class="wt-legend-item"><span class="wt-lg-daily"></span>DAILY</span>';
      if(rows.length>=4) lg+='<span class="wt-legend-item"><span class="wt-lg-band"></span>NORMAL SWING</span>';
      if(goalInView) lg+='<span class="wt-legend-item"><span class="wt-lg-goal"></span>GOAL</span>';
      $('wtLegend').innerHTML=lg;

      if(!wtDrewOnce && !reduceMotion) drawInTrend();
      wtDrewOnce=true;
    }

    /* The trend draws itself in once, on arrival. Range changes cross-fade
       instead — re-drawing on every tap would read as a stutter. */
    function drawInTrend(){
      var p=$('wtTrendPath'); if(!p || !p.getTotalLength) return;
      var len=0;
      try{ len=p.getTotalLength(); }catch(e){ return; }
      if(!len || !isFinite(len)) return;
      p.style.strokeDasharray=len+' '+len;
      p.style.strokeDashoffset=len;
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          p.style.transition='stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1)';
          p.style.strokeDashoffset='0';
        });
      });
    }

    /* ── Month rail ─────────────────────────────────────────────────────── */
    function wtRenderMonths(){
      var wrap=$('wtMonthsWrap'), svg=$('wtMonthsSvg'); if(!wrap||!svg) return;
      var months=monthlyAverages(wtEntries);
      if(months.length<2){ wrap.classList.add('hidden'); return; }
      wrap.classList.remove('hidden');
      if(months.length>12) months=months.slice(-12);

      var W=svgWidth(svg), H=74;
      svg.setAttribute('viewBox','0 0 '+W+' '+H);
      var padX=Math.max(20, W*0.055);
      var avgs=months.map(function(m){ return m.avg; });
      var lo=Math.min.apply(null,avgs), hi=Math.max.apply(null,avgs);
      var span=Math.max(hi-lo, 0.8), mid=(lo+hi)/2;
      var y0=mid-span*0.85, y1=mid+span*0.85;
      var tTop=26, tBot=50;
      var xFor=function(i){ return months.length===1 ? W/2 : padX+(i/(months.length-1))*(W-padX*2); };
      var yFor=function(v){ return tBot-((v-y0)/(y1-y0))*(tBot-tTop); };

      /* A "70.7" is ~26px wide, so past ~9 months the labels would collide.
         Thin them from the newest end, which always keeps the current month. */
      var spacing = months.length>1 ? (W-padX*2)/(months.length-1) : W;
      var everyN = spacing<32 ? (spacing<20 ? 3 : 2) : 1;

      var pts=months.map(function(m,i){ return { x:xFor(i), y:yFor(m.avg) }; });
      var html='<path class="wt-mo-link" d="'+wtLinePath(pts)+'"/>';
      months.forEach(function(m,i){
        var isLast=i===months.length-1;
        var d=new Date(m.key+'-01T00:00:00');
        html+='<circle class="wt-mo-dot'+(isLast?' now':'')+'" cx="'+pts[i].x.toFixed(1)+'" cy="'+pts[i].y.toFixed(1)+'" r="'+(isLast?4:3.2)+'"/>';
        if((months.length-1-i)%everyN!==0) return;
        html+='<text class="wt-mo-lbl" x="'+pts[i].x.toFixed(1)+'" y="14" text-anchor="middle">'+MONTHS[d.getMonth()].toUpperCase()+'</text>';
        html+='<text class="wt-mo-val'+(isLast?' now':'')+'" x="'+pts[i].x.toFixed(1)+'" y="68" text-anchor="middle">'+m.avg.toFixed(1)+'</text>';
      });
      svg.innerHTML=html;
    }

    /* ── Headline trend verdict ─────────────────────────────────────────── */
    function wtRenderTrendLine(){
      var el=$('wtDelta');
      var rows=wtEntries.map(function(e){ return { weight:e.weight, t:dayNum(e.dateKey) }; });
      if(rows.length<2){ el.classList.add('hidden'); return; }
      var u=units();
      var tr=trendRate(rows,21);
      el.classList.remove('good','off');
      if(tr==null){
        el.textContent='Not enough days yet for a trend.';
        el.classList.remove('hidden');
        return;
      }
      var rate=tr.rate, mag=Math.abs(rate), steady=isSteady(tr);
      if(steady) el.textContent='→ holding steady · ±'+Math.max(mag,tr.se).toFixed(2)+' '+u+' / week';
      else el.textContent=(rate>0?'↑ +':'↓ −')+mag.toFixed(2)+' '+u+' / week · '+(rate>0?'gaining':'losing');

      /* Up is not automatically bad. Colour by whether he's moving TOWARD his
         own target — the old page painted every gain amber, which is simply
         wrong for someone climbing to 72 kg. */
      var goal=goalWeight();
      if(goal!=null && !steady){
        var tr=trendSeries(rows);
        var need=goal-tr[tr.length-1].mean;          // same basis as the TO GOAL cell
        if(Math.abs(need)>=0.3) el.classList.add((need>0)===(rate>0) ? 'good' : 'off');
      }
      el.classList.remove('hidden');
    }

    /* ── Stat trio ──────────────────────────────────────────────────────── */
    function wtRenderStats(){
      var el=$('wtStats');
      if(wtEntries.length<2){ el.classList.add('hidden'); el.innerHTML=''; return; }
      var u=units();
      var rows=wtEntries.map(function(e){ return { dateKey:e.dateKey, weight:e.weight, t:dayNum(e.dateKey) }; });
      var trend=trendSeries(rows);
      var tNow=trend[trend.length-1].mean;
      var goal=goalWeight();

      var cells=[];
      cells.push({ lbl:'7-DAY TREND', val:tNow.toFixed(1), sub:u });

      /* Distance to goal is measured from the TREND, not the last reading —
         otherwise this cell and Nova quote two different numbers for the same
         question, and the one from a single noisy morning is the wrong one. */
      if(goal!=null){
        var need=goal-tNow;
        var cls=Math.abs(need)<0.3 ? 'good' : '';
        cells.push({ lbl:'TO GOAL', val:(need>0?'+':need<0?'−':'')+Math.abs(need).toFixed(1), sub:goal.toFixed(1)+' '+u, cls:cls });
      } else {
        var ws=rows.map(function(r){ return r.weight; });
        cells.push({ lbl:'LOWEST', val:Math.min.apply(null,ws).toFixed(1), sub:u });
      }

      /* 96% of days logged is the most impressive fact in his data and the
         page never said it. */
      var firstT=rows[0].t, lastT=rows[rows.length-1].t;
      var spanDays=lastT-firstT+1;
      var pct=spanDays>0 ? Math.round(rows.length/spanDays*100) : 100;
      cells.push({ lbl:'LOGGED', val:String(rows.length), sub:Math.min(100,pct)+'% of days' });

      el.innerHTML=cells.map(function(c){
        return '<div class="wt-stat"><div class="wt-stat-lbl">'+c.lbl+'</div>'
             + '<div class="wt-stat-val'+(c.cls?' '+c.cls:'')+'">'+c.val+'</div>'
             + '<div class="wt-stat-sub">'+c.sub+'</div></div>';
      }).join('');
      el.classList.remove('hidden');
    }

    function wtRenderStreak(){
      var el=$('wtStreak'); var streak=0; var cursor=new Date();
      if(!wtEntries.find(function(e){return e.dateKey===wtDateKey(cursor);})) cursor.setDate(cursor.getDate()-1);
      while(wtEntries.find(function(e){return e.dateKey===wtDateKey(cursor);})){ streak++; cursor.setDate(cursor.getDate()-1); }
      if(streak>=2){ $('wtStreakNum').textContent=streak+' DAY STREAK'; el.classList.remove('hidden'); }
      else el.classList.add('hidden');
    }

    /* ── History, grouped by month ──────────────────────────────────────── */
    function wtRenderHistory(){
      var el=$('wtHistory'); if(!el) return;
      var u=units();
      var todayKey=wtDateKey(new Date());
      var desc=wtEntries.slice().sort(function(a,b){return b.dateKey.localeCompare(a.dateKey);});
      if(!desc.length){ el.innerHTML=''; return; }

      /* Deltas are computed on the flat list first, so a month boundary never
         swallows the change from the previous day. */
      var deltas=desc.map(function(e,i){ var p=desc[i+1]; return p ? e.weight-p.weight : null; });

      var order=[], byMonth={};
      desc.forEach(function(e,i){
        var k=e.dateKey.slice(0,7);
        if(!byMonth[k]){ byMonth[k]=[]; order.push(k); }
        byMonth[k].push({ e:e, delta:deltas[i] });
      });

      var body=order.map(function(k){
        var list=byMonth[k];
        var sum=0; list.forEach(function(it){ sum+=it.e.weight; });
        var avg=sum/list.length;
        var net=list[0].e.weight-list[list.length-1].e.weight;   // list is newest-first
        var netCls=net>0.05?'up':net<-0.05?'down':'';
        var netTxt=Math.abs(net)<0.05 ? 'flat' : (net>0?'+':'−')+Math.abs(net).toFixed(1);
        var d=new Date(k+'-01T00:00:00');
        var head='<div class="wt-mo-head"><span class="wt-mo-head-name">'+MONTHS_LONG[d.getMonth()]+' '+d.getFullYear()+'</span>'
               + '<span class="wt-mo-head-meta">avg '+avg.toFixed(1)+' · <span class="'+netCls+'">'+netTxt+'</span></span></div>';
        var rows=list.map(function(it){
          var entry=it.e, deltaHtml='';
          if(it.delta!=null){
            var diff=it.delta, sign=diff>0?'+':'', cls=diff>0?'up':diff<0?'down':'';
            deltaHtml='<span class="wt-history-delta '+cls+'">'+sign+diff.toFixed(1)+'</span>';
          }
          var isToday=entry.dateKey===todayKey;
          var label=isToday?'Today':wtFmtDateLabel(entry.dateKey);
          return '<div class="wt-history-row '+(isToday?'today-row':'')+'">'+
            '<span class="wt-history-date">'+label+'</span>'+
            '<span class="wt-history-val">'+entry.weight.toFixed(1)+' '+u+'</span>'+
            deltaHtml+
            '<div class="wt-history-edit-wrap">'+
              '<button type="button" class="wt-h-btn" data-wedit="'+entry.dateKey+'">Edit</button>'+
              '<button type="button" class="wt-h-btn del" data-wdel="'+entry.dateKey+'">✕</button>'+
            '</div></div>';
        }).join('');
        return head+rows;
      }).join('');

      el.innerHTML='<div class="wt-history-title">ALL WEIGH-INS ('+desc.length+')</div><div class="wt-history-list">'+body+'</div>';
    }

    function wtRender(){
      var last=wtEntries[wtEntries.length-1]||null;
      var todayKey=wtDateKey(new Date());
      var todayEntry=wtEntries.find(function(e){return e.dateKey===todayKey;});
      var u=units();
      $('wtUnit').textContent=u; $('wtUnitStatic').textContent=u;
      (function(){var n=$('wtNum'); if(last){ n.setAttribute('data-to',last.weight.toFixed(1)); n.setAttribute('data-dec','1'); n.removeAttribute('data-done'); n.textContent=last.weight.toFixed(1); if(window.PageMotion&&n.closest('[data-rise].in')) PageMotion.countUp(n);} else n.textContent='—';})();

      if(todayEntry){
        $('wtEmpty').classList.add('hidden');
        $('wtLockedValue').textContent=todayEntry.weight.toFixed(1)+' '+u;
        $('wtLocked').classList.remove('hidden');
        $('wtInputRow').classList.add('hidden');
      } else {
        if(wtEntries.length===0) $('wtEmpty').classList.remove('hidden'); else $('wtEmpty').classList.add('hidden');
        $('wtLocked').classList.add('hidden');
        $('wtInputRow').classList.remove('hidden');
      }

      wtRenderStats();
      if(wtEntries.length>=2){
        $('wtChartWrap').classList.remove('hidden');
        wtRenderChart(); wtRenderTrendLine(); movePill();
      } else {
        $('wtChartWrap').classList.add('hidden');
        $('wtDelta').classList.add('hidden');
      }
      wtRenderMonths();
      wtRenderStreak();
      wtRenderHistory();

      var di=$('wtDateInput'); if(di && !di.value) di.value=todayKey;
      updateNova(last, todayEntry);
    }

    /* ── Nova hero ── */
    function updateNova(last, todayEntry){
      var dd=new Date();
      var de=$('heroDate'); if(de) de.textContent=['SUN','MON','TUE','WED','THU','FRI','SAT'][dd.getDay()]+' '+dd.getDate();
      var ns=$('novaSays'); if(!ns) return;
      var u=units();
      if(!last){ ns.textContent='Log your first weight to start tracking.'; return; }

      /* Every number Nova says here is computed from his own log. */
      var goal=goalWeight();
      if(goal!=null && wtEntries.length>=4){
        var rows=wtEntries.map(function(e){ return { weight:e.weight, t:dayNum(e.dateKey) }; });
        var trend=trendSeries(rows);
        var tNow=trend[trend.length-1].mean;
        var need=goal-tNow;
        if(Math.abs(need)<0.3){ ns.textContent='Sitting right on '+goal.toFixed(0)+' '+u+'. Hold it here.'; return; }
        var dir=need>0?'to go':'over';
        ns.textContent='Trending at '+tNow.toFixed(1)+' '+u+' — '+Math.abs(need).toFixed(1)+' '+u+' '+dir+'.';
        return;
      }
      if(todayEntry){ ns.textContent='Logged today at '+todayEntry.weight.toFixed(1)+' '+u+'. Nice and consistent.'; return; }
      ns.textContent='Last weigh-in: '+last.weight.toFixed(1)+' '+u+'. Drop today’s in below.';
    }

    /* ── Chart readout (tap + drag) ── */
    (function(){
      var svg=$('wtSvg'); if(!svg) return;
      function toSvgX(cx){ try{ var pt=svg.createSVGPoint(); pt.x=cx; pt.y=0; return pt.matrixTransform(svg.getScreenCTM().inverse()).x; }catch(e){ return -1; } }
      function nearest(sx){ if(!wtChartPoints.length) return -1; var bi=0,bd=Infinity; wtChartPoints.forEach(function(p,i){ var d=Math.abs(p.x-sx); if(d<bd){bd=d;bi=i;} }); return bi; }
      function show(cx){
        if(!wtChartPoints.length || !wtGeom) return;
        var i=nearest(toSvgX(cx)); if(i<0) return;
        var p=wtChartPoints[i], e=wtChartRecent[i];
        var dd=wtParseKey(e.dateKey);
        var u=units();

        var tip=$('wtTip');
        tip.style.display='';                                   // measure needs it rendered

        var dText=DAYS[dd.getDay()]+' · '+MONTHS[dd.getMonth()]+' '+dd.getDate();
        var wText=e.weight.toFixed(1)+' '+u;
        var sText='';
        if(wtChartTrend[i]){
          var off=e.weight-wtChartTrend[i].mean;
          sText=(off>0?'+':off<0?'−':'')+Math.abs(off).toFixed(1)+' vs trend';
        }
        var tD=$('wtTipDate'), tW=$('wtTipWeight'), tS=$('wtTipSub');
        tD.textContent=dText; tW.textContent=wText; tS.textContent=sText;

        /* Real text metrics — the old tooltip used a hardcoded 74px box on a
           non-uniformly stretched canvas, which is why it looked squashed. */
        function widthOf(node){ try{ return node.getComputedTextLength(); }catch(err){ return 70; } }
        var bw=Math.ceil(Math.max(widthOf(tD), widthOf(tW), widthOf(tS))+22);
        var bh=sText?54:40, pad=10;

        var bx=p.x+pad; if(bx+bw>wtGeom.xR) bx=p.x-bw-pad;
        if(bx<wtGeom.xL) bx=Math.min(wtGeom.xL, p.x+pad);
        var by=Math.max(wtGeom.yT-8, Math.min(p.y-bh/2, wtGeom.yB-bh));

        $('wtTipLine').setAttribute('x1',p.x); $('wtTipLine').setAttribute('x2',p.x);
        $('wtTipLine').setAttribute('y1',wtGeom.yT-6); $('wtTipLine').setAttribute('y2',wtGeom.yB+4);
        $('wtTipDot').setAttribute('cx',p.x); $('wtTipDot').setAttribute('cy',p.y);
        $('wtTipBg').setAttribute('x',bx); $('wtTipBg').setAttribute('y',by);
        $('wtTipBg').setAttribute('width',bw); $('wtTipBg').setAttribute('height',bh);
        tD.setAttribute('x',bx+11); tD.setAttribute('y',by+16);
        tW.setAttribute('x',bx+11); tW.setAttribute('y',by+33);
        tS.setAttribute('x',bx+11); tS.setAttribute('y',by+47);
      }
      function hide(){ $('wtTip').style.display='none'; }
      svg.addEventListener('mousemove', function(e){ show(e.clientX); });
      svg.addEventListener('mouseleave', hide);

      /* Decide from the gesture, not from the element: a mostly-vertical drag
         belongs to the page, a mostly-horizontal one is him reading a day. */
      var sx=0, sy=0, mode=0;                       // 0 undecided · 1 scrub · 2 scroll
      svg.addEventListener('touchstart', function(e){
        var t=e.touches[0]; sx=t.clientX; sy=t.clientY; mode=0;
        show(t.clientX);
      }, { passive:true });
      svg.addEventListener('touchmove', function(e){
        var t=e.touches[0], dx=Math.abs(t.clientX-sx), dy=Math.abs(t.clientY-sy);
        if(mode===0 && (dx>6 || dy>6)) mode = dx>dy ? 1 : 2;
        if(mode===2){ hide(); return; }             // let the page scroll away
        if(e.cancelable) e.preventDefault();
        show(t.clientX);
      }, { passive:false });
      svg.addEventListener('touchend', hide);
      svg.addEventListener('touchcancel', hide);
    })();

    /* ── Range selector ── */
    /* Transform only — the segments are equal width, and the indicator's own
       left:2px already matches the first button's offset. */
    function movePill(){
      var ind=$('wtPillInd'), btn=document.querySelector('[data-wrange].active');
      if(!ind||!btn) return;
      ind.style.transform='translateX('+(btn.offsetLeft-2)+'px)';
    }
    document.querySelectorAll('[data-wrange]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var r=parseInt(btn.dataset.wrange,10);
        document.querySelectorAll('[data-wrange]').forEach(function(b){ b.classList.toggle('active', b===btn); });
        movePill();
        if(r===wtRange) return;
        $('wtTip').style.display='none';
        var c=$('wtChartContent');
        if(reduceMotion || wtEntries.length<2){ wtRange=r; if(wtEntries.length>=2) wtRenderChart(); return; }
        c.style.opacity='0';
        setTimeout(function(){ wtRange=r; wtRenderChart(); c.style.opacity='1'; }, 140);
      });
    });

    /* ── Add / edit wiring ── */
    function doSave(){
      var v=parseWeight($('wtInput').value);
      if(isNaN(v) || v<=0 || v>500) return;
      wtSaveEntry(Math.round(v*10)/10);
      $('wtInput').value='';
      if($('wtDateInput')) $('wtDateInput').value=wtDateKey(new Date());
    }
    $('wtSaveBtn').addEventListener('click', doSave);
    $('wtInput').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); doSave(); } });
    /* keep only digits + a single separator as the user types */
    $('wtInput').addEventListener('input', function(){
      var clean=this.value.replace(/[^0-9.,]/g,'').replace(/([.,]).*?([.,])/g,'$1');
      if(clean!==this.value) this.value=clean;
    });
    $('wtTodayBtn').addEventListener('click', function(){ if($('wtDateInput')) $('wtDateInput').value=wtDateKey(new Date()); });
    $('wtEditBtn').addEventListener('click', function(){
      $('wtLocked').classList.add('hidden'); $('wtInputRow').classList.remove('hidden');
      var todayEntry=wtEntries.find(function(e){return e.dateKey===wtDateKey(new Date());});
      if(todayEntry) $('wtInput').value=todayEntry.weight.toFixed(1);
      $('wtInput').focus();
    });

    /* delegated edit/delete on history rows (iOS-reliable) */
    $('wtHistory').addEventListener('click', async function(ev){
      var ed=ev.target.closest('[data-wedit]'); var dl=ev.target.closest('[data-wdel]');
      if(ed){ wtEditEntry(ed.getAttribute('data-wedit')); return; }
      if(dl){ var k=dl.getAttribute('data-wdel'); if(await ALSConfirm({title:'Delete weigh-in?',confirmText:'Delete',danger:true})) wtDeleteEntry(k); }
    });

    /* ── Redraw on width change ── */
    /* 1 SVG unit == 1 CSS pixel is what makes the strokes uniform and the type
       crisp, so the viewBox has to follow the real width. */
    (function(){
      var timer=null;
      /* Compared against the width the chart was last DRAWN at, not a captured
         local — otherwise the observer's own first callback (which fires before
         the chart has ever been painted) re-renders and kills the draw-in. */
      function onResize(){
        if(svgWidth($('wtSvg'))===wtLastW) return;
        clearTimeout(timer);
        timer=setTimeout(function(){
          if(wtEntries.length>=2) wtRenderChart();
          wtRenderMonths(); movePill();
        }, 90);
      }
      if(window.ResizeObserver){
        try{ new ResizeObserver(onResize).observe(document.querySelector('.wt-card')); }catch(e){ window.addEventListener('resize', onResize); }
      } else window.addEventListener('resize', onResize);
      window.addEventListener('orientationchange', function(){ setTimeout(onResize, 220); });
    })();

    /* ── Boot ── */
    wtRender();
    /* Safety net for a first paint measured before layout settled. Skips when
       the width is already correct, so the trend keeps drawing itself in. */
    requestAnimationFrame(function(){
      movePill();
      if(wtEntries.length>=2 && svgWidth($('wtSvg'))!==wtLastW){ wtRenderChart(); wtRenderMonths(); }
    });
    window._weightRerender = function(){ wtEntries=wtLoad(); wtRender(); };
    document.addEventListener('visibilitychange', function(){ if(!document.hidden){ wtEntries=wtLoad(); wtRender(); } });
    window.addEventListener('focus', function(){ wtEntries=wtLoad(); wtRender(); });
    window.addEventListener('storage', function(){ wtEntries=wtLoad(); wtRender(); });
  })();
  </script>

  <script src="pocoach-sync.js?v=4"></script>
