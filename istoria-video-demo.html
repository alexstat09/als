<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ΙΣΤΟΡΙΑ · ΤΟ ΒΙΝΤΕΟ — α. Ο πληθυσμός</title>
<style>
/* ═══ Ο ΚΟΣΜΟΣ ═══════════════════════════════════════════════════════════
   Επίπεδο διάνυσμα, χοντρά περιγράμματα, γήινη παλέτα. Δικός μας θίασος,
   δικά μας χρώματα — το λεξιλόγιο της κίνησης, όχι αντίγραφο κανενός.     */
:root{
  --ink:#2B2119;          /* το περίγραμμα, παντού */
  --parch:#EADCC0;        /* περγαμηνή */
  --parch2:#DCC9A4;
  --sea:#7FA3B4;
  --sea-d:#5F8497;
  --land:#CBB894;
  --land-d:#B39E78;
  --terr:#C4574A;         /* η ελληνική επικράτεια */
  --terr-d:#A3443A;
  --gold:#DFA845;
  --green:#7E9A5C;
  --bone:#F5EDDD;
  --dust:#8E7B5E;

  /* Δύο στοίβες, όχι μία. Ο τίτλος φωνάζει, ο υπότιτλος διαβάζεται.
     ⚠️ Μόνο συστημικές γραμματοσειρές — καμία εξωτερική φόρτωση. */
  --display:'Haettenschweiler','Arial Narrow',Impact,'Avenir Next Condensed','Helvetica Neue',sans-serif;
  --body:'Avenir Next','Segoe UI',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#1A1510;
  font-family:var(--body);
  color:var(--bone);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}

/* ═══ Ο ΠΡΟΒΟΛΕΑΣ ═══ */
.player{width:100%;max-width:1120px;padding:0 14px}
.frame{
  position:relative;width:100%;aspect-ratio:16/9;
  background:var(--parch);border-radius:14px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06);
}
/* ΕΝΑ καρέ για όλη την ταινία. Δεν υπάρχουν πια «σκηνές» ως στοιχεία DOM —
   υπάρχει ο χάρτης, που επιβιώνει, και οι επικαλύψεις, που εναλλάσσονται. */
.stage{position:absolute;inset:0}
.film{width:100%;height:100%;display:block}
.maph{transition:opacity .34s ease}
.fxh{transition:opacity .22s ease}

/* ═══ Ο ΥΠΟΤΙΤΛΟΣ — τα λόγια του βιβλίου ═══ */
.cap{
  position:absolute;left:0;right:0;bottom:0;
  padding:44px 30px 20px;
  background:linear-gradient(to top,rgba(20,15,10,.88) 30%,rgba(20,15,10,0));
  font-size:clamp(13px,1.65vw,19px);line-height:1.5;
  text-align:center;color:#F6EEDF;
  text-shadow:0 2px 6px rgba(0,0,0,.6);
  font-weight:500;
}
.frame.nocap .cap{display:none}

/* ═══ ΧΕΙΡΙΣΤΗΡΙΑ ═══ */
.bar{display:flex;align-items:center;gap:13px;margin-top:13px}
.btn{
  width:46px;height:46px;flex:none;border:0;border-radius:50%;
  background:var(--gold);color:#241B10;cursor:pointer;
  display:grid;place-items:center;transition:transform .16s, filter .16s;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.93)}
.btn svg{width:20px;height:20px;fill:currentColor}
.btn.sm{width:36px;height:36px;background:rgba(255,255,255,.1);color:var(--bone)}
.btn.sm svg{width:15px;height:15px}
.track{
  flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.13);
  position:relative;cursor:pointer;
}
.fill{position:absolute;inset:0;width:0;border-radius:4px;background:var(--gold)}
.ticks{position:absolute;inset:0}
.ticks i{position:absolute;top:0;bottom:0;width:1px;background:rgba(26,21,16,.45)}
.time{
  font-variant-numeric:tabular-nums;font-size:12.5px;letter-spacing:.06em;
  color:rgba(246,238,223,.62);flex:none;min-width:78px;text-align:right;
}
.meta{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:11px;gap:14px;flex-wrap:wrap;
}
.meta h1{font-size:16px;font-weight:600;letter-spacing:.01em}
.meta h1 b{color:var(--gold);font-weight:600}
.meta .note{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:rgba(246,238,223,.42)}

/* ═══ ΤΟ ΠΟΣΤΕΡ (πριν πατήσει play) ═══ */
.poster{
  position:absolute;inset:0;z-index:6;cursor:pointer;
  background:radial-gradient(120% 100% at 50% 40%,#3A2E20,#181209);
  display:grid;place-items:center;text-align:center;padding:24px;
}
.poster.gone{display:none}
.poster .k{font-size:11px;letter-spacing:.34em;color:var(--gold);margin-bottom:12px}
.poster .t{font-family:var(--display);font-size:clamp(34px,6vw,72px);font-weight:800;letter-spacing:.01em;line-height:1}
.poster .s{margin-top:12px;font-size:13.5px;color:rgba(246,238,223,.55);letter-spacing:.02em}
/* Σκιά πτώσης, όχι λάμψη — το κουμπί κάθεται πάνω στο πόστερ, δεν φωσφορίζει. */
.poster .play{
  margin-top:24px;width:70px;height:70px;border-radius:50%;background:var(--gold);
  display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.45);
}
.poster .play svg{width:26px;height:26px;fill:#241B10;margin-left:4px}

/* ═══════════════════════════════════════════════════════════════════════
   ΚΙΝΗΣΗ — κάθε σκηνή ανάβει τις δικές της animations όταν παίρνει .on
   ═══════════════════════════════════════════════════════════════════════ */
/* ⚠️ Εδώ υπήρχαν `.scene .an` κανόνες. Το `.scene` ΔΕΝ υπάρχει πια στο DOM
   (als-v464: ένα μόνιμο καρέ αντί για 15 divs), άρα ήταν νεκροί επιλογείς —
   σταθερή αρχή 12 ανάποδα. Δεν έσπασε τίποτα μόνο επειδή κάθε animation
   κουβαλάει `both` inline. Τώρα τα στοιχεία μπαίνουν στο DOM τη στιγμή που
   αρχίζει η σκηνή τους, οπότε ξεκινούν μόνα τους: δεν χρειάζεται παύση.  */
.an{animation-fill-mode:both}
/* Ο θίασος ανασαίνει. Ένα εντελώς ακίνητο σώμα διαβάζεται σαν αυτοκόλλητο. */
.idle{transform-box:fill-box;transform-origin:50% 90%;animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleY(1) translateY(0)}50%{transform:scaleY(1.022) translateY(-1.5px)}}

@keyframes popIn{from{opacity:0;transform:scale(.6)}60%{transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
@keyframes slamIn{from{opacity:0;transform:scale(2.4) rotate(-7deg)}70%{opacity:1;transform:scale(.93) rotate(1.5deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes drawLine{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes sail{from{transform:translateX(-260px)}to{transform:translateX(0)}}
@keyframes fell{from{transform:rotate(0)}to{transform:rotate(78deg)}}
@keyframes drain{to{opacity:.18}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
@keyframes pulseRing{0%{opacity:.85;transform:scale(.5)}100%{opacity:0;transform:scale(2.3)}}

/* βοηθητικά */
.ol{stroke:var(--ink);stroke-linejoin:round;stroke-linecap:round}
/* Ο ΤΙΤΛΟΣ ΦΩΝΑΖΕΙ — στενή display στοίβα, όπως στα ντοκιμαντέρ.
   Ο υπότιτλος από κάτω μένει στη --body, γιατί αυτόν τον ΔΙΑΒΑΖΕΙ. */
.stamp{font-family:var(--display);font-weight:800;letter-spacing:.02em;paint-order:stroke fill;stroke:var(--ink);stroke-width:7px;stroke-linejoin:round}
.lbl{font-family:var(--body);font-weight:700;letter-spacing:.05em;paint-order:stroke fill;stroke:var(--parch);stroke-width:5px;stroke-linejoin:round;fill:var(--ink)}
.num{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;paint-order:stroke fill;stroke:var(--ink);stroke-width:8px;stroke-linejoin:round}
</style>
</head>
<body>

<div class="player">

  <div class="meta">
    <h1>ΕΝΟΤΗΤΑ Α · 1. Τα δημογραφικά δεδομένα — <b>α. Ο πληθυσμός</b></h1>
    <div class="note">Η αφήγηση είναι το βιβλίο, αυτολεξεί</div>
  </div>

  <div class="frame" id="frame">
    <div class="stage" id="stage"></div>
    <div class="cap" id="cap"></div>

    <div class="poster" id="poster">
      <div>
        <div class="k">ΙΣΤΟΡΙΑ · ΕΝΟΤΗΤΑ Α</div>
        <div class="t">Ο ΠΛΗΘΥΣΜΟΣ</div>
        <div class="s">Μικρή · άδεια · ρημαγμένη — κι όμως γέμιζε</div>
        <div class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      </div>
    </div>
  </div>

  <div class="bar">
    <button class="btn" id="pp" aria-label="Παύση/Αναπαραγωγή">
      <svg id="ppIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="btn sm" id="back" aria-label="Προηγούμενη σκηνή">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="btn sm" id="fwd" aria-label="Επόμενη σκηνή">
      <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
    </button>
    <div class="track" id="track">
      <div class="fill" id="fill"></div>
      <div class="ticks" id="ticks"></div>
    </div>
    <div class="time" id="time">0:00 / 1:44</div>
    <button class="btn sm" id="cc" aria-label="Υπότιτλοι">
      <svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zm3.5 4.5a2.5 2.5 0 100 5h1.5v-1.6H7a.9.9 0 110-1.8h1v-1.6H6.5zm7 0a2.5 2.5 0 100 5H15v-1.6h-1a.9.9 0 110-1.8h1V9.5h-1.5z"/></svg>
    </button>
    <button class="btn sm" id="mute" aria-label="Σίγαση ήχου (M)">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zm12.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4m-2.5 7.9a7 7 0 000-15.8v2.1a5 5 0 010 11.6z"/></svg>
    </button>
    <button class="btn sm" id="fs" aria-label="Πλήρης οθόνη">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM4 15h2v3h3v2H4zm14 0h2v5h-5v-2h3z"/></svg>
    </button>
  </div>

</div>

<!-- Η ΑΛΗΘΙΝΗ ΓΕΩΜΕΤΡΙΑ. Καθαρά δεδομένα: κανένα fetch, κανένα sync, καμία
     πρόσβαση σε localStorage. Παράγεται από tools/build-geo.js. -->
<script src="greece-geo.js"></script>
<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════════
   Ο ΧΑΡΤΗΣ — ΑΛΗΘΙΝΟΣ. Η γεωμετρία έρχεται από το greece-geo.js
   (Natural Earth 10m, public domain, Web Mercator). Δεν σχεδιάζεται τίποτα
   με το χέρι εδώ.
   ══════════════════════════════════════════════════════════════════════ */
var VB = (typeof GEO_VB !== 'undefined') ? GEO_VB : null;
var AR = 16 / 9;

/* ── ΟΙ ΚΑΤΑΣΤΑΣΕΙΣ ΤΩΝ ΣΥΝΟΡΩΝ ────────────────────────────────────────
   ⚠️ ΔΙΑΒΑΣΕ ΑΥΤΟ ΠΡΙΝ ΑΛΛΑΞΕΙΣ ΟΤΙΔΗΠΟΤΕ ΕΔΩ.
   Τα ΓΕΓΟΝΟΤΑ (ποια χρονιά, ποια περιοχή) είναι του ΒΙΒΛΙΟΥ. Τα ΣΧΗΜΑΤΑ
   είναι σημερινές περιφέρειες, που είναι ΠΡΟΣΕΓΓΙΣΗ του ιστορικού συνόρου.
   Όπου η προσέγγιση είναι ορατή, το λέμε ΣΤΗΝ ΟΘΟΝΗ — μια προσέγγιση που
   παριστάνει ακρίβεια είναι χειρότερη από καμία.                        */
var STATES = [
  { y: 1832, add: ['sterea','attiki','peloponnisos','dytiki','kyklades','sporades'],
    approx: true,
    note: 'Η γραμμή Αμβρακικού–Παγασητικού δεν πέφτει ακριβώς σε σημερινά όρια.',
    source: 'Το κείμενο της ενότητας a1a' },
  { y: 1864, add: ['ionia'], source: 'a1a: «Το 1864 προστέθηκαν τα Ιόνια νησιά»' },
  { y: 1881, add: ['thessalia'], approx: true,
    note: 'Μαζί με τη Θεσσαλία ήρθε και η Άρτα, που εδώ δεν ξεχωρίζει από την Ήπειρο.',
    source: 'a1a: «και το 1881 η Θεσσαλία»' },
  { y: 1913, add: ['ipeiros','dmakedonia','kmakedonia','kriti','voreio'],
    source: 'a1a Πίνακας 1: η έκταση 63.211 → 120.000 τ.χλμ. (1911 → 1914)' },
  { y: 1920, add: ['thraki'], source: 'a1a Πίνακας 1: 150.833 τ.χλμ. το 1920' }
];
/* Ποτέ σε χάρτη πριν το 1947 — και γι' αυτό είναι ξεχωριστό κλειδί. */
var NEVER_YET = ['dodekanisa'];

function territoryAt(year){
  var keys = [];
  STATES.forEach(function(s){ if (s.y <= year) keys = keys.concat(s.add); });
  return keys;
}
function stateAt(year){
  var found = null;
  STATES.forEach(function(s){ if (s.y <= year) found = s; });
  return found;
}

/* ── ΚΑΜΕΡΑ ───────────────────────────────────────────────────────────
   Τα πλαίσια ΥΠΟΛΟΓΙΖΟΝΤΑΙ από τη γεωμετρία, δεν γράφονται με το χέρι —
   έτσι δεν μπορούν να ξεσυγχρονιστούν αν αλλάξει ο χάρτης.            */
var _bbCache = {};
function bboxOf(keys){
  var ck = keys.join('|');
  if (_bbCache[ck]) return _bbCache[ck];
  var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  keys.forEach(function(k){
    var d = GEO[k]; if (!d) return;
    var n = d.match(/-?\d+(?:\.\d+)?/g); if (!n) return;
    for (var i = 0; i + 1 < n.length; i += 2){
      var x = +n[i], y = +n[i + 1];
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  });
  return (_bbCache[ck] = { x0: x0, y0: y0, x1: x1, y1: y1 });
}
/* Επιστρέφει πλαίσιο 16:9 που περικλείει τις περιοχές, με περιθώριο. */
function camOf(keys, pad){
  var b = bboxOf(keys);
  pad = pad == null ? 0.16 : pad;
  var w = (b.x1 - b.x0), h = (b.y1 - b.y0);
  w += w * pad * 2; h += h * pad * 2;
  if (w / h < AR) w = h * AR; else h = w / AR;
  var cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
  return { x: cx - w / 2, y: cy - h / 2, w: w, h: h };
}
var camStr = function(c){ return c.x + ' ' + c.y + ' ' + c.w + ' ' + c.h; };
/* Οι γραμματοσειρές μετριούνται σε ΜΟΝΑΔΕΣ ΤΗΣ ΚΑΜΕΡΑΣ, αλλιώς μια ετικέτα
   που δείχνει σωστή σε πλατύ πλάνο γίνεται τεράστια σε κοντινό. */
function K(cam){ return cam.w / 1352; }

/* ── Η ΖΩΓΡΑΦΙΚΗ ΤΟΥ ΧΑΡΤΗ ────────────────────────────────────────── */
/* ⭐⭐ Ο ΧΑΡΤΗΣ ΤΥΛΙΓΕΤΑΙ ΣΕ <g class="mapg"> ΚΑΙ ΑΥΤΟ ΕΙΝΑΙ ΦΕΡΟΝ.
   Ο προβολέας συγκρίνει αυτό το κομμάτι με ό,τι είναι ήδη στην οθόνη και,
   αν είναι ΙΔΙΟ, ΔΕΝ το ξαναφτιάχνει. Έτσι ο χάρτης επιβιώνει από σκηνή σε
   σκηνή — δεν κόβει ποτέ. Αυτό είναι η διαφορά «βίντεο» / «διαφάνειες».
   ⚠️ ΜΗΝ βάλεις ένθετο <g> μέσα στη mapSVG: ο προβολέας κόβει στο ΠΡΩΤΟ
      </g> και ένα ένθετο group θα έσπαγε τον διαχωρισμό. */
function mapSVG(year, cam, opt){
  opt = opt || {};
  var sw = 1.7;   /* ΜΟΝΑΔΕΣ ΟΘΟΝΗΣ (vector-effect), όχι χάρτη. ⚠️ Τίποτα εδώ
     μέσα δεν επιτρέπεται να εξαρτάται από την κάμερα: αν εξαρτηθεί, το markup
     αλλάζει σε κάθε ζουμ και ο χάρτης ξαναχτίζεται σε κάθε σκηνή. */
  var own = territoryAt(year);
  var dim = opt.dim || [];
  var s = '<g class="mapg">';

  /* θάλασσα, απλωμένη πολύ πέρα από κάθε κάμερα */
  s += '<rect x="-3000" y="-3000" width="9000" height="9000" fill="var(--sea)"/>';
  /* γείτονες + ό,τι δεν είναι ακόμα ελληνικό, ουδέτερα */
  s += '<path d="' + GEO._neighbours + '" fill="var(--land)" stroke="var(--ink)" stroke-width="' + sw + '" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
  Object.keys(GEO).forEach(function(key){
    if (key === '_neighbours' || own.indexOf(key) >= 0) return;
    s += '<path d="' + GEO[key] + '" fill="var(--land)" stroke="var(--ink)" stroke-width="' + sw + '" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
  });
  /* η ελληνική επικράτεια */
  /* ⭐ `hi` = ΘΕΤΙΚΗ επισήμανση («αυτά εδώ»), αντί να ξεθωριάζουμε τα υπόλοιπα.
     Το ξεθώριασμα όλης της στεριάς έκανε το καρέ να μοιάζει ξεπλυμένο. */
  var hi = opt.hi || [];
  own.forEach(function(key){
    if (!GEO[key]) return;
    var isNew  = opt.reveal && opt.reveal.indexOf(key) >= 0;
    var faded  = dim.indexOf(key) >= 0;
    var lit    = hi.indexOf(key) >= 0;
    s += '<path d="' + GEO[key] + '" fill="' + (lit ? 'var(--gold)' : 'var(--terr)') + '" stroke="var(--ink)" ' +
         'stroke-width="' + (lit ? sw * 1.8 : sw) + '" stroke-linejoin="round" vector-effect="non-scaling-stroke"' +
         (faded ? ' opacity=".38"' : '') +
         (isNew ? ' class="an" style="animation:fadeIn .7s ' + (opt.revealAt || 0) + 's both"' : '') + '/>';
  });
  return s + '</g>';
}
/* Η δήλωση προσέγγισης ζει στην ΕΠΙΚΑΛΥΨΗ, ποτέ μέσα στον χάρτη — ο χάρτης
   πρέπει να παραμένει byte-ίδιος από σκηνή σε σκηνή για να μην ξαναχτίζεται. */
function approxNote(year, cam){
  var st = stateAt(year); if (!st || !st.approx) return '';
  var k = K(cam);
  return '<text class="lbl" x="' + (cam.x + cam.w * .5) + '" y="' + (cam.y + cam.h - 16 * k) + '" text-anchor="middle" ' +
         'font-size="' + (26 * k) + '" stroke="var(--sea)" stroke-width="' + (5 * k) + '" opacity=".9">ΣΥΝΟΡΑ ΚΑΤΑ ΠΡΟΣΕΓΓΙΣΗ</text>';
}
/* Ετικέτα σε συντεταγμένες ΧΑΡΤΗ, μεγέθους ΚΑΜΕΡΑΣ. */
function mapLabel(x, y, txt, size, cam, cls, fill){
  return '<text class="' + (cls || 'stamp') + '" x="' + x + '" y="' + y + '" text-anchor="middle" ' +
         'font-size="' + (size * K(cam)) + '" ' + (fill ? 'fill="' + fill + '" ' : '') +
         'stroke-width="' + (6 * K(cam)) + '">' + txt + '</text>';
}

  if (!AC) return; t = t || AC.currentTime;
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(500, t + .07);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.075, t + .008);
  g.gain.exponentialRampToValueAtTime(.0001, t + .1);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + .11);
}
/* Το μουσικό στρώμα: δικές μας ημιτονοειδείς, ΠΟΛΥ χαμηλά, ώστε να μην
   παλεύει με την αφήγηση. Καμία ξένη ηχογράφηση, κανένα δικαίωμα τρίτου. */
function startBed(){
  bed = AC.createGain(); bed.gain.value = 0; bed.connect(master);
  [110, 164.81, 220, 329.63].forEach(function(f, i){
    var o = AC.createOscillator(), g = AC.createGain(), lfo = AC.createOscillator(), lg = AC.createGain();
    o.type = i > 1 ? 'sine' : 'triangle'; o.frequency.value = f;
    g.gain.value = [.055, .04, .03, .016][i];
    lfo.frequency.value = .045 + i * .017; lg.gain.value = g.gain.value * .55;
    lfo.connect(lg); lg.connect(g.gain);
    o.connect(g); g.connect(bed); o.start(); lfo.start();
  });
  bed.gain.linearRampToValueAtTime(.34, AC.currentTime + 4);
}
function setMuted(m){
  muted = m;
  if (master) master.gain.setTargetAtTime(m ? 0 : 1, AC.currentTime, .05);
  var b = document.getElementById('mute');
  if (b) b.style.opacity = m ? .42 : 1;
}
/* ⭐ Ο ήχος ΔΙΑΒΑΖΕΙ τα ίδια τα animation delays της σκηνής και μπαίνει
   ακριβώς εκεί. Δεν γράφεται χρονισμός στο χέρι πουθενά, άρα δεν μπορεί
   να ξεσυγχρονιστεί όταν αλλάξει μια σκηνή. */
var sfxTimers = [];
function scheduleSFX(markup){
  sfxTimers.forEach(clearTimeout); sfxTimers = [];
  if (!AC || muted) return;
  var re = /animation:(slamIn|popIn)\s+[\d.]+s\s+([\d.]+)s/g, m, n = 0;
  while ((m = re.exec(markup)) && n < 26){
    (function(kind, at){
      sfxTimers.push(setTimeout(function(){ kind === 'slamIn' ? sfxThud() : sfxTick(); }, at * 1000));
    })(m[1], parseFloat(m[2]));
    n++;
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   Η ΣΚΗΝΗ
   ══════════════════════════════════════════════════════════════════════ */
function buildStage(){
  $stage.innerHTML = '<svg class="film" preserveAspectRatio="xMidYMid meet">' +
                       '<g class="maph"></g><g class="fxh"></g></svg>';
  film    = $stage.firstChild;
  mapHost = film.children[0];
  fxHost  = film.children[1];
}

var designCam = function(){ return { x: DESIGN.x, y: DESIGN.y, w: DESIGN.w, h: DESIGN.h }; };

/* ⭐ ΡΥΘΜΟΣ — ΤΟ ΚΑΔΡΟ ΑΝΑΠΝΕΕΙ.
   Ένα εντελώς ακίνητο καρέ διαβάζεται σαν παγωμένη εικόνα, όσο καλό κι αν
   είναι. Οι χαρτογραφικές σκηνές κινούνται ήδη με την κάμερα· οι υπόλοιπες
   παίρνουν ένα αργό, συνεχές push-in. Τίποτα δεν μένει ποτέ ακίνητο. */
var BREATHE = 0.055;          /* πόσο μπαίνει μέσα σε μια ολόκληρη σκηνή */
var sceneT0 = 0, sceneDur = 4;

function applyCam(){
  film.setAttribute('viewBox', camNow.x + ' ' + camNow.y + ' ' + camNow.w + ' ' + camNow.h);
  /* Οι μη-χαρτογραφικές σκηνές ζουν στον χώρο σχεδίασης και «κολλάνε» πάνω
     στην κάμερα, ώστε να μένουν ακίνητες όσο εκείνη ταξιδεύει από κάτω. */
  if (!curIsMap){
    var prog = Math.min(1, (performance.now() - sceneT0) / (sceneDur * 1000));
    var z = 1 + BREATHE * prog;                  /* αργό, συνεχές μπες-μέσα */
    var k = (camNow.w / DESIGN.w) * z;
    /* Το ζουμ γίνεται γύρω από το ΚΕΝΤΡΟ του κάδρου, όχι από τη γωνία. */
    var cx = camNow.x + camNow.w / 2, cy = camNow.y + camNow.h / 2;
    var tx = cx - (DESIGN.x + DESIGN.w / 2) * k;
    var ty = cy - (DESIGN.y + DESIGN.h / 2) * k;
    fxHost.setAttribute('transform', 'translate(' + tx + ',' + ty + ') scale(' + k + ')');
  } else {
    fxHost.removeAttribute('transform');
  }
}
function camLoop(now){
  requestAnimationFrame(camLoop);
  if (!camNow || !camTgt) return;
  var dt = Math.min(64, now - (camLast || now)); camLast = now;
  /* Εκθετική προσέγγιση: ανεξάρτητη από ρυθμό καρέ, ποτέ απότομη. */
  var a = 1 - Math.pow(0.0016, dt / 1000);
  camNow.x += (camTgt.x - camNow.x) * a;
  camNow.y += (camTgt.y - camNow.y) * a;
  camNow.w += (camTgt.w - camNow.w) * a;
  camNow.h += (camTgt.h - camNow.h) * a;
  applyCam();
}

/* Κόβει το κομμάτι του χάρτη από την υπόλοιπη σκηνή.
   ⚠️ Στηρίζεται στο ότι η mapSVG ΔΕΝ περιέχει ένθετο <g> — δηλωμένο εκεί. */
function splitMap(svg){
  var i = svg.indexOf('<g class="mapg">');
  if (i < 0) return { map: null, fx: svg };
  var j = svg.indexOf('</g>', i);
  return { map: svg.slice(i, j + 4), fx: svg.slice(0, i) + svg.slice(j + 4) };
}

function showScene(i){
  var sc = scenes[i];
  sceneT0 = performance.now(); sceneDur = sc.dur || 4;   /* για την αναπνοή του κάδρου */
  CUR_DUR = sc.dur || 4;   /* ⭐ οι σκηνές το διαβάζουν για να χωρέσουν μέσα του */
  var out = SCENES[sc.id] ? SCENES[sc.id]() : null;

  /* ⚠️ Μια σκηνή που λείπει το ΛΕΕΙ. Ποτέ άδειο κάδρο. */
  if (out == null){
    curIsMap = false; camTgt = designCam(); if (!camNow) camNow = designCam();
    mapHost.innerHTML = '';
    fxHost.innerHTML = '<rect x="-200" y="-40" width="1420" height="850" fill="var(--parch)"/>' +
      '<text class="lbl" x="500" y="380" text-anchor="middle" font-size="34">ΛΕΙΠΕΙ Η ΣΚΗΝΗ ' + sc.id + '</text>';
    applyCam(); return;
  }
  if (typeof out === 'string') out = { svg: out };

  var parts = splitMap(out.svg);
  var wantCam = out.camTo || out.cam || (parts.map ? null : designCam());
  curIsMap = !!parts.map;

  if (!camNow) camNow = wantCam ? { x:wantCam.x, y:wantCam.y, w:wantCam.w, h:wantCam.h } : designCam();
  if (wantCam) camTgt = wantCam;

  /* ⭐⭐ ΤΟ ΚΑΡΔΙΑΚΟ ΣΗΜΕΙΟ: αν ο χάρτης είναι ΙΔΙΟΣ, δεν τον αγγίζουμε.
     Καμία επανασχεδίαση, κανένα τρεμόπαιγμα — ο χάρτης απλώς συνεχίζει. */
  if (parts.map !== curMap){
    mapHost.innerHTML = parts.map || '';
    curMap = parts.map || '';
  }
  mapHost.style.opacity = parts.map ? 1 : 0;

  /* Οι επικαλύψεις εναλλάσσονται απαλά — ποτέ σκληρό κόψιμο. */
  fxHost.style.opacity = 0;
  fxHost.innerHTML = parts.fx;
  applyCam();
  requestAnimationFrame(function(){ fxHost.style.opacity = 1; });

  scheduleSFX(parts.fx);
  if (AC && !muted) sfxWhoosh();
}

function show(i){
  if (i === idx) return;
  idx = i;
  showScene(i);
  $cap.textContent = scenes[i].text;
}

function playFrom(i){
  if (i >= scenes.length){ stop(true); return; }
  show(i);
  var a = audios[i];
  a.currentTime = 0;
  var p = a.play();
  if (p && p.catch) p.catch(function(){});
  a.onended = function(){ if (playing) playFrom(i + 1); };
}

function meter(){
  requestAnimationFrame(meter);
  if (!playing || !audios[idx]) return;
  var el = scenes[idx].start + (audios[idx].currentTime || 0);
  $fill.style.width = (el / total * 100) + '%';
  $time.textContent = fmt(el) + ' / ' + fmt(total);
}

function start(){
  audioInit();
  if (AC && AC.state === 'suspended') AC.resume();
  $poster.classList.add('gone');
  playing = true;
  $ppI.setAttribute('d', ICON_PAUSE);
  playFrom(idx < 0 ? 0 : idx);
}
function pause(){
  playing = false;
  $ppI.setAttribute('d', ICON_PLAY);
  if (audios[idx]) audios[idx].pause();
  sfxTimers.forEach(clearTimeout); sfxTimers = [];
  if (bed) bed.gain.setTargetAtTime(.08, AC.currentTime, .3);
}
function stop(ended){
  pause();
  if (ended){ $fill.style.width = '100%'; $time.textContent = fmt(total) + ' / ' + fmt(total); idx = -1; }
}
function jump(i){
  i = Math.max(0, Math.min(scenes.length - 1, i));
  if (audios[idx]) audios[idx].pause();
  if (playing) playFrom(i);
  else { show(i); $fill.style.width = (scenes[i].start / total * 100) + '%'; $time.textContent = fmt(scenes[i].start) + ' / ' + fmt(total); }
}

$poster.onclick = start;
$pp.onclick = function(){ if (playing) pause(); else { if (bed && AC) bed.gain.setTargetAtTime(.34, AC.currentTime, .5); start(); } };
document.getElementById('back').onclick = function(){ jump(idx - 1); };
document.getElementById('fwd').onclick  = function(){ jump(idx + 1); };
document.getElementById('cc').onclick   = function(){ capsOn = !capsOn; $frame.classList.toggle('nocap', !capsOn); };
document.getElementById('mute').onclick = function(){ audioInit(); setMuted(!muted); };
document.getElementById('fs').onclick   = function(){
  if (document.fullscreenElement) document.exitFullscreen();
  else if ($frame.requestFullscreen) $frame.requestFullscreen();
};
document.getElementById('track').onclick = function(e){
  var r = this.getBoundingClientRect(), t = (e.clientX - r.left) / r.width * total, i = 0;
  for (var k = 0; k < scenes.length; k++) if (scenes[k].start <= t) i = k;
  jump(i);
};
document.addEventListener('keydown', function(e){
  if (e.code === 'Space'){ e.preventDefault(); playing ? pause() : start(); }
  if (e.code === 'ArrowRight') jump(idx + 1);
  if (e.code === 'ArrowLeft')  jump(idx - 1);
  if (e.code === 'KeyM'){ audioInit(); setMuted(!muted); }
});

/* ⚠️ Σταθερή αρχή 10: μια αποτυχία φόρτωσης ΔΕΝ μοιάζει με άδειο βίντεο. */
fetch(MANIFEST_URL)
  .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(function(list){
    var t = 0;
    scenes = list.map(function(s){ var o = { id: s.id, text: s.text, dur: s.dur, start: t }; t += s.dur; return o; });
    total = t;
    buildStage();
    scenes.forEach(function(sc){
      var a = new Audio(AUDIO_DIR + sc.id + '.m4a'); a.preload = 'auto'; audios.push(a);
      var tk = document.createElement('i'); tk.style.left = (sc.start / total * 100) + '%'; $ticks.appendChild(tk);
    });
    $time.textContent = '0:00 / ' + fmt(total);
    show(0);
  })
  .catch(function(err){
    $poster.innerHTML = '<div style="max-width:620px">' +
      '<div class="k" style="color:#E08C7A">ΔΕΝ ΦΟΡΤΩΣΕ Ο ΗΧΟΣ</div>' +
      '<div class="t" style="font-size:26px">' + String(err.message) + '</div>' +
      '<div class="s">Λείπει το <code>' + MANIFEST_URL + '</code>. Άνοιξέ το μέσα από τοπικό server:<br>' +
      '<code style="color:#DFA845">python3 -m http.server 8080</code></div></div>';
    $poster.onclick = null; $poster.style.cursor = 'default';
  });

requestAnimationFrame(camLoop);
requestAnimationFrame(meter);

</script>
</body>
</html>
