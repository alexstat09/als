<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Library · MÉTRON</title>
  <meta name="theme-color" content="#050506">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="aurora.css">
  <script src="water.js"></script>
  <script src="topbar.js" defer></script>
  <script src="als-dialog.js" defer></script>
  <!-- ⚠️ page-motion.js is deliberately NOT loaded here, unlike the other inner
       pages. It hides content behind `transform: translateY(18px)` until it
       scrolls into view, and this page is a three-pane app shell rather than a
       scrolling story: a shelf rail that reveals itself on scroll is wrong, and
       a transformed ancestor is exactly what breaks `position:fixed` children
       (hard constraint 4). Counting numbers use this page's own countTo(). -->
  <style>
    /* ════════════════════════════════════════════════════════════════
       THE LIBRARY — everything Alex keeps, in two worlds.

       Laptop-first ON PURPOSE. His words: "I will mostly use it at my
       laptop… it's literally just one scroll and unorganised." The old page
       was a 600px column of stacked cards, which is a phone page shown on a
       15-inch screen. This is a three-pane library:

         [ shelves ][ the wall ][ the one you're looking at ]

       The rail and the detail pane are `position: sticky`, not fixed — the
       page scrolls normally underneath the topbar and the bottom nav, and
       nothing has to fight either of them.

       Each world carries its own accent, all three drawn from the aurora
       palette so the page still belongs to MÉTRON: YouTube emerald-green,
       TikTok teal, Habits violet.
       ════════════════════════════════════════════════════════════════ */
    :root{ --gr:168,214,110; --acc:168,214,110; }
    *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html,body{ min-height:100%; }
    body{ background:var(--au-void,#050506); color:var(--au-ivory); font-family:var(--au-sans);
          padding:0 0 calc(86px + env(safe-area-inset-bottom)); }
    ::selection{ background:rgba(var(--acc),.24); }
    button,input,textarea{ font:inherit; color:inherit; }
    button{ background:none; border:none; cursor:pointer; }
    a{ color:inherit; }

    .lb{ max-width:1560px; margin:0 auto; padding:0 clamp(14px,2.4vw,36px); }

    /* ── masthead ─────────────────────────────────────────────── */
    .lb-top{ display:flex; align-items:flex-end; justify-content:space-between; gap:32px;
             padding:26px 2px 20px; flex-wrap:wrap; }
    .lb-eyebrow{ font-family:var(--au-mono); font-size:9.5px; letter-spacing:.24em; text-transform:uppercase;
                 color:rgba(var(--acc),.72); transition:color .5s var(--au-ease); }
    .lb-title{ font-family:var(--au-serif); font-weight:400; font-size:clamp(30px,3.4vw,46px);
               line-height:1.02; letter-spacing:-.015em; margin-top:9px; }
    .lb-title em{ font-style:italic; color:rgba(var(--acc),.94); transition:color .5s var(--au-ease); }
    .lb-sub{ font-size:12.5px; color:var(--au-dim); margin-top:10px; letter-spacing:.005em; }

    .lb-metrics{ display:flex; gap:clamp(16px,2vw,34px); align-items:flex-end; padding-bottom:4px; }
    .lb-met{ text-align:right; }
    .lb-met b{ display:block; font-family:var(--au-serif); font-size:clamp(24px,2.5vw,34px); font-weight:400;
               line-height:1; letter-spacing:-.01em; }
    .lb-met span{ display:block; font-family:var(--au-mono); font-size:8.5px; letter-spacing:.18em;
                  text-transform:uppercase; color:var(--au-faint); margin-top:7px; }

    /* ── the world switch ─────────────────────────────────────── */
    .lb-bar{ display:flex; align-items:center; gap:18px; flex-wrap:wrap;
             padding:0 2px 16px; border-bottom:1px solid var(--au-line); }
    /* The three segments are deliberately EQUAL width, so the travelling pill
       animates `transform` alone. Animating its width instead would relayout
       on every frame — the same rule the weight page's range selector follows. */
    .lb-worlds{ position:relative; display:flex; padding:3px;
                background:var(--au-glass); border:1px solid var(--au-line); border-radius:12px; }
    .lb-worlds .ink{ position:absolute; top:3px; left:3px; width:calc((100% - 6px)/3); height:calc(100% - 6px); border-radius:9px;
                     background:rgba(var(--acc),.13); border:1px solid rgba(var(--acc),.3);
                     transition:transform .42s var(--au-ease), background .42s var(--au-ease), border-color .42s var(--au-ease);
                     pointer-events:none; }
    .lb-w{ position:relative; flex:1 1 0; min-width:104px; display:flex; align-items:center; justify-content:center;
           gap:8px; padding:8px 15px; border-radius:9px;
           font-size:12.5px; letter-spacing:.01em; color:var(--au-dim); transition:color .3s var(--au-ease); white-space:nowrap; }
    .lb-w:hover{ color:var(--au-ivory); }
    .lb-w.on{ color:var(--au-ivory); }
    .lb-w .n{ font-family:var(--au-mono); font-size:10px; color:var(--au-faint); }
    .lb-w.on .n{ color:rgba(var(--acc),.9); }

    .lb-seek{ position:relative; flex:1; min-width:190px; max-width:420px; }
    .lb-seek input{ width:100%; background:var(--au-glass); border:1px solid var(--au-line);
                    border-radius:11px; padding:10px 34px 10px 34px; font-size:12.5px; outline:none;
                    transition:border-color .3s var(--au-ease), background .3s var(--au-ease); }
    .lb-seek input:focus{ border-color:rgba(var(--acc),.4); background:var(--au-glass-2); }
    .lb-seek input::placeholder{ color:var(--au-faint); }
    .lb-seek .ic{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--au-faint); font-size:12px; pointer-events:none; }
    .lb-seek .kb{ position:absolute; right:11px; top:50%; transform:translateY(-50%); font-family:var(--au-mono);
                  font-size:9px; color:var(--au-faint); border:1px solid var(--au-line-2); border-radius:4px; padding:1px 5px; }
    .lb-seek .clr{ position:absolute; right:8px; top:50%; transform:translateY(-50%); color:var(--au-dim); font-size:13px; padding:4px 6px; }
    .lb-status{ display:flex; align-items:center; gap:8px; flex-wrap:wrap;
                font-family:var(--au-mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
                color:var(--au-faint); min-height:12px; }
    .lb-status .s-t{ color:var(--au-faint); }
    .lb-status .s-t.live{ color:rgba(var(--acc),.85); }
    .lb-status .s-b{ font-family:var(--au-mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase;
                     padding:4px 9px; border-radius:7px; border:1px solid var(--au-line-2); color:var(--au-dim);
                     transition:border-color .24s var(--au-ease), color .24s var(--au-ease), background .24s var(--au-ease); }
    .lb-status .s-b:hover{ border-color:rgba(var(--acc),.45); color:var(--au-ivory); background:var(--au-glass); }
    .lb-status .s-b.warn:hover{ border-color:rgba(255,107,139,.5); color:var(--au-rose); }
    /* The idle TikTok poster is a link out, not a player — see stageHTML(). */
    .pane-stage .over .watch{ font-family:var(--au-mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
                              font-weight:400; padding:9px 14px; border-radius:9px; color:var(--au-ivory);
                              background:rgba(8,8,10,.62); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.18);
                              transition:background .24s var(--au-ease), border-color .24s var(--au-ease); }
    .pane-stage:hover .over .watch{ background:rgba(var(--acc),.24); border-color:rgba(var(--acc),.5); }

    /* ── the three panes ──────────────────────────────────────── */
    .lb-body{ display:grid; grid-template-columns:214px minmax(0,1fr) 384px; gap:clamp(18px,2vw,34px); padding:22px 0 40px; align-items:start; }
    .lb-rail{ position:sticky; top:74px; }
    .lb-side{ position:sticky; top:74px; }

    /* ── rail ─────────────────────────────────────────────────── */
    .rl-h{ font-family:var(--au-mono); font-size:8.5px; letter-spacing:.2em; text-transform:uppercase;
           color:var(--au-faint); margin:0 0 10px 10px; }
    .rl-h:not(:first-child){ margin-top:24px; }
    .rl-b{ display:flex; width:100%; align-items:center; gap:9px; padding:8px 10px; border-radius:9px;
           font-size:12.5px; color:var(--au-dim); text-align:left; letter-spacing:.005em;
           transition:background .22s var(--au-ease), color .22s var(--au-ease); }
    .rl-b:hover{ background:var(--au-glass); color:var(--au-ivory); }
    .rl-b.on{ background:rgba(var(--acc),.1); color:var(--au-ivory); }
    .rl-b .dot{ width:5px; height:5px; border-radius:50%; background:var(--au-faint); flex:none; transition:background .22s var(--au-ease); }
    .rl-b.on .dot{ background:rgb(var(--acc)); box-shadow:0 0 8px rgba(var(--acc),.6); }
    .rl-b .lab{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .rl-b .n{ font-family:var(--au-mono); font-size:10px; color:var(--au-faint); }
    .rl-b.on .n{ color:rgba(var(--acc),.85); }

    /* ── the wall ─────────────────────────────────────────────── */
    .wall{ display:grid; gap:clamp(12px,1.3vw,18px); }
    .wall.yt{ grid-template-columns:repeat(auto-fill,minmax(228px,1fr)); }
    .wall.tt{ grid-template-columns:repeat(auto-fill,minmax(152px,1fr)); }

    .tile{ position:relative; border-radius:13px; overflow:hidden; background:var(--au-glass);
           border:1px solid var(--au-line); cursor:pointer; text-align:left; width:100%;
           transition:border-color .3s var(--au-ease), transform .3s var(--au-ease), background .3s var(--au-ease); }
    .tile:hover{ border-color:rgba(var(--acc),.32); transform:translateY(-3px); background:var(--au-glass-2); }
    .tile.sel{ border-color:rgba(var(--acc),.62); }
    .tile.sel::after{ content:''; position:absolute; inset:0; border-radius:13px; pointer-events:none;
                      box-shadow:0 0 0 1px rgba(var(--acc),.45), 0 14px 40px -14px rgba(var(--acc),.5); }
    .tile .ph{ position:relative; display:block; width:100%; background:#0c0c0e; overflow:hidden; }
    .wall.yt .tile .ph{ aspect-ratio:16/9; }
    .wall.tt .tile .ph{ aspect-ratio:9/16; }
    .tile .ph img{ width:100%; height:100%; object-fit:cover; display:block;
                   transition:transform .6s var(--au-ease), opacity .4s var(--au-ease); }
    .tile:hover .ph img{ transform:scale(1.045); }
    .tile.done .ph img{ opacity:.4; filter:saturate(.5); }
    .tile .scrim{ position:absolute; inset:0; pointer-events:none;
                  background:linear-gradient(to top, rgba(4,4,5,.94) 0%, rgba(4,4,5,.62) 26%, rgba(4,4,5,0) 58%); }
    .tile .cap{ position:absolute; left:0; right:0; bottom:0; padding:10px 11px; }
    .tile .t{ font-size:12px; line-height:1.32; letter-spacing:.005em; color:var(--au-ivory);
              display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .tile .m{ font-family:var(--au-mono); font-size:8.5px; letter-spacing:.1em; color:rgba(245,242,236,.5);
              margin-top:5px; text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tile .badge{ position:absolute; top:8px; left:8px; font-family:var(--au-mono); font-size:8px; letter-spacing:.14em;
                  text-transform:uppercase; padding:3px 6px; border-radius:5px; backdrop-filter:blur(8px);
                  background:rgba(8,8,10,.66); border:1px solid var(--au-line-2); color:var(--au-dim); }
    .tile .badge.lesson{ color:rgb(var(--acc)); border-color:rgba(var(--acc),.4); background:rgba(var(--acc),.14); }
    .tile .badge.reading{ color:var(--au-faint); }
    .tile .badge.miss{ color:var(--au-coral); border-color:rgba(255,138,107,.35); }
    .tile .star{ position:absolute; top:6px; right:6px; padding:4px 6px; font-size:12px; line-height:1;
                 color:rgba(245,242,236,.34); text-shadow:0 1px 6px rgba(0,0,0,.7);
                 transition:color .25s var(--au-ease), transform .25s var(--au-ease); }
    .tile .star:hover{ color:var(--au-ivory); transform:scale(1.16); }
    .tile .star.on{ color:var(--au-amber); }
    .tile .dur{ position:absolute; right:7px; bottom:auto; top:8px; }
    .tile .play{ position:absolute; inset:0; display:grid; place-items:center; opacity:0; transition:opacity .3s var(--au-ease); }
    .tile:hover .play{ opacity:1; }
    .tile .play span{ width:42px; height:42px; border-radius:50%; display:grid; place-items:center;
                      background:rgba(8,8,10,.6); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.16);
                      font-size:12px; padding-left:3px; }
    .tile .core{ font-size:11px; line-height:1.4; color:rgba(245,242,236,.68); margin-top:6px;
                 display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

    /* ── the detail pane ──────────────────────────────────────── */
    .pane{ border:1px solid var(--au-line); border-radius:16px; background:var(--au-glass);
           overflow:hidden; max-height:calc(100vh - 96px); overflow-y:auto; overscroll-behavior:contain; }
    .pane::-webkit-scrollbar{ width:7px; } .pane::-webkit-scrollbar-thumb{ background:var(--au-line-2); border-radius:4px; }
    .pane-stage{ position:relative; display:block; width:100%; background:#08080a; text-decoration:none; }
    .pane-stage iframe{ width:100%; height:100%; border:0; display:block; position:absolute; inset:0; }
    .pane-stage.yt{ aspect-ratio:16/9; }
    .pane-stage.tt{ aspect-ratio:9/16; max-height:52vh; }
    /* ⚠️ A 9:16 poster at full width pushed every key point below the fold —
       the pane's whole job is the takeaways, not the artwork. Idle, a TikTok
       shows a cropped banner; it only claims the height once it is playing. */
    .pane-stage.tt.idle{ aspect-ratio:16/10; max-height:190px; }
    .pane-stage img{ width:100%; height:100%; object-fit:cover; display:block; }
    .pane-stage .over{ position:absolute; inset:0; display:grid; place-items:center;
                       background:linear-gradient(to top, rgba(4,4,5,.8), rgba(4,4,5,.15)); }
    .pane-stage .over span{ width:52px; height:52px; border-radius:50%; display:grid; place-items:center;
                            background:rgba(8,8,10,.62); backdrop-filter:blur(10px);
                            border:1px solid rgba(255,255,255,.18); font-size:14px; padding-left:3px; }
    .pane-in{ padding:16px 17px 20px; }
    .pane-kind{ display:inline-flex; align-items:center; gap:7px; font-family:var(--au-mono); font-size:8.5px;
                letter-spacing:.18em; text-transform:uppercase; padding:4px 8px; border-radius:6px;
                border:1px solid var(--au-line-2); color:var(--au-dim); }
    .pane-kind.lesson{ color:rgb(var(--acc)); border-color:rgba(var(--acc),.4); background:rgba(var(--acc),.1); }
    .pane-t{ font-size:14px; line-height:1.4; margin-top:11px; letter-spacing:.005em; }
    .pane-m{ font-family:var(--au-mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase;
             color:var(--au-faint); margin-top:8px; }
    .pane-core{ font-family:var(--au-serif); font-size:19px; line-height:1.34; letter-spacing:-.005em;
                margin-top:16px; padding-left:13px; border-left:2px solid rgba(var(--acc),.5); }
    .pane-keys{ list-style:none; margin-top:16px; display:flex; flex-direction:column; gap:10px; }
    .pane-keys li{ position:relative; padding-left:17px; font-size:12.5px; line-height:1.52; color:rgba(245,242,236,.84); }
    .pane-keys li::before{ content:''; position:absolute; left:2px; top:8px; width:4px; height:4px;
                           border-radius:50%; background:rgba(var(--acc),.7); }
    .pane-do{ margin-top:16px; padding:12px 13px; border-radius:11px; background:rgba(var(--acc),.07);
              border:1px solid rgba(var(--acc),.2); font-size:12.5px; line-height:1.5; }
    .pane-do b{ display:block; font-family:var(--au-mono); font-size:8.5px; letter-spacing:.18em;
                text-transform:uppercase; color:rgba(var(--acc),.9); margin-bottom:6px; font-weight:400; }
    .pane-src{ margin-top:16px; font-size:11px; line-height:1.5; color:var(--au-faint);
               padding-top:13px; border-top:1px solid var(--au-line); }
    .pane-acts{ display:flex; flex-wrap:wrap; gap:7px; margin-top:15px; }
    .pane-note{ margin-top:14px; }
    .pane-note textarea{ width:100%; min-height:74px; resize:vertical; background:var(--au-glass);
                         border:1px solid var(--au-line); border-radius:10px; padding:10px 11px;
                         font-size:12.5px; line-height:1.5; outline:none; }
    .pane-note textarea:focus{ border-color:rgba(var(--acc),.4); }
    .pane-empty{ padding:26px 18px; text-align:center; font-size:12.5px; color:var(--au-faint); line-height:1.6; }

    details.tx{ margin-top:14px; }
    details.tx > summary{ cursor:pointer; list-style:none; font-family:var(--au-mono); font-size:9px;
                          letter-spacing:.16em; text-transform:uppercase; color:var(--au-dim); padding:8px 0; }
    details.tx > summary::-webkit-details-marker{ display:none; }
    details.tx > summary:hover{ color:var(--au-ivory); }
    details.tx .body{ font-size:12px; line-height:1.72; color:var(--au-dim); max-height:270px; overflow-y:auto;
                      padding:11px 12px; background:rgba(0,0,0,.28); border-radius:10px; border:1px solid var(--au-line); }

    /* ── buttons ──────────────────────────────────────────────── */
    .b{ padding:7px 12px; border-radius:9px; border:1px solid var(--au-line-2); font-size:11.5px;
        color:var(--au-dim); letter-spacing:.01em; transition:all .24s var(--au-ease); }
    .b:hover{ border-color:rgba(var(--acc),.4); color:var(--au-ivory); background:var(--au-glass); }
    .b.on{ border-color:rgba(var(--acc),.5); color:rgb(var(--acc)); background:rgba(var(--acc),.1); }
    .b.prime{ background:rgba(var(--acc),.15); border-color:rgba(var(--acc),.42); color:var(--au-ivory); }
    .b.prime:hover{ background:rgba(var(--acc),.24); }
    .b.warn:hover{ border-color:rgba(255,107,139,.5); color:var(--au-rose); }
    .b[disabled]{ opacity:.45; pointer-events:none; }

    /* ── ingest ───────────────────────────────────────────────── */
    .ing{ border:1px solid var(--au-line); border-radius:14px; background:var(--au-glass);
          padding:14px 15px; margin-bottom:clamp(14px,1.6vw,20px); }
    .ing h3{ font-family:var(--au-serif); font-weight:400; font-size:17px; letter-spacing:-.005em; }
    .ing p{ font-size:11.5px; color:var(--au-faint); margin-top:5px; line-height:1.55; }
    .ing textarea, .ing input{ width:100%; background:rgba(0,0,0,.3); border:1px solid var(--au-line);
                               border-radius:10px; padding:10px 12px; font-size:12.5px; outline:none;
                               margin-top:11px; line-height:1.5; }
    .ing textarea{ min-height:78px; resize:vertical; font-family:var(--au-mono); font-size:11px; }
    .ing textarea:focus,.ing input:focus{ border-color:rgba(var(--acc),.4); }
    .ing-row{ display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap; }
    .ing-msg{ font-size:11.5px; color:var(--au-dim); line-height:1.5; }
    .ing-msg.bad{ color:var(--au-coral); }
    .ing-fold{ display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; }
    .ing-fold .chev{ color:var(--au-faint); font-size:11px; transition:transform .3s var(--au-ease); }
    .ing.open .ing-fold .chev{ transform:rotate(180deg); }
    .ing-hide{ display:none; } .ing.open .ing-hide{ display:block; }

    /* ── habits ───────────────────────────────────────────────── */
    .hb{ display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:14px; }
    .hb-c{ border:1px solid var(--au-line); border-radius:14px; background:var(--au-glass); padding:15px 16px;
           display:flex; gap:12px; align-items:flex-start; transition:border-color .3s var(--au-ease); }
    .hb-c:hover{ border-color:rgba(var(--acc),.28); }
    .hb-c.done{ opacity:.62; }
    .hb-ck{ width:19px; height:19px; border-radius:6px; border:1.5px solid var(--au-line-2); flex:none;
            display:grid; place-items:center; font-size:10px; color:#07110b; margin-top:1px;
            transition:all .25s var(--au-ease); cursor:pointer; }
    .hb-ck.on{ background:rgb(var(--acc)); border-color:rgb(var(--acc)); }
    .hb-t{ font-size:13px; line-height:1.4; }
    .hb-c.done .hb-t{ text-decoration:line-through; text-decoration-color:var(--au-faint); }
    .hb-w{ font-size:11.5px; color:var(--au-faint); margin-top:6px; line-height:1.5; }
    .hb-x{ margin-left:auto; color:var(--au-faint); font-size:12px; padding:2px 5px; align-self:flex-start; }
    .hb-x:hover{ color:var(--au-rose); }

    /* ── the "now" pane (nothing selected) ────────────────────── */
    .now-h{ font-family:var(--au-mono); font-size:8.5px; letter-spacing:.2em; text-transform:uppercase;
            color:rgba(var(--acc),.8); }
    .now-big{ font-family:var(--au-serif); font-size:21px; line-height:1.24; margin-top:11px; letter-spacing:-.005em; }
    .now-sub{ font-size:11.5px; color:var(--au-faint); margin-top:8px; font-family:var(--au-mono);
              letter-spacing:.1em; text-transform:uppercase; }
    .now-sec{ padding:17px 18px; }
    .now-sec + .now-sec{ border-top:1px solid var(--au-line); }
    .now-bar{ height:2px; border-radius:2px; background:var(--au-line-2); overflow:hidden; margin-top:14px; }
    .now-bar i{ display:block; height:100%; width:100%; transform:scaleX(0); transform-origin:left center;
                background:linear-gradient(90deg,rgba(var(--acc),.5),rgb(var(--acc)));
                transition:transform 1.1s var(--au-ease); }

    /* Only ever visible on the narrow layout, where the detail pane is a sheet.
       Declared here too so a class JS toggles is never a class CSS lacks. */
    .lb-scrim{ display:none; }
    .empty{ padding:46px 20px; text-align:center; color:var(--au-faint); font-size:12.5px; line-height:1.7; }
    .empty b{ display:block; font-family:var(--au-serif); font-size:20px; color:var(--au-dim);
              font-weight:400; margin-bottom:10px; }
    .hidden{ display:none !important; }

    /* ── the reading pulse ────────────────────────────────────── */
    @keyframes lbPulse{ 0%,100%{opacity:.32;} 50%{opacity:.85;} }
    .pulse{ animation:lbPulse 1.9s ease-in-out infinite; }
    @media (prefers-reduced-motion:reduce){
      .pulse{ animation:none; }
      .tile,.tile .ph img{ transition:none !important; }
      .tile:hover{ transform:none; }
    }

    /* ── narrower laptops, tablets, phone ─────────────────────── */
    @media (max-width:1280px){
      .lb-body{ grid-template-columns:190px minmax(0,1fr) 330px; }
    }
    @media (max-width:1040px){
      /* The detail pane stops being a column and becomes a sheet over the
         wall. It is a direct child of <body>, never of a transformed
         ancestor — hard constraint 4. */
      .lb-body{ grid-template-columns:180px minmax(0,1fr); }
      .lb-side{ position:fixed; z-index:60; right:0; top:0; bottom:0; width:min(420px,92vw);
                padding:14px; overflow-y:auto; background:rgba(6,6,8,.96); backdrop-filter:blur(22px);
                border-left:1px solid var(--au-line-2); transform:translateX(102%);
                transition:transform .42s var(--au-ease); }
      .lb-side.open{ transform:none; }
      .pane{ max-height:none; border:none; background:none; }
      .lb-scrim{ display:block; position:fixed; inset:0; z-index:59; background:rgba(2,2,3,.6); backdrop-filter:blur(3px);
                 opacity:0; pointer-events:none; transition:opacity .35s var(--au-ease); }
      .lb-scrim.on{ opacity:1; pointer-events:auto; }
    }
    @media (max-width:760px){
      .lb-body{ grid-template-columns:minmax(0,1fr); gap:14px; }
      /* The shelves become a scrolling chip row above the wall. */
      .lb-rail{ position:static; display:flex; gap:7px; overflow-x:auto; padding-bottom:4px;
                scrollbar-width:none; }
      .lb-rail::-webkit-scrollbar{ display:none; }
      .rl-h{ display:none; }
      .rl-b{ width:auto; flex:none; border:1px solid var(--au-line); border-radius:999px; padding:7px 13px; }
      .rl-b .dot{ display:none; }
      .lb-top{ padding:18px 2px 14px; }
      .lb-metrics{ gap:20px; }
      .wall.tt{ grid-template-columns:repeat(auto-fill,minmax(126px,1fr)); }
      .wall.yt{ grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); }
      .lb-seek{ max-width:none; }
      .lb-seek .kb{ display:none; }
    }
  </style>
</head>
<body class="au-bg">
  <div class="lb">
    <header class="lb-top">
      <div class="lb-id">
        <div class="lb-eyebrow" id="lbEyebrow">MÉTRON · LIBRARY</div>
        <h1 class="lb-title">Everything worth <em id="lbTitleEm">keeping</em></h1>
        <p class="lb-sub" id="lbSub">A queue of things worth learning, the TikToks you saved, and the habits you're growing into.</p>
      </div>
      <div class="lb-metrics" id="lbMetrics"></div>
    </header>

    <div class="lb-bar">
      <nav class="lb-worlds" id="lbWorlds" role="tablist">
        <div class="ink" id="lbInk"></div>
        <button type="button" class="lb-w on" data-world="yt" role="tab">YouTube <span class="n" id="nYt">0</span></button>
        <button type="button" class="lb-w" data-world="tt" role="tab">TikTok <span class="n" id="nTt">0</span></button>
        <button type="button" class="lb-w" data-world="hb" role="tab">Habits <span class="n" id="nHb">0</span></button>
      </nav>
      <div class="lb-seek">
        <span class="ic">⌕</span>
        <input id="seek" type="search" placeholder="Search titles, creators, key points…" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Search the library">
        <span class="kb" id="seekKb">/</span>
        <button type="button" class="clr hidden" id="seekClr" aria-label="Clear search">✕</button>
      </div>
      <div class="lb-status" id="status"></div>
    </div>

    <div class="lb-body">
      <aside class="lb-rail" id="rail"></aside>
      <main class="lb-main" id="main">
        <!-- The ingest panel and the wall are separate containers ON PURPOSE.
             The background reader re-renders the wall every few seconds; if the
             paste box lived inside it, a sweep finishing would silently wipe
             fifty links he had just pasted. It is only rebuilt when the world
             changes. -->
        <div id="ingest"></div>
        <div id="wall"></div>
      </main>
      <aside class="lb-side" id="side"><div class="pane" id="pane"></div></aside>
    </div>
  </div>
  <div class="lb-scrim" id="scrim"></div>

  <script>
  (function(){
    'use strict';
    /* ════════════════════════════════════════════════════════════
       Two worlds, one shell. The YouTube half keeps every behaviour it
       had — playlist mirror, background reader, shelves, Sharpen,
       Remember — because a redesign that quietly drops features is a
       downgrade. The TikTok half is new, and honest about what it can
       and cannot know (see api/_tiktok.js).
       ════════════════════════════════════════════════════════════ */
    var K_VID='improve:videos', K_TT='improve:tiktoks', K_HAB='improve:habits', K_PROF='improve:profile';

    function $(id){ return document.getElementById(id); }
    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
    function loadArr(k){ var a; try{ a=JSON.parse(localStorage.getItem(k)); }catch(e){ a=null; } return Array.isArray(a)?a.filter(function(x){return x&&x.id;}):[]; }
    function loadObj(k){ var o; try{ o=JSON.parse(localStorage.getItem(k)); }catch(e){ o=null; } return (o&&typeof o==='object'&&!Array.isArray(o))?o:{}; }
    function persist(k,a){ try{ localStorage.setItem(k,JSON.stringify(a)); }catch(e){} }
    function flush(){ if(window.ALSSync&&window.ALSSync.flush) window.ALSSync.flush(); }
    function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

    function srcFromUrl(url){
      if(!url) return '';
      var u=String(url).trim(); if(!/^https?:\/\//i.test(u)) u='https://'+u;
      var host=''; try{ host=new URL(u).hostname.replace(/^www\./,''); }catch(e){ var m=String(url).match(/([a-z0-9-]+\.[a-z]{2,})/i); host=m?m[1]:''; }
      if(/youtube\.com|youtu\.be/i.test(host)) return 'YouTube';
      if(/tiktok\.com/i.test(host)) return 'TikTok';
      if(/vimeo\.com/i.test(host)) return 'Vimeo';
      if(/spotify\.com/i.test(host)) return 'Spotify';
      if(/podcasts\.apple/i.test(host)) return 'Apple Podcasts';
      if(/medium\.com/i.test(host)) return 'Medium';
      if(/twitter\.com|x\.com/i.test(host)) return 'X';
      if(/ted\.com/i.test(host)) return 'TED';
      if(!host) return '';
      var base=host.split('.')[0]; return base.charAt(0).toUpperCase()+base.slice(1);
    }
    function normUrl(url){ if(!url) return ''; var u=String(url).trim(); if(!/^https?:\/\//i.test(u)) u='https://'+u; return u; }

    var videos=loadArr(K_VID), tiktoks=loadArr(K_TT), habits=loadArr(K_HAB), profile=loadObj(K_PROF);

    /* view state */
    var world='yt', shelf='', state='todo', seek='', selId=null, noteOpen=false, noteDraft=null;

    /* Queue position lives in `ord`, never in `ts` — `ts` is the sync clock and
       every read bumps it, which would reshuffle the list under him. */
    function migrateOrd(arr,key){
      var miss=arr.filter(function(v){ return typeof v.ord!=='number'; });
      if(!miss.length) return;
      var base=arr.reduce(function(m,v){ return typeof v.ord==='number'&&v.ord>m?v.ord:m; },-1);
      miss.sort(function(a,b){ return (a.ts||0)-(b.ts||0); }).forEach(function(v){ v.ord=++base; });
      persist(key,arr);
    }
    migrateOrd(videos,K_VID); migrateOrd(tiktoks,K_TT);
    function nextOrd(arr){ return arr.reduce(function(m,v){ return typeof v.ord==='number'&&v.ord>=m?v.ord+1:m; },0); }
    function byOrd(a,b){ var x=typeof a.ord==='number'?a.ord:1e9, y=typeof b.ord==='number'?b.ord:1e9; return x!==y?x-y:(a.ts||0)-(b.ts||0); }

    /* Nova answers in plain text (KIND / TOPIC / CORE / KEY / DO) rather than
       JSON, because JSON is what shattered on long replies. Parse it
       forgivingly: a missing header or a stray bullet style must never cost
       him the notes. */
    function kpParse(raw){
      var o={kind:'',topic:'',core:'',keys:[],act:''};
      String(raw||'').split(/\r?\n/).forEach(function(ln){
        var s=ln.trim().replace(/\*\*/g,'').replace(/^#+\s*/,'').trim();
        if(!s) return;
        var m;
        if((m=s.match(/^KIND\s*[:\-–—]\s*(\w+)/i))){ o.kind=m[1].toLowerCase(); return; }
        if((m=s.match(/^TOPIC\s*[:\-–—]\s*(.+)$/i))){ o.topic=m[1].replace(/["'`*_.]/g,'').trim().slice(0,40); return; }
        if((m=s.match(/^CORE\s*[:\-–—]\s*(.+)$/i))){ o.core=m[1].trim(); return; }
        if((m=s.match(/^(?:DO|TRY|ACTION)\s*[:\-–—]\s*(.+)$/i))){ o.act=m[1].trim(); return; }
        // Longest label first — "KEY POINTS:" must not match as "KEY" + "POINTS:".
        if((m=s.match(/^(?:KEY POINTS?|KEY TAKEAWAYS?|TAKEAWAYS?|KEY|POINTS)\s*[:\-–—]?\s*(.*)$/i))){ if(m[1].trim()) o.keys.push(m[1].trim()); return; }
        if((m=s.match(/^[-•*–—▸]\s*(.+)$/))){ o.keys.push(m[1].trim()); return; }
        if((m=s.match(/^\d+[.)]\s+(.+)$/))){ o.keys.push(m[1].trim()); return; }
        if(!o.core&&!o.keys.length&&s.length>20) o.core=s;   // shape ignored — keep the words anyway
      });
      if(!o.core&&o.keys.length) o.core=o.keys.shift();
      return o;
    }
    function conceptOf(v){ return v.concept||v.rawTopic||v.topic||''; }
    function isLesson(v){ var k=v.kind||kpParse(v.keypoints||'').kind; return k? k==='lesson' : !!v.ytId; }

    /* ── which collection is on screen ────────────────────────── */
    function coll(){ return world==='tt'?tiktoks:videos; }
    function collKey(){ return world==='tt'?K_TT:K_VID; }
    function saveColl(){ persist(collKey(),coll()); flush(); }
    function byId(id){ return videos.find(function(x){return x.id===id;})||tiktoks.find(function(x){return x.id===id;})||null; }
    /* ⚠️ A TikTok that has not been fetched yet has an EMPTY ttId — it is
       created from a pasted URL and only learns its id from the server. So
       "is this a TikTok" can never be `!!v.ttId`, or a pending one would be
       written into the YouTube store and quietly disappear from its world. */
    function isTikTok(v){ return !!(v && (v.ttId || /tiktok\.com/i.test(v.url||'') || v.source==='TikTok')); }
    function saveItem(v){ if(isTikTok(v)) persist(K_TT,tiktoks); else persist(K_VID,videos); flush(); }

    var ACCENT={ yt:'168,214,110', tt:'104,214,204', hb:'155,140,255' };
    var TITLE={ yt:'watching', tt:'keeping', hb:'building' };

    /* ── titles + search text ─────────────────────────────────── */
    function titleOf(v){
      if(v.title) return v.title;
      if(v.ttId){
        var p=kpParse(v.keypoints||'');
        var cap=String(v.caption||'').replace(/#[^\s#]+/g,'').trim();
        return cap || p.core || (v.handle?('@'+v.handle):'Saved TikTok');
      }
      return '(untitled)';
    }
    function metaOf(v){
      var bits=[];
      if(v.ttId){ if(v.handle) bits.push('@'+v.handle); if(v.duration) bits.push(v.duration+'s'); }
      else { if(v.channel) bits.push(v.channel); else if(v.source) bits.push(v.source); }
      var c=conceptOf(v); if(c) bits.push(c);
      return bits.join(' · ');
    }
    function hay(v){
      return (titleOf(v)+' '+(v.channel||'')+' '+(v.handle||'')+' '+(v.author||'')+' '+(v.caption||'')+' '+
        ((v.tags||[]).join(' '))+' '+((v.screen||[]).join(' '))+' '+conceptOf(v)+' '+(v.keypoints||'')+' '+(v.note||v.notes||'')).toLowerCase();
    }
    function thumbOf(v){
      if(v.ttId) return v.cover||'';
      return v.thumb||(v.ytId?('https://i.ytimg.com/vi/'+v.ytId+'/hqdefault.jpg'):'');
    }

    /* ── the reader's controls ────────────────────────────────────
       Pasting a big list and then wanting OUT of it is a normal thing to do —
       Alex hit it within an hour ("i think i send too much, how do i stop the
       progress"). Before this, the only way to stop the reader was to close
       the tab, and the only way to undo a paste was to remove items one at a
       time. Both are first-class now.

       `paused` is DEVICE-LOCAL and deliberately not synced: it is about this
       tab right now, and pausing on the laptop must not stop his phone. It
       does survive a reload, or reopening the page would restart the flood he
       just stopped. */
    var K_PAUSE='improve:paused';
    var paused=(function(){ try{ return localStorage.getItem(K_PAUSE)==='1'; }catch(e){ return false; } })();
    function setPaused(p){
      paused=!!p;
      try{ p?localStorage.setItem(K_PAUSE,'1'):localStorage.removeItem(K_PAUSE); }catch(e){}
      renderStatus();
      if(!paused){ sweep(); ttSweep(); }
    }
    function unreadIn(arr){ return arr.filter(function(v){ return !v.keypoints; }); }

    var statusMsg='', statusLive=false;
    function status(m,live){ statusMsg=m||''; statusLive=!!live; renderStatus(); }
    function renderStatus(){
      var e=$('status'); if(!e) return;
      var unread=unreadIn(coll()).length, running=sweeping||ttSweeping;
      var h='';
      if(paused){
        h='<span class="s-t">Paused'+(unread?' · '+unread+' unread':'')+'</span>'+
          '<button type="button" class="s-b" data-resume="1">Resume</button>';
      } else if(running||statusMsg){
        h='<span class="s-t'+(statusLive?' live':'')+'">'+esc(statusMsg||'Reading')+'</span>'+
          (running?'<button type="button" class="s-b" data-pause="1">Stop</button>':'');
      }
      if(unread && world!=='hb'){
        h+='<button type="button" class="s-b warn" data-dropunread="1">Remove the '+unread+' unread</button>';
      }
      e.innerHTML=h;
      e.classList.toggle('live',statusLive&&!paused);
    }

    /* Removing a batch.
       ⚠️ This goes through the page's normal persist() ON PURPOSE. sync.js
       intercepts localStorage.setItem and diffs the old array against the new
       one to stamp DELETION TOMBSTONES; clearing the key by hand would leave
       none, and every removed video would sync straight back from the cloud
       the next time any device pulled. Never "clear" one of these stores
       outside this path. */
    function removeItems(gone){
      var kill={}; gone.forEach(function(v){ kill[v.id]=1; });
      if(world==='tt'){ tiktoks=tiktoks.filter(function(v){ return !kill[v.id]; }); persist(K_TT,tiktoks); }
      else { videos=videos.filter(function(v){ return !kill[v.id]; }); persist(K_VID,videos); }
      flush();
      if(selId&&kill[selId]) closePane();
      render();
    }
    async function ask(o){
      if(window.ALSConfirm) return await window.ALSConfirm(o);
      return confirm(o.title+'\n\n'+(o.message||''));
    }
    /* The undo for "I overdid it": drop what has not been read yet, and keep
       every one that has. Nothing that already earned its key points is touched. */
    async function dropUnread(){
      var arr=coll(), gone=unreadIn(arr);
      if(!gone.length) return;
      if(!await ask({ title:'Remove '+gone.length+' unread?',
          message:'The '+(arr.length-gone.length)+' already read stay exactly as they are. This only clears what has not been read yet.',
          confirmText:'Remove '+gone.length, danger:true })) return;
      removeItems(gone);
    }
    /* Start over — clear the whole world so a cleaner batch can go in. */
    async function dropAll(){
      var arr=coll().slice(); if(!arr.length) return;
      var read=arr.length-unreadIn(arr).length;
      if(!await ask({ title:'Remove all '+arr.length+' TikToks?',
          message:'This clears the whole TikTok wall'+(read?', including the '+read+' already read':'')+
                  ', on every device. It cannot be undone from here — the vault keeps a daily backup.',
          confirmText:'Remove all '+arr.length, danger:true })) return;
      removeItems(arr);
      // Nothing left to read, so a pause from the last batch would only be
      // confusing when the next one lands.
      if(paused) setPaused(false);
    }

    /* ════════════════════════════════════════════════════════════
       THE WALL
       ════════════════════════════════════════════════════════════ */
    function pool(){
      var q=seek.trim().toLowerCase();
      return coll().filter(function(v){ return !q || hay(v).indexOf(q)>=0; });
    }
    function stateOf(v){
      if(world==='tt') return v.star?'star':(isLesson(v)?'lesson':'keep');
      return v.watched?'done':'todo';
    }
    function scoped(){
      var p=pool();
      if(!state) return p;
      return p.filter(function(v){ return world==='tt' ? (state==='star'?!!v.star:stateOf(v)===state) : stateOf(v)===state; });
    }
    function shelved(list){ return shelf ? list.filter(function(v){ return (conceptOf(v)||'Unsorted')===shelf; }) : list; }

    function badgeFor(v){
      if(v.metaFail>=2) return '<span class="badge miss">unreadable</span>';
      if(v.pending) return '<span class="badge reading pulse">fetching</span>';
      if(v.keypoints) return isLesson(v)?'<span class="badge lesson">lesson</span>':'<span class="badge">keepsake</span>';
      if((v.kpFail||0)>=3) return '<span class="badge miss">retry</span>';
      return '<span class="badge reading pulse">reading</span>';
    }
    function tileHTML(v){
      var th=thumbOf(v), p=kpParse(v.keypoints||'');
      var title=titleOf(v);
      // A keepsake whose caption is only hashtags takes its NAME from the core
      // sentence, so printing the core underneath would say it twice.
      if(p.core && p.core.trim()===title.trim()) p={ core:'', keys:p.keys, act:p.act };
      return '<button type="button" class="tile'+(v.watched?' done':'')+(selId===v.id?' sel':'')+'" data-id="'+esc(v.id)+'">'+
        '<span class="ph">'+
          (th?'<img loading="lazy" src="'+esc(th)+'" alt="" data-cover="'+esc(v.id)+'">':'')+
          '<span class="scrim"></span>'+
          '<span class="play"><span>▶</span></span>'+
          badgeFor(v)+
          (world==='tt'?'<span class="star'+(v.star?' on':'')+'" data-star="'+esc(v.id)+'" role="button" aria-label="Star">★</span>':'')+
          '<span class="cap">'+
            '<span class="t">'+esc(title)+'</span>'+
            '<span class="m">'+esc(metaOf(v))+'</span>'+
            (p.core?'<span class="core">'+esc(p.core)+'</span>':'')+
          '</span>'+
        '</span></button>';
    }

    function sortedList(){
      return shelved(scoped()).sort(function(a,b){
        if(world!=='tt' && !!a.watched!==!!b.watched) return a.watched?1:-1;
        if(world==='tt' && !!a.star!==!!b.star) return a.star?-1:1;
        return byOrd(a,b);
      });
    }
    function renderWall(){
      if(world==='hb'){ renderHabits(); return; }
      var list=sortedList(), html;
      if(!coll().length){
        html='<div class="empty"><b>'+(world==='tt'?'No TikToks yet':'Nothing queued yet')+'</b>'+
          (world==='tt'
            ? 'Paste one link or your whole notes list above.<br>Everything else — the creator, what was said, what to take from it — is worked out for you.'
            : 'Mirror a YouTube playlist above, or add something by hand.')+'</div>';
      } else if(!list.length){
        html='<div class="empty"><b>Nothing here</b>'+(seek.trim()?('Nothing matches “'+esc(seek.trim())+'”.'):'This shelf is empty in the current view.')+'</div>';
      } else {
        html='<div class="wall '+world+'">'+list.map(tileHTML).join('')+'</div>';
      }
      $('wall').innerHTML=html;
    }

    /* ── the rail: shelves + states ───────────────────────────── */
    function railBtn(kind,val,label,n,on){
      return '<button type="button" class="rl-b'+(on?' on':'')+'" data-'+kind+'="'+esc(val)+'">'+
        '<span class="dot"></span><span class="lab">'+esc(label)+'</span><span class="n">'+n+'</span></button>';
    }
    function renderRail(){
      if(world==='hb'){ $('rail').innerHTML=''; return; }
      var p=pool(), h='';
      var states = world==='tt'
        ? [['','Everything',p.length],
           ['lesson','Lessons',p.filter(function(v){return v.keypoints&&isLesson(v);}).length],
           ['keep','Keepsakes',p.filter(function(v){return v.keypoints&&!isLesson(v);}).length],
           ['star','Starred',p.filter(function(v){return !!v.star;}).length]]
        : [['todo','To watch',p.filter(function(v){return !v.watched;}).length],
           ['done','Watched',p.filter(function(v){return !!v.watched;}).length],
           ['','Everything',p.length]];
      // Never strand him on an empty view.
      if(state && !states.some(function(s){ return s[0]===state && s[2]; })) state='';
      h+='<div class="rl-h">View</div>';
      states.forEach(function(s){ if(s[2]||!s[0]) h+=railBtn('st',s[0],s[1],s[2],state===s[0]); });

      var sc=scoped(), tc={};
      sc.forEach(function(v){ var c=conceptOf(v)||'Unsorted'; tc[c]=(tc[c]||0)+1; });
      var keys=Object.keys(tc).sort(function(a,b){ if(a==='Unsorted') return 1; if(b==='Unsorted') return -1; return tc[b]-tc[a]||a.localeCompare(b); });
      if(shelf&&keys.indexOf(shelf)<0) shelf='';
      if(keys.length>1){
        h+='<div class="rl-h">Shelves</div>';
        h+=railBtn('sh','','All shelves',sc.length,!shelf);
        keys.forEach(function(c){ h+=railBtn('sh',c,c,tc[c],shelf===c); });
      }
      $('rail').innerHTML=h;
    }

    /* ════════════════════════════════════════════════════════════
       THE DETAIL PANE — one component, both worlds.
       ════════════════════════════════════════════════════════════ */
    var playing=null;   // id of the item whose player is live

    /* Where the reading actually came from. The whole point of grading
       server-side is that this line can be TRUE — "no data" and "we couldn't
       read it" must never look the same. */
    var SRC={
      transcript:'Read from what is actually said in the video (TikTok’s own captions).',
      screen:'Read from the text shown on screen.',
      notes:'Read from your own notes.',
      caption:'From the caption only — there is no spoken audio to read.',
      thin:'Nothing was said and nothing was written, so this is a label, not a lesson. Add a line of your own below and it will be read properly.',
      none:'Nothing readable at all — no caption, no text on screen, no audio captions.'
    };
    function paneEmptyHTML(){
      var un=videos.filter(function(v){return !v.watched;});
      var nextV=un.slice().sort(byOrd)[0];
      var building=habits.filter(function(h){return !h.adopted;});
      var nextH=building.slice().sort(function(a,b){return (a.ts||0)-(b.ts||0);})[0];
      var rem=dueRemember();
      var h='';
      /* The pane belongs to the world you are standing in. A TikTok wall that
         reports "70% of the YouTube queue watched" is answering a question
         nobody asked from here. */
      if(world==='tt'){
        var lessons=tiktoks.filter(function(v){ return v.keypoints&&isLesson(v); });
        var newest=tiktoks.slice().sort(function(a,b){ return (b.ts||0)-(a.ts||0); })[0];
        if(tiktoks.length){
          h+='<div class="now-sec"><div class="now-h">What you’ve kept</div>'+
            '<div class="now-big">'+lessons.length+' of '+tiktoks.length+' carry something to take</div>'+
            '<div class="now-sub">The rest are kept for what they are</div>'+
            (newest?'<div class="pane-acts"><button type="button" class="b prime" data-open="'+esc(newest.id)+'">Open the latest</button></div>':'')+
          '</div>';
        }
      } else if(nextV||nextH){
        h+='<div class="now-sec">'+
          '<div class="now-h">Next up</div>'+
          '<div class="now-big">'+esc(nextV?titleOf(nextV):nextH.text)+'</div>'+
          '<div class="now-sub">'+esc(nextV?(metaOf(nextV)||'In your queue'):(nextH.why||'A habit you’re building'))+'</div>'+
          '<div class="pane-acts">'+
            (nextV?'<button type="button" class="b prime" data-open="'+esc(nextV.id)+'">Open it</button>':
                   '<a class="b prime" href="identity.html">Track it in Identity →</a>')+
          '</div></div>';
      }
      var totV=videos.length, pct=totV?Math.round(videos.filter(function(v){return v.watched;}).length/totV*100):0;
      if(totV&&world!=='tt'){
        h+='<div class="now-sec"><div class="now-h">Learning momentum</div>'+
           '<div class="now-sub" style="margin-top:9px">'+pct+'% of the queue watched</div>'+
           '<div class="now-bar"><i id="moFill"></i></div></div>';
      }
      if(rem){
        var rp=kpParse(rem.keypoints);
        h+='<div class="now-sec"><div class="now-h">Don’t let this fade</div>'+
          '<div class="now-big" style="font-size:17px">'+esc(titleOf(rem))+'</div>'+
          (rp.core?'<div style="font-size:12.5px;line-height:1.55;color:var(--au-dim);margin-top:10px">'+esc(rp.core)+'</div>':'')+
          (rp.keys.length?'<ul class="pane-keys">'+rp.keys.slice(0,3).map(function(k){return '<li>'+esc(k)+'</li>';}).join('')+'</ul>':'')+
          '<div class="pane-acts"><button type="button" class="b prime" data-remgot="'+esc(rem.id)+'">Still with me ✓</button>'+
          '<button type="button" class="b" data-open="'+esc(rem.id)+'">Rewatch</button></div></div>';
      }
      if(!h) h='<div class="pane-empty">Pick anything on the left and it opens here — the video, and the few things worth taking from it.</div>';
      return h;
    }

    /* ── the stage ────────────────────────────────────────────────
       YouTube plays inline, because youtube-nocookie's embed is a real
       player and it looks right.

       ⚠️ TIKTOK DOES NOT PLAY INLINE, ON PURPOSE. Its /embed/v2 iframe is a
       marketing surface, not a player: it forces a WHITE card into a black
       page, ships its own like/comment/share chrome, adds a "Watch now"
       upsell bar, repeats the caption in its own fonts, and still overflows
       a 9:16 box. It is cross-origin, so none of that can be styled away.
       These are videos he has ALREADY watched — the pane exists for what to
       take from them, and re-watching belongs in a real TikTok tab where the
       experience is native and good. A half-working player is worse than an
       honest link. Do not put the embed back. */
    function stageHTML(v){
      var th=thumbOf(v), tt=isTikTok(v), cls=tt?'tt':'yt';
      if(!tt && playing===v.id){
        var src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(v.ytId||'')+'?autoplay=1&rel=0';
        return '<div class="pane-stage '+cls+'"><iframe src="'+esc(src)+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="'+esc(titleOf(v))+'"></iframe></div>';
      }
      if(!th && !(v.ytId||v.ttId)) return '';
      var inner=(th?'<img src="'+esc(th)+'" alt="" data-cover="'+esc(v.id)+'">':'')+
        '<span class="over">'+(tt?'<b class="watch">Watch on TikTok ↗</b>':'<span>▶</span>')+'</span>';
      if(tt && v.url) return '<a class="pane-stage '+cls+' idle" href="'+esc(v.url)+'" target="_blank" rel="noopener">'+inner+'</a>';
      return '<div class="pane-stage '+cls+' idle" data-play="'+esc(v.id)+'" style="cursor:pointer">'+inner+'</div>';
    }

    function paneHTML(){
      if(!selId) return paneEmptyHTML();
      var v=byId(selId); if(!v) return paneEmptyHTML();
      var p=kpParse(v.keypoints||''), lesson=isLesson(v);
      var h=stageHTML(v);
      h+='<div class="pane-in">';
      h+='<span class="pane-kind'+(v.keypoints&&lesson?' lesson':'')+'">'+
         (v.pending?'Fetching…':(v.keypoints?(lesson?'Lesson':'Keepsake'):(v.metaFail>=2?'Unreadable':'Reading…')))+'</span>';
      h+='<div class="pane-t">'+esc(titleOf(v))+'</div>';
      var m=[]; if(v.ttId&&v.handle) m.push('@'+v.handle); if(v.channel) m.push(v.channel);
      if(v.duration) m.push(v.duration+'s'); if(v.created) m.push(new Date(v.created*1000).toLocaleDateString());
      if(conceptOf(v)) m.push(conceptOf(v));
      if(m.length) h+='<div class="pane-m">'+esc(m.join(' · '))+'</div>';

      if(v.err){ h+='<div class="pane-src" style="color:var(--au-coral);border-top:none;padding-top:12px">'+esc(v.err)+'</div>'; }

      if(p.core && p.core.trim()!==titleOf(v).trim()) h+='<div class="pane-core">'+esc(p.core)+'</div>';
      if(p.keys.length) h+='<ul class="pane-keys">'+p.keys.map(function(k){ return '<li>'+esc(k)+'</li>'; }).join('')+'</ul>';
      if(p.act&&lesson) h+='<div class="pane-do"><b>Try this</b>'+esc(p.act)+'</div>';
      if(!v.keypoints&&!v.pending&&!v.err) h+='<div class="pane-src pulse" style="border-top:none;padding-top:12px">Nova is reading this one…</div>';

      if(v.ttId&&(v.tags||[]).length) h+='<div class="pane-m" style="margin-top:14px">'+esc(v.tags.map(function(t){return '#'+t;}).join('  '))+'</div>';
      if(v.ttId&&v.music) h+='<div class="pane-m" style="margin-top:7px">♪ '+esc(v.music)+'</div>';

      /* his own line — the escape hatch for anything the machine can't read */
      h+='<div class="pane-note">'+
        (noteOpen
          ? '<textarea id="noteBox" placeholder="What you actually took from it…">'+esc(noteDraft!=null?noteDraft:(v.note||v.notes||''))+'</textarea>'+
            '<div class="pane-acts"><button type="button" class="b prime" data-savenote="'+esc(v.id)+'">Save &amp; re-read</button>'+
            '<button type="button" class="b" data-cancelnote="1">Cancel</button></div>'
          : '<button type="button" class="b" data-editnote="'+esc(v.id)+'">✎ '+((v.note||v.notes)?'Edit my note':'Add my own note')+'</button>')+
      '</div>';

      if(v.ttId&&v.transcript){
        h+='<details class="tx"><summary>▸ What was said · '+v.transcript.split(/\s+/).filter(Boolean).length+' words</summary>'+
           '<div class="body">'+esc(v.transcript)+'</div></details>';
      }
      if(v.ttId&&(v.screen||[]).length){
        h+='<details class="tx"><summary>▸ Text on screen</summary><div class="body">'+esc(v.screen.join('\n'))+'</div></details>';
      }
      if(v.grade&&SRC[v.grade]) h+='<div class="pane-src">'+esc(SRC[v.grade])+'</div>';

      h+='<div class="pane-acts">';
      if(world!=='tt') h+='<button type="button" class="b'+(v.watched?' on':'')+'" data-watch="'+esc(v.id)+'">'+(v.watched?'✓ Watched':'Mark watched')+'</button>';
      else h+='<button type="button" class="b'+(v.star?' on':'')+'" data-star="'+esc(v.id)+'">'+(v.star?'★ Starred':'☆ Star')+'</button>';
      if(v.url) h+='<a class="b" href="'+esc(v.url)+'" target="_blank" rel="noopener">Open ↗</a>';
      if((v.kpFail>=3)||(v.metaFail>=2)) h+='<button type="button" class="b" data-retry="'+esc(v.id)+'">Try again</button>';
      h+='<button type="button" class="b warn" data-del="'+esc(v.id)+'">Remove</button>';
      h+='</div></div>';
      return h;
    }
    function renderPane(){
      $('pane').innerHTML=paneHTML();
      var fill=$('moFill');
      if(fill){ var totV=videos.length, pct=totV?Math.round(videos.filter(function(v){return v.watched;}).length/totV*100):0;
        requestAnimationFrame(function(){ fill.style.transform='scaleX('+(pct/100)+')'; }); }
      var open=!!selId;
      $('side').classList.toggle('open',open);
      $('scrim').classList.toggle('on',open);
      // Keep his half-written note alive across any re-render, and only steal
      // focus when the box has just appeared — never while he is typing in it.
      var nb=$('noteBox');
      if(nb){
        nb.addEventListener('input',function(){ noteDraft=this.value; });
        if(document.activeElement!==nb){ nb.focus(); nb.setSelectionRange(nb.value.length,nb.value.length); }
      }
    }
    function select(id){ if(selId!==id){ playing=null; noteOpen=false; noteDraft=null; } selId=id; renderWall(); renderPane(); }
    function closePane(){ selId=null; playing=null; noteOpen=false; noteDraft=null; renderWall(); renderPane(); }

    /* ════════════════════════════════════════════════════════════
       INGEST — per world
       ════════════════════════════════════════════════════════════ */
    function ingestHTML(){
      if(world==='hb'){
        return '<div class="ing open"><h3>Name a habit you want to grow into</h3>'+
          '<p>Then live it. Identity tracks the streak.</p>'+
          '<input id="hText" placeholder="e.g. Read 20 min before bed" autocomplete="off">'+
          '<textarea id="hWhy" placeholder="Why it matters — the person this makes you…" style="font-family:var(--au-sans);font-size:12.5px;min-height:58px"></textarea>'+
          '<div class="ing-row"><button type="button" class="b prime" id="hSave">Add habit</button>'+
          '<span class="ing-msg" id="hMsg"></span></div></div>';
      }
      if(world==='tt'){
        var open=!tiktoks.length;
        return '<div class="ing'+(open?' open':'')+'" id="ttIng">'+
          '<button type="button" class="ing-fold" id="ttFold"><h3>Add TikToks</h3><span class="chev">▾</span></button>'+
          '<div class="ing-hide">'+
          '<p>One link, or paste your whole notes list at once — every TikTok link in it gets picked up, deduped and read in the background.</p>'+
          '<textarea id="ttIn" placeholder="https://www.tiktok.com/@…/video/…&#10;https://www.tiktok.com/@…/video/…" spellcheck="false" autocapitalize="none"></textarea>'+
          '<div class="ing-row"><button type="button" class="b prime" id="ttAdd">Add them</button>'+
          (tiktoks.length?'<button type="button" class="b warn" id="ttWipe">Start over · remove all '+tiktoks.length+'</button>':'')+
          '<span class="ing-msg" id="ttMsg"></span></div></div></div>';
      }
      var open=!videos.length;
      return '<div class="ing'+(open?' open':'')+'" id="ytIng">'+
        '<button type="button" class="ing-fold" id="ytFold"><h3>Add to the queue</h3><span class="chev">▾</span></button>'+
        '<div class="ing-hide">'+
        '<p>Mirror a public or unlisted YouTube playlist — it stays in step every time you sync.</p>'+
        '<input id="plInput" type="url" inputmode="url" placeholder="Paste a YouTube playlist link…" autocomplete="off" autocapitalize="none" spellcheck="false" value="'+esc(profile.playlist?('https://www.youtube.com/playlist?list='+profile.playlist):'')+'">'+
        '<div class="ing-row"><button type="button" class="b prime" id="plSync">↻ Sync playlist</button>'+
        '<span class="ing-msg" id="plMsg"></span></div>'+
        '<div style="height:1px;background:var(--au-line);margin:15px 0"></div>'+
        '<p>Or add one by hand.</p>'+
        '<input id="vTitle" placeholder="Title — what to watch or read" autocomplete="off">'+
        '<input id="vUrl" type="url" inputmode="url" placeholder="Link · optional" autocomplete="off" autocapitalize="none" spellcheck="false">'+
        '<div class="ing-row"><button type="button" class="b" id="vSave">Add to queue</button>'+
        '<span class="ing-msg" id="vMsg"></span></div></div></div>';
    }

    var lastIngestSig='';
    function ingestSig(){ return world+':'+coll().length+':'+habits.length+':'+(profile.playlist||''); }
    function renderIngest(){ $('ingest').innerHTML=ingestHTML(); lastIngestSig=ingestSig(); wireIngest(); }
    function wireIngest(){
      var f;
      if((f=$('ttFold'))) f.addEventListener('click',function(){ $('ttIng').classList.toggle('open'); });
      if((f=$('ytFold'))) f.addEventListener('click',function(){ $('ytIng').classList.toggle('open'); });
      if((f=$('ttAdd'))) f.addEventListener('click',addTikToks);
      if((f=$('ttWipe'))) f.addEventListener('click',dropAll);
      if((f=$('plSync'))) f.addEventListener('click',syncPlaylist);
      if((f=$('plInput'))) f.addEventListener('keydown',function(e){ if(e.key==='Enter') syncPlaylist(); });
      if((f=$('vSave'))) f.addEventListener('click',saveVideo);
      if((f=$('hSave'))) f.addEventListener('click',saveHabit);
    }
    function msg(id,m,bad){ var e=$(id); if(!e) return; e.textContent=m||''; e.classList.toggle('bad',!!bad); }

    /* ── YouTube: manual add + playlist mirror ────────────────── */
    function saveVideo(){
      var t=$('vTitle'); if(!t) return;
      var title=t.value.trim(); if(!title){ msg('vMsg','Add a title',true); return; }
      var url=normUrl($('vUrl').value);
      videos.push({ id:uid(), title:title, url:url, source:srcFromUrl(url), topic:'', watched:false, note:'', ord:nextOrd(videos), ts:Date.now() });
      persist(K_VID,videos); flush();
      t.value=''; $('vUrl').value='';
      render(); msg('vMsg','Queued ✓');
    }
    function playlistIdOf(u){ u=String(u||'').trim(); var m=u.match(/[?&]list=([A-Za-z0-9_-]+)/); if(m) return m[1]; if(/^(PL|UU|LL|FL|OL|RD)/.test(u)) return u.replace(/[^A-Za-z0-9_-]/g,''); return ''; }
    function reconcileVideos(incoming){
      var byYt={}; videos.forEach(function(v){ if(v.ytId) byYt[v.ytId]=v; });
      var added=0;
      incoming.forEach(function(inc){ if(!inc||!inc.videoId) return;
        var ex=byYt[inc.videoId];
        if(ex){ if(inc.title&&!ex.title) ex.title=inc.title; if(inc.thumb) ex.thumb=inc.thumb; if(inc.channel&&!ex.channel) ex.channel=inc.channel; return; } // keep watched + keypoints
        videos.push({ id:uid(), ytId:inc.videoId, title:inc.title||'(untitled)', channel:inc.channel||'',
          thumb:inc.thumb||('https://i.ytimg.com/vi/'+inc.videoId+'/hqdefault.jpg'),
          url:'https://www.youtube.com/watch?v='+inc.videoId, source:'YouTube', topic:'', watched:false, ord:nextOrd(videos), ts:Date.now() });
        added++;
      });
      if(added){ persist(K_VID,videos); flush(); }
      return added;
    }
    var syncing=false;
    async function syncPlaylist(){
      if(syncing) return;
      var el=$('plInput'); if(!el) return;
      var pid=playlistIdOf(el.value.trim())||playlistIdOf(profile.playlist||'');
      if(!pid){ msg('plMsg','Paste a YouTube playlist link first',true); return; }
      profile.playlist=pid; persist(K_PROF,profile); flush();
      syncing=true; msg('plMsg','Syncing…');
      try{
        var r=await fetch('/api/run-reminders?youtube='+encodeURIComponent(pid),{cache:'no-store'});
        if(!r.ok){ var t=''; try{ t=(await r.json()).error||''; }catch(e){} throw new Error(t||('HTTP '+r.status)); }
        var data=await r.json(); var vids=(data&&data.videos)||[];
        if(!vids.length) msg('plMsg','No videos found in that playlist (is it Public or Unlisted?)',true);
        else { var n=reconcileVideos(vids);
          msg('plMsg', n?(n+' new video'+(n>1?'s':'')+' added'+(data.full?'':' · add YOUTUBE_API_KEY in Vercel for the full list'))
                        :('Up to date · '+vids.length+' in playlist'+(data.full?'':' (recent 15)'))); }
        render(); sweep();
      }catch(e){ msg('plMsg','Sync failed: '+(e.message||'error'),true); }
      syncing=false;
    }

    /* ── TikTok: bulk paste ───────────────────────────────────── */
    var TT_RE=/https?:\/\/(?:(?:www\.|m\.)?tiktok\.com\/@[A-Za-z0-9_.-]{1,40}\/(?:video|photo)\/\d{6,25}|(?:vm|vt)\.tiktok\.com\/[A-Za-z0-9]{4,20}|(?:www\.)?tiktok\.com\/t\/[A-Za-z0-9]{4,20})/gi;
    function ttIdOf(u){ var m=String(u||'').match(/\/(?:video|photo)\/(\d{6,25})/); return m?m[1]:''; }
    function addTikToks(){
      var box=$('ttIn'); if(!box) return;
      var raw=box.value||'';
      var found=raw.match(TT_RE)||[];
      if(!found.length){ msg('ttMsg','No TikTok links found in that. Paste the share links themselves.',true); return; }
      var haveId={}, haveUrl={};
      tiktoks.forEach(function(v){ if(v.ttId) haveId[v.ttId]=1; if(v.url) haveUrl[v.url.split('?')[0]]=1; });
      var added=0, dup=0, seen={};
      found.forEach(function(u){
        u=u.split('?')[0];
        if(seen[u]) return; seen[u]=1;
        var id=ttIdOf(u);
        if((id&&haveId[id])||haveUrl[u]){ dup++; return; }
        if(id) haveId[id]=1; haveUrl[u]=1;
        tiktoks.push({ id:uid(), ttId:id||'', url:u, source:'TikTok', pending:true, ord:nextOrd(tiktoks), ts:Date.now() });
        added++;
      });
      if(added){ persist(K_TT,tiktoks); flush(); box.value=''; }
      msg('ttMsg', added ? (added+' added'+(dup?' · '+dup+' already saved':'')+' · reading them now…')
                         : (dup+' already saved — nothing new.'));
      render(); ttSweep();
    }

    /* ════════════════════════════════════════════════════════════
       THE READERS — no buttons. Both worlds fill themselves in, one
       item at a time, and survive a reload because every result is
       persisted the moment it lands. They survive the free tier by
       BACKING OFF rather than failing: that limit is exactly what used
       to surface as "Nova's busy" and give up forever.
       ════════════════════════════════════════════════════════════ */
    function applyKP(v,text,extra){
      v.keypoints=text; v.distilledTs=Date.now(); v.revisitTs=Date.now(); v.ts=Date.now(); v.kpFail=0;
      var p=kpParse(text);
      // TOPIC is only a placeholder so shelves appear during the sweep. Each
      // item guesses its theme in isolation, which is how you end up with nine
      // near-identical shelves — the canonical pass below decides the real set.
      if(p.topic) v.rawTopic=p.topic;
      if(p.kind) v.kind=p.kind;
      if(extra){ if(extra.grade) v.grade=extra.grade; if(extra.kind) v.kind=extra.kind; }
      saveItem(v);
    }

    /* ── YouTube reader ───────────────────────────────────────── */
    async function askDistill(v,notes){
      try{
        var r=await fetch('/api/run-reminders?ytdistill=1',{ method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ text:notes||'', title:v.title, videoId:v.ytId||'' }) });
        var d={}; try{ d=await r.json(); }catch(e){}
        if(r.ok&&d.text) return { ok:true, text:d.text };
        return { ok:false, rate: r.status===429 || (d&&d.error==='rate') };
      }catch(e){ return { ok:false }; }
    }
    var sweeping=false;
    async function sweep(){
      if(sweeping||paused) return;
      var pend=videos.filter(function(v){ return v.ytId && !v.keypoints && (v.kpFail||0)<3; });
      if(!pend.length){ status(''); fillConcepts(); return; }
      sweeping=true;
      var ids=pend.map(function(v){ return v.id; }), total=ids.length;
      for(var i=0;i<ids.length;i++){
        if(paused) break;                 // Stop is honoured BETWEEN videos, so
        var v=byId(ids[i]); if(!v||v.keypoints) continue;   // one in flight still lands
        var got=null;
        for(var att=0; att<3 && !got; att++){
          status('Reading '+(i+1)+'/'+total,true);
          var res=await askDistill(v,v.notes||v.note);
          if(res.ok){ got=res.text; break; }
          if(res.rate){ status('Waiting '+(i+1)+'/'+total,true); await wait(20000+att*15000); }
          else await wait(2500);
        }
        v=byId(ids[i]); if(!v) continue;
        if(got) applyKP(v,got);
        else { v.kpFail=(v.kpFail||0)+1; persist(K_VID,videos); }
        if(world==='yt'){ renderWall(); if(selId===v.id&&!noteOpen) renderPane(); }
        await wait(2200);   // pace: the free tier is capped per minute, not per day
      }
      sweeping=false; status('');
      render(); if(!paused) fillConcepts();
    }

    /* ── TikTok reader: fetch, then read, one video at a time ── */
    async function ttFetchMeta(v){
      try{
        var r=await fetch('/api/run-reminders?tiktok='+encodeURIComponent(v.url),{cache:'no-store'});
        var d={}; try{ d=await r.json(); }catch(e){}
        if(r.ok&&d&&d.ok) return { ok:true, meta:d };
        return { ok:false, error:(d&&d.error)||('HTTP '+r.status), gone:r.status===404 };
      }catch(e){ return { ok:false, error:'no connection' }; }
    }
    async function ttRead(v){
      try{
        var r=await fetch('/api/run-reminders?ttread=1',{ method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ handle:v.handle, author:v.author, caption:v.caption, tags:v.tags, screen:v.screen,
            transcript:v.transcript, transcriptLang:v.transcriptLang, music:v.music, duration:v.duration, note:v.note||'' }) });
        var d={}; try{ d=await r.json(); }catch(e){}
        if(r.ok&&d&&d.text) return { ok:true, text:d.text, grade:d.grade, kind:d.kind };
        return { ok:false, rate:r.status===429||(d&&d.error==='rate'), unreadable:r.status===422, grade:d&&d.grade };
      }catch(e){ return { ok:false }; }
    }
    function applyMeta(v,m){
      v.ttId=m.id||v.ttId; v.url=m.url||v.url; v.handle=m.handle||''; v.author=m.author||'';
      v.caption=m.caption||''; v.tags=m.tags||[]; v.screen=m.screen||[];
      v.transcript=m.transcript||''; v.transcriptLang=m.transcriptLang||'';
      v.music=m.music||''; v.duration=m.duration||0; v.cover=m.cover||''; v.created=m.created||0;
      v.likes=m.likes||0; v.fetched=m.fetched||Date.now();
      v.pending=false; v.metaFail=0; v.err=''; v.ts=Date.now();
      persist(K_TT,tiktoks); flush();
    }
    var ttSweeping=false;
    async function ttSweep(){
      if(ttSweeping||paused) return;
      var need=tiktoks.filter(function(v){ return (v.pending||!v.handle||!v.keypoints) && (v.metaFail||0)<2 && (v.kpFail||0)<3; });
      if(!need.length){ status(''); fillConcepts(); return; }
      ttSweeping=true;
      var ids=need.map(function(v){ return v.id; }), total=ids.length;
      for(var i=0;i<ids.length;i++){
        if(paused) break;                 // same contract as the YouTube sweep
        var v=byId(ids[i]); if(!v) continue;

        if(v.pending||!v.handle){
          status('Fetching '+(i+1)+'/'+total,true);
          var got=await ttFetchMeta(v);
          v=byId(ids[i]); if(!v) continue;
          if(got.ok) applyMeta(v,got.meta);
          else{
            // Never a silent failure: a deleted video, a blocked request and no
            // connection are three different sentences and the card says which.
            v.metaFail=(v.metaFail||0)+1; v.pending=false;
            v.err=got.gone?'TikTok says this video is gone, private or region-locked.':('Couldn’t fetch it — '+(got.error||'unknown')+'.');
            persist(K_TT,tiktoks); flush();
            if(world==='tt'){ renderWall(); if(selId===v.id&&!noteOpen) renderPane(); }
            await wait(1200); continue;
          }
          if(world==='tt'){ renderWall(); if(selId===v.id&&!noteOpen) renderPane(); }
        }

        v=byId(ids[i]); if(!v||v.keypoints) continue;
        status('Reading '+(i+1)+'/'+total,true);
        var kp=null, res;
        for(var att=0; att<3 && !kp; att++){
          res=await ttRead(v);
          if(res.ok){ kp=res; break; }
          if(res.unreadable){ break; }
          if(res.rate){ status('Waiting '+(i+1)+'/'+total,true); await wait(20000+att*15000); }
          else await wait(2500);
        }
        v=byId(ids[i]); if(!v) continue;
        if(kp) applyKP(v,kp.text,{grade:kp.grade,kind:kp.kind});
        else if(res&&res.unreadable){ v.grade='none'; v.kpFail=3; v.ts=Date.now(); persist(K_TT,tiktoks); flush(); }
        else { v.kpFail=(v.kpFail||0)+1; persist(K_TT,tiktoks); }
        if(world==='tt'){ renderWall(); if(selId===v.id&&!noteOpen) renderPane(); }
        await wait(2000);
      }
      ttSweeping=false; status('');
      render(); if(!paused) fillConcepts();
    }

    /* ── shelving ─────────────────────────────────────────────────
       Most items get their shelf free, from the TOPIC line of their own key
       points. This only mops up the stragglers — and it is CHUNKED
       server-side, because one 42-item request is what used to come back
       empty. Each world keeps its OWN label set: "Edits" belongs on the
       TikTok wall and nowhere near the YouTube one. */
    var CVER=2, filling=false;
    async function fillConcepts(){
      if(filling) return;
      var arr=coll(), key=collKey(), isTT=world==='tt';
      var need=arr.filter(function(v){ return (isTT?v.ttId:v.ytId)&&v.keypoints&&(!v.concept||v.cver!==CVER); });
      if(!need.length) return;
      var count={}; arr.forEach(function(v){ if(v.concept&&v.cver===CVER) count[v.concept]=(count[v.concept]||0)+1; });
      var known=Object.keys(count).sort(function(a,b){ return count[b]-count[a]; }).slice(0,8);
      filling=true; status('Sorting',true);
      try{
        var items=need.slice(0,120).map(function(v){
          return { videoId:(isTT?v.ttId:v.ytId), title:titleOf(v), channel:(isTT?('@'+(v.handle||'')):(v.channel||'')),
                   topic:v.rawTopic||'', core:kpParse(v.keypoints||'').core };
        });
        var r=await fetch('/api/run-reminders?ytorganize=1',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ items:items, known:known }) });
        var d={}; try{ d=await r.json(); }catch(e){}
        if(r.ok&&d.concepts){
          var ch=0;
          arr.forEach(function(v){
            var vid=isTT?v.ttId:v.ytId;
            if(!vid||v.cver===CVER) return;
            var lab=d.concepts[vid]; if(!lab) return;
            v.concept=String(lab).slice(0,40); v.cver=CVER; v.ts=Date.now(); ch++;
          });
          if(ch){ persist(key,arr); flush(); }
        }
      }catch(e){}
      filling=false; status(''); render();
    }

    /* An expired cover URL is a real, expected event — TikTok signs them and
       they die within the hour. Re-fetch it rather than leaving a dead frame,
       and cap it so a whole wall of dead covers can't stampede the endpoint. */
    var covFix={}, covBusy=0;
    async function refreshCover(id){
      var v=byId(id); if(!v||!v.ttId||covFix[id]||covBusy>=2) return;
      covFix[id]=1; covBusy++;
      var got=await ttFetchMeta(v);
      v=byId(id);
      if(got.ok&&v){ applyMeta(v,got.meta); renderWall(); if(selId===id&&!noteOpen) renderPane(); }
      covBusy--;
    }

    /* remember — resurface a read video's key points on a gentle schedule */
    function dueRemember(){
      var now=Date.now(), DAY=86400000;
      return videos.concat(tiktoks).filter(function(v){
        return v.keypoints&&isLesson(v)&&v.distilledTs&&(now-v.distilledTs)>=3*DAY&&(!v.revisitTs||(now-v.revisitTs)>=5*DAY);
      }).sort(function(a,b){ return (a.revisitTs||a.distilledTs)-(b.revisitTs||b.distilledTs); })[0]||null;
    }

    /* ── habits ───────────────────────────────────────────────── */
    function saveHabit(){
      var t=$('hText'); if(!t) return;
      var text=t.value.trim(); if(!text){ msg('hMsg','Name the habit',true); return; }
      habits.push({ id:uid(), text:text, why:$('hWhy').value.trim(), adopted:false, ts:Date.now() });
      persist(K_HAB,habits); flush();
      t.value=''; $('hWhy').value='';
      render(); msg('hMsg','Added ✓');
    }
    function renderHabits(){
      var h='';
      if(!habits.length){
        h+='<div class="empty"><b>No habits yet</b>Name one thing you want to become, and why it matters.</div>';
      } else {
        var q=seek.trim().toLowerCase();
        var list=habits.filter(function(x){ return !q||((x.text+' '+(x.why||'')).toLowerCase().indexOf(q)>=0); })
          .sort(function(a,b){ if(!!a.adopted!==!!b.adopted) return a.adopted?1:-1; return (a.ts||0)-(b.ts||0); });
        h+= list.length ? '<div class="hb">'+list.map(function(x){
          return '<div class="hb-c'+(x.adopted?' done':'')+'">'+
            '<button type="button" class="hb-ck'+(x.adopted?' on':'')+'" data-ha="'+esc(x.id)+'" aria-label="Adopted">'+(x.adopted?'✓':'')+'</button>'+
            '<div style="flex:1;min-width:0"><div class="hb-t">'+esc(x.text)+'</div>'+
            (x.why?'<div class="hb-w">'+esc(x.why)+'</div>':'')+
            (x.adopted?'<div class="hb-w" style="color:rgba(var(--acc),.8)">Adopted · track it in Identity</div>':'')+'</div>'+
            '<button type="button" class="hb-x" data-dh="'+esc(x.id)+'" aria-label="Remove">✕</button></div>';
        }).join('')+'</div>' : '<div class="empty"><b>Nothing matches</b>No habit matches “'+esc(seek.trim())+'”.</div>';
      }
      $('wall').innerHTML=h;
    }

    /* ════════════════════════════════════════════════════════════
       RENDER
       ════════════════════════════════════════════════════════════ */
    function countTo(el,end){ end=parseInt(end,10); if(!el||!isFinite(end)) return;
      var dur=650,t0=performance.now(); function step(t){ var p=Math.min(1,(t-t0)/dur); p=1-Math.pow(1-p,3);
      el.textContent=Math.round(end*p); if(p<1) requestAnimationFrame(step); } requestAnimationFrame(step); }
    function metricsHTML(){
      var un=videos.filter(function(v){return !v.watched;}).length;
      var lessons=tiktoks.filter(function(v){return v.keypoints&&isLesson(v);}).length;
      var building=habits.filter(function(h){return !h.adopted;}).length;
      var sets=[ ['To watch',un], ['Saved',tiktoks.length], ['Lessons',lessons], ['Building',building] ];
      return sets.map(function(s){ return '<div class="lb-met"><b data-n="'+s[1]+'">0</b><span>'+s[0]+'</span></div>'; }).join('');
    }
    /* The segments are equal width, so the pill only ever travels — its width
       is CSS's business, never an animated property. */
    function moveInk(){
      var w=$('lbWorlds').querySelector('.lb-w.on'), ink=$('lbInk');
      if(!w||!ink) return;
      ink.style.transform='translateX('+(w.offsetLeft-3)+'px)';
    }
    function render(){
      videos=loadArr(K_VID); tiktoks=loadArr(K_TT); habits=loadArr(K_HAB); profile=loadObj(K_PROF);

      document.documentElement.style.setProperty('--acc',ACCENT[world]);
      $('lbTitleEm').textContent=TITLE[world];
      $('nYt').textContent=videos.filter(function(v){return !v.watched;}).length;
      $('nTt').textContent=tiktoks.length;
      $('nHb').textContent=habits.filter(function(h){return !h.adopted;}).length;

      var first=!window.__lbAnim; window.__lbAnim=true;
      $('lbMetrics').innerHTML=metricsHTML();
      Array.prototype.forEach.call($('lbMetrics').querySelectorAll('b'),function(b){
        var n=parseInt(b.getAttribute('data-n'),10)||0;
        if(first&&n>0) countTo(b,n); else b.textContent=n;
      });

      var un=videos.filter(function(v){return !v.watched;}).length;
      var building=habits.filter(function(h){return !h.adopted;}).length;
      if(videos.length||tiktoks.length||habits.length){
        $('lbSub').textContent=un+' to watch · '+tiktoks.length+' TikTok'+(tiktoks.length===1?'':'s')+' saved · '+
          building+' habit'+(building===1?'':'s')+' in progress';
      }

      // The panel shows a live count ("remove all 47"), so it repaints when the
      // library changes — but NOT while he is typing in it.
      var box=$('ttIn')||$('plInput')||$('hText');
      if(!$('ingest').firstChild || (ingestSig()!==lastIngestSig && document.activeElement!==box)) renderIngest();
      renderRail();
      renderWall();
      renderPane();
      renderStatus();
      moveInk();
    }

    function setWorld(w){
      if(world===w) return;
      world=w; shelf=''; state=(w==='tt'?'':'todo'); selId=null; playing=null; noteOpen=false; noteDraft=null;
      Array.prototype.forEach.call($('lbWorlds').querySelectorAll('.lb-w'),function(b){
        b.classList.toggle('on',b.getAttribute('data-world')===w);
      });
      renderIngest();          // the only moment the ingest panel is rebuilt
      render();
      if(w==='tt') ttSweep(); else if(w==='yt') sweep();
    }

    /* ════════════════════════════════════════════════════════════
       WIRING
       ════════════════════════════════════════════════════════════ */
    $('lbWorlds').addEventListener('click',function(e){
      var b=e.target.closest('[data-world]'); if(b) setWorld(b.getAttribute('data-world'));
    });
    $('seek').addEventListener('input',function(){ seek=this.value; $('seekClr').classList.toggle('hidden',!seek); render(); });
    $('seekClr').addEventListener('click',function(){ seek=''; $('seek').value=''; this.classList.add('hidden'); render(); $('seek').focus(); });
    $('rail').addEventListener('click',function(e){
      var s=e.target.closest('[data-st]'); if(s){ state=s.getAttribute('data-st'); render(); return; }
      var c=e.target.closest('[data-sh]'); if(c){ shelf=c.getAttribute('data-sh'); render(); return; }
    });
    $('main').addEventListener('click',function(e){
      var st=e.target.closest('[data-star]');
      if(st){ e.stopPropagation(); var sv=byId(st.getAttribute('data-star')); if(sv){ sv.star=!sv.star; sv.ts=Date.now(); saveItem(sv); render(); } return; }
      var ha=e.target.closest('[data-ha]');
      if(ha){ var hv=habits.find(function(x){return x.id===ha.getAttribute('data-ha');}); if(hv){ hv.adopted=!hv.adopted; hv.ts=Date.now(); persist(K_HAB,habits); flush(); render(); } return; }
      var dh=e.target.closest('[data-dh]');
      if(dh){ habits=habits.filter(function(x){return x.id!==dh.getAttribute('data-dh');}); persist(K_HAB,habits); flush(); render(); return; }
      var t=e.target.closest('[data-id]'); if(t) select(t.getAttribute('data-id'));
    });
    // An expired TikTok cover leaves a broken frame; go and get a fresh one.
    $('main').addEventListener('error',function(e){
      var img=e.target; if(img&&img.tagName==='IMG'&&img.getAttribute('data-cover')) refreshCover(img.getAttribute('data-cover'));
    },true);

    $('pane').addEventListener('click',function(e){
      var el;
