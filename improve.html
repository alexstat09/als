                 '<span class="rm-from">'+esc(titleOf(v))+' · '+esc(whenAgo(v.recapTs||v.distilledTs||v.ts))+
                 (rec?' · recap':'')+'</span></button>';
             }).join('')+'</section>';
        });
      }
      $('wall').innerHTML=h;
    }

    function renderWall(){
      if(world==='hb'){ renderHabits(); return; }
      if(world==='rm'){ renderRoom(); return; }
      var list=sortedList(), html;
      if(!coll().length){
        html='<div class="empty"><b>'+(world==='tt'?'No TikToks yet':'Nothing queued yet')+'</b>'+
          (world==='tt'
            ? 'Paste one link or your whole notes list above.<br>Everything else — the creator, what was said, what to take from it — is worked out for you.'
            : 'Mirror a YouTube playlist above, or add something by hand.')+'</div>';
      } else if(!list.length){
        html='<div class="empty"><b>Nothing here</b>'+(seek.trim()?('Nothing matches “'+esc(seek.trim())+'”.'):'This shelf is empty in the current view.')+'</div>';
      } else {
        html='<div class="wall '+world+'">'+list.map(tileHTML).join('')+'</div>';
      }
      $('wall').innerHTML=html;
    }

    /* ── the rail: shelves + states ───────────────────────────── */
    function railBtn(kind,val,label,n,on){
      return '<button type="button" class="rl-b'+(on?' on':'')+'" data-'+kind+'="'+esc(val)+'">'+
        '<span class="dot"></span><span class="lab">'+esc(label)+'</span><span class="n">'+n+'</span></button>';
    }
    function renderRail(){
      if(world==='hb'||world==='rm'){ $('rail').innerHTML=''; return; }
      var p=pool(), h='';
      if(starOnly) p=p.filter(function(v){ return !!v.star; });
      var states = world==='tt'
        ? [['','Everything',p.length],
           ['lesson','Lessons',p.filter(function(v){return v.keypoints&&isLesson(v);}).length],
           ['keep','Keepsakes',p.filter(function(v){return v.keypoints&&!isLesson(v);}).length],
           ['reading','Still reading',p.filter(function(v){return !v.keypoints;}).length]]
        : [['todo','To watch',p.filter(function(v){return !v.watched;}).length],
           ['done','Watched',p.filter(function(v){return !!v.watched;}).length],
           ['','Everything',p.length]];
      // Never strand him on an empty view.
      if(state && !states.some(function(s){ return s[0]===state && s[2]; })) state='';
      h+='<div class="rl-h">View</div>';
      states.forEach(function(s){ if(s[2]||!s[0]) h+=railBtn('st',s[0],s[1],s[2],state===s[0]); });
      // The star toggle sits with the views but is its own axis — it narrows
      // whatever view is already chosen rather than replacing it.
      var nStar=pool().filter(function(v){ return !!v.star; }).length;
      if(nStar||starOnly) h+=railBtn('star','1','★ Starred',nStar,starOnly);

      var sc=scoped(), tc={};
      sc.forEach(function(v){ var c=conceptOf(v)||'Unsorted'; tc[c]=(tc[c]||0)+1; });
      // Canonical order first, then anything left over, then Unsorted last.
      var keys=SHELVES.filter(function(c){ return tc[c]; })
        .concat(Object.keys(tc).filter(function(c){ return c!=='Unsorted'&&SHELVES.indexOf(c)<0; }).sort())
        .concat(tc['Unsorted']?['Unsorted']:[]);
      if(shelf&&keys.indexOf(shelf)<0) shelf='';
      if(keys.length>1){
        h+='<div class="rl-h">Shelves</div>';
        h+=railBtn('sh','','All shelves',sc.length,!shelf);
        keys.forEach(function(c){ h+=railBtn('sh',c,c,tc[c],shelf===c); });
      }
      $('rail').innerHTML=h;
    }

    /* ════════════════════════════════════════════════════════════
       THE DETAIL PANE — one component, both worlds.
       ════════════════════════════════════════════════════════════ */
    var playing=null;   // id of the item whose player is live
    var qOpen={};       // which key points are showing their source line

    /* Where the reading actually came from. The whole point of grading
       server-side is that this line can be TRUE — "no data" and "we couldn't
       read it" must never look the same. */
    var SRC={
      transcript:'Read from what is actually said in the video (TikTok’s own captions).',
      screen:'Read from the text shown on screen.',
      notes:'Read from your own notes.',
      caption:'From the caption only — there is no spoken audio to read.',
      thin:'Nothing was said and nothing was written, so this is a label, not a lesson. Add a line of your own below and it will be read properly.',
      none:'Nothing readable at all — no caption, no text on screen, no audio captions.',
      /* ── the YouTube grades ──────────────────────────────────────
         YouTube gives us NO transcript — its caption endpoint is locked, and
         three InnerTube clients were tried before that was accepted. So a
         YouTube reading is built on the creator's own description, which is
         written to sell the video. These three lines exist so a card can never
         again imply it knows what was said in something nobody transcribed. */
      chapters:'Read from the video’s own chapter list — its outline, not its words. YouTube gives us no transcript.',
      description:'Read from the video’s own description, which the creator wrote to promote it. Nobody has read you what was actually said — YouTube gives us no transcript.',
      title:'Little more than the title to go on — no real description and no transcript — so this names the video rather than teaching you anything. Add a line of your own below and it will be read properly.',
      /* ⭐ The only grade on this page that means the video was actually SEEN.
         Every other line above is an apology for reading around the video;
         this one is not, and it must not be worded like one. */
      /* ⚠️ It used to say "everything BELOW", and this line renders at the
         FOOT of the pane — below it there is nothing but buttons. Found by
         looking at a render. The recap is above, so it points up. */
      watched:'This one was WATCHED — the whole video went in, audio and all. The recap above comes from what is actually said in it, not from the description the creator wrote to sell it.'
    };
    function paneEmptyHTML(){
      var un=videos.filter(function(v){return !v.watched;});
      var nextV=un.slice().sort(byOrd)[0];
      var building=habits.filter(function(h){return !h.adopted;});
      var nextH=building.slice().sort(function(a,b){return (a.ts||0)-(b.ts||0);})[0];
      var rem=dueRemember();
      var h='';
      /* The pane belongs to the world you are standing in. A TikTok wall that
         reports "70% of the YouTube queue watched" is answering a question
         nobody asked from here. */
      /* In the Room the recall card and the practice list are the PAGE — the
         side pane must not print them a second time. It says what the archive
         holds instead, which is the one thing the Room itself never claims. */
      if(world==='rm'){
        var read=videos.concat(tiktoks).filter(function(v){ return v.keypoints&&!isLegacyRead(v); });
        var les=read.filter(isLesson).length;
        var shelvesUsed=Object.keys(read.reduce(function(m,v){ if(conceptOf(v)) m[conceptOf(v)]=1; return m; },{})).length;
        var done=actions.filter(function(a){ return !!a.done; }).length;
        h+='<div class="now-sec"><div class="now-h">What you have taken</div>'+
          '<div class="now-big">'+les+' idea'+(les===1?'':'s')+' worth keeping</div>'+
          '<div class="now-sub">from '+read.length+' read · across '+shelvesUsed+' '+(shelvesUsed===1?'shelf':'shelves')+'</div></div>';
        if(actions.length){
          h+='<div class="now-sec"><div class="now-h">Practice</div>'+
            '<div class="now-sub" style="margin-top:9px">'+done+' of '+actions.length+' done</div>'+
            '<div class="now-bar"><i id="moFill" data-pct="'+(actions.length?Math.round(done/actions.length*100):0)+'"></i></div></div>';
        }
        if(!read.length) h='<div class="pane-empty">Nothing has been read yet. Save something in YouTube or TikTok and the ideas will collect here.</div>';
        return h;
      }
      if(world==='tt'){
        var lessons=tiktoks.filter(function(v){ return v.keypoints&&isLesson(v); });
        var newest=tiktoks.slice().sort(function(a,b){ return (b.ts||0)-(a.ts||0); })[0];
        if(tiktoks.length){
          h+='<div class="now-sec"><div class="now-h">What you’ve kept</div>'+
            '<div class="now-big">'+lessons.length+' of '+tiktoks.length+' carry something to take</div>'+
            '<div class="now-sub">The rest are kept for what they are</div>'+
            (newest?'<div class="pane-acts"><button type="button" class="b prime" data-open="'+esc(newest.id)+'">Open the latest</button></div>':'')+
          '</div>';
        }
      } else if(nextV||nextH){
        h+='<div class="now-sec">'+
          '<div class="now-h">Next up</div>'+
          '<div class="now-big">'+esc(nextV?titleOf(nextV):nextH.text)+'</div>'+
          '<div class="now-sub">'+esc(nextV?(metaOf(nextV)||'In your queue'):(nextH.why||'A habit you’re building'))+'</div>'+
          '<div class="pane-acts">'+
            (nextV?'<button type="button" class="b prime" data-open="'+esc(nextV.id)+'">Open it</button>':
                   '<a class="b prime" href="identity.html">Track it in Identity →</a>')+
          '</div></div>';
      }
      var totV=videos.length, pct=totV?Math.round(videos.filter(function(v){return v.watched;}).length/totV*100):0;
      if(totV&&world!=='tt'){
        h+='<div class="now-sec"><div class="now-h">Learning momentum</div>'+
           '<div class="now-sub" style="margin-top:9px">'+pct+'% of the queue watched</div>'+
           '<div class="now-bar"><i id="moFill"></i></div></div>';
      }
      if(rem){
        // Same rule as the Room's due card: a recap can be due on its own, and
        // where both exist it is the better material.
        var rmR=hasRecap(rem)?rcParse(rem.recap):null, rp=kpParse(rem.keypoints);
        var rmCore=(rmR&&rmR.core)||rp.core, rmPts=(rmR&&rmR.facts.length)?rmR.facts:rp.keys;
        h+='<div class="now-sec"><div class="now-h">Don’t let this fade</div>'+
          '<div class="now-big" style="font-size:17px">'+esc(titleOf(rem))+'</div>'+
          (rmCore?'<div style="font-size:12.5px;line-height:1.55;color:var(--au-dim);margin-top:10px">'+esc(rmCore)+'</div>':'')+
          (rmPts.length?'<ul class="pane-keys">'+rmPts.slice(0,3).map(function(k){return '<li>'+esc(k)+'</li>';}).join('')+'</ul>':'')+
          '<div class="pane-acts"><button type="button" class="b prime" data-remgot="'+esc(rem.id)+'">Still with me ✓</button>'+
          '<button type="button" class="b" data-remlost="'+esc(rem.id)+'">I’d forgotten it</button>'+
          (hasRecap(rem)
            ? '<button type="button" class="b" data-rcread="'+esc(rem.id)+'">Read the recap →</button>'
            : '<button type="button" class="b" data-open="'+esc(rem.id)+'">Open it</button>')+
          '</div></div>';
      }
      if(!h) h='<div class="pane-empty">Pick anything on the left and it opens here — the video, and the few things worth taking from it.</div>';
      return h;
    }

    /* ── the stage ────────────────────────────────────────────────
       YouTube plays inline, because youtube-nocookie's embed is a real
       player and it looks right.

       ⚠️ TIKTOK DOES NOT PLAY INLINE, ON PURPOSE. Its /embed/v2 iframe is a
       marketing surface, not a player: it forces a WHITE card into a black
       page, ships its own like/comment/share chrome, adds a "Watch now"
       upsell bar, repeats the caption in its own fonts, and still overflows
       a 9:16 box. It is cross-origin, so none of that can be styled away.
       These are videos he has ALREADY watched — the pane exists for what to
       take from them, and re-watching belongs in a real TikTok tab where the
       experience is native and good. A half-working player is worse than an
       honest link. Do not put the embed back. */
    function stageHTML(v){
      var th=thumbOf(v), tt=isTikTok(v), cls=tt?'tt':'yt';
      if(!tt && playing===v.id){
        var src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(v.ytId||'')+'?autoplay=1&rel=0';
        return '<div class="pane-stage '+cls+'"><iframe src="'+esc(src)+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="'+esc(titleOf(v))+'"></iframe></div>';
      }
      if(!th && !(v.ytId||v.ttId)) return '';
      var inner=(th?'<img src="'+esc(th)+'" alt="" data-cover="'+esc(v.id)+'">':'')+
        '<span class="over">'+(tt?'<b class="watch">Watch on TikTok ↗</b>':'<span>▶</span>')+'</span>';
      if(tt && v.url) return '<a class="pane-stage '+cls+' idle" href="'+esc(v.url)+'" target="_blank" rel="noopener">'+inner+'</a>';
      return '<div class="pane-stage '+cls+' idle" data-play="'+esc(v.id)+'" style="cursor:pointer">'+inner+'</div>';
    }

    /* ── RECEIPTS ─────────────────────────────────────────────────
       "make sure the key takes are actually 100 percent perfect and correct."
       The server drops any point citing a name or number that was never said;
       this is the other half — for each surviving point, find the sentence in
       the real transcript it came from, so he can check it himself.

       ⚠️ The match is done HERE, in the page, by word overlap against the
       stored transcript. It SELECTS a real sentence; it cannot write one. Ask
       a model to quote its source and it will happily invent the quote too —
       that is precisely the failure this is meant to catch. */
    var STOP=/^(the|a|an|and|but|or|so|if|when|then|that|this|these|those|it|its|is|are|was|were|be|been|being|to|of|in|on|at|for|with|from|by|as|you|your|they|their|them|we|our|he|she|his|her|not|can|will|would|should|could|have|has|had|do|does|did|just|about|what|which|who|how|why|more|most|than|very|also|into|out|up|down|over|all|any|some|one|two)$/i;
    function words(s){
      return String(s||'').toLowerCase().split(/[^\p{L}\p{N}']+/u)
        .filter(function(w){ return w.length>2 && !STOP.test(w); });
    }
    function sentences(txt){
      return String(txt||'').split(/(?<=[.!?])\s+|\n+/)
        .map(function(s){ return s.trim(); })
        .filter(function(s){ return s.length>18; });
    }
    function quoteFor(key,v){
      var src=sentences(v.transcript||'').concat(sentences((v.screen||[]).join('\n')));
      if(!src.length) return '';
      var kw=words(key); if(kw.length<2) return '';
      var best='', bestScore=0;
      src.forEach(function(s){
        var sw=words(s); if(!sw.length) return;
        var hit=0, seen={};
        kw.forEach(function(w){ if(!seen[w]&&sw.indexOf(w)>=0){ seen[w]=1; hit++; } });
        // Normalised so a long rambling sentence can't win on volume alone.
        var score=hit/Math.sqrt(sw.length);
        if(hit>=2 && score>bestScore){ bestScore=score; best=s; }
      });
      return bestScore>0.28 ? best.slice(0,320) : '';
    }

    /* ── THE RECAP BLOCK ──────────────────────────────────────────
       The one control on this page that goes and WATCHES the thing. Drawn in
       two different PLACES depending on what it is saying (see the callers):
       an offer sits under the thin reading it replaces, a finished recap sits
       at the top as the card's summary. Same markup either way, so the two
       positions can never drift into two components.
       YouTube only — the TikTok half already reads real captions. */
    function recapBlockHTML(v){
      if(isTikTok(v)||!v.ytId) return '';
      var h='<div class="pane-recap">';
      if(recapBusy[v.id]){
        var bz=recapBusy[v.id], el=Math.max(0,Math.round((Date.now()-(bz.ts||Date.now()))/1000));
        // A long video is watched in parts, so the wait can say WHERE it is
        // rather than only how long it has been. "part 3 of 4" is the
        // difference between patience and closing the tab.
        var lab=bz.merging?('Putting the parts together · '+el+'s')
              :(bz.of?('Watching part '+bz.part+' of '+bz.of+' · '+el+'s')
                     :('Watching it now · '+el+'s'));
        h+='<span class="lab pulse">'+esc(lab)+'</span>'+
           '<div class="sub" style="margin-top:0;text-transform:none;letter-spacing:0;font-family:inherit;font-size:12.5px;line-height:1.5;color:var(--au-dim)">'+
           (bz.of
             ? 'This one is long, so it is being watched in '+bz.of+' parts and then written up as one page. Each part is saved as it lands — if anything drops out, pressing again carries on from where it stopped.'
             : 'It is taking in the whole video, not skimming a description, so give it up to a minute. You can keep browsing — this keeps going.')+
           '</div>'+
           /* Half a part's credit for the one in flight. A bar sitting at
              exactly 0 through the whole of part 1 reads as broken — and it
              is not even true, since that part IS underway. */
           (bz.of?'<div class="now-bar" style="margin-top:11px"><i style="transform:scaleX('+
                  Math.min(1,(bz.merging?bz.of:(bz.part-0.5))/bz.of).toFixed(3)+')"></i></div>':'');
      }else if(hasRecap(v)){
        var rp=rcParse(v.recap);
        h+='<span class="lab">The recap</span>'+
           (rp.core?'<div class="core">'+esc(rp.core)+'</div>':'')+
           '<div class="sub">'+esc([
              (v.recapWords?v.recapWords+' words':''),
              (v.recapSections?v.recapSections+' section'+(v.recapSections===1?'':'s'):''),
              (rp.facts.length?rp.facts.length+' to keep':'')
            ].filter(Boolean).join(' · '))+'</div>'+
           '<div class="pane-acts"><button type="button" class="b prime" data-rcread="'+esc(v.id)+'">Read it →</button>'+
           '<button type="button" class="b" data-rcrun="'+esc(v.id)+'">Watch again</button></div>';
      }else if(recapEmpty(v)){
        h+='<span class="lab">Watched — nothing to write down</span>'+
           '<div class="core" style="font-size:14px">'+esc(v.recapNothing)+'</div>'+
           '<div class="pane-acts"><button type="button" class="b" data-rcrun="'+esc(v.id)+'">Try again</button></div>';
      }else if(v.recapErr){
        // After a failure the offer copy is wrong — he knows what it does, he
        // just tried it. The error itself is the message, and the button is a
        // retry. If parts of a long video are already banked, say so and call
        // the button what it actually does: carry on, not start over.
        var done=(v.recapParts||[]).filter(function(x){ return x&&String(x).trim(); }).length;
        h+='<span class="lab" style="color:var(--au-coral)">That didn’t go through</span>'+
           (done?'<div class="sub" style="margin-top:8px">'+done+' part'+(done===1?'':'s')+' saved · nothing is lost</div>':'')+
           '<div class="pane-acts" style="margin-top:11px"><button type="button" class="b prime" data-rcrun="'+esc(v.id)+'">'+
           (done?'Carry on →':'Try again')+'</button></div>';
      }else{
        h+='<span class="lab">'+(v.watched?'You’ve watched it. Get the page.':'Watched it? Get the page.')+'</span>'+
           '<div class="sub" style="margin-top:0;text-transform:none;letter-spacing:0;font-family:inherit;font-size:12.5px;line-height:1.5;color:var(--au-dim)">'+
           'The points above come from the description. This watches the whole video and writes the recap you keep instead of it.</div>'+
           '<div class="pane-acts"><button type="button" class="b prime" data-rcrun="'+esc(v.id)+'">Watch it &amp; write the recap</button></div>';
      }
      if(v.recapErr) h+='<div class="sub" style="color:var(--au-coral);text-transform:none;letter-spacing:0;font-family:inherit;font-size:12px;line-height:1.5">'+esc(v.recapErr)+'</div>';
      return h+'</div>';
    }

    function paneHTML(){
      if(!selId) return paneEmptyHTML();
      var v=byId(selId); if(!v) return paneEmptyHTML();
      var p=kpParse(v.keypoints||''), lesson=isLesson(v);
      var h=stageHTML(v);
      h+='<div class="pane-in">';
      var legacy=isLegacyRead(v);
      /* ⚠️ The chip must agree with the TILE's badge. Caught by looking at a
         render: the wall said RECAP and the pane, two inches away, still said
         LESSON — the same reading described two ways on one screen. badgeFor()
         puts a recap above everything for a reason (it is a claim about the
         SOURCE, not about a reading) and this had not been given the same
         rule. Constraint 15 in miniature: a guarantee on one path has to hold
         on its twin. */
      var recapKind=hasRecap(v);
      h+='<span class="pane-kind'+(recapKind||(v.keypoints&&lesson&&!legacy)?' lesson':'')+(legacy&&!recapKind?' old':'')+'">'+
         (recapKind?'Recap'
           :(v.pending?'Fetching…':(legacy?'Unverified':(v.keypoints?(lesson?'Lesson':'Keepsake'):(v.metaFail>=2?'Unreadable':'Reading…')))))+'</span>';
      h+='<div class="pane-t">'+esc(titleOf(v))+'</div>';
      var m=[]; if(v.ttId&&v.handle) m.push('@'+v.handle); if(v.channel) m.push(v.channel);
      if(v.duration) m.push(v.duration+'s'); if(v.created) m.push(new Date(v.created*1000).toLocaleDateString());
      if(conceptOf(v)) m.push(conceptOf(v));
      if(m.length) h+='<div class="pane-m">'+esc(m.join(' · '))+'</div>';

      if(v.err){ h+='<div class="pane-src" style="color:var(--au-coral);border-top:none;padding-top:12px">'+esc(v.err)+'</div>'; }

      /* ⭐ ONE CARD, ONE VOICE.
         Once a recap exists it IS this card's summary, and the old key points
         are the thin version of the same job — written from a description, by
         a reader that never heard the video. Showing both puts a good summary
         and a grey one side by side and makes him decide which to trust, every
         time. So the recap block moves up here and the earlier reading folds
         into a disclosure: nothing is deleted, it is simply no longer
         competing.
         ⚠️ The DO line does NOT fold with them — see below. It is an action,
         not a summary, and the recap does not replace it. */
      var recapped=hasRecap(v);
      if(recapped) h+=recapBlockHTML(v);
      if(recapped && (p.core||p.keys.length)){
        h+='<details class="tx"><summary>▸ The earlier summary, from the description</summary><div class="body">'+
           (p.core?'<div style="font-family:var(--au-serif);font-size:14px;line-height:1.45;margin-bottom:10px">'+esc(p.core)+'</div>':'')+
           (p.keys.length?'<ul class="pane-keys" style="margin-top:0">'+p.keys.map(function(k){ return '<li>'+esc(k)+'</li>'; }).join('')+'</ul>':'')+
           '</div></details>';
      }
      if(!recapped){
        if(p.core && p.core.trim()!==titleOf(v).trim()) h+='<div class="pane-core">'+esc(p.core)+'</div>';
        if(p.keys.length){
          h+='<ul class="pane-keys">'+p.keys.map(function(k,i){
            var q=quoteFor(k,v);
            return '<li'+(q?' class="has-q" data-q="'+i+'"':'')+'>'+esc(k)+
              (q?'<span class="q'+(qOpen[selId+':'+i]?' on':'')+'">“'+esc(q)+'”</span>':'')+'</li>';
          }).join('')+'</ul>';
          if(p.keys.some(function(k){ return quoteFor(k,v); }))
            h+='<div class="pane-hint">Tap a point to see the words it came from</div>';
        }
      }
      /* ⭐ The DO line used to end here, in a box, for ever. It is the only
         thing this page produces that can change a week, so it now has
         somewhere to go. A legacy reading's DO is not offered — it was written
         by the prompt that padded, and it has not been checked. */
      if(p.act&&lesson&&!legacy){
        var act=actionFor(v.id);
        h+='<div class="pane-do"><b>Try this</b>'+esc(p.act)+
           '<div class="pane-acts" style="margin-top:12px">'+
           (act
             ? '<span class="b on">✓ On your practice list</span>'+
               '<button type="button" class="b" data-unpractice="'+esc(act.id)+'">Take it off</button>'
             : '<button type="button" class="b prime" data-practice="'+esc(v.id)+'">Practise this →</button>')+
           '</div></div>';
      } else if(p.act&&lesson&&legacy){
        h+='<div class="pane-do"><b>Try this</b>'+esc(p.act)+'</div>';
      }
      if(!v.keypoints&&!v.pending&&!v.err) h+='<div class="pane-src pulse" style="border-top:none;padding-top:12px">Nova is reading this one…</div>';

      // When there is no recap yet this is an OFFER, and it belongs under the
      // thin reading it is offering to replace — the difference has to be
      // visible at the moment it matters. Once a recap exists it has already
      // been drawn at the top, as this card's actual summary.
      if(!recapped) h+=recapBlockHTML(v);

      if(v.ttId&&(v.tags||[]).length) h+='<div class="pane-m" style="margin-top:14px">'+esc(v.tags.map(function(t){return '#'+t;}).join('  '))+'</div>';
      if(v.ttId&&v.music) h+='<div class="pane-m" style="margin-top:7px">♪ '+esc(v.music)+'</div>';

      /* his own line — the escape hatch for anything the machine can't read */
      h+='<div class="pane-note">'+
        (noteOpen
          ? '<textarea id="noteBox" placeholder="What you actually took from it…">'+esc(noteDraft!=null?noteDraft:(v.note||v.notes||''))+'</textarea>'+
            '<div class="pane-acts"><button type="button" class="b prime" data-savenote="'+esc(v.id)+'">Save &amp; re-read</button>'+
            '<button type="button" class="b" data-cancelnote="1">Cancel</button></div>'
          : '<button type="button" class="b" data-editnote="'+esc(v.id)+'">✎ '+((v.note||v.notes)?'Edit my note':'Add my own note')+'</button>')+
      '</div>';

      if(v.ttId&&v.transcript){
        h+='<details class="tx"><summary>▸ What was said · '+v.transcript.split(/\s+/).filter(Boolean).length+' words</summary>'+
           '<div class="body">'+esc(v.transcript)+'</div></details>';
      }
      if(v.ttId&&(v.screen||[]).length){
        h+='<details class="tx"><summary>▸ Text on screen</summary><div class="body">'+esc(v.screen.join('\n'))+'</div></details>';
      }
      /* Every specific in a key point is checked against what was actually
         said before it reaches this card. Say so when something was pulled —
         a quietly shorter list is exactly the kind of silence this project
         keeps getting bitten by. */
      if((v.dropped||[]).length){
        h+='<div class="pane-src">Checked against what was said, and '+v.dropped.length+' point'+
           (v.dropped.length===1?' was':'s were')+' removed for citing something the video never mentions ('+
           esc(v.dropped.slice(0,3).join(', '))+').</div>';
      }
      if(v.suspect){
        h+='<div class="pane-src" style="color:var(--au-coral)">Every point here cites something the video never mentions. Treat this one as unverified — open it, or add your own note and it will be read again.</div>';
      }
      if(legacy){
        h+='<div class="pane-src" style="color:var(--au-amber)">This was written before the reader could tell a lesson from a keepsake, ' +
           'and before anything it said was checked against the source. It is queued to be read again — nothing here is lost when it is.</div>';
      }
      if(v.grade&&SRC[v.grade]) h+='<div class="pane-src">'+esc(SRC[v.grade])+'</div>';

      h+='<div class="pane-acts">';
      if(world!=='tt') h+='<button type="button" class="b'+(v.watched?' on':'')+'" data-watch="'+esc(v.id)+'">'+(v.watched?'✓ Watched':'Mark watched')+'</button>';
      else h+='<button type="button" class="b'+(v.star?' on':'')+'" data-star="'+esc(v.id)+'">'+(v.star?'★ Starred':'☆ Star')+'</button>';
      if(v.url) h+='<a class="b" href="'+esc(v.url)+'" target="_blank" rel="noopener">Open ↗</a>';
      if((v.kpFail>=3)||(v.metaFail>=2)) h+='<button type="button" class="b" data-retry="'+esc(v.id)+'">Try again</button>';
      h+='<button type="button" class="b warn" data-del="'+esc(v.id)+'">Remove</button>';
      h+='</div></div>';
      return h;
    }
    function renderPane(){
      $('pane').innerHTML=paneHTML();
      var fill=$('moFill');
      if(fill){
        // The bar is reused by the Room for practice, which states its own
        // percentage; anywhere else it is the share of the queue watched.
        var given=fill.getAttribute('data-pct');
        var pct;
        if(given!=null&&given!==''){ pct=parseInt(given,10)||0; }
        else { var totV=videos.length; pct=totV?Math.round(videos.filter(function(v){return v.watched;}).length/totV*100):0; }
        requestAnimationFrame(function(){ fill.style.transform='scaleX('+(pct/100)+')'; });
      }
      var open=!!selId;
      $('side').classList.toggle('open',open);
      $('scrim').classList.toggle('on',open);
      // Keep his half-written note alive across any re-render, and only steal
      // focus when the box has just appeared — never while he is typing in it.
      var nb=$('noteBox');
      if(nb){
        nb.addEventListener('input',function(){ noteDraft=this.value; });
        if(document.activeElement!==nb){ nb.focus(); nb.setSelectionRange(nb.value.length,nb.value.length); }
      }
    }
    /* ⚠️ Selecting used to call renderWall(), which rebuilds every tile's markup
       — a hundred nodes and a hundred <img> re-attachments — purely to move a
       one-pixel ring. Held down, j/k did that per keypress, and the
       scrollIntoView that follows then ran against a node that had just been
       destroyed and rebuilt underneath it. A selection is a class: move the
       class, and fall back to a full render only if there is no wall to touch. */
    function paintSel(){
      var host=$('main'); if(!host||!host.querySelectorAll) return false;
      var tiles=host.querySelectorAll('.tile,.rm-idea');
      if(!tiles||!tiles.length) return false;
      Array.prototype.forEach.call(tiles,function(t){
        t.classList.toggle('sel',t.getAttribute('data-id')===selId);
      });
      return true;
    }
    function select(id){
      if(selId!==id){ playing=null; noteOpen=false; noteDraft=null; qOpen={}; }
      selId=id;
      if(!paintSel()) renderWall();
      renderPane();
    }
    function closePane(){ selId=null; playing=null; noteOpen=false; noteDraft=null; if(!paintSel()) renderWall(); renderPane(); }

    /* ════════════════════════════════════════════════════════════
       INGEST — per world
       ════════════════════════════════════════════════════════════ */
    function ingestHTML(){
      // Nothing is added to the Room directly — it is made of what the other
      // worlds have already been read into.
      if(world==='rm') return '';
      if(world==='hb'){
        return '<div class="ing open"><h3>Name a habit you want to grow into</h3>'+
          '<p>Then live it. Identity tracks the streak.</p>'+
          '<input id="hText" placeholder="e.g. Read 20 min before bed" autocomplete="off">'+
          '<textarea id="hWhy" placeholder="Why it matters — the person this makes you…" style="font-family:var(--au-sans);font-size:12.5px;min-height:58px"></textarea>'+
          '<div class="ing-row"><button type="button" class="b prime" id="hSave">Add habit</button>'+
          '<span class="ing-msg" id="hMsg"></span></div></div>';
      }
      if(world==='tt'){
        var open=!tiktoks.length;
        return '<div class="ing'+(open?' open':'')+'" id="ttIng">'+
          '<button type="button" class="ing-fold" id="ttFold"><h3>Add TikToks</h3><span class="chev">▾</span></button>'+
          '<div class="ing-hide">'+
          '<p>One link, or paste your whole notes list at once — every TikTok link in it gets picked up, deduped and read in the background.</p>'+
          '<textarea id="ttIn" placeholder="https://www.tiktok.com/@…/video/…&#10;https://www.tiktok.com/@…/video/…" spellcheck="false" autocapitalize="none"></textarea>'+
          '<div class="ing-row"><button type="button" class="b prime" id="ttAdd">Add them</button>'+
          (tiktoks.length?'<button type="button" class="b warn" id="ttWipe">Start over · remove all '+tiktoks.length+'</button>':'')+
          '<span class="ing-msg" id="ttMsg"></span></div></div></div>';
      }
      var open=!videos.length;
      return '<div class="ing'+(open?' open':'')+'" id="ytIng">'+
        '<button type="button" class="ing-fold" id="ytFold"><h3>Add to the queue</h3><span class="chev">▾</span></button>'+
        '<div class="ing-hide">'+
        '<p>Mirror a public or unlisted YouTube playlist — it stays in step every time you sync.</p>'+
        '<input id="plInput" type="url" inputmode="url" placeholder="Paste a YouTube playlist link…" autocomplete="off" autocapitalize="none" spellcheck="false" value="'+esc(profile.playlist?('https://www.youtube.com/playlist?list='+profile.playlist):'')+'">'+
        '<div class="ing-row"><button type="button" class="b prime" id="plSync">↻ Sync playlist</button>'+
        '<span class="ing-msg" id="plMsg"></span></div>'+
        '<div style="height:1px;background:var(--au-line);margin:15px 0"></div>'+
        '<p>Or add one by hand.</p>'+
        '<input id="vTitle" placeholder="Title — what to watch or read" autocomplete="off">'+
        '<input id="vUrl" type="url" inputmode="url" placeholder="Link · optional" autocomplete="off" autocapitalize="none" spellcheck="false">'+
        '<div class="ing-row"><button type="button" class="b" id="vSave">Add to queue</button>'+
        '<span class="ing-msg" id="vMsg"></span></div></div></div>';
    }

    var lastIngestSig='';
    function ingestSig(){ return world+':'+coll().length+':'+habits.length+':'+(profile.playlist||''); }
    function renderIngest(){ $('ingest').innerHTML=ingestHTML(); lastIngestSig=ingestSig(); wireIngest(); }
    function wireIngest(){
      var f;
      if((f=$('ttFold'))) f.addEventListener('click',function(){ $('ttIng').classList.toggle('open'); });
      if((f=$('ytFold'))) f.addEventListener('click',function(){ $('ytIng').classList.toggle('open'); });
      if((f=$('ttAdd'))) f.addEventListener('click',addTikToks);
      if((f=$('ttWipe'))) f.addEventListener('click',dropAll);
      if((f=$('plSync'))) f.addEventListener('click',syncPlaylist);
      if((f=$('plInput'))) f.addEventListener('keydown',function(e){ if(e.key==='Enter') syncPlaylist(); });
      if((f=$('vSave'))) f.addEventListener('click',saveVideo);
      if((f=$('hSave'))) f.addEventListener('click',saveHabit);
    }
    function msg(id,m,bad){ var e=$(id); if(!e) return; e.textContent=m||''; e.classList.toggle('bad',!!bad); }

    /* ── YouTube: manual add + playlist mirror ────────────────── */
    function saveVideo(){
      var t=$('vTitle'); if(!t) return;
      var title=t.value.trim(); if(!title){ msg('vMsg','Add a title',true); return; }
      var url=normUrl($('vUrl').value);
      videos.push({ id:uid(), title:title, url:url, source:srcFromUrl(url), topic:'', watched:false, note:'', ord:nextOrd(videos), ts:Date.now() });
      persist(K_VID,videos); flush();
      t.value=''; $('vUrl').value='';
      render(); msg('vMsg','Queued ✓');
    }
    function playlistIdOf(u){ u=String(u||'').trim(); var m=u.match(/[?&]list=([A-Za-z0-9_-]+)/); if(m) return m[1]; if(/^(PL|UU|LL|FL|OL|RD)/.test(u)) return u.replace(/[^A-Za-z0-9_-]/g,''); return ''; }
    function reconcileVideos(incoming){
      var byYt={}; videos.forEach(function(v){ if(v.ytId) byYt[v.ytId]=v; });
      var added=0;
      incoming.forEach(function(inc){ if(!inc||!inc.videoId) return;
        var ex=byYt[inc.videoId];
        if(ex){ if(inc.title&&!ex.title) ex.title=inc.title; if(inc.thumb) ex.thumb=inc.thumb; if(inc.channel&&!ex.channel) ex.channel=inc.channel; return; } // keep watched + keypoints
        videos.push({ id:uid(), ytId:inc.videoId, title:inc.title||'(untitled)', channel:inc.channel||'',
          thumb:inc.thumb||('https://i.ytimg.com/vi/'+inc.videoId+'/hqdefault.jpg'),
          url:'https://www.youtube.com/watch?v='+inc.videoId, source:'YouTube', topic:'', watched:false, ord:nextOrd(videos), ts:Date.now() });
        added++;
      });
      if(added){ persist(K_VID,videos); flush(); }
      return added;
    }
    var syncing=false;
    async function syncPlaylist(){
      if(syncing) return;
      var el=$('plInput'); if(!el) return;
      var pid=playlistIdOf(el.value.trim())||playlistIdOf(profile.playlist||'');
      if(!pid){ msg('plMsg','Paste a YouTube playlist link first',true); return; }
      profile.playlist=pid; persist(K_PROF,profile); flush();
      syncing=true; msg('plMsg','Syncing…');
      try{
        var r=await fetch('/api/run-reminders?youtube='+encodeURIComponent(pid),{cache:'no-store'});
        if(!r.ok){ var t=''; try{ t=(await r.json()).error||''; }catch(e){} throw new Error(t||('HTTP '+r.status)); }
        var data=await r.json(); var vids=(data&&data.videos)||[];
        if(!vids.length) msg('plMsg','No videos found in that playlist (is it Public or Unlisted?)',true);
        else { var n=reconcileVideos(vids);
          msg('plMsg', n?(n+' new video'+(n>1?'s':'')+' added'+(data.full?'':' · add YOUTUBE_API_KEY in Vercel for the full list'))
                        :('Up to date · '+vids.length+' in playlist'+(data.full?'':' (recent 15)'))); }
        render(); sweep();
      }catch(e){ msg('plMsg','Sync failed: '+(e.message||'error'),true); }
      syncing=false;
    }

    /* ── TikTok: bulk paste ───────────────────────────────────── */
    var TT_RE=/https?:\/\/(?:(?:www\.|m\.)?tiktok\.com\/@[A-Za-z0-9_.-]{1,40}\/(?:video|photo)\/\d{6,25}|(?:vm|vt)\.tiktok\.com\/[A-Za-z0-9]{4,20}|(?:www\.)?tiktok\.com\/t\/[A-Za-z0-9]{4,20})/gi;
    function ttIdOf(u){ var m=String(u||'').match(/\/(?:video|photo)\/(\d{6,25})/); return m?m[1]:''; }
    function addTikToks(){
      var box=$('ttIn'); if(!box) return;
      var raw=box.value||'';
      var found=raw.match(TT_RE)||[];
      if(!found.length){ msg('ttMsg','No TikTok links found in that. Paste the share links themselves.',true); return; }
      var haveId={}, haveUrl={};
      tiktoks.forEach(function(v){ if(v.ttId) haveId[v.ttId]=1; if(v.url) haveUrl[v.url.split('?')[0]]=1; });
      var added=0, dup=0, seen={};
      found.forEach(function(u){
        u=u.split('?')[0];
        if(seen[u]) return; seen[u]=1;
        var id=ttIdOf(u);
        if((id&&haveId[id])||haveUrl[u]){ dup++; return; }
        if(id) haveId[id]=1; haveUrl[u]=1;
        tiktoks.push({ id:uid(), ttId:id||'', url:u, source:'TikTok', pending:true, ord:nextOrd(tiktoks), ts:Date.now() });
        added++;
      });
      if(added){ persist(K_TT,tiktoks); flush(); box.value=''; }
      msg('ttMsg', added ? (added+' added'+(dup?' · '+dup+' already saved':'')+' · reading them now…')
                         : (dup+' already saved — nothing new.'));
      render(); ttSweep();
    }

    /* ════════════════════════════════════════════════════════════
       THE READERS — no buttons. Both worlds fill themselves in, one
       item at a time, and survive a reload because every result is
       persisted the moment it lands. They survive the free tier by
       BACKING OFF rather than failing: that limit is exactly what used
       to surface as "Nova's busy" and give up forever.
       ════════════════════════════════════════════════════════════ */
    function applyKP(v,text,extra){
      v.keypoints=text; v.distilledTs=Date.now(); v.ts=Date.now(); v.kpFail=0;
      v.rver=RVER;                       // read by a grader that can say "no"
      // ⚠️ Do NOT reset the recall clock on a re-read. `revisitTs` is when HE
      // last looked at it, not when a machine last wrote to it — stamping it
      // here would push every re-read card to the back of the recall queue and
      // quietly empty the queue every time the reader ran.
      if(!v.revisitTs) v.revisitTs=Date.now();
      // A fresh reading supersedes the old verdict, so clear last time's marks
      // rather than leaving a stale "1 point was removed" under new text.
      delete v.dropped; delete v.suspect;
      var p=kpParse(text);
      // TOPIC is only a placeholder so shelves appear during the sweep. Each
      // item guesses its theme in isolation, which is how you end up with nine
      // near-identical shelves — the canonical pass below decides the real set.
      if(p.topic) v.rawTopic=p.topic;
      if(p.kind) v.kind=p.kind;
      if(extra){
        if(extra.grade) v.grade=extra.grade;
        if(extra.kind) v.kind=extra.kind;
        // The reader picks its TOPIC from the same nine shelves and the server
        // validates it, so a video usually needs no sorting pass at all.
        if(extra.shelf&&SHELVES.indexOf(extra.shelf)>=0){ v.concept=extra.shelf; v.cver=CVER; }
        if(extra.dropped&&extra.dropped.length) v.dropped=extra.dropped;
        v.suspect=!!extra.suspect;
      }
      // A TOPIC line that already names a real shelf counts too.
      if(!v.concept&&p.topic&&SHELVES.indexOf(p.topic)>=0){ v.concept=p.topic; v.cver=CVER; }
      saveItem(v);
    }

    /* ── YouTube reader ───────────────────────────────────────── */
    async function askDistill(v,notes){
      try{
        var r=await fetch('/api/run-reminders?ytdistill=1',{ method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ text:notes||'', title:v.title, videoId:v.ytId||'' }) });
        var d={}; try{ d=await r.json(); }catch(e){}
        // Everything honest the server worked out now travels with the text —
        // the grade, whether it is a lesson at all, its shelf, and any point
        // struck for citing something the material never said. It used to
        // return the text alone, so the page could not tell a reading built on
        // a real description from one generalised out of a bare title.
        if(r.ok&&d.text) return { ok:true, text:d.text, grade:d.grade, kind:d.kind, shelf:d.shelf,
                                  dropped:d.dropped, suspect:d.suspect, sourced:d.sourced };
        return { ok:false, rate: r.status===429 || (d&&d.error==='rate'), unreadable:r.status===422, grade:d&&d.grade };
      }catch(e){ return { ok:false }; }
    }
    /* Anything read before the grader existed is re-read — but only AFTER
       everything unread, and only 25 per pass, so a long-standing library
       drips rather than floods a free tier that is capped per minute. The next
       time the page is opened or refocused it carries on. */
    var REREAD_PER_PASS=25;
    function ytQueue(){
      var fresh=videos.filter(function(v){ return v.ytId && !v.keypoints && (v.kpFail||0)<3; });
      var stale=videos.filter(function(v){ return v.ytId && isLegacyRead(v) && (v.kpFail||0)<3; }).slice(0,REREAD_PER_PASS);
      return fresh.concat(stale);
    }
    var sweeping=false;
    async function sweep(){
      if(sweeping||paused) return;
      var pend=ytQueue();
      if(!pend.length){ status(''); fillConcepts(); return; }
      sweeping=true;
      var ids=pend.map(function(v){ return v.id; }), total=ids.length;
      for(var i=0;i<ids.length;i++){
        if(paused) break;                 // Stop is honoured BETWEEN videos, so
        var v=byId(ids[i]); if(!v) continue;                // one in flight still lands
        var again=isLegacyRead(v);
        if(v.keypoints && !again) continue;                 // already read, and read properly
        var got=null, res=null;
        for(var att=0; att<3 && !got; att++){
          status((again?'Re-reading ':'Reading ')+(i+1)+'/'+total,true);
          res=await askDistill(v,v.notes||v.note);
          if(res.ok){ got=res; break; }
          if(res.rate){ status('Waiting '+(i+1)+'/'+total,true); await wait(20000+att*15000); }
          else await wait(2500);
        }
        v=byId(ids[i]); if(!v) continue;
        // ⚠️ A re-read REPLACES a reading he already has, so it may only ever
        // do so on success. A failed re-read must leave the old text exactly
        // where it was — losing a reading to fix a reading would be worse than
        // the unverified label it was trying to remove.
        if(got) applyKP(v,got.text,{grade:got.grade,kind:got.kind,shelf:got.shelf,dropped:got.dropped,suspect:got.suspect});
        else if(res&&res.unreadable&&!v.keypoints){ v.grade='none'; v.kpFail=3; v.ts=Date.now(); persist(K_VID,videos); flush(); }
        else { v.kpFail=(v.kpFail||0)+1; persist(K_VID,videos); }
        if(world==='yt'){ renderWall(); if(selId===v.id&&!noteOpen) renderPane(); }
        await wait(2200);   // pace: the free tier is capped per minute, not per day
      }
      sweeping=false; status('');
      render(); if(!paused) fillConcepts();
    }

    /* ════════════════════════════════════════════════════════════
       THE RECAP — the one thing on this page he presses himself
       ────────────────────────────────────────────────────────────
       Everything else here is a background reader that fills the library in
       while he does something else. This is not that, on purpose:

       · It COSTS. Gemini watches the actual video, and the free tier allows
         eight hours of YouTube a day. Sweeping it across a 46-video playlist
         would spend the day's budget on videos he never watched. So it fires
         on one video, when he asks, having just watched it.
       · It is SLOW — watching a twenty-minute video is not a two-second call —
         so the button has to hold its own state and say what is happening.
         Anything that renders as a dead button for ninety seconds gets pressed
         four more times.

       ⚠️ `recapBusy` is keyed BY ID, not a single flag. He can start one, close
       the pane, walk to another video and start a second; a shared boolean
       would silently drop the second request and look like nothing happened. */
    var recapBusy={};
    /* ⚠️⚠️ THE 504 THAT SHIPPED.
       The first build sent this request and waited. Watching a video runs far
       longer than a normal API call, `run-reminders.js` is capped at 60s in
       vercel.json, and **Gemini 3 defaults its thinking level to HIGH** — so
       the function was killed mid-flight and Vercel answered with its own
       gateway page. That page is HTML, so `r.json()` threw, `d` stayed empty,
       and the card rendered the literal string "The server said 504." Alex saw
       a number and no way forward.
       Three separate things are fixed, and all three had to be:
         · the CAUSE — thinking is now `low` server-side, which is what makes
           the call fit at all (see api/_model.js);
         · the SERVER — it aborts itself at 48s and returns typed JSON, so a
           timeout arrives as a sentence rather than as Vercel's HTML;
         · and HERE — a reply we cannot parse is never rendered as its status
           code. A status code is not a message. */
    function recapFailMsg(status){
      if(status===504||status===502) return 'The server ran out of time watching this one. Long videos are the usual cause — a shorter one will go through.';
      // ⚠️ 503 used to say "needs GEMINI_API_KEY" and that is now WRONG in the
      // common case: the courier returns 503 when Google's models are busy,
      // and only the no-key branch says so in its own words. A missing key is
      // a one-time setup problem; a busy model is a Tuesday. The server's own
      // message wins whenever we can read one — this is only the fallback.
      if(status===503) return 'Google’s video models are busy right now. Give it a minute and press it again.';
      if(status===401||status===403) return 'The server refused the request. Try reloading the page first.';
      return 'That did not work (error '+status+'). Try again in a moment.';
    }
    async function postRecap(payload){
      try{
        var r=await fetch('/api/run-reminders?ytrecap=1',{
          method:'POST', headers:{'content-type':'application/json'}, cache:'no-store',
          body:JSON.stringify(payload)
        });
        var d=null; try{ d=await r.json(); }catch(e){ d=null; }
        // ⚠️ fetch() resolves on 4xx. Check r.ok, always — the whole reason the
        // sync engine spent months reporting saves that never happened.
        if(r.ok&&d&&d.ok) return { ok:true, data:d };
        return {
          ok:false,
          message:(d&&d.message)||(d&&d.error)||recapFailMsg(r.status),
          rate:r.status===429,
          timeout:r.status===504||(d&&d.error==='timeout')
        };
      }catch(e){ return { ok:false, message:'No connection — the recap needs the network.' }; }
    }
    function askRecap(v){
      return postRecap({ videoId:v.ytId||'', title:titleOf(v), notes:(v.note||v.notes||'') });
    }
    /* ⚠️ A recap REPLACES one he may already have, so it may only ever do so on
       success — the same rule the re-read sweep learned the hard way. A failed
       re-recap leaves the old page exactly where it was and says why. */
    async function runRecap(id){
      var v=byId(id); if(!v||!v.ytId||recapBusy[id]) return;
      // ⚠️ Always an OBJECT, never a bare timestamp. It carries progress now
      // ("part 2 of 4"), and a shape that is sometimes a number and sometimes
      // a record is how a render ends up printing NaN at somebody.
      recapBusy[id]={ ts:Date.now() }; v.recapErr=''; renderPane(); renderWall();
      /* A minute of nothing looks like a broken button, and a broken button
         gets pressed four more times. The counter is the cheapest honest
         signal that work is happening — it repaints only the recap block, so
         it cannot fight anything he is typing. */
      var tick=setInterval(function(){ if(recapBusy[id]&&selId===id) renderPane(); else clearInterval(tick); },1000);
      var res=await askRecap(v);

      /* ⭐⭐ A LONG VIDEO COMES BACK AS A PLAN, NOT A RECAP.
         Alex: *"i want to be able to summarize at least 50 minute videos"*.
         Nothing on the server can watch 50 minutes inside one 60-second
         invocation, so it hands back a list of slices and the PAGE walks them
         — each slice its own ordinary request — then asks for the parts to be
         composed. See api/_youtube.js for why the loop lives here.

         ⚠️ Every finished part is PERSISTED the moment it lands. A part is the
         expensive thing in this feature; losing four of them because the fifth
         timed out would make a long video worse than useless. Pressing again
         resumes from what is already stored. */
      if(res.ok&&res.data&&res.data.plan){
        var segs=res.data.segments||[];
        v=byId(id); if(!v){ clearInterval(tick); delete recapBusy[id]; return; }
        v.secs=res.data.secs||0;
        // Anything kept from an earlier attempt at THIS plan is reused. The
        // signature guards against a re-plan (a different slicing) silently
        // mixing notes from two different cuts of the video.
        var sig=segs.length+'x'+(v.secs||0);
        var have=(v.recapPartsSig===sig&&Array.isArray(v.recapParts))?v.recapParts.slice():[];
        v.recapPartsSig=sig; v.recapParts=have; persist(K_VID,videos);

        for(var si=0; si<segs.length; si++){
          if(have[si]&&String(have[si]).trim()) continue;      // already earned
          recapBusy[id]={ part:si+1, of:segs.length, ts:recapBusy[id]&&recapBusy[id].ts||Date.now() };
          if(selId===id) renderPane();
          var pres=await postRecap({
            videoId:v.ytId||'', title:titleOf(v), total:segs.length,
            seg:{ i:si, start:segs[si].start, end:segs[si].end }
          });
          v=byId(id); if(!v){ clearInterval(tick); delete recapBusy[id]; return; }
          if(!pres.ok){
            clearInterval(tick);
            v.recapErr=(pres.message||'That part did not go through.')+
              (si?(' You have '+si+' of '+segs.length+' parts saved — pressing again carries on from there.'):'');
            v.ts=Date.now(); persist(K_VID,videos); flush();
            delete recapBusy[id]; render(); return;
          }
          have[si]=pres.data.note||'';
          v.recapParts=have; v.ts=Date.now(); persist(K_VID,videos); flush();
        }

        recapBusy[id]={ merging:true, of:segs.length, ts:recapBusy[id]&&recapBusy[id].ts||Date.now() };
        if(selId===id) renderPane();
        res=await postRecap({ merge:true, title:titleOf(v), notes:have, secs:v.secs||0 });
        if(res.ok){
          // The parts have done their job. Keeping them would double this
          // video's footprint in a store that already hit QuotaExceededError
          // once — and a finished recap can always be rebuilt from the video.
          v=byId(id);
          if(v){ delete v.recapParts; delete v.recapPartsSig; }
        }
      }

      clearInterval(tick);
      v=byId(id);
      if(!v){ delete recapBusy[id]; return; }
      if(res.ok){
        var d=res.data;
        if(d.empty){
          // Watched, and there was nothing being said in it. A real answer, and
          // it must not look like "we haven't looked yet".
          delete v.recap; v.recapNothing=d.nothing||'Nothing is explained in this one.';
          v.recapWords=0; v.recapSections=0;
        }else{
          v.recap=d.text||''; delete v.recapNothing;
          v.recapWords=d.words||0; v.recapSections=d.sections||0;
        }
        if(d.secs) v.secs=d.secs;
        v.recapTs=Date.now(); v.recapTrunc=!!d.truncated; v.recapErr='';
        v.grade='watched';                 // the source line must tell the truth
        if(d.shelf&&SHELVES.indexOf(d.shelf)>=0){ v.concept=d.shelf; v.cver=CVER; }
        v.ts=Date.now();
        persist(K_VID,videos); flush();
        delete recapBusy[id];
        render();
        if(hasRecap(v)) openRecap(id);     // he pressed it to read it
        return;
      }
      v.recapErr=res.message||'That did not work.'; v.ts=Date.now();
      persist(K_VID,videos); flush();
      delete recapBusy[id];
      render();
    }

    /* ── the reading view ─────────────────────────────────────────
       Built as a document: opening, sections in the video's own order, then
       the hard specifics. Rendered into a native <dialog> — see the CSS block
       for the three separate constraints that converge on this element. */
    var rcOpenId=null;
    function recapSourceLine(v){
      return 'Written from the video itself — the whole thing was watched, audio and all, ' +
             'rather than summarised from its description. Nothing here was checked against a second source, ' +
             'so it carries no receipts: it is one careful viewing, not a verified transcript.';
    }
    function renderRecap(){
      var dlg=$('rcDlg'); if(!dlg) return;
      var v=rcOpenId?byId(rcOpenId):null;
      if(!v||!hasRecap(v)){ dlg.innerHTML=''; return; }
      var p=rcParse(v.recap), h='';
      h+='<div class="rc-top"><div class="grow">'+
           '<div class="rc-eyebrow">The recap</div>'+
           '<h2 class="rc-h" id="rcTitle">'+esc(titleOf(v))+'</h2>'+
           /* ⚠️ whenAgo(), not toLocaleDateString(). Found by LOOKING at the
              render, invisible to every assertion: the raw locale date came
              out as "7/29/2026" — US month-first, on a page read in Greece.
              The rest of the Library already speaks in "today / 3d / 4w", so
              this was both wrong and inconsistent in one line. */
           '<div class="rc-meta">'+esc([
              v.channel||'',
              (v.recapWords?v.recapWords+' words':''),
              (v.recapTs?whenAgo(v.recapTs):'')
            ].filter(Boolean).join(' · '))+'</div>'+
         '</div><button type="button" class="rc-x" id="rcX" aria-label="Close">✕</button></div>';
      // tabindex -1 so the reading view can start focused on the TEXT. Without
      // it showModal() lands focus on the ✕, which is both the wrong place for
      // something you opened in order to read and the source of a UA focus ring.
      h+='<div class="rc-body" tabindex="-1">';
      if(p.core) h+='<div class="rc-core">'+esc(p.core)+'</div>';
      if(p.open) h+='<div class="rc-open">'+recapParagraphs(p.open).map(function(x){ return '<p class="rc-p">'+esc(x)+'</p>'; }).join('')+'</div>';
      p.sections.forEach(function(s){
        h+='<section class="rc-sec">'+(s.h?'<h3 class="rc-sh">'+esc(s.h)+'</h3>':'')+
           recapParagraphs(s.body).map(function(x){ return '<p class="rc-p">'+esc(x)+'</p>'; }).join('')+'</section>';
      });
      if(p.facts.length){
        h+='<div class="rc-facts"><h4>Worth keeping</h4><ul>'+
           p.facts.map(function(f){ return '<li>'+esc(f)+'</li>'; }).join('')+'</ul></div>';
      }
      // ⚠️ A truncated recap is an INCOMPLETE one. Saying so is the difference
      // between a page he can trust and a page that quietly stops mid-argument.
      if(v.recapTrunc) h+='<div class="rc-src" style="color:var(--au-amber)">This one hit the length limit and may stop before the end of the video. Watch it again to get a complete page.</div>';
      h+='<div class="rc-src">'+esc(recapSourceLine(v))+'</div>';
      h+='</div>';
      h+='<div class="rc-foot">'+
         (v.url?'<a class="b" href="'+esc(v.url)+'" target="_blank" rel="noopener">Open the video ↗</a>':'')+
         '<button type="button" class="b" data-rcagain="'+esc(v.id)+'">Watch it again</button>'+
         '<button type="button" class="b" id="rcClose">Done</button>'+
         '</div>';
      dlg.innerHTML=h;
    }
    function openRecap(id){
      var v=byId(id); if(!v||!hasRecap(v)) return;
      rcOpenId=id; renderRecap();
      var dlg=$('rcDlg'); if(!dlg) return;
      // Reading it IS revisiting it — this is the moment the recall clock should
      // restart, and the only place on this page where that is honestly true.
      v.revisitTs=Date.now(); v.ts=Date.now(); persist(K_VID,videos); flush();
      if(!dlg.open){ try{ dlg.showModal(); }catch(e){ dlg.setAttribute('open',''); } }
      var b=dlg.querySelector('.rc-body');
      if(b){ b.scrollTop=0; try{ b.focus({preventScroll:true}); }catch(e){ b.focus(); } }
    }
    function closeRecap(){
      var dlg=$('rcDlg'); rcOpenId=null;
      if(dlg&&dlg.open){ try{ dlg.close(); }catch(e){ dlg.removeAttribute('open'); } }
      else if(dlg){ dlg.removeAttribute('open'); }
    }

    /* ── TikTok reader: fetch, then read, one video at a time ── */
    async function ttFetchMeta(v){
      try{
        var r=await fetch('/api/run-reminders?tiktok='+encodeURIComponent(v.url),{cache:'no-store'});
        var d={}; try{ d=await r.json(); }catch(e){}
        if(r.ok&&d&&d.ok) return { ok:true, meta:d };
        return { ok:false, error:(d&&d.error)||('HTTP '+r.status), gone:r.status===404 };
      }catch(e){ return { ok:false, error:'no connection' }; }
    }
    async function ttRead(v){
      try{
        var r=await fetch('/api/run-reminders?ttread=1',{ method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ handle:v.handle, author:v.author, caption:v.caption, tags:v.tags, screen:v.screen,
            transcript:v.transcript, transcriptLang:v.transcriptLang, music:v.music, duration:v.duration, note:v.note||'' }) });
        var d={}; try{ d=await r.json(); }catch(e){}
        if(r.ok&&d&&d.text) return { ok:true, text:d.text, grade:d.grade, kind:d.kind, shelf:d.shelf, dropped:d.dropped, suspect:d.suspect };
        return { ok:false, rate:r.status===429||(d&&d.error==='rate'), unreadable:r.status===422, grade:d&&d.grade };
      }catch(e){ return { ok:false }; }
    }
    function applyMeta(v,m){
      v.ttId=m.id||v.ttId; v.url=m.url||v.url; v.handle=m.handle||''; v.author=m.author||'';
      v.caption=m.caption||''; v.tags=m.tags||[]; v.screen=m.screen||[];
      v.transcript=m.transcript||''; v.transcriptLang=m.transcriptLang||'';
      v.music=m.music||''; v.duration=m.duration||0; v.cover=m.cover||''; v.created=m.created||0;
      v.likes=m.likes||0; v.fetched=m.fetched||Date.now();
      v.pending=false; v.metaFail=0; v.err=''; v.ts=Date.now();
      persist(K_TT,tiktoks); flush();
    }
    var ttSweeping=false;
    async function ttSweep(){
      if(ttSweeping||paused) return;
      var need=tiktoks.filter(function(v){ return (v.pending||!v.handle||!v.keypoints) && (v.metaFail||0)<2 && (v.kpFail||0)<3; });
      if(!need.length){ status(''); fillConcepts(); return; }
      ttSweeping=true;
      var ids=need.map(function(v){ return v.id; }), total=ids.length;
      for(var i=0;i<ids.length;i++){
        if(paused) break;                 // same contract as the YouTube sweep
        var v=byId(ids[i]); if(!v) continue;

        if(v.pending||!v.handle){
          status('Fetching '+(i+1)+'/'+total,true);
          var got=await ttFetchMeta(v);
          v=byId(ids[i]); if(!v) continue;
          if(got.ok) applyMeta(v,got.meta);
          else{
            // Never a silent failure: a deleted video, a blocked request and no
            // connection are three different sentences and the card says which.
            v.metaFail=(v.metaFail||0)+1; v.pending=false;
            v.err=got.gone?'TikTok says this video is gone, private or region-locked.':('Couldn’t fetch it — '+(got.error||'unknown')+'.');
            persist(K_TT,tiktoks); flush();
            if(world==='tt'){ renderWall(); if(selId===v.id&&!noteOpen) renderPane(); }
            await wait(1200); continue;
          }
          if(world==='tt'){ renderWall(); if(selId===v.id&&!noteOpen) renderPane(); }
        }

        v=byId(ids[i]); if(!v||v.keypoints) continue;
        status('Reading '+(i+1)+'/'+total,true);
        var kp=null, res;
        for(var att=0; att<3 && !kp; att++){
          res=await ttRead(v);
          if(res.ok){ kp=res; break; }
          if(res.unreadable){ break; }
          if(res.rate){ status('Waiting '+(i+1)+'/'+total,true); await wait(20000+att*15000); }
          else await wait(2500);
        }
        v=byId(ids[i]); if(!v) continue;
        if(kp) applyKP(v,kp.text,{grade:kp.grade,kind:kp.kind,shelf:kp.shelf,dropped:kp.dropped,suspect:kp.suspect});
        else if(res&&res.unreadable){ v.grade='none'; v.kpFail=3; v.ts=Date.now(); persist(K_TT,tiktoks); flush(); }
        else { v.kpFail=(v.kpFail||0)+1; persist(K_TT,tiktoks); }
        if(world==='tt'){ renderWall(); if(selId===v.id&&!noteOpen) renderPane(); }
        await wait(2000);
      }
      ttSweeping=false; status('');
      render(); if(!paused) fillConcepts();
    }

    /* ── shelving ─────────────────────────────────────────────────
       Most items get their shelf free, from the TOPIC line of their own key
       points. This only mops up the stragglers — and it is CHUNKED
       server-side, because one 42-item request is what used to come back
       empty. Each world keeps its OWN label set: "Edits" belongs on the
       TikTok wall and nowhere near the YouTube one. */
    var CVER=3, filling=false;   // bumped with the fixed taxonomy — re-shelves once
    async function fillConcepts(){
      if(filling) return;
      var arr=coll(), key=collKey(), isTT=world==='tt';
      var need=arr.filter(function(v){ return (isTT?v.ttId:v.ytId)&&v.keypoints&&(!v.concept||v.cver!==CVER); });
      if(!need.length) return;
      var known=SHELVES.slice();   // strict: the model may only file, never name
      filling=true; status('Sorting',true);
      try{
        var items=need.slice(0,120).map(function(v){
          return { videoId:(isTT?v.ttId:v.ytId), title:titleOf(v), channel:(isTT?('@'+(v.handle||'')):(v.channel||'')),
                   topic:v.rawTopic||'', core:kpParse(v.keypoints||'').core };
        });
        var r=await fetch('/api/run-reminders?ytorganize=1',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ items:items, known:known, strict:true }) });
        var d={}; try{ d=await r.json(); }catch(e){}
        if(r.ok&&d.concepts){
          var ch=0;
          arr.forEach(function(v){
            var vid=isTT?v.ttId:v.ytId;
            if(!vid||v.cver===CVER) return;
            var lab=d.concepts[vid]; if(!lab) return;
            v.concept=String(lab).slice(0,40); v.cver=CVER; v.ts=Date.now(); ch++;
          });
          if(ch){ persist(key,arr); flush(); }
        }
      }catch(e){}
      filling=false; status(''); render();
    }

    /* An expired cover URL is a real, expected event — TikTok signs them and
       they die within the hour. Re-fetch it rather than leaving a dead frame,
       and cap it so a whole wall of dead covers can't stampede the endpoint. */
    var covFix={}, covBusy=0;
    async function refreshCover(id){
      var v=byId(id); if(!v||!v.ttId||covFix[id]||covBusy>=2) return;
      covFix[id]=1; covBusy++;
      var got=await ttFetchMeta(v);
      v=byId(id);
      if(got.ok&&v){ applyMeta(v,got.meta); renderWall(); if(selId===id&&!noteOpen) renderPane(); }
      covBusy--;
    }

    /* ════════════════════════════════════════════════════════════
       PRACTICE — where a DO line goes
       ════════════════════════════════════════════════════════════ */
    function actionFor(id){ return actions.find(function(a){ return a.from===id; })||null; }
    function addAction(v,text){
      text=String(text||'').trim(); if(!text) return null;
      var ex=actionFor(v.id);
      if(ex){ ex.text=text; ex.ts=Date.now(); }
      else actions.push({ id:uid(), from:v.id, text:text, title:titleOf(v), url:v.url||'', done:false, ts:Date.now() });
      persist(K_ACT,actions); flush();
      return ex||actions[actions.length-1];
    }
    function dropAction(id){
      actions=actions.filter(function(a){ return a.id!==id; });
      persist(K_ACT,actions); flush();
    }
    function toggleAction(id){
      var a=actions.find(function(x){ return x.id===id; }); if(!a) return;
      a.done=!a.done; a.doneTs=a.done?Date.now():0; a.ts=Date.now();
      persist(K_ACT,actions); flush();
    }

    /* ════════════════════════════════════════════════════════════
       RECALL — what he is about to forget
       ────────────────────────────────────────────────────────────
       ⚠️ This existed, and he was never going to see it. It returned exactly
       ONE item, rendered only in the empty pane — the pane that disappears the
       instant he clicks anything — so on a wall of a hundred TikToks it was
       effectively unreachable. And the schedule was flat: five days, then five
       days, then five days, for ever, whether or not the thing had stuck.

       Now the interval EXPANDS with each confirmed recall (3 → 7 → 21 → 60 →
       150 days) and collapses back to the start when he says he had forgotten
       it. That is the whole of spaced repetition, and it needs no backend —
       `revisitTs` and a step counter are enough.
       ════════════════════════════════════════════════════════════ */
    var DAY=86400000, STEPS=[3,7,21,60,150];
    function recallStep(v){ var s=v.recall|0; return s<0?0:(s>=STEPS.length?STEPS.length-1:s); }
    function dueAt(v){
      /* ⭐ A recap qualifies on its own, and it is the strongest thing here:
         it was written from the video itself rather than around it. Requiring
         `keypoints && isLesson` would have excluded exactly the readings most
         worth not forgetting — including any video whose old key points were
         legacy, which is most of them. */
      if(!hasRecap(v) && (!v.keypoints||!isLesson(v)||isLegacyRead(v))) return Infinity;
      /* ⚠️ The anchor is the LATEST contact, not `revisitTs || distilledTs`.
         Those two can disagree in both directions: a legacy card re-read today
         still carries a `revisitTs` from whenever it was first written, and
         taking that alone would make a reading he has never seen due the
         moment it lands. Whichever happened last is the last time this idea
         was in front of him, and that is what the interval counts from. */
      // `recapTs` joins the anchor for the same reason the other two are here:
      // whichever contact happened LAST is when this idea was in front of him.
      var from=Math.max(v.revisitTs||0, v.distilledTs||0, v.recapTs||0);
      if(!from) return Infinity;
      return from + STEPS[recallStep(v)]*DAY;
    }
    function recallQueue(){
      var now=Date.now();
      return videos.concat(tiktoks)
        .filter(function(v){ return dueAt(v)<=now; })
        .sort(function(a,b){ return dueAt(a)-dueAt(b); });
    }
    /* Kept for the empty pane, and for every test that already relies on it. */
    function dueRemember(){ return recallQueue()[0]||null; }
    function recallKept(v){                     // "still with me" → wait longer
      v.recall=Math.min(recallStep(v)+1,STEPS.length-1); v.revisitTs=Date.now(); v.ts=Date.now(); saveItem(v);
    }
    function recallLost(v){                     // "I'd forgotten that" → start again
      v.recall=0; v.revisitTs=Date.now(); v.ts=Date.now(); saveItem(v);
    }

    /* ── habits ───────────────────────────────────────────────── */
    function saveHabit(){
      var t=$('hText'); if(!t) return;
      var text=t.value.trim(); if(!text){ msg('hMsg','Name the habit',true); return; }
      habits.push({ id:uid(), text:text, why:$('hWhy').value.trim(), adopted:false, ts:Date.now() });
      persist(K_HAB,habits); flush();
      t.value=''; $('hWhy').value='';
      render(); msg('hMsg','Added ✓');
    }
    function renderHabits(){
      var h='';
      if(!habits.length){
        h+='<div class="empty"><b>No habits yet</b>Name one thing you want to become, and why it matters.</div>';
      } else {
        var q=seek.trim().toLowerCase();
        var list=habits.filter(function(x){ return !q||((x.text+' '+(x.why||'')).toLowerCase().indexOf(q)>=0); })
          .sort(function(a,b){ if(!!a.adopted!==!!b.adopted) return a.adopted?1:-1; return (a.ts||0)-(b.ts||0); });
        h+= list.length ? '<div class="hb">'+list.map(function(x){
          return '<div class="hb-c'+(x.adopted?' done':'')+'">'+
            '<button type="button" class="hb-ck'+(x.adopted?' on':'')+'" data-ha="'+esc(x.id)+'" aria-label="Adopted">'+(x.adopted?'✓':'')+'</button>'+
            '<div style="flex:1;min-width:0"><div class="hb-t">'+esc(x.text)+'</div>'+
            (x.why?'<div class="hb-w">'+esc(x.why)+'</div>':'')+
            /* ⚠️ This was the SENTENCE "Adopted · track it in Identity" and it
               created nothing — the one instruction on the page with no way to
               follow it. It is a link now, and Identity builds the row through
               its OWN save path (see identity.html's ?habit= handler): the
               store is written by the page that owns it, so the tombstones and
               the sync engine are the right ones. */
            (x.adopted?'<div class="hb-w"><a class="hb-go" href="identity.html?habit='+encodeURIComponent(x.text)+'">Adopted · start the streak in Identity →</a></div>':'')+'</div>'+
            '<button type="button" class="hb-x" data-dh="'+esc(x.id)+'" aria-label="Remove">✕</button></div>';
        }).join('')+'</div>' : '<div class="empty"><b>Nothing matches</b>No habit matches “'+esc(seek.trim())+'”.</div>';
      }
      $('wall').innerHTML=h;
    }

    /* ════════════════════════════════════════════════════════════
       RENDER
       ════════════════════════════════════════════════════════════ */
    function countTo(el,end){ end=parseInt(end,10); if(!el||!isFinite(end)) return;
      var dur=650,t0=performance.now(); function step(t){ var p=Math.min(1,(t-t0)/dur); p=1-Math.pow(1-p,3);
      el.textContent=Math.round(end*p); if(p<1) requestAnimationFrame(step); } requestAnimationFrame(step); }
    function metricsHTML(){
      var un=videos.filter(function(v){return !v.watched;}).length;
      // Lessons across BOTH worlds — the masthead counts the library, not one
      // wall of it, and a YouTube lesson is now a graded claim rather than the
      // default every video wore.
      var lessons=videos.concat(tiktoks).filter(function(v){return v.keypoints&&!isLegacyRead(v)&&isLesson(v);}).length;
      var openAct=actions.filter(function(a){return !a.done;}).length;
      var sets=[ ['To watch',un], ['Saved',tiktoks.length], ['Lessons',lessons], ['To practise',openAct] ];
      return sets.map(function(s){ return '<div class="lb-met"><b data-n="'+s[1]+'">0</b><span>'+s[0]+'</span></div>'; }).join('');
    }
    /* The segments are equal width, so the pill only ever travels — its width
       is CSS's business, never an animated property. */
    function moveInk(){
      var w=$('lbWorlds').querySelector('.lb-w.on'), ink=$('lbInk');
      if(!w||!ink) return;
      ink.style.transform='translateX('+(w.offsetLeft-3)+'px)';
    }
    /* ⚠️ The recap guard at the foot of render() can close the reading view,
       whose `close` event calls render() straight back. This flag is what
       keeps that from re-entering — and it is cleared in a `finally`, because
       a flag left standing by a thrown render would freeze the whole page
       silently, which is a far worse bug than the one it guards. */
    var rendering=false;
    function render(){
      if(rendering) return;
      rendering=true;
      try{ renderAll(); } finally{ rendering=false; }
    }
    function renderAll(){
      videos=loadArr(K_VID); tiktoks=loadArr(K_TT); habits=loadArr(K_HAB); profile=loadObj(K_PROF); actions=loadArr(K_ACT);

      document.documentElement.style.setProperty('--acc',ACCENT[world]);
      $('lbTitleEm').textContent=TITLE[world];
      $('nYt').textContent=videos.filter(function(v){return !v.watched;}).length;
      $('nTt').textContent=tiktoks.length;
      // The Room's count is what is ASKING for him — things due for recall plus
      // promises still open — not how many ideas it holds. A number on a tab is
      // a call to act; the size of the archive is not one.
      $('nRm').textContent=recallQueue().length+actions.filter(function(a){return !a.done;}).length;
      $('nHb').textContent=habits.filter(function(h){return !h.adopted;}).length;
      if(document.body&&document.body.classList) document.body.classList.toggle('no-rail',world==='hb'||world==='rm');

      var first=!window.__lbAnim; window.__lbAnim=true;
      $('lbMetrics').innerHTML=metricsHTML();
      Array.prototype.forEach.call($('lbMetrics').querySelectorAll('b'),function(b){
        var n=parseInt(b.getAttribute('data-n'),10)||0;
        if(first&&n>0) countTo(b,n); else b.textContent=n;
      });

      var un=videos.filter(function(v){return !v.watched;}).length;
      var building=habits.filter(function(h){return !h.adopted;}).length;
      var dueN=recallQueue().length;
      if(videos.length||tiktoks.length||habits.length){
        $('lbSub').textContent=un+' to watch · '+tiktoks.length+' TikTok'+(tiktoks.length===1?'':'s')+' saved · '+
          building+' habit'+(building===1?'':'s')+' in progress'+
          (dueN?(' · '+dueN+' to revisit'):'');
      }

      // The panel shows a live count ("remove all 47"), so it repaints when the
      // library changes — but NOT while he is typing in it.
      var box=$('ttIn')||$('plInput')||$('hText');
      if(!$('ingest').firstChild || (ingestSig()!==lastIngestSig && document.activeElement!==box)) renderIngest();
      renderRail();
      renderWall();
      renderPane();
      renderStatus();
      // A reading view left open on an item that has since been removed — by
      // "remove all", by a sync pull, by the ✕ on another device — would sit
      // there as a blank sheet. Close it rather than render nothing into it.
      // ⚠️ closeRecap() fires the dialog's `close` event, whose listener calls
      // render() — so `rendering` is what stops this guard from re-entering
      // itself. It terminates either way (rcOpenId is null by then), but a
      // render that can call itself is a trap left lying around for later.
      if(rcOpenId){ var rv=byId(rcOpenId); if(!rv||!hasRecap(rv)) closeRecap(); }
      moveInk();
    }

    function setWorld(w){
      if(world===w) return;
      world=w; shelf=''; state=(w==='tt'?'':'todo'); selId=null; playing=null; noteOpen=false; noteDraft=null; starOnly=false;
      Array.prototype.forEach.call($('lbWorlds').querySelectorAll('.lb-w'),function(b){
        var on=b.getAttribute('data-world')===w;
        b.classList.toggle('on',on);
        b.setAttribute('aria-selected',on?'true':'false');
      });
      renderIngest();          // the only moment the ingest panel is rebuilt
      render();
      if(w==='tt') ttSweep(); else if(w==='yt') sweep();
    }

    /* ════════════════════════════════════════════════════════════
       WIRING
       ════════════════════════════════════════════════════════════ */
    $('lbWorlds').addEventListener('click',function(e){
      var b=e.target.closest('[data-world]'); if(b) setWorld(b.getAttribute('data-world'));
    });
    /* Debounced: a full render rebuilds the wall, the rail and the pane, and
       at a hundred items doing that on every keypress is felt. 110ms is below
       the point a person notices a delay and above the point a fast typist
       triggers ten renders for one word. */
    var seekTimer=null;
    $('seek').addEventListener('input',function(){
      seek=this.value; $('seekClr').classList.toggle('hidden',!seek);
      clearTimeout(seekTimer); seekTimer=setTimeout(render,110);
    });
    $('seekClr').addEventListener('click',function(){ seek=''; $('seek').value=''; this.classList.add('hidden'); render(); $('seek').focus(); });
    $('rail').addEventListener('click',function(e){
      var sr=e.target.closest('[data-star]'); if(sr){ starOnly=!starOnly; render(); return; }
      var s=e.target.closest('[data-st]'); if(s){ state=s.getAttribute('data-st'); render(); return; }
      var c=e.target.closest('[data-sh]'); if(c){ shelf=c.getAttribute('data-sh'); render(); return; }
    });
    $('main').addEventListener('click',function(e){
      var st=e.target.closest('[data-star]');
      if(st){ e.stopPropagation(); var sv=byId(st.getAttribute('data-star')); if(sv){ sv.star=!sv.star; sv.ts=Date.now(); saveItem(sv); render(); } return; }
      var ha=e.target.closest('[data-ha]');
      if(ha){ var hv=habits.find(function(x){return x.id===ha.getAttribute('data-ha');}); if(hv){ hv.adopted=!hv.adopted; hv.ts=Date.now(); persist(K_HAB,habits); flush(); render(); } return; }
      var dh=e.target.closest('[data-dh]');
      if(dh){ habits=habits.filter(function(x){return x.id!==dh.getAttribute('data-dh');}); persist(K_HAB,habits); flush(); render(); return; }
      // The Room's recap rows open the reading view directly rather than
      // selecting the tile — this list exists to be READ from, not browsed.
      var rr=e.target.closest('[data-rcread]');
      if(rr){ openRecap(rr.getAttribute('data-rcread')); return; }
      var t=e.target.closest('[data-id]'); if(t) select(t.getAttribute('data-id'));
    });
    // An expired TikTok cover leaves a broken frame; go and get a fresh one.
    $('main').addEventListener('error',function(e){
      var img=e.target; if(img&&img.tagName==='IMG'&&img.getAttribute('data-cover')) refreshCover(img.getAttribute('data-cover'));
    },true);

    $('pane').addEventListener('click',function(e){
      var el;
      var q=e.target.closest('[data-q]');
      if(q){ var qk=selId+':'+q.getAttribute('data-q'); if(qOpen[qk]) delete qOpen[qk]; else qOpen[qk]=1; renderPane(); return; }
      if((el=e.target.closest('[data-play]'))){ playing=el.getAttribute('data-play'); renderPane(); return; }
      if((el=e.target.closest('[data-open]'))){ var ov=byId(el.getAttribute('data-open')); if(ov){ setWorld(ov.ttId?'tt':'yt'); select(ov.id); } return; }
      if((el=e.target.closest('[data-remgot]'))){ var rv=byId(el.getAttribute('data-remgot')); if(rv){ recallKept(rv); render(); } return; }
      if((el=e.target.closest('[data-remlost]'))){ var lv=byId(el.getAttribute('data-remlost')); if(lv){ recallLost(lv); render(); } return; }
