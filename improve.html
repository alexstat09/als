      if((el=e.target.closest('[data-play]'))){ playing=el.getAttribute('data-play'); renderPane(); return; }
      if((el=e.target.closest('[data-open]'))){ var ov=byId(el.getAttribute('data-open')); if(ov){ setWorld(ov.ttId?'tt':'yt'); select(ov.id); } return; }
      if((el=e.target.closest('[data-remgot]'))){ var rv=byId(el.getAttribute('data-remgot')); if(rv){ rv.revisitTs=Date.now(); saveItem(rv); render(); } return; }
      if((el=e.target.closest('[data-watch]'))){ var wv=byId(el.getAttribute('data-watch')); if(wv){ wv.watched=!wv.watched; wv.ts=Date.now(); saveItem(wv); render(); } return; }
      if((el=e.target.closest('[data-star]'))){ var sv=byId(el.getAttribute('data-star')); if(sv){ sv.star=!sv.star; sv.ts=Date.now(); saveItem(sv); render(); } return; }
      if((el=e.target.closest('[data-editnote]'))){ noteOpen=true; noteDraft=null; renderPane(); return; }
      if((el=e.target.closest('[data-cancelnote]'))){ noteOpen=false; noteDraft=null; renderPane(); return; }
      if((el=e.target.closest('[data-savenote]'))){
        var nv=byId(el.getAttribute('data-savenote')), box=$('noteBox');
        if(nv&&box){ nv.note=box.value.trim(); nv.notes=nv.note; nv.keypoints=''; nv.kpFail=0; nv.ts=Date.now(); saveItem(nv); }
        noteOpen=false; noteDraft=null; render();
        if(nv&&isTikTok(nv)) ttSweep(); else sweep();
        return;
      }
      if((el=e.target.closest('[data-retry]'))){
        var tv=byId(el.getAttribute('data-retry'));
        if(tv){
          tv.kpFail=0; tv.metaFail=0; tv.err='';
          if(isTikTok(tv)&&!tv.handle) tv.pending=true;
          saveItem(tv); render();
          if(isTikTok(tv)) ttSweep(); else sweep();
        }
        return;
      }
      if((el=e.target.closest('[data-del]'))){
        var id=el.getAttribute('data-del'), dv=byId(id); if(!dv) return;
        if(isTikTok(dv)){ tiktoks=tiktoks.filter(function(x){return x.id!==id;}); persist(K_TT,tiktoks); }
        else { videos=videos.filter(function(x){return x.id!==id;}); persist(K_VID,videos); }
        flush(); closePane(); render(); return;
      }
    });
    $('status').addEventListener('click',function(e){
      if(e.target.closest('[data-pause]')){ setPaused(true); return; }
      if(e.target.closest('[data-resume]')){ setPaused(false); return; }
      if(e.target.closest('[data-dropunread]')){ dropUnread(); return; }
    });
    $('scrim').addEventListener('click',closePane);

    /* keyboard — this is a laptop page, so it earns real shortcuts */
    document.addEventListener('keydown',function(e){
      var tag=(e.target&&e.target.tagName)||'';
      var typing=tag==='INPUT'||tag==='TEXTAREA'||e.target.isContentEditable;
      if(e.key==='Escape'){ if(typing){ e.target.blur(); return; } if(selId) closePane(); else if(seek){ seek=''; $('seek').value=''; render(); } return; }
      if(typing) return;
      if(e.key==='/'){ e.preventDefault(); $('seek').focus(); $('seek').select(); return; }
      if(e.key==='1'){ setWorld('yt'); return; }
      if(e.key==='2'){ setWorld('tt'); return; }
      if(e.key==='3'){ setWorld('hb'); return; }
      if(world==='hb') return;
      if(e.key==='j'||e.key==='k'||e.key==='ArrowRight'||e.key==='ArrowLeft'){
        var list=shelved(scoped()).sort(function(a,b){
          if(world!=='tt' && !!a.watched!==!!b.watched) return a.watched?1:-1;
          if(world==='tt' && !!a.star!==!!b.star) return a.star?-1:1;
          return byOrd(a,b);
        });
        if(!list.length) return;
        var i=list.findIndex(function(v){ return v.id===selId; });
        var fwd=(e.key==='j'||e.key==='ArrowRight');
        i = i<0 ? (fwd?0:list.length-1) : Math.max(0,Math.min(list.length-1,i+(fwd?1:-1)));
        e.preventDefault(); select(list[i].id);
        var tile=$('main').querySelector('.tile.sel'); if(tile&&tile.scrollIntoView) tile.scrollIntoView({block:'nearest',behavior:'smooth'});
        return;
      }
      if(e.key==='Enter'&&selId){
        var sv=byId(selId);
        // TikTok opens where it actually looks good — a real tab.
        if(sv&&isTikTok(sv)&&sv.url) window.open(sv.url,'_blank','noopener');
        else { playing=selId; renderPane(); }
        return;
      }
    });
    window.addEventListener('resize',moveInk);

    render();
    // Give cloud sync a moment to land first — otherwise a fresh device would
    // spend its rate limit re-reading videos whose notes are already saved.
    setTimeout(function(){ if(!paused){ sweep(); ttSweep(); } }, 2500);

    document.addEventListener('visibilitychange',function(){ if(!document.hidden){ render(); if(!paused){ sweep(); ttSweep(); } } });
    window.addEventListener('storage',function(ev){ if(!ev||ev.key===K_VID||ev.key===K_TT||ev.key===K_HAB) render(); });
    document.addEventListener('DOMContentLoaded',function(){
      (function start(){ if(typeof window.initCloudSync!=='function'){ setTimeout(start,200); return; }
        window.initCloudSync({ appKey:'improve', syncedKeys:[K_VID,K_TT,K_HAB,K_PROF], onApplied:function(){ render(); sweep(); ttSweep(); } });
      })();
    });
    window.__im={ srcFromUrl:srcFromUrl, normUrl:normUrl, kpParse:kpParse, ttIdOf:ttIdOf, TT_RE:TT_RE,
      isTikTok:isTikTok, isLesson:isLesson, titleOf:titleOf, hay:hay, conceptOf:conceptOf,
      dueRemember:dueRemember, byOrd:byOrd, addTikToks:addTikToks, sortedList:sortedList,
      unreadIn:unreadIn, setPaused:setPaused, isPaused:function(){ return paused; }, K_PAUSE:K_PAUSE,
      removeItems:removeItems,
      setWorld:setWorld, render:render,
      _state:function(){ return { videos:videos, tiktoks:tiktoks, habits:habits, world:world, state:state, shelf:shelf }; },
      _set:function(v,h,t){ videos=v; habits=h; if(t) tiktoks=t; } };
  })();
  </script>
  <script src="nova.js" defer></script>
  <script src="nova-coach.js?v=20" defer></script>
