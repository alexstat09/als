<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Library · MÉTRON</title>
  <meta name="theme-color" content="#050506">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="aurora.css">
  <script src="water.js"></script>
  <script src="topbar.js" defer></script>
  <script src="als-dialog.js" defer></script>
  <!-- ⚠️ page-motion.js is deliberately NOT loaded here, unlike the other inner
       pages. It hides content behind `transform: translateY(18px)` until it
       scrolls into view, and this page is a three-pane app shell rather than a
       scrolling story: a shelf rail that reveals itself on scroll is wrong, and
       a transformed ancestor is exactly what breaks `position:fixed` children
       (hard constraint 4). Counting numbers use this page's own countTo(). -->
  <style>
    /* ════════════════════════════════════════════════════════════════
       THE LIBRARY — everything Alex keeps, in two worlds.

       Laptop-first ON PURPOSE. His words: "I will mostly use it at my
       laptop… it's literally just one scroll and unorganised." The old page
       was a 600px column of stacked cards, which is a phone page shown on a
       15-inch screen. This is a three-pane library:

         [ shelves ][ the wall ][ the one you're looking at ]

       The rail and the detail pane are `position: sticky`, not fixed — the
       page scrolls normally underneath the topbar and the bottom nav, and
       nothing has to fight either of them.

       Each world carries its own accent, all three drawn from the aurora
       palette so the page still belongs to MÉTRON: YouTube emerald-green,
       TikTok teal, Habits violet.
       ════════════════════════════════════════════════════════════════ */
    :root{ --gr:168,214,110; --acc:168,214,110; }
    *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html,body{ min-height:100%; }
    body{ background:var(--au-void,#050506); color:var(--au-ivory); font-family:var(--au-sans);
          padding:0 0 calc(86px + env(safe-area-inset-bottom)); }
    ::selection{ background:rgba(var(--acc),.24); }
    button,input,textarea{ font:inherit; color:inherit; }
    button{ background:none; border:none; cursor:pointer; }
    a{ color:inherit; }

    .lb{ max-width:1560px; margin:0 auto; padding:0 clamp(14px,2.4vw,36px); }

    /* ── masthead ─────────────────────────────────────────────── */
    .lb-top{ display:flex; align-items:flex-end; justify-content:space-between; gap:32px;
             padding:26px 2px 20px; flex-wrap:wrap; }
    .lb-eyebrow{ font-family:var(--au-mono); font-size:9.5px; letter-spacing:.24em; text-transform:uppercase;
                 color:rgba(var(--acc),.72); transition:color .5s var(--au-ease); }
    .lb-title{ font-family:var(--au-serif); font-weight:400; font-size:clamp(30px,3.4vw,46px);
               line-height:1.02; letter-spacing:-.015em; margin-top:9px; }
    .lb-title em{ font-style:italic; color:rgba(var(--acc),.94); transition:color .5s var(--au-ease); }
    .lb-sub{ font-size:12.5px; color:var(--au-dim); margin-top:10px; letter-spacing:.005em; }

    .lb-metrics{ display:flex; gap:clamp(16px,2vw,34px); align-items:flex-end; padding-bottom:4px; }
    .lb-met{ text-align:right; }
    .lb-met b{ display:block; font-family:var(--au-serif); font-size:clamp(24px,2.5vw,34px); font-weight:400;
               line-height:1; letter-spacing:-.01em; }
    .lb-met span{ display:block; font-family:var(--au-mono); font-size:8.5px; letter-spacing:.18em;
                  text-transform:uppercase; color:var(--au-faint); margin-top:7px; }

    /* ── the world switch ─────────────────────────────────────── */
    .lb-bar{ display:flex; align-items:center; gap:18px; flex-wrap:wrap;
             padding:0 2px 16px; border-bottom:1px solid var(--au-line); }
    /* The three segments are deliberately EQUAL width, so the travelling pill
       animates `transform` alone. Animating its width instead would relayout
       on every frame — the same rule the weight page's range selector follows. */
    .lb-worlds{ position:relative; display:flex; padding:3px;
                background:var(--au-glass); border:1px solid var(--au-line); border-radius:12px; }
    /* ⚠️ /4, not /3 — the Room made this four segments. The travelling pill is
       sized in CSS and only ever MOVED from JS, so this divisor and the number
       of buttons must change together or the pill stops covering the tab it is
       meant to be under. */
    .lb-worlds .ink{ position:absolute; top:3px; left:3px; width:calc((100% - 6px)/4); height:calc(100% - 6px); border-radius:9px;
                     background:rgba(var(--acc),.13); border:1px solid rgba(var(--acc),.3);
                     transition:transform .42s var(--au-ease), background .42s var(--au-ease), border-color .42s var(--au-ease);
                     pointer-events:none; }
    .lb-w{ position:relative; flex:1 1 0; min-width:104px; display:flex; align-items:center; justify-content:center;
           gap:8px; padding:8px 15px; border-radius:9px;
           font-size:12.5px; letter-spacing:.01em; color:var(--au-dim); transition:color .3s var(--au-ease); white-space:nowrap; }
    .lb-w:hover{ color:var(--au-ivory); }
    .lb-w.on{ color:var(--au-ivory); }
    .lb-w .n{ font-family:var(--au-mono); font-size:10px; color:var(--au-faint); }
    .lb-w.on .n{ color:rgba(var(--acc),.9); }

    .lb-seek{ position:relative; flex:1; min-width:190px; max-width:420px; }
    .lb-seek input{ width:100%; background:var(--au-glass); border:1px solid var(--au-line);
                    border-radius:11px; padding:10px 34px 10px 34px; font-size:12.5px; outline:none;
                    transition:border-color .3s var(--au-ease), background .3s var(--au-ease); }
    .lb-seek input:focus{ border-color:rgba(var(--acc),.4); background:var(--au-glass-2); }
    .lb-seek input::placeholder{ color:var(--au-faint); }
    .lb-seek .ic{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--au-faint); font-size:12px; pointer-events:none; }
    .lb-seek .kb{ position:absolute; right:11px; top:50%; transform:translateY(-50%); font-family:var(--au-mono);
                  font-size:9px; color:var(--au-faint); border:1px solid var(--au-line-2); border-radius:4px; padding:1px 5px; }
    .lb-seek .clr{ position:absolute; right:8px; top:50%; transform:translateY(-50%); color:var(--au-dim); font-size:13px; padding:4px 6px; }
    .lb-status{ display:flex; align-items:center; gap:8px; flex-wrap:wrap;
                font-family:var(--au-mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
                color:var(--au-faint); min-height:12px; }
    .lb-status .s-t{ color:var(--au-faint); }
    .lb-status .s-t.live{ color:rgba(var(--acc),.85); }
    /* A device that cannot save says so in the one colour this page reserves
       for "something is actually wrong". Not a toast — it must stay on screen
       for as long as it is true. */
    .lb-status .s-t.bad{ color:var(--au-coral); letter-spacing:.1em; text-transform:none;
                         font-family:var(--au-sans); font-size:11.5px; }
    .lb-status .s-b{ font-family:var(--au-mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase;
                     padding:4px 9px; border-radius:7px; border:1px solid var(--au-line-2); color:var(--au-dim);
                     transition:border-color .24s var(--au-ease), color .24s var(--au-ease), background .24s var(--au-ease); }
    .lb-status .s-b:hover{ border-color:rgba(var(--acc),.45); color:var(--au-ivory); background:var(--au-glass); }
    .lb-status .s-b.warn:hover{ border-color:rgba(255,107,139,.5); color:var(--au-rose); }
    /* The idle TikTok poster is a link out, not a player — see stageHTML(). */
    .pane-stage .over .watch{ font-family:var(--au-mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
                              font-weight:400; padding:9px 14px; border-radius:9px; color:var(--au-ivory);
                              background:rgba(8,8,10,.62); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.18);
                              transition:background .24s var(--au-ease), border-color .24s var(--au-ease); }
    .pane-stage:hover .over .watch{ background:rgba(var(--acc),.24); border-color:rgba(var(--acc),.5); }

    /* ── the three panes ──────────────────────────────────────── */
    .lb-body{ display:grid; grid-template-columns:214px minmax(0,1fr) 384px; gap:clamp(18px,2vw,34px); padding:22px 0 40px; align-items:start; }
    .lb-rail{ position:sticky; top:74px; }
    .lb-side{ position:sticky; top:74px; }
    /* ⚠️ NOTE FOR ANYONE TEMPTED TO "FIX" THE LAST 30px.
       A sticky item can only travel inside its containing block, and at the
       very bottom of the page that block always ends `100dvh − 126px` from the
       top (the grid's own padding plus the body's). A pane of `100dvh − 96px`
       needs its bottom at `74 + height`, which is further down than that — so
       at maximum page scroll the pane settles ~30px above its pin and the top
       of the thumbnail is clipped until you scroll back up.
       **A `min-height` on `.lb-main` does NOT fix this.** I measured it: travel
       is `row − pane`, but the block's bottom position at max scroll is
       independent of the row height, so the extra height buys nothing and
       costs a screenful of empty column under a short wall. The only real
       cures are shrinking the pane to `100dvh − 200px` (losing 104px of it on
       every screen) or living with 30px at one scroll extreme. Living with it,
       deliberately — the END of the pane, which is what Alex could not reach,
       is now always reachable. */
    /* Habits and the Room have no shelf rail. Emptying the <aside> was not
       enough — it is still the first grid item, so it kept claiming a column
       and left a 214px hole beside the content. It has to leave the grid. */
    body.no-rail .lb-rail{ display:none; }
    body.no-rail .lb-body{ grid-template-columns:minmax(0,1fr) 384px; }

    /* ── rail ─────────────────────────────────────────────────── */
    .rl-h{ font-family:var(--au-mono); font-size:8.5px; letter-spacing:.2em; text-transform:uppercase;
           color:var(--au-faint); margin:0 0 10px 10px; }
    .rl-h:not(:first-child){ margin-top:24px; }
    .rl-b{ display:flex; width:100%; align-items:center; gap:9px; padding:8px 10px; border-radius:9px;
           font-size:12.5px; color:var(--au-dim); text-align:left; letter-spacing:.005em;
           transition:background .22s var(--au-ease), color .22s var(--au-ease); }
    .rl-b:hover{ background:var(--au-glass); color:var(--au-ivory); }
    .rl-b.on{ background:rgba(var(--acc),.1); color:var(--au-ivory); }
    .rl-b .dot{ width:5px; height:5px; border-radius:50%; background:var(--au-faint); flex:none; transition:background .22s var(--au-ease); }
    .rl-b.on .dot{ background:rgb(var(--acc)); box-shadow:0 0 8px rgba(var(--acc),.6); }
    .rl-b .lab{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .rl-b .n{ font-family:var(--au-mono); font-size:10px; color:var(--au-faint); }
    .rl-b.on .n{ color:rgba(var(--acc),.85); }

    /* ── the wall ─────────────────────────────────────────────── */
    .wall{ display:grid; gap:clamp(12px,1.3vw,18px); }
    .wall.yt{ grid-template-columns:repeat(auto-fill,minmax(228px,1fr)); }
    .wall.tt{ grid-template-columns:repeat(auto-fill,minmax(152px,1fr)); }

    .tile{ position:relative; border-radius:13px; overflow:hidden; background:var(--au-glass);
           border:1px solid var(--au-line); cursor:pointer; text-align:left; width:100%;
           transition:border-color .3s var(--au-ease), transform .3s var(--au-ease), background .3s var(--au-ease); }
    .tile:hover{ border-color:rgba(var(--acc),.32); transform:translateY(-3px); background:var(--au-glass-2); }
    .tile.sel{ border-color:rgba(var(--acc),.62); }
    .tile.sel::after{ content:''; position:absolute; inset:0; border-radius:13px; pointer-events:none;
                      box-shadow:0 0 0 1px rgba(var(--acc),.45), 0 14px 40px -14px rgba(var(--acc),.5); }
    .tile .ph{ position:relative; display:block; width:100%; background:#0c0c0e; overflow:hidden; }
    .wall.yt .tile .ph{ aspect-ratio:16/9; }
    .wall.tt .tile .ph{ aspect-ratio:9/16; }
    /* A checked lesson earns two columns of the TikTok wall (see isBig).
       ⚠️ The poster keeps 9:16 or a double-width tile would be enormous, so the
       extra width goes to the words — which is the point of promoting it. */
    .wall.tt .tile.big{ grid-column:span 2; }
    .wall.tt .tile.big .ph{ aspect-ratio:16/11; }
    .wall.tt .tile.big .t{ font-size:13px; -webkit-line-clamp:3; }
    .wall.tt .tile.big .core{ -webkit-line-clamp:3; }
    /* ⚠️ A span of 2 on a grid that only HAS one column creates an implicit
       second track and pushes the page sideways — and this page must never
       scroll horizontally. The TikTok wall is auto-fill/minmax(126px), so it
       drops to a single column only below ~280px of content, narrower than any
       real phone. The guard sits there rather than at 420px, because on a
       393px phone the wall is two columns and a full-width lesson is exactly
       the hierarchy working, not a bug. */
    @media (max-width:300px){ .wall.tt .tile.big{ grid-column:auto; } .wall.tt .tile.big .ph{ aspect-ratio:9/16; } }
    .tile .ph img{ width:100%; height:100%; object-fit:cover; display:block;
                   transition:transform .6s var(--au-ease), opacity .4s var(--au-ease); }
    .tile:hover .ph img{ transform:scale(1.045); }
    .tile.done .ph img{ opacity:.4; filter:saturate(.5); }
    .tile .scrim{ position:absolute; inset:0; pointer-events:none;
                  background:linear-gradient(to top, rgba(4,4,5,.94) 0%, rgba(4,4,5,.62) 26%, rgba(4,4,5,0) 58%); }
    .tile .cap{ position:absolute; left:0; right:0; bottom:0; padding:10px 11px; }
    .tile .t{ font-size:12px; line-height:1.32; letter-spacing:.005em; color:var(--au-ivory);
              display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .tile .m{ font-family:var(--au-mono); font-size:8.5px; letter-spacing:.1em; color:rgba(245,242,236,.5);
              margin-top:5px; text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tile .badge{ position:absolute; top:8px; left:8px; font-family:var(--au-mono); font-size:8px; letter-spacing:.14em;
                  text-transform:uppercase; padding:3px 6px; border-radius:5px; backdrop-filter:blur(8px);
                  background:rgba(8,8,10,.66); border:1px solid var(--au-line-2); color:var(--au-dim); }
    .tile .badge.lesson{ color:rgb(var(--acc)); border-color:rgba(var(--acc),.4); background:rgba(var(--acc),.14); }
    .tile .badge.reading{ color:var(--au-faint); }
    .tile .badge.miss{ color:var(--au-coral); border-color:rgba(255,138,107,.35); }
    /* Read before the reader could grade — amber, because it is not broken and
       it is not trusted either. It clears itself when the re-read lands. */
    .tile .badge.old{ color:var(--au-amber); border-color:rgba(240,190,110,.34); background:rgba(240,190,110,.1); }
    .pane-kind.old{ color:var(--au-amber); border-color:rgba(240,190,110,.4); background:rgba(240,190,110,.1); }
    .tile .star{ position:absolute; top:6px; right:6px; padding:4px 6px; font-size:12px; line-height:1;
                 color:rgba(245,242,236,.34); text-shadow:0 1px 6px rgba(0,0,0,.7);
                 transition:color .25s var(--au-ease), transform .25s var(--au-ease); }
    .tile .star:hover{ color:var(--au-ivory); transform:scale(1.16); }
    .tile .star.on{ color:var(--au-amber); }
    .tile .dur{ position:absolute; right:7px; bottom:auto; top:8px; }
    .tile .play{ position:absolute; inset:0; display:grid; place-items:center; opacity:0; transition:opacity .3s var(--au-ease); }
    .tile:hover .play{ opacity:1; }
    .tile .play span{ width:42px; height:42px; border-radius:50%; display:grid; place-items:center;
                      background:rgba(8,8,10,.6); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.16);
                      font-size:12px; padding-left:3px; }
    .tile .core{ font-size:11px; line-height:1.4; color:rgba(245,242,236,.68); margin-top:6px;
                 display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

    /* ── the detail pane ──────────────────────────────────────── */
    /* ⚠️⚠️ `overscroll-behavior: contain` USED TO BE HERE, AND IT MADE THE END
       OF THIS PANE UNREACHABLE. Alex: *"on some videos it doesn't let me
       scroll to the very end where i can press that i watched it."*

       Measured rather than guessed. The pane is `max-height: 100dvh - 96px`
       and its container is `position: sticky; top: 74px` — but the pane starts
       at y≈216 (below the page header), so **its bottom sits ~120px below the
       fold until the PAGE scrolls** and the sticky pins. `contain` blocks
       scroll chaining, so the wheel over the pane scrolled its inner content
       to the end and then simply stopped: the page never moved, the sticky
       never pinned, and the last 120px — which is exactly where "Mark watched"
       and "Remove" live — could not be reached at all.

       It only ever bit on videos whose pane content OVERFLOWS, because a box
       with no scroll range chains anyway. That is precisely his "some videos".

       Chaining is the correct behaviour for a scroll region inside a page: run
       out of pane, scroll the page, the sticky pins, the end comes into view.
       ⚠️ `100dvh`, not `100vh` — on iOS `100vh` counts the retracted toolbar,
       which parks the same buttons under the browser chrome. */
    .pane{ border:1px solid var(--au-line); border-radius:16px; background:var(--au-glass);
           overflow:hidden; max-height:calc(100dvh - 96px); overflow-y:auto; }
    .pane::-webkit-scrollbar{ width:7px; } .pane::-webkit-scrollbar-thumb{ background:var(--au-line-2); border-radius:4px; }
    .pane-stage{ position:relative; display:block; width:100%; background:#08080a; text-decoration:none; }
    .pane-stage iframe{ width:100%; height:100%; border:0; display:block; position:absolute; inset:0; }
    .pane-stage.yt{ aspect-ratio:16/9; }
    .pane-stage.tt{ aspect-ratio:9/16; max-height:52vh; }
    /* ⚠️ A 9:16 poster at full width pushed every key point below the fold —
       the pane's whole job is the takeaways, not the artwork. Idle, a TikTok
       shows a cropped banner; it only claims the height once it is playing. */
    .pane-stage.tt.idle{ aspect-ratio:16/10; max-height:190px; }
    .pane-stage img{ width:100%; height:100%; object-fit:cover; display:block; }
    .pane-stage .over{ position:absolute; inset:0; display:grid; place-items:center;
                       background:linear-gradient(to top, rgba(4,4,5,.8), rgba(4,4,5,.15)); }
    .pane-stage .over span{ width:52px; height:52px; border-radius:50%; display:grid; place-items:center;
                            background:rgba(8,8,10,.62); backdrop-filter:blur(10px);
                            border:1px solid rgba(255,255,255,.18); font-size:14px; padding-left:3px; }
    .pane-in{ padding:16px 17px 20px; }
    .pane-kind{ display:inline-flex; align-items:center; gap:7px; font-family:var(--au-mono); font-size:8.5px;
                letter-spacing:.18em; text-transform:uppercase; padding:4px 8px; border-radius:6px;
                border:1px solid var(--au-line-2); color:var(--au-dim); }
    .pane-kind.lesson{ color:rgb(var(--acc)); border-color:rgba(var(--acc),.4); background:rgba(var(--acc),.1); }
    .pane-t{ font-size:14px; line-height:1.4; margin-top:11px; letter-spacing:.005em; }
    .pane-m{ font-family:var(--au-mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase;
             color:var(--au-faint); margin-top:8px; }
    .pane-core{ font-family:var(--au-serif); font-size:19px; line-height:1.34; letter-spacing:-.005em;
                margin-top:16px; padding-left:13px; border-left:2px solid rgba(var(--acc),.5); }
    .pane-keys{ list-style:none; margin-top:16px; display:flex; flex-direction:column; gap:10px; }
    .pane-keys li{ position:relative; padding-left:17px; font-size:12.5px; line-height:1.52; color:rgba(245,242,236,.84); }
    .pane-keys li::before{ content:''; position:absolute; left:2px; top:8px; width:4px; height:4px;
                           border-radius:50%; background:rgba(var(--acc),.7); }
    .pane-keys li.has-q{ cursor:pointer; }
    .pane-keys li.has-q:hover{ color:var(--au-ivory); }
    .pane-keys li .q{ display:none; margin-top:8px; padding:9px 11px; border-radius:9px;
                      background:rgba(0,0,0,.3); border-left:2px solid rgba(var(--acc),.35);
                      font-family:var(--au-serif); font-size:13px; line-height:1.55; color:var(--au-dim); }
    .pane-keys li .q.on{ display:block; }
    .pane-hint{ font-family:var(--au-mono); font-size:8.5px; letter-spacing:.16em; text-transform:uppercase;
                color:var(--au-faint); margin-top:11px; }
    .pane-do{ margin-top:16px; padding:12px 13px; border-radius:11px; background:rgba(var(--acc),.07);
              border:1px solid rgba(var(--acc),.2); font-size:12.5px; line-height:1.5; }
    .pane-do b{ display:block; font-family:var(--au-mono); font-size:8.5px; letter-spacing:.18em;
                text-transform:uppercase; color:rgba(var(--acc),.9); margin-bottom:6px; font-weight:400; }
    .pane-src{ margin-top:16px; font-size:11px; line-height:1.5; color:var(--au-faint);
               padding-top:13px; border-top:1px solid var(--au-line); }
    .pane-acts{ display:flex; flex-wrap:wrap; gap:7px; margin-top:15px; }
    .pane-note{ margin-top:14px; }
    .pane-note textarea{ width:100%; min-height:74px; resize:vertical; background:var(--au-glass);
                         border:1px solid var(--au-line); border-radius:10px; padding:10px 11px;
                         font-size:12.5px; line-height:1.5; outline:none; }
    .pane-note textarea:focus{ border-color:rgba(var(--acc),.4); }
    .pane-empty{ padding:26px 18px; text-align:center; font-size:12.5px; color:var(--au-faint); line-height:1.6; }

    details.tx{ margin-top:14px; }
    details.tx > summary{ cursor:pointer; list-style:none; font-family:var(--au-mono); font-size:9px;
                          letter-spacing:.16em; text-transform:uppercase; color:var(--au-dim); padding:8px 0; }
    details.tx > summary::-webkit-details-marker{ display:none; }
    details.tx > summary:hover{ color:var(--au-ivory); }
    details.tx .body{ font-size:12px; line-height:1.72; color:var(--au-dim); max-height:270px; overflow-y:auto;
                      padding:11px 12px; background:rgba(0,0,0,.28); border-radius:10px; border:1px solid var(--au-line); }

    /* ════════════════════════════════════════════════════════════
       THE RECAP — a reading page, not a panel.

       His brief: *"i watch a video, i look at the recap, i remember, and
       whenever i feel like i need a refresh, i rewatch the recap and it has
       everything i need to remember from the video, not tiny pieces."*

       That is a document, and a 700-word document read down a 340px side pane
       is a worse experience than the video. So the recap opens as a full
       reading view over the library: one centred measure, serif body, the
       generous leading of something meant to be READ rather than scanned.
       The pane keeps a preview and the button; this is where the reading is.

       ⚠️ THREE CONSTRAINTS CONVERGE ON THIS ELEMENT, and all three are silent
       when broken, so none of them may be simplified away:
       · constraint 4a — a native <dialog> + showModal(), never a hand-rolled
         overlay, because an ancestor transform breaks position:fixed.
       · constraint 4b — this page has a global `*{margin:0}` (line 42), which
         kills the UA's own `dialog{margin:auto}` centering. Hence the explicit
         margin below. Deleting it parks the reading view in the top-left.
       · constraint 4c — `display` is scoped to `[open]`. A bare
         `dialog.rc{display:flex}` beats `dialog:not([open]){display:none}` and
         leaves the recap permanently on screen. */
    dialog.rc{ margin:auto; width:min(760px,94vw); max-width:94vw; max-height:92vh; padding:0;
               border:1px solid var(--au-line); border-radius:18px; background:var(--au-void,#0a0a0c);
               color:var(--au-ivory); overflow:hidden; }
    dialog.rc[open]{ display:flex; flex-direction:column; }
    dialog.rc::backdrop{ background:rgba(4,4,6,.82); backdrop-filter:blur(7px); }
    .rc-top{ display:flex; align-items:flex-start; gap:14px; padding:20px 24px 15px;
             border-bottom:1px solid var(--au-line); flex:0 0 auto; }
    .rc-top .grow{ min-width:0; }
    .rc-eyebrow{ font-family:var(--au-mono); font-size:8.5px; letter-spacing:.2em; text-transform:uppercase;
                 color:rgba(var(--acc),.9); }
    .rc-h{ font-family:var(--au-serif); font-weight:400; font-size:clamp(19px,2.2vw,25px); line-height:1.22;
           letter-spacing:-.01em; margin-top:8px; }
    .rc-meta{ font-family:var(--au-mono); font-size:9px; letter-spacing:.13em; text-transform:uppercase;
              color:var(--au-faint); margin-top:9px; }
    .rc-x{ flex:0 0 auto; width:32px; height:32px; border-radius:9px; border:1px solid var(--au-line-2);
           color:var(--au-dim); font-size:15px; line-height:1; background:none; cursor:pointer;
           transition:color .25s var(--au-ease), border-color .25s var(--au-ease); }
    .rc-x:hover{ color:var(--au-ivory); border-color:rgba(var(--acc),.45); }
    /* showModal() autofocuses the first focusable child, so without this the
       ✕ opened wearing Chrome's blue focus ring — the one UA colour in a page
       that has no blue in it. Caught in a screenshot, invisible to assertions. */
    .rc-x:focus{ outline:none; }
    .rc-x:focus-visible{ outline:2px solid rgba(var(--acc),.6); outline-offset:2px; }
    .rc-body:focus{ outline:none; }
    /* ⚠️ constraint 13 — a SCROLLING flex child never gets `flex:1` against a
       container whose height is indefinite. `flex:1` is `flex:1 1 0%`, and iOS
       Safari resolves that basis to ZERO against a max-height parent while
       Chrome looks perfect. That is exactly how the caffeine log sheet shipped
       a header, a search box and no drinks at all on his phone. */
    .rc-body{ flex:1 1 auto; min-height:0; max-height:none; overflow-y:auto; padding:24px 24px 30px;
              -webkit-overflow-scrolling:touch; }
    .rc-core{ font-family:var(--au-serif); font-size:clamp(17px,1.8vw,20px); line-height:1.42;
              letter-spacing:-.005em; padding-left:15px; border-left:2px solid rgba(var(--acc),.55); }
    .rc-open{ margin-top:22px; }
    .rc-p{ font-size:14.5px; line-height:1.78; color:rgba(245,242,236,.87); letter-spacing:.002em; }
    .rc-p + .rc-p{ margin-top:13px; }
    .rc-open .rc-p{ font-family:var(--au-serif); font-size:15.5px; line-height:1.72; color:rgba(245,242,236,.8); }
    .rc-sec{ margin-top:28px; padding-top:22px; border-top:1px solid var(--au-line); }
    .rc-sec:first-of-type{ border-top:none; }
    .rc-sh{ font-family:var(--au-mono); font-size:9.5px; letter-spacing:.2em; text-transform:uppercase;
            color:rgba(var(--acc),.85); margin-bottom:11px; }
    .rc-facts{ margin-top:30px; padding:19px 20px; border-radius:13px; background:rgba(var(--acc),.055);
               border:1px solid rgba(var(--acc),.19); }
    .rc-facts h4{ font-family:var(--au-mono); font-size:8.5px; letter-spacing:.2em; text-transform:uppercase;
                  color:rgba(var(--acc),.9); font-weight:400; margin-bottom:13px; }
    .rc-facts ul{ list-style:none; display:flex; flex-direction:column; gap:10px; }
    .rc-facts li{ position:relative; padding-left:17px; font-size:13.5px; line-height:1.58;
                  color:rgba(245,242,236,.88); }
    .rc-facts li::before{ content:''; position:absolute; left:2px; top:8px; width:4px; height:4px;
                          border-radius:50%; background:rgba(var(--acc),.75); }
    .rc-src{ margin-top:26px; padding-top:16px; border-top:1px solid var(--au-line);
             font-size:11px; line-height:1.62; color:var(--au-faint); }
    .rc-foot{ display:flex; flex-wrap:wrap; gap:7px; padding:14px 24px calc(16px + env(safe-area-inset-bottom));
              border-top:1px solid var(--au-line); flex:0 0 auto; background:rgba(0,0,0,.25); }
    @media(max-width:560px){
      dialog.rc{ width:100vw; max-width:100vw; height:100dvh; max-height:100dvh; border-radius:0; border:none; }
      .rc-top{ padding:16px 17px 13px; } .rc-body{ padding:19px 17px 26px; } .rc-foot{ padding:12px 17px calc(14px + env(safe-area-inset-bottom)); }
    }

    /* the pane's own recap block — a doorway, never the document */
    .pane-recap{ margin-top:16px; padding:14px 14px 13px; border-radius:12px;
                 background:rgba(var(--acc),.06); border:1px solid rgba(var(--acc),.2); }
    .pane-recap .lab{ display:block; font-family:var(--au-mono); font-size:8.5px; letter-spacing:.18em;
                      text-transform:uppercase; color:rgba(var(--acc),.9); margin-bottom:7px; }
    .pane-recap .core{ font-family:var(--au-serif); font-size:15px; line-height:1.42; color:var(--au-ivory); }
    .pane-recap .sub{ font-family:var(--au-mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase;
                      color:var(--au-faint); margin-top:9px; }
    .badge.recap{ background:rgba(var(--acc),.9); color:#07120a; }

    /* ── buttons ──────────────────────────────────────────────── */
    /* ⚠️ `text-decoration:none` found by LOOKING at a render, not by any
       assertion. `.b` is worn by both <button> and <a> — "Open ↗" in the pane
       and "Open the video ↗" in the recap footer are anchors — and without
       this the anchors carry the UA underline while their <button> siblings,
       sitting 6px away in the same row, do not. It has been true for the whole
       life of this page. */
    .b{ padding:7px 12px; border-radius:9px; border:1px solid var(--au-line-2); font-size:11.5px;
        color:var(--au-dim); letter-spacing:.01em; text-decoration:none;
        transition:all .24s var(--au-ease); }
    .b:focus-visible{ outline:2px solid rgba(var(--acc),.6); outline-offset:2px; }
    .b:hover{ border-color:rgba(var(--acc),.4); color:var(--au-ivory); background:var(--au-glass); }
    .b.on{ border-color:rgba(var(--acc),.5); color:rgb(var(--acc)); background:rgba(var(--acc),.1); }
    .b.prime{ background:rgba(var(--acc),.15); border-color:rgba(var(--acc),.42); color:var(--au-ivory); }
    .b.prime:hover{ background:rgba(var(--acc),.24); }
    .b.warn:hover{ border-color:rgba(255,107,139,.5); color:var(--au-rose); }
    .b[disabled]{ opacity:.45; pointer-events:none; }

    /* ── ingest ───────────────────────────────────────────────── */
    .ing{ border:1px solid var(--au-line); border-radius:14px; background:var(--au-glass);
          padding:14px 15px; margin-bottom:clamp(14px,1.6vw,20px); }
    .ing h3{ font-family:var(--au-serif); font-weight:400; font-size:17px; letter-spacing:-.005em; }
    .ing p{ font-size:11.5px; color:var(--au-faint); margin-top:5px; line-height:1.55; }
    .ing textarea, .ing input{ width:100%; background:rgba(0,0,0,.3); border:1px solid var(--au-line);
                               border-radius:10px; padding:10px 12px; font-size:12.5px; outline:none;
                               margin-top:11px; line-height:1.5; }
    .ing textarea{ min-height:78px; resize:vertical; font-family:var(--au-mono); font-size:11px; }
    .ing textarea:focus,.ing input:focus{ border-color:rgba(var(--acc),.4); }
    .ing-row{ display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap; }
    .ing-msg{ font-size:11.5px; color:var(--au-dim); line-height:1.5; }
    .ing-msg.bad{ color:var(--au-coral); }
    .ing-fold{ display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; }
    .ing-fold .chev{ color:var(--au-faint); font-size:11px; transition:transform .3s var(--au-ease); }
    .ing.open .ing-fold .chev{ transform:rotate(180deg); }
    .ing-hide{ display:none; } .ing.open .ing-hide{ display:block; }

    /* ── habits ───────────────────────────────────────────────── */
    .hb{ display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:14px; }
    .hb-c{ border:1px solid var(--au-line); border-radius:14px; background:var(--au-glass); padding:15px 16px;
           display:flex; gap:12px; align-items:flex-start; transition:border-color .3s var(--au-ease); }
    .hb-c:hover{ border-color:rgba(var(--acc),.28); }
    .hb-c.done{ opacity:.62; }
    .hb-ck{ width:19px; height:19px; border-radius:6px; border:1.5px solid var(--au-line-2); flex:none;
            display:grid; place-items:center; font-size:10px; color:#07110b; margin-top:1px;
            transition:all .25s var(--au-ease); cursor:pointer; }
    .hb-ck.on{ background:rgb(var(--acc)); border-color:rgb(var(--acc)); }
    .hb-t{ font-size:13px; line-height:1.4; }
    .hb-c.done .hb-t{ text-decoration:line-through; text-decoration-color:var(--au-faint); }
    .hb-w{ font-size:11.5px; color:var(--au-faint); margin-top:6px; line-height:1.5; }
    .hb-x{ margin-left:auto; color:var(--au-faint); font-size:12px; padding:2px 5px; align-self:flex-start; }
    .hb-x:hover{ color:var(--au-rose); }
    .hb-go{ color:rgba(var(--acc),.85); text-decoration:none; border-bottom:1px solid rgba(var(--acc),.28); }
    .hb-go:hover{ color:rgb(var(--acc)); border-bottom-color:rgba(var(--acc),.7); }

    /* ── THE ROOM ─────────────────────────────────────────────────
       Deliberately NOT a grid. The other worlds are things; this is thought,
       and thought is set in the serif at a measure you can actually read
       (max-width on the idea itself, never the full 1560px shell). */
    .rm-sec{ padding:0 0 30px; }
    .rm-sec + .rm-sec{ border-top:1px solid var(--au-line); padding-top:24px; }
    .rm-h{ font-family:var(--au-mono); font-size:9px; letter-spacing:.22em; text-transform:uppercase;
           color:rgba(var(--acc),.82); margin-bottom:16px; display:flex; align-items:center; gap:9px; }
    .rm-n{ font-family:var(--au-mono); font-size:9px; letter-spacing:.14em; color:var(--au-faint);
           border:1px solid var(--au-line-2); border-radius:5px; padding:2px 6px; }
    .rm-idea{ display:block; width:100%; text-align:left; padding:13px 15px; border-radius:11px;
              border:1px solid transparent; background:none; margin-bottom:3px;
              transition:background .24s var(--au-ease), border-color .24s var(--au-ease); }
    .rm-idea:hover{ background:var(--au-glass); border-color:var(--au-line); }
    .rm-idea.sel{ background:rgba(var(--acc),.08); border-color:rgba(var(--acc),.42); }
    .rm-core{ display:block; font-family:var(--au-serif); font-size:clamp(16px,1.5vw,19px); line-height:1.44;
              letter-spacing:-.005em; color:var(--au-ivory); max-width:64ch; }
    .rm-from{ display:block; font-family:var(--au-mono); font-size:8.5px; letter-spacing:.14em;
              text-transform:uppercase; color:var(--au-faint); margin-top:9px; }
    .rm-due{ border-left:2px solid rgba(var(--acc),.55); padding-left:16px; }
    .rm-due .rm-core{ font-size:clamp(18px,1.8vw,22px); }
    .rm-keys{ list-style:none; margin-top:13px; display:flex; flex-direction:column; gap:8px; }
    .rm-keys li{ position:relative; padding-left:16px; font-size:12.5px; line-height:1.55; color:rgba(245,242,236,.8); max-width:70ch; }
    .rm-keys li::before{ content:''; position:absolute; left:2px; top:8px; width:4px; height:4px;
                         border-radius:50%; background:rgba(var(--acc),.7); }
    .rm-acts{ list-style:none; display:flex; flex-direction:column; gap:9px; }
    .rm-act{ display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:11px;
             border:1px solid var(--au-line); background:var(--au-glass); }
    .rm-act.done{ opacity:.55; }
    .rm-act.done .rm-act-t{ text-decoration:line-through; text-decoration-color:var(--au-faint); }
    .rm-act-b{ flex:1; min-width:0; }
    .rm-act-t{ font-size:13px; line-height:1.45; }
    .rm-act-m{ font-family:var(--au-mono); font-size:8.5px; letter-spacing:.13em; text-transform:uppercase;
               color:var(--au-faint); margin-top:6px; }

    /* ── the "now" pane (nothing selected) ────────────────────── */
    .now-h{ font-family:var(--au-mono); font-size:8.5px; letter-spacing:.2em; text-transform:uppercase;
            color:rgba(var(--acc),.8); }
    .now-big{ font-family:var(--au-serif); font-size:21px; line-height:1.24; margin-top:11px; letter-spacing:-.005em; }
    .now-sub{ font-size:11.5px; color:var(--au-faint); margin-top:8px; font-family:var(--au-mono);
              letter-spacing:.1em; text-transform:uppercase; }
    .now-sec{ padding:17px 18px; }
    .now-sec + .now-sec{ border-top:1px solid var(--au-line); }
    .now-bar{ height:2px; border-radius:2px; background:var(--au-line-2); overflow:hidden; margin-top:14px; }
    .now-bar i{ display:block; height:100%; width:100%; transform:scaleX(0); transform-origin:left center;
                background:linear-gradient(90deg,rgba(var(--acc),.5),rgb(var(--acc)));
                transition:transform 1.1s var(--au-ease); }

    /* Only ever visible on the narrow layout, where the detail pane is a sheet.
       Declared here too so a class JS toggles is never a class CSS lacks. */
    .lb-scrim{ display:none; }
    .empty{ padding:46px 20px; text-align:center; color:var(--au-faint); font-size:12.5px; line-height:1.7; }
    .empty b{ display:block; font-family:var(--au-serif); font-size:20px; color:var(--au-dim);
              font-weight:400; margin-bottom:10px; }
    .hidden{ display:none !important; }

    /* ── the reading pulse ────────────────────────────────────── */
    @keyframes lbPulse{ 0%,100%{opacity:.32;} 50%{opacity:.85;} }
    .pulse{ animation:lbPulse 1.9s ease-in-out infinite; }
    @media (prefers-reduced-motion:reduce){
      .pulse{ animation:none; }
      .tile,.tile .ph img{ transition:none !important; }
      .tile:hover{ transform:none; }
    }

    /* ── narrower laptops, tablets, phone ─────────────────────── */
    @media (max-width:1280px){
      .lb-body{ grid-template-columns:190px minmax(0,1fr) 330px; }
      body.no-rail .lb-body{ grid-template-columns:minmax(0,1fr) 330px; }
    }
    @media (max-width:1040px){
      /* The detail pane stops being a column and becomes a sheet over the
         wall. It is a direct child of <body>, never of a transformed
         ancestor — hard constraint 4. */
      .lb-body{ grid-template-columns:180px minmax(0,1fr); }
      body.no-rail .lb-body{ grid-template-columns:minmax(0,1fr); }
      /* ⚠️ The sheet ends at `bottom:0`, which on a phone is under the home
         indicator and, on iOS, under the browser's own bottom chrome — so the
         final row of buttons was the part you could never quite reach here
         either. The safe-area inset is the whole fix; there is no scroll bug
         to chase on this side, only a strip nobody could tap. */
      .lb-side{ position:fixed; z-index:60; right:0; top:0; bottom:0; width:min(420px,92vw);
                padding:14px 14px calc(28px + env(safe-area-inset-bottom));
                overflow-y:auto; -webkit-overflow-scrolling:touch;
                background:rgba(6,6,8,.96); backdrop-filter:blur(22px);
                border-left:1px solid var(--au-line-2); transform:translateX(102%);
                transition:transform .42s var(--au-ease); }
      .lb-side.open{ transform:none; }
      .pane{ max-height:none; border:none; background:none; }
      .lb-scrim{ display:block; position:fixed; inset:0; z-index:59; background:rgba(2,2,3,.6); backdrop-filter:blur(3px);
                 opacity:0; pointer-events:none; transition:opacity .35s var(--au-ease); }
      .lb-scrim.on{ opacity:1; pointer-events:auto; }
    }
    @media (max-width:760px){
      .lb-body{ grid-template-columns:minmax(0,1fr); gap:14px; }
      /* The shelves become a scrolling chip row above the wall. */
      .lb-rail{ position:static; display:flex; gap:7px; overflow-x:auto; padding-bottom:4px;
                scrollbar-width:none; }
      .lb-rail::-webkit-scrollbar{ display:none; }
      .rl-h{ display:none; }
      .rl-b{ width:auto; flex:none; border:1px solid var(--au-line); border-radius:999px; padding:7px 13px; }
      .rl-b .dot{ display:none; }
      .lb-top{ padding:18px 2px 14px; }
      .lb-metrics{ gap:20px; }
      .wall.tt{ grid-template-columns:repeat(auto-fill,minmax(126px,1fr)); }
      .wall.yt{ grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); }
      .lb-seek{ max-width:none; }
      .lb-seek .kb{ display:none; }
      /* Four segments do not fit a 393px phone at the laptop's 104px minimum
         (4 × 104 + padding overflows), so on a narrow screen they share the
         width evenly instead of each claiming a floor. The pill is still
         (100% - 6px)/4, so it keeps covering exactly one of them. */
      .lb-worlds{ width:100%; }
      .lb-w{ min-width:0; padding:8px 6px; font-size:11.5px; gap:5px; }
      .lb-w .n{ font-size:9px; }
    }
  </style>
</head>
<body class="au-bg">
  <div class="lb">
    <header class="lb-top">
      <div class="lb-id">
        <div class="lb-eyebrow" id="lbEyebrow">MÉTRON · LIBRARY</div>
        <h1 class="lb-title">Everything worth <em id="lbTitleEm">keeping</em></h1>
        <p class="lb-sub" id="lbSub">A queue of things worth learning, the TikToks you saved, and the habits you're growing into.</p>
      </div>
      <div class="lb-metrics" id="lbMetrics"></div>
    </header>

    <div class="lb-bar">
      <nav class="lb-worlds" id="lbWorlds" role="tablist">
        <div class="ink" id="lbInk"></div>
        <button type="button" class="lb-w on" data-world="yt" role="tab" aria-selected="true">YouTube <span class="n" id="nYt">0</span></button>
        <button type="button" class="lb-w" data-world="tt" role="tab" aria-selected="false">TikTok <span class="n" id="nTt">0</span></button>
        <button type="button" class="lb-w" data-world="rm" role="tab" aria-selected="false">The Room <span class="n" id="nRm">0</span></button>
        <button type="button" class="lb-w" data-world="hb" role="tab" aria-selected="false">Habits <span class="n" id="nHb">0</span></button>
      </nav>

        <span class="kb" id="seekKb">/</span>

    </div>

    <div class="lb-body">
      <aside class="lb-rail" id="rail"></aside>
      <main class="lb-main" id="main">
        <!-- The ingest panel and the wall are separate containers ON PURPOSE.
             The background reader re-renders the wall every few seconds; if the
             paste box lived inside it, a sweep finishing would silently wipe

  </div>

  <!-- The recap reading view. Native <dialog> on purpose (hard constraint 4):
       this page's wall sits inside transformed ancestors, and a hand-rolled
       fixed overlay renders off-frame there. Filled by renderRecap(). -->
  <dialog class="rc" id="rcDlg" aria-labelledby="rcTitle"></dialog>

  <script>
  (function(){
    'use strict';
    /* ════════════════════════════════════════════════════════════
       Two worlds, one shell. The YouTube half keeps every behaviour it
       had — playlist mirror, background reader, shelves, Sharpen,
       Remember — because a redesign that quietly drops features is a
       downgrade. The TikTok half is new, and honest about what it can
       and cannot know (see api/_tiktok.js).
       ════════════════════════════════════════════════════════════ */
    var K_VID='improve:videos', K_TT='improve:tiktoks', K_HAB='improve:habits', K_PROF='improve:profile';
    /* ⭐ THE OUTBOX. Every lesson in this library ends in a DO line — "one small
       concrete thing to try this week" — and until now that line was rendered
       in a box and died there. The Library was the only page in MÉTRON that
       MANUFACTURES intentions and the only one with nowhere to put them.

       ⚠️ It is a store this page OWNS, deliberately. Writing into `coach:focus`
       or `habits:list` from here would be a write to a key another page's sync
       engine owns: this page's engine does not match those keys, so the write
       would never push, and the owning page would later push its own copy
       straight over it. A store is written by its owner or it is not written.
       Anything that has to reach another page leaves through a LINK, and that
       page creates the row through its own save path (see the habits world). */
    var K_ACT='improve:actions';

    function $(id){ return document.getElementById(id); }
    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
    function loadArr(k){ var a; try{ a=JSON.parse(localStorage.getItem(k)); }catch(e){ a=null; } return Array.isArray(a)?a.filter(function(x){return x&&x.id;}):[]; }
    function loadObj(k){ var o; try{ o=JSON.parse(localStorage.getItem(k)); }catch(e){ o=null; } return (o&&typeof o==='object'&&!Array.isArray(o))?o:{}; }
    /* ⚠️⚠️ THIS CATCH USED TO BE EMPTY, AND THAT WAS A FUSE.
       A full localStorage throws QuotaExceededError, and swallowing it made a
       failed save look precisely like a successful one: the wall painted, the
       reader carried on reading, the status line said nothing, and not one
       byte was stored. That is hard constraint 10 — "no data" and "we failed
       to write it" must never render the same way — with a timer attached,
       because every TikTok carries up to 9,000 characters of transcript, so a
       large enough library WILL reach the ~5MB origin limit and then lie about
       every save after it. A save that did not happen has to say so. */
    var storageErr='';
    function persist(k,a){
      try{ localStorage.setItem(k,JSON.stringify(a)); if(storageErr){ storageErr=''; try{ renderStatus(); }catch(e2){} } return true; }
      catch(e){
        var quota=!!(e&&(e.name==='QuotaExceededError'||e.name==='NS_ERROR_DOM_QUOTA_REACHED'||e.code===22||e.code===1014));
        storageErr=quota
          ? 'This device is FULL — nothing is being saved. Remove some read items, or open Backups before adding more.'
          : 'Could not save to this device ('+((e&&e.name)||'unknown error')+'). Nothing is being saved.';
        try{ renderStatus(); }catch(e2){}
        return false;
      }
    }
    function flush(){ if(window.ALSSync&&window.ALSSync.flush) window.ALSSync.flush(); }
    function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

    function srcFromUrl(url){
      if(!url) return '';
      var u=String(url).trim(); if(!/^https?:\/\//i.test(u)) u='https://'+u;
      var host=''; try{ host=new URL(u).hostname.replace(/^www\./,''); }catch(e){ var m=String(url).match(/([a-z0-9-]+\.[a-z]{2,})/i); host=m?m[1]:''; }
      if(/youtube\.com|youtu\.be/i.test(host)) return 'YouTube';
      if(/tiktok\.com/i.test(host)) return 'TikTok';
      if(/vimeo\.com/i.test(host)) return 'Vimeo';
      if(/spotify\.com/i.test(host)) return 'Spotify';
      if(/podcasts\.apple/i.test(host)) return 'Apple Podcasts';
      if(/medium\.com/i.test(host)) return 'Medium';
      if(/twitter\.com|x\.com/i.test(host)) return 'X';
      if(/ted\.com/i.test(host)) return 'TED';
      if(!host) return '';
      var base=host.split('.')[0]; return base.charAt(0).toUpperCase()+base.slice(1);
    }
    function normUrl(url){ if(!url) return ''; var u=String(url).trim(); if(!/^https?:\/\//i.test(u)) u='https://'+u; return u; }

    var videos=loadArr(K_VID), tiktoks=loadArr(K_TT), habits=loadArr(K_HAB), profile=loadObj(K_PROF), actions=loadArr(K_ACT);

    /* view state — `starOnly` is deliberately separate from `state` (see scoped) */
    var world='yt', shelf='', state='todo', seek='', selId=null, noteOpen=false, noteDraft=null, starOnly=false;

    /* Queue position lives in `ord`, never in `ts` — `ts` is the sync clock and
       every read bumps it, which would reshuffle the list under him. */
    function migrateOrd(arr,key){
      var miss=arr.filter(function(v){ return typeof v.ord!=='number'; });
      if(!miss.length) return;
      var base=arr.reduce(function(m,v){ return typeof v.ord==='number'&&v.ord>m?v.ord:m; },-1);
      miss.sort(function(a,b){ return (a.ts||0)-(b.ts||0); }).forEach(function(v){ v.ord=++base; });
      persist(key,arr);
    }
    migrateOrd(videos,K_VID); migrateOrd(tiktoks,K_TT);
    function nextOrd(arr){ return arr.reduce(function(m,v){ return typeof v.ord==='number'&&v.ord>=m?v.ord+1:m; },0); }
    function byOrd(a,b){ var x=typeof a.ord==='number'?a.ord:1e9, y=typeof b.ord==='number'?b.ord:1e9; return x!==y?x-y:(a.ts||0)-(b.ts||0); }

    /* Nova answers in plain text (KIND / TOPIC / CORE / KEY / DO) rather than
       JSON, because JSON is what shattered on long replies. Parse it
       forgivingly: a missing header or a stray bullet style must never cost
       him the notes. */
    function kpParse(raw){
      var o={kind:'',topic:'',core:'',keys:[],act:''};
      String(raw||'').split(/\r?\n/).forEach(function(ln){
        var s=ln.trim().replace(/\*\*/g,'').replace(/^#+\s*/,'').trim();
        if(!s) return;
        var m;
        if((m=s.match(/^KIND\s*[:\-–—]\s*(\w+)/i))){ o.kind=m[1].toLowerCase(); return; }
        if((m=s.match(/^TOPIC\s*[:\-–—]\s*(.+)$/i))){ o.topic=m[1].replace(/["'`*_.]/g,'').trim().slice(0,40); return; }
        if((m=s.match(/^CORE\s*[:\-–—]\s*(.+)$/i))){ o.core=m[1].trim(); return; }
        if((m=s.match(/^(?:DO|TRY|ACTION)\s*[:\-–—]\s*(.+)$/i))){ o.act=m[1].trim(); return; }
        // Longest label first — "KEY POINTS:" must not match as "KEY" + "POINTS:".
        if((m=s.match(/^(?:KEY POINTS?|KEY TAKEAWAYS?|TAKEAWAYS?|KEY|POINTS)\s*[:\-–—]?\s*(.*)$/i))){ if(m[1].trim()) o.keys.push(m[1].trim()); return; }
        if((m=s.match(/^[-•*–—▸]\s*(.+)$/))){ o.keys.push(m[1].trim()); return; }
        if((m=s.match(/^\d+[.)]\s+(.+)$/))){ o.keys.push(m[1].trim()); return; }
        if(!o.core&&!o.keys.length&&s.length>20) o.core=s;   // shape ignored — keep the words anyway
      });
      if(!o.core&&o.keys.length) o.core=o.keys.shift();
      return o;
    }
    function conceptOf(v){ return v.concept||v.rawTopic||v.topic||''; }

    /* ── THE RECAP ────────────────────────────────────────────────
       Everything above parses the DISTILLER's output — a handful of key points
       written from the creator's description, because YouTube has no
       transcript. Alex's verdict on those was "too vague, not that much good",
       and he was right about the cause without naming it: the reader had never
       heard the video.

       A recap is different in kind. api/_youtube.js hands the URL to Gemini,
       which watches the thing, and what comes back is a PAGE — an opening,
       sections in the video's own order, and a block of hard specifics. So it
       gets its own parser and its own reading view rather than being crushed
       into the key-point list it exists to replace.

       Shape (see RECAP_SYS): SHELF, CORE, OPEN, any number of SECTION blocks,
       then FACTS — or a single NOTHING line when the video turned out to have
       nothing being said in it.
       Parsed forgivingly for the same reason kpParse is: a missing header must
       never cost him the words. */
    function rcParse(raw){
      var o={shelf:'',core:'',open:'',sections:[],facts:[],nothing:''};
      var mode='',cur=null,buf=[];
      function flushOpen(){ if(mode==='open') o.open=buf.join('\n').trim(); }
      function flushSec(){ if(cur){ cur.body=buf.join('\n').trim(); if(cur.h||cur.body) o.sections.push(cur); cur=null; } }
      String(raw||'').split(/\r?\n/).forEach(function(ln){
        var s=ln.trim().replace(/\*\*/g,'').replace(/^#+\s*/,'').trim();
        var m;
        if((m=s.match(/^SHELF\s*[:\-–—]\s*(.+)$/i))){ o.shelf=m[1].replace(/["'`*_.]/g,'').trim().slice(0,40); return; }
        if((m=s.match(/^NOTHING\s*[:\-–—]\s*(.+)$/i))){ o.nothing=m[1].trim(); return; }
        if((m=s.match(/^CORE\s*[:\-–—]\s*(.+)$/i))){ o.core=m[1].trim(); return; }
        if(/^OPEN\s*[:\-–—]?\s*$/i.test(s)){ flushSec(); mode='open'; buf=[]; return; }
        if((m=s.match(/^OPEN\s*[:\-–—]\s*(.+)$/i))){ flushSec(); mode='open'; buf=[m[1].trim()]; return; }
        if((m=s.match(/^SECTION\s*[:\-–—]\s*(.*)$/i))){ flushOpen(); flushSec(); mode='sec'; cur={h:m[1].trim(),body:''}; buf=[]; return; }
        if(/^FACTS?\s*[:\-–—]?\s*$/i.test(s)){ flushOpen(); flushSec(); mode='facts'; buf=[]; return; }
        if(mode==='facts'){ var f=s.match(/^[-•*–—▸]\s*(.+)$/); if(f) o.facts.push(f[1].trim()); return; }
        if(!s){ buf.push(''); return; }
        buf.push(s);
      });
      flushOpen(); flushSec();
      o.open=o.open.replace(/\n{3,}/g,'\n\n').trim();
      o.sections=o.sections.map(function(x){ x.body=String(x.body||'').replace(/\n{3,}/g,'\n\n').trim(); return x; })
                           .filter(function(x){ return x.body||x.h; });
      return o;
    }
    function hasRecap(v){ return !!(v&&v.recap&&String(v.recap).trim()); }
    /* A video watched and found to contain nothing being SAID is a real answer,
       and a DIFFERENT one from "we have not looked yet". Both used to be the
       same blank card, which is the silent-empty disease this page keeps
       catching itself doing. */
    function recapEmpty(v){ return !!(v&&!hasRecap(v)&&v.recapNothing); }
    function recapParagraphs(s){
      return String(s||'').split(/\n{2,}/).map(function(p){ return p.replace(/\n/g,' ').trim(); })
             .filter(function(p){ return p.length; });
    }

    /* ── WHAT COUNTS AS A LESSON ──────────────────────────────────
       ⚠️⚠️ The fallback below used to be reached by every YouTube video in the
       library, because the old distill prompt in api/_youtube.js never emitted
       a KIND line for a kind to be read out of. So `!!v.ytId` was the answer,
       and the answer was always YES: a match, a stream, a trailer and a real
       talk all wore the LESSON badge and all promised takeaways.

       api/_youtube.js grades and declares now, exactly as the TikTok half
       always has. But a reading produced BEFORE it learned to do that is
       neither a lesson nor a keepsake — it is UNVERIFIED. It was written by a
       prompt told to produce "3 to 5" points from a marketing description,
       with no grounding check behind it. RVER marks the boundary: anything
       below it is re-read in the background and says what it is until then. */
    var RVER=1;
    function readVer(v){ return (typeof v.rver==='number')?v.rver:0; }
    /* ⚠️ The version alone is NOT the test, and using it alone would have been
       an expensive mistake: every TikTok in the library predates `rver` too,
       and every one of them was already read by the graded, grounded path. A
       version check by itself would have re-read his whole TikTok wall for
       nothing. What actually marks a legacy reading is the ABSENCE of the
       honesty fields — no declared kind and no grade means it came from a
       reader that had no way to say "there is no lesson here". */
    function isLegacyRead(v){
      return !!(v && v.keypoints) && !v.kind && !v.grade && readVer(v)<RVER;
    }
    function isLesson(v){
      var k=v.kind||kpParse(v.keypoints||'').kind;
      if(k) return k==='lesson';
      return !!v.ytId;   // pre-RVER only, and the card marks it unverified
    }

    /* ── which collection is on screen ────────────────────────── */
    function coll(){ return world==='tt'?tiktoks:videos; }
    function collKey(){ return world==='tt'?K_TT:K_VID; }
    function saveColl(){ persist(collKey(),coll()); flush(); }
    function byId(id){ return videos.find(function(x){return x.id===id;})||tiktoks.find(function(x){return x.id===id;})||null; }
    /* ⚠️ A TikTok that has not been fetched yet has an EMPTY ttId — it is
       created from a pasted URL and only learns its id from the server. So
       "is this a TikTok" can never be `!!v.ttId`, or a pending one would be
       written into the YouTube store and quietly disappear from its world. */
    function isTikTok(v){ return !!(v && (v.ttId || /tiktok\.com/i.test(v.url||'') || v.source==='TikTok')); }
    function saveItem(v){ if(isTikTok(v)) persist(K_TT,tiktoks); else persist(K_VID,videos); flush(); }

    /* ── THE SHELVES ──────────────────────────────────────────────
       A fixed taxonomy, shared by BOTH worlds and mirrored in api/_tiktok.js
       (SHELVES). Life areas, not subjects — "if it's faith it goes to Faith,
       whatever it is". The RAIL ORDER IS THIS ORDER, never by size: a shelf
       that moves as videos arrive cannot be learned, and the whole point is
       that he stops reading the list and starts reaching for it.
       ⚠️ Change this and bump CVER, which re-shelves everything once. */
    var SHELVES=['Faith','Mind','Body','Food','Money','World','Sport','Sound','Laughs'];
    var ACCENT={ yt:'168,214,110', tt:'104,214,204', rm:'240,190,110', hb:'155,140,255' };
    var TITLE={ yt:'watching', tt:'keeping', rm:'learned', hb:'building' };

    /* ── titles + search text ─────────────────────────────────── */
    function titleOf(v){
      if(v.title) return v.title;
      if(v.ttId){
        var p=kpParse(v.keypoints||'');
        var cap=String(v.caption||'').replace(/#[^\s#]+/g,'').trim();
        return cap || p.core || (v.handle?('@'+v.handle):'Saved TikTok');
      }
      return '(untitled)';
    }
    function metaOf(v){
      var bits=[];
      if(v.ttId){ if(v.handle) bits.push('@'+v.handle); if(v.duration) bits.push(v.duration+'s'); }
      else { if(v.channel) bits.push(v.channel); else if(v.source) bits.push(v.source); }
      var c=conceptOf(v); if(c) bits.push(c);
      return bits.join(' · ');
    }
    /* ── SEARCH ───────────────────────────────────────────────────
       Three separate things were wrong with it, and each one cost him real
       results on a library he cannot scroll:

       1. ⭐ THE TRANSCRIPT WAS NOT SEARCHED. The single thing this library has
          that nothing else does is hundreds of words of what was actually SAID,
          and it was the one field left out of the haystack. Searching a sermon
          for a phrase from the sermon returned nothing.
       2. The match was `hay(v).indexOf(q)`, so the whole query had to appear as
          one unbroken run — "faith discipline" found nothing even when both
          words were sitting in the same card.
       3. No Greek folding. He is Greek and half of what he saves is: "προσευχη"
          did not match "προσευχή", and a final ς never matched a σ.

       fold() is applied to BOTH sides, so the query and the text are always
       compared in the same alphabet. The result is cached per item against a
       cheap signature — folding a 9,000-character transcript for a hundred
       items on every keystroke is exactly how a library starts to feel cheap. */
    function fold(s){
      return String(s==null?'':s).toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g,'')    // ό→ο, ά→α, é→e
        .replace(/ς/g,'σ');                                 // final sigma is the same letter
    }
    var hayMemo={};
    function hay(v){
      // ⚠️ The recap belongs in this signature AND in the blob below. It is now
      // the longest and most specific text this page holds — the only text
      // written from the video itself — so leaving it out would mean searching
      // a library while ignoring the best thing in it. Same omission the
      // transcript suffered for the page's whole life.
      var sig=(v.ts||0)+'|'+((v.keypoints||'').length)+'|'+((v.transcript||'').length)+
              '|'+((v.recap||'').length)+'|'+((v.note||v.notes||'').length);
      var m=hayMemo[v.id];
      if(m&&m.sig===sig) return m.s;
      var s=fold([titleOf(v),v.channel,v.handle,v.author,v.caption,(v.tags||[]).join(' '),
        (v.screen||[]).join(' '),conceptOf(v),v.keypoints,(v.note||v.notes),v.transcript,v.recap,v.music].join(' '));
      hayMemo[v.id]={sig:sig,s:s};
      return s;
    }
    function thumbOf(v){
      if(v.ttId) return v.cover||'';
      return v.thumb||(v.ytId?('https://i.ytimg.com/vi/'+v.ytId+'/hqdefault.jpg'):'');
    }

    /* ── the reader's controls ────────────────────────────────────
       Pasting a big list and then wanting OUT of it is a normal thing to do —
       Alex hit it within an hour ("i think i send too much, how do i stop the
       progress"). Before this, the only way to stop the reader was to close
       the tab, and the only way to undo a paste was to remove items one at a
       time. Both are first-class now.

       `paused` is DEVICE-LOCAL and deliberately not synced: it is about this
       tab right now, and pausing on the laptop must not stop his phone. It
       does survive a reload, or reopening the page would restart the flood he
       just stopped. */
    var K_PAUSE='improve:paused';
    var paused=(function(){ try{ return localStorage.getItem(K_PAUSE)==='1'; }catch(e){ return false; } })();
    function setPaused(p){
      paused=!!p;
      try{ p?localStorage.setItem(K_PAUSE,'1'):localStorage.removeItem(K_PAUSE); }catch(e){}
      renderStatus();
      if(!paused){ sweep(); ttSweep(); }
    }
    function unreadIn(arr){ return arr.filter(function(v){ return !v.keypoints; }); }

    var statusMsg='', statusLive=false;
    function status(m,live){ statusMsg=m||''; statusLive=!!live; renderStatus(); }
    function renderStatus(){
      var e=$('status'); if(!e) return;
      var unread=unreadIn(coll()).length, running=sweeping||ttSweeping;
      var h='';
      // A device that cannot save has to say so before anything else on the
      // line, because every other message here is about work whose result is
      // no longer being kept.
      if(storageErr) h+='<span class="s-t bad">'+esc(storageErr)+'</span>';
      if(paused){
        h+='<span class="s-t">Paused'+(unread?' · '+unread+' unread':'')+'</span>'+
          '<button type="button" class="s-b" data-resume="1">Resume</button>';
      } else if(running||statusMsg){
        h+='<span class="s-t'+(statusLive?' live':'')+'">'+esc(statusMsg||'Reading')+'</span>'+
          (running?'<button type="button" class="s-b" data-pause="1">Stop</button>':'');
      }
      if(unread && world!=='hb' && world!=='rm'){
        h+='<button type="button" class="s-b warn" data-dropunread="1">Remove the '+unread+' unread</button>';
      }
      e.innerHTML=h;
      // ⚠️ A toggle of the "live" class on this container used to sit here, and
      // `.lb-status.live` is defined NOWHERE in the stylesheet — hard
      // constraint 12, a class toggled from JS that CSS lacks, in the very
      // file that constraint was written about. It did nothing for the page's
      // whole life. The live colour is carried by `.s-t.live` above, which
      // does exist. A test now fails if it comes back.
    }

    /* Removing a batch.
       ⚠️ This goes through the page's normal persist() ON PURPOSE. sync.js
       intercepts localStorage.setItem and diffs the old array against the new
       one to stamp DELETION TOMBSTONES; clearing the key by hand would leave
       none, and every removed video would sync straight back from the cloud
       the next time any device pulled. Never "clear" one of these stores
       outside this path. */
    function removeItems(gone){
      var kill={}; gone.forEach(function(v){ kill[v.id]=1; });
      if(world==='tt'){ tiktoks=tiktoks.filter(function(v){ return !kill[v.id]; }); persist(K_TT,tiktoks); }
      else { videos=videos.filter(function(v){ return !kill[v.id]; }); persist(K_VID,videos); }
      flush();
      if(selId&&kill[selId]) closePane();
      render();
    }
    async function ask(o){
      if(window.ALSConfirm) return await window.ALSConfirm(o);
      return confirm(o.title+'\n\n'+(o.message||''));
    }
    /* The undo for "I overdid it": drop what has not been read yet, and keep
       every one that has. Nothing that already earned its key points is touched. */
    async function dropUnread(){
      var arr=coll(), gone=unreadIn(arr);
      if(!gone.length) return;
      if(!await ask({ title:'Remove '+gone.length+' unread?',
          message:'The '+(arr.length-gone.length)+' already read stay exactly as they are. This only clears what has not been read yet.',
          confirmText:'Remove '+gone.length, danger:true })) return;
      removeItems(gone);
    }
    /* Start over — clear the whole world so a cleaner batch can go in. */
    async function dropAll(){
      var arr=coll().slice(); if(!arr.length) return;
      var read=arr.length-unreadIn(arr).length;
      if(!await ask({ title:'Remove all '+arr.length+' TikToks?',
          message:'This clears the whole TikTok wall'+(read?', including the '+read+' already read':'')+
                  ', on every device. It cannot be undone from here — the vault keeps a daily backup.',
          confirmText:'Remove all '+arr.length, danger:true })) return;
      removeItems(arr);
      // Nothing left to read, so a pause from the last batch would only be
      // confusing when the next one lands.
      if(paused) setPaused(false);
    }

    /* ════════════════════════════════════════════════════════════
       THE WALL
       ════════════════════════════════════════════════════════════ */
    /* EVERY term must appear, in any order and anywhere in the card — which is
       what a person means by "faith discipline". */
    function pool(){
      var terms=fold(seek).split(/\s+/).filter(Boolean);
      if(!terms.length) return coll().slice();
      return coll().filter(function(v){
        var h=hay(v);
        for(var i=0;i<terms.length;i++) if(h.indexOf(terms[i])<0) return false;
        return true;
      });
    }
    /* ⚠️ STARRED IS A FACET, NOT A STATE — and getting that wrong hid his own
       favourites. stateOf() used to return 'star' for anything starred, so a
       starred lesson could never equal 'lesson' and VANISHED from the Lessons
       shelf, while the rail counted it and said there were more than it drew.
       "What is this?" and "did he star it?" are two independent questions and
       they now filter independently, so Starred combines with a shelf instead
       of replacing it. */
    function stateOf(v){
      if(world==='tt') return v.keypoints ? (isLesson(v)?'lesson':'keep') : 'reading';
      return v.watched?'done':'todo';
    }
    function scoped(){
      var p=pool();
      if(starOnly) p=p.filter(function(v){ return !!v.star; });
      if(!state) return p;
      return p.filter(function(v){ return stateOf(v)===state; });
    }
    function shelved(list){ return shelf ? list.filter(function(v){ return (conceptOf(v)||'Unsorted')===shelf; }) : list; }

    function badgeFor(v){
      if(v.metaFail>=2) return '<span class="badge miss">unreadable</span>';
      if(v.pending) return '<span class="badge reading pulse">fetching</span>';
      // Written before the reader could grade — it is queued to be read again,
      // and until then it must not wear the LESSON badge it never earned.
      /* A recap outranks every other badge, and it is the only one that is not
         a claim about a reading — it is a claim about the SOURCE. This video
         was watched; nothing else on the wall can say that. It sits above the
         legacy check on purpose: a recapped video is no longer unverified,
         whatever the old key points below it were written from. */
      if(hasRecap(v)) return '<span class="badge recap">recap</span>';
      if(isLegacyRead(v)) return '<span class="badge old">unverified</span>';
      if(v.keypoints) return isLesson(v)?'<span class="badge lesson">lesson</span>':'<span class="badge">keepsake</span>';
      if((v.kpFail||0)>=3) return '<span class="badge miss">retry</span>';
      return '<span class="badge reading pulse">reading</span>';
    }
    /* ── WEIGHT ON THE WALL ───────────────────────────────────────
       Every tile used to be the same size, so a 552-word sermon that produced
       five checked takeaways sat at exactly the same rank as a Lana Del Rey
       edit whose caption was three hashtags. The page ALREADY KNEW the
       difference — `grade` and `kind` are stored on every item — and threw the
       knowledge away at render time.

       So a real lesson now takes two columns. This is honest hierarchy: it is
       driven by what the reader actually found in the material, never by
       decoration, and a keepsake is not diminished — it is simply not pretending
       to be a lesson. Starred items are promoted too, because that is HIS
       judgement and it outranks the machine's. */
    function isBig(v){
      if(world!=='tt') return false;                  // 16:9 already reads big
      if(!v.keypoints||isLegacyRead(v)) return false;
      if(v.star) return true;
      return isLesson(v) && (v.grade==='transcript'||v.grade==='notes'||v.grade==='screen');
    }
    function tileHTML(v){
      var th=thumbOf(v), p=kpParse(v.keypoints||'');
      /* One voice on the wall too. The tile wore the RECAP badge while still
         printing the thin description-written core underneath it — "A tour of
         Roman history" under a badge promising the opposite. Wherever a recap
         exists it speaks: pane chip, pane body, Room row, and here. */
      if(hasRecap(v)){ var rc=rcParse(v.recap); if(rc.core) p={ core:rc.core, keys:p.keys, act:p.act }; }
      var title=titleOf(v);
      // A keepsake whose caption is only hashtags takes its NAME from the core
      // sentence, so printing the core underneath would say it twice.
      if(p.core && p.core.trim()===title.trim()) p={ core:'', keys:p.keys, act:p.act };
      return '<button type="button" class="tile'+(v.watched?' done':'')+(selId===v.id?' sel':'')+(isBig(v)?' big':'')+'" data-id="'+esc(v.id)+'">'+
        '<span class="ph">'+
          (th?'<img loading="lazy" src="'+esc(th)+'" alt="" data-cover="'+esc(v.id)+'">':'')+
          '<span class="scrim"></span>'+
          '<span class="play"><span>▶</span></span>'+
          badgeFor(v)+
          (world==='tt'?'<span class="star'+(v.star?' on':'')+'" data-star="'+esc(v.id)+'" role="button" aria-label="Star">★</span>':'')+
          '<span class="cap">'+
            '<span class="t">'+esc(title)+'</span>'+
            '<span class="m">'+esc(metaOf(v))+'</span>'+
            (p.core?'<span class="core">'+esc(p.core)+'</span>':'')+
          '</span>'+
        '</span></button>';
    }

    function sortedList(){
      return shelved(scoped()).sort(function(a,b){
        if(world!=='tt' && !!a.watched!==!!b.watched) return a.watched?1:-1;
        if(world==='tt' && !!a.star!==!!b.star) return a.star?-1:1;
        return byOrd(a,b);
      });
    }
    /* ════════════════════════════════════════════════════════════
       THE ROOM — everything he has actually taken, as a page
       ────────────────────────────────────────────────────────────
       The other three worlds are grids of thumbnails: they answer "what did I
       save?". None of them answers the question the library exists for —
       "what have I learned?" — because that answer is not a picture, it is a
       few hundred sentences, and a sentence cannot be read off a poster.

       So the Room is typography, not tiles. Every CORE line the reader has
       grounded, gathered under its shelf, newest first, each one a doorway
       back to the video it came from. Above them sit the only two things that
       are genuinely urgent: what he is about to forget, and what he said he
       would do. Nothing here is computed on a server and nothing here is new
       data — it is the library he already has, finally readable.
       ════════════════════════════════════════════════════════════ */
    function roomItems(){
      var terms=fold(seek).split(/\s+/).filter(Boolean);
      return videos.concat(tiktoks).filter(function(v){
        // A recap earns a place here on its own — it is the only reading in
        // the library written from the video rather than around it, so a
        // stale `kind` on its old key points must not keep it out.
        if(hasRecap(v)) return !terms.length || (function(){
          var hy=hay(v);
          for(var i=0;i<terms.length;i++) if(hy.indexOf(terms[i])<0) return false;
          return true;
        })();
        if(!v.keypoints||isLegacyRead(v)||!isLesson(v)) return false;
        if(!kpParse(v.keypoints).core) return false;
        if(!terms.length) return true;
        var h=hay(v);
        for(var i=0;i<terms.length;i++) if(h.indexOf(terms[i])<0) return false;
        return true;
      });
    }
    function whenAgo(ts){
      if(!ts) return '';
      var d=Math.floor((Date.now()-ts)/DAY);
      if(d<=0) return 'today';
      if(d===1) return 'yesterday';
      if(d<7) return d+' days ago';
      if(d<31) return Math.floor(d/7)+' week'+(d<14?'':'s')+' ago';
      return Math.floor(d/30)+' month'+(d<60?'':'s')+' ago';
    }
    function renderRoom(){
      var h='', due=recallQueue(), open=actions.filter(function(a){ return !a.done; }),
          done=actions.filter(function(a){ return !!a.done; }), items=roomItems();

      if(due.length){
        /* ⚠️ A recapped video can be due WITHOUT any key points — dueAt() lets
           a recap qualify on its own. Reading kpParse alone here would draw a
           card with an empty core and no points, which is the silent-empty
           disease with a "Before you forget it" heading on top. The recap is
           also simply the better material, so it wins where both exist. */
        var r=due[0], rr=hasRecap(r)?rcParse(r.recap):null, rp=kpParse(r.keypoints);
        var core=(rr&&rr.core)||rp.core||titleOf(r);
        var pts=(rr&&rr.facts.length)?rr.facts:rp.keys;
        h+='<section class="rm-sec rm-due"><div class="rm-h">Before you forget it'+
           (due.length>1?' <span class="rm-n">'+due.length+' due</span>':'')+'</div>'+
           '<div class="rm-core">'+esc(core)+'</div>'+
           '<div class="rm-from">'+esc(titleOf(r))+(conceptOf(r)?' · '+esc(conceptOf(r)):'')+'</div>'+
           (pts.length?'<ul class="rm-keys">'+pts.slice(0,3).map(function(k){return '<li>'+esc(k)+'</li>';}).join('')+'</ul>':'')+
           '<div class="pane-acts"><button type="button" class="b prime" data-remgot="'+esc(r.id)+'">Still with me ✓</button>'+
           '<button type="button" class="b" data-remlost="'+esc(r.id)+'">I’d forgotten it</button>'+
           (hasRecap(r)
             ? '<button type="button" class="b" data-rcread="'+esc(r.id)+'">Read the recap →</button>'
             : '<button type="button" class="b" data-open="'+esc(r.id)+'">Open it</button>')+
           '</div></section>';
      }

      /* ⭐ THE PAGES HE KEEPS.
         His whole reason for asking for this: *"whenever i feel like i need a
         refresh, i rewatch the recap."* That sentence describes a place he
         comes BACK to, and the wall is not it — the wall is for finding what
         to watch. The Room is where the archive is read, so the recaps live
         here, near the top, one click from open.
         Search narrows them like everything else in the Room. */
      var recaps=videos.filter(hasRecap).filter(function(v){
        var terms=fold(seek).split(/\s+/).filter(Boolean);
        if(!terms.length) return true;
        var hy=hay(v);
        for(var i=0;i<terms.length;i++) if(hy.indexOf(terms[i])<0) return false;
        return true;
      }).sort(function(a,b){ return (b.recapTs||0)-(a.recapTs||0); });
      if(recaps.length){
        /* Capped at six. The shelf sections below carry every recap too, so an
           uncapped list here would print the same thing twice on one screen.
           This is the RECENT door — the shelves are the thematic one. */
        h+='<section class="rm-sec"><div class="rm-h">The pages you keep <span class="rm-n">'+recaps.length+'</span></div>'+
           recaps.slice(0,6).map(function(v){
             var rp=rcParse(v.recap);
             return '<button type="button" class="rm-idea" data-rcread="'+esc(v.id)+'">'+
               '<span class="rm-core">'+esc(rp.core||titleOf(v))+'</span>'+
               '<span class="rm-from">'+esc(titleOf(v))+' · '+esc(whenAgo(v.recapTs))+
               (v.recapWords?' · '+v.recapWords+' words':'')+'</span></button>';
           }).join('')+'</section>';
      }

      if(open.length||done.length){
        h+='<section class="rm-sec"><div class="rm-h">What you said you’d do'+
           (open.length?' <span class="rm-n">'+open.length+' open</span>':'')+'</div><ul class="rm-acts">'+
           open.concat(done).map(function(a){
             return '<li class="rm-act'+(a.done?' done':'')+'">'+
               '<button type="button" class="hb-ck'+(a.done?' on':'')+'" data-actdone="'+esc(a.id)+'" aria-label="Done">'+(a.done?'✓':'')+'</button>'+
               '<div class="rm-act-b"><div class="rm-act-t">'+esc(a.text)+'</div>'+
               '<div class="rm-act-m">from '+esc(a.title||'the library')+' · '+esc(whenAgo(a.ts))+'</div></div>'+
               '<button type="button" class="hb-x" data-actdrop="'+esc(a.id)+'" aria-label="Remove">✕</button></li>';
           }).join('')+'</ul></section>';
      }

      if(!items.length){
        h+='<div class="empty"><b>'+(seek.trim()?'Nothing matches':'Nothing read yet')+'</b>'+
          (seek.trim()
            ? 'No lesson in the Room matches “'+esc(seek.trim())+'”.'
            : 'Once something you saved has been read and checked, the idea worth keeping from it appears here — every one of them, on one page.')+'</div>';
      } else {
        // Canonical shelf order, exactly as the rail — a shelf that moves
        // cannot be learned.
        var by={}; items.forEach(function(v){ var c=conceptOf(v)||'Unsorted'; (by[c]=by[c]||[]).push(v); });
        var order=SHELVES.filter(function(c){ return by[c]; })
          .concat(Object.keys(by).filter(function(c){ return c!=='Unsorted'&&SHELVES.indexOf(c)<0; }).sort())
          .concat(by['Unsorted']?['Unsorted']:[]);
        order.forEach(function(c){
          var list=by[c].slice().sort(function(a,b){ return (b.recapTs||b.distilledTs||b.ts||0)-(a.recapTs||a.distilledTs||a.ts||0); });
          h+='<section class="rm-sec"><div class="rm-h">'+esc(c)+' <span class="rm-n">'+list.length+'</span></div>'+
             list.map(function(v){
               /* One voice per row. Where a recap exists it speaks — showing
                  the thin description-written core next to a shelf full of
                  real ones is the same two-voices problem the pane just
                  solved, and the row opens the recap rather than the tile. */
               var rec=hasRecap(v)?rcParse(v.recap):null;
               var core=(rec&&rec.core)||kpParse(v.keypoints).core;
               return '<button type="button" class="rm-idea" '+(rec?'data-rcread="':'data-id="')+esc(v.id)+'">'+
                 '<span class="rm-core">'+esc(core||titleOf(v))+'</span>'+
