<!DOCTYPE html>
<html lang="el" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Αριστοτέλης, Ενότητα 1η — η όψη μαθήματος</title>
<!-- ══════════════════════════════════════════════════════════════════
     ⛔ ΔΕΙΓΜΑ, ΟΧΙ ΣΕΛΙΔΑ.  Δεν γράφει τίποτα πουθενά.

     ΘΕΜΑ: η ΟΨΗ ΜΑΘΗΜΑΤΟΣ του Γνωστού (#gnLesson), που έμεινε στα 620px
     όταν η λίστα πήγε στα 1240 (als-v498).  Ίδια γλώσσα με ό,τι ενέκρινε:
     Instrument Serif, καμβάς #060607, κεχριμπάρι, λεπτές γραμμές.

     ⭐ Η ΜΙΑ ΑΠΟΦΑΣΗ ΠΟΥ ΜΕΤΡΑΕΙ: κάθε στρώση παίρνει ΤΟ ΔΙΚΟ ΤΗΣ πλάτος.
     Η πρόζα θέλει ~70 χαρακτήρες γραμμή — σε 1100px γίνεται αδιάβαστη.
     Η αντιστοιχία θέλει ΟΛΟ το πλάτος, γιατί αρχαίο και μετάφραση πρέπει
     να κάθονται ΔΙΠΛΑ.  Ένα ενιαίο πλάτος για όλα θα χαλούσε το ένα ή το
     άλλο· γι' αυτό υπάρχουν `.mz` (μέτρο ανάγνωσης) και `.wide`.
     ══════════════════════════════════════════════════════════════════ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
<script src="greek-ear.js"></script>
<script src="lesson-grade.js"></script>
<script src="arxaia-gnosto-data.js"></script>
<style>
*{box-sizing:border-box} html,body{margin:0;padding:0}
:root{
  --ink:#F5F2EC; --dim:rgba(245,242,236,.56); --faint:rgba(245,242,236,.30);
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --am:#F2C063; --am-rgb:242,192,99; --em:#34E2B0;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1); --bg:#060607;
}
:root[data-theme=light]{--ink:#1B1813;--dim:rgba(27,24,19,.66);--faint:rgba(27,24,19,.40);
  --line:rgba(27,24,19,.10);--line2:rgba(27,24,19,.16);--am:#8A5A12;--am-rgb:138,90,18;
  --em:#0D7A55;--bg:#FAF7F1}
body{background:var(--bg);color:var(--dim);font:400 16px/1.7 var(--sans);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}

/* ── η μπάρα του δείγματος ─────────────────────────────────────────── */
#pick{position:sticky;top:0;z-index:99;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 16px;background:#000;border-bottom:1px solid #1c1c20;
  font:500 13px/1.4 var(--sans);color:#7a7a84}
#pick b{color:#e9e9ee;margin-right:4px}
#pick button{background:#141418;color:#9a9aa4;border:1px solid #2a2a32;border-radius:8px;
  padding:7px 13px;font:inherit;font-weight:600;cursor:pointer}
#pick button:hover{color:#fff;border-color:#4a4a56}
#pick .sp{flex:1 1 auto} #pick .hint{font-size:11.5px;color:#5a5a63}

/* ── ο σκελετός της όψης ───────────────────────────────────────────── */
.sky{position:relative}
.sky:before{content:"";position:absolute;inset:-120px 0 auto;height:460px;pointer-events:none;
  background:radial-gradient(900px 320px at 50% 0,rgba(var(--am-rgb),.075),transparent 70%)}
.wrap{position:relative;max-width:1180px;margin:0 auto;padding:0 40px 120px}
.mz{max-width:70ch}                /* μέτρο ανάγνωσης — η πρόζα δεν τεντώνεται */
a{color:inherit}

.vtop{display:flex;align-items:center;gap:14px;padding:22px 0 0}
.x{width:38px;height:38px;flex:none;border:1px solid var(--line);border-radius:50%;background:none;
  color:var(--faint);font:400 16px/1 var(--sans);cursor:pointer;transition:.4s var(--ease)}
.x:hover{color:var(--ink);border-color:var(--line2)}
.vtop .bc{font:600 10px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}

header{padding:34px 0 30px;border-bottom:1px solid var(--line)}
h1{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--ink);
  font-size:clamp(30px,3.8vw,46px);line-height:1.08;letter-spacing:-.02em;margin:14px 0 0;
  max-width:20ch;text-wrap:balance}
.meta{margin:18px 0 0;font:400 11.5px/1 var(--mono);letter-spacing:.04em;color:var(--faint)}
.meta b{color:var(--am);font-weight:600}
.byh{margin:20px 0 0;padding:14px 18px;border:1px solid rgba(var(--am-rgb),.22);border-radius:14px;
  background:linear-gradient(180deg,rgba(var(--am-rgb),.07),transparent);
  font-size:13.5px;line-height:1.65;color:var(--dim);max-width:68ch}
.byh b{color:var(--am);font-weight:600}

/* ── κεφαλίδα στρώσης ─────────────────────────────────────────────── */
section{padding:46px 0 0}
.sh{display:flex;align-items:center;gap:16px;margin:0 0 22px}
.sh .k{font:600 10px/1 var(--mono);letter-spacing:.26em;color:var(--am);opacity:.75}
.sh .t{font:600 10px/1 var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--faint);
  white-space:nowrap}
.sh .r{flex:1 1 auto;height:1px;background:var(--line)}
.sh .n{font:600 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
  white-space:nowrap}

/* 01 · πρόζα */
.simple p{margin:0 0 15px;color:var(--dim)}
.simple p:first-child{color:var(--ink)}

/* 02 · Η ΑΝΤΙΣΤΟΙΧΙΑ — η μία στρώση που ΑΠΑΙΤΕΙ πλάτος */
.ctl{display:flex;gap:18px;margin:0 0 18px;font-size:13px}
.ctl button{background:none;border:none;padding:0 0 2px;color:var(--faint);font:inherit;cursor:pointer;
  border-bottom:1px solid transparent;transition:.4s var(--ease)}
.ctl button:hover{color:var(--ink);border-bottom-color:var(--line2)}
.per{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:16px;
  overflow:hidden;margin-bottom:12px;background:rgba(255,255,255,.014)}
:root[data-theme=light] .per{background:#fff}
.per .n{grid-column:1/-1;font:600 8.5px/1 var(--mono);letter-spacing:.2em;color:var(--faint);
  padding:12px 20px 0}
.per .a{padding:12px 20px 18px;font-family:var(--serif);font-size:19px;line-height:1.95;color:var(--ink);
  border-right:1px solid var(--line)}
.per .m{padding:12px 20px 18px;font-size:14.5px;line-height:1.85;color:var(--dim)}
body.nomod .per .m{visibility:hidden}
k{cursor:pointer;border-radius:5px;padding:1px 3px;margin:0 -3px;transition:background .16s,color .16s}
k.on{background:var(--am);color:#12100a;box-shadow:0 0 22px rgba(var(--am-rgb),.35)}
:root[data-theme=light] k.on{color:#fff}
x{color:var(--faint)}
.hint{margin:14px 0 0;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--faint)}

/* 03 · ΤΟ ΚΛΕΙΔΙ — 80 ζευγάρια, δύο κολόνες */
.srch{width:100%;max-width:360px;background:rgba(255,255,255,.02);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;color:var(--ink);font:400 14px var(--sans);margin-bottom:18px}
.srch::placeholder{color:var(--faint)} .srch:focus{outline:none;border-color:rgba(var(--am-rgb),.4)}
.keys{columns:2;column-gap:34px}
@media(max-width:900px){.keys{columns:1}}
.kr{break-inside:avoid;padding:13px 0;border-top:1px solid var(--line)}
.kr .p{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.kr .ka{font-family:var(--serif);font-size:17px;color:var(--ink)}
.kr .ar{color:var(--faint);font-size:12px}
.kr .km{font-size:14px;color:var(--am)}
.kr .kw{margin:6px 0 0;font-size:12.5px;line-height:1.6;color:var(--faint)}
.kr.hid{display:none}

/* 04 · Ο ΣΚΕΛΕΤΟΣ */
.hook{border-left:2px solid var(--am);padding:4px 0 4px 22px;margin:0 0 26px;max-width:74ch}
.hook .h{font-family:var(--serif);font-size:20px;line-height:1.5;color:var(--ink)}
.hook .w{display:block;margin-top:12px;font-size:13.5px;line-height:1.7;color:var(--faint)}
.pts{columns:2;column-gap:40px;margin:0;padding:0;list-style:none;counter-reset:p}
@media(max-width:900px){.pts{columns:1}}
.pts li{break-inside:avoid;padding:14px 0;border-top:1px solid var(--line);counter-increment:p}
.pts li:before{content:counter(p,decimal-leading-zero);display:block;font:600 9px/1 var(--mono);
  letter-spacing:.16em;color:var(--am);opacity:.7;margin-bottom:7px}
.pts .pl{color:var(--ink);font-size:15px}
.pts .pd{display:block;margin-top:5px;font-size:13.5px;line-height:1.62;color:var(--faint)}

/* 05 · ΟΙ ΛΕΞΕΙΣ — τέσσερα επίπεδα, τέσσερις ετικέτες, ποτέ ίδια όψη */
.defs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.defs{grid-template-columns:1fr}}
.def{border:1px solid var(--line);border-radius:16px;padding:20px 22px;background:rgba(255,255,255,.014)}
:root[data-theme=light] .def{background:#fff}
.def.b{border-left:2px solid var(--am)}
.def.m{border-left:2px solid var(--em)}
.def.c{border-left:2px solid var(--line2)}
.def .lb{font:600 9px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);
  margin-bottom:14px}
.def .it{padding:10px 0;border-top:1px solid var(--line)}
.def .it:first-of-type{border-top:none;padding-top:0}
.def .it b{display:block;color:var(--ink);font-family:var(--serif);font-size:17px;font-weight:400}
.def .it span{display:block;margin-top:4px;font-size:13px;line-height:1.6;color:var(--faint)}

/* το κουμπί που κλείνει το βιβλίο */
.go{display:block;width:100%;max-width:640px;margin:56px 0 0;text-align:left;cursor:pointer;
  border:1px solid rgba(var(--am-rgb),.26);border-radius:18px;padding:22px 26px;
  background:linear-gradient(180deg,rgba(var(--am-rgb),.09),rgba(var(--am-rgb),.02) 55%,transparent);
  color:var(--ink);font-family:var(--serif);font-size:23px;transition:.5s var(--ease)}
.go:hover{border-color:rgba(var(--am-rgb),.5);transform:translateY(-2px)}
.go span{display:block;margin-top:9px;font:400 11.5px/1.6 var(--mono);color:var(--faint);
  letter-spacing:.02em}
</style>
</head>
<body>

<div id="pick">
  <b>Δείγμα</b><span>η όψη μαθήματος · Αριστοτέλης, Ενότητα 1η</span>
  <span class="sp"></span>
  <button id="th">◐ Φως / σκοτάδι</button>
  <span class="hint">πάτα λέξη στην «αντιστοιχία»</span>
</div>

<div class="sky"><div class="wrap" id="stage"></div></div>

<script>
(function(){
  'use strict';
  var G = window.ARXGN, box = document.getElementById('stage');
  if (!G || !G.UNITS || !G.UNITS.length){
    box.innerHTML = '<p style="color:#c33;padding:40px 0">Δεν φόρτωσε το corpus — ' +
      'το δείγμα δεν έχει τι να δείξει. Δεν είναι θέμα σχεδίασης.</p>';
    return;
  }
  var U = G.UNITS[0];
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var elc = U.skeleton.points.reduce(function(n,p){ return n + p.must.length; }, 0);

  /* ⭐ Η ΑΡΙΘΜΗΣΗ ΒΓΑΙΝΕΙ ΜΟΝΗ ΤΗΣ, όπως στη ζωντανή: μια ενότητα χωρίς
     `align` έχει δύο στρώσεις λιγότερες και τα καρφωτά 01…05 θα πηδούσαν. */
  var lay = 0; function nx(){ lay++; return (lay<10?'0':'') + lay; }
  function sh(t, n){ return '<div class="sh"><span class="k">' + nx() + '</span>' +
    '<span class="t">' + esc(t) + '</span><span class="r"></span>' +
    '<span class="n">' + esc(n) + '</span></div>'; }

  function side(sg, w){
    return sg[w].map(function(t){
      return t[1] ? '<k data-k="' + esc(t[1]) + '">' + esc(t[0]) + '</k>' : '<x>' + esc(t[0]) + '</x>';
    }).join('');
  }
  function defBlock(list, cls, label){
    if (!list || !list.length) return '';
    return '<div class="def ' + cls + '"><div class="lb">' + esc(label) + '</div>' +
      list.map(function(t){ return '<div class="it"><b>' + esc(t.t) + '</b><span>' + esc(t.d) + '</span></div>'; })
      .join('') + '</div>';
  }

  var h =
    '<div class="vtop"><button class="x" aria-label="Κλείσιμο">✕</button>' +
      '<span class="bc">Αρχαία · Γνωστό · ' + esc(U.section) + '</span></div>' +
    '<header>' +
      '<h1>' + esc(U.title) + '</h1>' +
      '<div class="meta">' + esc(U.chapter) + ' &nbsp;·&nbsp; <b>' + U.skeleton.points.length +
        '</b> σημεία &nbsp;·&nbsp; <b>' + elc + '</b> στοιχεία &nbsp;·&nbsp; ' +
        Object.keys(U.align.pairs).length + ' ζευγάρια λέξεων</div>' +
      (U.byHeart ? '<p class="byh"><b>Η μετάφραση απ’ έξω.</b> Αυτό που λες στην ανάκληση είναι η ' +
        'ΜΕΤΑΦΡΑΣΗ. Το αρχαίο δεν το απαγγέλλεις: το ξέρεις λέξη προς λέξη, και αυτό το εξασκείς ' +
        'στην «αντιστοιχία» και στο «κλειδί» πιο κάτω.</p>' : '') +
    '</header>' +

    '<section>' + sh('Με απλά λόγια', 'διάβασε αυτό πρώτο') +
      '<div class="simple mz">' + U.simple.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') +
      '</div></section>' +

    '<section>' + sh('Η αντιστοιχία', 'πάτα λέξη · ανάβει το ζευγάρι της') +
      '<div class="ctl"><button id="hid">Κρύψε τη μετάφραση</button>' +
        '<button id="clr">Καθάρισε</button></div>' +
      U.align.segs.map(function(sg){
        return '<div class="per"><div class="n">ΠΕΡΙΟΔΟΣ ' + sg.n + '</div>' +
          '<div class="a">' + side(sg,'a') + '</div><div class="m">' + side(sg,'m') + '</div></div>';
      }).join('') +
      '<p class="hint">Πάτα οποιαδήποτε λέξη και ανάβει το ζευγάρι της, όπου κι αν βρίσκεται στην πρόταση.</p>' +
    '</section>' +

    '<section>' + sh('Το κλειδί', Object.keys(U.align.pairs).length + ' ζευγάρια') +
      '<input class="srch" id="q" placeholder="Ψάξε λέξη ή εξήγηση…">' +
      '<div class="keys" id="keys">' + Object.keys(U.align.pairs).map(function(k){
        var p = U.align.pairs[k];
        return '<div class="kr" data-s="' + esc((p.a + ' ' + p.m + ' ' + p.w).toLowerCase()) + '">' +
          '<div class="p"><span class="ka">' + esc(p.a) + '</span><span class="ar">→</span>' +
          '<span class="km">' + esc(p.m) + '</span></div>' +
          '<div class="kw">' + esc(p.w) + '</div></div>';
      }).join('') + '</div></section>' +

    '<section>' + sh('Ο σκελετός', U.skeleton.points.length + ' σημεία · ' + elc + ' στοιχεία') +
      '<div class="hook"><div class="h">' + esc(U.skeleton.hook) + '</div>' +
        (U.skeleton.hookWhy ? '<span class="w">' + esc(U.skeleton.hookWhy) + '</span>' : '') + '</div>' +
      '<ol class="pts">' + U.skeleton.points.map(function(p){
        return '<li><span class="pl">' + esc(p.label) + '</span>' +
          '<span class="pd">' + esc(p.detail) + '</span></li>'; }).join('') + '</ol>' +
    '</section>' +

    '<section>' + sh('Οι λέξεις', 'τι σημαίνει τι') + '<div class="defs">' +
      defBlock(U.terms,   'b', 'Όροι · λόγια του βιβλίου') +
      defBlock(U.vocab,   'm', 'Λεξιλόγιο · δικά μου λόγια') +
      defBlock(U.context, 'c', 'Πλαίσιο · ΕΚΤΟΣ ύλης') +
      defBlock(U.mine,    'c', 'Δικές σου σημειώσεις') +
    '</div></section>' +

    '<button class="go">Κλείσε το βιβλίο και πες το' +
      '<span>' + U.skeleton.points.length + ' σημεία · ' + elc + ' στοιχεία · ' +
      'σε ακούει και σου λέει στο τέλος τι ξέχασες</span></button>';

  box.innerHTML = h;

  /* ── η αντιστοιχία ανάβει ΚΑΙ ΤΙΣ ΔΥΟ πλευρές ─────────────────────── */
  box.addEventListener('click', function(e){
    var w = e.target.closest && e.target.closest('k[data-k]');
    if (!w) return;
    var k = w.getAttribute('data-k'), was = w.classList.contains('on');
    box.querySelectorAll('k.on').forEach(function(n){ n.classList.remove('on'); });
    if (was) return;
    box.querySelectorAll('k[data-k="' + k + '"]').forEach(function(n){ n.classList.add('on'); });
  });
  document.getElementById('clr').onclick = function(){
    box.querySelectorAll('k.on').forEach(function(n){ n.classList.remove('on'); });
  };
  document.getElementById('hid').onclick = function(){
    var off = document.body.classList.toggle('nomod');
    this.textContent = off ? 'Δείξε τη μετάφραση' : 'Κρύψε τη μετάφραση';
  };
  /* ⚠️ Η αναζήτηση ψάχνει ΚΑΙ ΣΤΗΝ ΕΞΗΓΗΣΗ. Ψάχνοντας μόνο τις λέξεις,
     το «δασ» έβγαζε ΜΗΔΕΝ — παλιό εύρημα, δεν το ξανακάνουμε. */
  document.getElementById('q').oninput = function(){
    var v = this.value.trim().toLowerCase();
    box.querySelectorAll('.kr').forEach(function(r){
      r.classList.toggle('hid', !!v && r.dataset.s.indexOf(v) < 0);
    });
  };
  var dark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
  function paint(){ document.documentElement.dataset.theme = dark ? 'dark' : 'light'; }
  paint();
  document.getElementById('th').onclick = function(){ dark = !dark; paint(); };
})();
</script>
</body>
</html>
