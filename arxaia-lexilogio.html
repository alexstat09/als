<!-- ════════════════════════════════════════════════════════════════════
     ⭐ als-v778 (23/11/26) — ΚΑΘΑΡΗ ΣΕΛΙΔΑ, ΧΩΡΙΣ ΠΡΟΓΡΑΜΜΑ. Δική του εντολή:
     «δεν θέλω να μου λέει 1 μέρα 3 μέρες, θέλω να διαλέγω να διαβάζω κάθε
     σελίδα, clean και ωραία» + «το τερακότα δεν εμπνέει». Εγκρίθηκε στο demo
     («μαρέσει», artifact NZ1xkRHZJmtQnKBrzwVTy1).
     · ΑΡΧΙΚΗ = γλώσσα βιβλιοθήκης Ιστορίας/Λατινικών, ΔΙΚΗ ΤΗΣ πένα: ΠΟΡΦΥΡΑ.
       Καρτέλες Σελίδες · Δύσκολες · Ανά ρίζα (όλες οι σελίδες μαζί).
     · ΜΕΣΑ (συνεδρία, παράθυρο) = ΓΡΑΦΙΤΗΣ με λουλακί φως (όπως Γνωστό/Λατινικά).
     · Η ΜΗΧΑΝΗ ΙΔΙΑ: lexilogio-core.js αυτούσιο, ίδιο κλειδί, ίδιο sync. Το
       πρόγραμμα της κάθε σελίδας (stage/history) μένει στην αποθήκη, απλώς
       δεν φαίνεται. Η παλιά μορφή αυτούσια: archive/arxaia-lexilogio.html.
     ── ιστορικό ──
     ΛΕΞΙΛΟΓΙΟ — Αρχαία · άγνωστο (kit «Ερυθρόμορφο», 14/10/26).
     Η σελίδα έχει τη ΔΙΚΗ ΤΗΣ ταυτότητα (τερακότα σε μαύρο), που τη διάλεξε
     ο ίδιος· γι' αυτό δεν φοράει aurora.css ούτε topbar, και κουβαλάει δική
     της έξοδο με λέξη (σταθ. 64). Το CSS είναι του πρωτοτύπου αυτούσιο, με
     δύο μετρημένες αλλαγές (αντίθεση του --faint, <dialog>).
     Η λογική είναι το core.js του kit ΑΥΤΟΥΣΙΟ → lexilogio-core.js.
     Οι σελίδες του φυλλαδίου → data/lexilogio.json. Η πρόοδος → το κλειδί
     metron.lexilogio.v2, appKey 'lexilogio'. Το arxaia.html το ΔΙΑΒΑΖΕΙ
     μόνο (σταθ. 16).
     ════════════════════════════════════════════════════════════════════ -->

<style>
/* «Ερυθρόμορφο»: τερακότα πάνω σε μαύρο, όπως τα ερυθρόμορφα αγγεία */
:root{
  /* ΓΡΑΦΙΤΗΣ — η συνεδρία και το παράθυρο (ίδιες τιμές με tools/gnosto/skin-graf.html).
     Τα ονόματα (--terra κ.λπ.) έμειναν από το kit για να μην αλλάξει ούτε ένας
     κανόνας της συνεδρίας· οι ΤΙΜΕΣ είναι πλέον του Γραφίτη, το «terra» = λουλακί. */
  --bg:oklch(23.5% .010 262); --surface:oklch(26.5% .010 262); --raise:oklch(29.5% .010 262);
  --line:rgba(238,233,223,.09); --line-2:rgba(238,233,223,.16); --line-3:rgba(238,233,223,.06);
  --text:#EEE7DC; --muted:rgba(238,233,223,.80); --faint:rgba(238,233,223,.62);
  --terra:#A5A8FC; --terra-hi:#BFC1FD; --terra-text:#C9CBFD; --terra-bg:rgba(165,168,252,.10); --terra-line:rgba(165,168,252,.42);
  --trap:#E8B25C; --trap-text:#EFC987; --trap-bg:rgba(232,178,92,.09); --trap-line:rgba(232,178,92,.40);
  --claude:#9DB3C9; --claude-text:#CFDAE5; --claude-bg:rgba(157,179,201,.06); --claude-line:rgba(157,179,201,.40);
  --serif:'Literata','Noto Serif',serif;
  --sans:'Commissioner',system-ui,-apple-system,sans-serif;
  /* ΑΡΧΙΚΗ — η βιβλιοθήκη, πένα ΠΟΡΦΥΡΑ (δηλωμένη ΜΙΑ φορά) */
  --lx-band:#0E1117; --lx-bg:#151922; --lx-surf:#1C212C; --lx-surf2:#191E28; --lx-sunk:#262C39;
  --lx-ink:#EDE7DA; --lx-ink2:#D2CBBC; --lx-muted:#9EA4B1; --lx-faint:#7C8394;
  --lx-line:#2A303D; --lx-line2:#3A4150;
  --lx-pen:#C3A5F5; --lx-pen2:#DAC8FA; --lx-pensoft:rgba(195,165,245,.13); --lx-penline:rgba(195,165,245,.45); --lx-onpen:#1B1030; --lx-penrgb:195,165,245;
  --lx-d:"Geologica","IBM Plex Sans",system-ui,sans-serif;
  --lx-b:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --lx-m:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --lx-gr:"Literata","Noto Serif",serif;
  --lx-ease:cubic-bezier(.16,1,.3,1);
  --lx-shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--lx-bg)}
body{color:var(--text);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--muted);text-decoration:none}a:hover{color:var(--text)}
:focus-visible{outline:2px solid var(--terra);outline-offset:3px;border-radius:8px}
.gr{font-family:var(--serif)}
.k{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:5px;border:1px solid currentColor;font:600 11px/1 var(--sans);opacity:.6}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none}

.btn{height:56px;padding:0 26px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:12px;font-weight:600;font-size:16px;white-space:nowrap}
.btn-terra{background:var(--terra);color:#12133A;font-weight:700}.btn-terra:hover{background:var(--terra-hi)}
.btn-terra .k{opacity:.55}
.btn-line{border:1px solid var(--line-2)}.btn-line:hover{border-color:var(--faint)}
.btn-sm{height:44px;padding:0 16px;font-size:14px;border-radius:10px}

/* ════════════════════════════════════════════════════════════════════
   ======= αρχική — als-v778 (23/11/26) =======
   Η ΓΛΩΣΣΑ ΤΗΣ ΒΙΒΛΙΟΘΗΚΗΣ (Ιστορία/Λατινικά, latinika.html) με ΔΙΚΗ ΤΗΣ
   πένα: ΠΟΡΦΥΡΑ. Εγκρίθηκε στο demo («μαρέσει», artifact NZ1xkRHZJmtQnKBrzwVTy1).
   Όλες οι κλάσεις `lx-`: η συνεδρία κρατάει τις δικές της (.k .score .chips
   .note .row .body) και δεν πρέπει να τις αγγίξει τίποτα από εδώ.
   ⛔ Καμία μέρα, κανένα σκαλί στην αρχική (δική του εντολή): διαλέγει ελεύθερα.
   ════════════════════════════════════════════════════════════════════ */
body{ background:var(--lx-bg); }
.lx-k{ font:500 11px/1.35 var(--lx-m); letter-spacing:.14em; text-transform:uppercase; color:var(--lx-muted); }
.lx-gr{ font-family:var(--lx-gr); }
.lx-wrap{ max-width:1180px; margin:0 auto; padding:0 28px calc(80px + env(safe-area-inset-bottom)); }
.lx-in{ max-width:1180px; margin:0 auto; padding:0 28px; }

/* ① μπάντα */
.lx-band{ position:relative; background:var(--lx-band); overflow:hidden; padding:calc(env(safe-area-inset-top) + 10px) 0 84px; }
.lx-band::before{ content:""; position:absolute; right:-10%; top:-70%; width:62%; height:180%; background:radial-gradient(closest-side,rgba(var(--lx-penrgb),.14),transparent); pointer-events:none; }
.lx-band nav{ position:relative; display:flex; align-items:center; gap:16px; flex-wrap:wrap; min-height:56px; }
.lx-band nav .back{ display:inline-flex; align-items:center; min-height:44px; font:14px var(--lx-b); color:#A6ACB8; }
.lx-band nav .back:hover{ color:var(--lx-ink); }
.lx-band nav .tools{ margin-left:auto; display:flex; gap:10px; align-items:center; }
.lx-band .search{ display:flex; align-items:center; gap:10px; width:300px; height:44px; padding:0 14px; border-radius:11px; background:rgba(255,255,255,.03); border:1px solid var(--lx-line); color:var(--lx-muted); }
.lx-band .search:focus-within{ border-color:var(--lx-penline); }
.lx-band .search input{ flex:1; min-width:0; background:none; border:0; outline:none; color:var(--lx-ink); font:14px var(--lx-b); }
.lx-band .search input::placeholder{ color:var(--lx-muted); }
.lx-band .search .k{ border-color:var(--lx-line2); }
.lx-brand{ position:relative; display:flex; align-items:center; gap:12px; margin-top:10px; }
.lx-logo{ width:32px; height:32px; border-radius:9px; background:var(--lx-pen); color:var(--lx-onpen); display:grid; place-items:center; font:italic 500 21px/1 var(--lx-gr); flex:none; }
.lx-brand b{ display:block; font:600 15px/1.2 var(--lx-d); color:var(--lx-ink); }
.lx-brand small{ display:block; font-size:13px; color:var(--lx-muted); }
.lx-hero{ position:relative; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:40px; align-items:end; margin-top:40px; }
.lx-hero:empty{ display:none; }
.lx-hh{ margin-top:12px; font:800 clamp(40px,5.4vw,68px)/1.03 var(--lx-d); letter-spacing:-.025em; color:var(--lx-ink); }
.lx-hh em{ font-style:normal; color:var(--lx-pen); }
.lx-lead{ margin-top:16px; max-width:62ch; font-size:16.5px; line-height:1.62; color:var(--lx-ink2); }
.lx-lead b{ color:var(--lx-ink); font-weight:600; border-bottom:1.5px solid var(--lx-penline); }
.lx-score{ text-align:right; }
.lx-score .n{ font:800 96px/.9 var(--lx-d); letter-spacing:-.04em; color:var(--lx-ink); font-variant-numeric:tabular-nums; }
.lx-score .lx-k{ display:block; margin-top:12px; }
.lx-facts{ display:flex; gap:20px; justify-content:flex-end; margin-top:14px; font-size:14px; color:var(--lx-muted); }
.lx-facts b{ font:600 16px/1 var(--lx-d); color:var(--lx-ink); margin-right:5px; font-variant-numeric:tabular-nums; }
.lx-facts b.p{ color:var(--lx-pen); }

/* ② ταινία: ΜΙΑ γραμμή ανά λέξη (πλήθος = πλήθος) */
.lx-strip{ position:relative; margin-top:-48px; background:var(--lx-surf); border:1px solid var(--lx-line); border-radius:16px; padding:20px 22px 14px; box-shadow:var(--lx-shadow); }
.lx-sth{ display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:14px; }
.lx-leg{ display:flex; gap:16px; }
.lx-leg span{ display:inline-flex; align-items:center; gap:7px; }
.lx-leg i{ width:4px; height:12px; border-radius:1px; background:var(--lx-sunk); }
.lx-leg .l1 i{ background:var(--lx-pen); }
.lx-smap{ display:flex; gap:12px; }
.lx-sg{ flex:var(--n) 1 0; min-width:0; padding:4px 0; border-radius:6px; text-align:left; }
.lx-sb{ display:flex; gap:1.5px; height:34px; }
.lx-sb i{ flex:1 1 0; min-width:0; border-radius:1px; background:var(--lx-sunk); transform-origin:bottom; transition:transform .25s var(--lx-ease); }
.lx-sb i.hd{ background:var(--lx-pen); }
.lx-sg:hover .lx-sb i{ transform:scaleY(1.12); }
.lx-sf{ display:flex; align-items:baseline; gap:7px; margin-top:9px; padding-top:7px; border-top:1px solid var(--lx-line2); }
.lx-sf b{ font:700 15px/1 var(--lx-d); color:var(--lx-ink2); }
.lx-sf span{ font:500 10.5px/1 var(--lx-m); color:var(--lx-faint); white-space:nowrap; }
.lx-sg:hover .lx-sf b{ color:var(--lx-pen); }

/* ③ καρτέλες */
.lx-tabs{ position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:40px; padding:10px 0; background:linear-gradient(var(--lx-bg) 78%,rgba(21,25,34,0)); }
.lx-seg{ display:flex; gap:4px; padding:4px; border-radius:14px; background:var(--lx-surf2); border:1px solid var(--lx-line); max-width:100%; }
.lx-seg button{ display:flex; align-items:center; gap:9px; min-height:44px; padding:0 18px; border-radius:10px; font:600 14.5px/1 var(--lx-d); color:var(--lx-muted); transition:background .2s,color .2s; }
.lx-seg button b{ font:500 11.5px/1 var(--lx-m); color:var(--lx-faint); font-variant-numeric:tabular-nums; }
.lx-seg button[aria-selected="true"]{ background:var(--lx-sunk); color:var(--lx-ink); box-shadow:inset 0 1px 0 rgba(255,255,255,.06); }
.lx-seg button[aria-selected="true"] b{ color:var(--lx-pen); }
.lx-seg button:active{ transform:scale(.97); }
.lx-rev{ display:inline-flex; align-items:center; gap:10px; min-height:44px; padding:0 14px; border-radius:11px; border:1px solid var(--lx-line); font:600 13.5px/1 var(--lx-d); color:var(--lx-muted); }
.lx-rev i{ position:relative; width:34px; height:20px; border-radius:99px; background:var(--lx-sunk); flex:none; transition:background .2s; }
.lx-rev i::after{ content:""; position:absolute; left:3px; top:3px; width:14px; height:14px; border-radius:50%; background:var(--lx-ink2); transition:transform .2s var(--lx-ease); }
.lx-rev[aria-pressed="true"]{ color:var(--lx-ink); border-color:var(--lx-penline); }
.lx-rev[aria-pressed="true"] i{ background:var(--lx-pen); }
.lx-rev[aria-pressed="true"] i::after{ transform:translateX(14px); background:var(--lx-onpen); }
.lx-sec{ margin-top:34px; }
.lx-sech{ display:flex; justify-content:space-between; align-items:end; gap:24px; margin-bottom:20px; }
.lx-sech h2{ margin-top:6px; font:700 32px/1.1 var(--lx-d); letter-spacing:-.015em; color:var(--lx-ink); }
.lx-sech p{ max-width:46ch; text-align:right; font-size:14px; color:var(--lx-muted); }
.lx-sech p b{ color:var(--lx-ink); font-weight:600; }

/* «από πού να ξεκινήσεις» */
.lx-next{ display:grid; grid-template-columns:minmax(0,1fr) 340px; background:var(--lx-surf); border:1px solid var(--lx-line); border-radius:16px; overflow:hidden; box-shadow:var(--lx-shadow); }
.lx-next.solo{ grid-template-columns:minmax(0,1fr); }
.lx-nl{ padding:26px 30px 30px; min-width:0; }
.lx-nl h3{ margin-top:12px; font:700 30px/1.12 var(--lx-d); letter-spacing:-.02em; color:var(--lx-ink); }
.lx-nl h3 em{ font-style:normal; color:var(--lx-pen); }
.lx-sample{ display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:16px; }
.lx-sample span{ font:italic 400 24px/1.3 var(--lx-gr); color:var(--lx-pen2); }
.lx-nl p{ margin-top:14px; max-width:56ch; color:var(--lx-muted); font-size:14.5px; }
.lx-btns{ display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
.lx-go{ display:inline-flex; align-items:center; gap:10px; min-height:48px; padding:0 22px; border-radius:11px; background:var(--lx-pen); color:var(--lx-onpen); font:700 15px/1 var(--lx-d); transition:transform .2s var(--lx-ease),filter .2s; }
.lx-go i{ font-style:normal; transition:transform .25s var(--lx-ease); }
.lx-go:hover{ filter:brightness(1.07); } .lx-go:hover i{ transform:translateX(3px); }
.lx-go:active{ transform:scale(.97); }
.lx-ghost{ display:inline-flex; align-items:center; min-height:48px; padding:0 20px; border-radius:11px; border:1px solid var(--lx-line2); font:600 15px/1 var(--lx-d); color:var(--lx-ink2); }
.lx-ghost:hover{ border-color:var(--lx-penline); color:var(--lx-ink); }
.lx-nr{ border-left:1px solid var(--lx-line); padding:26px 26px 22px; background:var(--lx-surf2); }
.lx-nr ol{ list-style:none; margin-top:12px; }
.lx-nr li{ border-bottom:1px solid var(--lx-line); }
.lx-nr li:last-child{ border-bottom:0; }
.lx-nr li button{ width:100%; display:grid; grid-template-columns:34px minmax(0,1fr) auto; gap:10px; align-items:baseline; min-height:48px; padding:10px 0; }
.lx-nr li i{ font:700 15px/1 var(--lx-d); font-style:normal; color:var(--lx-pen); font-variant-numeric:tabular-nums; }
.lx-nr li .lx-gr{ font-size:19px; color:var(--lx-ink); }
.lx-nr li button:hover .lx-gr{ color:var(--lx-pen); }
.lx-nr li small{ font:500 10.5px/1 var(--lx-m); letter-spacing:.06em; color:var(--lx-muted); white-space:nowrap; }

/* σειρές σελίδων */
.lx-vh{ display:flex; align-items:center; gap:14px; margin:34px 0 12px; }
.lx-vh .lx-k{ color:var(--lx-pen); flex:0 1 auto; min-width:0; } .lx-vh .lx-k.n{ color:var(--lx-muted); }
.lx-vh i{ flex:1; height:1px; background:var(--lx-line); }
.lx-row{ display:block; scroll-margin-top:84px; background:var(--lx-surf); border:1px solid var(--lx-line); border-radius:16px; margin-top:12px; overflow:hidden; transition:border-color .2s; }
.lx-row:hover{ border-color:var(--lx-line2); }
.lx-row[open]{ border-color:var(--lx-penline); }
.lx-row > summary{ list-style:none; display:grid; grid-template-columns:64px minmax(0,1fr) 250px 40px; gap:20px; align-items:center; padding:16px 20px 16px 18px; min-height:88px; cursor:pointer; }
.lx-row > summary::-webkit-details-marker{ display:none; }
.lx-rn{ height:56px; border-radius:12px; background:var(--lx-sunk); display:grid; place-items:center; font:700 24px/1 var(--lx-d); color:var(--lx-muted); font-variant-numeric:tabular-nums; }
.lx-row.has-h .lx-rn{ background:var(--lx-pensoft); color:var(--lx-pen); }
.lx-tt{ min-width:0; }
.lx-t{ display:block; font:500 22px/1.25 var(--lx-gr); color:var(--lx-ink); }
.lx-t em{ font-style:normal; color:var(--lx-faint); padding:0 4px; }
.lx-src{ display:block; margin-top:6px; font:500 11px/1.35 var(--lx-m); letter-spacing:.12em; text-transform:uppercase; color:var(--lx-muted); }
.lx-src .on{ color:var(--lx-pen); }
.lx-mb{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
.lx-dash{ display:flex; gap:1.5px; width:100%; max-width:250px; height:14px; }
.lx-dash i{ flex:1 1 0; min-width:0; border-radius:1px; background:var(--lx-sunk); }
.lx-dash i.hd{ background:var(--lx-pen); }
.lx-cnt{ font:500 11px/1 var(--lx-m); letter-spacing:.06em; color:var(--lx-muted); }
.lx-cnt b{ font-weight:700; color:var(--lx-pen); }
.lx-chev{ width:38px; height:38px; border-radius:10px; border:1px solid var(--lx-line2); display:grid; place-items:center; color:var(--lx-muted); transition:transform .3s var(--lx-ease),color .2s,border-color .2s; }
.lx-chev::before{ content:""; width:7px; height:7px; border:solid currentColor; border-width:0 1.8px 1.8px 0; transform:translateY(-2px) rotate(45deg); }
.lx-row[open] .lx-chev{ transform:rotate(180deg); color:var(--lx-pen); border-color:var(--lx-penline); }
/* ενότητες (als-v780): ο τίτλος σπάει στο «:» — η πράξη πάνω, οι ρίζες της από κάτω */
.lx-t.ut{ font-size:21px; }
.lx-ur{ display:block; margin-top:4px; font:400 15.5px/1.4 var(--lx-gr); color:var(--lx-ink2); }
.lx-uroots{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.lx-uroots span{ font:500 13.5px/1 var(--lx-gr); color:var(--lx-ink2); padding:5px 9px; border:1px solid var(--lx-line); border-radius:8px; }
.lx-uroots .more{ font-family:var(--lx-m); font-size:11.5px; letter-spacing:.06em; color:var(--lx-muted); }
.lx-body{ border-top:1px solid var(--lx-line); padding:22px 22px 26px 102px; }

<script>
(function(){
'use strict';
/* ════════════════════════════════════════════════════════════════════
   ΛΕΞΙΛΟΓΙΟ — η σελίδα. Η ΛΟΓΙΚΗ ζει αυτούσια στο `lexilogio-core.js`
   (το core.js του kit, byte προς byte)· εδώ ζει μόνο η οθόνη και η
   αποθήκη. Τρία πράγματα εδώ ΔΕΝ υπήρχαν στο πρωτότυπο και είναι όλα
   άμυνα για το sync (CLAUDE.md §3):
   1. ⭐ ΣΦΡΑΓΙΔΑ `_ts` σε κάθε εγγραφή του `pages` και του `hard`
      (σταθ. 31). Χωρίς αυτή, η ΔΕΥΤΕΡΗ επανάληψη μιας σελίδας γυρνάει
      πίσω από το cloud μέσα σε 400ms. Τη βάζει το `save()`, μέσω του
      `study-stamp.js`, όχι κάθε ανάθεση.
   2. ⭐ ΤΑΦΟΠΛΑΚΑ όταν μια λέξη φεύγει από τις Δύσκολες (σταθ. 32/61),
      γραμμένη από τη σελίδα τη στιγμή του σβησίματος, αλλιώς το cloud
      την ξαναφέρνει.
   3. ⭐ ΚΑΜΙΑ ΣΙΩΠΗΛΗ ΑΠΟΤΥΧΙΑ (σταθ. 10/17): μια αποθήκη που δεν
      διαβάζεται ΔΕΝ ξαναγράφεται από πάνω με κενή, και ένα save που
      δεν έπιασε το λέει, όσο ισχύει.
   ════════════════════════════════════════════════════════════════════ */
const C = window.LexCore, rng = Math.random;
const KEY = 'metron.lexilogio.v2';
const APP = 'lexilogio';
const TOMB_KEY = '__synctomb__' + APP;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const words = n => n === 1 ? '1 λέξη' : `${n} λέξεις`;
const cardsWord = n => n === 1 ? '1 κάρτα' : `${n} κάρτες`;
const NUMS = ['μία','δύο','τρεις','τέσσερις','πέντε','έξι','επτά','οκτώ','εννέα','δέκα'];
const countWord = n => n <= 10 ? NUMS[n-1] : String(n);
const ICON = {
  trap:'<svg class="i" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></svg>',
  hook:'<svg class="i" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>',
  /* Μόνο εικονίδιο: «πες το δυνατά, στον εαυτό σου». Η σελίδα ΔΕΝ ακούει
     (σταθ. 42 — η αναγνώριση φωνής ζει μόνο στην istoria.html). */
  mic:'<svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>'
};
const MONTHS = ['Ιανουαρίου','Φεβρουαρίου','Μαρτίου','Απριλίου','Μαΐου','Ιουνίου','Ιουλίου','Αυγούστου','Σεπτεμβρίου','Οκτωβρίου','Νοεμβρίου','Δεκεμβρίου'];
const WD = ['Κυριακή','Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο'];

const qp = new URLSearchParams(location.search).get('today');
const TODAY = /^\d{4}-\d{2}-\d{2}$/.test(qp || '') ? qp : C.toISO(new Date());
const dObj = iso => { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d, 12); };
if (qp) $('testday').innerHTML = `<span class="testday">δοκιμή: ${C.prettyDate(TODAY)}</span>`;

/* ===================== η αποθήκη ===================== */
/* Δύο λόγοι να ΜΗΝ γράψουμε, κρατημένοι χωριστά γιατί λύνονται αλλιώς:
   BLOCK = η αποθήκη υπάρχει αλλά δεν διαβάζεται (ένα save θα την έσβηνε) ·
   SAVE_ERR = το τελευταίο save δεν έπιασε (λύνεται με το επόμενο που πιάνει). */
let BLOCK = '', SAVE_ERR = '', SYNC_NOTE = '';
const blank = () => ({ v:2, pages:{}, hard:{}, extra:[] });
const isMap = o => !!o && typeof o === 'object' && !Array.isArray(o);
function load(){
  let raw;
  try { raw = localStorage.getItem(KEY); }
  catch(e){ BLOCK = `Δεν μπορώ να διαβάσω την αποθήκη αυτής της συσκευής (${e.name || 'σφάλμα'}). Δεν γράφω τίποτα, για να μη σβήσω την πρόοδό σου.`; return blank(); }
  if (raw == null){ BLOCK = ''; return blank(); }
  let s = null; try { s = JSON.parse(raw); } catch(e){}
  if (!isMap(s) || s.v !== 2){
    BLOCK = 'Η πρόοδός σου υπάρχει σε αυτή τη συσκευή αλλά δεν διαβάζεται. Δεν γράφω από πάνω της· κατέβασε αντίγραφο από το backup πριν κάνεις οτιδήποτε άλλο.';
    return blank();
  }
  BLOCK = '';
  /* Σταθ. 35: κρατάμε ΟΛΑ τα πεδία όπως ήρθαν και φτιάχνουμε μόνο όσα
     ξέρουμε ότι λείπουν. Ένα πεδίο που θα προσθέσει αύριο άλλη έκδοση
     δεν χάνεται στο πρώτο save. */
  if (!isMap(s.pages)) s.pages = {};
  if (!isMap(s.hard)) s.hard = {};
  if (!Array.isArray(s.extra)) s.extra = [];
  return s;
}
let S = blank();
/* Καινούριο κλειδί → καμία εγγραφή χωρίς `_ts` από παλιά, άρα ο παλιός χρόνος είναι 0. */
const STAMP = window.StudyStamp ? window.StudyStamp(() => [S.pages, S.hard], () => 0) : null;
const NO_STAMP = 'Δεν φόρτωσε το study-stamp.js, που κρατάει την πρόοδο ζωντανή μέσα από τον συγχρονισμό. Ανανέωσε τη σελίδα· μέχρι τότε δεν γράφω τίποτα.';
function reload(){ S = load(); if (STAMP) STAMP.seed(); else BLOCK = NO_STAMP; }

/* Επιστρέφει true ΜΟΝΟ αν ξαναδιαβάσαμε αυτό που γράψαμε: ένα localStorage
   που σωπαίνει αντί να πετάξει (Safari, γεμάτος χώρος) περνάει κάθε catch. */
function save(){
  if (BLOCK){ paintWarn(); return false; }
  STAMP.stamp();
  if (DATA) S.extra = ownExtra();
  const txt = JSON.stringify(S);
  let back = null;
  try { localStorage.setItem(KEY, txt); back = localStorage.getItem(KEY); }
  catch(e){ SAVE_ERR = `Δεν αποθηκεύτηκε (${e.name || 'σφάλμα'}). Η συσκευή μάλλον δεν έχει χώρο· ό,τι κάνεις τώρα δεν κρατιέται μέχρι να ελευθερωθεί.`; paintWarn(); return false; }
  if (back !== txt){ SAVE_ERR = 'Δεν αποθηκεύτηκε: η συσκευή δέχτηκε την εγγραφή αλλά δεν την κράτησε. Ό,τι κάνεις τώρα δεν κρατιέται.'; paintWarn(); return false; }
  if (SAVE_ERR){ SAVE_ERR = ''; paintWarn(); }
  return true;
}
/* Η ταφόπλακα μιας λέξης που έφυγε από τις Δύσκολες. Μόνο ΜΕΤΑ από
   επιβεβαιωμένο save, στο ακριβές επίπεδο που διαβάζει το sync.js
   (tomb[KEY].hard[id]), με T = max(now, _ts + 1) (σταθ. 32, κατά λέξη). */
function tombHard(ids, recs){
  if (!ids.length) return;
  try {
    let t = JSON.parse(localStorage.getItem(TOMB_KEY) || '{}'); if (!isMap(t)) t = {};
    if (!isMap(t[KEY])) t[KEY] = {};
    if (!isMap(t[KEY].hard)) t[KEY].hard = {};
    const node = t[KEY].hard, now = Date.now();
    ids.forEach(id => {
      const cur = typeof node[id] === 'number' ? node[id] : 0;
      const ts = recs[id] && +recs[id]._ts || 0;
      node[id] = Math.max(cur, now, ts + 1);
    });
    const txt = JSON.stringify(t);
    localStorage.setItem(TOMB_KEY, txt);
    if (localStorage.getItem(TOMB_KEY) !== txt) throw new Error('δεν κρατήθηκε');
  } catch(e){
    SAVE_ERR = 'Οι λέξεις που έφυγαν από τις Δύσκολες ίσως ξαναγυρίσουν από άλλη συσκευή: δεν μπόρεσα να το σημειώσω (' + (e.message || e.name) + ').';
    paintWarn();
  }
}
function paintWarn(){
  const box = $('warn'); if (!box) return;
  const msgs = [BLOCK, SAVE_ERR].filter(Boolean);
  box.hidden = !msgs.length;
  box.innerHTML = msgs.map(m => `<p>${esc(m)}</p>`).join('');
}

/* ===================== τα δεδομένα ===================== */
/* Οι σελίδες του φυλλαδίου ζουν στο data/lexilogio.json· όσες εισάγει ο
   ίδιος, στο S.extra. Μια αποτυχία φόρτωσης ΛΕΓΕΤΑΙ — δεν ζωγραφίζεται
   ως «καμία σελίδα» (σταθ. 10). */
let DATA = null, DATA_ERR = '';
/* Μια σελίδα που πέρασε από το S.extra στο data/ (ίδιο id) μετράει μία φορά:
   κερδίζει το data/, και το αντίγραφο του extra φεύγει με το επόμενο save. */
const dataIds = () => new Set(DATA ? DATA.pages.map(p => p.id) : []);
const ownExtra = () => { const have = dataIds(); return (S.extra || []).filter(p => !have.has(p.id)); };
const allPages = () => (DATA ? DATA.pages : []).concat(ownExtra()).slice().sort((a,b) => a.n - b.n);
const pageById = id => allPages().find(p => p.id === id);
const title = p => p.unit ? `Ενότητα ${p.n}` : `Σελίδα ${p.n}`;

/* ===================== οι ενότητες (als-v780) ===================== */
/* data/lexilogio-units.json: ΜΟΝΟ ομαδοποίηση (ids), οι λέξεις μένουν στο
   data/lexilogio.json. Κάθε οικογένεια ολόκληρη σε μία ενότητα (το εγγυάται το
   tests/lexilogio-data.test.js). ⛔ Καμία αποθήκευση ανά ενότητα: μια ενότητα δεν
   έχει δική της εγγραφή, ό,τι κρατιέται είναι οι Δύσκολες (κοινά ids). Αν το
   αρχείο δεν φορτώσει, η καρτέλα το ΛΕΕΙ· οι άλλες δουλεύουν (σταθ. 10). */
let UNITS = null, UNITS_ERR = '', openUnit = null;
function unitList(){
  if (!UNITS) return [];
  return UNITS.units.map(u => {
    const cards = u.ids.map(id => CARDS[id]).filter(Boolean);
    return { id: u.id, n: u.n, title: u.title, cards, missing: u.ids.length - cards.length, unit: true };
  });
}
/* Η «σελίδα» που τρέχει η μηχανή του «Διάβασε» για μια ενότητα: ψεύτικο id,
   ΠΑΝΤΑ R.eph (δεν γράφει ποτέ στο S.pages). */
const unitPage = u => ({ id: 'unit:' + u.id, n: u.n, unit: true, utitle: u.title, cards: u.cards });
let CARDS = {};
function index(){ CARDS = {}; allPages().forEach(p => p.cards.forEach(c => { CARDS[c.id] = Object.assign({ pageN: p.n, pageId: p.id }, c); })); }

const joinGr = arr => arr.length <= 1 ? (arr[0] || '') : arr.slice(0, -1).join(', ') + ' και ' + arr[arr.length - 1];

/* ===================== αρχική (als-v778) ===================== */
/* ⛔ Καμία μέρα, κανένα σκαλί, κανένα «σήμερα» (δική του εντολή 23/11/26):
   διαλέγει ελεύθερα σελίδα ή ρίζα. Το πρόγραμμα της μηχανής (S.pages:
   stage/history) ΔΕΝ σβήνεται· απλώς δεν ζωγραφίζεται. */

      : '<section class="lx-load"><p>Φορτώνει το φυλλάδιο…</p></section>';
    return;
  }
  index(); families();
  const pages = allPages(), nW = Object.keys(CARDS).length, nH = hardIds().length, nF = FAMS.length;
  $('hero').innerHTML = heroHTML(pages.length, nW, nF, nH);
  const bps = pages.map(p => +p.bookPage).filter(Number.isFinite);
  $('brandSub').textContent = 'Φυλλάδιο Πυθαγόρα' + (bps.length ? ` · σελ. ${Math.min(...bps)}–${Math.max(...bps)}` : '');
  const q = C.fold($('q').value.trim());
  if (q.length >= 2){ $('main').innerHTML = secSearch(q); return; }
  const pane = TAB === 'hard' ? paneHard(pages, nH) : TAB === 'roots' ? paneRoots(nW) : TAB === 'pages' ? panePages(pages, nH) : paneUnits(nH);
  $('main').innerHTML = stripHTML(pages) + tabsHTML(pages.length, nH, nF) + `<div class="lx-pane" id="pane-${TAB}" role="tabpanel" aria-labelledby="tab-${TAB}">${pane}</div>` + footerHTML();
}

/* Το <details> ανοιγοκλείνει μόνο του· κρατάμε ποιο είναι ανοιχτό για το επόμενο render. */
document.addEventListener('toggle', e => { const d = e.target; if (!d || !d.dataset) return;

  if (go === 'first') startFirst(pid);
  else if (go === 'ufirst'){ if (un) startUnitFirst(un); }
  else if (go === 'upractice'){ if (un) startQuiz(un.cards.map(c => c.id), `${title(un)} · ρώτα με`); }
  else if (go === 'uhard'){ if (un) startQuiz(un.cards.map(c => c.id).filter(isHard), `${title(un)} · οι δύσκολες`); }
  else if (go === 'ucover'){ const k = t.dataset.unit; covered.has(k) ? covered.delete(k) : covered.add(k); openUnit = k; render(); }
  else if (go === 'practice'){ const p = pageById(pid); if (p) startQuiz(p.cards.map(c => c.id), `${title(p)} · ρώτα με`); }
  else if (go === 'pagehard'){ const p = pageById(pid); if (p) startQuiz(p.cards.map(c => c.id).filter(isHard), `${title(p)} · οι δύσκολες`); }
  else if (go === 'cover'){ covered.has(pid) ? covered.delete(pid) : covered.add(pid); openRow = pid; render(); }
  else if (go === 'hard') startHard();
  else if (go === 'all') startQuiz(Object.keys(CARDS), 'Όλες ανακατεμένες');
  else if (go === 'rev'){ REV = !REV; try { localStorage.setItem(REV_KEY, REV ? 'rev' : 'fwd'); } catch(e){} render(); }
  else if (go === 'add') openModal();
  else if (go === 'export'){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type:'application/json' })); a.download = `lexilogio-${TODAY}.json`; a.click(); }

  if (!DATA){ m.className = 'msg err'; m.textContent = 'Πρώτα πρέπει να φορτώσει το φυλλάδιο, για να ελέγξω ότι η σελίδα δεν υπάρχει ήδη. Ανανέωσε τη σελίδα και ξαναδοκίμασε.'; return; }

});

/* ===================== συνεδρία ===================== */
/* Είδη (als-v778):
   · first — «Διάβασε»: Γνωριμία ανά οικογένεια + ερωτήσεις, η μηχανή του kit.
     Σελίδα που δεν έχει ξεκινήσει ή είναι στη μέση → γράφεται όπως πάντα
     (συνεχίζει από εκεί που έμεινε). Σελίδα που ΕΧΕΙ ήδη περαστεί → R.eph:
     ⛔ ΔΕΝ αγγίζει το S.pages (το ιστορικό της μένει), κρατάει ΜΟΝΟ τις
     λέξεις που δυσκόλεψαν → Δύσκολες.
   · quiz — «Ρώτα με» (σελίδα, ρίζα, δύσκολες σελίδας, όλες): ανακατεμένα.
     ⭐ Κάθε λέξη που χάνεται με την πρώτη γράφεται ΑΜΕΣΩΣ στις Δύσκολες,
     ώστε ένα κλείσιμο στη μέση να μη χάνει τίποτα. Το πρόγραμμα δεν αλλάζει.
   · hard — «Ρώτα με τις δύσκολες»: ΟΛΕΣ, όποτε θέλει. Η αποφοίτηση θέλει
     σωστή με την πρώτη σε ΔΥΟ διαφορετικές μέρες (C.applyHardSeg: μια λέξη
     που ήδη απαντήθηκε σήμερα δεν μετράει ξανά) και γράφει ΤΑΦΟΠΛΑΚΑ.
   · root — φύλλο ρίζας (μόνο προβολή) → «Ρώτα με αυτή τη ρίζα» = quiz. */
let R = null;
function openSession(){ $('session').classList.add('on'); document.body.style.overflow = 'hidden'; }
function closeSession(){ keepEphHard(); $('session').classList.remove('on'); document.body.style.overflow = ''; R = null; render(); }
/* «Διάβασε» που ΔΕΝ γράφει S.pages (ενότητα, ή σελίδα ήδη περασμένη = R.eph):
   αν κλείσει στη μέση, οι λέξεις που τον δυσκόλεψαν ΩΣ ΕΚΕΙ πάνε στις
   Δύσκολες, αλλιώς χάνονται μαζί με το R. Μία φορά ανά συνεδρία (το addHard
   μηδενίζει το σερί μιας ήδη δύσκολης· το finish το κάνει ήδη στο τέλος). */
function keepEphHard(){
  if (!R || R.kind !== 'first' || !R.eph || R.done) return;
  R.done = true;
  const ids = C.passHardCards(R.s).filter(id => CARDS[id]);
  if (!ids.length) return;
  const before = S.hard; S.hard = C.addHard(S.hard, ids, TODAY); if (!save()) S.hard = before;
}
$('sClose').addEventListener('click', closeSession);
/* Ένα sync που ήρθε στη μέση μπορεί να έχει αντικαταστήσει την εγγραφή της
   σελίδας· το πέρασμα που τρέχει είναι πάντα αυτό που γράφεται. */
function putPass(){ if (R.eph) return; const ps = S.pages[R.pageId]; if (ps && ps.status === 'learning') ps.pass = R.s; else S.pages[R.pageId] = { status:'learning', pass:R.s }; save(); }

function startUnitFirst(u){
  if (!u.cards.length) return;
  const p = unitPage(u);
  R = { kind:'first', s: C.newFirstPass(p.cards), pageId: p.id, page: p, eph: true }; openSession(); step();
}
function startFirst(pageId){
  const p = pageById(pageId); if (!p) return;
  const ps = S.pages[pageId];
  const eph = !!(ps && ps.status === 'active');
  const s = ps && ps.status === 'learning' && ps.pass ? cleanPass(ps.pass, p) : C.newFirstPass(p.cards);
  R = { kind:'first', s, pageId, page:p, eph }; putPass(); openSession(); step();
}
/* Ένα πέρασμα που συνεχίζει κρατάει ΜΟΝΟ λέξεις της σελίδας του. Ό,τι άλλο
   (π.χ. το `"undefined"` του παλιού bug) φεύγει· η πρόοδος των αληθινών μένει. */
function cleanPass(s, p){
  const ok = new Set(p.cards.map(c => c.id)), keep = id => ok.has(id);
  s.queue = (Array.isArray(s.queue) ? s.queue : []).filter(keep);
  ['right','wrongs'].forEach(f => {
    const src = isMap(s[f]) ? s[f] : {}, out = {};
    ok.forEach(id => { const n = +src[id]; out[id] = Number.isFinite(n) ? n : 0; });
    s[f] = out;
  });
  if (Array.isArray(s.chunks)) s.chunks.forEach(ch => {
    ch.ids = (ch.ids || []).filter(keep);
    (ch.groups || []).forEach(g => { g.ids = (g.ids || []).filter(keep); });
  });
  /* Άδεια ουρά στη μέση κομματιού = ξαναδείξε τη Γνωριμία, ΟΧΙ «τέλος». */
  if (s.step === 'learn' && !s.queue.length) s.step = 'preview';
  return s;
}
function startQuiz(ids, label){
  ids = ids.filter(id => CARDS[id]); if (!ids.length) return;
  R = { kind:'quiz', s: C.newDaily([{ id:'quiz', cardIds: ids }], [], rng), label, hist:[] };
  openSession(); step();
}
function startHard(){
  const ids = hardIds(); if (!ids.length) return;
  R = { kind:'hard', s: C.newDaily([], ids, rng), label:'Δύσκολες', hist:[] };
  openSession(); step();
}
const current = () => R.kind === 'first' ? C.firstCurrent(R.s) : C.dailyCurrent(R.s);
const progress = () => R.kind === 'first' ? C.firstProgress(R.s) : C.dailyProgress(R.s);
const foot = html => { $('sFoot').innerHTML = html; };

function step(){
  const cur = current(), pr = progress();
  $('sBar').style.width = pr.pct + '%'; $('sCount').textContent = `${pr.done} / ${pr.total}`; $('toast').textContent = '';
  $('sRail').innerHTML = cur ? railHTML(cur) : '';
  if (!cur) return finish();
  if (cur.type === 'preview') return showPreview(cur);
  showCard(cur);
}
/* Η ράγα: μία γραμμούλα ανά κάρτα. quiz/hard = με τη σειρά που απαντήθηκαν (R.hist)·
   «Διάβασε» = οι κάρτες της σελίδας (λουλακί όταν φτάσει 3 σωστές). */
function railHTML(cur){
  if (R.kind === 'first'){
    const now = cur.type === 'card' ? cur.id : null;
    return R.page.cards.map(c => c.id).map(id => `<i class="${id === now ? 'now' : R.s.right[id] >= 3 ? 'ok' : R.s.wrongs[id] > 0 ? 'no' : ''}"></i>`).join('');
  }
  const total = R.s.segs.reduce((a, sg) => a + sg.ids.length, 0), h = R.hist || [];
  return h.map(ok => `<i class="${ok ? 'ok' : 'no'}"></i>`).join('') + (h.length < total ? '<i class="now"></i>' : '') + '<i></i>'.repeat(Math.max(0, total - h.length - 1));
}
const endRail = oks => `<div class="endrail" aria-hidden="true">${oks.map((ok,i) => `<i style="--i:${i}" class="${ok ? '' : 'no'}"></i>`).join('')}</div>`;
function where(){
  if (R.kind === 'first') return `${title(R.page)} · διάβασμα · ${R.s.step === 'consolidate' ? (R.page.unit ? 'όλη η ενότητα ανακατεμένη' : 'όλη η σελίδα ανακατεμένη') : `κομμάτι ${R.s.ci + 1} από ${R.s.chunks.length}`}`;
  return esc(R.label) + (REV ? ' <span>· ανάποδα</span>' : '');
}
const lineHTML = (cls, icon, text) => `<div class="ln ${cls}">${icon}<span>${esc(text)}</span></div>`;
const iwHTML = (c, withPage) => `<div class="iw${withPage && isHard(c.id) ? ' hd' : ''}"><div class="top"><span class="gr">${esc(c.front)}</span><span class="mn">${esc(c.back)}</span></div>${withPage ? `<div class="pgt">Σελίδα ${c.pageN}${isHard(c.id) ? ' · <b>δύσκολη</b>' : ''}</div>` : ''}${c.trap ? lineHTML('t', ICON.trap, c.trap) : ''}${c.hook ? lineHTML('c', ICON.hook, c.hook) : ''}</div>`;
const legendHTML = '<div class="ilegend"><span><i style="background:var(--trap)"></i>παγίδα</span><span><i style="background:var(--claude)"></i>γάντζος του Claude</span></div>';

function showPreview(cur){

  const fams = cur.chunk.groups.map(g => `<div class="fam"><div class="famh"><span class="gr">${esc(g.family)}</span><span>οικογένεια · ${words(g.ids.length)}</span></div>
    <div class="igrid">${g.ids.map(id => iwHTML(CARDS[id])).join('')}</div></div>`).join('');
  $('sBody').innerHTML = `<div class="intro"><div class="eyebrow">Γνωριμία</div><h1>Διάβασέ τες μία φορά, με την ησυχία σου</h1>${fams}${legendHTML}</div>`;

/* Το φύλλο μιας ρίζας: όλες οι λέξεις της από όλες τις σελίδες, μαζί. */
function showRoot(f){

      <div class="rmeta"><div class="n num">${f.ws.length}</div><span class="lbl">${f.ws.length === 1 ? 'λέξη' : 'λέξεις'}${f.hard ? ` · ${f.hard} ${hardWord(f.hard)}` : ''}</span><div class="rpages">${f.pages.map(n => `<i>${n}</i>`).join('')}</div></div></div>

function wordSize(t){ return t.length > 16 ? 'xl' : t.length > 10 ? 'l' : ''; }
/* als-v781: η λέξη της κάρτας ΧΩΡΑΕΙ πάντα — στο κινητό η «ἀφικνοῦμαι» κοβόταν δεξιά-αριστερά.
   Μετά το «/» επιτρέπεται αλλαγή γραμμής· ό,τι πάλι δεν χωράει μικραίνει ώσπου να χωρέσει. */
const wordHTML = t => esc(t).replace(/\//g, '/<wbr>');
function fitWord(){
  const w = document.querySelector('#card .c-word'); if (!w) return;
  w.style.fontSize = '';
  const box = w.parentElement, cs = getComputedStyle(box);
  const avail = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  let px = parseFloat(getComputedStyle(w).fontSize), n = 0;
  while (w.scrollWidth > avail + 1 && px > 22 && n++ < 40){ px -= 2; w.style.fontSize = px + 'px'; }
}
addEventListener('resize', fitWord);
/* «Ανάποδα» (REV) μόνο στις ερωτήσεις, ποτέ στη Γνωριμία/«Διάβασε». */
const revNow = () => REV && R.kind !== 'first';
function showCard(cur){
  R.revealed = false; R.cur = cur;
  const c = CARDS[cur.id], rv = revNow();
  $('sWhere').innerHTML = where();
  /* Ανάποδα: η οικογένεια ΔΕΝ φαίνεται (θα πρόδιδε τη λέξη). */
  const famHTML = rv ? 'νέα → αρχαία' : c.family === LONE ? 'χωρίς οικογένεια' : `οικογένεια · <b>${esc(c.family)}</b>`;
  let need = '<span></span>';
  if (R.kind === 'first'){ const r = Math.min(R.s.right[cur.id], 3); need = `<span class="need"><span class="dots">${[0,1,2].map(i => `<i class="${i < r ? 'on' : ''}"></i>`).join('')}</span>σωστή ${r} από 3</span>`; }
  $('sBody').style.justifyContent = 'center';
  const shown = rv ? c.back : c.front;
  $('sBody').innerHTML = `<div class="card" id="card"><div class="chd"><span class="cfam">${famHTML}</span><span class="cpg">Σελ. ${c.pageN}</span></div>
    <div class="cbody" id="cR"><div class="c-word ${rv ? 'nw' : ''} ${wordSize(shown)}">${wordHTML(shown)}</div><div class="c-ask">${ICON.mic}<span class="big">${rv ? 'Πες την αρχαία λέξη δυνατά' : 'Πες τη σημασία δυνατά'}</span></div></div>
    <div class="cft">${need}<span class="hint">Space για να τη δεις</span></div></div>`;
  foot(`<button class="btn btn-line" id="show"><span class="k">Space</span>${rv ? 'Δείξε τη λέξη' : 'Δείξε τη σημασία'}</button>`);
  $('show').addEventListener('click', reveal);
  fitWord();
}
function reveal(){
  if (!R || R.revealed || !R.cur) return; R.revealed = true;
  const c = CARDS[R.cur.id];
  const rv = revNow(), shown = rv ? c.back : c.front;
  let a = `<div class="c-word ${rv ? 'nw' : ''} ${wordSize(shown)}">${wordHTML(shown)}</div>` + (rv
    ? `<div class="mean"><span class="lbl">η λέξη · ${esc(c.family === LONE ? 'χωρίς οικογένεια' : c.family)}</span><span class="meaning gr">${esc(c.front)}</span></div>`
    : `<div class="mean"><span class="lbl">φυλλάδιο</span><span class="meaning">${esc(c.back)}</span></div>`);
  if (c.trap) a += `<div class="box trap">${ICON.trap}<div class="body"><span class="h">Παγίδα</span><span>${esc(c.trap)}</span></div></div>`;
  if (c.hook) a += `<div class="box hook">${ICON.hook}<div class="body"><span class="h">Γάντζος του Claude</span><span>${esc(c.hook)}</span></div></div>`;
  if (c.note) a += `<div class="box note">Σημείωση του Claude: ${esc(c.note)}</div>`;
  $('card').classList.add('rev'); $('cR').innerHTML = a; fitWord();
  const ft = document.querySelector('.cft .hint'); if (ft) ft.textContent = '1 δεν το ήξερα · 2 το ήξερα';
  foot(`<button class="btn btn-line" id="no"><span class="k">1</span>Δεν το ήξερα</button><button class="btn btn-terra" id="yes"><span class="k">2</span>Το ήξερα</button>`);
  $('no').addEventListener('click', () => grade(false)); $('yes').addEventListener('click', () => grade(true));
}
function grade(ok){
  /* Μία βαθμολόγηση ανά κάρτα που ΦΑΙΝΕΤΑΙ. Το `revealed` σβήνει εδώ, αλλιώς
     ένα δεύτερο «2» πάνω στη Γνωριμία (ή σε οθόνη τέλους) βαθμολογούσε κάρτα
     που δεν υπήρχε, και η ουρά κουβαλούσε για πάντα το `"undefined"` (σελ. 177, 11/11). */
  if (!R || !R.revealed || !R.cur) return; R.revealed = false;
  const id = R.cur.id; R.cur = null;
  if (R.kind === 'first'){ C.firstAnswer(R.s, ok, rng); putPass(); step(); if (!ok && R && R.kind === 'first') $('toast').textContent = 'Θα την ξαναδείς σε λίγο.'; return; }
  const sg = R.s.segs[R.s.si], firstTry = sg && sg.first[id] === null;
  if (firstTry && R.hist) R.hist.push(!!ok);
  const res = C.dailyAnswer(R.s, ok, rng);
  /* quiz: η χαμένη (με την πρώτη) πάει ΑΜΕΣΩΣ στις Δύσκολες. */
  if (R.kind === 'quiz' && !ok && firstTry){ const before = S.hard; S.hard = C.addHard(S.hard, [id], TODAY); if (!save()) S.hard = before; }
  if (res.segDone && R.kind === 'hard') return hardDone(res.segDone);
  if (res.finished) return finish();
  step(); if (!ok) $('toast').textContent = 'Θα την ξαναδείς σε λίγο.';
}

/* οθόνες τέλους — μόνο ΠΟΣΕΣ ήξερες και ΠΟΙΕΣ έχασες· καμία ημερομηνία */
const chips = (label, ids, cls) => ids.length ? `<div><div class="chipsl">${label}</div><div class="chips ${cls || ''}">${ids.map(id => `<span>${esc(CARDS[id].front)}</span>`).join('')}</div></div>` : '';
function endScreen(html, label, onGo, second, onSecond){
  $('sBar').style.width = '100%'; $('sCount').textContent = ''; $('sWhere').innerHTML = ''; $('toast').textContent = ''; $('sRail').innerHTML = '';
  $('sBody').style.justifyContent = 'center';
  $('sBody').innerHTML = `<div class="end">${html}</div>`;
  foot((second ? `<button class="btn btn-line" id="again">${second}</button>` : '') + `<button class="btn btn-terra" id="cont"><span class="k">Enter</span>${label}</button>`);
  $('cont').addEventListener('click', onGo); if (second) $('again').addEventListener('click', onSecond);
}
const scoreHTML = (eyebrow, right, total, under) => `<div><div class="eyebrow">${eyebrow}</div><div class="score num${right === total ? ' full' : ''}">${right}<small> / ${total}</small></div><div class="under">${under}</div></div>`;
function hardDone(sg){
  const prev = S.hard, r = C.applyHardSeg(S.hard, sg, TODAY); S.hard = r.hard;
  if (save()) tombHard(r.graduated, prev);
  const miss = C.segMisses(sg);
  endScreen(scoreHTML('Δύσκολες', sg.ids.length - miss.length, sg.ids.length, 'σωστές με την πρώτη') + endRail(R.hist)
    + (r.graduated.length ? chips('Αυτές έφυγαν από τις Δύσκολες', r.graduated, 'ok') : '<p class="under">Όσες είπες σωστά φεύγουν όταν τις βρεις σωστά και σε άλλη μέρα.</p>')
    + chips('Αυτές θέλουν κι άλλο', miss),
    'Τέλος', closeSession, miss.length ? `Ξανά μόνο τις ${miss.length}` : '', () => startQuiz(miss, 'Δύσκολες · ξανά'));
}
function finish(){
  if (R.kind === 'first'){
    const hardIdsNow = C.passHardCards(R.s);
    R.done = true;
    if (!R.eph) S.pages[R.pageId] = C.finishFirstPass(TODAY);
    S.hard = C.addHard(S.hard, hardIdsNow, TODAY); save();
    const hs = new Set(hardIdsNow);
    return endScreen(`<div><div class="eyebrow">${title(R.page)} · διάβασμα</div><div class="word">Έγινε.</div><div class="under">${words(R.page.cards.length)}, κάθε μία σωστή τρεις φορές</div></div>${endRail(R.page.cards.map(c => !hs.has(c.id)))}
      ${hardIdsNow.length ? chips('Αυτές σε δυσκόλεψαν και πάνε στις Δύσκολες', hardIdsNow) : '<p class="under">Καμία δεν σε δυσκόλεψε ιδιαίτερα.</p>'}`,
      'Τέλος', closeSession, R.page.unit ? 'Ρώτα με την ενότητα' : 'Ρώτα με τη σελίδα', ((p) => () => startQuiz(p.cards.map(c => c.id), `${title(p)} · ρώτα με`))(R.page));
  }
  const sg = R.s.segs[0], miss = C.segMisses(sg), label = R.label;
  endScreen(scoreHTML(esc(label), sg.ids.length - miss.length, sg.ids.length, miss.length ? 'σωστές με την πρώτη' : 'όλες σωστές με την πρώτη') + endRail(R.hist || [])
    + chips('Πάνε στις Δύσκολες', miss),
    'Τέλος', closeSession, miss.length ? `Ξανά μόνο τις ${miss.length}` : '', () => startQuiz(miss, `${label} · ξανά`));
}

document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if (e.key === 'Escape'){
    if (R){ e.preventDefault(); closeSession(); } else if (modal.open) closeModal();
    else if ($('q').value){ $('q').value = ''; $('q').blur(); render(); } else if (typing) e.target.blur();
    return;
  }
  if (modal.open) return;
  if (!R){
    if (typing) return;
    if (e.key === '/'){ e.preventDefault(); $('q').focus(); }
    return;
  }
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    if ($('ack')) ackPreview(); else if ($('show')) reveal(); else if ($('ask')) $('ask').click(); else if ($('cont')) $('cont').click();
  } else if (R.revealed && (e.key === '1' || e.key === 'ArrowLeft')) grade(false);
  else if (R.revealed && (e.key === '2' || e.key === 'ArrowRight')) grade(true);
});

/* ===================== εκκίνηση ===================== */
reload();
render();
fetch('data/lexilogio.json', { cache:'no-cache' })
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })   /* fetch() δεν πέφτει στα 4xx */
  .then(d => { if (!d || !Array.isArray(d.pages)) throw new Error('χωρίς "pages"'); DATA = d; },
        e => { DATA_ERR = String(e && e.message || e); })
  .then(() => { if (!R) render(); });
fetch('data/lexilogio-units.json', { cache:'no-cache' })
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(d => { if (!d || !Array.isArray(d.units) || !d.units.every(u => u && Array.isArray(u.ids))) throw new Error('χωρίς "units"'); UNITS = d; },
        e => { UNITS_ERR = String(e && e.message || e); })
  .then(() => { if (!R) render(); });

/* Συγχρονισμός: μία μηχανή, ένα κλειδί, μία κλήση (σταθ. 32). Αν δεν
   σηκωθεί ποτέ, το λέμε — η πρόοδος μένει μόνο σε αυτή τη συσκευή. */
(function(){
  let tries = 0;
  (function wait(){
    if (typeof initCloudSync !== 'function' || !window.supabase){
      if (tries++ < 40) setTimeout(wait, 200);
      else { SYNC_NOTE = 'Ο συγχρονισμός δεν ξεκίνησε· η πρόοδος μένει σε αυτή τη συσκευή.'; if (!R) render(); }
      return;
    }
    initCloudSync({
      appKey:'lexilogio',
      syncedKeys:['metron.lexilogio.v2'],
      onApplied:function(){ reload(); if (!R) render(); else paintWarn(); }
    });
  })();
})();
})();
</script>
