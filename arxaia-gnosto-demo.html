<!DOCTYPE html>
<html lang="el" data-v="d">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ΓΝΩΣΤΟ — το νέο</title>
<!-- ══════════════════════════════════════════════════════════════════
     ⛔ ΔΕΙΓΜΑ, ΟΧΙ ΣΕΛΙΔΑ.  Δεν γράφει τίποτα πουθενά.

     ΔΙΑΛΕΞΕ ΤΟ Α («δέκα φορές παραπάνω»), αλλά «ακόμα δεν είμαστε στο
     επίπεδο».  Άρα ΔΕΝ αλλάζει κατεύθυνση — αλλάζει ΕΠΙΠΕΔΟ.  Το «Α»
     μένει εδώ δίπλα για να φαίνεται η διαφορά, όχι για να διαλέξει ξανά.

     ⭐ ΤΙ ΕΛΕΙΠΕ ΚΑΙ ΗΤΑΝ ΜΕΤΡΗΣΙΜΟ, ΟΧΙ ΓΟΥΣΤΟ:
     1. Η ΓΡΑΜΜΑΤΟΣΕΙΡΑ.  Το `aurora-page.css` κάνει @import το Instrument
        Serif, αλλά το φορτώνουν ΜΟΝΟ ideas/caffeine/main.  Η arxaia.html
        έπαιζε σε Georgia (fallback) όλη της τη ζωή.  Εδώ μπαίνει σωστά.
     2. ΤΟ ΧΡΩΜΑ.  Το «Α» είχε γενικό cyan/πράσινο dashboard.  Το MÉTRON
        έχει καμβά #060607 και κεχριμπάρι #F2C063 — δικά του χρώματα.
     3. ΤΟ ΥΛΙΚΟ.  Επίπεδα πάνελ χωρίς φως.  Τώρα: ζεστή λάμψη πίσω από
        την κεφαλίδα, εσωτερικό highlight 1px στην κορυφή κάθε πλάκας,
        και γραμμή που ανάβει στο hover — οι υπογραφές του aurora.css.
     4. Ο ΑΕΡΑΣ.  Το «Α» ήταν στριμωγμένο· εδώ το κενό είναι σχεδίαση.
     ══════════════════════════════════════════════════════════════════ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- ⚠️ Ίδια εξάρτηση που ήδη χρησιμοποιεί το aurora-page.css — όχι νέα.
     Αν πέσει, πέφτει σε Georgia και η σελίδα στέκει· μια γραμματοσειρά
     δεν είναι dep συγχρονισμού (σταθερή αρχή: ποτέ CDN για δεδομένα). -->

<style>
*{box-sizing:border-box} html,body{margin:0;padding:0}
#pick{position:sticky;top:0;z-index:99;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 16px;background:#000;border-bottom:1px solid #1c1c20;
  font:500 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#7a7a84}
#pick b{color:#e9e9ee;font-weight:600;margin-right:4px}
#pick button{background:#141418;color:#9a9aa4;border:1px solid #2a2a32;border-radius:8px;
  padding:7px 13px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
#pick button:hover{color:#fff;border-color:#4a4a56}
#pick button.on{background:#F2C063;color:#0b0b0d;border-color:#F2C063}
#pick .sp{flex:1 1 auto} #pick .hint{font-size:11.5px;color:#5a5a63}
.stage{display:none} .stage.on{display:block}

<style>
/* ═══════════════════════════════════════════════════════════════════
   Δ · ΤΟ ΝΕΟ — «Α», στο επίπεδο του MÉTRON.
   Ίδια δομή (δύο στήλες, η εισαγωγή φαρδιά), άλλο ΥΛΙΚΟ.
   ═══════════════════════════════════════════════════════════════════ */
#vd{
  --ink:#F5F2EC; --dim:rgba(245,242,236,.56); --faint:rgba(245,242,236,.30);
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --am:#F2C063; --am-rgb:242,192,99; --em:#34E2B0;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  background:#060607;color:var(--dim);min-height:100vh;
  font:400 15.5px/1.62 var(--sans);-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums}
/* Η ζεστή αυγή πίσω από την κεφαλίδα. Ένα φως, από πάνω, πάντα το ίδιο. */
#vd .sky{position:relative}
#vd .sky:before{content:"";position:absolute;inset:-140px 0 auto;height:520px;pointer-events:none;
  background:radial-gradient(900px 340px at 50% 0,rgba(var(--am-rgb),.085),transparent 70%)}
[data-theme=light] #vd{--ink:#1B1813;--dim:rgba(27,24,19,.66);--faint:rgba(27,24,19,.40);
  --line:rgba(27,24,19,.10);--line2:rgba(27,24,19,.16);--am:#8A5A12;--am-rgb:138,90,18;--em:#0D7A55;
  background:#FAF7F1}
#vd .wrap{position:relative;max-width:1240px;margin:0 auto;padding:0 40px 96px}
#vd a{color:inherit;text-decoration:none}

#vd .back{display:inline-flex;align-items:center;gap:8px;margin:30px 0 0;padding:7px 15px;
  border:1px solid var(--line);border-radius:999px;color:var(--faint);
  font:600 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;transition:.4s var(--ease)}
#vd .back:hover{color:var(--ink);border-color:var(--line2)}

#vd .kick{font:600 10px/1 var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--faint)}
#vd header{padding:52px 0 40px}
#vd h1{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--ink);
  font-size:clamp(34px,4.4vw,54px);line-height:1.06;letter-spacing:-.02em;
  margin:20px 0 0;max-width:19ch;text-wrap:balance}
#vd .lede{margin:20px 0 0;max-width:56ch;font-size:15.5px;color:var(--dim)}
#vd .lede b{color:var(--ink);font-weight:600}

#vd .cols{display:grid;grid-template-columns:1.34fr .86fr;gap:60px;align-items:start;
  padding-top:38px;border-top:1px solid var(--line)}

#vd .sh{display:flex;align-items:center;gap:16px;margin:0 0 22px}
#vd .sh .t{font:600 10px/1 var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--faint);
  white-space:nowrap}
#vd .sh .r{flex:1 1 auto;height:1px;background:var(--line)}
#vd .sh .n{font:600 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
  white-space:nowrap}

/* ── οι δύο πλάκες της εισαγωγής ─────────────────────────────────── */
#vd .pl{position:relative;display:block;padding:32px 34px 28px;margin-bottom:18px;
  border:1px solid var(--line);border-radius:20px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012) 46%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  transition:border-color .55s var(--ease),transform .55s var(--ease),box-shadow .55s var(--ease)}
[data-theme=light] #vd .pl{background:#fff;box-shadow:0 1px 2px rgba(27,24,19,.05)}
#vd .pl:before{content:"";position:absolute;left:34px;right:34px;top:0;height:1px;opacity:0;
  background:linear-gradient(90deg,transparent,rgba(var(--am-rgb),.55),transparent);
  transition:opacity .55s var(--ease)}
#vd .pl:hover:before{opacity:1}
#vd .pl:hover{border-color:rgba(var(--am-rgb),.26);transform:translateY(-2px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 24px 48px -30px #000}
[data-theme=light] #vd .pl:hover{box-shadow:0 18px 40px -26px rgba(27,24,19,.30)}
#vd .pl .rn{font-family:var(--serif);font-style:italic;font-size:40px;line-height:1;
  color:var(--am);opacity:.5}
#vd .pl .t{font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.16;
  letter-spacing:-.012em;color:var(--ink);margin:12px 0 0;max-width:24ch}
#vd .pl .d{margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--dim);max-width:48ch}
#vd .pl .in{display:flex;flex-wrap:wrap;row-gap:6px;margin-top:22px;padding-top:15px;
  border-top:1px solid var(--line)}
#vd .pl .in i{font-style:normal;font-size:12.5px;color:var(--faint);padding:0 14px;
  border-left:1px solid var(--line)}
#vd .pl .in i:first-child{padding-left:0;border-left:none}
#vd .pl .go{position:absolute;right:34px;bottom:28px;font:600 10px/1 var(--mono);
  letter-spacing:.2em;text-transform:uppercase;color:var(--am);opacity:.55;transition:.5s var(--ease)}
#vd .pl:hover .go{opacity:1}
#vd .note{margin:16px 0 0;font-size:13.5px;line-height:1.65;color:var(--faint);max-width:62ch;
  font-family:var(--serif);font-style:italic;font-size:15px}

/* ── η δεξιά στήλη ───────────────────────────────────────────────── */
#vd .cta{position:relative;display:block;border:1px solid rgba(var(--am-rgb),.24);border-radius:18px;
  padding:24px 26px 22px;overflow:hidden;
  background:linear-gradient(180deg,rgba(var(--am-rgb),.085),rgba(var(--am-rgb),.02) 55%,transparent);
  transition:border-color .55s var(--ease),transform .55s var(--ease)}
#vd .cta:hover{border-color:rgba(var(--am-rgb),.44);transform:translateY(-2px)}
#vd .cta .l{font:600 10px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--am)}
#vd .cta .t{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.2;
  color:var(--ink);margin:13px 0 0}
#vd .cta .m{margin:11px 0 0;font:400 11.5px/1.5 var(--mono);color:var(--faint);letter-spacing:.02em}
#vd .alt{display:flex;gap:20px;margin:16px 2px 0;font-size:13px}
#vd .alt a{color:var(--faint);border-bottom:1px solid transparent;padding-bottom:2px;transition:.4s var(--ease)}
#vd .alt a:hover{color:var(--ink);border-color:var(--line2)}
#vd .blk{margin-top:44px}
#vd .grp{font:600 9.5px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--faint);
  margin:0 0 4px}
#vd .row{display:flex;gap:14px;align-items:baseline;padding:14px 0;border-top:1px solid var(--line)}
#vd .row .tx{flex:1 1 auto;min-width:0}
#vd .row .l{font-size:14.5px;color:var(--ink);line-height:1.4}
#vd .row .g{margin-top:4px;font:400 11px/1 var(--mono);color:var(--faint);letter-spacing:.04em}
#vd .row .st{flex:none;font:600 9.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint)}
#vd .quiet{margin:0;padding:16px 18px;border:1px dashed var(--line);border-radius:14px;
  font-size:13px;line-height:1.65;color:var(--faint)}
#vd footer{margin:76px 0 0;padding-top:22px;border-top:1px solid var(--line);
  font-size:12.5px;line-height:1.8;color:var(--faint);max-width:78ch}

@media (prefers-reduced-motion:no-preference){
  #vd [data-r]{opacity:0;transform:translateY(16px);animation:vdrise .95s var(--ease) forwards}
  @keyframes vdrise{to{opacity:1;transform:none}}
}
@media(max-width:1040px){#vd .cols{grid-template-columns:1fr;gap:44px}
  #vd .wrap{padding:0 24px 72px}}
</style>

<style>
/* ── το προηγούμενο «Α», ΑΘΙΚΤΟ, μόνο για σύγκριση ───────────────── */
#va{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2b303b;--tx:#e8eaed;--dim:#a0a6b1;
  --a:#7dd3fc;--y:#fde047;
  background:var(--bg);color:var(--tx);min-height:100vh;
  font:400 16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
[data-theme=light] #va{--bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--line:#dfe3e8;--tx:#16181d;--dim:#5b6270;
  --a:#0369a1;--y:#a16207}
#va .wrap{max-width:1200px;margin:0 auto;padding:30px 28px 90px}
#va .kick{font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#va h1{font-size:2rem;letter-spacing:-.025em;line-height:1.2;margin:10px 0 6px;max-width:22ch}
#va .lede{color:var(--dim);font-size:.95rem;margin:0 0 30px}
#va .cols{display:grid;grid-template-columns:1.35fr .95fr;gap:34px;align-items:start}
#va h2{font-size:1.05rem;margin:0 0 14px;display:flex;align-items:baseline;gap:10px}
#va h2 .n{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
#va .pk{display:block;text-decoration:none;color:inherit;background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--a);border-radius:14px;
  padding:20px 22px;margin-bottom:14px}
#va .pk .t{font-size:1.22rem;font-weight:600}
#va .pk .d{color:var(--dim);font-size:.92rem;margin-top:6px}
#va .pk .in{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
#va .pk .in span{font-size:.74rem;font-weight:600;color:var(--dim);background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:3px 9px}
#va .pk .go{float:right;color:var(--a);font-size:.85rem;font-weight:700}
#va .note{color:var(--dim);font-size:.87rem;margin:2px 0 0}
#va .cta{display:block;background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-left:3px solid var(--y);border-radius:14px;padding:18px 20px;
  text-decoration:none;color:inherit}
#va .cta .l{font-size:.7rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--y)}
#va .cta .t{font-size:1.08rem;font-weight:600;margin-top:8px;line-height:1.35}
#va .cta .m{color:var(--dim);font-size:.86rem;margin-top:7px}
#va .alt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
#va .alt button{background:var(--panel);color:var(--dim);border:1px solid var(--line);border-radius:10px;
  padding:11px;font:600 .85rem -apple-system,sans-serif;cursor:pointer}
#va .rows{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px}
#va .grp{font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  padding:11px 14px 7px;background:var(--panel2)}
#va .row{display:flex;gap:12px;align-items:center;padding:13px 14px;background:var(--panel);
  border-top:1px solid var(--line)}
#va .row .tx{flex:1 1 auto;min-width:0}
#va .row .g{color:var(--dim);font-size:.8rem;margin-top:3px}
#va .row .st{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
#va .blk{margin-top:30px}
#va .empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:16px 18px;
  color:var(--dim);font-size:.88rem}
#va footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);color:var(--dim);
  font-size:.82rem;line-height:1.7}
@media(max-width:980px){#va .cols{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="pick">
  <b>Δείγμα</b>
  <button data-go="d" class="on">✦ Το νέο</button>
  <button data-go="a">Α · το προηγούμενο</button>
  <span class="sp"></span>
  <button id="th">◐ Φως / σκοτάδι</button>
  <span class="hint">ίδια δομή · άλλο επίπεδο</span>
</div>

<section class="stage on" id="vd"></section>
<section class="stage" id="va"></section>

<script>
(function(){
  'use strict';
  var G = window.ARXGN;
  var st = { d:document.getElementById('vd'), a:document.getElementById('va') };
  if (!G || !G.UNITS || !G.UNITS.length){
    document.body.insertAdjacentHTML('beforeend',
      '<p style="font:16px system-ui;color:#c33;padding:40px">Δεν φόρτωσε το corpus — ' +
      'το δείγμα δεν έχει τι να δείξει. Δεν είναι θέμα σχεδίασης.</p>');
    return;
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function els(u){ return u.skeleton.points.reduce(function(n,p){ return n + p.must.length; },0); }

  /* ⚠️ ΤΑ ΝΟΥΜΕΡΑ ΕΙΝΑΙ ΜΕΤΡΗΜΕΝΑ ΑΠΟ ΤΑ ΙΔΙΑ ΤΑ ΑΡΧΕΙΑ, ΟΧΙ ΕΙΚΑΣΙΑ.
     Τα είχα γράψει με το μάτι και ο Πλάτων ήταν λάθος (28/32 αντί 30/34). */
  var PK = [
    { f:'arxaia-sokratis.html', n:'I', t:'Η δίκη και ο θάνατος του Σωκράτη',
      d:'Το κατηγορητήριο, οι τρεις μηνυτές, οι δύο ψηφοφορίες, ο θάνατος',
      i:['Σύνοψη','Αριθμοί &amp; μνημονικά','22 κάρτες','20 ερωτήσεις'] },
    { f:'arxaia-platon.html', n:'II', t:'Ο Πλάτων — ο βίος του',
      d:'Η καταγωγή, η 7η Επιστολή, τα τρία ταξίδια, η Ακαδημία',
      i:['Σύνοψη','Χρονολόγιο','Μνημονικά','30 κάρτες','34 ερωτήσεις'] }
  ];
  var U = G.UNITS[0];
  var NOTE = 'Αυτά δεν λέγονται απέξω. Τα διαβάζεις, περνάς τις κάρτες και το κουίζ, και ξέρεις τι δίνουν.';
  var FOOT = 'Η εισαγωγή δεν βαθμολογείται και δεν έχει προθεσμία: δεν τη μαθαίνεις απέξω, την ξέρεις. ' +
    'Τα κείμενα είναι το αντίθετο — κάθε παράγραφος ελέγχεται λέξη-προς-λέξη απέναντι στη μεταγραφή, ' +
    'και κάθε σημείο του σκελετού κουβαλάει μια φράση που πρέπει να υπάρχει μέσα της.';
  var META = U.skeleton.points.length + ' σημεία · ' + els(U) + ' στοιχεία · ~10 λεπτά';

  /* ── Δ · ΤΟ ΝΕΟ ─────────────────────────────────────────────────── */
  var r = 0;
  function rise(){ r++; return ' data-r style="animation-delay:' + (60 * r) + 'ms"'; }
  st.d.innerHTML =
  '<div class="sky"><div class="wrap">' +
    '<a class="back" href="#">← Αρχαία</a>' +
    '<header' + rise() + '>' +
      '<div class="kick">Αρχαία · Γνωστό</div>' +
      '<h1>Η εισαγωγή διαβάζεται. Τα κείμενα λέγονται απέξω.</h1>' +
      '<p class="lede">Δύο πακέτα μελέτης και <b>ένα</b> κείμενο. Το πρώτο το ξέρεις — το δεύτερο το λες.</p>' +
    '</header>' +
    '<div class="cols">' +
      '<div' + rise() + '>' +
        '<div class="sh"><span class="t">Η εισαγωγή</span><span class="r"></span>' +
          '<span class="n">2 πακέτα · χωρίς βαθμό</span></div>' +
        PK.map(function(p){ return '<a class="pl" href="' + p.f + '">' +
          '<div class="rn">' + p.n + '</div>' +
          '<div class="t">' + esc(p.t) + '</div>' +
          '<div class="d">' + esc(p.d) + '</div>' +
          '<div class="in">' + p.i.map(function(x){ return '<i>' + x + '</i>'; }).join('') + '</div>' +
          '<div class="go">Άνοιξε →</div></a>'; }).join('') +
        '<p class="note">' + esc(NOTE) + '</p>' +
      '</div>' +
      '<div' + rise() + '>' +
        '<div class="sh"><span class="t">Τα κείμενα</span><span class="r"></span>' +
          '<span class="n">0 / 1 μαθημένα</span></div>' +
        '<a class="cta" href="#"><div class="l">Ξεκίνα από εδώ</div>' +
          '<div class="t">' + esc(U.title) + '</div>' +
          '<div class="m">' + esc(META) + '</div></a>' +
        '<div class="alt"><a href="#">Κατευθείαν στην ανάκληση</a><a href="#">Τα αδύναμά μου</a></div>' +
        '<div class="blk"><div class="grp">' + esc(U.section) + '</div>' +
          '<a class="row" href="#"><span class="tx"><span class="l">' + esc(U.title) + '</span>' +
          '<span class="g">' + U.skeleton.points.length + ' σημεία · ' + els(U) + ' στοιχεία</span></span>' +
          '<span class="st">νέο</span></a></div>' +
        '<div class="blk"><div class="sh"><span class="t">Τα λάθη μου</span><span class="r"></span>' +
          '<span class="n">τίποτα ακόμη</span></div>' +
          '<p class="quiet">Μόλις κάνεις την πρώτη ανάκληση, ό,τι δεν θυμηθείς κάθεται εδώ και επιστρέφει πιο συχνά από τα υπόλοιπα.</p></div>' +
      '</div>' +
    '</div>' +
    '<footer>' + esc(FOOT) + '</footer>' +
  '</div></div>';

  /* ── Α · ΤΟ ΠΡΟΗΓΟΥΜΕΝΟ, για σύγκριση ───────────────────────────── */
  st.a.innerHTML =
  '<div class="wrap">' +
    '<div class="kick">Αρχαία · Γνωστό</div>' +
    '<h1>Η εισαγωγή διαβάζεται. Τα κείμενα λέγονται απέξω.</h1>' +
    '<p class="lede">Δύο πακέτα μελέτης και <b>1</b> κείμενο. Το πρώτο το ξέρεις, το δεύτερο το λες.</p>' +
    '<div class="cols"><div>' +
      '<h2>Η εισαγωγή <span class="n">2 πακέτα · χωρίς βαθμό</span></h2>' +
      PK.map(function(p){ return '<a class="pk" href="' + p.f + '"><span class="go">Άνοιξε →</span>' +
        '<div class="t">' + esc(p.t) + '</div><div class="d">' + esc(p.d) + '</div>' +
        '<div class="in">' + p.i.map(function(x){ return '<span>' + x + '</span>'; }).join('') + '</div></a>';
      }).join('') +
      '<p class="note">' + esc(NOTE) + '</p></div>' +
    '<div>' +
      '<h2>Τα κείμενα <span class="n">0/1 μαθημένα</span></h2>' +
      '<a class="cta" href="#"><div class="l">Ξεκίνα από εδώ</div><div class="t">' + esc(U.title) + '</div>' +
        '<div class="m">' + esc(META) + '</div></a>' +
      '<div class="alt"><button>Κατευθείαν στην ανάκληση</button><button>Τα αδύναμά μου</button></div>' +
      '<div class="rows"><div class="grp">' + esc(U.section) + '</div>' +
        '<div class="row"><div class="tx"><div class="l">' + esc(U.title) + '</div>' +
        '<div class="g">' + U.skeleton.points.length + ' σημεία, ' + els(U) + ' στοιχεία</div></div>' +
        '<div class="st">νέο</div></div></div>' +
      '<div class="blk"><h2>Τα λάθη μου <span class="n">τίποτα ακόμη</span></h2>' +
        '<div class="empty">Μόλις κάνεις την πρώτη ανάκληση, ό,τι δεν θυμηθείς κάθεται εδώ.</div></div>' +
    '</div></div>' +
    '<footer>' + esc(FOOT) + '</footer>' +
  '</div>';

  var btns = document.querySelectorAll('#pick button[data-go]');
  btns.forEach(function(b){
    b.onclick = function(){
      btns.forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      Object.keys(st).forEach(function(k){ st[k].classList.toggle('on', k === b.dataset.go); });
      document.documentElement.dataset.v = b.dataset.go;
      window.scrollTo({ top:0, behavior:'smooth' });
    };
  });
  var dark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
  function paint(){ document.documentElement.dataset.theme = dark ? 'dark' : 'light'; }
  paint();
  document.getElementById('th').onclick = function(){ dark = !dark; paint(); };
})();
</script>
</body>
</html>
