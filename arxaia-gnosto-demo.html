<title>ΓΝΩΣΤΟ — τρεις αισθητικές για ΤΗ ΣΕΛΙΔΑ</title>
<!-- ══════════════════════════════════════════════════════════════════
     ⛔ ΔΕΙΓΜΑ, ΟΧΙ ΣΕΛΙΔΑ.  Δεν γράφει τίποτα πουθενά.

     ΤΟ ΘΕΜΑ ΕΙΝΑΙ Η ΛΙΣΤΑ ΤΟΥ ΓΝΩΣΤΟΥ — αυτό ακριβώς που δείχνει το
     screenshot του: ο τίτλος, τα δύο πακέτα, το «ξεκίνα από εδώ», τα
     κείμενα.  Η ΔΙΑΓΝΩΣΗ: η ζωντανή σελίδα είναι κολόνα 620px, οπότε σε
     laptop 2000px γίνεται λωρίδα μέσα σε μαύρο.  Και οι τρεις παρακάτω
     είναι ΦΑΡΔΙΕΣ — εκεί είναι όλη η διαφορά, όχι στο χρώμα.

     ⚠️ ΙΔΙΟ ΠΕΡΙΕΧΟΜΕΝΟ ΚΑΙ ΣΤΙΣ ΤΡΕΙΣ, αλλιώς δεν συγκρίνονται· και
     ΤΙΠΟΤΑ δεν λείπει σε σχέση με τη ζωντανή (πακέτα, CTA, οι δύο
     εναλλακτικές, τα κείμενα, τα αδύναμα, το υποσέλιδο).
     ══════════════════════════════════════════════════════════════════ -->

<style>
*{box-sizing:border-box} html,body{margin:0;padding:0}
#pick{position:sticky;top:0;z-index:99;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 16px;background:#0b0b0d;border-bottom:1px solid #26262c;
  font:500 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#8b8b95}
#pick b{color:#e9e9ee;font-weight:600;margin-right:4px}
#pick button{background:#17171c;color:#9a9aa4;border:1px solid #2e2e36;border-radius:8px;
  padding:7px 13px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}

#pick .sp{flex:1 1 auto} #pick .hint{font-size:11.5px;color:#63636d}
.stage{display:none} .stage.on{display:block}

<style>
/* ═══════════════════════════════════════════════════════════════════
   Α · ΤΟ ΒΙΒΛΙΟ — η γλώσσα των πακέτων του, σε ΔΥΟ ΣΤΗΛΕΣ.
   Η εισαγωγή είναι αυτό που δουλεύει ΤΩΡΑ, οπότε παίρνει τη φαρδιά
   στήλη και γίνεται ΚΑΡΤΑ ΜΕ ΠΕΡΙΕΧΟΜΕΝΑ — όχι γραμμή λίστας.  Δεξιά
   κάθεται όλη η δουλειά που ΧΡΩΣΤΑΕΙ, μαζεμένη σε μία κολόνα.
   ═══════════════════════════════════════════════════════════════════ */
#va{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2b303b;--tx:#e8eaed;--dim:#a0a6b1;
  --a:#7dd3fc;--g:#86efac;--y:#fde047;--o:#fdba74;
  background:var(--bg);color:var(--tx);min-height:100vh;
  font:400 16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
[data-theme=light] #va{--bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--line:#dfe3e8;--tx:#16181d;--dim:#5b6270;
  --a:#0369a1;--g:#15803d;--y:#a16207;--o:#c2410c}
#va .wrap{max-width:1200px;margin:0 auto;padding:30px 28px 90px}
#va .back{display:inline-block;color:var(--dim);text-decoration:none;font-size:.85rem;font-weight:600;
  border:1px solid var(--line);border-radius:999px;padding:6px 14px;margin-bottom:26px}
#va .kick{font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#va h1{font-size:2rem;letter-spacing:-.025em;line-height:1.2;margin:10px 0 6px;max-width:22ch}
#va .lede{color:var(--dim);font-size:.95rem;margin:0 0 30px}
#va .cols{display:grid;grid-template-columns:1.35fr .95fr;gap:34px;align-items:start}
#va h2{font-size:1.05rem;margin:0 0 14px;display:flex;align-items:baseline;gap:10px}
#va h2 .n{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
#va .pk{display:block;text-decoration:none;color:inherit;background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--a);border-radius:14px;
  padding:20px 22px;margin-bottom:14px;transition:.16s}
#va .pk:hover{border-color:var(--dim);border-left-color:var(--a);transform:translateY(-1px)}
#va .pk .t{font-size:1.22rem;font-weight:600;letter-spacing:-.01em}
#va .pk .d{color:var(--dim);font-size:.92rem;margin-top:6px}
#va .pk .in{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
#va .pk .in span{font-size:.74rem;font-weight:600;color:var(--dim);background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:3px 9px}

#va .note{color:var(--dim);font-size:.87rem;margin:2px 0 0}
#va .cta{display:block;background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-left:3px solid var(--y);border-radius:14px;padding:18px 20px}
#va .cta .l{font-size:.7rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--y)}
#va .cta .t{font-size:1.08rem;font-weight:600;margin-top:8px;line-height:1.35}
#va .cta .m{color:var(--dim);font-size:.86rem;margin-top:7px}
#va .alt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
#va .alt button{background:var(--panel);color:var(--dim);border:1px solid var(--line);border-radius:10px;
  padding:11px;font:600 .85rem inherit;font-family:inherit;cursor:pointer}
#va .alt button:hover{color:var(--tx);border-color:var(--dim)}
#va .rows{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px}
#va .grp{font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  padding:11px 14px 7px;background:var(--panel2)}

  border-top:1px solid var(--line)}

#va .row .l{font-size:.95rem}
#va .row .g{color:var(--dim);font-size:.8rem;margin-top:3px}
#va .row .st{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
#va .blk{margin-top:30px}
#va .empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:16px 18px;
  color:var(--dim);font-size:.88rem}
#va footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);
  color:var(--dim);font-size:.82rem;line-height:1.7}
@media(max-width:980px){#va .cols{grid-template-columns:1fr}}
</style>

<style>
/* ═══════════════════════════════════════════════════════════════════
   Β · Η ΕΚΔΟΣΗ — η σελίδα-τίτλος ενός τόμου.
   Χαρτί, serif, ΚΑΜΙΑ κάρτα.  Τα δύο πακέτα είναι δύο ΠΛΑΚΕΣ δίπλα-
   δίπλα με λατινική αρίθμηση, και τα κείμενα ένας κανονικός ΠΙΝΑΚΑΣ
   ΠΕΡΙΕΧΟΜΕΝΩΝ με στιγμές που οδηγούν στην κατάσταση.
   ═══════════════════════════════════════════════════════════════════ */
#vb{--pa:#f7f3ea;--ink:#1e1a15;--soft:#6b6155;--rule:#ddd4c4;--acc:#8a5a2b;
  background:var(--pa);color:var(--ink);min-height:100vh;
  font:400 18px/1.7 Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua",serif}
[data-theme=dark] #vb{--pa:#14120f;--ink:#e8e1d4;--soft:#9a9086;--rule:#2f2a23;--acc:#d9a05b}
#vb .wrap{max-width:1140px;margin:0 auto;padding:46px 44px 100px}
#vb .back{display:inline-block;color:var(--soft);text-decoration:none;
  font:600 10px/1 -apple-system,sans-serif;letter-spacing:.22em;text-transform:uppercase;margin-bottom:34px}
#vb .top{text-align:center;border-bottom:2px solid var(--rule);padding-bottom:30px;margin-bottom:14px}
#vb .top .kick{font:600 10px/1 -apple-system,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--soft)}
#vb h1{font-size:2.5rem;font-weight:400;line-height:1.2;margin:18px auto 12px;max-width:20ch;letter-spacing:-.015em}
#vb .lede{color:var(--soft);font-style:italic;margin:0;font-size:1.02rem}
#vb .rule2{border-bottom:1px solid var(--rule);margin-bottom:44px;padding-bottom:0;height:6px}
#vb h2{font:600 10px/1 -apple-system,sans-serif;letter-spacing:.26em;text-transform:uppercase;color:var(--soft);
  margin:0 0 20px;display:flex;justify-content:space-between;align-items:baseline}
#vb .plates{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule)}
#vb .pl{padding:30px 34px;text-decoration:none;color:inherit;display:block}
#vb .pl:first-child{border-right:1px solid var(--rule)}
#vb .pl:hover{background:color-mix(in srgb,var(--acc) 7%,transparent)}
#vb .pl .rn{font-size:2.1rem;color:var(--acc);line-height:1;font-weight:400}
#vb .pl .t{font-size:1.4rem;line-height:1.3;margin:10px 0 8px}
#vb .pl .d{color:var(--soft);font-size:.94rem;line-height:1.6}
#vb .pl .in{margin:16px 0 0;padding:0;list-style:none;font:400 13px/1.9 -apple-system,sans-serif;color:var(--soft)}
#vb .pl .in li:before{content:"— ";color:var(--acc)}
#vb .note{color:var(--soft);font-style:italic;font-size:.94rem;text-align:center;margin:16px 0 46px}
#vb .toc{margin:0}
#vb .toc .grp{font:600 10px/1 -apple-system,sans-serif;letter-spacing:.2em;text-transform:uppercase;
  color:var(--soft);margin:22px 0 10px}
#vb .toc a{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:inherit;
  padding:11px 0;border-bottom:1px solid var(--rule)}
#vb .toc a:hover .t{color:var(--acc)}
#vb .toc .t{font-size:1.06rem}
#vb .toc .dots{flex:1 1 auto;border-bottom:1px dotted var(--rule);transform:translateY(-4px)}
#vb .toc .st{font:600 10px/1 -apple-system,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
#vb .next{border:1px solid var(--rule);border-left:3px solid var(--acc);padding:22px 26px;margin:34px 0 0;
  display:block;text-decoration:none;color:inherit}
#vb .next .l{font:600 10px/1 -apple-system,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
#vb .next .t{font-size:1.3rem;line-height:1.3;margin-top:10px}
#vb .next .m{color:var(--soft);font-size:.92rem;margin-top:7px}
#vb .alt{display:flex;gap:22px;margin-top:16px;font:400 14px/1 -apple-system,sans-serif}
#vb .alt a{color:var(--soft);text-decoration:none;border-bottom:1px solid var(--rule);padding-bottom:3px}
#vb .alt a:hover{color:var(--acc);border-color:var(--acc)}
#vb footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--rule);color:var(--soft);
  font-size:.88rem;line-height:1.75;font-style:italic;max-width:74ch}
@media(max-width:900px){#vb .plates{grid-template-columns:1fr}
  #vb .pl:first-child{border-right:none;border-bottom:1px solid var(--rule)}
  #vb .wrap{padding:30px 22px 80px} #vb h1{font-size:1.9rem}}
</style>

<style>
/* ═══════════════════════════════════════════════════════════════════
   Γ · ΤΟ ΤΑΜΠΛΟ — full-bleed, ΤΙΠΟΤΑ δεν κρύβεται κάτω από το scroll.
   Πλέγμα πλακιδίων που πιάνει ΟΛΗ την οθόνη του laptop: τα δύο πακέτα
   μεγάλα αριστερά, η δουλειά που χρωστάει δεξιά, και μια λωρίδα
   μετρήσεων από πάνω.  Το αντίθετο της λωρίδας των 620px.
   ═══════════════════════════════════════════════════════════════════ */
#vc{--bg:#0b0c0f;--pan:#121419;--pan2:#171a20;--line:#232830;--tx:#e2e6ec;--dim:#79808d;
  --acc:#6ea8fe;--acc2:#7ee0b8;--warn:#f0b866;
  background:var(--bg);color:var(--tx);min-height:100vh;
  font:400 15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
[data-theme=light] #vc{--bg:#eceef2;--pan:#fff;--pan2:#f6f7fa;--line:#dbdfe7;--tx:#12151a;--dim:#69707e;
  --acc:#1b5fd4;--acc2:#0d7a55;--warn:#a16207}
#vc .wrap{padding:26px 34px 60px}
#vc .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;
  padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:22px}
#vc .mono{font:700 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase}
#vc .hd .kick{color:var(--dim)}
#vc .hd h1{font-size:1.5rem;font-weight:600;letter-spacing:-.02em;margin:9px 0 0}
#vc .stats{display:flex;gap:26px}
#vc .stats .s .v{font-size:1.5rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
#vc .stats .s .k{color:var(--dim);margin-top:7px}
#vc .grid{display:grid;grid-template-columns:1fr 1fr 380px;gap:14px;align-items:start}
#vc .tile{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
#vc a.tile{display:block;text-decoration:none;color:inherit;transition:.15s}
#vc a.tile:hover{border-color:var(--acc);background:var(--pan2)}
#vc .tile .lb{color:var(--dim);margin-bottom:14px}
#vc .pk .t{font-size:1.22rem;font-weight:600;line-height:1.28;letter-spacing:-.01em}
#vc .pk .d{color:var(--dim);font-size:.9rem;margin-top:8px;line-height:1.55}
#vc .pk .in{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
#vc .pk .in span{font:600 11px/1 -apple-system,sans-serif;color:var(--dim);border:1px solid var(--line);
  border-radius:5px;padding:5px 8px}
#vc .pk .go{margin-top:16px;color:var(--acc);font-weight:600;font-size:.88rem}
#vc .side{display:flex;flex-direction:column;gap:14px}
#vc .cta{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
#vc .cta .lb{color:var(--warn)}
#vc .cta .t{font-size:1.02rem;font-weight:600;line-height:1.35}
#vc .cta .m{color:var(--dim);font-size:.85rem;margin-top:8px}
#vc .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
#vc .btns button{background:var(--pan2);color:var(--dim);border:1px solid var(--line);border-radius:8px;
  padding:9px;font:600 12.5px -apple-system,sans-serif;cursor:pointer}
#vc .btns button:hover{color:var(--tx);border-color:var(--dim)}
#vc .lst .grp{color:var(--dim);margin:0 0 9px}
#vc .lst .r{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
#vc .lst .r:first-of-type{border-top:none}
#vc .lst .r .tx{flex:1 1 auto;min-width:0}
#vc .lst .r .l{font-size:.93rem;line-height:1.35}
#vc .lst .r .g{color:var(--dim);font-size:.79rem;margin-top:3px}
#vc .lst .r .st{color:var(--dim);flex:none}
#vc .quiet{color:var(--dim);font-size:.86rem;line-height:1.6}
#vc footer{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);color:var(--dim);
  font-size:.82rem;line-height:1.7;max-width:96ch}
@media(max-width:1180px){#vc .grid{grid-template-columns:1fr 1fr}#vc .side{grid-column:1/-1;flex-direction:row}
  #vc .side>*{flex:1 1 0}}
@media(max-width:820px){#vc .grid{grid-template-columns:1fr}#vc .side{flex-direction:column}}
</style>
</head>
<body>

<div id="pick">
  <b>Δείγμα</b>
  <button data-go="a" class="on">Α · Το βιβλίο</button>
  <button data-go="b">Β · Η έκδοση</button>
  <button data-go="c">Γ · Το ταμπλό</button>
  <span class="sp"></span>
  <button id="th">◐ Φως / σκοτάδι</button>
  <span class="hint">η ΣΕΛΙΔΑ του Γνωστού, όχι το μάθημα · διάλεξε γράμμα</span>
</div>

<section class="stage on" id="va"></section>
<section class="stage" id="vb"></section>
<section class="stage" id="vc"></section>

<script>
(function(){
  'use strict';
  var G = window.ARXGN;
  var st = { a:document.getElementById('va'), b:document.getElementById('vb'), c:document.getElementById('vc') };
  if (!G || !G.UNITS || !G.UNITS.length){
    document.body.insertAdjacentHTML('beforeend',
      '<p style="font:16px system-ui;color:#c33;padding:40px">Δεν φόρτωσε το corpus — ' +
      'το δείγμα δεν έχει τι να δείξει. Δεν είναι θέμα σχεδίασης.</p>');
    return;
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function els(u){ return u.skeleton.points.reduce(function(n,p){ return n + p.must.length; },0); }

  /* Τα δύο πακέτα, ΑΚΡΙΒΩΣ όπως στη ζωντανή σελίδα. Το `in` είναι ΤΙ
     ΒΡΙΣΚΕΙΣ ΜΕΣΑ — η ζωντανή δεν το λέει, και γι' αυτό τα δύο πακέτα
     φαίνονται σήμερα σαν δύο άδειες γραμμές.

     ⚠️ ΤΑ ΝΟΥΜΕΡΑ ΕΙΝΑΙ ΜΕΤΡΗΜΕΝΑ ΑΠΟ ΤΑ ΙΔΙΑ ΤΑ ΑΡΧΕΙΑ, ΟΧΙ ΕΙΚΑΣΙΑ.
     Τα είχα γράψει με το μάτι και ο Πλάτων ήταν λάθος (28/32 αντί 30/34):
     ένας εύλογος ψευδής αριθμός είναι ακριβώς η επικίνδυνη αποτυχία εδώ.
     Καρφωμένα επίτηδες — ένα δείγμα δεν κάνει fetch άλλη σελίδα. Αν
     αλλάξουν τα πακέτα το πιάνει το §9 του tests/arxaia-gnosto.test.js
     (sha256), και τότε ξαναμετριούνται ΚΑΙ εδώ. */
  var PK = [
    { f:'arxaia-sokratis.html', t:'Η δίκη και ο θάνατος του Σωκράτη',
      d:'Το κατηγορητήριο, οι τρεις μηνυτές, οι δύο ψηφοφορίες, ο θάνατος',
      i:['Σύνοψη','Αριθμοί & μνημονικά','22 κάρτες','20 ερωτήσεις κουίζ'] },
    { f:'arxaia-platon.html', t:'Ο Πλάτων — ο βίος του',
      d:'Η καταγωγή, η 7η Επιστολή, τα τρία ταξίδια, η Ακαδημία',
      i:['Σύνοψη','Χρονολόγιο','Μνημονικά','30 κάρτες','34 ερωτήσεις κουίζ'] }
  ];
  var U = G.UNITS[0];
  var FOOT = 'Η εισαγωγή δεν βαθμολογείται και δεν έχει προθεσμία: δεν τη μαθαίνεις απέξω, την ξέρεις. ' +
    'Τα κείμενα είναι το αντίθετο — κάθε παράγραφος ελέγχεται λέξη-προς-λέξη απέναντι στη μεταγραφή.';

  /* ── Α · ΤΟ ΒΙΒΛΙΟ ──────────────────────────────────────────────── */
  st.a.innerHTML =
  '<div class="wrap">' +
    '<a class="back" href="#">← Αρχαία</a>' +
    '<div class="kick">Αρχαία · Γνωστό</div>' +
    '<h1>Η εισαγωγή διαβάζεται. Τα κείμενα λέγονται απέξω.</h1>' +
    '<p class="lede">Δύο πακέτα μελέτης και <b>1</b> κείμενο. Το πρώτο το ξέρεις, το δεύτερο το λες.</p>' +
    '<div class="cols">' +
      '<div>' +
        '<h2>Η εισαγωγή <span class="n">2 πακέτα · χωρίς βαθμό</span></h2>' +
        PK.map(function(p){ return '<a class="pk" href="' + p.f + '"><span class="go">Άνοιξε →</span>' +
          '<div class="t">' + esc(p.t) + '</div><div class="d">' + esc(p.d) + '</div>' +
          '<div class="in">' + p.i.map(function(x){ return '<span>' + esc(x) + '</span>'; }).join('') + '</div></a>';
        }).join('') +
        '<p class="note">Αυτά δεν λέγονται απέξω. Τα διαβάζεις, περνάς τις κάρτες και το κουίζ, και ξέρεις τι δίνουν.</p>' +
      '</div>' +
      '<div>' +
        '<h2>Τα κείμενα <span class="n">0/1 μαθημένα</span></h2>' +
        '<a class="cta" href="#"><div class="l">Ξεκίνα από εδώ</div>' +
          '<div class="t">' + esc(U.title) + '</div>' +
          '<div class="m">' + U.skeleton.points.length + ' σημεία, ' + els(U) + ' στοιχεία · ~10 λεπτά</div></a>' +
        '<div class="alt"><button>Κατευθείαν στην ανάκληση</button><button>Τα αδύναμά μου</button></div>' +
        '<div class="rows"><div class="grp">' + esc(U.section) + '</div>' +
          '<div class="row"><div class="tx"><div class="l">' + esc(U.title) + '</div>' +
          '<div class="g">' + U.skeleton.points.length + ' σημεία, ' + els(U) + ' στοιχεία</div></div>' +
          '<div class="st">νέο</div></div></div>' +
        '<div class="blk"><h2>Τα λάθη μου <span class="n">τίποτα ακόμη</span></h2>' +
          '<div class="empty">Μόλις κάνεις την πρώτη ανάκληση, ό,τι δεν θυμηθείς κάθεται εδώ και επιστρέφει πιο συχνά.</div></div>' +
      '</div>' +
    '</div>' +
    '<footer>' + esc(FOOT) + '</footer>' +
  '</div>';

  /* ── Β · Η ΕΚΔΟΣΗ ───────────────────────────────────────────────── */
  st.b.innerHTML =
  '<div class="wrap">' +
    '<a class="back" href="#">← Αρχαία</a>' +
    '<div class="top"><div class="kick">Αρχαία · Γνωστό</div>' +
      '<h1>Η εισαγωγή διαβάζεται.<br>Τα κείμενα λέγονται απέξω.</h1>' +
      '<p class="lede">Δύο πακέτα μελέτης και ένα κείμενο.</p></div>' +
    '<div class="rule2"></div>' +
    '<h2><span>Η εισαγωγή</span><span>δύο πακέτα · χωρίς βαθμό</span></h2>' +
    '<div class="plates">' + PK.map(function(p,i){
      return '<a class="pl" href="' + p.f + '"><div class="rn">' + (i?'II':'I') + '</div>' +
        '<div class="t">' + esc(p.t) + '</div><div class="d">' + esc(p.d) + '</div>' +
        '<ul class="in">' + p.i.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></a>';
    }).join('') + '</div>' +
    '<p class="note">Αυτά δεν λέγονται απέξω· τα διαβάζεις και τα ξέρεις.</p>' +

    '<h2><span>Τα κείμενα</span><span>0 / 1 μαθημένα</span></h2>' +
    '<div class="toc"><div class="grp">' + esc(U.section) + '</div>' +
      '<a href="#"><span class="t">' + esc(U.title) + '</span><span class="dots"></span>' +
      '<span class="st">νέο</span></a></div>' +
    '<a class="next" href="#"><div class="l">Ξεκίνα από εδώ</div>' +
      '<div class="t">' + esc(U.title) + '</div>' +
      '<div class="m">' + U.skeleton.points.length + ' σημεία, ' + els(U) + ' στοιχεία · περίπου δέκα λεπτά</div></a>' +
    '<div class="alt"><a href="#">Κατευθείαν στην ανάκληση</a><a href="#">Τα αδύναμά μου</a></div>' +
    '<footer>' + esc(FOOT) + '</footer>' +
  '</div>';

  /* ── Γ · ΤΟ ΤΑΜΠΛΟ ──────────────────────────────────────────────── */
  st.c.innerHTML =
  '<div class="wrap">' +
    '<div class="hd"><div><div class="mono kick">Αρχαία · Γνωστό</div>' +
      '<h1>Η εισαγωγή διαβάζεται. Τα κείμενα λέγονται απέξω.</h1></div>' +
      '<div class="stats">' +
        '<div class="s"><div class="v">2</div><div class="k mono">πακέτα</div></div>' +
        '<div class="s"><div class="v">0/1</div><div class="k mono">κείμενα</div></div>' +
        '<div class="s"><div class="v">—</div><div class="k mono">για επανάληψη</div></div>' +
      '</div></div>' +
    '<div class="grid">' +
      PK.map(function(p){ return '<a class="tile pk" href="' + p.f + '">' +
        '<div class="lb mono">Η εισαγωγή · χωρίς βαθμό</div>' +
        '<div class="t">' + esc(p.t) + '</div><div class="d">' + esc(p.d) + '</div>' +
        '<div class="in">' + p.i.map(function(x){ return '<span>' + esc(x) + '</span>'; }).join('') + '</div>' +
        '<div class="go">Άνοιξε →</div></a>'; }).join('') +
      '<div class="side">' +
        '<div class="tile cta"><div class="lb mono">Ξεκίνα από εδώ</div>' +
          '<div class="t">' + esc(U.title) + '</div>' +
          '<div class="m">' + U.skeleton.points.length + ' σημεία, ' + els(U) + ' στοιχεία · ~10 λεπτά</div>' +
          '<div class="btns"><button>Ανάκληση</button><button>Τα αδύναμά μου</button></div></div>' +
        '<div class="tile lst"><div class="lb mono">Τα κείμενα · 0/1 μαθημένα</div>' +
          '<div class="grp mono">' + esc(U.section) + '</div>' +
          '<div class="r"><div class="tx"><div class="l">' + esc(U.title) + '</div>' +
          '<div class="g">' + U.skeleton.points.length + ' σημεία, ' + els(U) + ' στοιχεία</div></div>' +
          '<div class="st mono">νέο</div></div></div>' +
        '<div class="tile"><div class="lb mono">Τα λάθη μου</div>' +
          '<p class="quiet">Μόλις κάνεις την πρώτη ανάκληση, ό,τι δεν θυμηθείς κάθεται εδώ.</p></div>' +
      '</div>' +
    '</div>' +
    '<footer>' + esc(FOOT) + '</footer>' +
  '</div>';

  /* ── ο διακόπτης ────────────────────────────────────────────────── */
  var btns = document.querySelectorAll('#pick button[data-go]');
  btns.forEach(function(b){
    b.onclick = function(){
      btns.forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      Object.keys(st).forEach(function(k){ st[k].classList.toggle('on', k === b.dataset.go); });
      document.documentElement.dataset.v = b.dataset.go;
      window.scrollTo({ top:0, behavior:'smooth' });
    };
  });
  var dark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
  function paint(){ document.documentElement.dataset.theme = dark ? 'dark' : 'light'; }
  paint();
  document.getElementById('th').onclick = function(){ dark = !dark; paint(); };
})();
</script>
</body>
</html>
