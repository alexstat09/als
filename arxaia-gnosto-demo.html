<!DOCTYPE html>
<html lang="el" data-v="a">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ΓΝΩΣΤΟ — τρεις αισθητικές · δείγμα</title>
<!-- ══════════════════════════════════════════════════════════════════
     ⛔ ΔΕΙΓΜΑ, ΟΧΙ ΣΕΛΙΔΑ.  Δεν γράφει ΤΙΠΟΤΑ πουθενά: ούτε localStorage,
     ούτε sync, ούτε πρόοδο.  Υπάρχει για ΕΝΑΝ λόγο — να διαλέξει γράμμα.

     Διαβάζει τα ΑΛΗΘΙΝΑ δεδομένα (`arxaia-gnosto-data.js`, ενότητα gk1)
     γιατί μια αισθητική κρίνεται πάνω στο κείμενο που θα κουβαλήσει, ποτέ
     πάνω σε lorem ipsum: το πολυτονικό, τα μακριά ελληνικά και οι 80
     εξηγήσεις είναι ΑΚΡΙΒΩΣ αυτά που σπάνε ένα ωραίο layout.

     Η σειρά των scripts είναι δεσμευτική: greek-ear → lesson-grade → data.
     ══════════════════════════════════════════════════════════════════ -->
<script src="greek-ear.js"></script>
<script src="lesson-grade.js"></script>
<script src="arxaia-gnosto-data.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════════
   0 · Ο ΔΙΑΚΟΠΤΗΣ.  Επίτηδες ΟΥΔΕΤΕΡΟΣ — αν είχε δικό του χαρακτήρα θα
   μάλωνε με τα δείγματα και θα έκρινες τη μπάρα αντί για τη σελίδα.
   ═══════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
#pick{position:sticky;top:0;z-index:99;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 16px;background:#0b0b0d;border-bottom:1px solid #26262c;
  font:500 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#8b8b95}
#pick b{color:#e9e9ee;font-weight:600;margin-right:4px}
#pick button{background:#17171c;color:#9a9aa4;border:1px solid #2e2e36;border-radius:8px;
  padding:7px 13px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
#pick button:hover{color:#fff;border-color:#4a4a56}
#pick button.on{background:#e9e9ee;color:#0b0b0d;border-color:#e9e9ee}
#pick .sp{flex:1 1 auto}
#pick .hint{font-size:11.5px;color:#63636d}
.stage{display:none}
.stage.on{display:block}
</style>
<style>
/* ═══════════════════════════════════════════════════════════════════
   Α · ΤΟ ΒΙΒΛΙΟ — η γλώσσα των πακέτων σου, εφαρμοσμένη στα Αρχαία.
   Ό,τι ήδη είπες ότι είναι τέλειο: 940px, κάρτες με χρωματιστή ράχη,
   πίνακες, pill tabs.  Η ΜΟΝΗ προσθήκη είναι ότι το αρχαίο και η
   μετάφραση κάθονται ΔΙΠΛΑ-ΔΙΠΛΑ, που στα 620px ήταν αδύνατο.
   ═══════════════════════════════════════════════════════════════════ */
#va{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2b303b;--tx:#e8eaed;--dim:#a0a6b1;
  --a:#7dd3fc;--g:#86efac;--y:#fde047;--p:#c4b5fd;--o:#fdba74;
  background:var(--bg);color:var(--tx);min-height:100vh;
  font:400 16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
[data-theme=light] #va{--bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--line:#dfe3e8;--tx:#16181d;--dim:#5b6270;
  --a:#0369a1;--g:#15803d;--y:#a16207;--p:#6d28d9;--o:#c2410c}
#va .wrap{max-width:940px;margin:0 auto;padding:26px 18px 90px}
#va .kick{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
#va h1{font-size:1.65rem;letter-spacing:-.02em;margin:6px 0 4px;line-height:1.25}
#va .lede{color:var(--dim);font-size:.93rem;margin:0}
#va .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 26px;padding:10px 0;
  border-bottom:1px solid var(--line)}
#va .tabs span{background:var(--panel);color:var(--dim);border:1px solid var(--line);
  padding:8px 14px;border-radius:999px;font-size:.88rem;font-weight:600}
#va .tabs span.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
#va h2{font-size:1.14rem;margin:34px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
#va .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
#va .card.acc{border-left:3px solid var(--a)}
#va .card.key{border-left:3px solid var(--g)}
#va .card.warn{border-left:3px solid var(--o)}
#va .lab{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
  display:block;margin-bottom:6px}
#va .hl{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--y) 40%,transparent) 55%);
  padding:0 2px;font-weight:600}
#va .pair{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);
  border-radius:12px;overflow:hidden;margin:12px 0}
#va .pair>div{padding:16px 18px}
#va .pair .anc{background:var(--panel2);border-right:1px solid var(--line);font-size:1.02rem;line-height:1.85}
#va .pair .mod{background:var(--panel)}
#va table{width:100%;border-collapse:collapse;font-size:.93rem;margin:12px 0}
#va th,#va td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
#va th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
#va td:first-child{white-space:nowrap;font-weight:700;color:var(--a)}
#va ol.pts{margin:8px 0;padding-left:22px}
#va ol.pts li{margin:10px 0}
#va ol.pts .pl{font-weight:700}
#va ol.pts .pd{color:var(--dim);font-size:.92rem}
@media(max-width:760px){#va .pair{grid-template-columns:1fr}
  #va .pair .anc{border-right:none;border-bottom:1px solid var(--line)}}
</style>
<style>
/* ═══════════════════════════════════════════════════════════════════
   Β · Η ΕΚΔΟΣΗ — τυπωμένος τόμος, όχι εφαρμογή.
   Serif σώμα, χαρτί αντί για μαύρο, ΚΑΜΙΑ κάρτα και κανένα κουτί: μόνο
   λεπτές γραμμές και αέρας.  Οι όροι φεύγουν στο ΠΕΡΙΘΩΡΙΟ, εκεί που
   ζουν σε ένα σχολιασμένο κείμενο, ώστε το κείμενο να μένει κείμενο.
   Αυτή είναι η μόνη κατεύθυνση που διαβάζεται για ΩΡΑ χωρίς κούραση.
   ═══════════════════════════════════════════════════════════════════ */
#vb{--pa:#f7f3ea;--ink:#1e1a15;--soft:#6b6155;--rule:#ddd4c4;--acc:#8a5a2b;--mark:#c9a227;
  background:var(--pa);color:var(--ink);min-height:100vh;
  font:400 18px/1.72 Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua",serif}
[data-theme=dark] #vb{--pa:#14120f;--ink:#e8e1d4;--soft:#9a9086;--rule:#2f2a23;--acc:#d9a05b;--mark:#c9a227}
#vb .wrap{max-width:1080px;margin:0 auto;padding:52px 40px 100px}
#vb .top{border-bottom:1px solid var(--rule);padding-bottom:22px;margin-bottom:36px}
#vb .kick{font:600 11px/1 -apple-system,sans-serif;letter-spacing:.24em;text-transform:uppercase;
  color:var(--soft)}
#vb h1{font-size:2.05rem;font-weight:400;line-height:1.24;margin:14px 0 8px;letter-spacing:-.01em}
#vb .lede{color:var(--soft);font-size:1rem;font-style:italic;margin:0}
#vb .cols{display:grid;grid-template-columns:1fr 258px;gap:52px;align-items:start}
#vb h2{font:600 11px/1 -apple-system,sans-serif;letter-spacing:.24em;text-transform:uppercase;
  color:var(--soft);margin:44px 0 16px;padding-bottom:9px;border-bottom:1px solid var(--rule)}
#vb h2:first-child{margin-top:0}
#vb p{margin:0 0 15px}
#vb .drop::first-letter{float:left;font-size:3.3em;line-height:.82;padding:.06em .09em 0 0;color:var(--acc)}
#vb .hook{border-left:2px solid var(--acc);padding:2px 0 2px 20px;margin:18px 0;font-size:1.06rem}
#vb .hook .w{display:block;margin-top:9px;font-size:.9rem;color:var(--soft);font-style:italic;line-height:1.62}
#vb .anc{font-size:1.12rem;line-height:2.05;margin:0 0 20px}
#vb .mod{color:var(--soft);border-top:1px solid var(--rule);padding-top:18px}
#vb .gl{margin:0 0 22px}
#vb .gl dt{font-weight:700;font-size:.98rem}
#vb .gl dd{margin:3px 0 0;font-size:.9rem;line-height:1.6;color:var(--soft)}
#vb .side{font-size:.86rem;line-height:1.62;position:sticky;top:64px}
#vb .side h3{font:600 10px/1 -apple-system,sans-serif;letter-spacing:.2em;text-transform:uppercase;
  color:var(--soft);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
#vb .side .it{margin:0 0 15px}
#vb .side .t{font-weight:700;display:block}
#vb .side .d{color:var(--soft);display:block;margin-top:2px}
#vb .side .tag{display:inline-block;font:600 9px/1 -apple-system,sans-serif;letter-spacing:.14em;
  text-transform:uppercase;color:var(--acc);border:1px solid var(--rule);border-radius:3px;
  padding:3px 6px;margin-bottom:9px}
#vb ol.pts{margin:0;padding-left:24px}
#vb ol.pts li{margin:0 0 16px}
#vb ol.pts .pl{font-weight:700;display:block}
#vb ol.pts .pd{color:var(--soft);font-size:.94rem;display:block;margin-top:2px}
@media(max-width:920px){#vb .cols{grid-template-columns:1fr;gap:34px}#vb .side{position:static}
  #vb .wrap{padding:36px 22px 80px}}
</style>
<style>
/* ═══════════════════════════════════════════════════════════════════
   Γ · Ο ΠΑΓΚΟΣ — φτιαγμένο ΓΙΑ πλατιά οθόνη, αδύνατο σε τηλέφωνο.
   Τρεις στήλες που δεν κουνιούνται: ΤΙ βλέπω · ΤΟ ΚΕΙΜΕΝΟ · ΤΟ ΟΡΓΑΝΟ.
   Πατάς λέξη στα αρχαία, ανάβει η μετάφρασή της ΚΑΙ η εξήγηση δεξιά —
   χωρίς να φύγει τίποτα από την οθόνη και χωρίς κανένα scroll ανάμεσα.
   Η μοναδική κατεύθυνση όπου η αντιστοίχιση 80 ζευγαριών είναι ΑΝΕΤΗ.
   ═══════════════════════════════════════════════════════════════════ */
#vc{--bg:#0c0d10;--pan:#121419;--pan2:#171a20;--line:#22262e;--tx:#dfe3ea;--dim:#79808d;
  --acc:#6ea8fe;--acc2:#7ee0b8;
  background:var(--bg);color:var(--tx);height:calc(100vh - 46px);display:grid;
  grid-template-columns:212px 1fr 320px;
  font:400 15px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
[data-theme=light] #vc{--bg:#eef0f4;--pan:#fff;--pan2:#f6f7fa;--line:#dce0e8;--tx:#171a20;--dim:#697182;
  --acc:#1b5fd4;--acc2:#0d7a55}
#vc .rail{background:var(--pan);border-right:1px solid var(--line);padding:20px 0;overflow:auto}
#vc .rail .rk{font:700 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim);padding:0 18px 10px}
#vc .rail a{display:flex;gap:10px;align-items:baseline;padding:9px 18px;color:var(--dim);
  text-decoration:none;font-size:13.5px;border-left:2px solid transparent}
#vc .rail a .n{font:700 10px/1 ui-monospace,Menlo,monospace;color:var(--line)}
#vc .rail a.on{color:var(--tx);border-left-color:var(--acc);background:var(--pan2)}
#vc .rail a.on .n{color:var(--acc)}
#vc .mid{overflow:auto;padding:26px 34px 60px}
#vc .mid .kick{font:700 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
#vc .mid h1{font-size:1.32rem;font-weight:600;letter-spacing:-.01em;margin:9px 0 20px;line-height:1.3}
#vc .mid h2{font:700 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim);margin:30px 0 12px}
#vc .mid p{margin:0 0 13px}
#vc .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
#vc .grid2>div{background:var(--pan);padding:18px 20px}
#vc .grid2 .h{font:700 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);margin-bottom:11px}
#vc .anc{font-size:16px;line-height:2.02}
#vc .mod{line-height:1.86;color:var(--dim)}
#vc w{cursor:pointer;border-radius:3px;padding:1px 2px;transition:.12s}
#vc w[data-k]{color:var(--tx);box-shadow:inset 0 -1px 0 var(--line)}
#vc w[data-k]:hover{background:color-mix(in srgb,var(--acc) 18%,transparent)}
#vc w.lit{background:color-mix(in srgb,var(--acc) 30%,transparent);color:var(--tx);box-shadow:none}
#vc .mod w.lit{background:color-mix(in srgb,var(--acc2) 28%,transparent)}
#vc .app{background:var(--pan);border-left:1px solid var(--line);padding:22px 20px;overflow:auto}
#vc .app .rk{font:700 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim);margin-bottom:14px}
#vc .app .empty{color:var(--dim);font-size:13px;line-height:1.66}
#vc .app .kk{display:flex;gap:8px;align-items:baseline;margin-bottom:4px}
#vc .app .ka{font-size:17px;color:var(--acc)}
#vc .app .km{font-size:14px;color:var(--acc2)}
#vc .app .kw{font-size:13px;line-height:1.68;color:var(--tx);margin-top:10px}
#vc .app .it{border-top:1px solid var(--line);padding-top:13px;margin-top:13px;font-size:12.5px;line-height:1.6}
#vc .app .it b{display:block;font-size:13px}
#vc .app .it span{color:var(--dim)}
#vc ol.pts{margin:0;padding-left:20px;font-size:13.5px}
#vc ol.pts li{margin:0 0 11px}
#vc ol.pts .pd{color:var(--dim);display:block;font-size:12.5px}
@media(max-width:1100px){#vc{grid-template-columns:1fr;height:auto}
  #vc .rail,#vc .app{border:none;border-bottom:1px solid var(--line)}
  #vc .grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="pick">
  <b>Δείγμα</b>
  <button data-go="a" class="on">Α · Το βιβλίο</button>
  <button data-go="b">Β · Η έκδοση</button>
  <button data-go="c">Γ · Ο πάγκος</button>
  <span class="sp"></span>
  <button id="th">◐ Φως / σκοτάδι</button>
  <span class="hint">διάλεξε γράμμα και πες μου «αυτό»</span>
</div>

<section class="stage on" id="va"></section>
<section class="stage" id="vb"></section>
<section class="stage" id="vc"></section>

<script>
(function(){
  'use strict';
  var G = window.ARXGN;
  var stage = { a:document.getElementById('va'), b:document.getElementById('vb'), c:document.getElementById('vc') };

  /* ⛔ Σταθερή αρχή 10: αν λείπει το corpus, το ΛΕΕΙ. Ένα δείγμα που
     δείχνει άδειο θα κρινόταν ως άσχημο layout αντί για σπασμένο load. */
  if (!G || !G.UNITS || !G.UNITS.length){
    document.body.insertAdjacentHTML('beforeend',
      '<p style="font:16px system-ui;color:#c33;padding:40px">Δεν φόρτωσε το arxaia-gnosto-data.js — ' +
      'το δείγμα δεν έχει τι να δείξει. Δεν είναι θέμα σχεδίασης.</p>');
    return;
  }
  var U = G.UNITS[0];
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  /* Το ΙΔΙΟ υλικό και στα τρία, αλλιώς δεν συγκρίνονται. */
  var SIMPLE = U.simple.slice(0,2);
  var PTS    = U.skeleton.points.slice(0,3);
  /* ⚠️ ΕΝΑ ΚΟΜΜΑΤΙ ΔΕΝ ΦΤΑΝΕΙ ΓΙΑ ΝΑ ΚΡΙΘΕΙ ΤΥΠΟΓΡΑΦΙΑ. Η πρώτη περίοδος
     είναι 75 χαρακτήρες· σε τρεις στήλες θα φαινόταν αραιή και θα έκρινες
     τη ΣΠΑΝΙΟΤΗΤΑ αντί για τη σχεδίαση. Τέσσερις περίοδοι = πραγματική
     παράγραφος, με αρκετά ζευγάρια για να δουλέψει το πάτημα. */
  var SEGS   = U.align.segs.slice(0,4);
  /* Καρφωμένα κλειδιά, αλλά ΕΛΕΓΜΕΝΑ — τα k0…k6 υπάρχουν, το k9 όχι.
     Το φίλτρο μένει ώστε μια μελλοντική αλλαγή στο corpus να ΛΙΓΟΣΤΕΨΕΙ
     τον πίνακα αντί να ρίξει τη σελίδα. */
  var KEYS   = ['k1','k3','k5'].filter(function(k){ return U.align.pairs[k]; });

  /* ── Α · ΤΟ ΒΙΒΛΙΟ ──────────────────────────────────────────────── */
  stage.a.innerHTML =
  '<div class="wrap">' +
    '<div class="kick">Αρχαία · γνωστό · ' + esc(U.section) + '</div>' +
    '<h1>' + esc(U.title) + '</h1>' +
    '<p class="lede">Το κείμενο, η μετάφραση και το κλειδί των λέξεων — σε πλάτος που διαβάζεται.</p>' +
    '<div class="tabs"><span class="on">Σύνοψη</span><span>Το κείμενο</span><span>Το κλειδί</span>' +
      '<span>Ο σκελετός</span><span>Οι λέξεις</span></div>' +

    '<div class="card warn"><span class="lab">Ο γάντζος</span>' +
      '<b>' + esc(U.skeleton.hook) + '</b>' +
      '<p style="margin:9px 0 0;color:var(--dim);font-size:.92rem">' + esc(U.skeleton.hookWhy) + '</p></div>' +

    '<h2>Με απλά λόγια</h2>' +
    SIMPLE.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') +

    '<h2>Το κείμενο</h2>' +
    '<div class="pair"><div class="anc"><span class="lab">Αρχαίο</span>' + esc(U.ancient[0].p) + '</div>' +
      '<div class="mod"><span class="lab">Μετάφραση</span>' + esc(U.text[0].p) + '</div></div>' +

    '<h2>Το κλειδί <span style="font-size:.8rem;color:var(--dim);font-weight:400">· ' +
      Object.keys(U.align.pairs).length + ' ζευγάρια</span></h2>' +
    '<table><tr><th>Αρχαίο</th><th>Νέο</th><th>Γιατί</th></tr>' +
      KEYS.map(function(k){ var p=U.align.pairs[k];
        return '<tr><td>' + esc(p.a) + '</td><td><span class="hl">' + esc(p.m) + '</span></td><td>' + esc(p.w) + '</td></tr>';
      }).join('') + '</table>' +

    '<h2>Ο σκελετός</h2>' +
    '<div class="card acc"><ol class="pts">' + PTS.map(function(p){
      return '<li><span class="pl">' + esc(p.label) + '</span><span class="pd"> — ' + esc(p.detail) + '</span></li>';
    }).join('') + '</ol></div>' +

    '<h2>Οι λέξεις</h2>' +
    '<div class="card key"><span class="lab">Όροι · λόγια του βιβλίου</span>' +
      U.terms.slice(0,2).map(function(t){ return '<div style="margin:8px 0"><b>' + esc(t.t) + '</b> — ' + esc(t.d) + '</div>'; }).join('') +
    '</div>' +
    '<div class="card"><span class="lab">Λεξιλόγιο · δικά μου λόγια</span>' +
      U.vocab.slice(0,2).map(function(t){ return '<div style="margin:8px 0"><b>' + esc(t.t) + '</b> — ' + esc(t.d) + '</div>'; }).join('') +
    '</div>' +
  '</div>';

  /* ── Β · Η ΕΚΔΟΣΗ ───────────────────────────────────────────────── */
  stage.b.innerHTML =
  '<div class="wrap">' +
    '<div class="top"><div class="kick">Αρχαία · γνωστό — ' + esc(U.section) + '</div>' +
      '<h1>' + esc(U.title) + '</h1>' +
      '<p class="lede">Κείμενο, μετάφραση και σχόλιο στο περιθώριο.</p></div>' +
    '<div class="cols"><div>' +
      '<h2>Με απλά λόγια</h2>' +
      SIMPLE.map(function(p,i){ return '<p' + (i?'':' class="drop"') + '>' + esc(p) + '</p>'; }).join('') +
      '<div class="hook">' + esc(U.skeleton.hook) +
        '<span class="w">' + esc(U.skeleton.hookWhy) + '</span></div>' +

      '<h2>Το κείμενο</h2>' +
      '<p class="anc">' + esc(U.ancient[0].p) + '</p>' +
      '<div class="mod"><p>' + esc(U.text[0].p) + '</p></div>' +

      '<h2>Το κλειδί</h2>' +
      '<dl class="gl">' + KEYS.map(function(k){ var p=U.align.pairs[k];
        return '<dt>' + esc(p.a) + ' <span style="color:var(--acc)">·</span> ' + esc(p.m) + '</dt><dd>' + esc(p.w) + '</dd>';
      }).join('') + '</dl>' +

      '<h2>Ο σκελετός</h2>' +
      '<ol class="pts">' + PTS.map(function(p){
        return '<li><span class="pl">' + esc(p.label) + '</span><span class="pd">' + esc(p.detail) + '</span></li>';
      }).join('') + '</ol>' +
    '</div>' +
    '<aside class="side">' +
      '<span class="tag">Όροι</span><h3>Λόγια του βιβλίου</h3>' +
      U.terms.slice(0,3).map(function(t){
        return '<div class="it"><span class="t">' + esc(t.t) + '</span><span class="d">' + esc(t.d) + '</span></div>'; }).join('') +
      '<span class="tag" style="margin-top:22px">Λεξιλόγιο</span><h3>Δικά μου λόγια</h3>' +
      U.vocab.slice(0,3).map(function(t){
        return '<div class="it"><span class="t">' + esc(t.t) + '</span><span class="d">' + esc(t.d) + '</span></div>'; }).join('') +
    '</aside></div>' +
  '</div>';

  /* ── Γ · Ο ΠΑΓΚΟΣ ───────────────────────────────────────────────── */
  function side(segs, which){
    return segs.map(function(sg){
      return sg[which].map(function(t){
        return t[1] ? '<w data-k="' + esc(t[1]) + '">' + esc(t[0]) + '</w>' : '<w>' + esc(t[0]) + '</w>';
      }).join('');
    }).join(' ');
  }
  stage.c.innerHTML =
    '<nav class="rail"><div class="rk">Η ενότητα</div>' +
      ['Με απλά λόγια','Το κείμενο','Το κλειδί','Ο σκελετός','Οι λέξεις','Η ανάκληση']
        .map(function(t,i){ return '<a href="#" class="' + (i===1?'on':'') + '"><span class="n">0' + (i+1) +
          '</span>' + esc(t) + '</a>'; }).join('') +
    '</nav>' +
    '<div class="mid">' +
      '<div class="kick">' + esc(U.section) + '</div><h1>' + esc(U.title) + '</h1>' +
      '<h2>Με απλά λόγια</h2><p>' + esc(SIMPLE[0]) + '</p>' +
      '<h2>Το κείμενο · πάτα μια λέξη</h2>' +
      '<div class="grid2">' +
        '<div><div class="h">Αρχαίο</div><div class="anc" id="cA">' + side(SEGS,'a') + '</div></div>' +
        '<div><div class="h">Μετάφραση</div><div class="mod" id="cM">' + side(SEGS,'m') + '</div></div>' +
      '</div>' +
      '<h2>Ο σκελετός</h2><ol class="pts">' + PTS.map(function(p){
        return '<li>' + esc(p.label) + '<span class="pd">' + esc(p.detail) + '</span></li>'; }).join('') + '</ol>' +
    '</div>' +
    '<aside class="app" id="cApp"></aside>';

  var app = document.getElementById('cApp');
  function clearApp(){
    app.innerHTML = '<div class="rk">Το όργανο</div>' +
      '<p class="empty">Πάτα μια υπογραμμισμένη λέξη στα αρχαία ή στη μετάφραση. Ανάβουν ταυτόχρονα και οι δύο πλευρές, και εδώ εμφανίζεται το γιατί.</p>' +
      '<div class="it"><b>' + esc(U.terms[0].t) + '</b><span>' + esc(U.terms[0].d) + '</span></div>' +
      '<div class="it"><b>' + esc(U.vocab[0].t) + '</b><span>' + esc(U.vocab[0].d) + '</span></div>';
  }
  clearApp();
  stage.c.addEventListener('click', function(e){
    var w = e.target.closest ? e.target.closest('w[data-k]') : null;
    if (!w) return;
    var k = w.getAttribute('data-k'), p = U.align.pairs[k];
    stage.c.querySelectorAll('w.lit').forEach(function(n){ n.classList.remove('lit'); });
    stage.c.querySelectorAll('w[data-k="' + k + '"]').forEach(function(n){ n.classList.add('lit'); });
    if (!p) return clearApp();
    app.innerHTML = '<div class="rk">Το όργανο</div>' +
      '<div class="kk"><span class="ka">' + esc(p.a) + '</span></div>' +
      '<div class="km">' + esc(p.m) + '</div>' +
      '<div class="kw">' + esc(p.w) + '</div>';
  });

  /* ── ο διακόπτης ────────────────────────────────────────────────── */
  var btns = document.querySelectorAll('#pick button[data-go]');
  btns.forEach(function(b){
    b.onclick = function(){
      btns.forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      Object.keys(stage).forEach(function(k){ stage[k].classList.toggle('on', k === b.dataset.go); });
      document.documentElement.dataset.v = b.dataset.go;
      window.scrollTo({ top:0, behavior:'smooth' });
    };
  });
  /* Το θέμα ξεκινάει από το σύστημα και μετά είναι ΔΙΚΗ ΤΟΥ επιλογή. */
  var dark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
  function paint(){ document.documentElement.dataset.theme = dark ? 'dark' : 'light'; }
  paint();
  document.getElementById('th').onclick = function(){ dark = !dark; paint(); };
})();
</script>
</body>
</html>
