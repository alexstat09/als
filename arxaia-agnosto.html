  <!-- ⭐ Το ίδιο μπλοκ με την ergasies.html, ΚΑΤΑ ΛΕΞΗ: `margin:0` στο body,
       το `[hidden]{display:none!important}` (ΠΑΝΩ ΤΟΥ στέκεται όλος ο
       δρομολογητής αυτής της σελίδας — σταθ. 12: κλάση/ιδιότητα που

  <style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

  <!-- ⭐⭐⭐ ΤΟ ΠΟΛΥΤΟΝΙΚΟ ΕΧΕΙ ΗΔΗ ΚΟΣΤΙΣΕΙ ΜΙΑ ΦΟΡΑ (als-v504/526).
       Μετρημένο στο cmap (Greek Extended U+1F00–1FFF): Instrument Serif 0
       γλυφά · Georgia 74 ελληνικά και ΜΗΔΕΝ πολυτονικά · SF Pro 2 ·
       Times New Roman 233 · Alegreya 233 · GFS Didot 233.
       ⛔ Η GEORGIA ΑΠΑΓΟΡΕΥΕΤΑΙ ΚΑΙ ΩΣ FALLBACK: είναι η ΑΙΤΙΑ του «οι τόνοι
       δεν είναι σωστοί». Πέφτουμε σε Times New Roman, που κρατάει τους τόνους.
       Ίδια στοίβα με την arxaia.html, επίτηδες: ΔΥΟ σελίδες του ίδιου
       μαθήματος δεν επιτρέπεται να τυπώνουν το ίδιο αρχαίο με άλλο χέρι. -->

<body>
<!-- ══════════════════════════════════════════════════════════════════════
     ΑΡΧΑΙΑ · ΑΔΙΔΑΚΤΟ ΚΕΙΜΕΝΟ — als-v586

     Το brief του: «App Αρχαία Άγνωστο», κατεύθυνση C (κάρτες), σελ. 3–10 του
     PDF του Claude Design. Οι σελίδες 1–2 του PDF είναι παλιές κατευθύνσεις
     και ΔΕΝ υλοποιούνται — δική του εντολή, δύο φορές.

     ⛔ ΤΟ ΕΛΛΗΝΙΚΟ ΠΕΡΙΕΧΟΜΕΝΟ ΤΩΝ JSON ΕΙΝΑΙ ΚΛΕΙΔΩΜΕΝΟ. Είναι ελεγμένο
     λέξη προς λέξη (τόνοι, πνεύματα, απαντήσεις). Όπου ο κώδικας δεν
     ταίριαζε με τα δεδομένα, ΑΛΛΑΞΕ Ο ΚΩΔΙΚΑΣ. Καμία λέξη δεν γράφτηκε,
     δεν διορθώθηκε και δεν «κανονικοποιήθηκε» από εμένα.

     ⭐ ΚΑΜΙΑ ΚΛΗΣΗ ΜΟΝΤΕΛΟΥ. Η διόρθωση γίνεται με ΑΝΤΙΓΡΑΦΗ-ΕΠΙΚΟΛΛΗΣΗ:
     η σελίδα φτιάχνει το μήνυμα, εκείνος το δίνει στο Claude, και κολλάει
     πίσω το JSON. Κανένα κλειδί, κανένα endpoint, τίποτα να πέσει.

     ⭐ ΤΑ ΚΕΙΜΕΝΑ ΕΙΝΑΙ ΔΕΔΟΜΕΝΑ, ΟΧΙ ΚΩΔΙΚΑΣ. `data/index.json` κρατάει τη
     λίστα· κάθε κείμενο είναι ένα `data/<id>.json` με την ίδια μορφή. Νέο
     κείμενο = ένα αρχείο + ένα id στη λίστα. Καμία γραμμή κώδικα.
     ⚠️ Γι' αυτό η σελίδα ΔΙΑΒΑΖΕΙ με `fetch` και ΠΡΕΠΕΙ να ξεχωρίζει το
     «δεν έχει κείμενα» από το «δεν μπόρεσα να τα διαβάσω» (σταθ. 10).
     ══════════════════════════════════════════════════════════════════════ -->
<style>
:root{
  /* ── ΧΡΩΜΑ: ουδέτερο φόντο, ΕΝΑ accent, και με φειδώ (γλώσσα ④) ───── */
  --bg:#0C0B0A;            /* σχεδόν μαύρο, ζεστό */
  --ivory:#F3EFE8;
  --dim:rgba(243,239,232,.60);     /* 9,9:1 — κάθε λέξη ΑΝΑΓΝΩΣΗΣ */
  --soft:rgba(243,239,232,.80);
  --faint:rgba(243,239,232,.34);   /* ⛔ ΜΟΝΟ ετικέτες/μετρητές, ποτέ πρόζα */
  --line:rgba(243,239,232,.07);
  --line2:rgba(243,239,232,.13);
  --glass:rgba(255,255,255,.022);
  --ac:232,130,92;                 /* το κοραλλί του σχεδίου */
  --acc:rgb(var(--ac));
  --ok:rgb(var(--ac));

  /* ── ΤΥΠΟΓΡΑΦΙΑ: τρεις φωνές, και μόνο τρεις (γλώσσα ③) ──────────── */
  --gr:"GFS Didot","Times New Roman",Times,serif;       /* ΚΑΘΕ ελληνικός τίτλος */
  --anc:"GFS Didot","Times New Roman",Times,serif;      /* ΚΑΘΕ αρχαίο γράμμα */
  --body:"Alegreya","Times New Roman",Times,serif;      /* νέα ελληνικά, πρόζα σοβαρή */
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ivory);font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
::selection{background:rgba(var(--ac),.28)}
textarea{resize:vertical}

/* ── ΤΟ ΚΕΛΥΦΟΣ. 1180px, σταθ. 51: το λάπτοπ δεν είναι μεγάλο κινητό ── */
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(18px,4vw,44px)}
.mono{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.grtitle{font-family:var(--gr);font-style:italic;font-weight:400;color:var(--ivory);letter-spacing:-.005em;line-height:1.05}
.anc{font-family:var(--anc)}

/* ── ΔΙΑΔΡΟΜΗ. ⛔ σταθ. 64: η ΕΞΟΔΟΣ ΕΧΕΙ ΛΕΞΗ, και ονομάζει τον προορισμό
     όπως ονομάζεται ΕΚΕΙΝΟΣ («School Studies» = ο <h1> της homework.html).
     Σύνδεσμος, ποτέ history.back(): η σελίδα ανοίγει και από σελιδοδείκτη. */
.nav{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:26px 0 0}
.nav .exit{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);display:inline-flex;align-items:center;gap:9px;padding:7px 2px;transition:color .18s}
.nav .exit:hover{color:var(--ivory)}
.nav .right{margin-left:auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.nav .where{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.endbtn{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line2);border-radius:8px;padding:7px 11px;transition:color .18s,border-color .18s}
.endbtn:hover{color:var(--ivory);border-color:rgba(var(--ac),.5)}

/* ── ΤΟ ΕΞΩΦΥΛΛΟ ─────────────────────────────────────────────────── */
.mast{padding:46px 0 0}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint);margin-bottom:22px}
.masthead{display:flex;align-items:flex-end;gap:clamp(24px,5vw,64px);flex-wrap:wrap}
.masthead h1{font-family:var(--gr);font-style:italic;font-weight:400;font-size:clamp(52px,7.4vw,92px);line-height:.95;letter-spacing:-.02em;margin:0;flex:none}
.masthead h1 .dot{color:var(--acc)}
.lead{font-family:var(--body);font-size:15.5px;line-height:1.62;color:var(--dim);max-width:46ch;margin-top:18px}

/* ⭐ Διόρθωση 5 του brief: κάθε αριθμός έχει υπογραφή και ΑΝΟΙΓΕΙ τον χώρο του. */
.stats{display:flex;flex:1 1 520px;min-width:0;gap:0;flex-wrap:wrap;padding-bottom:6px}
.stat{flex:1 1 130px;min-width:0;padding:2px 20px 0;border-left:1px solid var(--line);position:relative;text-align:left;display:block}
.stat:first-child{border-left:0;padding-left:0}
.stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:12px;min-height:25px}
.stat .v{font-family:var(--mono);font-size:clamp(30px,3.6vw,44px);line-height:1;letter-spacing:-.02em;color:var(--ivory);display:block}
.stat .v .of{color:var(--faint)}
.stat.hot .v{color:var(--acc)}
.stat .sig{font-family:var(--body);font-size:13.5px;color:var(--dim);display:block;margin-top:11px}
.stat .go{position:absolute;top:0;right:12px;color:var(--faint);font-size:12px;opacity:.5;transition:opacity .2s,color .2s}
.stat:hover .go{opacity:1;color:var(--acc)}
.rule{height:1px;background:var(--line);margin:40px 0 0}

/* ── ΤΟ ΣΩΜΑ: ΟΙ ΕΞΙ ΚΑΡΤΕΣ ───────────────────────────────────────── */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:40px}
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.008));border:1px solid var(--line);border-radius:16px;padding:26px 26px 24px;display:flex;flex-direction:column;min-height:300px;transition:border-color .3s}
.card:hover{border-color:var(--line2)}
.card.wide{grid-column:span 2;min-height:0}
.card.full{grid-column:span 3;min-height:0}
.card .n{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--acc);display:block}
.card h2{font-family:var(--gr);font-style:italic;font-weight:400;font-size:33px;line-height:1.08;margin:9px 0 0;letter-spacing:-.01em}
.card .sub{font-family:var(--body);font-size:13.5px;line-height:1.55;color:var(--dim);margin-top:9px;max-width:62ch}
.card .open{position:absolute;top:20px;right:20px;width:36px;height:36px;border:1px solid var(--line2);border-radius:50%;display:grid;place-items:center;color:var(--dim);font-size:13px;transition:color .2s,border-color .2s,background .2s}
.card .open:hover{color:var(--acc);border-color:rgba(var(--ac),.55);background:rgba(var(--ac),.06)}
/* Ο ΑΕΡΑΣ ΕΙΝΑΙ ΜΕΡΟΣ ΤΟΥ ΣΧΕΔΙΟΥ: το κάτω μπλοκ κάθεται στον ΠΑΤΟ. */
.card .bot{margin-top:auto;padding-top:22px}
.card .foot{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:auto;padding-top:20px}
.card .foot .sp{margin-left:auto}

/* Η ΒΙΒΛΙΟΘΗΚΗ. ⭐ Διόρθωση 1 του brief: η στήλη ΕΡΓΟ παίρνει το πλάτος —
   το «Ἀπομνημονεύματα» έπεφτε πάνω στο χωρίο. Καμία στήλη δεν σπάει. */
.lib{margin-top:26px;width:100%}
.libhd,.librow{display:grid;grid-template-columns:minmax(0,.88fr) minmax(0,2.4fr) minmax(0,.6fr) minmax(0,.66fr) minmax(0,1.46fr) 32px;gap:12px;align-items:center}
.libhd{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);padding-bottom:13px;border-bottom:1px solid var(--line)}
.librow{padding:16px 0;border-bottom:1px solid var(--line);font-size:14px}
.librow:last-child{border-bottom:0}
.librow .who{font-family:var(--body);font-size:14.5px;color:var(--soft);display:flex;align-items:center;gap:9px}
.librow .who i{width:6px;height:6px;border-radius:50%;background:var(--acc);flex:none;display:none}
.librow.live .who i{display:block}
.librow .what{font-family:var(--anc);font-size:17px;color:var(--ivory);line-height:1.3}
.librow .pass,.librow .per{font-family:var(--mono);font-size:12px;color:var(--dim)}
.librow.live .per{color:var(--acc)}
.librow .st{display:flex;align-items:center;gap:9px 9px;flex-wrap:wrap;font-family:var(--body);font-size:13px;color:var(--dim);min-width:0}
.pips{display:inline-flex;gap:3px;flex:none}
.pips i{width:11px;height:2px;background:rgba(243,239,232,.18);border-radius:2px;display:block}
.pips i.on{background:var(--acc)}
.librow .go{justify-self:end;width:32px;height:32px;border:1px solid var(--line2);border-radius:50%;display:grid;place-items:center;color:var(--dim);font-size:12px;transition:color .2s,border-color .2s}
.librow .go:hover{color:var(--acc);border-color:rgba(var(--ac),.55)}

/* ── ΜΙΝΙ-ΑΣΚΗΣΕΙΣ ΜΕΣΑ ΣΤΙΣ ΚΑΡΤΕΣ (σελ. 4 του σχεδίου) ─────────── */
.mini{margin-top:26px}
.mini .q{font-family:var(--anc);font-size:26px;line-height:1.2;color:var(--ivory);display:flex;align-items:baseline;gap:14px}
.mini .q .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--faint);white-space:nowrap}
.mini .ask{font-family:var(--body);font-size:13.5px;color:var(--dim);margin-top:8px;line-height:1.5}
.mini .ans{width:100%;background:none;border:0;border-bottom:1px solid var(--line2);outline:none;font-family:var(--anc);font-size:21px;padding:9px 0 8px;margin-top:16px;color:var(--ivory)}
.mini .ans::placeholder{font-family:var(--body);font-size:16px;color:var(--faint)}
.mini .ans:focus{border-bottom-color:rgba(var(--ac),.6)}
.mini .opts{display:grid;gap:8px;margin-top:16px}
.mini .opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{text-align:left;border:1px solid var(--line2);border-radius:9px;padding:10px 13px;font-size:13.5px;color:var(--soft);font-family:var(--body);transition:border-color .18s,color .18s,background .18s}
.opt:hover:not(:disabled){border-color:rgba(var(--ac),.5);color:var(--ivory)}
.opt:disabled{cursor:default}
.opt.right{border-color:rgba(var(--ac),.55);color:var(--ivory);background:rgba(var(--ac),.07)}
.opt.wrongpick{color:var(--faint);text-decoration:line-through}
.mini .verdict{margin-top:14px;font-family:var(--body);font-size:13px;line-height:1.55;color:var(--dim);display:flex;align-items:flex-start;gap:12px}
.mini .verdict b{color:var(--ivory);font-weight:500}
.mini .verdict .mark{font-family:var(--mono);font-size:14px;flex:none;color:var(--acc)}
.mini .after{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}
.mini .said{font-family:var(--anc);font-size:19px;color:var(--ivory);border-bottom:1px solid rgba(var(--ac),.6);padding-bottom:3px}
.mini .said.bad{color:var(--faint);text-decoration:line-through;border-bottom-color:transparent}
.mini .corr{font-family:var(--body);font-size:13.5px;color:var(--dim)}
.mini .corr b{color:var(--ivory);font-weight:500}

.btn{font-family:var(--body);font-size:13.5px;color:var(--soft);border:1px solid var(--line2);border-radius:9px;padding:9px 15px;transition:color .18s,border-color .18s,background .18s;white-space:nowrap}
.btn:hover{color:var(--ivory);border-color:rgba(var(--ac),.5)}
.btn.key{color:var(--acc);border-color:rgba(var(--ac),.45)}
.btn.key:hover{background:rgba(var(--ac),.08)}
.btn:disabled{color:var(--faint);border-color:var(--line);cursor:not-allowed}
.btn.sm{font-size:12.5px;padding:7px 12px}

/* ── ΑΔΕΙΟ / ΣΦΑΛΜΑ — σταθ. 10: ΔΕΝ διαβάζονται ποτέ το ίδιο ──────── */
.empty{border:1px dashed var(--line2);border-radius:12px;padding:22px 20px;font-family:var(--body);font-size:13.5px;line-height:1.6;color:var(--dim);max-width:74ch}
.empty b{display:block;color:var(--soft);font-weight:500;margin-bottom:6px}
.fail{border:1px solid rgba(var(--ac),.4);background:rgba(var(--ac),.05);border-radius:12px;padding:22px 20px;font-family:var(--body);font-size:13.5px;line-height:1.6;color:var(--soft);max-width:74ch}
.fail b{display:block;color:var(--acc);font-weight:500;margin-bottom:6px}

/* ── ΤΟΑΣΤ ──────────────────────────────────────────────────────── */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(14px);background:#17150F;border:1px solid var(--line2);border-radius:11px;padding:12px 18px;font-family:var(--body);font-size:13.5px;color:var(--ivory);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:60;max-width:min(560px,90vw);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── ΟΙ ΟΘΟΝΕΣ ──────────────────────────────────────────────────── */
.scr{padding-bottom:70px}
.scrhd{padding:34px 0 0;display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap}
.scrhd h2{font-family:var(--gr);font-style:italic;font-weight:400;font-size:clamp(40px,5.4vw,64px);line-height:1;letter-spacing:-.018em}
.scrhd .meta{margin-left:auto;text-align:right}

@media (max-width:1040px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card.wide,.card.full{grid-column:span 2}
}
@media (max-width:760px){
  .cards{grid-template-columns:minmax(0,1fr)}
  .card.wide,.card.full{grid-column:span 1}
  .libhd{display:none}
  .librow{grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:18px 0}
  .librow .who{grid-column:1}
  .librow .go{grid-row:1/span 3;grid-column:2;align-self:start}
  .librow .what{grid-column:1}
  .librow .pass,.librow .per{display:inline}
  .librow .st{grid-column:1}
  .stat{flex:1 1 44%;padding:2px 14px 0;margin-bottom:18px}
  .stat:nth-child(odd){border-left:0;padding-left:0}
}
@media (max-width:560px){
  .stat .v{font-size:30px}
  .card{padding:22px 18px 20px}
  .mini .q{font-size:23px}
}
</style>

<div class="wrap">
  <nav class="nav">
    <a class="exit" href="homework.html" aria-label="Πίσω στο School Studies">← School Studies</a>
    <div class="right">
      <span class="where" id="where">Πανελλαδικές 2027 · Ανθρωπιστικές σπουδές</span>
      <button class="endbtn" id="endBtn" type="button">Αντιγραφή για #τέλος</button>
    </div>
  </nav>
</div>

<main id="screens">

  <!-- ══ 00 · ΑΡΧΙΚΗ ═══════════════════════════════════════════════ -->
  <section class="scr wrap" id="scr-home">
    <header class="mast">
      <div class="eyebrow">Αρχαία ελληνικά · αδίδακτο κείμενο</div>
      <div class="masthead">
        <h1>Ἄγνωστο<span class="dot">.</span></h1>
        <div class="stats" id="stats"></div>
      </div>
      <p class="lead">Μετάφραση περίοδο προς περίοδο, διόρθωση σαν βαθμολογητής,
        και ό,τι τη στηρίζει: γραμματική, συντακτικό, λεξιλόγιο, πινακάκια,
        αρχικοί χρόνοι.</p>
    </header>
    <div class="rule"></div>
    <div class="cards" id="cards"></div>
  </section>

</main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   ΜΕΡΟΣ 1 — ΑΠΟΘΗΚΗ, ΔΕΔΟΜΕΝΑ, ΕΡΓΑΛΕΙΑ
   ══════════════════════════════════════════════════════════════════════ */
(function(){
'use strict';

/* ── localStorage με ΦΩΝΗ. ⛔ σταθ. 10/17: ποτέ σιωπηλό catch, ποτέ
   monkey-patch του localStorage (σπάει το Safari). ─────────────────── */
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){
  try { localStorage.setItem(k,v); return true; }
  catch(e){
    /* Ένα γεμάτο τηλέφωνο ΔΕΝ επιτρέπεται να μοιάζει με επιτυχή αποθήκευση. */
    toast('Δεν αποθηκεύτηκε — ο χώρος της συσκευής είναι γεμάτος (' + (e && e.name || 'σφάλμα') + ').');
    return false;
  }
}

var KEY = 'agn:v1';

/* Το σχήμα της αποθήκης. Κάθε ΕΓΓΡΑΦΗ μέσα σε χάρτη παίρνει `_ts` από τη
   σφραγίδα (σταθ. 31) — αλλιώς το sync.js κρατάει το REMOTE σε κάθε
   βαθμωτό φύλλο και η πρόοδος γυρίζει πίσω μετά από ~400ms. */
function blank(){
  return {
    texts:{},      /* <textId>            → {drafts:{n:string}, submitted, score, at, _ts} */
    fixes:{},      /* <textId>            → {errors:[…], score, at, _ts}  (η διόρθωση) */
    gram:{},       /* <textId>|<itemId>   → {streak, wrong, seen, _ts} */
    syn:{},        /* <textId>|<itemId>   → {ok, tries, _ts} */
    vocab:{},      /* <textId>|<lemma>    → {box, due, seen, miss, _ts} */
    cards:[],      /* [{id, lemma, meaning, from, ts}] — «+ Στις κάρτες» */
    tables:{},     /* <tableId>           → {state:'new|review|learned', _ts} */
    verbs:{},      /* <lemma>             → {hard, _ts} */
    days:{}        /* <YYYY-MM-DD>        → {gram, gramWrong, syn, synWrong, vocab, vocabMiss, periods, _ts} */
  };
}
var S = blank();

function load(){
  var raw = lsGet(KEY), o = null;
  if (raw){ try { o = JSON.parse(raw); } catch(e){ o = null; } }
  var b = blank(), k;
  if (o && typeof o === 'object'){ for (k in b) if (o[k] && typeof o[k] === 'object') b[k] = o[k]; }
  S = b;
  STAMP.seed();
}
var STAMP = window.StudyStamp(function(){
  return [S.texts, S.fixes, S.gram, S.syn, S.vocab, S.tables, S.verbs, S.days];
}, function(i,k,rec){ return rec.at || rec.ts || rec.due || 0; });

function save(){
  STAMP.stamp();
  lsSet(KEY, JSON.stringify(S));
}

/* ── μικρά εργαλεία ─────────────────────────────────────────────── */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function el(id){ return document.getElementById(id); }
function nfc(s){ try { return String(s).normalize('NFC'); } catch(e){ return String(s); } }
function today(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function greekDate(){
  var m = ['Ιανουαρίου','Φεβρουαρίου','Μαρτίου','Απριλίου','Μαΐου','Ιουνίου','Ιουλίου','Αυγούστου','Σεπτεμβρίου','Οκτωβρίου','Νοεμβρίου','Δεκεμβρίου'];
  var d = new Date(); return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear();
}
var TO = null;
function toast(msg){
  var t = el('toast'); if (!t) return;
  t.textContent = msg; t.classList.add('on');
  clearTimeout(TO); TO = setTimeout(function(){ t.classList.remove('on'); }, 3400);
}
function day(){
  var k = today();
  if (!S.days[k]) S.days[k] = { gram:0, gramWrong:0, syn:0, synWrong:0, vocab:0, vocabMiss:0, periods:0 };
  return S.days[k];
}
function shuffle(a){
  for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function copy(text, okMsg){
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly',''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var done = false; try { done = document.execCommand('copy'); } catch(e){ done = false; }
    document.body.removeChild(ta);
    toast(done ? okMsg : 'Δεν μπόρεσα να αντιγράψω — διάλεξε το κείμενο με το χέρι.');
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(okMsg); }, fallback);
  } else fallback();
}

/* ── ΤΟ ΚΕΙΜΕΝΟ ΣΕ ΛΕΞΕΙΣ. Ο κανόνας είναι του JSON (`tokenizer_note`),
   όχι δικός μου: χωρισμός στα κενά, αφαιρούνται ΜΟΝΟ τα , . ; · — η
   απόστροφος ’ της έκθλιψης ΜΕΝΕΙ μέρος της λέξης. Το <με> είναι
   συμπλήρωση του εκδότη: φαίνεται με τα < >, μετριέται ως «με». ──── */
function bare(w){ return nfc(String(w).replace(/[,.;·]/g,'').replace(/[<>]/g,'')); }
function tokens(text){
  var raw = String(text).split(/\s+/).filter(function(x){ return x; }), out = [], seen = {}, i, b;
  for (i = 0; i < raw.length; i++){
    b = bare(raw[i]);
    seen[b] = (seen[b] || 0) + 1;
    out.push({ raw: raw[i], bare: b, occ: seen[b] });
  }
  return out;
}
/* Ταιριάζει ένα {form, occ} του JSON με ένα token της περιόδου. */
function hits(list){
  var m = {}, i, h;
  for (i = 0; i < (list||[]).length; i++){ h = list[i]; m[bare(h.form) + '|' + (h.occ || 1)] = 1; }
  return m;
}

/* ══════════════════════════════════════════════════════════════════
   ΤΑ ΔΕΔΟΜΕΝΑ. `data/index.json` → λίστα ids → ένα fetch ανά κείμενο.
   ⚠️ ΤΡΕΙΣ ΔΙΑΦΟΡΕΤΙΚΕΣ ΚΑΤΑΣΤΑΣΕΙΣ, ΤΡΕΙΣ ΔΙΑΦΟΡΕΤΙΚΕΣ ΠΡΟΤΑΣΕΙΣ
   (σταθ. 10): φορτώνει · δεν υπάρχουν κείμενα · ΔΕΝ ΜΠΟΡΕΣΑ ΝΑ ΔΙΑΒΑΣΩ.
   ══════════════════════════════════════════════════════════════════ */
var DATA = { texts:[], byId:{}, tables:null, xronoi:null, err:null, ready:false };

function getJSON(path){
  return fetch(path, { cache:'no-cache' }).then(function(r){
    if (!r.ok) throw new Error(path + ' → HTTP ' + r.status);   /* fetch() δεν πέφτει στα 4xx */
    return r.json();
  });
}

function boot(){
  return getJSON('data/index.json').then(function(ix){
    var ids = (ix && ix.texts) || [];
    var jobs = ids.map(function(id){
      return getJSON('data/' + id + '.json').then(function(t){ t.id = t.id || id; return t; });
    });
    jobs.push(getJSON('data/' + ((ix && ix.pinakakia) || 'pinakakia.json')).then(function(p){ DATA.tables = p; }, function(e){ DATA.tables = { _err:String(e.message||e) }; }));
    jobs.push(getJSON('data/' + ((ix && ix.arxikoi_xronoi) || 'arxikoi-xronoi.json')).then(function(p){ DATA.xronoi = p; }, function(e){ DATA.xronoi = { _err:String(e.message||e) }; }));
    return Promise.all(jobs);
  }).then(function(res){
    res.forEach(function(t){ if (t && t.id && t.periods){ DATA.texts.push(t); DATA.byId[t.id] = t; } });
    DATA.ready = true;
  }).catch(function(e){
    DATA.err = String((e && e.message) || e);
    DATA.ready = true;
  });
}

/* ── Ποιο κείμενο δουλεύει τώρα: το τελευταίο που άγγιξε, αλλιώς το πρώτο. */
function activeText(){
  var best = null, bt = -1, i, t, rec;
  for (i = 0; i < DATA.texts.length; i++){
    t = DATA.texts[i]; rec = S.texts[t.id];
    if (rec && (rec._ts || 0) > bt){ bt = rec._ts || 0; best = t; }
  }
  return best || DATA.texts[0] || null;
}
function drafts(id){ var r = S.texts[id]; return (r && r.drafts) || {}; }
function doneCount(t){
  var d = drafts(t.id), n = 0, i;
  for (i = 0; i < t.periods.length; i++){ if ((d[t.periods[i].n] || '').trim()) n++; }
  return n;
}

/* ── ΟΙ ΜΗΧΑΝΕΣ ΤΗΣ ΕΠΑΝΑΛΗΨΗΣ ─────────────────────────────────── */

/* Γραμματική: λάθος → ξανάρχεται· φεύγει από την επανάληψη ΜΟΝΟ με 2
   σωστές ΣΤΗ ΣΕΙΡΑ (`streak >= 2`). Τα «λάθος-Alex» έρχονται πρώτα. */
function gramItems(t){
  if (!t) return [];
  var base = ((t.grammar_drill && t.grammar_drill.items) || []).slice();
  /* Τα γραμματικά λάθη της διόρθωσης μπαίνουν στο ίδιο drill (brief, σελ. 6). */
  var fx = S.fixes[t.id];
  if (fx && fx.errors){
    fx.errors.forEach(function(er, i){
      if (!er || er.type !== 'γραμματικό' || !er.correct) return;
      base.push({
        id: 'fix' + (i+1), form: er.quote || ('περίοδος ' + (er.period || '?')),
        prompt: 'Από τη διόρθωση: γράψε το σωστό',
        accept: [String(er.correct)], explain: er.explain || '', tags: ['από τη διόρθωση'],
        fromFix: true
      });
    });
  }
  return base;
}
function gramRec(tid, id){
  var k = tid + '|' + id;
  if (!S.gram[k]) S.gram[k] = { streak:0, wrong:0, seen:0 };
  return S.gram[k];
}
function gramRepeat(t){
  var items = gramItems(t), n = 0, i, r;
  for (i = 0; i < items.length; i++){
    r = S.gram[t.id + '|' + items[i].id];
    if (r && r.wrong > 0 && (r.streak || 0) < 2) n++;
  }
  return n;
}
/* Η σειρά: πρώτα όσα είναι σε επανάληψη, μετά τα «λάθος-Alex», μετά τα νέα. */
function gramQueue(t){
  var items = gramItems(t), rep = [], alex = [], fresh = [], rest = [];
  items.forEach(function(it){
    var r = S.gram[t.id + '|' + it.id];
    var isRep = r && r.wrong > 0 && (r.streak || 0) < 2;
    var isAlex = (it.tags || []).indexOf('λάθος-Alex') >= 0;
    if (isRep) rep.push(it);
    else if (!r || !r.seen){ (isAlex ? alex : fresh).push(it); }
    else rest.push(it);
  });
  return rep.concat(alex, fresh, rest);
}

/* Λεξιλόγιο: κουτιά. «Δεν την ήξερα» → πίσω στο 0 και ξανά σήμερα. */
var BOXD = [0, 1, 3, 7, 16];
function vocabAll(t){
  var out = [], seen = {};
  if (t) (t.vocabulary || []).forEach(function(v){
    if (seen[v.lemma]) return; seen[v.lemma] = 1;
    out.push({ lemma:v.lemma, meaning:v.meaning, note:v.note || '', polysemous:!!v.polysemous, senses:v.senses || [], tid:t.id, own:false });
  });
  (S.cards || []).forEach(function(c){
    if (t && c.tid && c.tid !== t.id) { /* κάρτες άλλου κειμένου: μπαίνουν κι αυτές */ }
    var k = (c.tid || '-') + '|' + c.lemma;
    if (seen[k]) return; seen[k] = 1;
    out.push({ lemma:c.lemma, meaning:c.meaning, note:c.note || '', polysemous:false, senses:[], tid:c.tid || (t && t.id) || '-', own:true });
  });
  return out;
}
function vRec(c){
  var k = c.tid + '|' + c.lemma;
  if (!S.vocab[k]) S.vocab[k] = { box:0, due:0, seen:0, miss:0 };
  return S.vocab[k];
}
function vocabDue(t){
  var now = Date.now(), all = vocabAll(t), n = 0, i, r;
  for (i = 0; i < all.length; i++){ r = S.vocab[all[i].tid + '|' + all[i].lemma]; if (!r || !r.due || r.due <= now) n++; }
  return { due:n, total:all.length };
}

/* Συντακτικό */
function synRec(tid, id){
  var k = tid + '|' + id;
  if (!S.syn[k]) S.syn[k] = { ok:0, tries:0 };
  return S.syn[k];
}

/* ══════════════════════════════════════════════════════════════════
   Ο ΔΡΟΜΟΛΟΓΗΤΗΣ. Κάθε οθόνη είναι ένα <section class="scr"> με id
   `scr-<name>`· το `hidden` το ορίζει το reset στο <head> (σταθ. 12:
   ό,τι εναλλάσσει η JS υπάρχει στο CSS — εδώ είναι ΙΔΙΟΤΗΤΑ, όχι κλάση).
   ⛔ σταθ. 39: τίποτα δεν γεννιέται αόρατο περιμένοντας observer —
   κάθε οθόνη ΧΤΙΖΕΤΑΙ τη στιγμή που ανοίγει.
   ══════════════════════════════════════════════════════════════════ */
var SCREENS = {};   /* name → {build: fn} — γεμίζει από τα επόμενα μέρη */
var CUR = { name:'home', arg:'' };

function route(){
  var h = (location.hash || '').replace(/^#\/?/, '');
  var parts = h.split('/');
  var name = parts[0] || 'home', arg = parts[1] || '';
  if (!SCREENS[name]) name = 'home';
  CUR = { name:name, arg:arg };
  Object.keys(SCREENS).forEach(function(k){
    var node = el('scr-' + k);
    if (node) node.hidden = (k !== name);
  });
  var node = el('scr-' + name);
  if (node){
    node.hidden = false;
    try { SCREENS[name].build(arg); } catch(e){
      node.innerHTML = '<div class="wrap"><div class="fail" style="margin-top:40px"><b>Κάτι έσπασε σε αυτή την οθόνη</b>' +
        esc(String(e && e.message || e)) + '</div></div>';
    }
  }
  window.scrollTo(0, 0);
  var w = el('where');
  if (w) w.textContent = (name === 'home') ? 'Πανελλαδικές 2027 · Ανθρωπιστικές σπουδές' : 'Άγνωστο · ' + (SCREENS[name].label || '');
}

/* ══════════════════════════════════════════════════════════════════
   ΟΘΟΝΗ 00 — Η ΑΡΧΙΚΗ
   ══════════════════════════════════════════════════════════════════ */
SCREENS.home = { label:'Αρχική', build: renderHome };

function statHTML(k, v, sig, opts){
  opts = opts || {};
  return '<a class="stat' + (opts.hot ? ' hot' : '') + '" href="' + esc(opts.href || '#/') + '">' +
    '<span class="k">' + esc(k) + '</span>' +
    '<span class="v">' + v + '</span>' +
    '<span class="sig">' + esc(sig) + '</span>' +
    '<span class="go">↗</span></a>';
}

function renderStats(){
  var box = el('stats'); if (!box) return;
  var t = activeText();
  if (!t){ box.innerHTML = ''; return; }
  var done = doneCount(t), tot = t.periods.length;
  var rep = gramRepeat(t), v = vocabDue(t), fx = S.fixes[t.id];
  var name = (t.author || '') + ' ' + (t.passage || '');
  box.innerHTML =
    statHTML('Περίοδοι', esc(done) + '<span class="of">/' + esc(tot) + '</span>',
      name.trim() + (done === tot ? ' · μεταφρασμένο' : ' · σε εξέλιξη'), { href:'#/keimeno/' + t.id }) +
    statHTML('Λάθη σε επανάληψη', esc(rep), 'Γραμματική', { href:'#/grammatiki', hot: rep > 0 }) +
    statHTML('Κάρτες σήμερα', esc(v.due), 'Λεξιλόγιο · ' + v.total + ' σύνολο', { href:'#/lexilogio' }) +
    statHTML('Τελ. διόρθωση', fx ? esc(fx.score) : '<span class="of">[—]</span>',
      (fx ? '/ 20 · ' : 'μόλις υποβάλεις · ') + (t.author || ''), { href:'#/diorthosi/' + t.id });
}

function libraryHTML(){
  if (DATA.err) return '<div class="fail"><b>Δεν μπόρεσα να διαβάσω τα κείμενα</b>' +
    esc(DATA.err) + '. Δεν σημαίνει ότι δεν υπάρχουν — σημαίνει ότι η ανάγνωση απέτυχε.</div>';
  if (!DATA.texts.length) return '<div class="empty"><b>Κανένα κείμενο ακόμη</b>' +
    'Κάθε νέο αδίδακτο είναι ένα αρχείο <span class="num">data/&lt;id&gt;.json</span> και το id του στο <span class="num">data/index.json</span>. Καμία αλλαγή κώδικα.</div>';
  var act = activeText();
  var rows = DATA.texts.map(function(t){
    var done = doneCount(t), tot = t.periods.length, live = act && act.id === t.id && done > 0;
    var pips = '', i;
    for (i = 0; i < tot; i++) pips += '<i class="' + (i < done ? 'on' : '') + '"></i>';
    var state = done === 0 ? 'νέο' : (done < tot ? 'σε εξέλιξη' : (S.fixes[t.id] ? 'διορθωμένο' : 'μεταφρασμένο'));
    return '<a class="librow' + (live ? ' live' : '') + '" href="#/keimeno/' + esc(t.id) + '">' +
      '<span class="who"><i></i>' + esc(t.author || '—') + '</span>' +
      '<span class="what">' + esc(t.work || '—') + '</span>' +
      '<span class="pass num">' + esc(t.passage || '—') + '</span>' +
      '<span class="per num">' + (done ? esc(done) + '/' + esc(tot) : '[—]') + '</span>' +
      '<span class="st"><span class="pips">' + pips + '</span>' + esc(state) + '</span>' +
      '<span class="go">↗</span></a>';
  }).join('');
  return '<div class="lib">' +
    '<div class="libhd"><span>Συγγραφέας</span><span>Έργο</span><span>Χωρίο</span><span>Περίοδοι</span><span>Κατάσταση</span><span></span></div>' +
    rows + '</div>';
}

function card(n, title, sub, href, bodyHTML, footHTML){
  return '<section class="card' + (n === '01' ? ' wide' : (n === '06' ? ' full' : '')) + '">' +
    '<a class="open" href="' + esc(href) + '" aria-label="Άνοιξε: ' + esc(title) + '">↗</a>' +
    '<span class="n">' + esc(n) + '</span>' +
    '<h2>' + esc(title) + '</h2>' +
    '<p class="sub">' + esc(sub) + '</p>' +
    (bodyHTML || '') +
    (footHTML ? '<div class="foot">' + footHTML + '</div>' : '') +
    '</section>';
}

function renderHome(){
  renderStats();
  var t = activeText(), box = el('cards');
  if (!box) return;
  var libFoot = '';
  if (DATA.texts.length){
    var inprog = 0, fresh = 0, fixed = 0;
    DATA.texts.forEach(function(x){
      var d = doneCount(x);
      if (S.fixes[x.id]) fixed++;
      if (d === 0) fresh++; else if (d < x.periods.length) inprog++;
    });
    libFoot = '<span>' + inprog + ' σε εξέλιξη</span><span>' + fresh + ' νέα</span><span>' + fixed + ' διορθωμένα</span>' +
      '<span class="sp">+ νέο κείμενο = ένα JSON στο data/</span>';
  }
  box.innerHTML =
    card('01', 'Κείμενα & Μετάφραση',
      'Βιβλιοθήκη αδιδάκτων · καθοδήγηση ανά περίοδο · διόρθωση με μονάδες',
      t ? ('#/keimeno/' + t.id) : '#/', libraryHTML(), libFoot) +
    card('02', 'Γραμματική', 'Drill τύπων με πολυτονικό πληκτρολόγιο · τα λάθη ξαναέρχονται ώσπου 2 σωστές στη σειρά',
      '#/grammatiki', '<div class="mini" id="miniG"></div>', '') +
    card('03', 'Συντακτικό', 'Συντακτική θέση ανά λέξη · δευτερεύουσες σε 4 πεδία · μετατροπές',
      '#/syntaktiko', '<div class="mini" id="miniS"></div>', '') +
    card('04', 'Λεξιλόγιο', 'Κάρτες επανάληψης · πολύσημες λέξεις και λέξεις που δεν ήξερα',
      '#/lexilogio', '<div class="mini" id="miniV"></div>', '') +
    card('05', 'Πινακάκια', 'Γραμματική και Συντακτικό · διάβασμα, κρυμμένα κελιά, τεστ συμπλήρωσης',
      '#/pinakakia', '<div class="bot" id="miniP"></div>', '') +
    card('06', 'Αρχικοί χρόνοι', 'Οι στήλες θα έρθουν από το βιβλίο σου',
      '#/xronoi', '<div class="bot" id="miniX"></div>', '');
  buildMinis();
}

/* Τα υπόλοιπα μέρη (μίνι-ασκήσεις, οθόνες) προσαρτώνται παρακάτω. */
window.AGN = {
  S: function(){ return S; }, save:save, load:load, esc:esc, el:el, nfc:nfc, toast:toast,
  DATA:DATA, SCREENS:SCREENS, route:route, renderHome:renderHome, renderStats:renderStats,
  activeText:activeText, drafts:drafts, doneCount:doneCount, tokens:tokens, hits:hits, bare:bare,
  gramItems:gramItems, gramRec:gramRec, gramRepeat:gramRepeat, gramQueue:gramQueue,
  vocabAll:vocabAll, vRec:vRec, vocabDue:vocabDue, synRec:synRec, BOXD:BOXD,
  day:day, today:today, greekDate:greekDate, shuffle:shuffle, copy:copy, btnRow:null,
  cur:function(){ return CUR; }
};

function buildMinis(){ if (window.AGN.buildMinis) window.AGN.buildMinis(); }

/* ── εκκίνηση ───────────────────────────────────────────────────── */
load();
boot().then(function(){
  if (window.AGN.afterBoot) window.AGN.afterBoot();
  route();
});
window.addEventListener('hashchange', route);

el('endBtn').addEventListener('click', function(){
  if (window.AGN.endSummary) copy(window.AGN.endSummary(), 'Η σύνοψη #τέλος αντιγράφηκε.');
});

/* ⭐ Cloud sync. Η αναμονή είναι στις ΠΡΟΫΠΟΘΕΣΕΙΣ (το sync.js φορτώνει
   defer), και το `onApplied` ΞΑΝΑΔΙΑΒΑΖΕΙ πριν γράψει οτιδήποτε — αλλιώς
   μια εισερχόμενη συγχώνευση χάνεται από παλιό αντίγραφο στη μνήμη.
   Το appKey είναι ΚΥΡΙΟΛΕΚΤΙΚΟ εδώ, για να το βρίσκει ο φρουρός του
   smoke-test.sh που ελέγχει ότι κάθε συγχρονισμένο κλειδί υπάρχει στα
   BUNDLES της backup.html. */
(function(){
  var tries = 0;
  (function wait(){
    if (typeof window.initCloudSync !== 'function' || !window.supabase){ if (tries++ < 40) setTimeout(wait, 200); return; }
    window.initCloudSync({
      appKey: 'arxaia-agn',
      syncedKeys: ['agn:v1'],
      onApplied: function(){
        load();
        if (CUR.name === 'home') renderHome(); else route();
      }
    });
  })();
})();

})();
</script>

<script>
/* ══════════════════════════════════════════════════════════════════════
   ΜΕΡΟΣ 2 — ΟΙ ΜΙΝΙ-ΑΣΚΗΣΕΙΣ ΤΗΣ ΑΡΧΙΚΗΣ ΚΑΙ Η ΟΘΟΝΗ ΤΟΥ ΚΕΙΜΕΝΟΥ
   ══════════════════════════════════════════════════════════════════════ */
(function(){
'use strict';
var A = window.AGN, esc = A.esc, el = A.el, nfc = A.nfc;

function S(){ return A.S(); }
function mkScreen(name, label){
  var sec = document.createElement('section');
  sec.className = 'scr wrap'; sec.id = 'scr-' + name; sec.hidden = true;
  document.getElementById('screens').appendChild(sec);
  return sec;
}
function backHTML(){ return '<a class="back" href="#/">← Άγνωστο</a>'; }

/* ══ ΟΙ ΜΙΝΙ-ΑΣΚΗΣΕΙΣ (σελ. 4) ══════════════════════════════════════
   Λειτουργούν αληθινά: απαντάω, βλέπω σωστό/λάθος, πατάω «Επόμενο».
   Γράφουν στην ΙΔΙΑ αποθήκη με τις μεγάλες οθόνες — μία πρόοδος, όχι δύο. */
var mini = { g:null, s:null, v:null };

function pickGram(t){
  var q = A.gramQueue(t); return q.length ? q[0] : null;
}
function miniGram(){
  var box = el('miniG'); if (!box) return;
  var t = A.activeText();
  if (!t){ box.innerHTML = '<div class="empty" style="margin-top:20px"><b>Χωρίς κείμενο</b>Το drill γεννιέται από το κείμενο που δουλεύεις.</div>'; return; }
  var items = A.gramItems(t);
  if (!items.length){ box.innerHTML = '<div class="empty" style="margin-top:20px"><b>Καμία άσκηση γραμματικής</b>Αυτό το κείμενο δεν έχει <span class="num">grammar_drill</span> στο JSON του.</div>'; return; }
  mini.g = mini.g && items.filter(function(i){ return i.id === mini.g.id; })[0] || pickGram(t);
  var it = mini.g; if (!it){ box.innerHTML = ''; return; }
  var idx = items.map(function(x){ return x.id; }).indexOf(it.id) + 1;
  box.innerHTML =
    '<div class="q"><span class="anc">' + esc(it.form) + '</span><span class="cnt">' + idx + ' / ' + items.length + '</span></div>' +
    '<div class="ask">' + esc(it.prompt) + '</div>' +
    '<input class="ans" id="mgIn" type="text" placeholder="απάντηση…" autocomplete="off" autocapitalize="off" spellcheck="false">' +
    '<div class="after" id="mgAfter" hidden></div>';
  var inp = el('mgIn');
  inp.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); checkMiniGram(); } });
}
function checkMiniGram(){
  var t = A.activeText(), it = mini.g, inp = el('mgIn'); if (!t || !it || !inp) return;
  var said = nfc(inp.value.trim()); if (!said){ inp.focus(); return; }
  var ok = (it.accept || []).some(function(a){ return nfc(a) === said; });
  gradeGram(t, it, ok);
  var after = el('mgAfter');
  inp.disabled = true;
  inp.style.color = ok ? 'var(--ivory)' : 'var(--faint)';
  inp.style.textDecoration = ok ? 'none' : 'line-through';
  inp.style.borderBottomColor = ok ? 'rgba(232,130,92,.75)' : 'var(--line)';
  after.hidden = false;
  after.innerHTML =
    '<div class="corr">' + (ok
      ? 'Σωστό' + ((it.accept || []).length > 1 ? ' · δεκτό και <b>' + esc(it.accept.filter(function(a){ return nfc(a) !== said; })[0] || '') + '</b>' : '')
      : '<b style="color:var(--acc)">Σωστό:</b> <b>' + esc((it.accept || []).join(' / ')) + '</b>') +
    (it.explain ? '<br><span style="color:var(--dim)">' + esc(it.explain) + '</span>' : '') + '</div>' +
    '<button class="btn sm" id="mgNext" style="margin-left:auto">Επόμενο →</button>';
  el('mgNext').addEventListener('click', function(){
    var q = A.gramQueue(t);
    mini.g = q.filter(function(x){ return x.id !== it.id; })[0] || q[0] || null;
    miniGram(); A.renderStats();
  });
}
function gradeGram(t, it, ok){
  var r = A.gramRec(t.id, it.id), d = A.day();
  r.seen = (r.seen || 0) + 1;
  if (ok){ r.streak = (r.streak || 0) + 1; }
  else { r.streak = 0; r.wrong = (r.wrong || 0) + 1; d.gramWrong = (d.gramWrong || 0) + 1;
    (S().days[A.today()].list = S().days[A.today()].list || []).push({ k:'Γ', form:it.form, right:(it.accept||[]).join(' / ') }); }
  d.gram = (d.gram || 0) + 1;
  A.save();
}

function miniSyn(){
  var box = el('miniS'); if (!box) return;
  var t = A.activeText();
  var items = (t && t.syntax && t.syntax.word_items) || [];
  if (!items.length){ box.innerHTML = '<div class="empty" style="margin-top:20px"><b>Καμία άσκηση συντακτικού</b>Θα έρθουν με το επόμενο κείμενο.</div>'; return; }
  if (!mini.s || !items.filter(function(x){ return x.id === mini.s.id; })[0]){
    var open = items.filter(function(x){ var r = S().syn[t.id + '|' + x.id]; return !r || !r.ok; });
    mini.s = (open[0] || items[0]);
  }
  var it = mini.s;
  var per = (t.periods.filter(function(p){ return p.n === it.period; })[0]) || t.periods[0];
  var opts = synOptions(t, it, 4);
  box.innerHTML =
    '<div style="font-family:var(--anc);font-size:19px;line-height:1.7;color:var(--dim);margin-top:4px">' + phraseHTML(per, it) + '</div>' +
    '<div class="opts two" id="msOpts">' + opts.map(function(o){
      return '<button class="opt" type="button" data-o="' + esc(o) + '">' + esc(o) + '</button>'; }).join('') + '</div>' +
    '<div class="verdict" id="msV" hidden></div>';
  el('msOpts').addEventListener('click', function(e){
    var b = e.target.closest('[data-o]'); if (!b) return;
    answerMiniSyn(t, it, b.getAttribute('data-o'), b);
  });
}
/* Η φράση γύρω από τη λέξη, με τη λέξη υπογραμμισμένη (όπως στο σχέδιο). */
function phraseHTML(per, it){
  var tk = A.tokens(per.text), out = [], i, hit = false;
  for (i = 0; i < tk.length; i++){
    var isIt = tk[i].bare === A.bare(it.form) && tk[i].occ === (it.occ || 1);
    if (isIt) hit = true;
    out.push(isIt ? '<b style="color:var(--ivory);font-weight:400;border-bottom:1px solid var(--acc)">' + esc(tk[i].raw) + '</b>' : esc(tk[i].raw));
  }
  /* Αν δεν βρεθεί (δεν έχει συμβεί, αλλά η σιωπή είναι το bug): το λέει. */
  return hit ? out.join(' ') : esc(per.text) + ' <span style="color:var(--acc)">— η λέξη «' + esc(it.form) + '» δεν βρέθηκε σε αυτή την περίοδο</span>';
}
function synOptions(t, it, n){
  var all = (t.syntax.role_options || []).slice();
  var right = (it.accept || [])[0];
  var pool = all.filter(function(o){ return (it.accept || []).indexOf(o) < 0; });
  A.shuffle(pool);
  var out = [right].concat(pool.slice(0, Math.max(0, n - 1)));
  return A.shuffle(out);
}
function answerMiniSyn(t, it, pick, btn){
  var ok = (it.accept || []).indexOf(pick) >= 0, r = A.synRec(t.id, it.id), d = A.day();
  r.tries = (r.tries || 0) + 1; if (ok) r.ok = 1;
  d.syn = (d.syn || 0) + 1;
  if (!ok){ d.synWrong = (d.synWrong || 0) + 1;
    (S().days[A.today()].list = S().days[A.today()].list || []).push({ k:'Σ', form:it.form, right:(it.accept||[]).join(' / ') }); }
  A.save();
  var box = el('msOpts');
  Array.prototype.forEach.call(box.querySelectorAll('.opt'), function(b){
    b.disabled = true;
    var v = b.getAttribute('data-o');
    if ((it.accept || []).indexOf(v) >= 0) b.classList.add('right');
    else if (v === pick) b.classList.add('wrongpick');
  });
  var v = el('msV'); v.hidden = false;
  v.innerHTML = '<span class="mark">' + (ok ? '✓' : '✕') + '</span><div>' +
    (ok ? 'Σωστό' : '<b style="color:var(--acc)">Σωστό:</b> ' + esc((it.accept || []).join(' / '))) +
    '<br><b>' + esc(it.answer) + '</b></div>' +
    '<button class="btn sm" id="msNext" style="margin-left:auto;align-self:center">Επόμενο →</button>';
  el('msNext').addEventListener('click', function(){
    var items = t.syntax.word_items;
    var open = items.filter(function(x){ var rr = S().syn[t.id + '|' + x.id]; return (!rr || !rr.ok) && x.id !== it.id; });
    mini.s = open[0] || items[(items.map(function(x){ return x.id; }).indexOf(it.id) + 1) % items.length];
    miniSyn();
  });
}

function miniVocab(){
  var box = el('miniV'); if (!box) return;
  var t = A.activeText(), all = A.vocabAll(t);
  if (!all.length){ box.innerHTML = '<div class="empty" style="margin-top:20px"><b>Καμία κάρτα ακόμη</b>Οι κάρτες έρχονται από το λεξιλόγιο του κειμένου και από το «+ Στις κάρτες».</div>'; return; }
  var now = Date.now();
  if (!mini.v || !all.filter(function(c){ return c.lemma === mini.v.lemma && c.tid === mini.v.tid; })[0]){
    var due = all.filter(function(c){ var r = S().vocab[c.tid + '|' + c.lemma]; return !r || !r.due || r.due <= now; });
    mini.v = due[0] || all[0];
  }
  var c = mini.v, r = A.vRec(c);
  var wrong = all.filter(function(x){ return x.lemma !== c.lemma; });
  A.shuffle(wrong);
  var opts = A.shuffle([c.meaning].concat(wrong.slice(0, 2).map(function(x){ return x.meaning; })));
  var dueN = A.vocabDue(t);
  box.innerHTML =
    '<div class="q"><span class="anc">' + esc(c.lemma) + '</span><span class="cnt">' + (r.miss ? 'δεν την ήξερα' : (r.seen ? 'επανάληψη' : 'νέα')) + '</span></div>' +
    '<div class="opts" id="mvOpts">' + opts.map(function(o){
      return '<button class="opt" type="button" data-o="' + esc(o) + '">' + esc(o) + '</button>'; }).join('') + '</div>' +
    '<div class="verdict" id="mvV" hidden></div>' +
    '<div class="foot" style="margin-top:18px;padding-top:0"><span>' + esc(dueN.due) + ' / ' + esc(dueN.total) + ' για σήμερα</span></div>';
  el('mvOpts').addEventListener('click', function(e){
    var b = e.target.closest('[data-o]'); if (!b) return;
    answerMiniVocab(t, c, b.getAttribute('data-o'));
  });
}
function answerMiniVocab(t, c, pick){
  var ok = pick === c.meaning, r = A.vRec(c), d = A.day();
  gradeVocab(c, ok);
  d.vocab = (d.vocab || 0) + 1;
  if (!ok){ d.vocabMiss = (d.vocabMiss || 0) + 1;
    (S().days[A.today()].list = S().days[A.today()].list || []).push({ k:'Λ', form:c.lemma, right:c.meaning }); }
  A.save();
  Array.prototype.forEach.call(el('mvOpts').querySelectorAll('.opt'), function(b){
    b.disabled = true;
    var v = b.getAttribute('data-o');
    if (v === c.meaning) b.classList.add('right'); else if (v === pick) b.classList.add('wrongpick');
  });
  var v = el('mvV'); v.hidden = false;
  var days = A.BOXD[Math.min(r.box, A.BOXD.length - 1)];
  v.innerHTML = '<span class="mark">' + (ok ? '✓' : '✕') + '</span><div>' +
    (ok ? 'Σωστό · ' + (days ? 'ξανά σε ' + days + ' μέρες' : 'ξανά σήμερα') : '<b style="color:var(--acc)">Σωστό:</b> ' + esc(c.meaning) + ' · ξαναέρχεται σήμερα') +
    (c.polysemous && c.senses.length ? '<br><span style="color:var(--dim)">πολύσημη: ' + esc(c.senses.join(' · ')) + '</span>' : '') +
    '</div><button class="btn sm" id="mvNext" style="margin-left:auto;align-self:center">Επόμενο →</button>';
  el('mvNext').addEventListener('click', function(){
    var all = A.vocabAll(t), now = Date.now();
    var due = all.filter(function(x){ var rr = S().vocab[x.tid + '|' + x.lemma]; return (!rr || !rr.due || rr.due <= now) && !(x.lemma === c.lemma && x.tid === c.tid); });
    mini.v = due[0] || all.filter(function(x){ return x.lemma !== c.lemma; })[0] || all[0];
    miniVocab(); A.renderStats();
  });
}
function gradeVocab(c, ok){
  var r = A.vRec(c);
  r.seen = (r.seen || 0) + 1;
  if (ok){ r.box = Math.min((r.box || 0) + 1, A.BOXD.length - 1); r.due = Date.now() + A.BOXD[r.box] * 864e5; }
  else { r.box = 0; r.miss = (r.miss || 0) + 1; r.due = Date.now(); }
}

/* Οι δύο κάρτες χωρίς δικά τους δεδομένα ακόμη: ΓΕΓΟΝΟΣ, όχι τρύπα. */
function miniTables(){
  var box = el('miniP'); if (!box) return;
  var d = A.DATA.tables, n = 0;
  if (d && d.groups) d.groups.forEach(function(g){ n += (g.tables || []).length; });
  box.innerHTML = d && d._err
    ? '<div class="fail"><b>Δεν διάβασα τα πινακάκια</b>' + esc(d._err) + '</div>'
    : (n ? '<div class="foot" style="padding-top:0"><span>' + n + ' πίνακες</span></div>'
         : '<div class="empty"><b>Κανένας πίνακας ακόμη</b>Θα μπουν αυτολεξεί από το βιβλίο σου. Τρεις καταστάσεις: νέο, θέλει επανάληψη, μαθημένο.</div>');
}
function miniXronoi(){
  var box = el('miniX'); if (!box) return;
  var d = A.DATA.xronoi, n = (d && d.verbs && d.verbs.length) || 0;
  box.innerHTML = d && d._err
    ? '<div class="fail"><b>Δεν διάβασα τους αρχικούς χρόνους</b>' + esc(d._err) + '</div>'
    : (n ? '<div class="foot" style="padding-top:0"><span>' + n + ' ρήματα</span></div>'
         : '<div class="empty"><b>0 ρήματα</b>Οι στήλες και η σειρά θα έρθουν από το βιβλίο σου. Μέχρι τότε, η ανάκληση με τη φωνή ζει στα <a href="arxaia.html#ag" style="color:var(--acc)">Αρχαία · αρχικοί χρόνοι</a>.</div>');
}
A.buildMinis = function(){ miniGram(); miniSyn(); miniVocab(); miniTables(); miniXronoi(); };
A.gradeGram = gradeGram; A.gradeVocab = gradeVocab;

/* ══ ΟΘΟΝΗ · ΚΕΙΜΕΝΟ / ΜΕΤΑΦΡΑΣΗ ═══════════════════════════════════ */
mkScreen('keimeno');
var CTX = { tid:'', per:1, step:0 };

A.SCREENS.keimeno = { label:'Κείμενο', build: function(arg){ buildText(arg); } };

function rec(tid){
  var s = S();
  if (!s.texts[tid]) s.texts[tid] = { drafts:{}, submitted:0 };
  if (!s.texts[tid].drafts) s.texts[tid].drafts = {};
  return s.texts[tid];
}

function buildText(tid){
  var sec = el('scr-keimeno');
  var t = A.DATA.byId[tid] || A.activeText();
  if (!t){
    sec.innerHTML = backHTML() + (A.DATA.err
      ? '<div class="fail" style="margin-top:30px"><b>Δεν μπόρεσα να διαβάσω τα κείμενα</b>' + esc(A.DATA.err) + '</div>'
      : '<div class="empty" style="margin-top:30px"><b>Δεν υπάρχει τέτοιο κείμενο</b>Ο σύνδεσμος δείχνει σε id που δεν είναι στο <span class="num">data/index.json</span>.</div>');
    return;
  }
  if (CTX.tid !== t.id){ CTX = { tid:t.id, per: firstOpen(t), step:0 }; }
  var r = rec(t.id), done = A.doneCount(t), tot = t.periods.length;
  var fix = S().fixes[t.id];

  var glosses = (t.exam_glosses || []).map(function(g){
    return '<div><b>' + esc(g.form) + '</b>' + esc(g.meaning) + '</div>'; }).join('');

  sec.innerHTML = backHTML() +
    '<header class="txhead">' +
      '<div><h2>' + esc(t.author || '') + '</h2>' +
        '<div class="work">' + esc(t.work || '') + ' <em>' + esc(t.passage || '') + '</em></div></div>' +
      '<div class="count"><b>' + esc(done) + '<span class="of">/' + esc(tot) + '</span></b><span>Περίοδοι μεταφρασμένες</span></div>' +
    '</header>' +
    '<div class="intro"><p>' + esc(t.intro || '') + '</p>' +
      (glosses ? '<div class="gloss">' + glosses + '</div>' : '') + '</div>' +
    '<div class="two">' +
      '<div><div id="pers"></div>' +
        '<div class="subbar">' +
          '<span class="why" id="subWhy"></span>' +
          '<span class="sp"></span>' +
          '<button class="btn key" id="subBtn" type="button">Υποβολή για διόρθωση ↗</button>' +
        '</div>' +
        '<div id="pasteBox"></div>' +
      '</div>' +
      '<aside class="side"><div class="guide" id="guide"></div></aside>' +
    '</div>';

  renderPeriods(t);
  renderGuide(t);
  renderSub(t);

  el('subBtn').addEventListener('click', function(){ submitForFix(t); });
}
function firstOpen(t){
  var d = A.drafts(t.id), i;
  for (i = 0; i < t.periods.length; i++){ if (!(d[t.periods[i].n] || '').trim()) return t.periods[i].n; }
  return t.periods[0].n;
}

function renderPeriods(t){
  var d = A.drafts(t.id), fix = S().fixes[t.id];
  var html = t.periods.map(function(p){
    var txt = d[p.n] || '';
    var words = (txt.trim() ? txt.trim().split(/\s+/).length : 0);
    return '<div class="per' + (CTX.per === p.n ? ' on' : '') + '" data-p="' + p.n + '">' +
      '<div class="pn num">' + String(p.n).padStart(2,'0') + '</div>' +
      '<div><div class="ptext" data-ptext="' + p.n + '">' + periodHTML(t, p) + '</div>' +
        (p.structure_hint && CTX.per === p.n ? '<div class="hint"><b>Ο κορμός:</b> ' + esc(p.structure_hint) + '</div>' : '') +
        '<div class="mytr"><div class="lb"><span>Η μετάφρασή μου' + (CTX.per === p.n ? ' · περίοδος ' + String(p.n).padStart(2,'0') : '') + '</span>' +
          '<span class="r num">' + words + ' λέξεις' + (txt.trim() ? ' · πρόχειρο' : '') + '</span></div>' +
          '<textarea data-tr="' + p.n + '" placeholder="Μετάφραση…" rows="2">' + esc(txt) + '</textarea></div>' +
        (fix ? '<div class="model"><div class="lb">Πρότυπη μετάφραση</div><p>' + esc(p.model_translation) + '</p></div>' : '') +
      '</div></div>';
  }).join('');
  el('pers').innerHTML = html;

  var pers = el('pers');
  pers.addEventListener('input', onDraft);
  pers.addEventListener('focusin', function(e){
    var ta = e.target.closest('[data-tr]'); if (!ta) return;
    setPeriod(t, +ta.getAttribute('data-tr'), true);
  });
  pers.addEventListener('click', function(e){
    var w = e.target.closest('w.an');
    if (w){ openPop(t, w); return; }
    var p = e.target.closest('.per'); if (p) setPeriod(t, +p.getAttribute('data-p'), true);
  });
  autoGrow();
}
function periodHTML(t, p){
  var tk = A.tokens(p.text), map = {}, i;
  (p.words || []).forEach(function(w){ map[A.bare(w.form) + '|' + (w.occ || 1)] = w; });
  var g = (p.guidance || [])[CTX.step];
  var hl = (CTX.per === p.n && g) ? A.hits(g.highlight) : {};
  var out = [];
  for (i = 0; i < tk.length; i++){
    var k = tk[i].bare + '|' + tk[i].occ;
    var cls = [];
    if (map[k]) cls.push('an');
    if (hl[k]) cls.push('hl');
    out.push('<w class="' + cls.join(' ') + '" data-k="' + esc(k) + '">' + esc(tk[i].raw) + '</w>');
  }
  return out.join(' ');
}
function setPeriod(t, n, keep){
  if (CTX.per === n) return;
  CTX.per = n; CTX.step = 0;
  renderPeriods(t); renderGuide(t);
}
var DT = null;
function onDraft(e){
  var ta = e.target.closest('[data-tr]'); if (!ta) return;
  var t = A.DATA.byId[CTX.tid]; if (!t) return;
  var n = ta.getAttribute('data-tr');
  var r = rec(t.id);
  r.drafts[n] = ta.value;
  ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px';
  clearTimeout(DT);
  DT = setTimeout(function(){
    A.save();
    var lb = ta.parentNode.querySelector('.r');
    var w = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
    if (lb) lb.textContent = w + ' λέξεις' + (ta.value.trim() ? ' · πρόχειρο' : '');
    renderSub(t); A.renderStats();
    var c = el('scr-keimeno').querySelector('.count b');
    if (c) c.innerHTML = A.doneCount(t) + '<span class="of">/' + t.periods.length + '</span>';
  }, 450);
}
function autoGrow(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-tr]'), function(ta){
    ta.style.height = 'auto'; ta.style.height = Math.max(52, ta.scrollHeight + 2) + 'px';
  });
}

/* ── Η ΚΑΘΟΔΗΓΗΣΗ. 5 βήματα, με φωτισμό των λέξεων του `highlight`. ── */
function renderGuide(t){
  var p = t.periods.filter(function(x){ return x.n === CTX.per; })[0] || t.periods[0];
  var steps = p.guidance || [];
  var i = Math.min(CTX.step, Math.max(0, steps.length - 1));
  var cur = steps[i];
  var bars = steps.map(function(_, k){ return '<i class="' + (k <= i ? 'on' : '') + '"></i>'; }).join('');
  var rows = steps.map(function(s, k){
    return '<div class="step' + (k === i ? ' cur' : (k < i ? ' done' : '')) + '" data-s="' + k + '">' +
      '<span class="dot">' + (k < i ? '✓' : (k + 1)) + '</span>' +
      '<span class="nm">' + esc(s.step) + '</span>' +
      '<span class="an anc">' + esc(s.answer) + '</span></div>';
  }).join('');
  var hl = cur ? A.hits(cur.highlight) : {};
  var all = (p.words || []).filter(function(w){ return !!w.lemma; });
  var step = all.filter(function(w){ return hl[A.bare(w.form) + '|' + (w.occ || 1)]; });
  var ws = step.length ? step : all;
  var wlb = step.length ? 'Λέξεις του βήματος' : 'Λέξεις της περιόδου';
  var wrows = ws.map(function(w){
    return '<div class="wrow"><div><span class="lm">' + esc(w.form) + '</span>' +
      '<span class="mn">' + esc(w.lemma) + ' · ' + esc(w.grammar) + '</span></div>' +
      '<button class="btn sm add" type="button" data-add="' + esc(w.lemma) + '" data-g="' + esc(w.grammar) + '">+ Στις κάρτες</button></div>';
  }).join('');
  el('guide').innerHTML =
    '<div class="gh"><span class="lb">Καθοδήγηση · περίοδος ' + String(p.n).padStart(2,'0') + '</span></div>' +
    '<h3>Βήμα ' + (i + 1) + ' από ' + steps.length + '</h3>' +
    '<div class="bars">' + bars + '</div>' +
    rows +
    (cur ? '<div class="gcur">' + esc(cur.answer) + '</div>' + (cur.note ? '<div class="gnote">' + esc(cur.note) + '</div>' : '') : '') +
    '<div class="gnav">' +
      '<button class="btn sm" id="gPrev" type="button"' + (i === 0 ? ' disabled' : '') + '>← Προηγούμενο</button>' +
      '<button class="btn sm key" id="gNext" type="button"' + (i >= steps.length - 1 ? ' disabled' : '') + '>Επόμενο βήμα →</button>' +
    '</div>' +
    '<div class="words"><div class="lb">' + esc(wlb) + '</div>' + (wrows || '<div class="empty">Καμία ανάλυση λέξεων για αυτή την περίοδο.</div>') + '</div>';

  el('gPrev').addEventListener('click', function(){ CTX.step = Math.max(0, i - 1); repaintHL(t); });
  el('gNext').addEventListener('click', function(){ CTX.step = Math.min(steps.length - 1, i + 1); repaintHL(t); });
  el('guide').addEventListener('click', function(e){
    var s = e.target.closest('[data-s]');
    if (s){ CTX.step = +s.getAttribute('data-s'); repaintHL(t); return; }
    var a = e.target.closest('[data-add]');
    if (a){ addCard(t, a.getAttribute('data-add'), a.getAttribute('data-g'), a); }
  });
}
function repaintHL(t){
  var p = t.periods.filter(function(x){ return x.n === CTX.per; })[0];
  var node = el('pers').querySelector('[data-ptext="' + CTX.per + '"]');
  if (node && p) node.innerHTML = periodHTML(t, p);
  renderGuide(t);
}

/* ⭐ Οι κάρτες που φτιάχνει ΕΚΕΙΝΟΣ. Το νόημα έρχεται από το λεξιλόγιο
   του κειμένου όταν υπάρχει· αλλιώς από τη γραμματική αναγνώριση. Ποτέ
   δεν εφευρίσκω ελληνικό περιεχόμενο. */
function addCard(t, lemma, grammar, btn){
  var v = (t.vocabulary || []).filter(function(x){ return x.lemma === lemma || x.lemma.split(',')[0] === lemma; })[0];
  var meaning = v ? v.meaning : grammar;
  var s = S();
  if (s.cards.some(function(c){ return c.lemma === lemma && c.tid === t.id; })){ A.toast('Η λέξη είναι ήδη στις κάρτες.'); return; }
  s.cards.push({ id:'c' + Date.now(), lemma:lemma, meaning:meaning, tid:t.id, ts:Date.now() });
  A.save();
  if (btn){ btn.textContent = 'στις κάρτες ✓'; btn.disabled = true; }
  A.toast('«' + lemma + '» μπήκε στις κάρτες.');
  A.renderStats();
}

/* ── Κλικ σε λέξη: λήμμα + γραμματική. ⛔ ΟΧΙ ο συντακτικός ρόλος —
   θα πρόδιδε τις ασκήσεις του συντακτικού (ρητά στο brief). ──────── */
var POP = null;
function openPop(t, w){
  closePop();
  var p = t.periods.filter(function(x){ return x.n === +w.closest('[data-ptext]').getAttribute('data-ptext'); })[0];
  var k = w.getAttribute('data-k');
  var wd = (p.words || []).filter(function(x){ return A.bare(x.form) + '|' + (x.occ || 1) === k; })[0];
  if (!wd) return;
  var d = document.createElement('div');
  d.id = 'pop';
  d.innerHTML = '<div class="f">' + esc(wd.form) + '</div>' +
    '<div class="lm">' + esc(wd.lemma) + '</div>' +
    '<div class="gr">' + esc(wd.grammar) + '</div>' +
    (wd.check ? '<span class="chk" title="' + esc(wd.check_note || '') + '">δεκτές και άλλες ερμηνείες</span>' : '') +
    '<div class="row"><button class="btn sm" type="button" id="popAdd">+ Στις κάρτες</button>' +
    '<button class="x" type="button" id="popX" aria-label="Κλείσε">×</button></div>';
  document.body.appendChild(d);
  var r = w.getBoundingClientRect();
  var top = r.bottom + window.scrollY + 8;
  var left = Math.min(r.left + window.scrollX, window.innerWidth - d.offsetWidth - 16);
  d.style.top = top + 'px'; d.style.left = Math.max(12, left) + 'px';
  POP = d;
  el('popAdd').addEventListener('click', function(){ addCard(t, wd.lemma, wd.grammar, el('popAdd')); });
  el('popX').addEventListener('click', closePop);
}
function closePop(){ if (POP && POP.parentNode) POP.parentNode.removeChild(POP); POP = null; }
document.addEventListener('click', function(e){
  if (POP && !e.target.closest('#pop') && !e.target.closest('w.an')) closePop();
});

/* ── ΥΠΟΒΟΛΗ ΓΙΑ ΔΙΟΡΘΩΣΗ — ΑΝΤΙΓΡΑΦΗ-ΕΠΙΚΟΛΛΗΣΗ, ΚΑΜΙΑ ΚΛΗΣΗ ────
   ⛔ σταθ. 65: μια ενέργεια που μπλοκάρεται ΛΕΕΙ ΤΙ ΤΗΣ ΛΕΙΠΕΙ. Το
   κουμπί δεν ζωγραφίζεται νεκρό: λέει ποιες περίοδοι λείπουν και το
   κλικ πηγαίνει τον κέρσορα εκεί. ──────────────────────────────── */
function missing(t){
  var d = A.drafts(t.id), out = [];
  t.periods.forEach(function(p){ if (!(d[p.n] || '').trim()) out.push(p.n); });
  return out;
}
function renderSub(t){
  var m = missing(t), why = el('subWhy'); if (!why) return;
  why.innerHTML = m.length
    ? 'Λείπει η μετάφραση ' + (m.length === 1 ? 'της περιόδου ' : 'των περιόδων ') + '<b style="color:var(--acc)">' + m.join(', ') + '</b>. Η διόρθωση ανοίγει όταν μεταφραστούν και οι ' + t.periods.length + '.'
    : 'Έτοιμο. Το κουμπί αντιγράφει το μήνυμα για το Claude· μετά κολλάς εδώ το JSON της διόρθωσης.';
}
function submitForFix(t){
  var m = missing(t);
  if (m.length){
    A.toast('Λείπει η περίοδος ' + m[0] + ' — σε πήγα εκεί.');
    var ta = el('pers').querySelector('[data-tr="' + m[0] + '"]');
    if (ta){ ta.scrollIntoView({ block:'center' }); ta.focus(); }
    return;
  }
  var d = A.drafts(t.id);
  var body = t.periods.map(function(p){
    return 'Περίοδος ' + p.n + ': ' + p.text + '\nΗ μετάφρασή μου: ' + (d[p.n] || '').trim() + '\nΠρότυπη: ' + p.model_translation;
  }).join('\n\n');
  var msg = '#διόρθωση Αδίδακτο — ' + (t.author || '') + ', ' + (t.work || '') + ' ' + (t.passage || '') + '\n' +
    'Μονάδες μετάφρασης: ' + (t.translation_points || 20) + '\n\n' + body + '\n\n' +
    'Βαθμολόγησε σαν βαθμολογητής. Σημείωσε κάθε λάθος ως γραμματικό / συντακτικό / λεξιλογικό.\n' +
    'Στο τέλος δώσε μου ΚΑΙ ένα block JSON για την εφαρμογή:\n' +
    '{"text_id":"' + t.id + '","score":X,"errors":[{"period":n,"quote":"…","type":"γραμματικό|συντακτικό|λεξιλογικό","explain":"…","correct":"…"}]}';
  A.copy(msg, 'Το μήνυμα αντιγράφηκε. Δώσ’ το στο Claude και κόλλησε εδώ το JSON.');
  rec(t.id).submitted = Date.now();
  A.save();
  openPaste(t);
}
function openPaste(t){
  var box = el('pasteBox');
  box.innerHTML = '<div class="paste"><div class="lb">Επικόλλησε το JSON της διόρθωσης</div>' +
    '<textarea id="fixIn" placeholder=\'{"text_id":"' + esc(t.id) + '","score":16,"errors":[…]}\' spellcheck="false"></textarea>' +
    '<div class="row"><button class="btn key" id="fixGo" type="button">Δες τη διόρθωση</button>' +
    '<span class="msg" id="fixMsg"></span></div></div>';
  el('fixIn').focus();
  el('fixGo').addEventListener('click', function(){ takeFix(t); });
}
/* Ανεκτικό διάβασμα: ο βαθμολογητής μπορεί να το τυλίξει σε ```json …```
   ή να γράψει κείμενο γύρω του. ⛔ Ο,τι ΔΕΝ καταλάβει, το ΛΕΕΙ. */
function takeFix(t){
  var raw = (el('fixIn').value || '').trim(), msg = el('fixMsg');
  if (!raw){ msg.textContent = 'Το πεδίο είναι άδειο — κόλλησε το JSON block.'; return; }
  var s = raw.indexOf('{'), e = raw.lastIndexOf('}');
  var obj = null;
  if (s >= 0 && e > s){ try { obj = JSON.parse(raw.slice(s, e + 1)); } catch(err){ obj = null; } }
  if (!obj){ msg.textContent = 'Δεν διαβάζεται ως JSON. Κόλλησε ΜΟΝΟ το block που ξεκινάει με { και κλείνει με }.'; return; }
  if (obj.text_id && obj.text_id !== t.id){
    msg.textContent = 'Αυτή η διόρθωση είναι για άλλο κείμενο (' + obj.text_id + ').'; return;
  }
  var score = Number(obj.score);
  if (!isFinite(score)){ msg.textContent = 'Λείπει το «score». Χωρίς αυτό δεν ξέρω τον βαθμό.'; return; }
  var errs = Array.isArray(obj.errors) ? obj.errors : [];
  S().fixes[t.id] = { score:score, errors:errs, at:Date.now() };
  A.save();
  A.toast('Η διόρθωση μπήκε: ' + score + '/' + (t.translation_points || 20) + '.');
  location.hash = '#/diorthosi/' + t.id;
}
A.openPaste = openPaste;

})();
