<script>
/* ══════════════════════════════════════════════════════════════════════
   ΜΕΡΟΣ 3 — ΔΙΟΡΘΩΣΗ · ΓΡΑΜΜΑΤΙΚΗ (ΠΟΛΥΤΟΝΙΚΟ) · ΣΥΝΤΑΚΤΙΚΟ
   ══════════════════════════════════════════════════════════════════════ */
(function(){
'use strict';
var A = window.AGN, esc = A.esc, el = A.el, nfc = A.nfc;
function S(){ return A.S(); }
function mk(name){
  var sec = document.createElement('section');
  sec.className = 'scr wrap'; sec.id = 'scr-' + name; sec.hidden = true;
  document.getElementById('screens').appendChild(sec); return sec;
}
function backHTML(){ return '<a class="back" href="#/">← Άγνωστο</a>'; }

/* ══ ΔΙΟΡΘΩΣΗ ═════════════════════════════════════════════════════ */
mk('diorthosi');
A.SCREENS.diorthosi = { label:'Διόρθωση', build: buildFix };

var KIND = { 'γραμματικό':'gram', 'συντακτικό':'syn', 'λεξιλογικό':'lex' };
function kindCls(t){ return KIND[String(t || '').trim()] || 'gram'; }

function buildFix(tid){
  var sec = el('scr-diorthosi');
  var t = A.DATA.byId[tid] || A.activeText();
  if (!t){ sec.innerHTML = backHTML() + '<div class="empty" style="margin-top:30px"><b>Δεν υπάρχει τέτοιο κείμενο</b>Ο σύνδεσμος δείχνει σε id εκτός του <span class="num">data/index.json</span>.</div>'; return; }
  var fx = S().fixes[t.id], d = A.drafts(t.id);
  if (!fx){
    sec.innerHTML = backHTML() +
      '<header class="fxhead"><div><h2>' + esc(t.author || '') + ' ' + esc(t.passage || '') + '</h2>' +
      '<div class="work">' + esc(t.work || '') + '</div></div></header>' +
      '<div class="empty" style="margin-top:28px"><b>Καμία διόρθωση ακόμη</b>' +
      'Η διόρθωση γίνεται με αντιγραφή-επικόλληση: μεταφράζεις και τις ' + t.periods.length +
      ' περιόδους, η σελίδα αντιγράφει το μήνυμα για το Claude, και το JSON που θα σου δώσει κολλιέται πίσω εδώ.</div>' +
      '<div style="margin-top:18px;display:flex;gap:12px;flex-wrap:wrap">' +
      '<a class="btn key" href="#/keimeno/' + esc(t.id) + '">Στο κείμενο →</a>' +
      '<button class="btn" id="fxOpen" type="button">Έχω ήδη το JSON</button></div>' +
      '<div id="pasteBox"></div>';
    el('fxOpen').addEventListener('click', function(){ A.openPaste(t); });
    return;
  }
  var errs = fx.errors || [];
  var byPer = {}, orphan = [];
  errs.forEach(function(e, i){ e.__i = i + 1; (byPer[e.period] = byPer[e.period] || []).push(e); });
  var cnt = { gram:0, syn:0, lex:0 };
  errs.forEach(function(e){ cnt[kindCls(e.type)]++; });

  var rows = t.periods.map(function(p){
    var mineRaw = (d[p.n] || '').trim();
    var mine = markErrors(mineRaw, byPer[p.n] || [], orphan);
    var cards = (byPer[p.n] || []).map(function(e){
      var k = kindCls(e.type);
      return '<div class="ecard ' + k + '"><div class="h"><span class="num">' + String(e.__i).padStart(2,'0') + '</span>' +
        '<span class="ln"></span><span>' + esc(e.type || '') + '</span></div>' +
        '<p>' + esc(e.explain || '') + '</p>' +
        (e.correct ? '<div class="ok">Σωστά: <b>' + esc(e.correct) + '</b></div>' : '') + '</div>';
    }).join('');
    return '<div class="fxrow"><div><div class="pn">' + String(p.n).padStart(2,'0') + '</div>' +
      '<div class="src">' + esc(p.text) + '</div>' +
      '<div class="mine">' + (mineRaw ? mine : '<span style="color:var(--faint)">— δεν είχε γραφτεί μετάφραση —</span>') + '</div>' +
      '<div class="model" style="margin-top:14px"><div class="lb">Πρότυπη</div><p>' + esc(p.model_translation) + '</p></div></div>' +
      '<div>' + (cards || '<div class="none"><b>✓</b> Χωρίς λάθη</div>') + '</div></div>';
  }).join('');

  var orphanHTML = orphan.length
    ? '<div class="empty" style="margin-top:20px"><b>' + orphan.length + ' λάθη δεν μπόρεσα να τα δείξω πάνω στη μετάφρασή σου</b>' +
      orphan.map(function(e){ return '«' + esc(e.quote || '') + '» — ' + esc(e.explain || ''); }).join('<br>') +
      '<br><span style="color:var(--faint)">Η φράση του βαθμολογητή δεν βρέθηκε αυτολεξεί στο κείμενό σου· τα μετράω κανονικά.</span></div>'
    : '';

  var toDrill = errs.filter(function(e){ return kindCls(e.type) === 'gram' && e.correct; }).length;

  sec.innerHTML = backHTML() +
    '<header class="fxhead">' +
      '<div><div class="eyebrow" style="margin-bottom:14px">Διόρθωση · σαν βαθμολογητής</div>' +
      '<h2>' + esc(t.author || '') + ' ' + esc(t.passage || '') + '</h2>' +
      '<div class="work">' + esc(t.work || '') + '</div></div>' +
      '<div class="scorebox"><span class="b">' + esc(fx.score) + '</span><span class="u">/ ' + esc(t.translation_points || 20) + '</span>' +
      '<span class="t">Μονάδες μετάφρασης</span></div>' +
    '</header>' +
    '<div class="kinds">' +
      '<div class="kind gram"><b>' + cnt.gram + '</b><span><span class="ln"></span><span class="lb">Γραμματικά</span></span></div>' +
      '<div class="kind syn"><b>' + cnt.syn + '</b><span><span class="ln"></span><span class="lb">Συντακτικά</span></span></div>' +
      '<div class="kind lex"><b>' + cnt.lex + '</b><span><span class="ln"></span><span class="lb">Λεξιλογικά</span></span></div>' +
    '</div>' +
    rows + orphanHTML +
    '<div class="fxfoot"><span class="note">Τα γραμματικά λάθη μπαίνουν στο drill και ξαναέρχονται ώσπου να απαντηθούν σωστά 2 φορές στη σειρά.</span>' +
      '<span class="sp"></span>' +
      '<a class="btn" href="#/keimeno/' + esc(t.id) + '">Πίσω στο κείμενο</a>' +
      '<a class="btn key" href="#/grammatiki">' + toDrill + ' λάθη στο drill ↗</a></div>';
}
/* Υπογράμμιση της φράσης του βαθμολογητή πάνω στη ΔΙΚΗ ΤΟΥ μετάφραση.
   ⛔ Ό,τι δεν βρεθεί ΔΕΝ εξαφανίζεται σιωπηλά (σταθ. 10) — γυρίζει στο
   `orphan` και τυπώνεται ξεχωριστά. */
function markErrors(text, errs, orphan){
  if (!text) return '';
  var out = esc(text);
  errs.forEach(function(e){
    var q = String(e.quote || '').trim();
    if (!q){ orphan.push(e); return; }
    var qe = esc(q), at = out.indexOf(qe);
    if (at < 0){ orphan.push(e); return; }
    out = out.slice(0, at) + '<mark class="e ' + kindCls(e.type) + '">' + qe + '<sup>' + e.__i + '</sup></mark>' + out.slice(at + qe.length);
  });
  return out;
}

/* ══ ΤΟ ΠΟΛΥΤΟΝΙΚΟ ═════════════════════════════════════════════════
   ⭐ Διόρθωση 3 του brief: γράφει από το ΚΑΝΟΝΙΚΟ πληκτρολόγιο (ελληνικά)
   και τα κουμπιά είναι ΒΟΗΘΕΙΑ. Λογική: γράφω γράμμα → πατάω διακριτικό →
   μπαίνει στο ΤΕΛΕΥΤΑΙΟ ΦΩΝΗΕΝ πριν από τον κέρσορα.
   ⚠️ Η ΣΕΙΡΑ ΤΩΝ ΣΗΜΑΔΙΩΝ ΕΙΝΑΙ ΦΕΡΟΥΣΑ, ΚΑΙ ΔΕΝ ΤΗ ΣΩΖΕΙ ΤΟ NFC:
   πνεύμα/διαλυτικά και τόνος έχουν ΤΗΝ ΙΔΙΑ combining class (230), άρα η
   κανονικοποίηση ΔΕΝ τα αναδιατάσσει — «α + οξεία + ψιλή» δεν συντίθεται
   ποτέ σε ἄ. Γι' αυτό ξαναχτίζουμε πάντα με τη σειρά:
   βάση + (διαλυτικά | πνεύμα) + τόνος + υπογεγραμμένη, και μετά NFC. */
var M = { psili:'̓', dasia:'̔', oxeia:'́', varia:'̀', perisp:'͂', ypo:'ͅ', dial:'̈' };
var BREATH = [M.psili, M.dasia], ACC = [M.oxeia, M.varia, M.perisp];
var VOWELS = 'αεηιουωΑΕΗΙΟΥΩ';
function nfd(s){ try { return String(s).normalize('NFD'); } catch(e){ return String(s); } }
function isMark(ch){ return [M.psili,M.dasia,M.oxeia,M.varia,M.perisp,M.ypo,M.dial].indexOf(ch) >= 0; }

/* Δέχεται το κείμενο ΠΡΙΝ τον κέρσορα και το σημάδι· γυρίζει το νέο
   κείμενο πριν τον κέρσορα (ή null όταν δεν υπάρχει φωνήεν να πάρει το
   σημάδι — τότε η σελίδα ΤΟ ΛΕΕΙ, δεν σωπαίνει: σταθ. 65). */
function applyMark(before, mark){
  var s = nfd(before), i = s.length - 1;
  while (i >= 0 && isMark(s[i])) i--;
  if (i < 0) return null;
  var base = s[i];
  var isRho = (base === 'ρ' || base === 'Ρ');
  if (VOWELS.indexOf(base) < 0 && !(isRho && BREATH.indexOf(mark) >= 0)) return null;
  var marks = s.slice(i + 1).split('').filter(isMark);
  var breath = marks.filter(function(m){ return BREATH.indexOf(m) >= 0; })[0] || '';
  var acc = marks.filter(function(m){ return ACC.indexOf(m) >= 0; })[0] || '';
  var ypo = marks.indexOf(M.ypo) >= 0 ? M.ypo : '';
  var dial = marks.indexOf(M.dial) >= 0 ? M.dial : '';
  if (BREATH.indexOf(mark) >= 0){ breath = (breath === mark) ? '' : mark; if (breath) dial = ''; }
  else if (ACC.indexOf(mark) >= 0){ acc = (acc === mark) ? '' : mark; }
  else if (mark === M.ypo){ ypo = ypo ? '' : M.ypo; }
  else if (mark === M.dial){ dial = dial ? '' : M.dial; if (dial) breath = ''; }
  var built = base + (dial || breath) + acc + ypo;
  return nfc(s.slice(0, i) + built);
}
function markInput(inp, mark){
  var pos = inp.selectionStart == null ? inp.value.length : inp.selectionStart;
  var before = inp.value.slice(0, pos), after = inp.value.slice(pos);
  var next = applyMark(before, mark);
  if (next == null){ A.toast('Το σημάδι μπαίνει σε φωνήεν — γράψε πρώτα το γράμμα.'); inp.focus(); return; }
  inp.value = next + after;
  var np = next.length;
  inp.focus(); try { inp.setSelectionRange(np, np); } catch(e){}
}
var DIA = [
  { m:M.psili, ch:'ἀ', lb:'Ψιλή',    code:'Digit1' },
  { m:M.dasia, ch:'ἁ', lb:'Δασεία',  code:'Digit2' },
  { m:M.oxeia, ch:'ά', lb:'Οξεία',   code:'Digit3' },
  { m:M.varia, ch:'ὰ', lb:'Βαρεία',  code:'Digit4' },
  { m:M.perisp,ch:'ᾶ', lb:'Περισπ.', code:'Digit5' },
  { m:M.ypo,   ch:'ᾳ', lb:'Υπογεγρ.',code:'Digit6' },
  { m:M.dial,  ch:'ϊ', lb:'Διαλυτικά',code:'Digit7' }
];
var LETTERS = ['ςερτυθιοπ','ασδφγηξκλ','ζχψωβνμ'];
function keyboardHTML(){
  var top = DIA.map(function(d, i){
    return '<button class="key dia" type="button" data-m="' + i + '" title="' + esc(d.lb) + ' · ⌥' + d.code.slice(5) + '"><b>' + d.ch + '</b><i>' + esc(d.lb) + ' ⌥' + d.code.slice(5) + '</i></button>';
  }).join('');
  var rows = LETTERS.map(function(r){
    return '<div class="krow">' + r.split('').map(function(c){
      return '<button class="key" type="button" data-c="' + c + '">' + c + '</button>'; }).join('') + '</div>';
  }).join('');
  return '<div class="kbd" id="kbd"><div class="krow">' + top + '</div>' + rows +
    '<div class="krow"><button class="key" type="button" data-bs="1" aria-label="Σβήσιμο">⌫</button>' +
    '<button class="key wide" type="button" data-c=" ">κενό</button>' +
    '<button class="key go" type="button" data-go="1">Έλεγχος</button></div></div>';
}
function wireKeyboard(inp, onCheck){
  var kbd = el('kbd'); if (!kbd) return;
  kbd.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-m')){ markInput(inp, DIA[+b.getAttribute('data-m')].m); return; }
    if (b.hasAttribute('data-go')){ onCheck(); return; }
    var pos = inp.selectionStart == null ? inp.value.length : inp.selectionStart;
    if (b.hasAttribute('data-bs')){
      if (pos > 0){ inp.value = inp.value.slice(0, pos - 1) + inp.value.slice(pos); pos--; }
    } else {
      var c = b.getAttribute('data-c');
      inp.value = inp.value.slice(0, pos) + c + inp.value.slice(pos); pos += c.length;
    }
    inp.focus(); try { inp.setSelectionRange(pos, pos); } catch(e2){}
  });
  inp.addEventListener('keydown', function(e){
    if (e.altKey && !e.ctrlKey && !e.metaKey){
      var d = DIA.filter(function(x){ return x.code === e.code; })[0];
      if (d){ e.preventDefault(); markInput(inp, d.m); return; }
    }
    if (e.key === 'Enter'){ e.preventDefault(); onCheck(); }
  });
}
A.keyboardHTML = keyboardHTML; A.wireKeyboard = wireKeyboard; A.applyMark = applyMark;

/* ══ ΓΡΑΜΜΑΤΙΚΗ · DRILL ════════════════════════════════════════════ */
mk('grammatiki');
A.SCREENS.grammatiki = { label:'Γραμματική', build: buildGram };
var G = { id:'', answered:false };

function buildGram(){
  var sec = el('scr-grammatiki'), t = A.activeText();
  if (!t){ sec.innerHTML = backHTML() + '<div class="empty" style="margin-top:30px"><b>Χωρίς κείμενο</b>Το drill γεννιέται από το κείμενο που δουλεύεις.</div>'; return; }
  var items = A.gramItems(t);
  if (!items.length){ sec.innerHTML = backHTML() + '<div class="empty" style="margin-top:30px"><b>Καμία άσκηση</b>Αυτό το κείμενο δεν έχει <span class="num">grammar_drill</span>.</div>'; return; }
  var q = A.gramQueue(t);
  var it = q.filter(function(x){ return x.id === G.id; })[0] || q[0];
  G.id = it.id; G.answered = false;
  var d = A.day(), rep = A.gramRepeat(t);

  sec.innerHTML = backHTML() +
    '<div class="drill"><div>' +
      '<div class="eyebrow" style="padding-top:22px;margin-bottom:0">Τύπος · ' + (q.map(function(x){ return x.id; }).indexOf(it.id) + 1) + ' από ' + q.length + '</div>' +
      '<div class="dform">' + esc(it.form) + '</div>' +
      '<div class="dask">' + esc(it.prompt) + '</div>' +
      '<input class="dinput" id="gIn" type="text" placeholder="γράψε τον τύπο…" autocomplete="off" autocapitalize="off" spellcheck="false">' +
      '<div class="dhint">Γράφεις κανονικά από το ελληνικό πληκτρολόγιο. Πρώτα το γράμμα, μετά το σημάδι: <kbd>⌥1</kbd>–<kbd>⌥7</kbd> ή τα κουμπιά · <kbd>Enter</kbd> για έλεγχο</div>' +
      keyboardHTML() +
      '<div id="gOut" style="margin-top:22px"></div>' +
    '</div>' +
    '<aside class="side">' +
      '<div class="eyebrow" style="padding-top:22px;margin-bottom:12px">Λάθη σε επανάληψη</div>' +
      '<div style="display:flex;align-items:flex-end;gap:16px"><span class="bignum">' + rep + '</span>' +
      '<span style="font-family:var(--body);font-size:13.5px;color:var(--dim);padding-bottom:12px">φεύγουν με<br>2 σωστές στη σειρά</span></div>' +
      '<div class="mini2"><div><b class="num">' + (d.gramOut || 0) + '</b><span>Βγήκαν σήμερα</span></div>' +
        '<div><b class="num">' + (d.gram || 0) + '</b><span>Απαντήσεις</span></div></div>' +
      '<div class="eyebrow" style="margin-bottom:6px">Σειρά</div>' +
      q.slice(0, 9).map(function(x){
        var r = S().gram[t.id + '|' + x.id] || {};
        var on = Math.max(0, Math.min(2, r.streak || 0));
        return '<div class="qrow' + (x.id === it.id ? ' now' : '') + '"><div><span class="f">' + esc(x.form) + '</span>' +
          '<span class="p">' + esc(x.prompt) + '</span></div>' +
          '<span class="pr"><i class="' + (on > 0 ? 'on' : '') + '"></i><i class="' + (on > 1 ? 'on' : '') + '"></i></span></div>';
      }).join('') +
    '</aside></div>';

  var inp = el('gIn');
  wireKeyboard(inp, check);
  inp.focus();

  function check(){
    if (G.answered){ next(); return; }
    var said = nfc((inp.value || '').trim());
    if (!said){ A.toast('Γράψε τον τύπο — ή πάτα τα γράμματα από κάτω.'); inp.focus(); return; }
    var ok = (it.accept || []).some(function(a){ return nfc(a) === said; });
    A.gradeGram(t, it, ok);
    if (ok){
      var r = S().gram[t.id + '|' + it.id];
      if (r.wrong > 0 && r.streak === 2){ A.day().gramOut = (A.day().gramOut || 0) + 1; A.save(); }
    }
    G.answered = true;
    inp.disabled = true;
    inp.style.color = ok ? 'var(--ivory)' : 'var(--faint)';
    inp.style.textDecoration = ok ? 'none' : 'line-through';
    el('gOut').innerHTML =
      '<div class="verdict" style="font-size:14px"><span class="mark">' + (ok ? '✓' : '✕') + '</span><div>' +
      (ok ? 'Σωστό' + ((it.accept || []).length > 1 ? ' · δεκτό και <b>' + esc((it.accept || []).filter(function(a){ return nfc(a) !== said; }).join(' / ')) + '</b>' : '')
          : '<b style="color:var(--acc)">Σωστό:</b> <b>' + esc((it.accept || []).join(' / ')) + '</b>') +
      (it.explain ? '<br>' + esc(it.explain) : '') +
      (ok ? '' : '<br><span style="color:var(--faint)">Ξαναέρχεται· φεύγει με 2 σωστές στη σειρά.</span>') +
      '</div><button class="btn key sm" id="gNextB" type="button" style="margin-left:auto;align-self:center">Επόμενο →</button></div>';
    el('gNextB').addEventListener('click', next);
    el('gNextB').focus();
  }
  function next(){
    var q2 = A.gramQueue(t);
    var nx = q2.filter(function(x){ return x.id !== it.id; })[0] || q2[0];
    G.id = nx ? nx.id : ''; buildGram();
  }
}

/* ══ ΣΥΝΤΑΚΤΙΚΟ ════════════════════════════════════════════════════ */
mk('syntaktiko');
A.SCREENS.syntaktiko = { label:'Συντακτικό', build: buildSyn };
var SY = { word:'', clause:'' };

function buildSyn(){
  var sec = el('scr-syntaktiko'), t = A.activeText();
  if (!t){ sec.innerHTML = backHTML() + '<div class="empty" style="margin-top:30px"><b>Χωρίς κείμενο</b></div>'; return; }
  var sx = t.syntax || {}, wi = sx.word_items || [], ci = sx.clause_items || [], tr = sx.transformations || [];
  var done = wi.filter(function(x){ var r = S().syn[t.id + '|' + x.id]; return r && r.ok; }).length;
  if (!wi.length && !ci.length && !tr.length){
    sec.innerHTML = backHTML() + '<div class="empty" style="margin-top:30px"><b>Καμία άσκηση συντακτικού</b>Θα έρθουν με το JSON του κειμένου.</div>'; return;
  }
  var w = wi.filter(function(x){ return x.id === SY.word; })[0] ||
          wi.filter(function(x){ var r = S().syn[t.id + '|' + x.id]; return !r || !r.ok; })[0] || wi[0];
  var c = ci.filter(function(x){ return x.id === SY.clause; })[0] || ci[0];

  sec.innerHTML = backHTML() +
    '<header class="scrhd"><h2>Συντακτικό</h2>' +
      '<div class="meta"><b class="num" style="font-size:34px">' + done + '<span style="color:var(--faint)">/' + wi.length + '</span></b>' +
      '<div class="mono" style="margin-top:7px">Λέξεις · ' + (w ? 'περίοδος ' + String(w.period).padStart(2,'0') : '—') + '</div></div></header>' +
    '<div class="synwrap">' +
      '<div class="panel" id="pW"></div>' +
      '<div class="panel" id="pC"></div>' +
    '</div>' +
    '<div class="panel" style="margin-top:20px" id="pT"></div>';

  renderWord(t, w, wi);
  renderClause(t, c, ci);
  renderTrans(t, tr);
}

function renderWord(t, w, wi){
  var box = el('pW');
  if (!w){ box.innerHTML = '<div class="lb"><span>Κλικ σε λέξη → συντακτική θέση</span></div><div class="empty">Καμία λέξη σε αυτό το κείμενο.</div>'; return; }
  var per = t.periods.filter(function(p){ return p.n === w.period; })[0] || t.periods[0];
  var tk = A.tokens(per.text);
  var ids = {};
  wi.forEach(function(x){ if (x.period === per.n) ids[A.bare(x.form) + '|' + (x.occ || 1)] = x.id; });
  var sent = tk.map(function(x){
    var k = x.bare + '|' + x.occ, id = ids[k];
    if (!id) return '<w class="plain">' + esc(x.raw) + '</w>';
    return '<w data-w="' + esc(id) + '" class="' + (id === w.id ? 'pick' : '') + '">' + esc(x.raw) + '</w>';
  }).join(' ');
  var r = A.synRec(t.id, w.id);
  var opts = pickOptions(t, w, 10);
  box.innerHTML = '<div class="lb"><span>Κλικ σε λέξη → συντακτική θέση</span><span class="r">Περίοδος ' + String(per.n).padStart(2,'0') + '</span></div>' +
    '<div class="sent">' + sent + '</div>' +
    '<div class="pickhd"><b>' + esc(w.form) + '</b><span>— συντακτική θέση;</span>' +
      '<span class="r">' + (r.ok ? 'απαντημένη' : (r.tries ? r.tries + ' προσπάθειες' : 'χωρίς απάντηση')) + '</span></div>' +
    '<div class="opts two" id="wOpts" style="margin-top:16px;display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))">' +
      opts.map(function(o){ return '<button class="opt" type="button" data-o="' + esc(o) + '">' + esc(o) + '</button>'; }).join('') +
    '</div><div id="wOut"></div>';
  box.addEventListener('click', function(e){
    var ww = e.target.closest('[data-w]');
    if (ww){ SY.word = ww.getAttribute('data-w'); buildSyn(); return; }
    var b = e.target.closest('[data-o]');
    if (b && !b.disabled) answerWord(t, w, b.getAttribute('data-o'), wi);
  });
}
/* ⭐ σταθ. 27: οι επιλογές δεν επιτρέπεται να αποκλείονται χωρίς γνώση —
   ΟΛΕΣ βγαίνουν από το `role_options` του ίδιου κειμένου, και ΟΛΕΣ οι
   σωστές είναι μέσα (ρητή απαίτηση του brief). */
function pickOptions(t, w, n){
  var all = (t.syntax.role_options || []).slice();
  var acc = (w.accept || []);
  var rest = all.filter(function(o){ return acc.indexOf(o) < 0; });
  A.shuffle(rest);
  return A.shuffle(acc.concat(rest.slice(0, Math.max(0, n - acc.length))));
}
function answerWord(t, w, pick, wi){
  var ok = (w.accept || []).indexOf(pick) >= 0, r = A.synRec(t.id, w.id), d = A.day();
  r.tries = (r.tries || 0) + 1; if (ok) r.ok = 1;
  d.syn = (d.syn || 0) + 1;
  if (!ok){ d.synWrong = (d.synWrong || 0) + 1;
    (S().days[A.today()].list = S().days[A.today()].list || []).push({ k:'Σ', form:w.form, right:(w.accept||[]).join(' / ') }); }
  A.save();
  Array.prototype.forEach.call(el('wOpts').querySelectorAll('.opt'), function(b){
    b.disabled = true; var v = b.getAttribute('data-o');
    if ((w.accept || []).indexOf(v) >= 0) b.classList.add('right');
    else if (v === pick) b.classList.add('wrongpick');
  });
  /* Μετά την απάντηση φαίνεται ΠΑΝΤΑ το πλήρες `answer` (brief). */
  el('wOut').innerHTML = '<div class="modelbox"><span class="lb3">Η πλήρης απάντηση</span>' + esc(w.answer) + '</div>' +
    '<div style="display:flex;margin-top:14px"><button class="btn sm key" id="wNext" type="button" style="margin-left:auto">Επόμενη λέξη →</button></div>';
  el('wNext').addEventListener('click', function(){
    var open = wi.filter(function(x){ var rr = S().syn[t.id + '|' + x.id]; return (!rr || !rr.ok); });
    SY.word = (open[0] && open[0].id) || wi[(wi.map(function(x){ return x.id; }).indexOf(w.id) + 1) % wi.length].id;
    buildSyn();
  });
}

function renderClause(t, c, ci){
  var box = el('pC');
  if (!c){ box.innerHTML = '<div class="lb"><span>Δευτερεύουσα πρόταση</span></div><div class="empty">Καμία δευτερεύουσα σε αυτό το κείμενο.</div>'; return; }
  var per = t.periods.filter(function(p){ return p.n === c.period; })[0] || t.periods[0];
  var body = esc(per.text), q = esc(c.clause), at = body.indexOf(q);
  var sent = at >= 0 ? (body.slice(0, at) + '<span class="cl">' + q + '</span>' + body.slice(at + q.length))
                     : body + ' <span style="color:var(--acc)">— η πρόταση «' + q + '» δεν βρέθηκε αυτολεξεί εδώ</span>';
  var names = Object.keys(c.fields || {});
  var r = A.synRec(t.id, c.id);
  var pick = ci.length > 1
    ? '<span class="r">' + ci.map(function(x, i){ return '<button class="btn sm" type="button" data-c="' + esc(x.id) + '" style="margin-left:6px' + (x.id === c.id ? ';color:var(--acc);border-color:rgba(232,130,92,.45)' : '') + '">' + (i + 1) + '</button>'; }).join('') + '</span>'
    : '';
  box.innerHTML = '<div class="lb"><span>Δευτερεύουσα πρόταση · περίοδος ' + String(per.n).padStart(2,'0') + '</span>' + pick + '</div>' +
    '<div class="sent">' + sent + '</div>' +
    '<div class="fields">' + names.map(function(nm){
      var f = c.fields[nm];
      return '<div class="fld"><span class="lb2">' + esc(nm) + '</span>' +
        '<select class="sel" data-f="' + esc(nm) + '"><option value="">—</option>' +
        (f.options || []).map(function(o){ return '<option value="' + esc(o) + '">' + esc(o) + '</option>'; }).join('') +
        '</select></div>';
    }).join('') + '</div>' +
    '<div style="display:flex;align-items:center;gap:14px;margin-top:16px">' +
      '<span class="mono" id="cCnt">0 / ' + names.length + ' συμπληρωμένα</span>' +
      '<button class="btn key sm" id="cGo" type="button" style="margin-left:auto">Έλεγχος</button></div>' +
    '<div id="cOut"></div>';
  box.addEventListener('change', function(){ countC(names.length); });
  box.addEventListener('click', function(e){
    var p = e.target.closest('[data-c]');
    if (p){ SY.clause = p.getAttribute('data-c'); buildSyn(); return; }
    if (e.target.id === 'cGo') checkClause(t, c, names);
  });
  countC(names.length);
}
function countC(total){
  var sels = el('pC').querySelectorAll('[data-f]'), n = 0;
  Array.prototype.forEach.call(sels, function(s){ if (s.value) n++; });
  var c = el('cCnt'); if (c) c.textContent = n + ' / ' + total + ' συμπληρωμένα';
}
function checkClause(t, c, names){
  var sels = el('pC').querySelectorAll('[data-f]'), miss = [], wrong = 0;
  Array.prototype.forEach.call(sels, function(s){
    var nm = s.getAttribute('data-f'), f = c.fields[nm];
    if (!s.value){ miss.push(nm); return; }
    var ok = (f.accept || []).indexOf(s.value) >= 0;
    s.classList.remove('right','wrong'); s.classList.add(ok ? 'right' : 'wrong');
    if (!ok) wrong++;
  });
  if (miss.length){
    /* σταθ. 65: λέει ΤΙ λείπει, δεν σωπαίνει. */
    el('cOut').innerHTML = '<div class="hint" style="margin-top:14px">Λείπ' + (miss.length === 1 ? 'ει' : 'ουν') + ': <b>' + esc(miss.join(' · ')) + '</b></div>';
    var first = el('pC').querySelector('[data-f="' + miss[0] + '"]'); if (first) first.focus();
    return;
  }
  var r = A.synRec(t.id, c.id), d = A.day();
  r.tries = (r.tries || 0) + 1; if (!wrong) r.ok = 1;
  d.syn = (d.syn || 0) + 1; if (wrong) d.synWrong = (d.synWrong || 0) + wrong;
  A.save();
  el('cOut').innerHTML = '<div class="modelbox"><span class="lb3">Πρότυπη απάντηση · όπως γράφεται στις εξετάσεις</span>' + esc(c.model) + '</div>' +
    '<div class="mono" style="margin-top:12px">' + (wrong ? wrong + ' από ' + names.length + ' λάθος' : 'και τα ' + names.length + ' σωστά') + '</div>';
}

function renderTrans(t, tr){
  var box = el('pT');
  if (!tr.length){ box.innerHTML = '<div class="lb"><span>Μετατροπές</span></div><div class="empty">Καμία μετατροπή σε αυτό το κείμενο.</div>'; return; }
  box.innerHTML = '<div class="lb"><span>Μετατροπές · ελεύθερο κείμενο</span><span class="r">' + tr.length + ' ασκήσεις</span></div>' +
    '<div class="trf">' + tr.map(function(x){
      return '<div><div class="t">' + esc(x.type) + '</div>' +
        '<div class="s">' + esc(x.source) + '</div>' +
        '<div style="font-family:var(--body);font-size:13px;color:var(--dim);margin-top:8px">' + esc(x.prompt) + '</div>' +
        '<textarea placeholder="Γράψε τη μετατροπή…" data-t="' + esc(x.id) + '"></textarea>' +
        '<div class="row"><button class="btn sm" type="button" data-sol="' + esc(x.id) + '">Δείξε λύση</button></div>' +
        '<div id="sol-' + esc(x.id) + '"></div></div>';
    }).join('') + '</div>' +
    '<div class="mono" style="margin-top:16px">Δεν ελέγχεται αυτόματα — η μετατροπή έχει πολλές σωστές μορφές</div>';
  box.addEventListener('click', function(e){
    var b = e.target.closest('[data-sol]'); if (!b) return;
    var id = b.getAttribute('data-sol'), x = tr.filter(function(y){ return y.id === id; })[0];
    el('sol-' + id).innerHTML = '<div class="modelbox" style="margin-top:12px"><span class="lb3">Πρότυπη</span>' +
      '<span class="anc" style="font-size:18px;color:var(--ivory)">' + esc(x.model) + '</span>' +
      (x.accept_notes ? '<div style="margin-top:8px;color:var(--dim)">' + esc(x.accept_notes) + '</div>' : '') + '</div>';
    b.disabled = true; b.textContent = 'λύση ορατή';
  });
}

})();
</script>

<style>
/* ══ ΟΘΟΝΗ · ΛΕΞΙΛΟΓΙΟ ═════════════════════════════════════════════ */
.vwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:48px;align-items:start;margin-top:24px}

.pwrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:44px;align-items:start;margin-top:24px}

.xwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:44px;align-items:start;margin-top:24px}

  .vrow .l{min-width:110px}
}

<script>
/* ══════════════════════════════════════════════════════════════════════
   ΜΕΡΟΣ 4 — ΛΕΞΙΛΟΓΙΟ · ΠΙΝΑΚΑΚΙΑ · ΑΡΧΙΚΟΙ ΧΡΟΝΟΙ · #ΤΕΛΟΣ
   ══════════════════════════════════════════════════════════════════════ */
(function(){
'use strict';
var A = window.AGN, esc = A.esc, el = A.el;
function S(){ return A.S(); }
function mk(name){
  var sec = document.createElement('section');
  sec.className = 'scr wrap'; sec.id = 'scr-' + name; sec.hidden = true;
  document.getElementById('screens').appendChild(sec); return sec;
}
function backHTML(){ return '<a class="back" href="#/">← Άγνωστο</a>'; }

/* ══ ΛΕΞΙΛΟΓΙΟ ════════════════════════════════════════════════════ */
mk('lexilogio');
A.SCREENS.lexilogio = { label:'Λεξιλόγιο', build: buildVocab };
var V = { i:0, shown:false };

function buildVocab(){
  var sec = el('scr-lexilogio'), t = A.activeText();
  var all = A.vocabAll(t);
  if (!all.length){
    sec.innerHTML = backHTML() + '<header class="scrhd"><h2>Λεξιλόγιο</h2></header>' +
      '<div class="empty" style="margin-top:26px"><b>Καμία κάρτα ακόμη</b>Οι κάρτες έρχονται από το <span class="num">vocabulary</span> του κειμένου και από το «+ Στις κάρτες» μέσα στο κείμενο.</div>';
    return;
  }
  var now = Date.now();
  var due = all.filter(function(c){ var r = S().vocab[c.tid + '|' + c.lemma]; return !r || !r.due || r.due <= now; });
  /* Όσα «δεν ήξερα» έρχονται ΠΡΩΤΑ — η μόνη προτεραιότητα της μηχανής. */
  due.sort(function(a, b){
    var ra = S().vocab[a.tid + '|' + a.lemma] || {}, rb = S().vocab[b.tid + '|' + b.lemma] || {};
    return (rb.miss || 0) - (ra.miss || 0);
  });
  var queue = due.length ? due : all;
  if (V.i >= queue.length) V.i = 0;
  var c = queue[V.i], r = A.vRec(c);

  sec.innerHTML = backHTML() +
    '<header class="scrhd"><h2>Λεξιλόγιο</h2>' +
      '<div class="meta"><b class="num" style="font-size:34px">' + due.length + '<span style="color:var(--faint)">/' + all.length + '</span></b>' +
      '<div class="mono" style="margin-top:7px">Κάρτες για σήμερα</div></div></header>' +
    '<div class="vwrap"><div class="vcard" id="vC"></div>' +
    '<aside class="side"><div class="mono">Όλες οι κάρτες</div><div class="vlist">' +
      all.map(function(x){
        var rr = S().vocab[x.tid + '|' + x.lemma] || {};
        var lb = rr.miss ? 'δεν την ήξερα' : (rr.box ? 'κουτί ' + rr.box : 'νέα');
        return '<div class="vrow"><span class="l">' + esc(x.lemma) + '</span>' +
          '<span class="m">' + esc(x.meaning) + '</span>' +
          '<span class="b' + (rr.miss ? ' hot' : '') + '">' + esc(lb) + '</span>' +
          (x.own ? '<button class="rm" type="button" data-rm="' + esc(x.lemma) + '" aria-label="Βγάλ’ τη από τις κάρτες">×</button>' : '') +
          '</div>';
      }).join('') + '</div></aside></div>';

  el('scr-lexilogio').addEventListener('click', function(e){
    var rm = e.target.closest('[data-rm]');
    if (rm) removeCard(rm.getAttribute('data-rm'));
  });
  paintCard(c, queue);
}
function paintCard(c, queue){
  var box = el('vC'); if (!box) return;
  var r = A.vRec(c);
  box.innerHTML =
    '<div class="mono">' + (r.miss ? 'ξανά — δεν την ήξερες' : (r.seen ? 'επανάληψη · κουτί ' + (r.box || 0) : 'νέα λέξη')) + '</div>' +
    '<div class="lemma" style="margin-top:14px">' + esc(c.lemma) + '</div>' +
    (V.shown ? '' : '<div class="mean" style="color:var(--dim)">Θυμήσου τη σημασία, μετά έλεγξε.</div>') +
    (V.shown
      ? '<div class="mean">' + esc(c.meaning) + '</div>' +
        (c.polysemous && c.senses.length
          ? '<div class="mono" style="margin-top:20px">Πολύσημη</div><div class="senses">' +
            c.senses.map(function(s){ return '<div>' + esc(s) + '</div>'; }).join('') + '</div>'
          : '') +
        (c.note ? '<div class="note">' + esc(c.note) + '</div>' : '') +
        '<div class="acts"><button class="btn" id="vNo" type="button">Δεν την ήξερα</button>' +
        '<button class="btn key" id="vYes" type="button">Την ήξερα</button></div>'
      : '<div class="acts"><button class="btn key" id="vShow" type="button">Δείξε τη σημασία</button></div>');
  if (!V.shown){
    el('vShow').addEventListener('click', function(){ V.shown = true; paintCard(c, queue); });
    return;
  }
  el('vYes').addEventListener('click', function(){ answer(true); });
  el('vNo').addEventListener('click', function(){ answer(false); });
  function answer(ok){
    A.gradeVocab(c, ok);
    var d = A.day(); d.vocab = (d.vocab || 0) + 1;
    if (!ok){ d.vocabMiss = (d.vocabMiss || 0) + 1;
      (S().days[A.today()].list = S().days[A.today()].list || []).push({ k:'Λ', form:c.lemma, right:c.meaning }); }
    A.save();
    V.shown = false; V.i++;
    buildVocab(); A.renderStats();
  }
}
function removeCard(lemma){
  var s = S(), i = s.cards.map(function(c){ return c.lemma; }).indexOf(lemma);
  if (i < 0) return;
  /* ⛔ σταθ. 11: η διαγραφή περνάει από το ΚΑΝΟΝΙΚΟ save της σελίδας, ώστε
     το sync.js να δει τη διαφορά και να αφήσει ταφόπλακα. */
  s.cards.splice(i, 1);
  A.save();
  A.toast('«' + lemma + '» έφυγε από τις κάρτες.');
  buildVocab();
}

/* ══ ΠΙΝΑΚΑΚΙΑ ════════════════════════════════════════════════════ */
mk('pinakakia');
A.SCREENS.pinakakia = { label:'Πινακάκια', build: buildTables };
var P = { id:'', mode:'read', shown:{}, checked:false };

function allTables(){
  var d = A.DATA.tables, out = [];
  if (!d || !d.groups) return out;
  d.groups.forEach(function(g){ (g.tables || []).forEach(function(tb){ out.push({ g:g, t:tb }); }); });
  return out;
}
function tState(id){ var r = S().tables[id]; return (r && r.state) || 'new'; }
function setState(id, st){
  if (!S().tables[id]) S().tables[id] = { state:'new' };
  S().tables[id].state = st; A.save();
}
function buildTables(){
  var sec = el('scr-pinakakia'), d = A.DATA.tables, list = allTables();
  if (d && d._err){
    sec.innerHTML = backHTML() + '<header class="scrhd"><h2>Πινακάκια</h2></header>' +
      '<div class="fail" style="margin-top:26px"><b>Δεν μπόρεσα να διαβάσω τα πινακάκια</b>' + esc(d._err) + '</div>';
    return;
  }
  if (!list.length){
    sec.innerHTML = backHTML() + '<header class="scrhd"><h2>Πινακάκια</h2>' +
      '<div class="meta"><div class="mono">Γραμματική · Συντακτικό</div></div></header>' +
      '<div class="empty" style="margin-top:26px"><b>Κανένας πίνακας ακόμη</b>' +
      esc((d && d.note) || '') + '<br><br>Κάθε πίνακας μπαίνει αυτολεξεί από το βιβλίο σου στο ' +
      '<span class="num">data/pinakakia.json</span>. Μόλις μπει, εδώ ανοίγουν τα τρία περάσματα: ' +
      'διάβασμα, κρυμμένα κελιά, τεστ συμπλήρωσης — και οι τρεις καταστάσεις: νέο, θέλει επανάληψη, μαθημένο.</div>';
    return;
  }
  var cur = list.filter(function(x){ return x.t.id === P.id; })[0] || list[0];
  P.id = cur.t.id;
  var groups = {}; list.forEach(function(x){ (groups[x.g.title] = groups[x.g.title] || []).push(x.t); });
  var nav = Object.keys(groups).map(function(gt){
    return '<div class="grp">' + esc(gt) + '</div>' + groups[gt].map(function(tb){
      var st = tState(tb.id);
      return '<a href="#" data-tb="' + esc(tb.id) + '" class="' + (tb.id === P.id ? 'on' : '') + '">' + esc(tb.title) +
        '<span class="stdot ' + (st === 'new' ? '' : st) + '"></span></a>';
    }).join('');
  }).join('');

  sec.innerHTML = backHTML() +
    '<div class="pwrap"><aside class="pnav">' +
      '<h2 class="grtitle" style="font-size:34px;padding-top:18px">Πινακάκια</h2>' + nav +
      '<div class="legend"><span><i class="l"></i>μαθημένο</span><span><i class="r"></i>θέλει επανάληψη</span><span><i></i>νέο</span></div>' +
    '</aside><div>' +
      '<div class="eyebrow" style="padding-top:18px;margin-bottom:6px">' + esc(cur.g.title) + ' · ' + esc(cur.t.book_page || '') + '</div>' +
      '<div style="display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap">' +
        '<h3 class="grtitle" style="font-size:44px">' + esc(cur.t.title) + '</h3>' +
        '<div style="margin-left:auto;display:flex;gap:10px">' +
          '<button class="btn sm' + (tState(P.id) === 'learned' ? ' key' : '') + '" data-st="learned" type="button">Μαθημένο</button>' +
          '<button class="btn sm' + (tState(P.id) === 'review' ? ' key' : '') + '" data-st="review" type="button">Θέλει επανάληψη</button>' +
        '</div></div>' +
      '<div class="modes">' +
        '<button type="button" data-mode="read" aria-pressed="' + (P.mode === 'read') + '">Διάβασμα</button>' +
        '<button type="button" data-mode="hide" aria-pressed="' + (P.mode === 'hide') + '">Κρυμμένα κελιά</button>' +
        '<button type="button" data-mode="test" aria-pressed="' + (P.mode === 'test') + '">Τεστ συμπλήρωσης</button>' +
      '</div>' +
      '<div id="tbl"></div></div></div>';

  el('scr-pinakakia').addEventListener('click', function(e){
    var a = e.target.closest('[data-tb]');
    if (a){ e.preventDefault(); P.id = a.getAttribute('data-tb'); P.shown = {}; P.checked = false; buildTables(); return; }
    var m = e.target.closest('[data-mode]');
    if (m){ P.mode = m.getAttribute('data-mode'); P.shown = {}; P.checked = false; buildTables(); return; }
    var s = e.target.closest('[data-st]');
    if (s){ var want = s.getAttribute('data-st'); setState(P.id, tState(P.id) === want ? 'new' : want); buildTables(); }
  });
  paintTable(cur.t);
}
function paintTable(tb){
  var cols = tb.columns || [], rows = tb.rows || [], total = 0, shown = 0;
  var head = '<tr><th></th>' + cols.map(function(c){ return '<th>' + esc(c) + '</th>'; }).join('') + '</tr>';
  var body = rows.map(function(r, ri){
    return '<tr><td class="lbl">' + esc(r.label) + '</td>' + (r.cells || []).map(function(cell, ci){
      total++;
      var k = ri + ':' + ci;
      if (P.mode === 'read') return '<td>' + esc(cell) + '</td>';
      if (P.mode === 'hide'){
        var open = !!P.shown[k]; if (open) shown++;
        return '<td><span class="cell' + (open ? '' : ' hid') + '" data-k="' + k + '">' + esc(open ? cell : cell) + '</span></td>';
      }
      return '<td><span class="cell"><input data-k="' + k + '" data-v="' + esc(cell) + '" autocomplete="off" spellcheck="false"></span></td>';
    }).join('') + '</tr>';
  }).join('');
  var dashes = '', i;
  for (i = 0; i < Math.min(total, 18); i++) dashes += '<i class="' + (i < shown ? 'on' : '') + '"></i>';
  el('tbl').innerHTML = '<table class="tbl">' + head + body + '</table>' +
    (P.mode === 'hide'
      ? '<div class="prog"><span class="dashes">' + dashes + '</span><span class="mono">' + shown + ' / ' + total + ' αποκαλυμμένα</span>' +
        '<button class="btn sm" id="tHideAll" type="button" style="margin-left:auto">Κρύψε ξανά</button></div>'
      : (P.mode === 'test'
        ? '<div class="prog"><span class="mono" id="tScore">' + total + ' κελιά</span>' +
          '<button class="btn sm key" id="tCheck" type="button" style="margin-left:auto">Έλεγχος</button></div>'
        : '<div class="prog"><span class="mono">Διάβασμα · ' + total + ' κελιά</span></div>'));

  var host = el('tbl');
  host.addEventListener('click', function(e){
    var c = e.target.closest('.cell.hid');
    if (c){ P.shown[c.getAttribute('data-k')] = 1; paintTable(tb); return; }
    if (e.target.id === 'tHideAll'){ P.shown = {}; paintTable(tb); return; }
    if (e.target.id === 'tCheck'){ checkTable(tb); }
  });
}
function checkTable(tb){
  var ins = el('tbl').querySelectorAll('input[data-v]'), ok = 0, n = 0;
  Array.prototype.forEach.call(ins, function(inp){
    n++;
    var want = A.nfc(inp.getAttribute('data-v') || '').trim();
    var said = A.nfc(inp.value || '').trim();
    inp.classList.remove('right','wrong');
    if (!said) return;
    if (said === want){ ok++; inp.classList.add('right'); }
    else { inp.classList.add('wrong'); inp.value = said + '  →  ' + want; }
  });
  el('tScore').textContent = ok + ' / ' + n + ' σωστά';
}

/* ══ ΑΡΧΙΚΟΙ ΧΡΟΝΟΙ ═══════════════════════════════════════════════ */
mk('xronoi');
A.SCREENS.xronoi = { label:'Αρχικοί χρόνοι', build: buildX };
var X = { pick:'', order:'book', q:'' };

function buildX(){
  var sec = el('scr-xronoi'), d = A.DATA.xronoi;
  if (d && d._err){
    sec.innerHTML = backHTML() + '<header class="scrhd"><h2>Αρχικοί χρόνοι</h2></header>' +
      '<div class="fail" style="margin-top:26px"><b>Δεν μπόρεσα να διαβάσω τα ρήματα</b>' + esc(d._err) + '</div>';
    return;
  }
  var verbs = (d && d.verbs) || [], cols = (d && d.columns) || [];
  if (!verbs.length){
    sec.innerHTML = backHTML() +
      '<header class="scrhd"><h2>Αρχικοί χρόνοι</h2>' +
      '<div class="meta"><b class="num" style="font-size:34px">0</b><div class="mono" style="margin-top:7px">Ρήματα</div></div></header>' +
      '<div class="empty" style="margin-top:26px"><b>0 ρήματα</b>' + esc((d && d.note) || '') +
      '<br><br>Οι στήλες, η σειρά και τα ρήματα θα έρθουν από το βιβλίο σου στο ' +
      '<span class="num">data/arxikoi-xronoi.json</span>. Τότε ο πίνακας γράφει <b style="display:inline">λευκό και έντονο</b> μόνο το κομμάτι που αλλάζει.</div>' +
      '<div class="empty" style="margin-top:14px"><b>Μέχρι τότε</b>Η ανάκληση των αρχικών χρόνων με τη φωνή ζει στα ' +
      '<a href="arxaia.html#ag" style="color:var(--acc)">Αρχαία · αρχικοί χρόνοι</a> — δεν σβήστηκε τίποτα.</div>';
    return;
  }
  var list = verbs.slice();
  if (X.order === 'family') list.sort(function(a, b){ return String(a.family || '').localeCompare(String(b.family || ''), 'el'); });
  else list.sort(function(a, b){ return (a.book_order || 0) - (b.book_order || 0); });
  var hit = X.q ? findForm(list, X.q) : null;
  var cur = list.filter(function(v){ return v.lemma === X.pick; })[0] || (hit && hit.verb) || list[0];
  var hard = list.filter(function(v){ var r = S().verbs[v.lemma]; return r && r.hard; });

  sec.innerHTML = backHTML() +
    '<div class="xwrap"><div>' +
      '<header class="scrhd" style="padding-top:18px"><h2>Αρχικοί χρόνοι</h2>' +
        '<div class="meta"><b class="num" style="font-size:34px">' + list.length + '</b>' +
        '<div class="mono" style="margin-top:7px">Ρήματα</div></div></header>' +
      '<div class="xtools">' +
        '<div class="modes" style="margin-top:0">' +
          '<button type="button" data-o="book" aria-pressed="' + (X.order === 'book') + '">Σειρά βιβλίου</button>' +
          '<button type="button" data-o="family" aria-pressed="' + (X.order === 'family') + '">Κατά οικογένεια</button>' +
        '</div>' +
        '<label class="xfind"><span class="lb">Τύπος →</span>' +
          '<input id="xq" value="' + esc(X.q) + '" placeholder="γράψε έναν τύπο" autocomplete="off" spellcheck="false">' +
          '<span class="hit">' + (X.q ? (hit ? esc(hit.verb.lemma) + ' · ' + esc(hit.col) : 'δεν βρέθηκε') : '') + '</span></label>' +
      '</div>' +
      (hard.length ? '<div class="mono" style="margin-top:18px">Τα δύσκολά μου · ' + hard.length + ' — ' +
        hard.map(function(v){ return '<a href="#" data-v="' + esc(v.lemma) + '" style="color:var(--acc)">' + esc(v.lemma) + '</a>'; }).join(' · ') + '</div>' : '') +
      '<table class="xtbl"><tr><th class="star"></th>' + cols.map(function(c){ return '<th>' + esc(c) + '</th>'; }).join('') +
        '<th>Σελ.</th></tr>' +
        list.map(function(v){
          var r = S().verbs[v.lemma] || {};
          return '<tr class="' + (v.lemma === cur.lemma ? 'pick' : '') + '" data-v="' + esc(v.lemma) + '">' +
            '<td class="star"><span class="st' + (r.hard ? ' on' : '') + '" data-hard="' + esc(v.lemma) + '">' + (r.hard ? '★' : '☆') + '</span></td>' +
            cols.map(function(c){ return '<td>' + formHTML((v.forms || {})[c]) + '</td>'; }).join('') +
            '<td class="mono" style="font-size:11px">' + esc(v.book_page || '[—]') + '</td></tr>';
        }).join('') +
      '</table>' +
      '<div class="mono" style="margin-top:16px">Έντονο = το κομμάτι που αλλάζει · οι στήλες είναι του βιβλίου σου</div>' +
    '</div><aside class="side" id="xCard"></aside></div>';

  el('xq').addEventListener('input', function(e){ X.q = e.target.value; X.pick = ''; buildX(); el('xq').focus(); });
  el('scr-xronoi').addEventListener('click', function(e){
    var h = e.target.closest('[data-hard]');
    if (h){
      var lm = h.getAttribute('data-hard');
      if (!S().verbs[lm]) S().verbs[lm] = { hard:false };
      S().verbs[lm].hard = !S().verbs[lm].hard; A.save(); buildX(); return;
    }
    var o = e.target.closest('[data-o]');
    if (o){ X.order = o.getAttribute('data-o'); buildX(); return; }
    var v = e.target.closest('[data-v]');
    if (v){ e.preventDefault(); X.pick = v.getAttribute('data-v'); buildX(); }
  });
  paintVerb(cur, cols);
}
/* Το `changed` του JSON είναι [αρχή, τέλος) σε NFC — ΤΟ ΚΟΜΜΑΤΙ ΠΟΥ
   ΑΛΛΑΖΕΙ γίνεται λευκό και έντονο, τα υπόλοιπα γκρι. */
function formHTML(f){
  if (!f) return '<span style="color:rgba(243,239,232,.22)">—</span>';
  var txt = A.nfc(f.text || ''), ch = f.changed;
  if (!ch || ch.length !== 2) return esc(txt);
  var a = Math.max(0, ch[0]), b = Math.min(txt.length, ch[1]);
  return esc(txt.slice(0, a)) + '<b>' + esc(txt.slice(a, b)) + '</b>' + esc(txt.slice(b));
}
function findForm(list, q){
  var needle = A.nfc(String(q).trim()); if (!needle) return null;
  for (var i = 0; i < list.length; i++){
    var f = list[i].forms || {};
    for (var c in f){ if (f[c] && A.nfc(f[c].text || '') === needle) return { verb:list[i], col:c }; }
  }
  return null;
}
function paintVerb(v, cols){
  var box = el('xCard'); if (!box || !v) return;
  var r = S().verbs[v.lemma] || {};
  box.innerHTML = '<div class="vcardx">' +
    '<div style="display:flex;align-items:center;gap:12px"><div class="mono">Κάρτα ρήματος</div>' +
    '<button class="btn sm' + (r.hard ? ' key' : '') + '" type="button" data-hard="' + esc(v.lemma) + '" style="margin-left:auto">' + (r.hard ? '★ δύσκολο' : 'σήμανε δύσκολο') + '</button></div>' +
    '<h3 style="margin-top:14px">' + esc(v.lemma) + '</h3>' +
    '<div class="mn">' + esc(v.meaning || '') + '</div>' +
    '<div style="margin-top:18px">' + cols.map(function(c){
      var f = (v.forms || {})[c];
      return '<div class="row"><span class="k">' + esc(c) + '</span><span class="v">' + formHTML(f) + '</span></div>';
    }).join('') + '</div>' +
    ((v.hooks || []).length
      ? '<div class="hooks"><div class="lb">Γάντζος από τα νέα · δικό μου, όχι του βιβλίου</div>' +
        v.hooks.map(function(h){ return '<div class="h"><b>' + esc(h.stem) + '</b><span>' + esc(h.modern) + '</span></div>'; }).join('') + '</div>'
      : '') +
    '</div>';
}

/* ══ «ΑΝΤΙΓΡΑΦΗ ΓΙΑ #ΤΕΛΟΣ» ═══════════════════════════════════════
   Μία σύνοψη της ΣΗΜΕΡΙΝΗΣ μελέτης, για να την κολλήσει στο Claude.
   ⛔ Ό,τι δεν έγινε σήμερα γράφεται «—», ποτέ 0 που μοιάζει με μέτρηση
   (σταθ. 33). */
A.endSummary = function(){
  var d = S().days[A.today()] || {}, out = [];
  out.push('#τέλος Αρχαία · Άγνωστο — ' + A.greekDate());
  var texts = A.DATA.texts.map(function(t){
    var done = A.doneCount(t); if (!done && !S().fixes[t.id]) return null;
    var fx = S().fixes[t.id];
    return t.author + ' ' + (t.passage || '') + ': περίοδοι ' + done + '/' + t.periods.length + (fx ? ', βαθμός ' + fx.score + '/' + (t.translation_points || 20) : '');
  }).filter(Boolean);
  out.push('Κείμενα: ' + (texts.length ? texts.join(' · ') : '—'));

  var list = d.list || [];
  function lines(kind){
    var L = list.filter(function(x){ return x.k === kind; });
    return L.length ? L.map(function(x){ return x.form + ' → σωστό: ' + x.right; }).join(' · ') : '—';
  }
  out.push('Γραμματική: ' + (d.gram ? d.gram + ' απαντήσεις, ' + (d.gramWrong || 0) + ' λάθη' : '—') +
    (d.gramWrong ? ' · ' + lines('Γ') : ''));
  out.push('Συντακτικό: ' + (d.syn ? d.syn + ' απαντήσεις, ' + (d.synWrong || 0) + ' λάθη' : '—') +
    (d.synWrong ? ' · ' + lines('Σ') : ''));
  out.push('Λεξιλόγιο: ' + (d.vocab ? d.vocab + ' κάρτες, ' + (d.vocabMiss || 0) + ' δεν ήξερα' : '—') +
    (d.vocabMiss ? ' · ' + lines('Λ') : ''));
  return out.join('\n');
};

/* Μόλις έρθουν τα δεδομένα, η αρχική ξαναγράφεται με ΑΛΗΘΙΝΑ νούμερα. */
A.afterBoot = function(){ A.renderHome(); };

})();
