      /* ⭐ «ΤΕΛΕΙΩΣΕΣ» ΕΙΝΑΙ ΑΛΗΘΙΝΗ ΑΠΑΝΤΗΣΗ — αλλά ΜΟΝΟ όταν υπήρχε κάτι να
         τελειώσει. Σε μια σελίδα που δεν έχει δει ποτέ δεδομένα είναι απλώς
         ψέμα, και ο στόχος δεν ήταν ποτέ ο μέγιστος χρόνος μελέτης· ήταν να
         λέει την αλήθεια για το πού βρίσκεται. */
      var head, meta;
      if (!anyStarted && !taskList().length){
        head = 'Άδειο, όχι τελειωμένο.';
        meta = 'Δεν έχεις ξεκινήσει καμία σελίδα μελέτης και δεν έχεις γράψει καμία εργασία. Κάνε μία ανάκληση, ή γράψε μία γραμμή πιο κάτω — από την επόμενη φορά ξέρω τι ξεχνάς.';
      } else {
        head = 'Τελείωσες.';
        meta = 'Κανένα χρέος, καμία προθεσμία.' + (next ? (' Το επόμενο ξυπνάει ' + fmtDue(dkOf(new Date(next))) + '.') : '');
      }
      host.innerHTML =
        '<div class="hw-kicker">Μία απόφαση</div>' +
        '<div class="hw-what">' + esc(head) + '</div>' +
        '<div class="hw-meta">' + esc(meta) + '</div>';
      return;
    }

    var c = pool[0];
    var why = c.why.map(function(w){ return '<span class="hw-cl">' + esc(w) + '</span>'; }).join('<span class="hw-plus">+</span>');
    var head = c.kind === 'ladder'
      ? esc(c.title) + (c.unitLabel && c.unitLabel !== c.unitId ? ' · ' + esc(c.unitLabel) : '')
      : esc(c.unitLabel || (SUBJ[c.subject] || {}).label || '');
    /* ⛔ ΚΑΜΙΑ ΠΑΥΛΑ ΓΙΑ ΧΡΟΝΟ ΠΟΥ ΔΕΝ ΜΕΤΡΗΘΗΚΕ. Ο χρόνος μπαίνει στη
       γραμμή ΜΟΝΟ όταν υπάρχει μέτρηση — αλλιώς η γραμμή δεν τον αναφέρει
       καθόλου, αντί να κουβαλάει ένα «—» που δεν γεμίζει ποτέ. */
    /* «και άλλα 1 εκεί» δεν είναι ελληνικά. Βρέθηκε ΚΟΙΤΑΖΟΝΤΑΣ το render. */
    var bits = c.kind === 'ladder'
      ? ['Ανάκληση'].concat(c.more > 0 ? [(c.more === 1 ? 'και άλλη 1 εκεί' : 'και άλλες ' + c.more + ' εκεί')] : [])
      : [(SUBJ[c.subject] || {}).label || '', KINDS[c.task.kind] || '']
          .concat(c.est == null ? [] : ['~' + c.est + '′']);
    var meta = bits.filter(Boolean).join(' · ');

    var cta = c.href
      ? '<a class="hw-cta" href="' + esc(c.href) + '">' + esc(c.cta) + '</a>'
      : '<button class="hw-cta" type="button" data-focus="' + esc(c.task.id) + '">' + esc(c.cta) + '</button>';
    /* Ένα ΓΡΑΠΤΟ ανήκει ΕΔΩ — δεν υπάρχει σελίδα που να το κάνει, και δεν
       υπάρχει αλήθεια εδάφους για το «έγραψα καλή έκθεση». Άρα ανοίγει το
       παράθυρο γραψίματος και το μόνο του αποτέλεσμα είναι ο μετρημένος
       χρόνος και το «έγινε». Ποτέ ποσοστό. */
    if (c.kind === 'task' && isWritten(c.task.kind))
      cta = '<button class="hw-cta" type="button" data-focus="' + esc(c.task.id) + '">' + esc(c.cta) + '</button>';

    /* Οι πράξεις της εργασίας ταξιδεύουν ΜΑΖΙ της, γιατί η λίστα από κάτω δεν
       τη δείχνει πια. Χωρίς αυτό, η πιο επείγουσα εργασία θα ήταν η μόνη που
       δεν σβήνεται. */
    var acts = '';
    if (c.kind === 'task'){
      var t = c.task;
      acts = '<div class="hw-tacts">' +
        '<button class="hw-mini" type="button" data-done="' + esc(t.id) + '">Έγινε</button>' +
        ((t.src && t.src.id && pics[t.src.id]) ? '<button class="hw-mini" type="button" data-pic="' + esc(t.src.id) + '">Πηγή</button>' : '') +
        '<button class="hw-mini hw-danger" type="button" data-del="' + esc(t.id) + '">✕</button>' +
      '</div>';
    }

    host.innerHTML =
      '<div class="hw-kicker">Μία απόφαση</div>' +
      '<div class="hw-what">' + head + '</div>' +
      '<div class="hw-meta">' + esc(meta) + '</div>' +
      '<div class="hw-why">' + why + '</div>' +
      cta + acts;
    /* ⚠️ ΕΝΑΣ handler ανά κουμπί. Το `data-focus` της κάρτας το δένει ΚΑΙ ΑΥΤΟ
       το wireTaskActs — μια δεύτερη, «σίγουρη» ανάθεση εδώ θα άνοιγε το
       χρονόμετρο δύο φορές με ένα πάτημα. */
    wireTaskActs(host);
  }

  function fmtDue(dateKey){
    if (!dateKey) return 'χωρίς ημερομηνία';
    var d = daysBetween(dateKey, today());
    if (d < 0) return 'πέρασε ' + (-d) + (d === -1 ? ' μέρα' : ' μέρες');
    if (d === 0) return 'σήμερα';
    if (d === 1) return 'αύριο';
    if (d === 2) return 'μεθαύριο';
    if (d <= 6) return DOW_EL[dowMon(new Date(dateKey + 'T00:00:00'))];
    var dd = new Date(dateKey + 'T00:00:00');
    return dd.getDate() + '/' + (dd.getMonth() + 1);
  }

  /* `featured` = ΑΚΡΙΒΩΣ ό,τι δείχνει η κάρτα ΜΙΑ ΑΠΟΦΑΣΗ, ώστε αυτή η λίστα
     να δείχνει ΤΑ ΥΠΟΛΟΙΠΑ. Η γραμμή της σκάλας μένει (είναι η κατάσταση της
     αποθήκης, όχι η υποψηφιότητα), αλλά δεν ξαναγράφει το ΙΔΙΟ όνομα ενότητας
     ούτε δίνει δεύτερο κουμπί για τον ίδιο προορισμό. */
  function renderDebt(featured){
    var L = ladders();
    var host = $('hwDebtBody');
    if (L.broken){
      host.innerHTML = '<div class="hw-blind">Δεν φόρτωσε το <b>ladders.js</b>, οπότε ΔΕΝ ξέρω τι χρωστάς στη μνήμη σου. Αυτό δεν σημαίνει «τίποτα» — σημαίνει «δεν ξέρω». Ανανέωσε τη σελίδα.</div>';
      $('hwDebtS').textContent = 'άγνωστο';
      return;
    }
    var rows = '', blind = [], totalLate = 0;
    L.stores.forEach(function(s){
      if (!s.ok){
        blind.push(s.label);
        return;
      }
      var late = s.items.filter(function(it){ return it.due && Date.now() >= it.due && (it.learned || it.samples > 0); });
      late.sort(function(a,b){ return a.due - b.due; });
      totalLate += late.length;                      /* η κεφαλίδα μετράει ΟΛΑ, πάντα */
      /* Η υποψηφιότητα της κάρτας είναι ΠΑΝΤΑ το `late[0]` αυτής της αποθήκης
         (ίδια ταξινόμηση, στο candidates()), οπότε η «υπόλοιπη» λίστα είναι
         απλώς η ουρά της. */
      var up = !!(featured && featured.kind === 'ladder' && featured.store === s.key);
      var rest = up ? late.slice(1) : late;
      var worst = rest[0] || null;
      var soon = s.nextDue;
      var rgb = subjRgb(s.subject);

      /* Η ΚΑΤΑΣΤΑΣΗ της αποθήκης κρίνεται από ΟΛΟ το χρέος της, και όταν κάτι
         της είναι ληξιπρόθεσμο το λέει — ακόμη κι αν το ένα που χρωστάει είναι
         αυτό που στέκεται πάνω. Το αντίθετο θα ζωγράφιζε «εντάξει» δίπλα σε μια
         κάρτα που λέει «έληξε πριν 4 μέρες». */
      var when, cls;
      if (late[0]){
        var d = window.ALSLadders.daysLate(late[0].due, Date.now());
        when = d <= 0 ? 'σήμερα' : 'πριν ' + d + (d === 1 ? ' μέρα' : ' μέρες');
        cls = 'hw-late';
      } else if (soon){
        when = fmtDue(dkOf(new Date(soon))); cls = 'hw-ok';
      } else if (!s.started){
        /* Μία φορά, όχι τρεις. Η γραμμή από κάτω το λέει ήδη· ένα «δεν
           ξεκίνησε» ΚΑΙ εδώ ΚΑΙ εκεί ΚΑΙ σε μια μπάρα είναι τρεις φωνές για
           ένα γεγονός, και κάνει τη σελίδα να φαίνεται σαν να μετράει κάτι. */
        when = '—'; cls = 'hw-ok';
      } else {
        when = 'εντάξει'; cls = 'hw-ok';
      }

      /* ⚠️⚠️ ΤΕΣΣΕΡΙΣ ΚΑΤΑΣΤΑΣΕΙΣ, ΤΕΣΣΕΡΙΣ ΠΡΟΤΑΣΕΙΣ. Η πρώτη γραφή αυτού
         έγραφε «0 κομμάτια ζωντανά» για μια αποθήκη που δεν άνοιξε ΠΟΤΕ — ένα
         μηδέν που μοιάζει μέτρηση, δηλαδή ακριβώς η σταθερή αρχή 10. Φάνηκε
         μόνο ρεντεράροντας τη σελίδα ΑΔΕΙΑ, που είναι και ο λόγος που
         ρεντεράρεται άδεια. */
      var line2;
      if (!s.started){
        line2 = 'δεν το έχεις ξεκινήσει ακόμη';
      } else if (up){
        /* Η ΕΠΙΚΑΛΥΨΗ ΧΡΕΟΥΣ / ΑΠΟΦΑΣΗΣ, ΚΛΕΙΣΤΗ. Η κάρτα ονομάζει την
           ενότητα· εδώ γράφεται μόνο ΤΙ ΜΕΝΕΙ από πίσω της. */
        line2 = rest.length
          ? ('η πρώτη είναι η απόφαση · ' + rest.length + ' ακόμη προς ανάκληση')
          : 'η μία που χρωστάς είναι η απόφαση, πάνω';
      } else if (worst){
        var lbl = unitTitle(s.key, worst.unitId);
        line2 = late.length + ' προς ανάκληση · ' + esc(lbl);
      } else if (!s.learned){
        line2 = s.untouched
          ? (s.untouched + (s.untouched === 1 ? ' κομμάτι ανοιχτό, καμία ανάκληση ακόμη' : ' κομμάτια ανοιχτά, καμία ανάκληση ακόμη'))
          : 'ξεκίνησε, χωρίς μέτρηση ακόμη';
      } else {
        line2 = s.learned + (s.learned === 1 ? ' κομμάτι ζωντανό' : ' κομμάτια ζωντανά') +
                (s.untouched ? ' · ' + s.untouched + ' ακόμη κλειστά' : '');
      }

      /* Δύο κανάλια: το ΧΡΩΜΑ λέει «έληξε», η ΜΠΑΡΑ λέει ακρίβεια. Και όταν
         δεν υπάρχει μέτρηση, δεν ζωγραφίζεται μπάρα στο μηδέν — γράφεται με
         λέξεις ότι δεν έχει μετρηθεί. */
      var acc = !s.started ? ''
        : (s.accuracy == null)
          ? '<div class="hw-unknown">καμία μέτρηση ακόμη</div>'
          : '<div class="hw-bar"><span style="width:' + Math.round(s.accuracy * 100) + '%"></span></div>';

      /* Δεύτερο κουμπί για τον ΙΔΙΟ προορισμό δεν μπαίνει ποτέ: όταν η πρώτη
         ενότητα είναι πάνω, η γραμμή δείχνει την ΕΠΟΜΕΝΗ — και όταν δεν έχει
         επόμενη, δεν δείχνει κουμπί καθόλου. */
      var go = up
        ? (rest.length
            ? '<a class="hw-go" href="' + esc(deepLink(s.page, s.deep ? worst.unitId : null)) + '">Η επόμενη</a>'
            : '')
        : '<a class="hw-go" href="' + esc(deepLink(s.page, s.deep && worst ? worst.unitId : null)) + '">Πες το</a>';

      rows +=
        '<div class="hw-row" style="--hw-c:' + rgb + '">' +
          '<span class="hw-tick"></span>' +
          '<div class="hw-body">' +
            '<div class="hw-name">' + esc(s.label) + '</div>' +
            '<div class="hw-line2">' + line2 + '</div>' + acc +
          '</div>' +
          '<div class="hw-right">' +
            '<div class="hw-when ' + cls + '">' + esc(when) + '</div>' + go +
          '</div>' +
        '</div>';
    });

    if (blind.length){
      rows += '<div class="hw-blind">Δεν μπόρεσα να διαβάσω: <b>' + esc(blind.join(' · ')) +
              '</b>. Το χρέος εκεί είναι <b>άγνωστο</b> — όχι μηδέν.</div>';
    }
    if (!rows) rows = '<div class="hw-empty">Καμία από τις πέντε σκάλες δεν έχει δεδομένα ακόμη. Άνοιξε μία σελίδα μελέτης και κάνε μία ανάκληση — από την επόμενη φορά ξέρω τι ξεχνάς.</div>';

    host.innerHTML = rows;
    var started = 0;
    L.stores.forEach(function(s){ if (s.ok && s.started) started++; });
    /* «όλα ζωντανά» για πέντε αποθήκες που δεν άνοιξαν ποτέ είναι ψέμα με
       καθησυχαστικό τόνο — η χειρότερη μορφή του. */
    $('hwDebtS').textContent = blind.length
      ? (blind.length + (blind.length === 1 ? ' άγνωστη' : ' άγνωστες'))
      : !started ? 'καμία δεν ξεκίνησε'
      : totalLate ? (totalLate + ' προς ανάκληση')
      : 'όλα ζωντανά';
  }

  function renderTasks(featured){
    var list = taskList(), host = $('hwTaskBody');
    var open = list.filter(function(t){ return !t.done; }).length;
    /* ⭐ Η ΜΙΑ ΠΟΥ ΕΙΝΑΙ ΠΑΝΩ ΔΕΝ ΞΑΝΑΓΡΑΦΕΤΑΙ ΕΔΩ. Ο μετρητής όμως μετράει
       ΟΛΕΣ — αλλιώς η κεφαλίδα θα έλεγε ψέματα για το πόσα χρωστάει. */
    var upId = (featured && featured.kind === 'task') ? featured.task.id : null;
    var shown = upId ? list.filter(function(t){ return t.id !== upId; }) : list;
    $('hwTasksS').textContent = list.length
      ? (open + ' ανοιχτές · ' + (list.length - open) + ' έγιναν' + (upId ? ' · η μία είναι πάνω' : ''))
      : '';
    $('hwSweep').classList.toggle('hw-off', list.length === open);

    if (!list.length){
      host.innerHTML = '<div class="hw-empty"><b>Γράψε μία γραμμή.</b><br>Για παράδειγμα: <span class="hw-mono">Ιστορία b2 απέξω Τρίτη</span> — μάθημα, ενότητα, είδος, προθεσμία. Ό,τι δεν καταλάβω μένει γκρι και το φτιάχνεις με ένα πάτημα.</div>';
      return;
    }
    if (!shown.length){
      host.innerHTML = '<div class="hw-empty">Η μόνη σου εργασία είναι <b>η απόφαση</b>, πάνω — μαζί με τα κουμπιά της.</div>';
      return;
    }

    host.innerHTML = shown.map(function(t){
      var s = SUBJ[t.subject] || SUBJ.unknown;
      var bits = [s.label, KINDS[t.kind] || ''];
      bits.push(t.due ? fmtDue(t.due) : 'χωρίς ημερομηνία');
      /* ⛔ ΚΑΜΙΑ ΠΑΥΛΑ ΓΙΑ ΧΡΟΝΟ ΠΟΥ ΔΕΝ ΜΕΤΡΗΘΗΚΕ. */
      var eb = estBit(t.subject, t.kind); if (eb) bits.push(eb);
      if (t.elapsed > 60000) bits.push(Math.round(t.elapsed / 60000) + '′ γραμμένα');
      /* ⭐ Η Έκθεση δεν έχει σελίδα ακόμη, και το λέει — ένα κενό που
         φαίνεται είναι καλύτερο από ένα κρυμμένο. */
      var goHref = t.link ? deepLink(t.link.page, t.link.unit) : (s.page || null);
      var go = goHref
        ? '<a class="hw-mini hw-lead" href="' + esc(goHref) + '">Άνοιξε</a>'
        : '<span class="hw-mini" style="opacity:.55">δεν υπάρχει σελίδα ακόμη</span>';
      var focus = isWritten(t.kind)
        ? '<button class="hw-mini hw-lead" type="button" data-focus="' + esc(t.id) + '">Γράψ’ το</button>' : '';
      var pic = (t.src && t.src.id && pics[t.src.id])
        ? '<button class="hw-mini" type="button" data-pic="' + esc(t.src.id) + '">Πηγή</button>' : '';
      return '<div class="hw-task' + (t.done ? ' hw-done' : '') + '" style="--hw-c:' + s.rgb + '">' +
        '<span class="hw-tick"></span>' +
        '<div class="hw-body">' +
          '<div class="hw-title">' + esc(t.title || s.label) + '</div>' +
          '<div class="hw-tmeta">' + esc(bits.filter(Boolean).join(' · ')) + '</div>' +
          '<div class="hw-tacts">' +
            '<button class="hw-mini' + (t.done ? '' : ' hw-lead') + '" type="button" data-done="' + esc(t.id) + '">' + (t.done ? 'Ξανά ανοιχτό' : 'Έγινε') + '</button>' +
            focus + go + pic +
            '<button class="hw-mini hw-danger" type="button" data-del="' + esc(t.id) + '">✕</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    wireTaskActs(host);
  }

  /* ⭐ ΜΙΑ ΥΛΟΠΟΙΗΣΗ ΓΙΑ ΔΥΟ ΘΕΣΕΙΣ (σταθερή αρχή 15). Οι ίδιες πράξεις
     ζωγραφίζονται και στην κάρτα ΜΙΑ ΑΠΟΦΑΣΗ και στη λίστα· δύο αντίγραφα του
     ίδιου handler θα ήταν δύο συμπεριφορές με καθυστέρηση. */
  function wireTaskActs(host){
    host.querySelectorAll('[data-done]').forEach(function(b){
      b.addEventListener('click', function(){ toggleDone(b.getAttribute('data-done')); });
    });
    host.querySelectorAll('[data-del]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.getAttribute('data-del'), t = state.tasks[id];
        if (!t) return;
        var ask = window.ALSConfirm
          ? ALSConfirm({ title:'Να το σβήσω;', message:'«' + (t.title || '') + '»',
                         confirmText:'Σβήσ’ το', danger:true })
          : Promise.resolve(confirm('Να σβήσω «' + (t.title || '') + '»;'));
        Promise.resolve(ask).then(function(yes){ if (yes){ dropTask(id); paint(); } });
      });
    });
    host.querySelectorAll('[data-focus]').forEach(function(b){
      b.addEventListener('click', function(){ openFocus(b.getAttribute('data-focus')); });
    });
    host.querySelectorAll('[data-pic]').forEach(function(b){
      b.addEventListener('click', function(){ showPic(b.getAttribute('data-pic')); });
    });
  }

  function toggleDone(id){
    var t = state.tasks[id]; if (!t) return;
    if (t.done){ t.done = 0; }
    else {
      t.done = Date.now();
      /* Η μέτρηση μπαίνει ΜΟΝΟ αν υπήρξε πραγματικός χρόνος στο ρολόι. Ένα
         «έγινε» χωρίς χρονόμετρο δεν είναι μέτρηση και δεν διδάσκει τίποτα. */
      if (t.elapsed > 60000) recordSample(t.subject, t.kind, t.elapsed / 60000);
    }
    if (!save()){ t.done = t.done ? 0 : Date.now(); return; }
    paint();
  }

  /* ── Η ΜΕΡΑ · ο σκελετός, όχι πλέγμα ημερολογίου ─────────────────── */
  function renderDay(pool){
    var day = blocksFor(0);
    var now = new Date(), nowMin = now.getHours()*60 + now.getMinutes();
    var span = DAY_END - DAY_START;
    function pct(min){ return Math.max(0, Math.min(100, ((min - DAY_START) / span) * 100)); }

    var bars = day.blocks.map(function(b){
      var from = Math.max(b.from, DAY_START), to = Math.min(b.to, DAY_END);
      if (to <= from) return '';
      var cls = b.cls === 'study' ? 'hw-study' : b.cls === 'school' ? 'hw-school' : 'hw-quietblk';
      var l = pct(from), w = pct(to) - l;
      return '<div class="hw-blk ' + cls + '" style="left:' + l.toFixed(2) + '%;width:' + w.toFixed(2) + '%">' +
             (w > 11 ? '<span class="hw-cap">' + esc(b.name) + '</span>' : '') + '</div>';
    }).join('');
    var nowM = nowMin < DAY_START ? nowMin + 1440 : nowMin;
    var marker = (nowM >= DAY_START && nowM <= DAY_END)
      ? '<div class="hw-now" style="left:' + pct(nowM).toFixed(2) + '%"></div>' : '';
    $('hwLineBar').innerHTML = bars + marker;
    /* Η ίδια `pct()` που τοποθετεί τα μπλοκ τοποθετεί και τις ώρες, ώστε να
       μην μπορούν να διαφωνήσουν. */
    $('hwTicks').innerHTML = ['10:00','13:00','16:00','19:00','22:00','00:15']
      .map(function(t, i, all){
        var m = hm(t); if (i === all.length - 1) m += 1440;
        return '<span style="left:' + pct(m).toFixed(2) + '%">' + t + '</span>';
      }).join('');
    $('hwDayS').textContent = day.cal === 'live' ? 'από το ημερολόγιο' : 'κατά το πρόγραμμα';

    /* ⭐ ΟΙ ΔΥΟ ΘΕΣΕΙΣ ΕΧΟΥΝ ΔΙΑΦΟΡΕΤΙΚΗ ΔΟΥΛΕΙΑ, ΚΑΙ ΔΕΝ ΑΝΤΑΛΛΑΣΣΟΝΤΑΙ.
       Το ΜΕΓΑΛΟ ΠΑΡΑΘΥΡΟ παίρνει εργασίες + χρέος μνήμης. Το ΞΑΝΑΔΙΑΒΑΣΜΑ
       παίρνει ΤΑ ΣΗΜΕΡΙΝΑ ΤΡΙΑ ΜΑΘΗΜΑΤΑ και τίποτε άλλο: η ίδια προσπάθεια
       αξίζει ~3× την ίδια μέρα σε σχέση με μία εβδομάδα μετά. */
    /* ⚠️ ΕΔΩ ΗΤΑΝ Η ΤΡΙΤΗ ΓΡΑΦΗ ΤΟΥ ΙΔΙΟΥ ΠΡΑΓΜΑΤΟΣ. Το «μεγάλο παράθυρο»
       τύπωνε τις τρεις πρώτες υποψηφιότητες — δηλαδή την κάρτα ΜΙΑ ΑΠΟΦΑΣΗ
       ξανά, και μετά ξανά μέσα στο ΧΡΕΟΣ. Το παράθυρο ΜΕΤΡΑΕΙ τώρα· η
       ονομασία γίνεται μία φορά, πάνω, και η λίστα ζει μία φορά, κάτω. */
    var n = pool.length;
    var morning = !n
      ? 'Καθαρά. Δεν χρωστάς τίποτα σε αυτό το παράθυρο.'
      : n === 1
        ? 'Ένα πράγμα, και είναι η απόφαση από πάνω.'
        : n + ' πράγματα. Το πρώτο είναι η απόφαση· τα υπόλοιπα στο ΧΡΕΟΣ.';

    /* Ο ΙΔΙΟΣ αναγνώστης που τροφοδοτεί την πόρτα `#tonight` (σταθερή αρχή 15). */
    var tv = tonightView();
    var filled = tv.state === 'live' || tv.state === 'mine';
    var review = filled
      ? tv.items.map(function(x){ return esc(x.title); }).join('<br>')
      : esc(TONIGHT_TXT[tv.state]);
    /* ⭐ Η ΠΟΡΤΑ ΤΩΝ 21:45 ΕΧΕΙ ΕΙΣΟΔΟ ΜΟΝΟ ΟΤΑΝ ΕΧΕΙ ΠΕΡΙΕΧΟΜΕΝΟ. Ένας
       σύνδεσμος που προσγειώνεται σε «δεν ξέρω» είναι αδιέξοδο με κουμπί. */
    if (filled)
      review += '<br><a class="hw-go" href="#tonight">Μόνο αυτό</a>';
    /* ⭐ ΦΑΣΗ 3 · ΚΑΘΕ ΜΙΑ ΑΠΟ ΤΙΣ ΤΕΣΣΕΡΙΣ ΚΑΤΑΣΤΑΣΕΙΣ ΕΧΕΙ ΤΟ ΙΔΙΟ ΚΟΥΜΠΙ,
       γιατί σε ΚΑΜΙΑ από αυτές δεν είναι σωστό να μην μπορεί να πει τι είχε. */
    review += '<div class="hw-acts">' + pickBtn(tv.state) + '</div>';

    /* Το μάθημα των 15:15 είναι το ΠΡΩΤΟ της μέρας — τα events του `GCal.day()`
       έρχονται ταξινομημένα, και οι δικές του επιλογές μένουν στη σειρά που τις
       πάτησε. Αν δεν το ξέρουμε, το λέμε ΜΑΖΙ με τον δρόμο για να το μάθουμε. */
    var recapSubj = (filled && tv.items.length) ? tv.items[0].title : null;

    $('hwSlots').innerHTML =
      slot(PLAN.morning[0] + '–' + PLAN.morning[1], 'Το μεγάλο παράθυρο',
           'Εδώ πεθαίνει η δουλειά: εργασίες και χρέος μνήμης.', esc(morning)) +
      slot(PLAN.recap[0] + '–' + PLAN.recap[1], 'Η επανάληψη πριν',
           'Το μάθημα των 15:15, μισή ώρα πριν.',
           recapSubj ? esc(recapSubj) : 'Δεν ξέρω ακόμη ποιο μάθημα έχεις στις 15:15.') +
      slot(PLAN.school[0] + '–' + PLAN.school[1], 'Φροντιστήριο',
           'Εδώ ΓΕΝΝΙΕΤΑΙ η εργασία. Γράψε τη γραμμή πριν βγεις.', '') +
      slot(PLAN.review[0] + '–' + PLAN.review[1], 'Ξαναδιάβασμα',
           'Τα ΣΗΜΕΡΙΝΑ τρία, την ίδια νύχτα. Ποτέ εργασία με προθεσμία.', review);

    wirePick($('hwSlots'));
  }
  /* ⭐ ΕΝΑ ΚΟΥΜΠΙ, ΔΥΟ ΘΕΣΕΙΣ (σταθερή αρχή 15): η ΜΕΡΑ και η πόρτα `#tonight`.
     Η λέξη αλλάζει με την κατάσταση επειδή η ΠΡΑΞΗ αλλάζει — «πες μου» όταν δεν
     ξέρει κανείς, «άλλαξέ τα» όταν υπάρχει ήδη απάντηση. */
  function pickBtn(st){
    var mine = st === 'mine' || st === 'mineNone';
    return '<button class="hw-btn hw-quiet" type="button" data-pick="1">' +
      (mine ? 'Άλλαξέ τα' : st === 'live' ? 'Δεν ήταν αυτά' : 'Πες μου τα σημερινά') +
      '</button>';
  }
  function wirePick(host){
    host.querySelectorAll('[data-pick]').forEach(function(b){
      b.addEventListener('click', openLessons);
    });
  }
  function slot(time, name, why, fill){
    return '<div class="hw-slot">' +
      '<div class="hw-slot-hd"><span class="hw-time hw-mono">' + esc(time) + '</span>' +
      '<span class="hw-slot-n">' + esc(name) + '</span></div>' +
      '<div class="hw-fill">' + esc(why) + (fill ? '<br><span style="color:var(--au-ivory,#f5f2ec)">' + fill + '</span>' : '') + '</div>' +
    '</div>';
  }

  /* ── Η ΣΥΣΣΩΡΕΥΣΗ · μία πρόταση, και ένα κουμπί που την εκτελεί ───
     Η σύγκρουση ΕΙΝΑΙ το νόημα: όταν τρία πράγματα πέφτουν Πέμπτη, το λέει
     ΔΕΥΤΕΡΑ. Και ποτέ δεν μετακινεί δουλειά μόνο του — μόνο όταν το πατήσει. */
  function renderOver(pool){
    var host = $('hwOver');
    var p = pileDay(pool);

    /* Μια πράξη δεν γίνεται σιωπηλά: αν μόλις μετακινήθηκε κάτι, αυτό λέγεται
       πρώτο, με το όνομά του και τη νέα του μέρα. */
    var ack = moved
      ? '<div class="hw-moved">Το «<b>' + esc(moved.title || '—') + '</b>» πήγε ' +
        esc(dayName(dowMon(new Date(moved.to + 'T00:00:00')))) + ', ' + esc(fmtDue(moved.to)) + '.</div>'
      : '';

    if (!p){
      /* ⭐ ΤΙΠΟΤΑ ΔΕΝ ΜΕΝΕΙ ΣΤΗΝ ΟΘΟΝΗ ΜΟΝΟ ΓΙΑ ΝΑ ΚΟΙΤΑΖΕΤΑΙ. Χωρίς
         συσσώρευση δεν υπάρχει πρόταση — και δεν επινοείται μία. */
      host.innerHTML = ack;
      host.className = 'hw-over-wrap' + (ack ? '' : ' hw-off');
      return;
    }

    var dow = dayName(dowMon(p.date));
    var head = '<b>' + esc(dow) + ' έχει ' + p.items + (p.items === 1 ? ' πράγμα' : ' πράγματα') + '.</b>';

    var body, acts = '';
    if (p.move){
      body = ' Το λιγότερο επείγον είναι «' + esc(p.move.title || (SUBJ[p.move.subject] || {}).label || '') + '».';
      acts = '<div class="hw-acts"><button class="hw-btn" type="button" data-fwd="' + esc(p.move.id) + '">' +
             'Φέρ’ το ' + esc(fmtDue(p.prevKey)) + '</button></div>';
    } else if (!p.canPrev){
      body = ' Η προηγούμενη μέρα έχει ήδη περάσει, οπότε δεν υπάρχει πού να πάει.';
    } else if (p.tasks && p.fixed === p.tasks && !p.ladder){
      body = ' Είναι όλα διαγωνίσματα — η ημερομηνία τους δεν ορίζεται από εδώ.';
    } else if (!p.tasks){
      body = p.exam
        ? ' Είναι ανακλήσεις και διαγώνισμα: το χρέος της μνήμης το ορίζει η σκάλα της σελίδας του, και το διαγώνισμα ο καθηγητής.'
        : ' Είναι όλα ανακλήσεις — τις ορίζει η σκάλα της σελίδας τους, όχι αυτή η σελίδα.';
    } else {
      body = ' Καμία από τις εργασίες της δεν μετακινείται από εδώ.';
    }

    host.innerHTML = ack + '<div class="hw-over">' + head + esc(body) + acts + '</div>';
    host.className = 'hw-over-wrap';

    host.querySelectorAll('[data-fwd]').forEach(function(b){
      b.addEventListener('click', function(){
        var r = bringForward(b.getAttribute('data-fwd'));
        if (!r) return;                              /* το persist απέτυχε — το banner το λέει */
        moved = r;
        paint();
      });
    });
  }

  /* ══════════════════════════════════════════════════════════════════
     Η ΠΟΡΤΑ ΤΩΝ 21:45 — ΤΑ ΣΗΜΕΡΙΝΑ, ΜΕ ΤΗ ΣΕΙΡΑ, ΤΙΠΟΤΕ ΑΛΛΟ

     Είναι η στιγμή με τις ΜΗΔΕΝ αποφάσεις. Ό,τι μπει εδώ και δεν είναι ένα από
     τα σημερινά μαθήματα είναι μια απόφαση παραπάνω από όσες αντέχει.
     ⛔ ΚΑΜΙΑ εργασία με προθεσμία εδώ: η ίδια προσπάθεια αξίζει ~3× την ίδια
     νύχτα, και το χρέος πάει στο πρωινό παράθυρο.
     ⭐⭐ ΦΑΣΗ 3: Η ΠΟΡΤΑ ΓΕΜΙΖΕΙ ΠΛΕΟΝ ΧΩΡΙΣ ΗΜΕΡΟΛΟΓΙΟ. Και στις τέσσερις
     καταστάσεις υπάρχει το ΙΔΙΟ κουμπί, γιατί σε καμία τους δεν είναι σωστό να
     μην μπορεί να πει τι είχε — μια πόρτα που λέει «δεν ξέρω» και σταματάει
     είναι αδιέξοδο, όσο τίμια κι αν το λέει.
     ══════════════════════════════════════════════════════════════════ */
  function renderTonight(){
    var tv = tonightView(), body = $('hwTonightBody');
    var acts = '<div class="hw-acts">' + pickBtn(tv.state) + '</div>';
    if (tv.state !== 'live' && tv.state !== 'mine'){
      $('hwTonightS').textContent =
        tv.state === 'unknown' ? 'άγνωστα' : tv.state === 'mineNone' ? 'κανένα, το είπες' : 'κανένα σήμερα';
      body.innerHTML = '<div class="hw-empty">' + esc(TONIGHT_TXT[tv.state]) + acts + '</div>';
      wirePick(body);
      return;
    }
    /* Η ΠΗΓΗ ΛΕΓΕΤΑΙ, ΓΙΑΤΙ ΔΕΝ ΕΙΝΑΙ ΤΟ ΙΔΙΟ ΠΡΑΓΜΑ. «Από το ημερολόγιο»
       σημαίνει μετρημένο· «όπως τα διάλεξες» σημαίνει ότι το είπε ο ίδιος —
       και μόνο το δεύτερο μπορεί να είναι λάθος με τρόπο που να τον αφορά. */
    $('hwTonightS').textContent = PLAN.review[0] + '–' + PLAN.review[1] +
      ' · ' + (tv.state === 'mine' ? 'όπως τα διάλεξες' : 'από το ημερολόγιο');
    /* ⚠️ ΚΑΜΙΑ ΕΤΙΚΕΤΑ ΜΑΘΗΜΑΤΟΣ ΕΔΩ. Ο τίτλος του ημερολογίου γράφει ήδη
       «Αρχαία — φροντιστήριο»: μια δεύτερη γραμμή «Αρχαία» από κάτω είναι το
       ίδιο πράγμα δύο φορές, μισό εκατοστό μακριά. Το ΜΑΘΗΜΑ το λέει το χρώμα
       της γραμμής, η ΩΡΑ λέει τη σειρά — δύο κανάλια, δύο διαφορετικά
       πράγματα, ποτέ το ίδιο σε δύο γλώσσες.
       ⭐ ΚΑΙ ΓΙ' ΑΥΤΟ Η ΧΕΙΡΟΚΙΝΗΤΗ ΕΠΙΛΟΓΗ ΔΕΝ ΤΥΠΩΝΕΙ «—»: εκεί η ώρα δεν
       είναι άγνωστη μέτρηση, είναι μέγεθος που δεν υπάρχει. Δέκα παύλες σε μια
       στήλη μοιάζουν με σφάλμα ανάγνωσης, και δεν είναι (σταθ. 33). */
    body.innerHTML = tv.items.map(function(x){
      return '<div class="hw-row" style="--hw-c:' + subjRgb(x.subject) + '">' +
        '<span class="hw-tick"></span>' +
        '<div class="hw-body"><div class="hw-name">' + esc(x.title) + '</div></div>' +
        (x.src === 'mine' ? '' :
          '<div class="hw-right"><div class="hw-when hw-ok hw-mono">' +
            (x.at == null ? '—' : esc(clock(x.at))) + '</div></div>') +
      '</div>';
    }).join('') + acts;
    wirePick(body);
  }

  /* ══════════════════════════════════════════════════════════════════
     ΤΟ ΦΥΛΛΟ — ΤΕΣΣΕΡΑ ΜΑΘΗΜΑΤΑ, ΩΣ ΤΡΙΑ, ΤΕΛΟΣ

     ⭐ Η ΣΕΙΡΑ ΕΙΝΑΙ Η ΣΕΙΡΑ ΠΟΥ ΤΑ ΠΑΤΑΕΙ, και είναι η μόνη σειρά που
     μπορούμε να ξέρουμε: το φροντιστήριο δίνει τρία μαθήματα στη σειρά, και
     εκείνος τα θυμάται με τη σειρά τους. Μια αλφαβητική ή «κατά συντελεστή»
     σειρά θα ήταν δική μας εφεύρεση πάνω στα δικά του γεγονότα.
     ⚠️ Το προσωρινό `pickBuf` ΔΕΝ είναι η αποθήκη: τίποτα δεν γράφεται στον
     δίσκο μέχρι το «Έτοιμο», ώστε ένα «Άκυρο» να είναι πραγματικά άκυρο.
     ══════════════════════════════════════════════════════════════════ */
  var pickBuf = null, pickDay = null;

  function openLessons(){
    pickDay = today();
    var mine = myLessons(pickDay);
    if (mine){
      pickBuf = mine.slice();
    } else {
      /* ΠΡΟ-ΣΥΜΠΛΗΡΩΣΗ ΑΠΟ ΤΟ ΗΜΕΡΟΛΟΓΙΟ, όταν υπάρχει: «διορθώνω» και
         «συμπληρώνω» γίνονται η ίδια κίνηση, και σε συνδεδεμένη συσκευή το
         «Δεν ήταν αυτά» κοστίζει ένα πάτημα αντί για τέσσερα. */
      var cal = lessonsFor(0) || [];
      pickBuf = [];
      cal.forEach(function(l){
        if (l.subject && SUBJ[l.subject] && pickBuf.indexOf(l.subject) < 0 && pickBuf.length < MAX_LESSONS)
          pickBuf.push(l.subject);
      });
    }
    renderPicker();
    openSheet('hwLessons');
  }

  function renderPicker(){
    var has = !!myLessons(pickDay), live = calState() === 'live';
    $('hwPickLead').textContent = has
      ? 'Αυτά κρατάει η εφαρμογή για σήμερα. Πάτα για να βγάλεις ή να βάλεις.'
      : live
        ? 'Συμπληρωμένα από το ημερολόγιό σου. Διόρθωσέ τα αν ήταν άλλα.'
        : 'Πάτα τα με τη σειρά που τα είχες. Δεν χρειάζεται ημερολόγιο.';

    $('hwPickGrid').innerHTML = SUBJ_ORDER.map(function(s){
      var i = pickBuf.indexOf(s), on = i >= 0, full = pickBuf.length >= MAX_LESSONS;
      return '<button class="hw-pick-b" type="button" data-subj="' + esc(s) + '"' +
        ' style="--hw-c:' + subjRgb(s) + '" aria-pressed="' + (on ? 'true' : 'false') + '"' +
        (!on && full ? ' disabled' : '') + '>' +
        '<span class="hw-tick"></span>' + esc((SUBJ[s] || {}).label || s) +
        (on ? '<span class="hw-ord">' + (i + 1) + '</span>' : '') +
      '</button>';
    }).join('');

    /* Ο περιορισμός ΛΕΓΕΤΑΙ. Ένα τέταρτο πάτημα που δεν κάνει τίποτα χωρίς
       εξήγηση είναι χειριστήριο που δεν χειρίζεται (σταθερή αρχή, φάση 1). */
    $('hwPickHint').textContent = pickBuf.length >= MAX_LESSONS
      ? 'Τρία το πολύ — ξεδιάλεξε ένα για να βάλεις άλλο.'
      : pickBuf.length
        ? 'Με τη σειρά που τα είχες.'
        /* ⚠️ Η πρώτη γραφή έλεγε «Ή πάτα «Έτοιμο» χωρίς καμία επιλογή» — και το
           κουμπί σε ΑΥΤΗ ΑΚΡΙΒΩΣ την κατάσταση ΔΕΝ γράφει «Έτοιμο», γράφει
           «Δεν είχα μάθημα σήμερα». Η οδηγία ονόμαζε κουμπί που δεν ήταν στην
           οθόνη. Φάνηκε ΜΟΝΟ στο render. */
        : 'Διάλεξε όσα είχες σήμερα. Αν δεν είχες κανένα, πες το από κάτω.';

    $('hwPickSave').textContent = pickBuf.length ? 'Έτοιμο' : 'Δεν είχα μάθημα σήμερα';
    /* Η επιστροφή στο ημερολόγιο προσφέρεται ΜΟΝΟ όταν υπάρχει ημερολόγιο να
       επιστρέψεις — αλλιώς το κουμπί θα υποσχόταν κάτι που δεν υπάρχει. */
    $('hwPickCal').classList.toggle('hw-off', !(has && live));

    $('hwPickGrid').querySelectorAll('[data-subj]').forEach(function(b){
      b.addEventListener('click', function(){
        var s = b.getAttribute('data-subj'), i = pickBuf.indexOf(s);
        if (i >= 0) pickBuf.splice(i, 1);
        else if (pickBuf.length < MAX_LESSONS) pickBuf.push(s);
        renderPicker();
      });
    });
  }

  function closePicker(){
    var d = $('hwLessons');
    try { d.close(); } catch(e){ d.removeAttribute('open'); }
  }

  /* ⭐⭐ ΤΟ ΜΠΛΕ ΔΑΧΤΥΛΙΔΙ ΤΟΥ CHROME ΕΙΝΑΙ ΤΟ ΜΟΝΟ ΜΠΛΕ ΣΕ ΜΙΑ ΣΕΛΙΔΑ ΧΩΡΙΣ
     ΜΠΛΕ, ΚΑΙ ΤΟ ΕΙΔΕ ΜΟΝΟ ΤΟ PNG. Το `showModal()` εστιάζει ΤΟ ΠΡΩΤΟ εστιάσιμο
     παιδί, οπότε το φύλλο των σημερινών άνοιγε με το «Ιστορία» φωτισμένο σε
     χρώμα συστήματος — και έμοιαζε επιλεγμένο ενώ δεν ήταν. Ίδιο ακριβώς
     εύρημα με το recap της als-v443 και τον διάλογο της als-v454.
     Η εστίαση πάει στο ΣΩΜΑ του φύλλου (`tabindex="-1"`, `outline:none`), που
     κρατάει το πληκτρολόγιο μέσα στο modal χωρίς να ανάβει χειριστήριο.
     ⭐ ΜΙΑ ΥΛΟΠΟΙΗΣΗ ΓΙΑ ΚΑΙ ΤΑ ΔΥΟ ΦΥΛΛΑ (σταθερή αρχή 15): το παράθυρο
     γραψίματος άνοιγε με το ίδιο δαχτυλίδι από την als-v470 και θα έμενε το
     μόνο που το φοράει — μια εγγύηση σε μία θέση και όχι στο δίδυμό της είναι
     σύμπτωση με καλή φήμη. */
  function openSheet(id){
    var d = $(id);
    try { d.showModal(); } catch(e){ d.setAttribute('open',''); }
    var body = d.querySelector('.hw-sheet');
    if (body){ try { body.focus(); } catch(e){} }
  }

  /* ⚠️ ΣΤΑΘΕΡΗ ΑΡΧΗ 12: ΚΑΘΕ ΚΛΑΣΗ ΠΟΥ ΕΝΑΛΛΑΣΣΕΤΑΙ ΑΠΟ ΕΔΩ ΥΠΑΡΧΕΙ ΣΤΟ CSS
     — `hw-door`, `hw-door-capture`, `hw-door-tonight`. Μια κλάση χωρίς κανόνα
     είναι σιωπηλό no-op, δηλαδή σιωπηλό-άδειο με άλλο καπέλο.
     ⛔⛔ ΚΑΙ ΤΟ ΟΡΙΟ ΤΗΣ ΠΛΑΤΦΟΡΜΑΣ, ΟΝΟΜΑΣΤΙΚΑ ΑΝΤΙ ΓΙΑ ΥΠΟΣΧΕΣΗ: το iOS ΔΕΝ
     σηκώνει το πληκτρολόγιο από προγραμματιστικό `focus()` χωρίς χειρονομία
     χρήστη — και μια άφιξη από push ΔΕΝ είναι χειρονομία. Άρα εδώ κερδίζουμε
     τον κέρσορα και το να είναι το πεδίο ΤΟ ΠΡΩΤΟ πράγμα· το πληκτρολόγιο
     θέλει ένα ακόμη πάτημα στο iPhone. Δεν το κρύβω πίσω από μια «σχεδόν». */
  function applyDoor(){
    var d = doorOf(location.hash), cl = document.body.classList;
    cl.toggle('hw-door', !!d);
    cl.toggle('hw-door-capture', d === 'capture');
    cl.toggle('hw-door-tonight', d === 'tonight');
    $('hwDoorName').textContent = d ? DOORS[d] : '';
    if (d === 'tonight') renderTonight();
    if (d === 'capture'){ try { $('hwLine').focus(); } catch(e){} }
    return d;
  }

  /* ⛔ ΤΙ ΕΦΥΓΕ ΑΠΟ ΕΔΩ, ΓΡΑΜΜΕΝΟ ΩΣΤΕ ΝΑ ΜΗΝ ΞΑΝΑΓΡΑΦΤΕΙ: το `weekLoad()`
     έδινε βάρος σε ΛΕΠΤΑ (25′ ανά εργασία, 15′ ανά ανάκληση, 45′ ανά
     διαγώνισμα) που κανείς δεν είχε μετρήσει, και το `renderWeek()` ζωγράφιζε
     επτά μπάρες με ύψος από αυτά τα λεπτά — επινοημένοι αριθμοί σε μορφή
     γραφήματος (σταθερή αρχή 33), κάτω από μια ερώτηση χωρίς κουμπί.
     Το `pileDay()` μετράει ΠΡΑΓΜΑΤΑ, και το κουμπί το κάνει. */

  /* ══════════════════════════════════════════════════════════════════
     ΤΟ ΠΑΡΑΘΥΡΟ ΓΡΑΨΙΜΑΤΟΣ — ΓΙΑ ΤΑ ΓΡΑΠΤΑ

     Η μισή του δουλειά είναι ΓΡΑΠΤΗ, δικά του λόγια. Άρα αυτή η σελίδα δεν
     είναι λεπτός δρομολογητής. Το παράθυρο ησυχάζει το περιβάλλον, μετράει
     πραγματικό χρόνο, κρατάει τη ΦΩΤΟΓΡΑΦΙΑ ΤΗΣ ΠΗΓΗΣ ένα πάτημα μακριά, και
     ΣΥΝΕΧΙΖΕΙ από εκεί που έμεινε αντί να ξεκινάει από την αρχή.
     ⛔ ΚΑΜΙΑ ΒΑΘΜΟΛΟΓΙΑ. Δεν υπάρχει αλήθεια εδάφους για το «έγραψα καλή
     έκθεση», και ένα κατασκευασμένο ποσοστό εκεί θα ήταν η ίδια αρρώστια της
     als-v433 σε νέο μέρος. Το «έγινε» είναι γεγονός· οτιδήποτε άλλο θα ήταν
     μαντεψιά ντυμένη αριθμό.
     ══════════════════════════════════════════════════════════════════ */
  var focusId = null, focusStart = 0, focusTimer = null;

  function focusMs(){
    var t = state.tasks[focusId];
    return (t ? (t.elapsed || 0) : 0) + (focusStart ? (Date.now() - focusStart) : 0);
  }
  function paintFocusClock(){
    var ms = focusMs(), s = Math.floor(ms / 1000);
    $('hwFocusClock').textContent = pad2(Math.floor(s / 60)) + ':' + pad2(s % 60);
  }
  function openFocus(id){
    var t = state.tasks[id]; if (!t) return;
    focusId = id; focusStart = Date.now();
    var s = SUBJ[t.subject] || SUBJ.unknown;
    $('hwFocusKicker').textContent = s.label + ' · ' + (KINDS[t.kind] || '');
    $('hwFocusTitle').textContent = t.title || s.label;
    var e = estimate(t.subject, t.kind);
    $('hwFocusNote').textContent = (t.elapsed > 60000 ? 'Συνεχίζεις από τα ' + Math.round(t.elapsed / 60000) + '′. ' : '') +
      (e == null ? 'Δεν έχω μετρήσει αρκετές φορές ώστε να πω πόσο παίρνει.' : 'Συνήθως ~' + e + '′.');
    var img = $('hwFocusImg');
    img.classList.add('hw-off'); img.removeAttribute('src');
    $('hwFocusShot').classList.toggle('hw-off', !(t.src && t.src.id && pics[t.src.id]));
    paintFocusClock();
    clearInterval(focusTimer); focusTimer = setInterval(paintFocusClock, 1000);
    openSheet('hwFocus');
  }
  function stopFocus(markDone){
    var t = focusId ? state.tasks[focusId] : null;
    clearInterval(focusTimer); focusTimer = null;
    if (t){
      t.elapsed = focusMs();
      if (markDone){
        t.done = Date.now();
        if (t.elapsed > 60000) recordSample(t.subject, t.kind, t.elapsed / 60000);
      }
      save();
    }
    focusStart = 0; focusId = null;
    try { $('hwFocus').close(); } catch(e){}
    paint();
  }
  function showPic(pid){
    var p = pics[pid];
    if (!p || !p.d){
      if (window.ALSAlert) ALSAlert('Η φωτογραφία δεν υπάρχει σε αυτή τη συσκευή. Δεν σβήστηκε από εδώ — απλώς δεν έχει κατέβει ακόμη.');
      return;
    }
    var img = $('hwFocusImg');
    img.src = p.d; img.classList.remove('hw-off');
    if (!$('hwFocus').open){
      $('hwFocusKicker').textContent = 'Η πηγή';
      $('hwFocusTitle').textContent = 'Η φωτογραφία, όπως τη τράβηξες';
      $('hwFocusClock').textContent = '';
      $('hwFocusNote').textContent = 'Αποθηκεύεται και φαίνεται. Ποτέ δεν διαβάζεται από μηχανή.';
      openSheet('hwFocus');
    }
  }

  /* ══════════════════════════════════════════════════════════════════
     Η ΣΥΛΛΗΨΗ
     ══════════════════════════════════════════════════════════════════ */
  var draft = null, draftPic = null;

  function chip(kind, label, value, missing){
    return '<button class="hw-pchip' + (missing ? ' hw-miss' : '') + '" type="button" data-fix="' + kind + '">' +
      '<span class="hw-k">' + esc(label) + '</span>' + esc(value) + '</button>';
  }
  function renderParse(){
    if (!draft){ $('hwParse').classList.remove('hw-open'); return; }
    var u = draft.unit;
    $('hwPchips').innerHTML =
      chip('subject', 'Μάθημα', draft.subject ? SUBJ[draft.subject].label : 'δεν το βρήκα', !draft.subject) +
      chip('unit', 'Ενότητα', u ? (u.id + (u.title ? ' · ' + u.title : '')) : 'καμία', !u) +
      chip('kind', 'Είδος', KINDS[draft.kind] || 'άσκηση', false) +
      chip('due', 'Προθεσμία', draft.due ? fmtDue(draft.due) : 'χωρίς ημερομηνία', !draft.due) +
      chip('title', 'Τίτλος', draft.title || '(κενός)', !draft.title) +
      (draftPic ? chip('pic', 'Πηγή', 'φωτογραφία', false) : '');
    $('hwParse').classList.add('hw-open');
    $('hwPchips').querySelectorAll('[data-fix]').forEach(function(b){
      b.addEventListener('click', function(){ fixChip(b.getAttribute('data-fix')); });
    });
  }
  function cycle(list, cur){
    var i = list.indexOf(cur);
    return list[(i + 1) % list.length];
  }
  function fixChip(which){
    if (!draft) return;
    if (which === 'subject'){ draft.subject = cycle(['istoria','arxaia','latinika','ekthesi'], draft.subject); renderParse(); return; }
    if (which === 'kind'){ draft.kind = cycle(['askisi','apexo','grapto','diagonisma'], draft.kind); renderParse(); return; }
    if (which === 'due'){
      var order = [null, offDate(0), offDate(1), offDate(2), offDate(3), offDate(7)];
      var idx = order.indexOf(draft.due);
      draft.due = order[(idx + 1) % order.length];
      renderParse(); return;
    }
    if (which === 'unit'){
      var units = knownUnits().filter(function(x){ return !draft.subject || x.subject === draft.subject; });
      if (!units.length){ if (window.ALSAlert) ALSAlert('Δεν υπάρχουν ενότητες για αυτό το μάθημα στα δεδομένα της εφαρμογής.'); return; }
      var ids = [null].concat(units.map(function(x){ return x.id; }));
      var cur = draft.unit ? draft.unit.id : null;
      var nxt = ids[(ids.indexOf(cur) + 1) % ids.length];
      draft.unit = nxt ? units.filter(function(x){ return x.id === nxt; })[0] : null;
      if (draft.unit && !draft.subject) draft.subject = draft.unit.subject;
      renderParse(); return;
    }
    if (which === 'title'){
      var ask = window.ALSPrompt ? ALSPrompt('Ο τίτλος, με τα δικά σου λόγια:', draft.title || '') : Promise.resolve(prompt('Τίτλος:', draft.title || ''));
      Promise.resolve(ask).then(function(v){ if (v != null){ draft.title = String(v).trim(); renderParse(); } });
      return;
    }
    if (which === 'pic'){ if (draftPic) showPicData(draftPic); return; }
  }
  function showPicData(dataUrl){
    var img = $('hwFocusImg');
    img.src = dataUrl; img.classList.remove('hw-off');
    $('hwFocusKicker').textContent = 'Η πηγή';
    $('hwFocusTitle').textContent = 'Η φωτογραφία, όπως τη τράβηξες';
    $('hwFocusClock').textContent = '';
    $('hwFocusNote').textContent = 'Αποθηκεύεται και φαίνεται. Ποτέ δεν διαβάζεται από μηχανή.';
    openSheet('hwFocus');
  }

  function commitDraft(){
    if (!draft) return;
    if (!draft.subject && !draft.title){ banner('Δεν κατάλαβα τίποτα από αυτή τη γραμμή. Πάτα ένα chip και πες μου τι είναι.'); return; }
    var src = null;
    if (draftPic){
      var res = addPic(draftPic);
      if (res.id){
        src = { type:'photo', id:res.id };
        if (res.dropped) banner('Κράτησα τη φωτογραφία και πέταξα ' + res.dropped + ' παλιά που δεν ήταν δεμένη σε εργασία. Το όριο είναι ' + PIC_KEEP + '.');
      }
      /* Αν η φωτογραφία δεν χώρεσε, η ΕΡΓΑΣΙΑ σώζεται όπως και να 'χει — το
         banner ήδη λέει τι έγινε. Ποτέ σιωπηλή απώλεια. */
    }
    var id = addTask({ subject:draft.subject, title:draft.title, due:draft.due, kind:draft.kind, unit:draft.unit, src:src });
    if (!id) return;                                   /* το persist απέτυχε, το banner το λέει */
    draft = null; draftPic = null;
    $('hwLine').value = '';
    $('hwParse').classList.remove('hw-open');
    paint();
  }

  /* ── ΤΟ ΑΔΕΙΑΣΜΑ ΤΟΥ ΚΕΦΑΛΙΟΥ — και μένει χαζό ─────────────────── */
  function runDump(){
    var raw = $('hwDump').value || '';
    var lines = raw.split(/[\n,]+/).map(function(s){ return s.trim(); }).filter(Boolean);
    if (!lines.length) return;
    var made = 0;
    lines.forEach(function(l){
      var p = parseLine(l);
      /* Μια γραμμή που δεν λύνεται γίνεται σκέτη σημείωση με `due: null` —
         που είναι μια χαρά, γιατί μια σκέψη που γράφτηκε αξίζει περισσότερο
         από μια οργανωμένη που δεν γράφτηκε ποτέ. */
      if (!p.title && !p.subject) p.title = l;
      if (addTask({ subject:p.subject, title:p.title || l, due:p.due, kind:p.kind, unit:p.unit })) made++;
    });
    $('hwDump').value = '';
    $('hwDumpWrap').classList.add('hw-off');
    banner(made ? ('Κράτησα ' + made + (made === 1 ? ' γραμμή. Έλεγξέ τες — ό,τι δεν κατάλαβα έμεινε σημείωση.' : ' γραμμές. Έλεγξέ τες — ό,τι δεν κατάλαβα έμεινε σημείωση.')) : '');
    paint();
  }

  /* ══════════════════════════════════════════════════════════════════
     ΚΑΛΩΔΙΩΣΗ
     ══════════════════════════════════════════════════════════════════ */
  /* ⭐ Η ΚΑΤΑΤΑΞΗ ΥΠΟΛΟΓΙΖΕΤΑΙ ΜΙΑ ΦΟΡΑ ΚΑΙ ΜΟΙΡΑΖΕΤΑΙ. Πριν τη φάση 1 το
     `candidates()` έτρεχε δύο φορές και το `budget()` τρεις μέσα σε ένα paint,
     οπότε η κάρτα και η ΜΕΡΑ μπορούσαν να διαφωνήσουν αν άλλαζε το λεπτό
     ανάμεσά τους. Ένας υπολογισμός, μία αλήθεια — και το `featured` είναι
     ΑΚΡΙΒΩΣ ό,τι δείχνει η κάρτα, ώστε κανένα άλλο μπλοκ να μην το ξαναπεί. */
  function paint(){
    ladders();                       /* ΜΙΑ φρέσκια ανάγνωση, πριν από όλους */
    var b = renderClock();
    var pool = candidates(b.free);
    var featured = pool[0] || null;
    renderStart(pool);
    renderDebt(featured);
    renderTasks(featured);
    renderDay(pool);
    renderOver(pool);
    renderTonight();                 /* η πόρτα των 21:45 ζει στο ΙΔΙΟ paint */
    $('hwFoot').innerHTML =
      'Διαβάζει και τις πέντε σκάλες μελέτης· γράφει ΜΟΝΟ τις δικές του εργασίες.<br>' +
      'Καμία μηχανή δεν διαβάζει τις φωτογραφίες σου εδώ — η μεταγραφή γίνεται στη συζήτηση, μπροστά σου.';
  }

  $('hwLine').addEventListener('input', function(){
    var v = $('hwLine').value.trim();
    if (!v){ draft = null; $('hwParse').classList.remove('hw-open'); return; }
    draft = parseLine(v);
    renderParse();
  });
  $('hwLine').addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ e.preventDefault(); if (draft) commitDraft(); }
  });
  $('hwSave').addEventListener('click', commitDraft);
  $('hwCancel').addEventListener('click', function(){
    draft = null; draftPic = null; $('hwLine').value = ''; $('hwParse').classList.remove('hw-open');
  });
  $('hwShot').addEventListener('click', function(){ $('hwFile').click(); });
  $('hwFile').addEventListener('change', function(){
    var f = $('hwFile').files && $('hwFile').files[0];
    $('hwFile').value = '';
    if (!f) return;
    shrink(f, function(data, err){
      if (err){ banner(err); return; }
      draftPic = data;
      if (!draft) draft = parseLine($('hwLine').value || '');
      renderParse();
      banner('');
    });
  });
  $('hwDumpOpen').addEventListener('click', function(){ $('hwDumpWrap').classList.toggle('hw-off'); });
  $('hwDumpClose').addEventListener('click', function(){ $('hwDumpWrap').classList.add('hw-off'); });
  $('hwDumpGo').addEventListener('click', runDump);
  $('hwSweep').addEventListener('click', function(){
    var ask = window.ALSConfirm
      ? ALSConfirm({ title:'Να σβήσω όσες έχουν γίνει;',
                     message:'Φεύγουν από εδώ και από το cloud. Οι σκάλες μελέτης δεν αγγίζονται.',
                     confirmText:'Σβήσ’ τες', danger:true })
      : Promise.resolve(confirm('Να σβήσω όσες έχουν γίνει;'));
    Promise.resolve(ask).then(function(yes){ if (!yes) return; var n = sweepDone(); if (n) banner(''); paint(); });
  });
  $('hwFocusDone').addEventListener('click', function(){ stopFocus(true); });
  $('hwFocusPause').addEventListener('click', function(){ stopFocus(false); });
  $('hwFocusClose').addEventListener('click', function(){ stopFocus(false); });
  $('hwFocusShot').addEventListener('click', function(){
    var t = focusId ? state.tasks[focusId] : null;
    if (t && t.src && t.src.id) showPic(t.src.id);
  });
  /* ── ΤΟ ΦΥΛΛΟ ΤΩΝ ΣΗΜΕΡΙΝΩΝ ──────────────────────────────────────
     ⚠️ ΚΑΘΕ ΜΙΑ ΑΠΟ ΤΙΣ ΤΡΕΙΣ ΠΡΑΞΕΙΣ ΚΛΕΙΝΕΙ ΤΟ ΦΥΛΛΟ ΜΟΝΟ ΑΝ ΠΕΤΥΧΕ. Ένα
     φύλλο που κλείνει πάνω σε αποτυχημένη εγγραφή αφήνει τον χρήστη να νομίζει
     ότι σώθηκε — και το banner από πίσω θα ήταν κρυμμένο πίσω από την κίνηση
     του κλεισίματος (σταθερές αρχές 10/17). */
  $('hwPickSave').addEventListener('click', function(){
    if (!setLessons(pickDay, pickBuf)) return;   /* το banner λέει γιατί */
    closePicker(); paint();
  });
  $('hwPickCal').addEventListener('click', function(){
    if (!clearLessons(pickDay)) return;
    closePicker(); paint();
  });
  $('hwPickClose').addEventListener('click', closePicker);

  $('hwFocus').addEventListener('close', function(){
    if (focusTimer){ clearInterval(focusTimer); focusTimer = null; }
    if (focusId) stopFocus(false);
  });

  /* Η μέρα κυλάει ενώ η σελίδα είναι ανοιχτή: ο δείκτης ΤΩΡΑ και ο χρόνος
     που μένει ξαναζωγραφίζονται μόνοι τους. Καμία επανάληψη εισόδου —
     `PageMotion` σκανάρει ΜΟΝΟ τα στατικά κελύφη των ενοτήτων, ώστε ένα
     repaint να μην ξαναπαίζει ποτέ animation εισόδου. */
  /* ── ΟΙ ΠΟΡΤΕΣ · Η ΚΑΛΩΔΙΩΣΗ ────────────────────────────────────
     ⚠️ Η έξοδος καθαρίζει το hash με `replaceState`, ΟΧΙ με `location.hash=''`:
     το δεύτερο αφήνει ένα «#» κρεμασμένο στη γραμμή διεύθυνσης και γράφει μια
     εγγραφή στο ιστορικό, οπότε το «πίσω» τον ξαναπετάει μέσα στην πόρτα από
     την οποία μόλις βγήκε. */
  $('hwDoorbar').querySelectorAll('[data-door]').forEach(function(b){
    b.addEventListener('click', function(){
      try { history.replaceState(null, '', location.pathname + location.search); }
      catch(e){ location.hash = ''; }
      applyDoor();
    });
  });
  /* Το push των 18:00 προσγειώνεται σε ΑΝΟΙΧΤΗ καρτέλα: το `client.navigate()`
     του service worker προς το ίδιο έγγραφο με άλλο hash είναι navigation στο
     ΙΔΙΟ έγγραφο, άρα δεν φορτώνει τίποτα ξανά — μόνο αυτό το event υπάρχει. */
  window.addEventListener('hashchange', function(){ applyDoor(); });

  reload();
  paint();
  applyDoor();
  setInterval(function(){ if (!document.hidden) paint(); }, 60000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden){ reload(); paint(); } });
  window.addEventListener('focus', function(){ reload(); paint(); });

  /* Το ημερολόγιο ανανεώνεται σιωπηλά αν έχει ήδη δοθεί άδεια σε αυτή τη
     συσκευή. Αν όχι, ΔΕΝ ζητάμε τίποτα — η άδεια θέλει κλικ, και η σελίδα
     λέει καθαρά ότι δουλεύει με το πρόγραμμα. */
  try { if (window.GCal && GCal.isConnected()) GCal.refresh(function(){ paint(); }); } catch(e){}

  /* ══════════════════════════════════════════════════════════════════
     CLOUD SYNC
     ⚠️ Η αναμονή είναι στις ΠΡΟΫΠΟΘΕΣΕΙΣ, και το initCloudSync καλείται
     ΑΚΡΙΒΩΣ ΜΙΑ ΦΟΡΑ: το initCloudSync ΕΠΙΣΤΡΕΦΕΙ ΣΙΩΠΗΛΑ όταν το
     `window.supabase` δεν υπάρχει ακόμη, και μια δεύτερη επιτυχημένη κλήση
     αλυσιδώνει δεύτερο override του setItem πάνω στην ίδια σελίδα.
     Αν δεν ξεκινήσει ποτέ, το λέμε στην οθόνη (σταθερή αρχή 32).
     ══════════════════════════════════════════════════════════════════ */
  (function startCloudSync(){
    var tries = 0;
    (function wait(){
      if (typeof window.initCloudSync !== 'function' || !window.supabase){
        if (tries++ < 100){ setTimeout(wait, 200); return; }
        banner('Ο συγχρονισμός δεν ξεκίνησε — ό,τι γράψεις μένει μόνο σε αυτή τη συσκευή. Κλείσε και άνοιξε ξανά την εφαρμογή.');
        return;
      }
      window.initCloudSync({
        /* ⚠️ ΓΡΑΜΜΕΝΟ ΚΥΡΙΟΛΕΚΤΙΚΑ, ΕΠΙΤΗΔΕΣ — ΚΑΙ ΤΟ ΣΧΟΛΙΟ ΔΕΝ ΕΠΙΤΡΕΠΕΤΑΙ
           ΝΑ ΓΡΑΨΕΙ ΤΟ ΣΧΗΜΑ ΠΟΥ ΠΕΡΙΓΡΑΦΕΙ. Ο φρουρός του smoke-test.sh που
           ελέγχει ότι κάθε συγχρονισμένο κλειδί υπάρχει στα BUNDLES του
           backup.html ψάχνει το ΠΡΩΤΟ κυριολεκτικό appKey μέσα σε 1200
           χαρακτήρες από εδώ. Μια σταθερά κάνει τον έλεγχο να προσπεράσει
           ΣΙΩΠΗΛΑ όλη τη σελίδα — και τότε τα `hw:*` θα συγχρονίζονταν τέλεια
           και δεν θα επαναφέρονταν ΠΟΤΕ από αντίγραφο ασφαλείας.
           ⚠️ Η πρώτη γραφή αυτού του σχολίου έγραφε το ίδιο το μοτίβο μέσα
           στα εισαγωγικά, ο φρουρός το διάβασε ΑΝΤΙ για τη γραμμή από κάτω,
           και κατηγόρησε μια σελίδα που ήταν σωστή: σταθερή αρχή 19, ένας
           φρουρός που τρώει το σχόλιο που τον τεκμηριώνει.
           Το `tests/homework-plan.test.js` απαιτεί να συμφωνεί με το APP. */
        appKey: 'homework',
        syncedKeys: [KEY, PKEY],
        onApplied: function(){
          /* Ξαναδιάβασε ΠΡΙΝ γράψει οτιδήποτε, αλλιώς μια εισερχόμενη
             συγχώνευση χάνεται από παλιό αντίγραφο στη μνήμη. */
          reload();
          if (!focusId) paint();
        }
      });
      /* Το ALSSync δημοσιεύεται ΣΥΓΧΡΟΝΑ από το initCloudSync, άρα η απουσία
         του σημαίνει ότι η κλήση βγήκε σε κάτι που δεν το φτιάχνει retry. */
      if (!window.ALSSync) banner('Ο συγχρονισμός δεν ξεκίνησε — ό,τι γράψεις μένει μόνο σε αυτή τη συσκευή. Κλείσε και άνοιξε ξανά την εφαρμογή.');
    })();
  })();

})();
</script>
