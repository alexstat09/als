  function toggleDone(id){
    var t = state.tasks[id]; if (!t) return;
    if (t.done){ t.done = 0; }
    else {
      t.done = Date.now();
      /* Η μέτρηση μπαίνει ΜΟΝΟ αν υπήρξε πραγματικός χρόνος στο ρολόι. Ένα
         «έγινε» χωρίς χρονόμετρο δεν είναι μέτρηση και δεν διδάσκει τίποτα. */
      if (t.elapsed > 60000) recordSample(t.subject, t.kind, t.elapsed / 60000);
    }
    if (!save()){ t.done = t.done ? 0 : Date.now(); return; }
    paint();
  }

  /* ── Η ΜΕΡΑ · ο σκελετός, όχι πλέγμα ημερολογίου ─────────────────── */
  function renderDay(){
    var day = blocksFor(0);
    var now = new Date(), nowMin = now.getHours()*60 + now.getMinutes();
    var span = DAY_END - DAY_START;
    function pct(min){ return Math.max(0, Math.min(100, ((min - DAY_START) / span) * 100)); }

    var bars = day.blocks.map(function(b){
      var from = Math.max(b.from, DAY_START), to = Math.min(b.to, DAY_END);
      if (to <= from) return '';
      var cls = b.cls === 'study' ? 'hw-study' : b.cls === 'school' ? 'hw-school' : 'hw-quietblk';
      var l = pct(from), w = pct(to) - l;
      return '<div class="hw-blk ' + cls + '" style="left:' + l.toFixed(2) + '%;width:' + w.toFixed(2) + '%">' +
             (w > 11 ? '<span class="hw-cap">' + esc(b.name) + '</span>' : '') + '</div>';
    }).join('');
    var nowM = nowMin < DAY_START ? nowMin + 1440 : nowMin;
    var marker = (nowM >= DAY_START && nowM <= DAY_END)
      ? '<div class="hw-now" style="left:' + pct(nowM).toFixed(2) + '%"></div>' : '';
    $('hwLineBar').innerHTML = bars + marker;
    /* Η ίδια `pct()` που τοποθετεί τα μπλοκ τοποθετεί και τις ώρες, ώστε να
       μην μπορούν να διαφωνήσουν. */
    $('hwTicks').innerHTML = ['10:00','13:00','16:00','19:00','22:00','00:15']
      .map(function(t, i, all){
        var m = hm(t); if (i === all.length - 1) m += 1440;
        return '<span style="left:' + pct(m).toFixed(2) + '%">' + t + '</span>';
      }).join('');
    $('hwDayS').textContent = day.cal === 'live' ? 'από το ημερολόγιο' : 'κατά το πρόγραμμα';

    /* ⭐ ΟΙ ΔΥΟ ΘΕΣΕΙΣ ΕΧΟΥΝ ΔΙΑΦΟΡΕΤΙΚΗ ΔΟΥΛΕΙΑ, ΚΑΙ ΔΕΝ ΑΝΤΑΛΛΑΣΣΟΝΤΑΙ.
       Το ΜΕΓΑΛΟ ΠΑΡΑΘΥΡΟ παίρνει εργασίες + χρέος μνήμης. Το ΞΑΝΑΔΙΑΒΑΣΜΑ
       παίρνει ΤΑ ΣΗΜΕΡΙΝΑ ΤΡΙΑ ΜΑΘΗΜΑΤΑ και τίποτε άλλο: η ίδια προσπάθεια
       αξίζει ~3× την ίδια μέρα σε σχέση με μία εβδομάδα μετά. */
    var free = budget().free;
    var pool = candidates(free).slice(0, 3);
    var morning = pool.length
      ? pool.map(function(c){ return esc(c.kind === 'ladder' ? (c.title + ' · ' + (c.unitLabel || c.unitId)) : (c.unitLabel || '')); }).join('<br>')
      : 'Καθαρά. Δεν χρωστάς τίποτα σε αυτό το παράθυρο.';

    var todayLessons = lessonsFor(0);
    var review;
    if (todayLessons === null){
      review = 'Δεν ξέρω τα σημερινά σου μαθήματα χωρίς το ημερολόγιο — άνοιξέ το και θα γεμίζει μόνο του με τα τρία της μέρας.';
    } else if (!todayLessons.length){
      review = 'Το ημερολόγιο δεν δείχνει μάθημα σήμερα, οπότε δεν υπάρχει τίποτα να ξαναδιαβάσεις απόψε.';
    } else {
      review = todayLessons.map(function(l){ return esc(l.title); }).join('<br>');
    }
    /* Το μάθημα των 15:15 είναι το ΠΡΩΤΟ χρονικά — τα events του GCal.day()
       έρχονται ταξινομημένα. Αν το ημερολόγιο δεν λέει ποιο μάθημα είναι,
       δείχνουμε τον ΤΙΤΛΟ του, όχι κενό. */
    var recapSubj = null;
    if (todayLessons && todayLessons.length){
      var first = todayLessons[0];
      recapSubj = (SUBJ[first.subject] && SUBJ[first.subject].label) || first.title;
    }

    $('hwSlots').innerHTML =
      slot(PLAN.morning[0] + '–' + PLAN.morning[1], 'Το μεγάλο παράθυρο',
           'Εδώ πεθαίνει η δουλειά: εργασίες και χρέος μνήμης.', morning) +
      slot(PLAN.recap[0] + '–' + PLAN.recap[1], 'Η επανάληψη πριν',
           'Το μάθημα των 15:15, μισή ώρα πριν.',
           recapSubj ? esc(recapSubj) : 'Χρειάζεται το ημερολόγιο για να ξέρω ποιο μάθημα έχεις στις 15:15.') +
      slot(PLAN.school[0] + '–' + PLAN.school[1], 'Φροντιστήριο',
           'Εδώ ΓΕΝΝΙΕΤΑΙ η εργασία. Γράψε τη γραμμή πριν βγεις.', '') +
      slot(PLAN.review[0] + '–' + PLAN.review[1], 'Ξαναδιάβασμα',
           'Τα ΣΗΜΕΡΙΝΑ τρία, την ίδια νύχτα. Ποτέ εργασία με προθεσμία.', review);
  }
  function slot(time, name, why, fill){
    return '<div class="hw-slot">' +
      '<div class="hw-slot-hd"><span class="hw-time hw-mono">' + esc(time) + '</span>' +
      '<span class="hw-slot-n">' + esc(name) + '</span></div>' +
      '<div class="hw-fill">' + esc(why) + (fill ? '<br><span style="color:var(--au-ivory,#f5f2ec)">' + fill + '</span>' : '') + '</div>' +
    '</div>';
  }

  /* ── Ο ΟΡΙΖΟΝΤΑΣ · πίεση, όχι ημερολόγιο ─────────────────────────
     Η σύγκρουση ΕΙΝΑΙ το νόημα: όταν τρία πράγματα πέφτουν Πέμπτη, το λέει
     ΔΕΥΤΕΡΑ. Και ποτέ δεν μετακινεί δουλειά μόνο του. */
  function weekLoad(){
    var L = LAD || ladders(), start = midnight(-dowMon(new Date()));
    var days = [], i;
    for (i = 0; i < 7; i++){
      var d = new Date(start); d.setDate(start.getDate() + i);
      days.push({ date:d, key:dkOf(d), segs:[], load:0, items:[] });
    }
    function bucket(key){
      var i2; for (i2 = 0; i2 < 7; i2++) if (days[i2].key === key) return days[i2];
      return null;
    }
    /* ΕΡΓΑΣΙΕΣ: μετρημένος χρόνος όπου υπάρχει· αλλιώς μία μονάδα βάρους που
       λέγεται «ένα πράγμα», ποτέ επινοημένα λεπτά στην οθόνη. */
    taskList().forEach(function(t){
      if (t.done || !t.due) return;
      var b = bucket(t.due); if (!b) return;
      var e = estimate(t.subject, t.kind);
      b.load += (e == null ? 25 : e);
      b.segs.push({ rgb:subjRgb(t.subject), mins:(e == null ? 25 : e) });
      b.items.push((SUBJ[t.subject] || {}).label + ' · ' + (t.title || KINDS[t.kind]));
    });
    /* ΧΡΕΟΣ ΜΝΗΜΗΣ: ό,τι λήγει μέσα στην εβδομάδα. */
    L.stores.forEach(function(s){
      if (!s.ok) return;
      s.items.forEach(function(it){
        if (!it.due || !(it.learned || it.samples > 0)) return;
        var key = dkOf(new Date(it.due));
        var b = bucket(key); if (!b) return;
        b.load += 15;
        b.segs.push({ rgb:subjRgb(s.subject), mins:15 });
        b.items.push(s.label + ' · ανάκληση');
      });
    });
    /* ΔΙΑΓΩΝΙΣΜΑΤΑ από το ημερολόγιο. */
    if (calState() === 'live'){
      for (i = 0; i < 7; i++){
        var off = Math.round((days[i].date - midnight(0)) / 86400000);
        if (off < 0 || off >= (window.GCal ? GCal.DAYS : 7)) continue;
        var ls = lessonsFor(off) || [];
        ls.forEach(function(l){
          if (!l.exam) return;
          days[i].load += 45;
          days[i].segs.push({ rgb:subjRgb(l.subject), mins:45 });
          days[i].items.push('Διαγώνισμα · ' + l.title);
        });
      }
    }
    return days;
  }

  function renderWeek(){
    var days = weekLoad();
    var max = Math.max(60, Math.max.apply(null, days.map(function(d){ return d.load; })));
    var todayKey = today();
    var heaviest = days.slice().sort(function(a,b){ return b.load - a.load; })[0];

    $('hwWeekGrid').innerHTML = days.map(function(d, i){
      var h = Math.round((d.load / max) * 96);
      var segs = d.segs.map(function(sg){
        var sh = Math.max(3, Math.round((sg.mins / Math.max(1, d.load)) * h));
        return '<div class="hw-seg" style="--hw-c:' + sg.rgb + ';height:' + sh + 'px"></div>';
      }).join('');
      var pile = d.items.length >= 3;
      return '<button class="hw-col' + (d.key === todayKey ? ' hw-today' : '') + (pile ? ' hw-pile' : '') +
        '" type="button" data-day="' + i + '">' +
        '<div class="hw-stack">' + segs + '</div>' +
        '<div class="hw-dow">' + DOW_SH[i] + '</div></button>';
    }).join('');

    var say;
    if (!heaviest || !heaviest.items.length){
      say = 'Καμία πίεση αυτή την εβδομάδα — τίποτα με προθεσμία, τίποτα ληξιπρόθεσμο.';
    } else if (heaviest.items.length >= 3 && heaviest.key !== todayKey){
      say = '<b>' + esc(DOW_EL[dowMon(heaviest.date)]) + ': ' + heaviest.items.length + ' πράγματα μαζί.</b> ' +
            'Θέλεις να φέρω το ελαφρύτερο μία μέρα μπροστά;';
    } else {
      say = '<b>' + esc(dayName(dowMon(heaviest.date))) + '</b> είναι η βαρύτερη μέρα: ' + heaviest.items.length +
            (heaviest.items.length === 1 ? ' πράγμα.' : ' πράγματα.');
    }
    $('hwWeekSay').innerHTML = say;

    $('hwWeekGrid').querySelectorAll('[data-day]').forEach(function(b){
      b.addEventListener('click', function(){
        var d = days[+b.getAttribute('data-day')];
        /* Μία γραμμή ανά πράγμα: το `.als-dlg-msg` είναι `white-space: pre-wrap`
           (als-dialog.js:47), οπότε τα newline επιβιώνουν. */
        var body = d.items.length ? d.items.join('\n') : 'Τίποτα με προθεσμία, τίποτα ληξιπρόθεσμο.';
        var head = dayName(dowMon(d.date)) + ' ' + d.date.getDate() + '/' + (d.date.getMonth() + 1);
        if (window.ALSAlert) ALSAlert({ title:head, message:body });
        else alert(head + '\n\n' + body);
      });
    });
  }

  /* ══════════════════════════════════════════════════════════════════
     ΤΟ ΠΑΡΑΘΥΡΟ ΓΡΑΨΙΜΑΤΟΣ — ΓΙΑ ΤΑ ΓΡΑΠΤΑ

     Η μισή του δουλειά είναι ΓΡΑΠΤΗ, δικά του λόγια. Άρα αυτή η σελίδα δεν
     είναι λεπτός δρομολογητής. Το παράθυρο ησυχάζει το περιβάλλον, μετράει
     πραγματικό χρόνο, κρατάει τη ΦΩΤΟΓΡΑΦΙΑ ΤΗΣ ΠΗΓΗΣ ένα πάτημα μακριά, και
     ΣΥΝΕΧΙΖΕΙ από εκεί που έμεινε αντί να ξεκινάει από την αρχή.
     ⛔ ΚΑΜΙΑ ΒΑΘΜΟΛΟΓΙΑ. Δεν υπάρχει αλήθεια εδάφους για το «έγραψα καλή
     έκθεση», και ένα κατασκευασμένο ποσοστό εκεί θα ήταν η ίδια αρρώστια της
     als-v433 σε νέο μέρος. Το «έγινε» είναι γεγονός· οτιδήποτε άλλο θα ήταν
     μαντεψιά ντυμένη αριθμό.
     ══════════════════════════════════════════════════════════════════ */
  var focusId = null, focusStart = 0, focusTimer = null;

  function focusMs(){
    var t = state.tasks[focusId];
    return (t ? (t.elapsed || 0) : 0) + (focusStart ? (Date.now() - focusStart) : 0);
  }
  function paintFocusClock(){
    var ms = focusMs(), s = Math.floor(ms / 1000);
    $('hwFocusClock').textContent = pad2(Math.floor(s / 60)) + ':' + pad2(s % 60);
  }
  function openFocus(id){
    var t = state.tasks[id]; if (!t) return;
    focusId = id; focusStart = Date.now();
    var s = SUBJ[t.subject] || SUBJ.ekthesi;
    $('hwFocusKicker').textContent = s.label + ' · ' + (KINDS[t.kind] || '');
    $('hwFocusTitle').textContent = t.title || s.label;
    var e = estimate(t.subject, t.kind);
    $('hwFocusNote').textContent = (t.elapsed > 60000 ? 'Συνεχίζεις από τα ' + Math.round(t.elapsed / 60000) + '′. ' : '') +
      (e == null ? 'Δεν έχω μετρήσει αρκετές φορές ώστε να πω πόσο παίρνει.' : 'Συνήθως ~' + e + '′.');
    var img = $('hwFocusImg');
    img.classList.add('hw-off'); img.removeAttribute('src');
    $('hwFocusShot').classList.toggle('hw-off', !(t.src && t.src.id && pics[t.src.id]));
    paintFocusClock();
    clearInterval(focusTimer); focusTimer = setInterval(paintFocusClock, 1000);
    $('hwFocus').showModal();
  }
  function stopFocus(markDone){
    var t = focusId ? state.tasks[focusId] : null;
    clearInterval(focusTimer); focusTimer = null;
    if (t){
      t.elapsed = focusMs();
      if (markDone){
        t.done = Date.now();
        if (t.elapsed > 60000) recordSample(t.subject, t.kind, t.elapsed / 60000);
      }
      save();
    }
    focusStart = 0; focusId = null;
    try { $('hwFocus').close(); } catch(e){}
    paint();
  }
  function showPic(pid){
    var p = pics[pid];
    if (!p || !p.d){
      if (window.ALSAlert) ALSAlert('Η φωτογραφία δεν υπάρχει σε αυτή τη συσκευή. Δεν σβήστηκε από εδώ — απλώς δεν έχει κατέβει ακόμη.');
      return;
    }
    var img = $('hwFocusImg');
    img.src = p.d; img.classList.remove('hw-off');
    if (!$('hwFocus').open){
      $('hwFocusKicker').textContent = 'Η πηγή';
      $('hwFocusTitle').textContent = 'Η φωτογραφία, όπως τη τράβηξες';
      $('hwFocusClock').textContent = '';
      $('hwFocusNote').textContent = 'Αποθηκεύεται και φαίνεται. Ποτέ δεν διαβάζεται από μηχανή.';
      $('hwFocus').showModal();
    }
  }

  /* ══════════════════════════════════════════════════════════════════
     Η ΣΥΛΛΗΨΗ
     ══════════════════════════════════════════════════════════════════ */
  var draft = null, draftPic = null;

  function chip(kind, label, value, missing){
    return '<button class="hw-pchip' + (missing ? ' hw-miss' : '') + '" type="button" data-fix="' + kind + '">' +
      '<span class="hw-k">' + esc(label) + '</span>' + esc(value) + '</button>';
  }
  function renderParse(){
    if (!draft){ $('hwParse').classList.remove('hw-open'); return; }
    var u = draft.unit;
    $('hwPchips').innerHTML =
      chip('subject', 'Μάθημα', draft.subject ? SUBJ[draft.subject].label : 'δεν το βρήκα', !draft.subject) +
      chip('unit', 'Ενότητα', u ? (u.id + (u.title ? ' · ' + u.title : '')) : 'καμία', !u) +
      chip('kind', 'Είδος', KINDS[draft.kind] || 'άσκηση', false) +
      chip('due', 'Προθεσμία', draft.due ? fmtDue(draft.due) : 'χωρίς ημερομηνία', !draft.due) +
      chip('title', 'Τίτλος', draft.title || '(κενός)', !draft.title) +
      (draftPic ? chip('pic', 'Πηγή', 'φωτογραφία', false) : '');
    $('hwParse').classList.add('hw-open');
    $('hwPchips').querySelectorAll('[data-fix]').forEach(function(b){
      b.addEventListener('click', function(){ fixChip(b.getAttribute('data-fix')); });
    });
  }
  function cycle(list, cur){
    var i = list.indexOf(cur);
    return list[(i + 1) % list.length];
  }
  function fixChip(which){
    if (!draft) return;
    if (which === 'subject'){ draft.subject = cycle(['istoria','arxaia','latinika','ekthesi'], draft.subject); renderParse(); return; }
    if (which === 'kind'){ draft.kind = cycle(['askisi','apexo','grapto','diagonisma'], draft.kind); renderParse(); return; }
    if (which === 'due'){
      var order = [null, offDate(0), offDate(1), offDate(2), offDate(3), offDate(7)];
      var idx = order.indexOf(draft.due);
      draft.due = order[(idx + 1) % order.length];
      renderParse(); return;
    }
    if (which === 'unit'){
      var units = knownUnits().filter(function(x){ return !draft.subject || x.subject === draft.subject; });
      if (!units.length){ if (window.ALSAlert) ALSAlert('Δεν υπάρχουν ενότητες για αυτό το μάθημα στα δεδομένα της εφαρμογής.'); return; }
      var ids = [null].concat(units.map(function(x){ return x.id; }));
      var cur = draft.unit ? draft.unit.id : null;
      var nxt = ids[(ids.indexOf(cur) + 1) % ids.length];
      draft.unit = nxt ? units.filter(function(x){ return x.id === nxt; })[0] : null;
      if (draft.unit && !draft.subject) draft.subject = draft.unit.subject;
      renderParse(); return;
    }
    if (which === 'title'){
      var ask = window.ALSPrompt ? ALSPrompt('Ο τίτλος, με τα δικά σου λόγια:', draft.title || '') : Promise.resolve(prompt('Τίτλος:', draft.title || ''));
      Promise.resolve(ask).then(function(v){ if (v != null){ draft.title = String(v).trim(); renderParse(); } });
      return;
    }
    if (which === 'pic'){ if (draftPic) showPicData(draftPic); return; }
  }
  function showPicData(dataUrl){
    var img = $('hwFocusImg');
    img.src = dataUrl; img.classList.remove('hw-off');
    $('hwFocusKicker').textContent = 'Η πηγή';
    $('hwFocusTitle').textContent = 'Η φωτογραφία, όπως τη τράβηξες';
    $('hwFocusClock').textContent = '';
    $('hwFocusNote').textContent = 'Αποθηκεύεται και φαίνεται. Ποτέ δεν διαβάζεται από μηχανή.';
    $('hwFocus').showModal();
  }

  function commitDraft(){
    if (!draft) return;
    if (!draft.subject && !draft.title){ banner('Δεν κατάλαβα τίποτα από αυτή τη γραμμή. Πάτα ένα chip και πες μου τι είναι.'); return; }
    var src = null;
    if (draftPic){
      var res = addPic(draftPic);
      if (res.id){
        src = { type:'photo', id:res.id };
        if (res.dropped) banner('Κράτησα τη φωτογραφία και πέταξα ' + res.dropped + ' παλιά που δεν ήταν δεμένη σε εργασία. Το όριο είναι ' + PIC_KEEP + '.');
      }
      /* Αν η φωτογραφία δεν χώρεσε, η ΕΡΓΑΣΙΑ σώζεται όπως και να 'χει — το
         banner ήδη λέει τι έγινε. Ποτέ σιωπηλή απώλεια. */
    }
    var id = addTask({ subject:draft.subject, title:draft.title, due:draft.due, kind:draft.kind, unit:draft.unit, src:src });
    if (!id) return;                                   /* το persist απέτυχε, το banner το λέει */
    draft = null; draftPic = null;
    $('hwLine').value = '';
    $('hwParse').classList.remove('hw-open');
    paint();
  }

  /* ── ΤΟ ΑΔΕΙΑΣΜΑ ΤΟΥ ΚΕΦΑΛΙΟΥ — και μένει χαζό ─────────────────── */
  function runDump(){
    var raw = $('hwDump').value || '';
    var lines = raw.split(/[\n,]+/).map(function(s){ return s.trim(); }).filter(Boolean);
    if (!lines.length) return;
    var made = 0;
    lines.forEach(function(l){
      var p = parseLine(l);
      /* Μια γραμμή που δεν λύνεται γίνεται σκέτη σημείωση με `due: null` —
         που είναι μια χαρά, γιατί μια σκέψη που γράφτηκε αξίζει περισσότερο
         από μια οργανωμένη που δεν γράφτηκε ποτέ. */
      if (!p.title && !p.subject) p.title = l;
      if (addTask({ subject:p.subject, title:p.title || l, due:p.due, kind:p.kind, unit:p.unit })) made++;
    });
    $('hwDump').value = '';
    $('hwDumpWrap').classList.add('hw-off');
    banner(made ? ('Κράτησα ' + made + (made === 1 ? ' γραμμή. Έλεγξέ τες — ό,τι δεν κατάλαβα έμεινε σημείωση.' : ' γραμμές. Έλεγξέ τες — ό,τι δεν κατάλαβα έμεινε σημείωση.')) : '');
    paint();
  }

  /* ══════════════════════════════════════════════════════════════════
     ΚΑΛΩΔΙΩΣΗ
     ══════════════════════════════════════════════════════════════════ */
  function paint(){
    var b = renderClock();
    renderDebt();
    renderStart(b.free);
    renderTasks();
    renderDay();
    renderWeek();
    $('hwFoot').innerHTML =
      'Διαβάζει και τις πέντε σκάλες μελέτης· γράφει ΜΟΝΟ τις δικές του εργασίες.<br>' +
      'Καμία μηχανή δεν διαβάζει τις φωτογραφίες σου εδώ — η μεταγραφή γίνεται στη συζήτηση, μπροστά σου.';
  }

  $('hwLine').addEventListener('input', function(){
    var v = $('hwLine').value.trim();
    if (!v){ draft = null; $('hwParse').classList.remove('hw-open'); return; }
    draft = parseLine(v);
    renderParse();
  });
  $('hwLine').addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ e.preventDefault(); if (draft) commitDraft(); }
  });
  $('hwSave').addEventListener('click', commitDraft);
  $('hwCancel').addEventListener('click', function(){
    draft = null; draftPic = null; $('hwLine').value = ''; $('hwParse').classList.remove('hw-open');
  });
  $('hwShot').addEventListener('click', function(){ $('hwFile').click(); });
  $('hwFile').addEventListener('change', function(){
    var f = $('hwFile').files && $('hwFile').files[0];
    $('hwFile').value = '';
    if (!f) return;
    shrink(f, function(data, err){
      if (err){ banner(err); return; }
      draftPic = data;
      if (!draft) draft = parseLine($('hwLine').value || '');
      renderParse();
      banner('');
    });
  });
  $('hwDumpOpen').addEventListener('click', function(){ $('hwDumpWrap').classList.toggle('hw-off'); });
  $('hwDumpClose').addEventListener('click', function(){ $('hwDumpWrap').classList.add('hw-off'); });
  $('hwDumpGo').addEventListener('click', runDump);
  $('hwSweep').addEventListener('click', function(){
    var ask = window.ALSConfirm
      ? ALSConfirm({ title:'Να σβήσω όσες έχουν γίνει;',
                     message:'Φεύγουν από εδώ και από το cloud. Οι σκάλες μελέτης δεν αγγίζονται.',
                     confirmText:'Σβήσ’ τες', danger:true })
      : Promise.resolve(confirm('Να σβήσω όσες έχουν γίνει;'));
    Promise.resolve(ask).then(function(yes){ if (!yes) return; var n = sweepDone(); if (n) banner(''); paint(); });
  });
  $('hwFocusDone').addEventListener('click', function(){ stopFocus(true); });
  $('hwFocusPause').addEventListener('click', function(){ stopFocus(false); });
  $('hwFocusClose').addEventListener('click', function(){ stopFocus(false); });
  $('hwFocusShot').addEventListener('click', function(){
    var t = focusId ? state.tasks[focusId] : null;
    if (t && t.src && t.src.id) showPic(t.src.id);
  });
  $('hwFocus').addEventListener('close', function(){
    if (focusTimer){ clearInterval(focusTimer); focusTimer = null; }
    if (focusId) stopFocus(false);
  });

  /* Η μέρα κυλάει ενώ η σελίδα είναι ανοιχτή: ο δείκτης ΤΩΡΑ και ο χρόνος
     που μένει ξαναζωγραφίζονται μόνοι τους. Καμία επανάληψη εισόδου —
     `PageMotion` σκανάρει ΜΟΝΟ τα στατικά κελύφη των ενοτήτων, ώστε ένα
     repaint να μην ξαναπαίζει ποτέ animation εισόδου. */
  reload();
  paint();
  setInterval(function(){ if (!document.hidden) paint(); }, 60000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden){ reload(); paint(); } });
  window.addEventListener('focus', function(){ reload(); paint(); });

  /* Το ημερολόγιο ανανεώνεται σιωπηλά αν έχει ήδη δοθεί άδεια σε αυτή τη
     συσκευή. Αν όχι, ΔΕΝ ζητάμε τίποτα — η άδεια θέλει κλικ, και η σελίδα
     λέει καθαρά ότι δουλεύει με το πρόγραμμα. */
  try { if (window.GCal && GCal.isConnected()) GCal.refresh(function(){ paint(); }); } catch(e){}

  /* ══════════════════════════════════════════════════════════════════
     CLOUD SYNC
     ⚠️ Η αναμονή είναι στις ΠΡΟΫΠΟΘΕΣΕΙΣ, και το initCloudSync καλείται
     ΑΚΡΙΒΩΣ ΜΙΑ ΦΟΡΑ: το initCloudSync ΕΠΙΣΤΡΕΦΕΙ ΣΙΩΠΗΛΑ όταν το
     `window.supabase` δεν υπάρχει ακόμη, και μια δεύτερη επιτυχημένη κλήση
     αλυσιδώνει δεύτερο override του setItem πάνω στην ίδια σελίδα.
     Αν δεν ξεκινήσει ποτέ, το λέμε στην οθόνη (σταθερή αρχή 32).
     ══════════════════════════════════════════════════════════════════ */
  (function startCloudSync(){
    var tries = 0;
    (function wait(){
      if (typeof window.initCloudSync !== 'function' || !window.supabase){
        if (tries++ < 100){ setTimeout(wait, 200); return; }
        banner('Ο συγχρονισμός δεν ξεκίνησε — ό,τι γράψεις μένει μόνο σε αυτή τη συσκευή. Κλείσε και άνοιξε ξανά την εφαρμογή.');
        return;
      }
      window.initCloudSync({
        /* ⚠️ ΓΡΑΜΜΕΝΟ ΚΥΡΙΟΛΕΚΤΙΚΑ, ΕΠΙΤΗΔΕΣ — ΚΑΙ ΤΟ ΣΧΟΛΙΟ ΔΕΝ ΕΠΙΤΡΕΠΕΤΑΙ
           ΝΑ ΓΡΑΨΕΙ ΤΟ ΣΧΗΜΑ ΠΟΥ ΠΕΡΙΓΡΑΦΕΙ. Ο φρουρός του smoke-test.sh που
           ελέγχει ότι κάθε συγχρονισμένο κλειδί υπάρχει στα BUNDLES του
           backup.html ψάχνει το ΠΡΩΤΟ κυριολεκτικό appKey μέσα σε 1200
           χαρακτήρες από εδώ. Μια σταθερά κάνει τον έλεγχο να προσπεράσει
           ΣΙΩΠΗΛΑ όλη τη σελίδα — και τότε τα `hw:*` θα συγχρονίζονταν τέλεια
           και δεν θα επαναφέρονταν ΠΟΤΕ από αντίγραφο ασφαλείας.
           ⚠️ Η πρώτη γραφή αυτού του σχολίου έγραφε το ίδιο το μοτίβο μέσα
           στα εισαγωγικά, ο φρουρός το διάβασε ΑΝΤΙ για τη γραμμή από κάτω,
           και κατηγόρησε μια σελίδα που ήταν σωστή: σταθερή αρχή 19, ένας
           φρουρός που τρώει το σχόλιο που τον τεκμηριώνει.
           Το `tests/homework-plan.test.js` απαιτεί να συμφωνεί με το APP. */
        appKey: 'homework',
        syncedKeys: [KEY, PKEY],
        onApplied: function(){
          /* Ξαναδιάβασε ΠΡΙΝ γράψει οτιδήποτε, αλλιώς μια εισερχόμενη
             συγχώνευση χάνεται από παλιό αντίγραφο στη μνήμη. */
          reload();
          if (!focusId) paint();
        }
      });
      /* Το ALSSync δημοσιεύεται ΣΥΓΧΡΟΝΑ από το initCloudSync, άρα η απουσία
         του σημαίνει ότι η κλήση βγήκε σε κάτι που δεν το φτιάχνει retry. */
      if (!window.ALSSync) banner('Ο συγχρονισμός δεν ξεκίνησε — ό,τι γράψεις μένει μόνο σε αυτή τη συσκευή. Κλείσε και άνοιξε ξανά την εφαρμογή.');
    })();
  })();

})();
</script>
</body>
</html>
