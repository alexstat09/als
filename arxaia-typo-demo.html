<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Αρχαία · Γνωστό — δοκιμή τυπογραφίας</title>

<!-- ⛔ ΚΑΝΕΝΑ script του app εδώ (ούτε sync.js, ούτε topbar, ούτε πύλη login).
     Είναι ΑΠΟΜΟΝΩΜΕΝΟ demo: μόνο κείμενο και CSS, ώστε να κρίνεται ΜΟΝΟ η
     τυπογραφία και να μην μπορεί να γράψει τίποτα πουθενά. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Alegreya:ital,wght@0,400;0,500;1,400&display=swap">

<style>
:root{
  --canvas:#060607;
  --iv:245,242,236;
  --amber:242,192,99;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  /* Η ΣΗΜΕΡΙΝΗ: GFS Didot — γραμματοσειρά ΤΙΤΛΩΝ, με πολύ λεπτές γραμμές. */
  --gr-now:"GFS Didot","Times New Roman",Times,serif;
  /* Η ΠΡΟΤΑΣΗ: Alegreya — σχεδιασμένη για ΣΩΜΑ κειμένου, 233/233 πολυτονικά. */
  --gr-next:"Alegreya","GFS Didot","Times New Roman",Times,serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:rgba(var(--iv),.9);
  font-family:var(--sans);-webkit-font-smoothing:antialiased;}

/* ── ο ΔΙΑΚΟΠΤΗΣ ────────────────────────────────────────────────── */
.bar{position:sticky;top:0;z-index:9;background:rgba(6,6,7,.94);
  border-bottom:1px solid rgba(255,255,255,.06);}
.bar .in{max-width:1240px;margin:0 auto;padding:16px 40px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.bar .lbl{font-size:10px;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;color:rgba(var(--iv),.56);}
.sw{display:flex;gap:6px;padding:4px;border-radius:12px;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);}
.sw button{appearance:none;border:0;background:none;cursor:pointer;
  font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.04em;
  color:rgba(var(--iv),.62);padding:8px 18px;border-radius:9px;}
.sw button.on{background:rgba(var(--amber),.16);color:rgba(var(--amber),1);}
.sw button:focus-visible{outline:2px solid rgba(var(--amber),.6);outline-offset:2px;}
.note{font-size:12.5px;line-height:1.55;color:rgba(var(--iv),.62);
  max-width:62ch;margin-left:auto;}

.wrap{max-width:1240px;margin:0 auto;padding:38px 40px 140px;}

/* ── επικεφαλίδα ενότητας ───────────────────────────────────────── */
.sh{display:flex;align-items:baseline;gap:16px;margin:54px 0 8px;}
.sh:first-child{margin-top:8px;}
.sh .t{flex:0 0 auto;}
.sh .r{flex:1 1 auto;height:1px;background:rgba(255,255,255,.08);}
.sh h2{margin:0 0 30px;font-weight:400;font-size:25px;line-height:1.28;
  color:rgba(var(--iv),.94);max-width:34ch;}

/* ── η ΠΕΡΙΟΔΟΣ: αρχαίο | μετάφραση ─────────────────────────────── */
.per{display:grid;align-items:start;}
.per + .per{margin-top:26px;padding-top:26px;
  border-top:1px solid rgba(255,255,255,.05);}
.n{grid-column:1/-1;margin:0 0 10px;line-height:1;}
.a,.m{padding:0;margin:0;}
.k{cursor:pointer;border-radius:5px;padding:1px 2px;margin:0 -2px;
  transition:background .15s ease,color .15s ease;}
.k.on{background:rgba(var(--amber),.22);color:rgba(var(--amber),1);}
.x{color:inherit;}
/* ⛔ ΤΟ `.x` ΔΕΝ ΞΕΘΩΡΙΑΖΕΙ. Το είχα γράψει `opacity:.55` και το render το
   έδειξε αμέσως: οι λέξεις χωρίς ζευγάρι («μὲν», «καὶ», «γι’ αυτό») έπεφταν
   στο ~3,6:1 μέσα στην ίδια πρόταση — δηλαδή ΑΚΡΙΒΩΣ η αρρώστια της
   als-v523 σε νέο μέρος. Το ποια λέξη έχει ζευγάρι φαίνεται στο ΚΛΙΚ,
   ποτέ μόνιμα με χαμηλή αντίθεση. */

/* ══ ΤΩΡΑ — οι ΑΚΡΙΒΕΙΣ τιμές της ζωντανής arxaia.html ═══════════ */
body.v-now .per{grid-template-columns:1.34fr .86fr;column-gap:56px;}
body.v-now .a{font-family:var(--gr-now);font-size:19px;line-height:1.95;
  color:rgba(var(--iv),.82);}                    /* 12.07:1 — ΠΙΟ ΑΧΝΟ απ' τη μετάφραση */
body.v-now .m{font-family:var(--gr-now);font-size:17px;line-height:1.82;
  color:rgba(var(--iv),1);}                      /* 18.13:1 — το ΒΟΗΘΗΜΑ λάμπει πιο πολύ */
body.v-now .n{font-family:var(--gr-now);font-size:13px;color:rgba(var(--iv),.5);}
body.v-now .sh .t{font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:.26em;text-transform:uppercase;color:rgba(var(--iv),.5);}
/* Το --au-serif λύνεται σε Instrument Serif, που έχει 0 ελληνικά γλυφά —
   άρα ΣΗΜΕΡΑ ο τίτλος πέφτει στη Georgia. Εδώ φαίνεται όπως ΟΝΤΩΣ φαίνεται. */
body.v-now .sh h2{font-family:"Instrument Serif",Georgia,serif;}

/* ══ ΜΕΤΑ — 6 τιμές αλλάζουν, τίποτε άλλο ═══════════════════════ */
body.v-next .per{grid-template-columns:1fr 1fr;column-gap:44px;}
body.v-next .a{font-family:var(--gr-next);font-size:18px;line-height:1.62;
  color:rgba(var(--iv),1);}                      /* 18.13:1 — ΤΟ ΚΕΙΜΕΝΟ μπροστά */
body.v-next .m{font-family:var(--gr-next);font-size:18px;line-height:1.62;
  color:rgba(var(--iv),.74);}                    /* 9.86:1 — καθαρό, αλλά ένα σκαλί πίσω */
body.v-next .n{font-family:var(--sans);font-size:11px;font-weight:600;
  letter-spacing:.12em;color:rgba(var(--iv),.5);}
body.v-next .sh .t{font-family:var(--sans);font-size:11px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:rgba(var(--iv),.5);}
body.v-next .sh h2{font-family:var(--gr-next);}

/* ⛔ ΚΑΝΕΝΑ min-width πουθενά: μετράει το viewport, όχι ο γονέας, και σε
   λάπτοπ γεννάει στήλες των 280px. Μόνο max-width. */
@media (max-width:880px){
  .bar .in,.wrap{padding-left:20px;padding-right:20px;}
  body.v-now .per,body.v-next .per{grid-template-columns:1fr;column-gap:0;}
  body.v-now .m,body.v-next .m{margin-top:13px;padding-top:13px;
    border-top:1px solid rgba(255,255,255,.05);}
}
</style>
</head>

</div></div>

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  /* ⚠️ ΤΟ ΚΛΕΙΔΙ ΠΑΙΡΝΕΙ ΜΠΡΟΣΤΑ ΤΗΝ ΕΝΟΤΗΤΑ. Τα `k1/k2/a1…` ξαναρχίζουν
     από την αρχή σε ΚΑΘΕ ενότητα, και εδώ — σε αντίθεση με τη ζωντανή
     σελίδα, που ανοίγει μία τη φορά — στέκονται δύο μαζί στο DOM. Χωρίς
     το πρόθεμα, ένα κλικ άναβε 4 λέξεις αντί για 2: μετρήθηκε στο render,
     δεν το είπε καμία βεβαίωση. */
  function side(u, sg, k){
    return sg[k].map(function(t){
      if (!t[1]) return '<span class="x">' + esc(t[0]) + '</span>';
      return '<span class="k" data-k="' + esc(u.id + ':' + t[1]) + '">' +
        esc(t[0]) + '</span>';
    }).join('');
  }

  document.getElementById('stage').innerHTML = DATA.map(function(u){
    return '<div class="sh"><span class="t">' + esc(u.id.toUpperCase()) +
        ' · ' + u.segs.length + ' περίοδοι</span><span class="r"></span></div>' +
      '<h2>' + esc(u.title) + '</h2>' +
      u.segs.map(function(sg){
        return '<div class="per">' +
          '<div class="n">' + sg.n + '</div>' +
          '<div class="a">' + side(u, sg, 'a') + '</div>' +
          '<div class="m">' + side(u, sg, 'm') + '</div></div>';
      }).join('');
  }).join('');

  /* ⚠️ ΕΝΑΣ delegated ακροατής, γραμμένος ΜΙΑ φορά, έξω από κάθε συνάρτηση
     που ξανατρέχει — η παγίδα της als-v522 ήταν ακριβώς το αντίθετο. */
  var lit = null;
  document.getElementById('stage').addEventListener('click', function(e){
    var el = e.target.closest ? e.target.closest('.k') : null;
    if (!el) return;
    var key = el.getAttribute('data-k'), i;
    var was = document.querySelectorAll('.k.on');
    for (i = 0; i < was.length; i++) was[i].classList.remove('on');
    if (lit === key){ lit = null; return; }
    var now = document.querySelectorAll('.k[data-k="' + key + '"]');
    for (i = 0; i < now.length; i++) now[i].classList.add('on');
    lit = key;
  });

  var NOTES = {

  };
  var btns = document.querySelectorAll('.sw button'), note = document.getElementById('note');
  function setV(v){
    document.body.className = 'v-' + v;
    for (var i = 0; i < btns.length; i++)
      btns[i].classList.toggle('on', btns[i].getAttribute('data-v') === v);
    note.textContent = NOTES[v];
  }
  for (var i = 0; i < btns.length; i++)
    btns[i].addEventListener('click', function(){ setV(this.getAttribute('data-v')); });
  /* Το hash είναι ο δρόμος: #now / #next, ώστε να στέλνεται σύνδεσμος
     κατευθείαν στη μία εκδοχή (και να τη βγάζει και το headless render). */
  var h = (location.hash || '').replace('#','');
  setV(h === 'now' ? 'now' : 'next');
  window.addEventListener('hashchange', function(){
    var v = (location.hash || '').replace('#','');
    setV(v === 'now' ? 'now' : 'next');
  });
