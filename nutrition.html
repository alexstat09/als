<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- so an "Add to Home Screen" of THIS page gets its own "Nutrition" icon
       that opens straight here, full-screen -->
  <meta name="apple-mobile-web-app-title" content="Nutrition">
  <title>Nutrition · MÉTRON</title>
  <meta name="theme-color" content="#0B0F17">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="aurora.css">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&family=Literata:ital,opsz,wght@1,7..72,400;1,7..72,500&display=swap">
  <script src="water.js"></script>
  <script src="topbar.js" defer></script>
  <script>window.__pmAutoSel='.card,.hero-sum';</script>
  <script src="page-motion.js" defer></script>
  <style>
    /* ════ NUTRITION — the approved redesign (artifact MDMNQWkTNXJ1Anr2Gfxw48, 28/10/26) ════
       Midnight ground · ΤΟ ΕΞΩΦΥΛΛΟ order (route → cover → strip → body → week → months → targets).
       Laptop first; the phone COLLAPSES it with max-width only (σταθ. 51). Data paths untouched. */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    :root{
      --nu:232,178,92;   /* the one accent (amber) — every legacy rgb(var(--nu)) in the sheets now reads amber */
      --bg:oklch(13.2% .022 258);--surf:oklch(16.4% .022 258);--surf2:oklch(19.5% .022 258);--surf3:oklch(23% .022 258);
      --metal-hi:oklch(44% .013 258);--metal-lo:oklch(25% .014 258);--edge:inset 0 1px 0 rgba(255,255,255,.08);
      --text:#EDE6D8;--soft:#C9C2B5;--muted:#A7A196;--faint:#8A8C94;
      --line:rgba(237,230,216,.07);--line2:rgba(237,230,216,.12);--line3:rgba(237,230,216,.2);
      --amber:#E8B25C;--late:#E8836F;--p:#9DB3EC;--c:#8FC2AC;--f:#E8A07F;--fib:#D3A6D6;
      --serif:'Instrument Serif',Georgia,serif;--it:'Literata',Georgia,serif;
      --sans:'Commissioner',-apple-system,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
      --ease:cubic-bezier(.16,1,.3,1);
    }
    html,body{min-height:100%;background:var(--bg);}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding:0 0 calc(92px + env(safe-area-inset-bottom));}
    button{font-family:inherit;color:inherit;}
    .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);font-weight:400;}
    .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:1px;}

    .pg{max-width:1180px;margin:0 auto;padding:30px 40px 40px;}
    /* 1 · route */
    .route{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:26px;}
    .route .lbl b{color:var(--soft);font-weight:500;}
    .datenav{display:flex;align-items:center;gap:6px;}
    .datenav button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);background:none;color:var(--soft);font-size:17px;cursor:pointer;transition:background .15s,transform .1s;}
    .datenav button:hover{background:var(--surf2);}
    .datenav button:active{transform:scale(.96);}
    .datenav-mid{display:flex;flex-direction:column;align-items:center;min-width:132px;}
    .datenav-lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text);}
    .datenav .datenav-today{width:auto;height:auto;border:0;padding:3px 6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);background:none;}
    .route-r{display:flex;align-items:center;gap:14px;}
    .add-btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:0;background:var(--amber);color:#1a1408;font-weight:600;font-size:14px;cursor:pointer;transition:transform .12s,filter .15s;}
    .add-btn:hover{filter:brightness(1.06);}
    .add-btn:active{transform:scale(.97);}
    .add-btn kbd{font-family:var(--mono);font-size:10px;opacity:.6;}
    /* 2 · cover */
    .cover{display:grid;grid-template-columns:1fr auto;align-items:end;gap:40px;padding-bottom:34px;border-bottom:1px solid var(--line2);}
    .cover h1{font-family:var(--serif);font-weight:400;font-size:100px;line-height:.9;letter-spacing:-.01em;}
    .lead{font-family:var(--it);font-style:italic;font-size:21px;line-height:1.45;color:var(--soft);max-width:620px;margin-top:18px;}
    .lead b{color:var(--text);font-weight:500;font-style:italic;}
    .face{text-align:right;}
    .face-n{font-family:var(--serif);font-size:96px;line-height:.85;color:var(--amber);}
    .face-n.over{color:var(--late);} .face-n.none{color:var(--faint);}
    .face .lbl{margin-top:10px;}
    .nu-streak{display:block;margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--soft);letter-spacing:.08em;}
    .nu-streak b{color:var(--text);font-weight:700;}
    /* 3 · strip */
    .card{position:relative;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.008));}
    .strip{margin-top:30px;display:grid;grid-template-columns:330px 1fr;border-radius:16px;}
    .strip>div{padding:24px 28px;min-width:0;}
    .strip>div+div{border-left:1px solid var(--line);}
    .big{font-family:var(--serif);font-size:58px;line-height:1;margin-top:10px;}
    .big small{font-size:24px;color:var(--muted);}
    .sum-kcal{display:inline-block;}
    .sub{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.5;}
    .sub b{color:var(--text);font-weight:600;}
    .track{height:10px;border-radius:6px;background:var(--surf2);display:flex;overflow:hidden;gap:2px;margin:8px 0 18px;}
    .track i{display:block;height:100%;transition:flex-basis .6s var(--ease);}
    .macros{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}
    .mac-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
    .mac-name{font-size:13.5px;color:var(--soft);white-space:nowrap;}
    .mac-val{font-family:var(--mono);font-size:13px;color:var(--text);white-space:nowrap;}
    .mac-val span{color:var(--faint);}
    .mac-track{height:5px;border-radius:3px;background:var(--surf3);margin-top:9px;overflow:hidden;}
    .mac-fill{display:block;height:100%;border-radius:3px;transform-origin:left;}
    .mac-left{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:7px;letter-spacing:.06em;text-transform:uppercase;}
    /* 4 · body */
    .body{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px;margin-top:62px;align-items:start;}
    .sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px;}
    .sh h2{font-family:var(--it);font-style:italic;font-weight:400;font-size:34px;letter-spacing:-.01em;}
    #diary{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .meal{padding:20px 20px 16px;display:flex;flex-direction:column;min-height:262px;min-width:0;}
    .meal-hdr{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px;}
    .meal-name{font-family:var(--serif);font-weight:400;font-size:31px;line-height:1;}
    .meal-kcal{font-family:var(--serif);font-size:31px;line-height:1;white-space:nowrap;}
    .meal-kcal small{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.14em;margin-left:4px;}
    .meal-kcal.none{color:var(--faint);}
    .meal-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:6px;}
    .meal-tools{display:flex;gap:4px;flex:none;}
    .meal-tools .meal-move,.meal-tools .meal-copy{width:32px;height:32px;border-color:transparent;color:var(--faint);}
    .meal-tools .meal-move:hover,.meal-tools .meal-copy:hover{color:var(--text);}
    .entry{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;touch-action:pan-y;will-change:transform;transition:background-color .15s;}
    .entry:hover{background:rgba(255,255,255,.015);}
    .entry.sw-anim{transition:transform .2s ease,background-color .2s ease,opacity .2s ease;}
    .entry-main{flex:1;min-width:0;}
    .entry-name{font-size:14px;color:var(--text);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .entry-g{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:6px;}
    .entry-sub{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:2px;}
    .entry-sub b{color:var(--p);font-weight:500;}
    .entry-kcal{font-family:var(--mono);font-size:12.5px;color:var(--soft);flex:none;min-width:34px;text-align:right;}
    .entry-move,.entry-del{flex:none;width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--faint);display:grid;place-items:center;cursor:pointer;font-size:12px;transition:color .15s,background .15s;}
    .entry-move svg{width:14px;height:14px;}
    .entry-move:hover,.entry-del:hover{background:var(--surf2);color:var(--text);}
    .entry-del:hover{color:var(--late);}
    .grp-hdr{background:rgba(232,178,92,.035);}
    .grp-hdr .entry-name{color:var(--text);}
    .grp-chev{flex:none;width:12px;color:var(--amber);font-size:12px;line-height:1;text-align:center;transition:transform .18s var(--ease);}
    .grp-hdr.open .grp-chev{transform:rotate(90deg);}
    .grp-items{animation:nuFade .22s var(--ease);}
    .grp-items .entry{padding-left:22px;}
    .grp-items .entry-name{color:var(--soft);}
    .meal-empty{flex:1;display:flex;flex-direction:column;justify-content:center;padding:6px 0;}
    .meal-empty .fact{font-family:var(--serif);font-size:54px;line-height:1;color:var(--amber);}
    .meal-empty p{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.5;max-width:320px;}
    .meal-make{display:block;width:100%;margin-top:10px;text-align:left;background:none;border:1px dashed var(--line3);color:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;cursor:pointer;}
    .meal-make:hover{border-color:rgba(232,178,92,.45);color:var(--text);}
    .meal-foot{margin-top:auto;padding-top:14px;display:flex;gap:8px;align-items:center;}
    .meal-usual{flex:1;display:flex;gap:8px;min-width:0;}
    .usual-go,.usual-set-link{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px dashed var(--line3);border-radius:10px;background:none;font-size:13px;color:var(--soft);cursor:pointer;text-align:left;transition:border-color .15s,background .15s,transform .1s;}
    .usual-go span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .usual-go em,.usual-set-link em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto;white-space:nowrap;}
    .usual-go.go{border-style:solid;border-color:rgba(232,178,92,.45);color:var(--text);background:rgba(232,178,92,.06);}
    .usual-go.go em{color:var(--amber);}
    .usual-go:active,.usual-set-link:active{transform:scale(.98);}
    .usual-set-link{color:var(--muted);}
    .usual-edit,.meal-move,.meal-copy,.meal-add{flex:none;width:40px;height:40px;border:1px solid var(--line2);border-radius:10px;background:none;display:grid;place-items:center;color:var(--soft);font-size:17px;cursor:pointer;transition:background .15s,transform .1s;}
    .meal-move svg{width:15px;height:15px;}
    .meal-copy{font-size:14px;}
    .usual-edit:hover,.meal-move:hover,.meal-copy:hover,.meal-add:hover{background:var(--surf2);}
    .usual-edit:active,.meal-move:active,.meal-copy:active,.meal-add:active{transform:scale(.96);}
    .meal-add{color:var(--text);}
    /* side */
    .side{display:flex;flex-direction:column;gap:14px;position:sticky;top:20px;}
    .side .card{padding:20px;}
    .now{font-family:var(--it);font-style:italic;font-size:19px;line-height:1.45;color:var(--text);margin-top:10px;}
    .now-goto{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;}
    .now-goto-t{flex:1;min-width:0;font-size:13.5px;color:var(--soft);line-height:1.45;}
    .now-goto-t b{color:var(--text);font-weight:600;}
    .small-btn{flex:none;height:38px;padding:0 14px;border-radius:10px;border:0;background:var(--amber);color:#1a1408;font-size:13.5px;font-weight:600;cursor:pointer;}
    .small-btn:active{transform:scale(.97);}
    .mic{display:grid;gap:11px;margin-top:14px;}
    .mic-row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--soft);padding-bottom:10px;border-bottom:1px solid var(--line);}
    .mic-row:last-child{border-bottom:0;padding-bottom:0;}
    .mic-row span{font-family:var(--mono);font-size:12.5px;color:var(--text);}
    .mic-row span small{color:var(--faint);font-size:11px;}
    .water-hd{display:flex;justify-content:space-between;align-items:baseline;}
    .water-hd span{font-family:var(--mono);font-size:12.5px;}
    .water-hd small{color:var(--faint);}
    .water{display:flex;gap:5px;margin-top:14px;}
    .water i{flex:1;height:30px;border-radius:5px;border:1px solid var(--line2);}
    .water i.f{background:linear-gradient(180deg,#9DB3EC,#6f87c4);border-color:transparent;box-shadow:var(--edge);}
    .water-link{display:inline-block;margin-top:12px;font-size:13px;color:var(--soft);text-decoration:none;border-bottom:1px solid var(--line3);padding-bottom:1px;}
    /* 5 · week */
    .sec{margin-top:66px;}
    .wk{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;align-items:end;height:200px;padding:0 4px;border-bottom:1px solid var(--line2);}
    .wk-col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border:0;background:none;cursor:pointer;padding:0;}
    .wk-col[disabled]{cursor:default;}
    .wk-val{font-family:var(--mono);font-size:12px;color:var(--soft);margin-bottom:6px;}
    .wk-tgt{position:absolute;left:8%;right:8%;border-top:1px dashed var(--line3);pointer-events:none;}
    .wk-bar{width:84%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--metal-hi),var(--metal-lo));box-shadow:var(--edge);transform-origin:bottom;transition:filter .15s;}
    .wk-col:hover .wk-bar{filter:brightness(1.15);}
    .wk-col.on .wk-bar{background:linear-gradient(180deg,var(--amber),oklch(60% .08 62));box-shadow:0 0 18px rgba(232,178,92,.18);}
    .wk-col.on .wk-val{color:var(--amber);}
    .wk-col.plan .wk-bar{background:none;border:1px dashed var(--line3);box-shadow:none;}
    .wk-col.plan .wk-val,.wk-col.miss .wk-val{color:var(--faint);}
    .wk-col.miss .wk-bar{height:3px!important;background:var(--surf3);box-shadow:none;}
    .wkl{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;padding:10px 4px 0;text-align:center;}
    .wkl div{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--faint);}
    .wkl div.on{color:var(--amber);}
    .wkl small{display:block;letter-spacing:.06em;margin-top:4px;font-size:10px;}
    .cap2{display:flex;gap:40px;margin-top:22px;align-items:baseline;}
    .cap2 .big{font-size:46px;margin:0;}
    .cap2 .big.over{color:var(--late);}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
    .mon{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:150px;margin-top:8px;}
    .mon>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;}
    .mon-v{font-family:var(--mono);font-size:13px;color:var(--soft);margin-bottom:6px;}
    .mon-c{width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--metal-hi),var(--metal-lo));box-shadow:var(--edge);transform-origin:bottom;}
    .mon .cur .mon-c{background:linear-gradient(180deg,var(--amber),oklch(60% .08 62));box-shadow:0 0 18px rgba(232,178,92,.18);}
    .mon .cur .mon-v{color:var(--amber);}
    .mon .nil .mon-c{background:var(--surf3);box-shadow:none;}
    .mon .nil .mon-v{color:var(--faint);}
    .mon-m{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--faint);margin-top:8px;}
    .cal{display:grid;grid-template-columns:repeat(15,1fr);gap:5px;margin-top:8px;}
    .cal i{aspect-ratio:1;border-radius:4px;background:var(--surf3);}
    .cal i.s3{background:rgba(143,194,172,.6);} .cal i.s2{background:rgba(143,194,172,.3);} .cal i.s1{background:rgba(232,178,92,.5);}
    .cal i.t{outline:1px solid var(--amber);outline-offset:1px;}
    .legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:12.5px;color:var(--muted);}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;margin-top:18px;}
    .stats>div{padding:12px 14px;}
    .stats>div+div{border-left:1px solid var(--line);}
    .stats b{display:block;font-family:var(--serif);font-weight:400;font-size:28px;line-height:1;}
    .stats span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:6px;}
    /* 6 · targets */
    .goal-seg-wrap{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line2);border-radius:10px;padding:3px;gap:3px;max-width:420px;}
    .goal-seg{height:38px;border:0;border-radius:7px;background:none;font-size:13.5px;color:var(--muted);cursor:pointer;transition:background .2s,color .2s;}
    .goal-seg.on{background:var(--surf3);color:var(--text);box-shadow:var(--edge);}
    .en-rate{font-size:13.5px;color:var(--muted);margin-top:12px;}
    .tg{display:grid;grid-template-columns:repeat(5,1fr);margin-top:18px;}
    .tg>div{padding:18px 20px;min-width:0;}
    .tg>div+div{border-left:1px solid var(--line);}
    .tg-n{font-family:var(--serif);font-size:38px;line-height:1;margin-top:8px;}
    .tg-n small{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:3px;}
    .tg-x{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.45;}
    .en-edit{background:none;border:0;border-bottom:1px solid var(--line3);padding:0 0 2px;font-size:13.5px;color:var(--soft);cursor:pointer;}
    .en-edit:hover{color:var(--text);}
    .en-note{font-size:13.5px;color:var(--muted);margin-top:12px;line-height:1.5;max-width:640px;}
    .nu-tools{display:flex;gap:10px;margin-top:40px;flex-wrap:wrap;}
    .nu-tool{display:flex;align-items:center;gap:10px;text-decoration:none;padding:12px 16px;border-radius:12px;border:1px solid var(--line);min-width:240px;transition:background .15s;}
    .nu-tool:hover{background:var(--surf);}
    .nu-tool-ic{color:var(--amber);flex:none;}
    .nu-tool-ic svg{width:18px;height:18px;display:block;}
    .nu-tool-t{display:block;color:var(--text);font-size:13.5px;font-weight:500;}
    .nu-tool-s{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;}

    /* ════ the windows ════ */
    dialog.nu-sheet,dialog.nu-move{position:fixed;inset:0;margin:auto;padding:0;border:1px solid var(--line2);border-radius:18px;background:var(--surf);color:var(--text);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55),var(--edge);}
    dialog.nu-sheet{width:min(720px,calc(100% - 32px));max-width:min(720px,calc(100% - 32px));height:min(780px,88dvh);max-height:88dvh;}
    dialog.nu-sheet.nu-stats{height:max-content;max-height:88dvh;}   /* inset:0 + auto would STRETCH to the max */
    dialog.nu-sheet[open]{display:flex;flex-direction:column;animation:dlgIn .28s var(--ease);}
    dialog.nu-move{width:min(460px,calc(100% - 32px));max-width:min(460px,calc(100% - 32px));height:max-content;}
    dialog.nu-move[open]{display:block;animation:dlgIn .28s var(--ease);}

    // ── Daily logging streak (MFP-style) ──
    // The count is a REAL number. Alex did not want to lose the streak he had
    // built in MyFitnessPal, so it was carried over here: seeded on 2026-07-06
    // at 788 and counted forward since. It is a measurement with a history,
    // not a fixture.
    //
    // ⚠️⚠️ THE SEED USED TO LIVE INSIDE getStreak(), WHICH RENDERS — and it
    // WROTE. So any paint that happened before the cloud pull landed (a fresh
    // device, a sign-out, cleared storage, or sync simply being slow) found no
    // `nut:streak`, wrote {count:788, lastDay:today} with a FRESH `_ts`, and
    // that timestamp beat the real count in the cloud under whole-object
    // last-write-wins. His streak went 796 (14 Jul, proven in his device
    // export) DOWN to 790 (29 Jul) exactly that way — and 790 is 788 + 2,
    // while a streak can only rise by one or reset to one.

    // That is constraint 10 with a write on the end: "I could not read it yet"
    // and "there is nothing here" rendered identically, and then the guess was
    // saved over the truth. So getStreak() NEVER writes now, and the seed is
    // gone rather than guarded — the number lives in the cloud under his
    // account and syncs down like everything else, so every future firing of
    // that seed could only ever destroy something. It would also have handed

    /* ── One-time repair of the streak the old seed knocked down ──────────
       The count is rebuilt from the LOGS rather than written as a magic
       number, so it is correct on whatever day he happens to open the page.

       The anchor is observed, not derived: his 2026-07-14 device export holds
       `nut:streak = {count: 796, lastDay: "2026-07-14"}`. Every day after it
       is then read out of his own diary.

       Five guards, because this writes to a store that matters:
         · once per device            (`nut:streakfix`, device-local, never synced)
         · only with a resolved session and only on HIS account — "I cannot
           tell" is never collapsed into an account (the run.html lesson)
         · only if the anchor day is actually IN the logs. An unloaded diary
           and an empty one look the same, so a diary that cannot show the
           anchor gets no answer rather than a guessed one
         · only if the run from the anchor is UNBROKEN. A real gap means the
           streak legitimately reset and the anchor no longer applies, so the
           repair stands down and leaves it to bumpStreak()
         · only ever RAISES. It can never lower a count, which makes the

        else return null;                                            // a real gap → the anchor no longer applies

    function repairStreak(){

    function suggestMealName(items, slot){

    // Save a whole diary slot as a reusable meal. Called from the diary (where

      if(!items.length){

        return;

      var nm=await ALSPrompt({title:'Save as one meal',
        message:items.map(function(e){ return e.name; }).join(' · ')+' — '+r0(kc)+' kcal',
        placeholder:'Meal name',value:suggestMealName(items,mealSlot),confirmText:'Save meal'});

      var newId=uid();
      var m=ls(MEALSK,[]); if(!Array.isArray(m)) m=[];
      // The saved meal keeps the FOODS, never a diary row's identity or its
      // place in a group — those belong to the day it was logged on.
      m.unshift({id:newId,name:nm,ord:-Date.now(),ts:Date.now(),items:items.map(function(e){
        var c={}; for(var k in e) c[k]=e[k];

        return c; })});
      if(!save(MEALSK,m)) return;               // storage full already said so, in words

    // ── Swipe-left-to-delete on diary entries ──────────────────────
    // Horizontal-only: it decides direction on the first move and bows out the
    // moment a gesture looks vertical, so it never fights the page scroll. A
    // completed swipe sets a short guard so the follow-up click doesn't also
    // open the edit sheet. Deletes go through the same delEntry() as the ✕.
    (function(){
      var diary=document.getElementById('diary'); if(!diary) return;
      var el=null, id=null, x0=0, y0=0, dir=0; // dir: 0 undecided, 1 horizontal, -1 vertical
      var THRESH=80, MAXPULL=150;
      window._nutSwipeGuard=0;
      function reset(animate){
        if(!el) return; var e=el; if(animate){ e.classList.add('sw-anim'); } e.style.transform=''; e.style.backgroundColor='';
        if(animate) setTimeout(function(){ e.classList.remove('sw-anim'); }, 210);
        el=null; id=null; dir=0;
      }
      diary.addEventListener('touchstart', function(ev){
        if(ev.touches.length!==1) return;
        var row=ev.target.closest && ev.target.closest('.entry[data-act="edit"]'); if(!row) return;
        // ignore touches that begin on the action buttons
        if(ev.target.closest('.entry-del,.entry-move')) return;
        el=row; id=row.getAttribute('data-id'); x0=ev.touches[0].clientX; y0=ev.touches[0].clientY; dir=0;
        el.classList.remove('sw-anim');
      }, {passive:true});
      diary.addEventListener('touchmove', function(ev){
        if(!el) return; var t=ev.touches[0], dx=t.clientX-x0, dy=t.clientY-y0;
        if(dir===0){ if(Math.abs(dx)<6 && Math.abs(dy)<6) return; dir=Math.abs(dx)>Math.abs(dy)?1:-1; if(dir===-1){ el=null; return; } }
        if(dir!==1) return;
        if(dx>0) dx=0;                              // left only
        if(dx<-MAXPULL) dx=-MAXPULL;
        ev.preventDefault();
        el.style.transform='translateX('+dx+'px)';
        el.style.backgroundColor='rgba(255,107,139,'+Math.min(.24, (-dx/THRESH)*.24)+')';
      }, {passive:false});
      diary.addEventListener('touchend', function(ev){
        if(!el) return;
        var m=/translateX\((-?\d+(?:\.\d+)?)px\)/.exec(el.style.transform||''), dx=m?parseFloat(m[1]):0;
        if(dir===1) window._nutSwipeGuard=Date.now();   // suppress the click that follows a real swipe
        if(dx <= -THRESH){
          var doomed=el, delId=id;
          doomed.classList.add('sw-anim'); doomed.style.transform='translateX(-100%)'; doomed.style.opacity='0';
          el=null; id=null; dir=0;
          setTimeout(function(){ delEntry(delId); }, 180);
        } else reset(true);
      });
      diary.addEventListener('touchcancel', function(){ reset(true); });
    })();

    document.addEventListener('click', function(ev){
      // a click landing right after a swipe is the tail of that gesture — ignore it
      if(window._nutSwipeGuard && (Date.now()-window._nutSwipeGuard)<400){ window._nutSwipeGuard=0; return; }
      var el=ev.target&&ev.target.closest?ev.target.closest('[data-act]'):null; if(!el) return;
      var act=el.getAttribute('data-act');
