<div class="ar-wrap">

  <header class="ar-hero">
    <div class="ar-eyebrow">Αρχαία Ελληνικά</div>
    <h1 class="ar-h">Αρχικοί χρόνοι<br><b id="arStat">—</b></h1>
    <p class="ar-hsub" id="arSub">—</p>
  </header>

  <section class="ar-today">
    <button class="ar-cta" id="arGo">
      <div class="ar-cta-l">Σήμερα</div>
      <div class="ar-cta-t" id="arGoT">—</div>
      <div class="ar-cta-m" id="arGoM">—</div>
    </button>
    <div class="ar-modes">
      <button class="ar-mode" id="arChainBtn">Η στήλη</button>
      <button class="ar-mode" id="arRevBtn">Ανάποδα</button>
    </div>
  </section>

  <section class="ar-map">
    <div class="ar-sh"><h2>Ο χάρτης</h2><span class="lbl" id="arMapN"></span></div>
    <div class="ar-seg" role="tablist" id="arSeg">
      <button role="tab" aria-selected="true" data-voice="act">Ενεργητική</button>
      <button role="tab" aria-selected="false" data-voice="mp">Μέση – παθητική</button>
    </div>
    <div class="ar-grid" id="arGrid"></div>
    <div class="ar-legend"><span class="ar-lg"></span><span>βαμμένο από τα δικά σου λάθη</span></div>
  </section>

  <section class="ar-fams">
    <div class="ar-sh"><h2>Οι οικογένειες</h2><span class="lbl">γιατί συμπεριφέρονται έτσι</span></div>
    <div id="arFams"></div>
  </section>

  <section class="ar-verbs">
    <div class="ar-sh"><h2>Τα ρήματα</h2><span class="lbl" id="arVerbsN"></span></div>
    <ul id="arList"></ul>
  </section>

  <p class="ar-foot" id="arFoot"></p>
</div>

<!-- ══ η εξέταση ══ -->
<div class="ar-sess" id="arSess" role="dialog" aria-modal="true" aria-label="Εξέταση">
  <div class="ar-sbar">
    <button class="ar-x" id="arQuit" aria-label="Κλείσιμο">✕</button>
    <div class="ar-prog"><i id="arBar"></i></div>
    <div class="ar-count" id="arCount"></div>
  </div>
  <div class="ar-qwrap"><div class="ar-qin" id="arQ"></div></div>
</div>

<dialog class="ar-dlg" id="arDlg"><div class="ar-dbody" id="arDlgBody" tabindex="-1"></div></dialog>

<script>
(function(){
  'use strict';
  var D = window.ArxaiaData, E = window.ArxaiaEngine;
  var KEY = 'arx:v1';
  var BOXES = [0, 3, 10, 30, 90];      /* η ίδια σκάλα με τα Λατινικά και το Notion */
  var DAY = 86400000;
  var SESSION_N = 12;

  /* ── αποθήκευση ──────────────────────────────────── */
  function lsGet(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
  function lsSet(k, v){
    try{ localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch(e){ note('Ο χώρος της συσκευής γέμισε — η πρόοδος ΔΕΝ αποθηκεύτηκε.'); return false; }
  }
  function note(msg){
    var f = document.getElementById('arFoot');
    if (f) f.innerHTML = '<b style="color:rgb(255,138,107)">' + msg + '</b>';
  }
  function todayKey(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  var state = null, sess = null, revealed = {};

  /* Η ΥΛΗ ΔΕΝ ΖΕΙ ΕΔΩ. Ζει στο arxaia-data.js, μεταγραμμένη στο χέρι από τη
     φωτογραφία του φυλλαδίου. Το αποθηκευμένο state κρατάει ΜΟΝΟ την πρόοδό
     του — ποτέ αντίγραφο των ρημάτων. Έτσι μια καινούργια σελίδα φυλλαδίου
     εμφανίζεται αμέσως σε κάθε συσκευή χωρίς migration, και ένας διορθωμένος
     τύπος διορθώνεται παντού με το επόμενο deploy. */
  function load(){
    var s = lsGet(KEY, null);
    if (!s || typeof s !== 'object') s = {};
    if (!Array.isArray(s.cells)) s.cells = [];
    if (!Array.isArray(s.days))  s.days  = [];
    if (!s.opts || typeof s.opts !== 'object') s.opts = { typing:false };
    return s;
  }
  function save(){ state.ts = Date.now(); lsSet(KEY, state); }

  function cellOf(id){
    for (var i = 0; i < state.cells.length; i++) if (state.cells[i].id === id) return state.cells[i];
    return null;
  }
  function bump(id, right){
    var c = cellOf(id);
    if (!c){ c = { id:id, r:0, w:0, box:0, due:0, ts:0 }; state.cells.push(c); }
    if (right){ c.r++; c.box = Math.min(c.box + 1, BOXES.length - 1); }
    else { c.w++; c.box = 0; }
    c.due = Date.now() + BOXES[c.box] * DAY;
    c.ts = Date.now();
  }
  function mastery(id){ var c = cellOf(id); if (!c) return null; var t = c.r + c.w; return t ? c.r / t : null; }
  function solid(id){ var c = cellOf(id); return !!c && c.box >= 2 && c.r > c.w; }

  /* ── επιλογή ερωτήσεων ───────────────────────────── */
  function priority(id){
    var c = cellOf(id);
    if (!c) return 100;                                  /* δεν το έχει δει ποτέ */
    var t = c.r + c.w, wrongRate = t ? c.w / t : 0;
    if (Date.now() >= (c.due || 0)) return 80 + wrongRate * 40;
    return 8 + wrongRate * 30;
  }

  /* Το ΕΙΔΟΣ της ερώτησης ανεβαίνει σκάλα μαζί με το κελί: πρώτα βγάζει τον
     τύπο από το λήμμα, και μόνο όταν το κελί έχει ωριμάσει του ζητείται να
     τον αναγνωρίσει ή να πει από ποιο ρήμα είναι. Έτσι δεν πέφτει στα βαθιά
     την πρώτη μέρα. */
  function buildQ(cell, mode){
    var c = cellOf(cell.id), box = c ? c.box : 0, q = null;
    /* Το λήμμα «αἰδέομαι – αἰδοῦμαι» γράφει ήδη τον ενεστώτα του, οπότε αυτό το
       κελί δεν μπορεί να ρωτηθεί ως παραγωγή — μόνο ανάποδα. Αν ούτε αυτό
       στέκει, ΔΕΝ ρωτιέται: μια ερώτηση χωρίς μία σωστή απάντηση είναι
       χειρότερη από καμία ερώτηση. */
    if (E.givenAway(cell.verb, cell)){
      return E.reverse(cell.verb, cell, Math.random) ||
             E.whichVerb(D.VERBS, cell.verb, cell, Math.random) || null;
    }
    if (mode === 'rev'){
      q = E.reverse(cell.verb, cell, Math.random) || E.whichVerb(D.VERBS, cell.verb, cell, Math.random);
      return q || E.production(cell.verb, cell, Math.random);
    }
    if (box >= 2 && Math.random() < 0.42){
      q = Math.random() < 0.5 ? E.reverse(cell.verb, cell, Math.random)
                              : E.whichVerb(D.VERBS, cell.verb, cell, Math.random);
    }
    return q || E.production(cell.verb, cell, Math.random);
  }

  function buildSession(mode, n){
    var pool = E.drillCells(D.VERBS), i, out = [], lastVerb = null, seen = {}, q;
    if (!pool.length) return [];
    for (i = 0; i < pool.length; i++) pool[i]._s = priority(pool[i].id) + Math.random() * 22;
    pool.sort(function(a,b){ return b._s - a._s; });

    /* Χτίζουμε την ερώτηση ΜΕΣΑ στον βρόχο: ένα κελί που δεν δίνει έγκυρη
       ερώτηση απλώς προσπερνιέται, ώστε η συνεδρία να βγαίνει πάντα με τις
       12 που υποσχέθηκε αντί να λιγοστεύει σιωπηλά. */
    for (i = 0; i < pool.length && out.length < n; i++){
      if (seen[pool[i].id]) continue;
      if (pool[i].verb.id === lastVerb && out.length) continue;   /* όχι δύο σερί ίδιο ρήμα */
      q = buildQ(pool[i], mode);
      seen[pool[i].id] = 1;
      if (!q) continue;
      lastVerb = pool[i].verb.id; out.push(q);
    }
    for (i = 0; i < pool.length && out.length < n; i++){          /* χαλαρώνει τον κανόνα αν η ύλη είναι μικρή */
      if (seen[pool[i].id]) continue;
      q = buildQ(pool[i], mode); seen[pool[i].id] = 1;
      if (q) out.push(q);
    }
    return out;
  }

  /* Η ΣΤΗΛΗ: ένα ρήμα, μία φωνή, τα έξι κελιά με τη σειρά που τα λες φωναχτά.
     Διαλέγει τη στήλη που τον δυσκολεύει περισσότερο. */
  function pickChain(){
    var best = null, bestScore = -1, i, j, k;
    for (i = 0; i < D.VERBS.length; i++){
      for (j = 0; j < D.VOICES.length; j++){
        var col = E.chain(D.VERBS[i], D.VOICES[j]);
        if (!col.length) continue;
        var drill = col.filter(function(c){ return c.drillable; });
        if (drill.length < 3) continue;
        var s = 0;
        for (k = 0; k < drill.length; k++) s += priority(drill[k].id);
        s = s / drill.length + Math.random() * 18;
        if (s > bestScore){ bestScore = s; best = { verb:D.VERBS[i], voice:D.VOICES[j], col:col }; }
      }
    }
    return best;
  }

  function startChain(){
    var pick = pickChain();
    if (!pick) return;
    var qs = [], given = [], i, c;
    for (i = 0; i < pick.col.length; i++){
      c = pick.col[i];
      if (!c.drillable) continue;
      /* Ο ενεστώτας είναι το λήμμα: η αφετηρία που λες φωναχτά, όχι ερώτηση.
         Δίνεται συμπληρωμένος και η αλυσίδα χτίζεται από εκεί και κάτω. */
      if (E.givenAway(pick.verb, c)){ given.push(c.id); continue; }
      var q = E.production(pick.verb, c, Math.random);
      if (q) qs.push(q); else given.push(c.id);
    }
    if (!qs.length) return;
    start(qs, { chain: pick, given: given });
  }

  /* ── η εξέταση ───────────────────────────────────── */
  var elSess  = document.getElementById('arSess'),
      elQ     = document.getElementById('arQ'),
      elBar   = document.getElementById('arBar'),
      elCount = document.getElementById('arCount');

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c];
    });
  }

  function start(qs, ctx){
    if (!qs || !qs.length) return;
    sess = { qs:qs, i:0, right:0, missed:[], ctx:ctx || null, answered:false };
    revealed = {};
    if (ctx && ctx.given) for (var gi = 0; gi < ctx.given.length; gi++) revealed[ctx.given[gi]] = 1;
    elSess.classList.add('on');
    document.body.style.overflow = 'hidden';
    renderQ();
  }
  function quit(){
    sess = null;
    elSess.classList.remove('on');
    document.body.style.overflow = '';
    render();
  }

  function chainHtml(){
    if (!sess || !sess.ctx || !sess.ctx.chain) return '';
    var col = sess.ctx.chain.col, cur = sess.qs[sess.i], html = '', i, c, val, cls, isNow;
    for (i = 0; i < col.length; i++){
      c = col[i];
      isNow = !!(cur && c.id === cur.cell);
      cls = 'ar-crow' + (isNow ? ' now' : (revealed[c.id] ? ' done' : ''));
      if (!c.forms) val = '<span class="cv empty">δεν έχει</span>';
      else if (revealed[c.id]) val = '<span class="cv">' + esc(c.forms.join(' · ')) + '</span>';
      else if (isNow) val = '<span class="cv">;</span>';
      else val = '<span class="cv empty">·····</span>';
      html += '<div class="' + cls + '"><span class="ck">' + D.TENSE_SHORT[c.tense] + '</span>' + val + '</div>';
    }
    return '<div class="ar-chain">' + html + '</div>';
  }

  function renderQ(){
    if (!sess) return;
    if (sess.i >= sess.qs.length) return renderDone();
    var q = sess.qs[sess.i], i;
    sess.answered = false;

    elBar.style.transform = 'scaleX(' + (sess.i / sess.qs.length) + ')';
    elCount.textContent = (sess.i + 1) + '/' + sess.qs.length;

    var tag = q.type === 'prod' ? (sess.ctx && sess.ctx.chain
                ? 'Η στήλη · ' + D.VOICE_EL[sess.ctx.chain.voice] : 'Ο τύπος')
            : q.type === 'rev'  ? 'Αναγνώριση' : 'Το ρήμα';

    var html = '<div class="ar-qtag">' + tag + '</div>';
    html += chainHtml();
    html += '<div class="ar-prompt">' + esc(q.prompt) + '</div>';
    html += '<div class="ar-ask">' + (q.type === 'prod' ? '<b>' + esc(q.ask) + '</b>' : esc(q.ask)) + '</div>';

    if (q.type === 'prod' && state.opts.typing){
      html += '<div class="ar-type"><input id="arIn" type="text" autocomplete="off" autocapitalize="off" ' +
              'autocorrect="off" spellcheck="false" placeholder="γράψε τον τύπο">' +
              '<button id="arSubmit">OK</button></div>' +
              '<div class="ar-hint">ο τόνος δεν μετράει όταν πληκτρολογείς</div>';
    } else {
      html += '<div class="ar-opts">';
      for (i = 0; i < q.options.length; i++){
        var o = q.options[i],
            val = (typeof o === 'string') ? o : o.id,
            lab = (typeof o === 'string') ? o : o.label;
        html += '<button class="ar-opt' + (typeof o === 'string' ? '' : ' words') +
                '" data-v="' + esc(val) + '">' + esc(lab) + '</button>';
      }
      html += '</div>';
    }
    html += '<div id="arRevBox"></div>';
    elQ.innerHTML = html;
    elQ.parentNode.scrollTop = 0;

    var opts = elQ.querySelectorAll('.ar-opt');
    for (i = 0; i < opts.length; i++){
      opts[i].addEventListener('click', function(){ answer(this.getAttribute('data-v'), false, this); });
    }
    var input = document.getElementById('arIn');
    if (input){
      document.getElementById('arSubmit').addEventListener('click', function(){ answer(input.value, true, null); });
      input.addEventListener('keydown', function(e){ if (e.key === 'Enter') answer(input.value, true, null); });
      setTimeout(function(){ try{ input.focus(); }catch(e){} }, 60);
    }
  }

  function answer(given, typed, btn){
    if (!sess || sess.answered) return;
    if (typed && !String(given).trim()) return;
    var q = sess.qs[sess.i], i, v;
    var right = E.correct(q, given, typed);
    sess.answered = true;
    bump(q.cell, right);
    if (right) sess.right++; else sess.missed.push(q);
    revealed[q.cell] = 1;
    save();

    var opts = elQ.querySelectorAll('.ar-opt');
    for (i = 0; i < opts.length; i++){
      v = opts[i].getAttribute('data-v');
      var words = opts[i].className.indexOf('words') >= 0 ? ' words' : '';
      opts[i].disabled = true;
      if (q.answers.indexOf(v) >= 0) opts[i].className = 'ar-opt' + words + ' right';
      else if (btn && opts[i] === btn) opts[i].className = 'ar-opt' + words + ' wrong';
      else opts[i].className = 'ar-opt' + words + ' mute';
    }
    var input = document.getElementById('arIn');
    if (input){
      input.disabled = true;
      input.style.borderColor = right ? 'rgba(63,224,176,.6)' : 'rgba(255,138,107,.6)';
    }

    /* η αποκάλυψη: ΟΛΟΚΛΗΡΟ το κελί (γιατί συχνά έχει δύο σωστούς τύπους) και,
       όταν έπεσε έξω, ο κανόνας της οικογένειας — εκεί γίνεται η διδασκαλία. */
    var parts = q.cell.split('.'), voice = parts[1], tense = parts[2];
    var forms = (q.verb[voice] && q.verb[voice][tense]) || [];
    var box = '<div class="ar-rev"><div class="cellsum">' +
      esc(q.verb.lemma) + ' · ' + esc(E.askLabel(voice, tense)) +
      '<b>' + esc(forms.join('  ·  ')) + '</b></div>';
    if (!right){
      var fam = D.FAMS[q.verb.fam];
      box += '<div class="ar-why"><span class="tag">' + esc(fam ? fam.label : 'γιατί') + '</span>' +
             esc(q.verb.why) + '</div>';
    }
    box += '<button class="ar-next" id="arNext">' +
           (sess.i + 1 >= sess.qs.length ? 'Τέλος' : 'Επόμενο') + '</button></div>';
    document.getElementById('arRevBox').innerHTML = box;

    if (sess.ctx && sess.ctx.chain){
      var ch = elQ.querySelector('.ar-chain');
      if (ch) ch.outerHTML = chainHtml();
    }
    var nx = document.getElementById('arNext');
    nx.addEventListener('click', next);
    /* Καμία εστίαση εδώ: το μάτι πρέπει να πάει στην ΕΞΗΓΗΣΗ, όχι στο κουμπί. */
    setTimeout(function(){
      try{ nx.scrollIntoView({ block:'nearest', behavior:'smooth' }); }catch(e){}
    }, 40);
  }

  function next(){ if (!sess) return; sess.i++; renderQ(); }

  function renderDone(){
    var d = todayKey(), i;
    if (state.days.indexOf(d) < 0){ state.days.push(d); state.days = state.days.slice(-400); }
    save();
    elBar.style.transform = 'scaleX(1)';
    elCount.textContent = sess.qs.length + '/' + sess.qs.length;

    var pct = Math.round(sess.right / sess.qs.length * 100);
    var msg = pct === 100 ? 'Καθαρό. Αυτά τα κελιά ξαναέρχονται σε λίγες μέρες.'
            : pct >= 70   ? 'Καλά. Τα λάθη γύρισαν στην αρχή της σκάλας.'
            : 'Αυτά είναι τα κελιά που κάνουν τη διαφορά — τα ξαναβλέπεις αύριο.';

    var html = '<div class="ar-done"><div class="big">' + sess.right + '/' + sess.qs.length + '</div>' +
               '<div class="msg">' + msg + '</div>';
    if (sess.missed.length){
      html += '<div class="list">';
      for (i = 0; i < sess.missed.length; i++){
        var q = sess.missed[i], p = q.cell.split('.');
        var fs = (q.verb[p[1]] && q.verb[p[1]][p[2]]) || [];
        html += '<div class="miss"><b>' + esc(fs.join(' · ')) + '</b>' +
                esc(q.verb.lemma + ' · ' + E.askLabel(p[1], p[2])) + '</div>';
      }
      html += '</div>';
    }
    html += '<button class="ar-next" id="arNext">Τέλος</button></div>';
    elQ.innerHTML = html;
    elQ.parentNode.scrollTop = 0;
    document.getElementById('arNext').addEventListener('click', quit);
  }

  document.getElementById('arQuit').addEventListener('click', quit);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && sess) quit(); });

  /* ══ η σελίδα ══ */
  var mapVoice = 'act';

  /* κοράλλι → σμαραγδί, από τη ΔΙΚΗ ΤΟΥ ακρίβεια. Ένα κελί που δεν έχει
     δοκιμαστεί δεν παίρνει χρώμα καθόλου: «δεν ξέρω» δεν είναι «κακό». */
  function tint(m){
    if (m === null) return null;
    var warn = [255,138,107], good = [63,224,176], c = [], i;
    for (i = 0; i < 3; i++) c.push(Math.round(warn[i] + (good[i] - warn[i]) * m));
    return 'rgba(' + c.join(',') + ',' + (0.34 + Math.abs(m - 0.5) * 1.0).toFixed(2) + ')';
  }

  function renderMap(){
    var g = document.getElementById('arGrid'), html = '<div class="ar-gh"></div>', i, j, v, cid, m, bg, forms;
    for (i = 0; i < D.TENSES.length; i++) html += '<div class="ar-gh">' + D.TENSE_SHORT[D.TENSES[i]] + '</div>';
    for (i = 0; i < D.VERBS.length; i++){
      v = D.VERBS[i];
      if (!v[mapVoice]) continue;      /* αποθετικό: δεν έχει καθόλου αυτή τη φωνή */
      html += '<div class="ar-rowlem">' + esc(v.lemma.split(' – ')[0]) + '</div>';
      for (j = 0; j < D.TENSES.length; j++){
        forms = v[mapVoice] ? v[mapVoice][D.TENSES[j]] : null;
        if (!forms || !forms.length){ html += '<div class="ar-cell void">—</div>'; continue; }
        cid = E.cellId(v.id, mapVoice, D.TENSES[j]);
        m = mastery(cid);
        bg = tint(m);
        html += '<div class="ar-cell' + (bg ? ' has' : '') + '"' + (bg ? ' style="background:' + bg + '"' : '') +
                ' title="' + esc(v.lemma + ' · ' + E.askLabel(mapVoice, D.TENSES[j])) + '">' +
                (m === null ? '·' : Math.round(m * 100)) + '</div>';
      }
    }
    g.innerHTML = html;
    var cells = E.drillCells(D.VERBS).filter(function(c){ return c.voice === mapVoice; });
    var tried = cells.filter(function(c){ return mastery(c.id) !== null; }).length;
    document.getElementById('arMapN').textContent = tried + '/' + cells.length + ' δοκιμασμένα';
  }

  function renderFams(){
    var fams = E.byFamily(D.VERBS), html = '', i, j, bs;
    for (i = 0; i < fams.length; i++){
      var f = fams[i];
      html += '<div class="ar-fam"><h3>' + esc(f.info.label) +
              '<span class="hint">' + esc(f.info.hint) + '</span></h3>' +
              '<div class="rule">' + esc(f.info.rule) + '</div><div class="mem">';
      for (j = 0; j < f.verbs.length; j++){
        html += '<button data-v="' + esc(f.verbs[j].id) + '">' +
                esc(f.verbs[j].lemma.split(' – ')[0]) + '</button>';
      }
      html += '</div></div>';
    }
    document.getElementById('arFams').innerHTML = html;
    bs = document.querySelectorAll('#arFams button[data-v]');
    for (i = 0; i < bs.length; i++){
      bs[i].addEventListener('click', function(){ openVerb(this.getAttribute('data-v')); });
    }
  }

  function renderList(){
    var html = '', i, v, cs, done, bs;
    for (i = 0; i < D.VERBS.length; i++){
      v = D.VERBS[i];
      cs = E.cellsOf(v).filter(function(c){ return c.drillable; });
      done = cs.filter(function(c){ return solid(c.id); }).length;
      html += '<li><button class="ar-v" data-v="' + esc(v.id) + '">' +
              '<span class="lem">' + esc(v.lemma) + '</span>' +
              '<span class="gl">' + esc(v.gloss) + '</span>' +
              '<span class="cnt">' + done + '/' + cs.length + '</span></button></li>';
    }
    document.getElementById('arList').innerHTML = html;
    bs = document.querySelectorAll('#arList button[data-v]');
    for (i = 0; i < bs.length; i++){
      bs[i].addEventListener('click', function(){ openVerb(this.getAttribute('data-v')); });
    }
    document.getElementById('arVerbsN').textContent = D.VERBS.length + ' στην ύλη';
  }

  function openVerb(id){
    var v = null, i, j, k;
    for (i = 0; i < D.VERBS.length; i++) if (D.VERBS[i].id === id) v = D.VERBS[i];
    if (!v) return;
    var fam = D.FAMS[v.fam];
    var html = '<div class="ar-dh gr">' + esc(v.lemma) + '</div><div class="ar-dg">' + esc(v.gloss) + '</div>';
    html += '<table class="ar-tbl"><tr><th></th><th>' + (v.act ? 'Ενεργητική' : '&nbsp;') +
            '</th><th>Μέση – παθητική</th></tr>';
    for (i = 0; i < D.TENSES.length; i++){
      var t = D.TENSES[i];
      html += '<tr><td class="tk">' + D.TENSE_SHORT[t] + '</td>';
      for (j = 0; j < D.VOICES.length; j++){
        var voice = D.VOICES[j], f = v[voice] ? v[voice][t] : null;
        if (!v[voice]){ html += '<td><span class="no">—</span></td>'; continue; }
        if (!f || !f.length){ html += '<td><span class="no">δεν έχει</span></td>'; continue; }
        var txt = esc(f[0]);
        for (k = 1; k < f.length; k++) txt += '<span class="alt">' + esc(f[k]) + '</span>';
        if (E.noDrilled(v, voice, t)) txt = '(' + txt + ')';
        html += '<td>' + txt + '</td>';
      }
      html += '</tr>';
    }
    html += '</table>';
    html += '<div class="ar-why" style="margin-top:18px"><span class="tag">' +
            esc(fam ? fam.label : 'γιατί') + '</span>' + esc(v.why) + '</div>';
    html += '<button class="ar-dclose" id="arDClose">Κλείσιμο</button>';

    document.getElementById('arDlgBody').innerHTML = html;
    var dlg = document.getElementById('arDlg');
    document.getElementById('arDClose').addEventListener('click', function(){ dlg.close(); });
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open','');
    try{ document.getElementById('arDlgBody').focus({ preventScroll:true }); }catch(e){}
  }

  function render(){
    var cells = E.drillCells(D.VERBS);
    var solidN = cells.filter(function(c){ return solid(c.id); }).length;
    var fresh = cells.filter(function(c){ return !cellOf(c.id); }).length;
    var due = cells.filter(function(c){ var x = cellOf(c.id); return x && Date.now() >= (x.due || 0); }).length;

    document.getElementById('arStat').textContent = solidN + ' από ' + cells.length + ' κελιά στέρεα';
    document.getElementById('arSub').innerHTML =
      '<b>' + D.VERBS.length + ' ρήματα</b> · ' + cells.length + ' κελιά που εξετάζονται · ' +
      esc(D.SHEET.source) + ', σελ. ' + D.SHEET.pages[D.SHEET.pages.length - 1].n;

    document.getElementById('arGoT').textContent = Math.min(SESSION_N, cells.length) + ' ερωτήσεις';
    var when = due && fresh ? due + ' για επανάληψη · ' + fresh + ' καινούργια'
             : due            ? due + ' κελιά για επανάληψη'
             : fresh          ? fresh + ' κελιά που δεν έχεις δει ποτέ'
             :                  'μεικτή εξέταση';
    document.getElementById('arGoM').textContent = '~3 λεπτά · ' + when;

    renderMap(); renderFams(); renderList();

    document.getElementById('arFoot').innerHTML =
      'Η ύλη είναι μεταγραμμένη <b>στο χέρι</b> από τη φωτογραφία του φυλλαδίου σου και ελέγχεται ' +
      'από 201 assertions — κατάληξη ανά χρόνο, αύξηση στους ιστορικούς χρόνους, πνεύμα σε κάθε ' +
      'αρχικό φωνήεν, τόνος παντού. <b>Καινούργια σελίδα: στείλε τη φωτογραφία και μπαίνει.</b>';
  }

  document.getElementById('arGo').addEventListener('click', function(){
    start(buildSession('quick', SESSION_N), null);
  });
  document.getElementById('arRevBtn').addEventListener('click', function(){
    start(buildSession('rev', SESSION_N), null);
  });
  document.getElementById('arChainBtn').addEventListener('click', startChain);

  var segBtns = document.querySelectorAll('#arSeg button');
  (function(){
    for (var s = 0; s < segBtns.length; s++){
      segBtns[s].addEventListener('click', function(){
        mapVoice = this.getAttribute('data-voice');
        for (var i = 0; i < segBtns.length; i++){
          segBtns[i].setAttribute('aria-selected', segBtns[i] === this ? 'true' : 'false');
        }
        renderMap();
      });
    }
  })();

  state = load();
  save();
  render();

  /* ── cloud sync ──────────────────────────────────── */
  (function initArxaiaSync(){
    var tries = 0;
    (function wait(){
      if (typeof initCloudSync !== 'function' || !window.supabase){ if (tries++ < 40) setTimeout(wait, 200); return; }
      initCloudSync({
        appKey:'arxaia',
        syncedKeys:[KEY],
        onApplied:function(){
          /* Ξαναδιάβασε ΠΡΙΝ γράψει οτιδήποτε, αλλιώς μια εισερχόμενη
             συγχώνευση χάνεται από παλιό αντίγραφο στη μνήμη. */
          state = load();
          if (!sess) { try{ render(); }catch(e){} }
        }
      });
    })();
  })();
})();
</script>
</body>
</html>
