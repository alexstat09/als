<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

       κινητό χάνει τα πάντα σε επανεγκατάσταση του PWA. -->

       με «κερδίζει το remote». Δες το study-stamp.js. -->
  <script src="study-stamp.js"></script>
  <script src="als-dialog.js" defer></script>
  <script>window.__pmAutoSel='.ek-head,.ek-cta,.ek-page';</script>

<style>
  /* Κοραλλί = ΤΟ ΧΡΩΜΑ ΤΗΣ ΕΚΘΕΣΗΣ, ίδιο με το `--hw-ekt` του homework.html. */
  :root{ --ek:255,138,107; --hint:229,184,110; --good:63,224,176; }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ min-height:100%; }
  body{
    background:var(--au-void,#050506); color:var(--au-ivory,#f5f2ec);
    font-family:var(--au-sans,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif);
    -webkit-font-smoothing:antialiased;
    padding:0 0 calc(96px + env(safe-area-inset-bottom));
  }
  .wrap{ max-width:640px; margin:0 auto; padding:0 20px; }

  /* ══════════════════════════════════════════════════════════════════
     ⭐ ΤΥΠΟΓΡΑΦΙΑ ΛΕΞΙΚΟΥ, ΟΧΙ DASHBOARD.
     Καμία κάρτα, κανένα στρογγυλεμένο κουτί, κανένα περίγραμμα σε ολόκληρη
     την ανάγνωση. Τα λεξικά έχουν δική τους τυπογραφία εκατό χρόνων —
     έντονο λήμμα, λεπτή γραμμή, μικροσκοπικά αραιωμένα κεφαλαία για τις
     ετικέτες, πλάγιο για την ετυμολογία — και είναι ΠΥΚΝΗ χωρίς να είναι
     θορυβώδης. Ένα chip με border-radius 999px χωράει τρεις λέξεις· μια
     καλοστημένη σειρά λεξικού χωράει επτά και διαβάζεται πιο εύκολα.
     ══════════════════════════════════════════════════════════════════ */

  .ek-head{ padding:calc(env(safe-area-inset-top) + 24px) 0 0; }
  .ek-kicker{ font-family:var(--au-mono,ui-monospace,Menlo,monospace); font-size:9px; font-weight:700;
    letter-spacing:.26em; text-transform:uppercase; color:rgba(var(--ek),.9); }
  .ek-count{ display:flex; align-items:baseline; gap:11px; margin-top:14px; }
  .ek-n{ font-family:var(--au-serif,Georgia,serif); font-size:clamp(42px,12vw,58px);
    line-height:.9; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .ek-of{ font-size:13px; color:var(--au-dim,#9a97a3); }
  .ek-bar{ height:2px; background:rgba(255,255,255,.07); margin-top:18px; overflow:hidden; }
  .ek-bar i{ display:block; height:100%; background:rgb(var(--ek)); width:0;
    transition:width .9s cubic-bezier(.2,.8,.2,1); }

  .ek-cta{ display:block; width:100%; text-align:left; cursor:pointer; color:inherit;
    margin-top:24px; padding:17px 0; border:0; border-top:1px solid rgba(255,255,255,.09);
    border-bottom:1px solid rgba(255,255,255,.09); background:none;
    transition:opacity .18s; font-family:inherit; }
  .ek-cta:active{ opacity:.6; }
  .ek-cta[disabled]{ opacity:.45; cursor:default; }
  .ek-ctat{ font-family:var(--au-serif,Georgia,serif); font-size:20px; }
  .ek-ctas{ font-size:12.5px; color:var(--au-dim,#9a97a3); margin-top:5px; line-height:1.5; }

  /* ── η σελίδα του λεξικού ─────────────────────────── */
  .ek-page{ margin-top:34px; }
  .ek-src{ font-family:var(--au-mono,ui-monospace,Menlo,monospace); font-size:9px; font-weight:700;
    letter-spacing:.22em; text-transform:uppercase; color:var(--au-dim,#9a97a3);
    padding-bottom:9px; border-bottom:1px solid rgba(255,255,255,.14); }

  .ent{ padding:21px 0 19px; border-bottom:1px solid rgba(255,255,255,.05); }
  .ent h2{ font-family:var(--au-serif,Georgia,serif); font-weight:400; font-size:23px;
    letter-spacing:-.01em; line-height:1.1; color:var(--au-ivory,#f5f2ec);
    transition:color .6s ease; }
  /* ⭐ Ο ΜΟΝΟΣ ΔΕΙΚΤΗΣ ΠΡΟΟΔΟΥ ΜΕΣΑ ΣΤΗ ΣΕΛΙΔΑ, ΚΑΙ ΕΙΝΑΙ Η ΙΔΙΑ Η ΤΥΠΟΓΡΑΦΙΑ.
     Όταν η λέξη γίνει ολόκληρη δική του, ο τίτλος της γίνεται κοραλλί.
     Σκρολάροντας βλέπει τι κατέκτησε χωρίς μετρητή, χωρίς τικ, χωρίς μπάρα. */
  .ent.full h2{ color:rgb(var(--ek)); }

  .ent .row{ display:flex; gap:11px; margin-top:9px; align-items:baseline; }
  .ent .lab{ flex:none; width:31px; padding-top:2px;
    font-family:var(--au-mono,ui-monospace,Menlo,monospace); font-size:8.5px; font-weight:700;
    letter-spacing:.14em; color:rgba(154,151,163,.55); }
  .ent .ws{ flex:1; min-width:0; font-family:var(--au-serif,Georgia,serif);
    font-size:16px; line-height:1.62; }
  /* Έντονο ιβουάρ = δικό σου. Σβηστό = δεν το έχεις ακόμα. ΚΑΝΕΝΑ κόκκινο:
     το «δεν το έχω» δεν είναι λάθος, είναι απλώς σκοτεινό. */
  .ent .w{ color:rgba(154,151,163,.34); transition:color .8s ease; }
  .ent .w.on{ color:var(--au-ivory,#f5f2ec); }
  .ent .w.fresh{ color:rgb(var(--hint)); }
  .ent .sep{ color:rgba(154,151,163,.22); }
  .ent .root{ margin-top:11px; padding-left:42px; font-family:var(--au-serif,Georgia,serif);
    font-style:italic; font-size:13px; line-height:1.55; color:rgba(154,151,163,.72); }

  .ek-foot{ margin-top:26px; font-size:11px; line-height:1.65; color:rgba(154,151,163,.6); }

  /* ══════════════════════════════════════════════════════════════════
     Η ΕΞΑΣΚΗΣΗ — ΕΝΑ ΠΡΑΓΜΑ ΤΗ ΦΟΡΑ

     ⚠️ `position:fixed` ΧΩΡΙΣ ΚΑΝΕΝΑΝ ΠΡΟΓΟΝΟ ΜΕ transform — ένας τέτοιος
     πρόγονος σπάει το fixed και το πλαίσιο φεύγει εκτός κάδρου. Έχει ήδη
     συμβεί σε αυτό το project. Γι' αυτό ζει ΕΞΩ από το `.wrap`.
     ══════════════════════════════════════════════════════════════════ */
  .drill{ position:fixed; inset:0; z-index:70; background:var(--au-void,#050506);
    display:none; flex-direction:column; }
  .drill.on{ display:flex; }
  .d-bar{ flex:none; display:flex; align-items:center; gap:14px;
    padding:calc(env(safe-area-inset-top) + 14px) 20px 14px; }
  .d-x{ background:none; border:0; padding:4px 6px; font-size:19px; line-height:1;
    color:var(--au-dim,#9a97a3); cursor:pointer; }
  .d-n{ flex:1; font-family:var(--au-mono,ui-monospace,Menlo,monospace); font-size:10px;
    letter-spacing:.16em; color:var(--au-dim,#9a97a3); font-variant-numeric:tabular-nums; text-align:right; }
  .d-prog{ flex:none; height:2px; background:rgba(255,255,255,.07); }
  .d-prog i{ display:block; height:100%; background:rgb(var(--ek)); width:0;
    transition:width .3s cubic-bezier(.2,.8,.2,1); }
  .d-body{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:34px 20px 24px; }
  .d-in{ max-width:640px; margin:0 auto; }

  .d-q{ font-family:var(--au-serif,Georgia,serif); font-size:clamp(32px,9vw,44px);
    line-height:1.05; letter-spacing:-.02em; }
  .d-ask{ font-family:var(--au-mono,ui-monospace,Menlo,monospace); font-size:9px; font-weight:700;
    letter-spacing:.24em; text-transform:uppercase; color:rgba(var(--ek),.92); margin-bottom:13px; }
  .d-has{ margin-top:15px; font-family:var(--au-serif,Georgia,serif); font-size:13.5px;
    line-height:1.6; color:rgba(154,151,163,.62); }
  .d-has b{ color:rgba(245,242,236,.8); font-weight:400; }

  .d-ta{ width:100%; margin-top:26px; border:0; border-bottom:1px solid rgba(255,255,255,.18);
    background:none; color:var(--au-ivory,#f5f2ec); font-family:var(--au-serif,Georgia,serif);
    font-size:24px; padding:9px 2px; line-height:1.3; }
  .d-ta:focus{ outline:none; border-bottom-color:rgba(var(--ek),.6); }
  .d-ta[readonly]{ opacity:.5; }

  .d-cue{ margin-top:15px; display:inline-block; background:none; border:0; cursor:pointer;
    font-family:var(--au-mono,ui-monospace,Menlo,monospace); font-size:14px; letter-spacing:.12em;
    color:rgba(229,184,110,.8); padding:4px 0; }
  .d-cue:active{ opacity:.6; }

  .d-ans{ margin-top:28px; }
  .d-verdict{ font-family:var(--au-mono,ui-monospace,Menlo,monospace); font-size:9px; font-weight:700;
    letter-spacing:.24em; text-transform:uppercase; }
  .d-verdict.yes{ color:rgb(var(--good)); }
  .d-verdict.no{ color:rgba(154,151,163,.8); }
  .d-word{ font-family:var(--au-serif,Georgia,serif); font-size:28px; margin-top:9px; line-height:1.2; }
  .d-why{ margin-top:11px; font-size:12.5px; line-height:1.6; color:var(--au-dim,#9a97a3); }
  .d-why b{ color:rgba(229,184,110,.95); font-weight:600; }
  .d-root{ margin-top:17px; font-family:var(--au-serif,Georgia,serif); font-style:italic;
    font-size:13px; line-height:1.55; color:rgba(154,151,163,.7); }

  .d-foot{ flex:none; padding:14px 20px calc(env(safe-area-inset-bottom) + 16px); }
  .d-btn{ width:100%; border:1px solid rgba(var(--ek),.3); background:rgba(var(--ek),.09);
    color:var(--au-ivory,#f5f2ec); border-radius:12px; padding:15px; font-size:14.5px;
    font-weight:600; cursor:pointer; font-family:inherit; transition:transform .16s; }
  .d-btn:active{ transform:scale(.985); }

  .toast{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 22px);
    transform:translate(-50%,14px); z-index:90; max-width:min(520px,calc(100vw - 36px));
    border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:12px 16px;
    background:rgba(18,18,22,.96); font-size:12.5px; line-height:1.5;
    opacity:0; pointer-events:none; transition:opacity .22s, transform .22s; }
  .toast.on{ opacity:1; transform:translate(-50%,0); }
</style>

<body>

<div class="wrap">
  <header class="ek-head">
    <div class="ek-kicker">Έκθεση · λεξιλόγιο</div>
    <div class="ek-count"><span class="ek-n" id="ekN">—</span><span class="ek-of" id="ekOf"></span></div>
    <div class="ek-bar"><i id="ekBar"></i></div>
  </header>

  <button class="ek-cta" id="ekCta" type="button">
    <span class="ek-ctat" id="ekCtaT">—</span>
    <span class="ek-ctas" id="ekCtaS"></span>
  </button>

  <section class="ek-page">
    <div class="ek-src" id="ekSrc"></div>
    <div id="ekEntries"></div>
  </section>

  <p class="ek-foot" id="ekFoot"></p>
</div>

<!-- ⚠️ ΕΞΩ από το .wrap — δες το σχόλιο στο CSS. -->
<div class="drill" id="drill" aria-hidden="true">
  <div class="d-bar">
    <button class="d-x" id="dX" type="button" aria-label="Κλείσιμο">✕</button>
    <div class="d-n" id="dN"></div>
  </div>
  <div class="d-prog"><i id="dProg"></i></div>
  <div class="d-body"><div class="d-in" id="dIn"></div></div>
  <div class="d-foot"><button class="d-btn" id="dBtn" type="button">Έλεγχος</button></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  'use strict';

  var D = window.EkthesiData, E = window.EkthesiEngine;
  var KEY = 'ekt:v1', DAY = 86400000;

  /* ⚠️ Σταθερή αρχή 10: εξάρτηση που δεν φόρτωσε ΔΕΝ επιτρέπεται να μοιάζει με
     «δεν έχεις ύλη». Το SILENT-EMPTY είναι η αρρώστια αυτού του project. */
  if (!D || !E){
    document.getElementById('ekFoot').innerHTML =
      '<b style="color:rgb(255,107,139)">Δεν φόρτωσαν τα αρχεία της Έκθεσης.</b> ' +
      'Η ύλη σου δεν χάθηκε — δεν διαβάστηκε. Ανανέωσε τη σελίδα.';
    return;
  }

  var state = null, sess = null, fresh = {};

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function toast(m){
    var t = $('toast');
    t.textContent = m; t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('on'); }, 4200);
  }

  /* ══════════════════════════════════════════════════════════════════
     ΑΠΟΘΗΚΗ

     ⭐⭐ Η ΜΟΝΑΔΑ ΠΡΟΟΔΟΥ ΕΙΝΑΙ ΤΟ ΣΤΟΙΧΕΙΟ, ΟΧΙ Η ΛΕΞΗ. Δικό του, 19/08/26:
     ο καθηγητής **δεν βαθμολογεί** — «όσα περισσότερα ξέρεις, καλύτερο για σένα
     όταν γράψεις έκθεση». Άρα δεν υπάρχει «πέρασες τη λέξη»: υπάρχουν 89
     λέξεις που μαζεύεις. Κάθε μία έχει το δικό της κουτί Leitner και το δικό
     της ραντεβού.

     els   : { cardId:groupId:index → {box, due, r, w, _ts} }  ← Η ΑΛΗΘΕΙΑ
     words : { cardId → {learnedAt, reviews, due, ...} }       ← ΠΑΡΑΓΩΓΟ

     ⚠️ ΤΟ `words` ΔΕΝ ΕΙΝΑΙ ΔΕΥΤΕΡΗ ΑΛΗΘΕΙΑ, ΕΙΝΑΙ ΜΕΤΑΦΡΑΣΗ. Το `ladders.js`
     διαβάζει σκάλα ΑΝΑ ΕΝΟΤΗΤΑ για να πει στο School Studies τι χρωστάει, και
     δεν ξέρει από στοιχεία. Το παράγουμε από τα `els` σε κάθε γράψιμο, ποτέ
     δεν το επεξεργαζόμαστε χωριστά — δύο αριθμοί που «πρέπει» να συμφωνούν
     είναι δύο αριθμοί που ΘΑ αποκλίνουν.
     ══════════════════════════════════════════════════════════════════ */
  function blank(){ return { v:2, words:{}, els:{}, sessions:[] }; }

  function load(){
    var s;
    try { s = JSON.parse(localStorage.getItem(KEY) || 'null'); }
    catch(e){ toast('Δεν μπόρεσα να διαβάσω την πρόοδο. ΔΕΝ έσβησε τίποτα.'); return blank(); }
    if (!s) return blank();
    var b = blank(), k;
    /* ⚠️ Κρατάμε ΚΑΙ κλειδιά που δεν αναγνωρίζουμε. Στοιχείο που έφυγε
       προσωρινά από το `ekthesi-data.js` δεν παίρνει μαζί του την πρόοδο. */
    if (s.els   && typeof s.els   === 'object') for (k in s.els)   if (s.els[k]   && typeof s.els[k]   === 'object') b.els[k]   = s.els[k];
    if (s.words && typeof s.words === 'object') for (k in s.words) if (s.words[k] && typeof s.words[k] === 'object') b.words[k] = s.words[k];
    b.sessions = Array.isArray(s.sessions) ? s.sessions : [];
    return b;
  }

  /* ⭐⭐ Η ΣΦΡΑΓΙΔΑ — als-v468. Χωρίς `_ts` το sync.js κατεβαίνει μέσα στις
     εγγραφές και κρατάει το remote ανά πεδίο, οπότε κάθε λέξη που μόλις
     κέρδισε πάνω σε στοιχείο που ΥΠΗΡΧΕ στο cloud γύριζε πίσω σε 400ms.
     Όλο το γιατί ζει στο study-stamp.js. */
  var STAMP = (typeof window.StudyStamp === 'function')
    ? window.StudyStamp(
        function(){ return state ? [state.els, state.words] : []; },
        function(i, k, rec){ return i ? (+rec.last || +rec.learnedAt || 0) : (+rec.last || 0); })
    : (function(){ var said = 0; return {
        seed: function(){},
        stamp: function(){ if (!said++) toast('Δεν φόρτωσε το study-stamp.js. Η πρόοδος γράφεται στο κινητό, αλλά ο συγχρονισμός μπορεί να τη γυρίσει πίσω. Ανανέωσε.'); }
      }; })();

  /* ⚠️ ΚΑΝΕΝΑ ΣΚΕΤΟ `state = load()` ΠΟΥΘΕΝΑ. */
  function reload(){ state = load(); STAMP.seed(); }
  function save(){
    syncWords();
    STAMP.stamp();
    /* ⚠️ Σταθερή αρχή 17: ΠΟΤΕ άδειο catch σε γράψιμο. Γεμάτο κινητό πετάει
       QuotaExceededError και η σιωπηλή αποτυχία μοιάζει ίδια με επιτυχία. */
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ toast('Ο χώρος του κινητού γέμισε: η πρόοδος ΔΕΝ αποθηκεύτηκε.'); }
  }

  /* ── στοιχεία ─────────────────────────────────────────────────────
     ⚠️ Το `it()` ΔΙΑΒΑΖΕΙ και μπορεί να γεννήσει κέλυφος. Ένα μηδενικό
     κέλυφος ΔΕΝ παίρνει σφραγίδα (κανόνας 1 του study-stamp) — αλλιώς θα
     νικούσε την αληθινή εγγραφή του cloud και θα έσβηνε την πρόοδο. */
  function key(c, g, i){ return c.id + ':' + g.id + ':' + i; }
  function it(k){
    var r = state.els[k];
    if (!r){ r = { box:0, due:0, r:0, w:0, last:0 }; state.els[k] = r; }
    return r;
  }
  function have(k){ return (+it(k).box || 0) >= 1; }

  /* ⭐⭐ «ΤΟ ΕΧΩ» ΚΑΙ «ΜΟΥ ΖΗΤΕΙΤΑΙ ΤΩΡΑ» ΕΙΝΑΙ ΔΥΟ ΔΙΑΦΟΡΕΤΙΚΑ ΠΡΑΓΜΑΤΑ, ΚΑΙ
     Η ΣΥΓΧΥΣΗ ΤΟΥΣ ΗΤΑΝ BUG ΠΟΥ ΘΑ ΕΜΦΑΝΙΖΟΤΑΝ ΜΟΝΟ ΣΤΗΝ ΠΡΩΤΗ ΕΠΑΝΑΛΗΨΗ.
     Η πρώτη γραφή απέρριπτε ΚΑΘΕ στοιχείο που ήδη κατείχε με «το έχεις ήδη,
     δώσε άλλο» — άρα μια λέξη που ήρθε για ΕΠΑΝΑΛΗΨΗ (κατεχόμενη, αλλά
     ληξιπρόθεσμη) δεν μπορούσε να απαντηθεί ΠΟΤΕ σωστά: ατέρμονος βρόχος
     στην τρίτη βραδιά, με τη σελίδα να δείχνει μια χαρά ως τότε.
     Σε παιχνίδι είναι ό,τι δεν κατέχει Ή ό,τι έληξε. */
  function live(k){
    var r = state.els[k];
    return !r || !(+r.box) || (+r.due || 0) <= Date.now();
  }

  /* ⭐ Η ΣΚΑΛΑ, ΑΝΑ ΣΤΟΙΧΕΙΟ. `E.LADDER` = [0,1,3,10,30,90] μέρες. Το «1» δεν
     είναι διακόσμηση: μαθαίνει Τετάρτη βράδυ για Πέμπτη πρωί, οπότε η πρώτη
     επανάληψη ΕΧΕΙ ήδη ημερομηνία και δεν την ορίζουμε εμείς.
     ⚠️ ΤΟ ΛΑΘΟΣ ΔΕΝ ΤΙΜΩΡΕΙ, ΤΟ ΕΠΑΝΑΦΕΡΕΙ. Πέφτει ένα κουτί, όχι στο μηδέν:
     λέξη που την είχε τρεις φορές και της ξέφυγε μία δεν είναι άγνωστη. */
  function bump(k, how){
    var r = it(k), now = Date.now();
    r.last = now;
    if (how === 'got'){
      r.r = (+r.r || 0) + 1;
      r.box = Math.min((+r.box || 0) + 1, E.LADDER.length - 1);
      r.due = E.nextDue(r.box, now);
    } else if (how === 'cued'){
      /* ⭐⭐ ΤΟ ΝΗΜΑ ΔΕΝ ΤΙΜΩΡΕΙ. Πρώτη γραφή αυτού του αρχείου έριχνε κουτί
         όταν απαντούσε ΣΩΣΤΑ με νήμα — δηλαδή τον έκανε να χάνει έδαφος
         επειδή ζήτησε βοήθεια, που είναι ο πιο σίγουρος τρόπος να μη
         ξαναζητήσει ποτέ. Το κουτί ΜΕΝΕΙ· απλώς δεν ανεβαίνει και το
         ραντεβού έρχεται αύριο, γιατί «το ήξερα με βοήθεια» δεν είναι
         «το ξέρω». */
      r.due = now + DAY;
    } else {
      r.w = (+r.w || 0) + 1;
      r.box = Math.max((+r.box || 0) - 1, 0);
      r.due = E.nextDue(r.box, now);
    }
  }

  /* ⚠️ ΜΕΤΑΦΡΑΣΗ ΓΙΑ ΤΟ ladders.js, ΠΑΡΑΓΟΜΕΝΗ — ποτέ χειροκίνητη.
     `learnedAt` = πότε άγγιξε πρώτη φορά τη λέξη · `reviews` = πόσα στοιχεία
     της κατέχει · `due` = το ΝΩΡΙΤΕΡΟ ραντεβού των στοιχείων της.
     ⛔ Λέξη που δεν αγγίχτηκε ΠΟΤΕ μένει `learnedAt:0, due:0` — αλλιώς το
     School Studies θα του χρωστούσε 16 λέξεις που δεν είδε ποτέ. */
  function syncWords(){
    D.ALL.forEach(function(c){
      var seen = 0, own = 0, first = 0, soon = 0, last = 0;
      c.groups.forEach(function(g){
        g.items.forEach(function(_, i){
          var r = state.els[key(c, g, i)];
          if (!r || !(+r.last)) return;
          seen++;
          if ((+r.box || 0) >= 1) own++;
          if (!first || +r.last < first) first = +r.last;
          if (+r.last > last) last = +r.last;
          if (!soon || (+r.due || 0) < soon) soon = +r.due || 0;
        });
      });
      if (!seen){ delete state.words[c.id]; return; }
      var w = state.words[c.id] || (state.words[c.id] = {});
      w.learnedAt = first; w.reviews = own; w.due = soon; w.last = last;
      w.best = D.countItems(c) ? own / D.countItems(c) : 0;
      w.runs = seen;
    });
  }

  /* ── ο κόσμος ─────────────────────────────────────────────────── */
  var SET = D.SETS[D.SETS.length - 1];
  function cards(){ return SET.cards; }
  function totalItems(){ return D.setItems(SET); }
  function ownedItems(){
    var n = 0;
    cards().forEach(function(c){ c.groups.forEach(function(g){
      g.items.forEach(function(_, i){ if (have(key(c, g, i))) n++; });
    }); });
    return n;
  }

  /* ══════════════════════════════════════════════════════════════════
     ΤΙ ΡΩΤΑΕΙ, ΚΑΙ ΜΕ ΠΟΙΑ ΣΕΙΡΑ

     ⭐ ΔΕΝ ΣΕ ΞΑΝΑΡΩΤΑΕΙ ΠΟΤΕ Ο,ΤΙ ΕΧΕΙΣ. Στη δεύτερη βραδιά δεν ξαναγράφει
     τρεις λέξεις για να φτάσει στην τέταρτη. Η ουρά είναι όσα ΔΕΝ κατέχει,
     συν όσα έληξαν.

     ⭐ ΠΛΑΤΟΣ ΠΡΙΝ ΒΑΘΟΣ, ΜΕ ΕΝΑΛΛΑΓΗ. Παίρνει ΕΝΑ στοιχείο από κάθε λέξη
     πριν γυρίσει για δεύτερο. Δεν είναι κανόνας που πρέπει να περάσει —
     είναι απλώς η σειρά, γιατί εκεί είναι πυκνότερη η αξία: μετά από 16
     ερωτήσεις έχει ακουμπήσει ΚΑΘΕ λέξη της σελίδας.
     ══════════════════════════════════════════════════════════════════ */
  var ROUND = 24;

  function queue(){
    var now = Date.now(), byCard = [], out = [];
    cards().forEach(function(c){
      var mine = [];
      c.groups.forEach(function(g){
        g.items.forEach(function(item, i){
          var k = key(c, g, i), r = state.els[k];
          if (!r || !(+r.box)) { mine.push({ c:c, g:g, i:i, k:k, item:item, due:0 }); return; }
          if ((+r.due || 0) <= now) mine.push({ c:c, g:g, i:i, k:k, item:item, due:+r.due || 0 });
        });
      });
      if (mine.length) byCard.push(mine);
    });
    /* εναλλαγή: ένα από κάθε λέξη, γύρο-γύρο */
    for (var depth = 0; ; depth++){
      var any = false;
      for (var j = 0; j < byCard.length; j++)
        if (byCard[j][depth]){ out.push(byCard[j][depth]); any = true; }
      if (!any) break;
    }
    return out;
  }

  /* ══════════════════════════════════════════════════════════════════
     Η ΕΞΑΣΚΗΣΗ
     ══════════════════════════════════════════════════════════════════ */
  function start(){
    var q = queue();
    if (!q.length){ toast('Τίποτα δεν σε περιμένει αυτή τη στιγμή.'); return; }
    sess = { q:q.slice(0, ROUND), i:0, t0:Date.now(), asked:0, right:0, logged:false, shown:false, cue:0 };
    fresh = {};
    $('drill').classList.add('on');
    $('drill').setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
    ask();
  }

  function ask(){
    var q = sess.q[sess.i], c = q.c, g = q.g, mine = [], i;
    sess.shown = false; sess.cue = 0;
    $('dN').textContent = (sess.i + 1) + ' / ' + sess.q.length;
    $('dProg').style.width = (sess.i / sess.q.length * 100) + '%';
    $('drill').querySelector('.d-body').scrollTop = 0;

    /* ⚠️ ΔΕΙΧΝΕΙ ΜΟΝΟ Ο,ΤΙ ΕΙΝΑΙ ΚΛΕΙΔΩΜΕΝΟ. Ένα στοιχείο που ήρθε για
       επανάληψη είναι κατεχόμενο ΚΑΙ ζητούμενο — αν έμπαινε στο «έχεις ήδη»,
       η σελίδα θα του τύπωνε την απάντηση ακριβώς πάνω από το κουτί. */
    for (i = 0; i < g.items.length; i++){
      var kk = key(c, g, i);
      if (have(kk) && !live(kk)) mine.push(g.items[i].w);
    }

    $('dIn').innerHTML =
      '<div class="d-ask">' + esc(g.id === 'ant' ? 'Αντώνυμο' : 'Συνώνυμο') + '</div>' +
      '<div class="d-q">' + esc(c.q) + '</div>' +
      (mine.length
        ? '<div class="d-has">έχεις ήδη · <b>' + esc(mine.join(' · ')) + '</b></div>'
        : '') +
      '<input class="d-ta" id="dTa" type="text" autocapitalize="off" autocorrect="off" ' +
        'autocomplete="off" spellcheck="false" enterkeyhint="done">' +
      '<button class="d-cue" id="dCue" type="button">' + esc(E.cue(q.item.w, 0)) + '</button>' +
      '<div class="d-ans" id="dAns"></div>';

    $('dBtn').textContent = 'Έλεγχος';
    /* ⭐ ΤΟ ΝΗΜΑ ΜΑΖΕΥΕΤΑΙ, ΔΕΝ ΔΙΝΕΙ ΤΗ ΛΕΞΗ. Ένα κουμπί που συμπληρώνει την
       απάντηση δεν είναι βοήθεια, είναι αντιγραφή. Και ό,τι απαντηθεί ΜΕ
       νήμα δεν ανάβει — δεν τιμωρεί, κρατάει τον μετρητή να λέει αλήθεια. */
    $('dCue').addEventListener('click', function(){
      sess.cue = Math.min(sess.cue + 2, Math.max(0, q.item.w.length - 1));
      this.textContent = E.cue(q.item.w, sess.cue);
    });
    $('dTa').addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); go(); }
    });
    if (window.innerWidth >= 520) try { $('dTa').focus(); } catch(e){}
  }

  function go(){
    if (sess.shown){ next(); return; }
    var q = sess.q[sess.i], c = q.c, g = q.g, typed = $('dTa').value, i, k, hit = -1, dupe = -1, st = '';

    /* ⭐ ΔΕΧΕΤΑΙ ΟΠΟΙΟΔΗΠΟΤΕ ΣΤΟΙΧΕΙΟ ΤΗΣ ΣΤΗΛΗΣ ΠΟΥ ΔΕΝ ΕΧΕΙ ΑΚΟΜΗ, όχι μόνο
       αυτό που έτυχε να προγραμματιστεί. Ρώτησα «δώσε ένα συνώνυμο» — θα ήταν
       ψέμα να πω «λάθος» σε συνώνυμο του βιβλίου επειδή σκόπευα άλλο. */
    for (i = 0; i < g.items.length && hit < 0; i++){
      var r = E.gradeGroup(typed, [g.items[i]]).rows[0];
      if (r.status === 'missed') continue;
      if (!live(key(c, g, i))) { if (dupe < 0) dupe = i; continue; }
      hit = i; st = r.status;
    }
    /* Αν έπιασε ΠΟΛΛΑ, κερδίζει το προγραμματισμένο — αυτό είναι που έληξε. */
    if (hit >= 0 && hit !== q.i && live(key(c, g, q.i)) &&
        E.gradeGroup(typed, [g.items[q.i]]).rows[0].status !== 'missed'){
      st = E.gradeGroup(typed, [g.items[q.i]]).rows[0].status;
      hit = q.i;
    }

    /* ⭐⭐ ΣΩΣΤΗ ΛΕΞΗ, ΛΑΘΟΣ ΣΤΗΛΗ — Η ΚΑΛΥΤΕΡΗ ΑΝΑΤΡΟΦΟΔΟΤΗΣΗ ΠΟΥ ΥΠΑΡΧΕΙ ΕΔΩ.
       Αν του ζητήθηκε συνώνυμο και έγραψε αντώνυμο ΤΗΣ ΙΔΙΑΣ λέξης, δεν είναι
       άγνωστη λέξη: είναι ακριβώς η σύγχυση που θα του κοστίσει στο χαρτί, και
       πουθενά αλλού δεν φαίνεται. Δεν μετράει σωστό, δεν μετράει λάθος —
       ξαναρωτάει, αφού πρώτα του πει τι έκανε. */
    if (hit < 0){
      var other = null;
      c.groups.forEach(function(og){
        if (other || og.id === g.id) return;
        og.items.forEach(function(oi){
          if (other) return;
          var rr = E.gradeGroup(typed, [oi]).rows[0];
          if (rr.status !== 'missed') other = { w:oi.w, label:og.label.toLowerCase() };
        });
      });
      if (other){
        $('dAns').innerHTML = '<div class="d-why">Το <b>' + esc(other.w) + '</b> είναι ' +
          esc(other.label.replace(/α$/, 'ο')) + ' του «' + esc(c.q) + '», όχι ' +
          esc(g.id === 'ant' ? 'αντώνυμο' : 'συνώνυμο') + '. Δοκίμασε ξανά.</div>';
        $('dTa').value = ''; try { $('dTa').focus(); } catch(e){}
        return;
      }
    }

    /* Το ξαναγράψιμο ενός που ΗΔΗ έχει δεν είναι λάθος και δεν προχωράει. */
    if (hit < 0 && dupe >= 0){
      $('dAns').innerHTML = '<div class="d-why">Το <b>' + esc(g.items[dupe].w) +
        '</b> το έχεις ήδη. Δώσε ένα άλλο.</div>';
      $('dTa').value = ''; try { $('dTa').focus(); } catch(e){}
      return;
    }

    sess.shown = true;
    sess.asked++;
    var how = hit < 0 ? 'miss' : (sess.cue ? 'cued' : 'got');
    k = key(c, g, hit >= 0 ? hit : q.i);
    bump(k, how);
    if (how === 'got'){ sess.right++; fresh[k] = 1; }
    save();

    var word = g.items[hit >= 0 ? hit : q.i].w;
    $('dTa').setAttribute('readonly','readonly');
    $('dIn').querySelector('#dCue').style.display = 'none';
    $('dAns').innerHTML =
      '<div class="d-verdict ' + (hit >= 0 ? 'yes' : 'no') + '">' +
        (hit >= 0 ? (sess.cue ? 'Με το νήμα' : 'Δικό σου') : 'Δεν το είχες') + '</div>' +
      '<div class="d-word">' + esc(word) + '</div>' +
      (st === 'spell' ? '<div class="d-why">Γράφεται <b>' + esc(word) + '</b> — η ορθογραφία μετράει στο χαρτί.</div>' :
       st === 'form'  ? '<div class="d-why">Η κατάληξη: <b>' + esc(word) + '</b>.</div>' : '') +
      '<div class="d-root">' + esc(c.note) + '</div>';
    $('dBtn').textContent = sess.i + 1 >= sess.q.length ? 'Τέλος' : 'Επόμενο';
  }

  function next(){
    sess.i++;
    if (sess.i >= sess.q.length){ finish(); return; }
    ask();
  }

  function finish(){
    log(1); save();
    var got = sess.right, left = queue().length;
    $('dProg').style.width = '100%';
    $('dN').textContent = '';
    $('dIn').innerHTML =
      '<div class="d-ask">Ο γύρος τελείωσε</div>' +
      '<div class="d-q">' + got + (got === 1 ? ' καινούρια' : ' καινούριες') + '</div>' +
      '<div class="d-has">' + (left
        ? 'Μένουν ' + left + ' στη σελίδα. Μπορείς να συνεχίσεις ή να σταματήσεις εδώ.'
        : 'Τίποτα άλλο δεν σε περιμένει σήμερα.') + '</div>';
    $('dBtn').textContent = left ? 'Άλλος ένας γύρος' : 'Δες τη σελίδα';
    $('dBtn').onclick = function(){ close(); if (left) start(); };
  }

  /* ⚠️ ΤΟ ΣΥΜΒΟΛΑΙΟ ΤΟΥ ladders.js, ΑΥΤΟΛΕΞΕΙ. Το `fin` (τελείωσε ή το
     παράτησε) είναι το μόνο πεδίο που δεν καταγράφει κανείς άλλος. */
  function log(finished){
    if (!sess || sess.logged || !sess.asked) return;
    sess.logged = true;
    if (!Array.isArray(state.sessions)) state.sessions = [];
    var unit = sess.q[0].c.id, i;
    for (i = 1; i < sess.i + 1 && i < sess.q.length; i++) if (sess.q[i].c.id !== unit){ unit = ''; break; }
    state.sessions.push({
      id: 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      ts: sess.t0,
      ms: Math.max(0, Date.now() - sess.t0),
      unit: unit,
      mode: 'recall',
      asked: sess.asked,
      right: sess.right,
      pass: (finished && sess.asked && sess.right === sess.asked) ? 1 : 0,
      fin: finished ? 1 : 0
    });
  }

  function close(){
    if (sess && !sess.logged){ log(0); save(); }
    sess = null;
    /* ⚠️ Η ΟΘΟΝΗ ΤΕΛΟΥΣ ΑΛΛΑΖΕΙ ΤΟ ΚΟΥΜΠΙ. Αν κλείσει από το ✕ ΕΝΩ είναι
       εκεί, ο επόμενος γύρος ξεκινούσε με κολλημένο handler και το «Έλεγχος»
       έκλεινε τη σελίδα. Η επαναφορά ζει ΕΔΩ, στο ένα σημείο απ' όπου
       περνάνε ΟΛΟΙ οι δρόμοι εξόδου. */
    $('dBtn').onclick = go;
    $('drill').classList.remove('on');
    $('drill').setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
    render();
  }

  /* ══════════════════════════════════════════════════════════════════
     Η ΣΕΛΙΔΑ
     ══════════════════════════════════════════════════════════════════ */
  function render(){
    var total = totalItems(), own = ownedItems(), waiting = queue().length, h = '';

    $('ekN').textContent = own;
    $('ekOf').textContent = own === 1 ? 'λέξη δική σου, από ' + total : 'λέξεις δικές σου, από ' + total;
    $('ekBar').style.width = total ? (own / total * 100) + '%' : '0';
    $('ekSrc').textContent = SET.label + ' · ' + SET.range;

    if (waiting){
      $('ekCtaT').textContent = own ? 'Συνέχισε' : 'Ξεκίνα';
      $('ekCtaS').textContent = waiting + (waiting === 1 ? ' λέξη σε περιμένει' : ' λέξεις σε περιμένουν') +
        ' · γύρος ' + Math.min(waiting, ROUND);
      $('ekCta').disabled = false;
    } else {
      $('ekCtaT').textContent = 'Καθαρά';
      $('ekCtaS').textContent = nextLine();
      $('ekCta').disabled = true;
    }

    cards().forEach(function(c){
      var all = D.countItems(c), mine = 0, body = '';
      c.groups.forEach(function(g){
        body += '<div class="row"><span class="lab">' + esc(g.short) + '</span><span class="ws">';
        g.items.forEach(function(item, i){
          var k = key(c, g, i), on = have(k);
          if (on) mine++;
          body += (i ? '<span class="sep"> · </span>' : '') +
                  '<span class="w' + (on ? ' on' : '') + (fresh[k] ? ' fresh' : '') + '">' + esc(item.w) + '</span>';
        });
        body += '</span></div>';
      });
      h += '<article class="ent' + (all && mine === all ? ' full' : '') + '">' +
           '<h2>' + esc(c.q) + '</h2>' + body +
           '<div class="root">' + esc(c.note) + '</div></article>';
    });
    $('ekEntries').innerHTML = h;

    /* ⭐ Η ΣΤΙΓΜΗ ΤΗΣ ΕΠΙΣΤΡΟΦΗΣ: όσες μόλις κέρδισε μπαίνουν χρυσές και
       σβήνουν σε ιβουάρ. Καμία γιορτή, κανένα confetti — μια μεταβολή
       χρώματος 0.8s που λέει «αυτές είναι οι καινούριες σου». */
    if (Object.keys(fresh).length){
      setTimeout(function(){
        var els = $('ekEntries').querySelectorAll('.w.fresh'), i;
        for (i = 0; i < els.length; i++) els[i].classList.remove('fresh');
        fresh = {};
      }, 900);
    }

    $('ekFoot').textContent = footLine();
  }

  function nextLine(){
    var soon = 0;
    cards().forEach(function(c){ c.groups.forEach(function(g){
      g.items.forEach(function(_, i){
        var r = state.els[key(c, g, i)];
        if (r && +r.due && (!soon || +r.due < soon)) soon = +r.due;
      });
    }); });
    if (!soon) return 'Δεν έχεις ξεκινήσει ακόμα.';
    var d = Math.round((soon - Date.now()) / DAY);
    return d <= 0 ? 'Έτοιμο τώρα.' : d === 1 ? 'Οι επόμενες αύριο.' : 'Οι επόμενες σε ' + d + ' μέρες.';
  }

  function footLine(){
    var s = state.sessions || [], ms = 0, i;
    for (i = 0; i < s.length; i++) ms += (+s[i].ms || 0);
    if (!s.length) return SET.src + '.';
    return SET.src + ' · ' + s.length + (s.length === 1 ? ' γύρος' : ' γύροι') +
           ', ' + Math.round(ms / 60000) + ' λεπτά.';
  }

  /* ── εκκίνηση ───────────────────────────────────────────────────── */
  $('ekCta').addEventListener('click', start);
  $('dX').addEventListener('click', close);
  $('dBtn').onclick = go;

  reload();
  render();

  /* ── cloud sync ───────────────────────────────────────────────────
     ⚠️⚠️ ΤΟ ΣΥΜΒΟΛΑΙΟ ΕΙΝΑΙ `initCloudSync({appKey, syncedKeys, onApplied})`.
     Το sync.js ΔΕΝ στέλνει event στο window — μια πρώτη γραφή αυτής της
     σελίδας άκουγε ένα ανύπαρκτο 'als-sync' και ΔΕΝ θα είχε σκάσει ποτέ.
     Αντιγράφεται αυτολεξεί από το tonos.html. */
  (function initEkthesiSync(){
    var tries = 0;
    (function wait(){
      if (typeof initCloudSync !== 'function' || !window.supabase){ if (tries++ < 40) setTimeout(wait, 200); return; }
      initCloudSync({
        appKey:'ekthesi',
        syncedKeys:[KEY],
        onApplied:function(){
          /* Ξαναδιάβασε ΠΡΙΝ γράψει οτιδήποτε, αλλιώς εισερχόμενη συγχώνευση
             χάνεται από παλιό αντίγραφο στη μνήμη. ⚠️ ΠΟΤΕ μέσα σε γύρο. */
          reload();
          if (!sess){ try{ render(); }catch(e){} }
        }
      });
    })();
  })();
})();
</script>
</body>
</html>
